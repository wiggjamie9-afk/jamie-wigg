<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>RHYTHMIX — Coming soon</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #08050d;
        font-family: "Space Grotesk", system-ui, -apple-system, sans-serif;
        color: #ffffff;
        -webkit-font-smoothing: antialiased;
      }

      .poster {
        position: relative;
        width: 1080px;
        height: 1920px;
        background: #08050d;
        overflow: hidden;
      }

      /* Soft dreamy atmosphere — bigger, softer pools of colour than the video */
      .bg-pools {
        position: absolute; inset: 0;
        background:
          radial-gradient(900px 1100px at 22% 18%, rgba(224, 192, 255, 0.32), transparent 65%),
          radial-gradient(820px 1000px at 82% 38%, rgba(255, 122, 166, 0.22), transparent 68%),
          radial-gradient(1100px 900px at 50% 92%, rgba(138, 246, 255, 0.18), transparent 70%);
        filter: blur(0.5px);
        pointer-events: none;
      }

      /* Faint architectural grid — kept very low contrast for the "dreamy" register */
      .bg-grid {
        position: absolute; inset: 0;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
        background-size: 90px 90px;
        mask-image: radial-gradient(ellipse 90% 80% at 50% 50%, #000 40%, transparent 90%);
        -webkit-mask-image: radial-gradient(ellipse 90% 80% at 50% 50%, #000 40%, transparent 90%);
        pointer-events: none;
      }

      /* Subtle film grain via tiny dot pattern */
      .bg-grain {
        position: absolute; inset: 0;
        background-image: radial-gradient(rgba(255,255,255,0.04) 1px, transparent 1px);
        background-size: 3px 3px;
        opacity: 0.45;
        mix-blend-mode: overlay;
        pointer-events: none;
      }

      /* Vignette to push attention inward at thumbnail size */
      .bg-vignette {
        position: absolute; inset: 0;
        background: radial-gradient(ellipse 70% 60% at 50% 45%, transparent 55%, rgba(8, 5, 13, 0.85) 100%);
        pointer-events: none;
      }

      .frame {
        position: absolute;
        inset: 80px;
        border: 1px solid rgba(255, 255, 255, 0.06);
        border-radius: 4px;
        pointer-events: none;
      }

      .content {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 180px 110px 160px;
      }

      /* Top eyebrow — coming soon badge */
      .top {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 38px;
      }

      .badge {
        display: inline-flex; align-items: center; gap: 14px;
        padding: 16px 30px;
        border: 1px solid rgba(255, 122, 166, 0.45);
        background: rgba(255, 122, 166, 0.10);
        border-radius: 999px;
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 24px;
        letter-spacing: 6px;
        color: #ffd9e8;
        text-transform: uppercase;
      }
      .badge .dot {
        width: 10px; height: 10px; border-radius: 50%;
        background: #ff7aa6;
        box-shadow: 0 0 22px #ff7aa6;
      }

      .wordmark-top {
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 28px;
        letter-spacing: 16px;
        color: rgba(255, 255, 255, 0.55);
        text-transform: uppercase;
      }

      /* Headline — the poetic centre */
      .center {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 60px;
      }

      .headline {
        font-weight: 300;
        font-size: 132px;
        line-height: 1.04;
        letter-spacing: -4px;
        color: rgba(255, 255, 255, 0.94);
      }
      .headline .soft {
        font-weight: 200;
        color: rgba(255, 255, 255, 0.72);
      }
      .headline em {
        font-style: normal;
        font-weight: 500;
        background: linear-gradient(135deg, #ff7aa6 0%, #e0c0ff 50%, #8af6ff 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        color: transparent;
      }
      .headline .period {
        color: #ff7aa6;
        font-weight: 400;
      }

      .hair {
        width: 120px;
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(224, 192, 255, 0.55), transparent);
      }

      /* Big wordmark */
      .wordmark {
        font-weight: 700;
        font-size: 168px;
        line-height: 0.9;
        letter-spacing: -7px;
        background: linear-gradient(135deg, #ff7aa6 0%, #e0c0ff 50%, #8af6ff 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        color: transparent;
      }

      /* Bottom block */
      .bottom {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 36px;
      }

      .subhead {
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 28px;
        letter-spacing: 5px;
        color: rgba(255, 255, 255, 0.82);
        text-transform: uppercase;
        text-align: center;
        line-height: 1.55;
      }
      .subhead .sep {
        color: rgba(224, 192, 255, 0.55);
        margin: 0 16px;
      }
      .subhead .price {
        color: #6effc0;
      }

      .url {
        margin-top: 8px;
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 32px;
        letter-spacing: 4px;
        color: #ffffff;
        text-transform: lowercase;
        padding: 18px 38px;
        border: 1px solid rgba(255, 255, 255, 0.22);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.04);
        backdrop-filter: blur(8px);
      }
      .url .accent {
        background: linear-gradient(135deg, #ff7aa6, #e0c0ff 60%, #8af6ff);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        color: transparent;
      }
    </style>
  </head>
  <body>
    <div class="poster">
      <div class="bg-pools"></div>
      <div class="bg-grid"></div>
      <div class="bg-grain"></div>
      <div class="bg-vignette"></div>
      <div class="frame"></div>

      <div class="content">
        <div class="top">
          <div class="badge"><span class="dot"></span>Coming soon</div>
          <div class="wordmark-top">RHYTHMIX</div>
        </div>

        <div class="center">
          <div class="headline">
            <span class="soft">What if</span><br/>
            you could make<br/>
            <em>music</em><span class="period">.</span>
          </div>
          <div class="hair"></div>
          <div class="wordmark">RHYTHMIX</div>
        </div>

        <div class="bottom">
          <div class="subhead">
            An AI music platform
            <br/>
            <span class="price">AU$149</span><span class="sep">·</span>Lifetime
          </div>
          <div class="url"><span class="accent">rhythmixapp</span>.com.au</div>
        </div>
      </div>
    </div>
  </body>
</html>
