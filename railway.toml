# railway.toml — Railway deployment config for the bot
# https://docs.railway.app/reference/config-as-code

[build]
builder = "NIXPACKS"
buildCommand = "npm ci && npm run build"

[deploy]
startCommand = "node dist/index.js --loop --interval=60"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

# Required env vars (set these in Railway -> Variables):
#   ANTHROPIC_API_KEY        -- console.anthropic.com
#   REDDIT_CLIENT_ID         -- reddit.com/prefs/apps
#   REDDIT_CLIENT_SECRET     -- same place
#   REDDIT_USERNAME
#   REDDIT_PASSWORD
#   REDDIT_USER_AGENT        -- "trendbot/0.1 by yourname"
#   REDDIT_TARGET_SUBREDDIT  -- "u_yourname" for your own profile (always safe)
#
# Optional:
#   TRENDBOT_REGION                    default "US"
#   TRENDBOT_MAX_POSTS_PER_RUN         default 1
#   TRENDBOT_MIN_MINUTES_BETWEEN_POSTS default 120
#   TRENDBOT_MODEL                     default "claude-sonnet-4-6"
#
# To run in dry-run mode on the server (drafts but doesn't post):
#   change startCommand above to:
#   "node dist/index.js --loop --dry-run --interval=60"
