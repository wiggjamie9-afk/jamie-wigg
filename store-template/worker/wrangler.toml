# Claude-proxy Worker — reusable backend for the "Pro" AI apps.
#
# Setup (post `wrangler login`):
#   1. cd store-template/worker && npm install
#   2. wrangler secret put ANTHROPIC_API_KEY      # paste your sk-ant-... key
#   3. (optional) wrangler secret put EXTRA_ALLOWED_ORIGINS   # comma-separated
#   4. wrangler deploy
#
# The deployed URL (e.g. https://claude-proxy.<account>.workers.dev) becomes
# CLAUDE_PROXY in the app's index.html. For a custom domain, uncomment the
# [[routes]] block and point DNS at the Worker.

name = "claude-proxy"
main = "src/index.ts"
compatibility_date = "2025-05-01"
workers_dev = true

# [[routes]]
# pattern = "claude-proxy.studio.starlightmix.com/v1/*"
# custom_domain = true

[observability]
enabled = true
