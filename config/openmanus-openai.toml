# OpenManus Configuration - OpenAI GPT
# For use with OpenManus agent framework
# https://github.com/FoundationAgents/OpenManus

[llm]
# OpenAI GPT-4o (Recommended)
api_type = "openai"
model = "gpt-4o"
base_url = "https://api.openai.com/v1"
api_key = "${OPENAI_API_KEY}"
max_tokens = 4096
temperature = 0.0

# Alternative: GPT-4 Turbo
# model = "gpt-4-turbo"
# max_tokens = 4096

# Alternative: GPT-4 Mini (Faster, cheaper)
# model = "gpt-4-mini"
# max_tokens = 2048

[llm.vision]
# Vision model for image understanding
api_type = "openai"
model = "gpt-4o"
base_url = "https://api.openai.com/v1"
api_key = "${OPENAI_API_KEY}"
max_tokens = 4096
temperature = 0.0

[browser]
# Browser configuration
headless = true
disable_security = false
extra_chromium_args = []

[browser.proxy]
# Optional proxy configuration
# server = "http://proxy-server:port"
# username = "proxy-username"
# password = "proxy-password"

# Notes:
# - Set OPENAI_API_KEY environment variable before running
# - GPT-4o is recommended for best performance with browser automation
# - GPT-4 Mini offers good balance of speed and cost
# - Requires active OpenAI subscription
