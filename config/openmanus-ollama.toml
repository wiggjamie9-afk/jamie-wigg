# OpenManus Configuration - Ollama (Local Models)
# For use with OpenManus agent framework with local Ollama
# https://github.com/FoundationAgents/OpenManus
# Ollama Setup: https://ollama.com

[llm]
# Ollama local model
api_type = "ollama"
model = "llama2"  # Change to your preferred model (llama3.2, mistral, neural-chat, etc.)
base_url = "http://localhost:11434/v1"
api_key = "ollama"  # Not used by Ollama, but required by pydantic
max_tokens = 4096
temperature = 0.0

# Recommended local models:
# - llama3.2:latest          (8B, balanced)
# - mistral:latest           (7B, fast, good quality)
# - neural-chat:latest       (7B, optimized for chat)
# - openchat:latest          (7B, efficient)
# - dolphin-mixtral:latest   (45B, very capable - needs 48GB+ VRAM)

[llm.vision]
# Vision model (Ollama has limited vision support)
api_type = "ollama"
model = "llava"  # Vision model
base_url = "http://localhost:11434/v1"
api_key = "ollama"
max_tokens = 2048
temperature = 0.0

[browser]
# Browser configuration
headless = true
disable_security = false
extra_chromium_args = []

[browser.proxy]
# Optional proxy configuration
# server = "http://proxy-server:port"

# Setup Instructions:
# 1. Install Ollama: https://ollama.com/download
# 2. Pull a model: ollama pull llama2
# 3. Start Ollama: ollama serve
# 4. Update 'model' above to match your desired model
#
# Notes:
# - Ollama runs completely locally (no API fees)
# - Requires significant GPU VRAM (8B model = ~8GB)
# - Slower than cloud APIs but private
# - Default localhost:11434 assumes local Ollama instance
# - For remote Ollama, update base_url to remote IP:port
