# OpenManus Configuration - Anthropic Claude
# For use with OpenManus agent framework
# https://github.com/FoundationAgents/OpenManus

[llm]
# Claude 3.7 Sonnet (Recommended for general use)
model = "claude-3-7-sonnet-20250219"
base_url = "https://api.anthropic.com/v1/"
api_key = "${ANTHROPIC_API_KEY}"  # Set via environment variable
max_tokens = 8192
temperature = 0.0

# Alternative: Claude 3.5 Sonnet (If using older API)
# model = "claude-3-5-sonnet-20241022"
# base_url = "https://api.anthropic.com/v1/"
# api_key = "${ANTHROPIC_API_KEY}"
# max_tokens = 8192
# temperature = 0.0

[llm.vision]
# Vision model (use same as main for consistency)
model = "claude-3-7-sonnet-20250219"
base_url = "https://api.anthropic.com/v1/"
api_key = "${ANTHROPIC_API_KEY}"
max_tokens = 8192
temperature = 0.0

[browser]
# Browser configuration
headless = true                    # Run browser in headless mode
disable_security = false           # Enable security features
extra_chromium_args = []
# chrome_instance_path = ""        # Path to Chrome binary (optional)
# wss_url = ""                     # WebSocket URL (optional)
# cdp_url = ""                     # Chrome DevTools Protocol URL (optional)

[browser.proxy]
# Optional proxy configuration
# server = "http://proxy-server:port"
# username = "proxy-username"
# password = "proxy-password"

# Notes:
# - Set ANTHROPIC_API_KEY environment variable before running
# - For local testing, set headless = false to see browser
# - Increase max_tokens for complex tasks requiring more reasoning
# - Lower temperature (0.0) for deterministic outputs, higher (1.0) for creativity
