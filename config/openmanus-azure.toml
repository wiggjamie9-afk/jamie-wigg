# OpenManus Configuration - Azure OpenAI
# For use with OpenManus agent framework with Azure OpenAI
# https://github.com/FoundationAgents/OpenManus

[llm]
# Azure OpenAI configuration
api_type = "azure"
model = "YOUR_DEPLOYMENT_NAME"  # Replace with your Azure deployment name
base_url = "https://YOUR_RESOURCE_NAME.openai.azure.com/openai/deployments/YOUR_DEPLOYMENT_NAME"
api_key = "${AZURE_OPENAI_API_KEY}"
api_version = "2024-08-01-preview"  # Update to latest API version if needed
max_tokens = 4096
temperature = 0.0

# Example values (replace with your actual Azure details):
# base_url = "https://mycompany.openai.azure.com/openai/deployments/gpt4deployment"
# model = "gpt4deployment"
# Your resource name: mycompany
# Your deployment name: gpt4deployment

[llm.vision]
# Azure OpenAI vision model
api_type = "azure"
model = "YOUR_VISION_DEPLOYMENT_NAME"
base_url = "https://YOUR_RESOURCE_NAME.openai.azure.com/openai/deployments/YOUR_VISION_DEPLOYMENT_NAME"
api_key = "${AZURE_OPENAI_API_KEY}"
api_version = "2024-08-01-preview"
max_tokens = 4096
temperature = 0.0

[browser]
# Browser configuration
headless = true
disable_security = false
extra_chromium_args = []

[browser.proxy]
# Optional proxy configuration for corporate networks
# server = "http://proxy-server:port"
# username = "proxy-username"
# password = "proxy-password"

# Azure Setup Instructions:
# 1. Create Azure OpenAI resource in Azure Portal
# 2. Deploy a model (e.g., gpt-4, gpt-35-turbo)
# 3. Get your resource name and deployment name
# 4. Set AZURE_OPENAI_API_KEY environment variable
# 5. Update configuration values above
#
# Finding your values:
# - Resource name: Visible in Azure Portal > Resource overview
# - Deployment name: Azure Portal > Deployments > Model deployments
# - API key: Azure Portal > Keys and Endpoint
# - API version: Check Azure docs for latest supported version
#
# Notes:
# - Azure OpenAI provides enterprise security and compliance
# - Pricing differs from standard OpenAI
# - Deployment names are typically lowercase
# - API version format: YYYY-MM-DD-preview
