<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #0d0800;
        font-family: "Playfair Display", "Georgia", serif;
        color: #fff;
      }

      /* ====== ROOT COMPOSITION ====== */
      #root {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
        background: #0d0800;
      }

      /* ====== SHARED BACKDROP ====== */
      .lounge-bg {
        position: absolute;
        inset: 0;
        background: #0d0800;
      }

      /* Warm ambient glow — center top */
      .ambient-glow {
        position: absolute;
        top: -100px;
        left: 50%;
        transform: translateX(-50%);
        width: 900px;
        height: 700px;
        background: radial-gradient(
          ellipse at 50% 40%,
          rgba(180, 110, 20, 0.12) 0%,
          rgba(120, 60, 5, 0.06) 45%,
          transparent 75%
        );
        pointer-events: none;
      }

      /* Velvet curtains */
      .curtain {
        position: absolute;
        top: 0;
        width: 340px;
        height: 1920px;
        background: linear-gradient(
          90deg,
          #2a000b 0%,
          #3d0010 40%,
          #4a0015 55%,
          #3d0010 70%,
          #2a000b 100%
        );
        z-index: 2;
      }
      .curtain-left {
        left: -60px;
        clip-path: polygon(0 0, 100% 0, 88% 100%, 0 100%);
        transform: translateX(0);
      }
      .curtain-right {
        right: -60px;
        clip-path: polygon(0 0, 100% 0, 100% 100%, 12% 100%);
        transform: translateX(0);
      }

      /* Curtain sheen */
      .curtain::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          180deg,
          rgba(255,180,100,0.07) 0%,
          transparent 30%,
          rgba(255,120,60,0.04) 70%,
          transparent 100%
        );
      }

      /* Spotlight — top-down oval */
      .spotlight {
        position: absolute;
        top: 200px;
        left: 50%;
        transform: translateX(-50%);
        width: 700px;
        height: 1100px;
        background: radial-gradient(
          ellipse 320px 600px at 50% 15%,
          rgba(255, 243, 208, 0.22) 0%,
          rgba(255, 220, 130, 0.08) 40%,
          transparent 70%
        );
        pointer-events: none;
      }

      /* Stage platform — small circle center-bottom */
      .stage-platform {
        position: absolute;
        bottom: 230px;
        left: 50%;
        transform: translateX(-50%);
        width: 380px;
        height: 80px;
        background: radial-gradient(
          ellipse at 50% 50%,
          #1a1208 0%,
          #0f0b04 60%,
          transparent 100%
        );
        border-radius: 50%;
      }

      /* Warm floor fog */
      .floor-fog {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 1080px;
        height: 320px;
        background: radial-gradient(
          ellipse 860px 180px at 50% 100%,
          rgba(200, 130, 30, 0.08) 0%,
          rgba(150, 80, 10, 0.04) 50%,
          transparent 75%
        );
        pointer-events: none;
      }

      /* Microphone stand silhouette */
      .mic-stand {
        position: absolute;
        bottom: 260px;
        left: 50%;
        transform: translateX(-50%);
        width: 4px;
        height: 280px;
        background: #222;
        z-index: 3;
      }
      .mic-stand::before {
        /* Mic capsule oval */
        content: "";
        position: absolute;
        top: -24px;
        left: 50%;
        transform: translateX(-50%);
        width: 28px;
        height: 36px;
        background: #1a1a1a;
        border-radius: 50%;
        border: 1px solid #333;
      }
      .mic-stand::after {
        /* Base */
        content: "";
        position: absolute;
        bottom: -8px;
        left: 50%;
        transform: translateX(-50%);
        width: 40px;
        height: 8px;
        background: #1c1c1c;
        border-radius: 4px;
      }

      /* ====== DUST MOTES (particles) ====== */
      .dust-container {
        position: absolute;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
        z-index: 1;
      }
      .dust {
        position: absolute;
        border-radius: 50%;
        opacity: 0;
      }

      /* ====== SCENES ====== */
      .scene {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }

      #scene1 { z-index: 5; opacity: 1; }
      #scene2 { z-index: 6; opacity: 0; }
      #scene3 { z-index: 7; opacity: 0; }
      #scene4 { z-index: 8; opacity: 0; }

      /* ====== TEXT STYLES ====== */
      #s1-welcome {
        font-family: "Playfair Display", "Georgia", serif;
        font-size: 42px;
        font-style: italic;
        letter-spacing: 4px;
        color: rgba(245, 192, 0, 0.65);
        text-align: center;
        margin-top: 540px;
        opacity: 0;
      }

      /* S2 */
      #s2-headline {
        font-family: "Playfair Display", "Georgia", serif;
        font-size: 90px;
        font-weight: 700;
        font-style: italic;
        line-height: 1.0;
        color: #f5c000;
        clip-path: inset(0 100% 0 0);
      }
      #s2-sub {
        font-family: "Playfair Display", "Georgia", serif;
        font-size: 45px;
        font-weight: 400;
        letter-spacing: 2px;
        color: #ffffff;
        clip-path: inset(0 100% 0 0);
      }
      .s2-content {
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        width: 100%;
        height: 100%;
        padding: 0 90px 500px 90px;
        gap: 32px;
        box-sizing: border-box;
      }

      /* S3 */
      #s3-brand {
        font-family: "Anton", "Impact", "Arial Black", sans-serif;
        font-size: 140px;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 10px;
        color: #ffffff;
        clip-path: inset(0 100% 0 0);
        line-height: 1;
      }
      #s3-tagline {
        font-family: "Playfair Display", "Georgia", serif;
        font-size: 26px;
        font-style: italic;
        letter-spacing: 4px;
        color: #4dd9e0;
        opacity: 0;
      }
      #s3-cta {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: #f5c000;
        color: #000;
        font-family: "Playfair Display", "Georgia", serif;
        font-size: 32px;
        font-weight: 700;
        letter-spacing: 3px;
        padding: 24px 64px;
        border-radius: 60px;
        align-self: flex-start;
        opacity: 0;
      }
      .s3-content {
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        width: 100%;
        height: 100%;
        padding: 0 90px 420px 90px;
        gap: 34px;
        box-sizing: border-box;
      }

      /* S4 final */
      #s4-brand {
        font-family: "Anton", "Impact", "Arial Black", sans-serif;
        font-size: 110px;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 12px;
        color: rgba(245, 192, 0, 0.9);
        text-align: center;
        margin-top: 680px;
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <!-- ROOT COMPOSITION -->
    <div
      id="root"
      data-composition-id="rhythmix-venue-jazz"
      data-start="0"
      data-duration="30"
      data-width="1080"
      data-height="1920"
    >
      <!-- AUDIO NARRATION -->
      <audio
        id="narration"
        class="clip"
        data-start="0"
        data-duration="11.4"
        data-track-index="0"
        src="narration.wav"
        data-volume="1"
      ></audio>

      <!-- ====== ALWAYS-ON LOUNGE LAYER ====== -->
      <div class="lounge-bg"></div>
      <div class="ambient-glow"></div>
      <div class="spotlight"></div>
      <div class="floor-fog"></div>
      <div class="stage-platform"></div>
      <div class="mic-stand"></div>

      <!-- Dust motes container -->
      <div class="dust-container" id="dust-container"></div>

      <!-- Curtains — on top of scene content for depth -->
      <div class="curtain curtain-left" id="curtain-left"></div>
      <div class="curtain curtain-right" id="curtain-right"></div>

      <!-- ====== SCENE 1 — Curtains part ====== -->
      <div id="scene1" class="scene">
        <div style="display:flex; flex-direction:column; justify-content:flex-end; width:100%; height:100%; padding:0 90px 700px 90px; box-sizing:border-box;">
          <div id="s1-welcome">a moment begins...</div>
        </div>
      </div>

      <!-- ====== SCENE 2 — Main copy ====== -->
      <div id="scene2" class="scene">
        <div class="s2-content">
          <div id="s2-headline">Soul in Every Note.</div>
          <div id="s2-sub">Your Music. Any Genre.</div>
        </div>
      </div>

      <!-- ====== SCENE 3 — Brand + CTA ====== -->
      <div id="scene3" class="scene">
        <div class="s3-content">
          <div id="s3-brand">RHYTHMIX</div>
          <div id="s3-tagline">Intimate. Timeless. Yours.</div>
          <div id="s3-cta">Own It Forever — $149</div>
        </div>
      </div>

      <!-- ====== SCENE 4 — Final warm fade ====== -->
      <div id="scene4" class="scene">
        <div id="s4-brand">RHYTHMIX</div>
      </div>
    </div>

    <script>
      // ====== MULBERRY32 SEEDED PRNG (seed=21) ======
      function mulberry32(a) {
        return function() {
          a |= 0; a = a + 0x6D2B79F5 | 0;
          var t = Math.imul(a ^ a >>> 15, 1 | a);
          t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
          return ((t ^ t >>> 14) >>> 0) / 4294967296;
        };
      }
      var rand = mulberry32(21);

      // ====== DUST MOTES ======
      var dustContainer = document.getElementById("dust-container");
      var dustColors = ["#f5c000", "#ffaa00", "#ffd060", "#f0a500"];
      var dustParticles = [];
      var DUST_COUNT = 20;

      for (var i = 0; i < DUST_COUNT; i++) {
        var d = document.createElement("div");
        d.className = "dust";
        var size = 3 + rand() * 5;
        d.style.width = size + "px";
        d.style.height = size + "px";
        d.style.background = dustColors[Math.floor(rand() * dustColors.length)];
        d.style.boxShadow = "0 0 4px 1px " + d.style.background;

        var startX = 200 + rand() * 680;
        var startY = 400 + rand() * 1100;
        d.style.left = startX + "px";
        d.style.top = startY + "px";

        dustContainer.appendChild(d);
        dustParticles.push({
          el: d,
          driftX: (rand() - 0.5) * 120,
          driftY: -(80 + rand() * 200),
          duration: 3.5 + rand() * 4.0,
          delay: rand() * 2.5
        });
      }

      // ====== TIMELINE ======
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      // === S1 (0–2s): Curtains part slightly ===
      tl.from("#s1-welcome", { opacity: 0, y: 20, duration: 0.7, ease: "power2.out" }, 0.3);

      // Curtains ease outward
      tl.to("#curtain-left", { x: -30, duration: 1.4, ease: "power1.inOut" }, 0.2);
      tl.to("#curtain-right", { x: 30, duration: 1.4, ease: "power1.inOut" }, 0.2);

      // Start dust motes floating slowly
      for (var j = 0; j < dustParticles.length; j++) {
        var dp = dustParticles[j];
        var totalDustTime = 27;
        var repeatCount = Math.floor(totalDustTime / dp.duration) - 1;
        tl.fromTo(dp.el,
          { x: 0, y: 0, opacity: 0 },
          {
            x: dp.driftX,
            y: dp.driftY,
            opacity: 0.65 + rand() * 0.25,
            duration: dp.duration,
            ease: "sine.inOut",
            repeat: repeatCount,
            yoyo: true
          },
          0.5 + dp.delay
        );
      }

      // === TRANSITION S1 → S2: Calm blur crossfade at t=2 ===
      tl.to("#scene1", { filter: "blur(18px)", scale: 1.04, duration: 0.7, ease: "power1.in" }, 1.5);
      tl.to("#scene1", { opacity: 0, duration: 0.4, ease: "power1.in" }, 1.9);
      tl.set("#scene1", { visibility: "hidden" }, 2.4);
      tl.fromTo("#scene2",
        { opacity: 0, filter: "blur(18px)", scale: 0.96 },
        { opacity: 1, filter: "blur(18px)", scale: 0.96, duration: 0.3, ease: "power1.inOut" },
        2.0
      );
      tl.to("#scene2", { filter: "blur(0px)", scale: 1, duration: 0.7, ease: "power1.out" }, 2.3);

      // === S2 (2–18s): Copy reveals ===
      // Headline clip-path wipe — gold/amber
      tl.to("#s2-headline", {
        clipPath: "inset(0 0% 0 0)",
        duration: 1.1,
        ease: "power3.out"
      }, 2.8);

      // Sub clip-path wipe — white
      tl.to("#s2-sub", {
        clipPath: "inset(0 0% 0 0)",
        duration: 0.8,
        ease: "expo.out"
      }, 3.7);

      // === TRANSITION S2 → S3: Calm blur crossfade at t=18 ===
      tl.to("#scene2", { filter: "blur(22px)", scale: 1.04, duration: 0.7, ease: "power1.in" }, 17.5);
      tl.to("#scene2", { opacity: 0, duration: 0.4, ease: "power1.in" }, 17.9);
      tl.set("#scene2", { visibility: "hidden" }, 18.4);
      tl.fromTo("#scene3",
        { opacity: 0, filter: "blur(22px)", scale: 0.97 },
        { opacity: 1, filter: "blur(22px)", scale: 0.97, duration: 0.3, ease: "power1.inOut" },
        18.0
      );
      tl.to("#scene3", { filter: "blur(0px)", scale: 1, duration: 0.7, ease: "power1.out" }, 18.3);

      // === S3 (18–28s): Brand + CTA ===
      // RHYTHMIX clip-path wipe
      tl.to("#s3-brand", {
        clipPath: "inset(0 0% 0 0)",
        duration: 1.1,
        ease: "power3.out"
      }, 18.8);

      // Tagline fade + drift up — cyan (fromTo avoids property overlap)
      tl.fromTo("#s3-tagline",
        { y: 30, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.7, ease: "power2.out" },
        19.7
      );

      // CTA pill — scale in from slight below (fromTo avoids property overlap)
      tl.fromTo("#s3-cta",
        { y: 24, scale: 0.92, opacity: 0 },
        { y: 0, scale: 1, opacity: 1, duration: 0.6, ease: "back.out(1.6)" },
        20.5
      );

      // Gentle pulse on CTA
      tl.to("#s3-cta", { scale: 1.03, duration: 0.4, ease: "sine.inOut", repeat: Math.floor(7 / 0.8) - 1, yoyo: true }, 21.2);

      // === TRANSITION S3 → S4: Warm fade to near-black at t=28 ===
      tl.to("#scene3", { opacity: 0, duration: 0.7, ease: "power2.inOut" }, 27.8);
      tl.set("#scene3", { visibility: "hidden" }, 28.6);
      tl.fromTo("#scene4",
        { opacity: 0 },
        { opacity: 1, duration: 0.7, ease: "power2.inOut" },
        27.8
      );

      // === S4 (28–30s): Final warm fade ===
      tl.to("#s4-brand", { opacity: 1, duration: 0.5, ease: "power2.out" }, 28.2);
      tl.to("#root", { opacity: 0, duration: 1.0, ease: "power2.in" }, 29.0);
      tl.set("#scene4", { visibility: "hidden" }, 30.0);

      window.__timelines["rhythmix-venue-jazz"] = tl;
    </script>
  </body>
</html>
