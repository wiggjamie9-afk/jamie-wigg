<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KAI - Character Design Sheet</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f8f7f5;
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            padding: 40px 20px;
            overflow-x: hidden;
        }

        .container {
            max-width: 1920px;
            margin: 0 auto;
            background: white;
            aspect-ratio: 16 / 9;
            display: flex;
            flex-direction: column;
            padding: 60px;
            box-shadow: 0 10px 60px rgba(0, 0, 0, 0.08);
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 48px;
            font-weight: 800;
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 50%, #FF69B4 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -1px;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 18px;
            color: #666;
            font-weight: 500;
        }

        .content {
            display: flex;
            gap: 60px;
            align-items: flex-start;
            flex: 1;
        }

        .main-character {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .main-character svg {
            width: 100%;
            height: 100%;
            max-width: 500px;
            filter: drop-shadow(0 20px 40px rgba(0, 0, 0, 0.1));
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }

        .variations {
            flex: 0.9;
            display: flex;
            flex-direction: column;
            gap: 40px;
        }

        .variation-section {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .variation-title {
            font-size: 16px;
            font-weight: 700;
            color: #333;
            text-transform: uppercase;
            letter-spacing: 2px;
            padding-bottom: 12px;
            border-bottom: 3px solid #FFD700;
        }

        .head-variations {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .head-variations svg {
            width: 100%;
            height: auto;
            filter: drop-shadow(0 8px 20px rgba(0, 0, 0, 0.08));
            transition: transform 0.3s ease;
        }

        .head-variations svg:hover {
            transform: scale(1.05);
        }

        .expressions {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .expression-item {
            background: linear-gradient(135deg, #FFF9E6 0%, #FFF0F5 100%);
            padding: 20px;
            border-radius: 16px;
            border: 2px solid rgba(255, 215, 0, 0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .expression-item svg {
            width: 100%;
            height: auto;
            max-width: 140px;
        }

        .expression-label {
            font-size: 13px;
            font-weight: 600;
            color: #555;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .action-poses {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .pose-item {
            background: linear-gradient(135deg, #E6F7FF 0%, #F0E6FF 100%);
            padding: 20px;
            border-radius: 16px;
            border: 2px solid rgba(100, 200, 255, 0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .pose-item svg {
            width: 100%;
            height: auto;
            max-width: 140px;
        }

        .pose-label {
            font-size: 13px;
            font-weight: 600;
            color: #555;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        @media (max-width: 1440px) {
            .container {
                padding: 40px;
                aspect-ratio: auto;
            }

            .header h1 {
                font-size: 36px;
            }

            .content {
                gap: 40px;
            }
        }

        @media (max-width: 1024px) {
            .container {
                flex-direction: column;
                padding: 30px;
            }

            .content {
                flex-direction: column;
                gap: 50px;
            }

            .variations {
                gap: 30px;
            }

            .head-variations {
                grid-template-columns: repeat(2, 1fr);
            }

            .expressions,
            .action-poses {
                grid-template-columns: 1fr;
            }
        }

        /* Brand color system */
        :root {
            --primary-yellow: #FFD700;
            --warm-gold: #FFA500;
            --warm-orange: #FF8C00;
            --light-coral: #FF6B8A;
            --warm-peach: #FDBF97;
            --skin-tone: #E8B8A0;
            --dark-brown: #8B4513;
            --accent-cyan: #00D8FF;
            --accent-pink: #FF1F5A;
        }

        /* Smooth animations */
        svg {
            overflow: visible;
        }

        .character-base {
            animation: subtleRotate 0.5s ease-out;
        }

        @keyframes subtleRotate {
            from {
                opacity: 0;
                transform: scale(0.95) rotateZ(-2deg);
            }
            to {
                opacity: 1;
                transform: scale(1) rotateZ(0deg);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>KAI</h1>
            <p>Younger Sibling • Pure Joy & Wonder</p>
        </div>

        <div class="content">
            <!-- MAIN CHARACTER -->

                    <rect x="103" y="200" width="12" height="55" rx="6" fill="#FFD700"/>

                    <!-- Shoes -->
                    <ellipse cx="91" cy="260" rx="10" ry="8" fill="#FF8C00"/>
                    <ellipse cx="109" cy="260" rx="10" ry="8" fill="#FF8C00"/>

                    <!-- Body -->
                    <path d="M 75 160 Q 65 140 70 100 L 130 100 Q 135 140 125 160 Q 115 175 100 175 Q 85 175 75 160 Z"

                    <!-- Chest accent stripe -->

                        <!-- Hand -->
                        <circle cx="-28" cy="-58" r="11" fill="#E8B8A0" stroke="#333" stroke-width="2"/>

                    <!-- Right arm raised -->
                    <g transform="translate(130, 115)">
                        <path d="M 0 0 Q 15 -20 25 -50"
                              stroke="#E8B8A0" stroke-width="14" stroke-linecap="round" fill="none"/>
                        <!-- Hand -->
                        <circle cx="28" cy="-58" r="11" fill="#E8B8A0" stroke="#333" stroke-width="2"/>
                    </g>

                    <!-- Neck -->
                    <rect x="92" y="85" width="16" height="15" fill="#E8B8A0"/>

                    <!-- Head -->
                    <circle cx="100" cy="60" r="45" fill="#E8B8A0" stroke="#333" stroke-width="2.5"/>

                    <!-- Hair -->

                          stroke="#D2691E" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.8"/>

                    <circle cx="78" cy="52" r="8" fill="#8B4513"/>
                    <circle cx="80" cy="50" r="4" fill="white"/>
                    <path d="M 70 62 Q 75 68 80 66" stroke="#333" stroke-width="1.5" fill="none" stroke-linecap="round"/>

                    <!-- Right eye -->
                    <circle cx="122" cy="52" r="12" fill="white" stroke="#333" stroke-width="2"/>
                    <circle cx="122" cy="52" r="8" fill="#8B4513"/>
                    <circle cx="124" cy="50" r="4" fill="white"/>
                    <path d="M 120 62 Q 125 68 130 66" stroke="#333" stroke-width="1.5" fill="none" stroke-linecap="round"/>

                    <!-- Eyebrows (happy) -->
                    <path d="M 68 40 Q 75 35 82 37" stroke="#333" stroke-width="2.5" fill="none" stroke-linecap="round"/>
                    <path d="M 118 40 Q 125 35 132 37" stroke="#333" stroke-width="2.5" fill="none" stroke-linecap="round"/>

                    <!-- Nose -->
                    <path d="M 100 55 L 98 68 M 100 55 L 102 68" stroke="#333" stroke-width="1.5" fill="none" stroke-linecap="round"/>

                    <!-- Big joyful smile -->

                    <!-- Blush -->
                    <circle cx="60" cy="65" r="8" fill="#FF6B8A" opacity="0.4"/>
                    <circle cx="140" cy="65" r="8" fill="#FF6B8A" opacity="0.4"/>

                    <!-- Celebration sparkles -->
                    <g opacity="0.8">
                        <circle cx="45" cy="40" r="3" fill="#FFD700"/>
                        <circle cx="30" cy="60" r="2.5" fill="#FFA500"/>
                        <circle cx="155" cy="35" r="3" fill="#FFD700"/>
                        <circle cx="170" cy="55" r="2.5" fill="#FFA500"/>
                    </g>
                </svg>
            </div>

            <!-- VARIATIONS PANELS -->
            <div class="variations">
                <!-- HEAD VARIATIONS -->

                    <div class="variation-title">Head Variations</div>

                                  fill="#8B4513" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
                            <!-- Curls decoration -->

                            <circle cx="92" cy="28" r="4" fill="#D2691E" opacity="0.6"/>
                            <circle cx="40" cy="10" r="3" fill="#8B4513" opacity="0.8"/>
                            <circle cx="80" cy="12" r="3" fill="#8B4513" opacity="0.8"/>
                            <!-- Eyes -->
                            <circle cx="45" cy="48" r="7" fill="white" stroke="#333" stroke-width="1.5"/>
                            <circle cx="45" cy="48" r="4" fill="#8B4513"/>
                            <circle cx="46" cy="47" r="2" fill="white"/>
                            <circle cx="75" cy="48" r="7" fill="white" stroke="#333" stroke-width="1.5"/>

                            <circle cx="76" cy="47" r="2" fill="white"/>
                            <!-- Smile -->

                        </svg>

                        <!-- Head 2: Short/Spiky -->
                        <svg viewBox="0 0 120 140" xmlns="http://www.w3.org/2000/svg">
                            <circle cx="60" cy="55" r="35" fill="#E8B8A0" stroke="#333" stroke-width="2"/>
                            <!-- Short spiky hair -->

                            <circle cx="75" cy="53" r="4" fill="#8B4513"/>
                            <circle cx="76" cy="52" r="2" fill="white"/>

                        </svg>

                        <!-- Head 3: Pigtails -->
                        <svg viewBox="0 0 120 140" xmlns="http://www.w3.org/2000/svg">
                            <circle cx="60" cy="55" r="35" fill="#E8B8A0" stroke="#333" stroke-width="2"/>

                            <!-- Left pigtail -->

                            <circle cx="24" cy="48" r="6" fill="#FFD700" stroke="#333" stroke-width="1.5"/>
                            <!-- Right pigtail -->
                            <circle cx="92" cy="52" r="10" fill="#8B4513" stroke="#333" stroke-width="2"/>
                            <circle cx="96" cy="48" r="6" fill="#FFD700" stroke="#333" stroke-width="1.5"/>
                            <!-- Eyes -->
                            <circle cx="45" cy="53" r="7" fill="white" stroke="#333" stroke-width="1.5"/>
                            <circle cx="45" cy="53" r="4" fill="#8B4513"/>
                            <circle cx="46" cy="52" r="2" fill="white"/>
                            <circle cx="75" cy="53" r="7" fill="white" stroke="#333" stroke-width="1.5"/>
                            <circle cx="75" cy="53" r="4" fill="#8B4513"/>
                            <circle cx="76" cy="52" r="2" fill="white"/>
                            <!-- Cheerful smile -->
                            <path d="M 50 65 Q 60 70 70 65" stroke="#333" stroke-width="2" fill="none" stroke-linecap="round"/>
                        </svg>
                    </div>
                </div>

                <!-- FACIAL EXPRESSIONS -->
                <div class="variation-section">
                    <div class="variation-title">Expressions</div>
                    <div class="expressions">
                        <!-- Joyful/Laughing -->
                        <div class="expression-item">
                            <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                                <circle cx="50" cy="45" r="32" fill="#E8B8A0" stroke="#333" stroke-width="2"/>
                                <path d="M 25 30 Q 30 20 35 25" fill="#8B4513"/>
                                <path d="M 65 30 Q 70 20 75 25" fill="#8B4513"/>
                                <!-- Huge laughing eyes -->
                                <circle cx="35" cy="42" r="8" fill="white" stroke="#333" stroke-width="1.5"/>
                                <circle cx="35" cy="42" r="5" fill="#8B4513"/>
                                <circle cx="36" cy="40" r="2" fill="white"/>
                                <circle cx="65" cy="42" r="8" fill="white" stroke="#333" stroke-width="1.5"/>
                                <circle cx="65" cy="42" r="5" fill="#8B4513"/>
                                <circle cx="66" cy="40" r="2" fill="white"/>
                                <!-- Eye crinkles (happy) -->
                                <path d="M 27 40 Q 32 44 35 40" stroke="#333" stroke-width="1" fill="none" stroke-linecap="round"/>
                                <path d="M 65 40 Q 68 44 73 40" stroke="#333" stroke-width="1" fill="none" stroke-linecap="round"/>
                                <!-- Huge open mouth laugh -->
                                <path d="M 40 58 Q 50 68 60 58" stroke="#333" stroke-width="2.5" fill="none" stroke-linecap="round"/>
                                <path d="M 42 60 Q 50 65 58 60" fill="#FF6B8A" opacity="0.3"/>
                                <!-- Blush (bigger) -->
                                <circle cx="22" cy="50" r="6" fill="#FF6B8A" opacity="0.5"/>
                                <circle cx="78" cy="50" r="6" fill="#FF6B8A" opacity="0.5"/>

                        </div>

                        <!-- Curious/Wondering -->
                        <div class="expression-item">
                            <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                                <circle cx="50" cy="45" r="32" fill="#E8B8A0" stroke="#333" stroke-width="2"/>
                                <!-- Raised eyebrows -->

                                <path d="M 60 28 Q 65 22 72 26" stroke="#333" stroke-width="2" fill="none" stroke-linecap="round"/>
                                <!-- Wide wonder eyes -->
                                <circle cx="35" cy="42" r="8" fill="white" stroke="#333" stroke-width="1.5"/>
                                <circle cx="35" cy="42" r="5" fill="#8B4513"/>
                                <circle cx="36" cy="40" r="2.5" fill="white"/>
                                <circle cx="65" cy="42" r="8" fill="white" stroke="#333" stroke-width="1.5"/>
                                <circle cx="65" cy="42" r="5" fill="#8B4513"/>
                                <circle cx="66" cy="40" r="2.5" fill="white"/>
                                <!-- O mouth (wonder) -->
                                <circle cx="50" cy="60" r="5" fill="none" stroke="#333" stroke-width="2"/>
                                <!-- Light blush -->
                                <circle cx="22" cy="48" r="5" fill="#FF6B8A" opacity="0.3"/>
                                <circle cx="78" cy="48" r="5" fill="#FF6B8A" opacity="0.3"/>
                            </svg>
                            <span class="expression-label">Curious/Wondering</span>

                        <!-- Playful/Silly -->

                                <circle cx="50" cy="45" r="32" fill="#E8B8A0" stroke="#333" stroke-width="2"/>
                                <!-- Playful eyebrows -->
                                <path d="M 28 30 Q 35 25 42 29" stroke="#333" stroke-width="2" fill="none" stroke-linecap="round"/>
                                <path d="M 58 29 Q 65 25 72 30" stroke="#333" stroke-width="2" fill="none" stroke-linecap="round"/>

                <!-- ACTION POSES -->

                                <!-- Huge smile -->

                        </div>

                        <!-- Running/Playing -->
                        <div class="pose-item">
                            <svg viewBox="0 0 100 140" xmlns="http://www.w3.org/2000/svg">
                                <!-- Shadow angled (running) -->
                                <ellipse cx="45" cy="130" rx="25" ry="5" fill="rgba(0,0,0,0.08)"/>
                                <!-- Body leaning forward -->
                                <path d="M 35 80 Q 32 65 35 50 L 58 48 Q 60 65 55 80 Z" fill="#FFD700" stroke="#333" stroke-width="1.5" transform="rotate(-8 45 65)"/>
