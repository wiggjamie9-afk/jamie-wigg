<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SURGE Character Gallery</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0a0e27;
      color: #fff;
      padding: 20px;
      margin: 0;
    }
    h1 {
      text-align: center;
      margin-bottom: 40px;
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .character-card {
      background: #1a1f3a;
      border-radius: 8px;
      padding: 16px;
      text-align: center;
    }
    .character-card h2 {
      margin-top: 0;
      margin-bottom: 10px;
      font-size: 20px;
    }
    .character-card img {
      width: 100%;
      max-width: 100%;
      border-radius: 4px;
      display: block;
    }
  </style>
</head>
<body>
  <h1>SURGE Character Gallery</h1>
  <div class="gallery">
    <div class="character-card">
      <h2>Ziggy</h2>
      <img src="data:image/png;base64,[PASTE_ZIGGY_BASE64_HERE]" alt="Ziggy">
    </div>
    <div class="character-card">
      <h2>Echo</h2>
      <img src="data:image/png;base64,[PASTE_ECHO_BASE64_HERE]" alt="Echo">
    </div>
    <div class="character-card">
      <h2>Mira</h2>
      <img src="data:image/png;base64,[PASTE_MIRA_BASE64_HERE]" alt="Mira">
    </div>
    <div class="character-card">
      <h2>Ms. Chen</h2>
      <img src="data:image/png;base64,[PASTE_MS_CHEN_BASE64_HERE]" alt="Ms. Chen">
    </div>
    <div class="character-card">
      <h2>Jordan</h2>
      <img src="data:image/png;base64,[PASTE_JORDAN_BASE64_HERE]" alt="Jordan">
    </div>
    <div class="character-card">
      <h2>Kai</h2>
      <img src="data:image/png;base64,[PASTE_KAI_BASE64_HERE]" alt="Kai">
    </div>
  </div>
</body>
</html>
