name: Book 1 Complete Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - claude/github-sunny-file-search-65awr
    paths:
      - "generate-book1-from-sunny-reference.py"
      - ".github/workflows/book1-complete-pipeline.yml"

jobs:
  book1-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: claude/github-sunny-file-search-65awr
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg ffprobe

      - name: Install Python dependencies
        run: |
          pip install requests pillow google-auth google-auth-oauthlib google-api-python-client elevenlabs

      - name: Step 1 - Generate 16 illustrated pages (reference-conditioned)
        id: generate-pages
        env:
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
        run: |
          python3 generate-book1-from-sunny-reference.py

      - name: Step 2 - Assemble 18-page book
        id: assemble-pages
        run: |
          python3 assemble-book1-pages.py

      - name: Step 3 - Generate narration
        id: generate-narration
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          python3 generate-book1-narration.py

      - name: Step 4 - Assemble video
        id: assemble-video
        run: |
          python3 assemble-book1-video.py

      - name: Step 5 - Upload to YouTube
        id: upload-youtube
        env:
          YOUTUBE_ACCESS_TOKEN: ${{ secrets.YOUTUBE_ACCESS_TOKEN }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        run: |
          python3 upload-book1-to-youtube.py

      - name: Commit results
        run: |
          git config user.email "sunny-bot@rhythmixapp.com.au"
          git config user.name "Sunny Bot"
          git add -A
          git commit -m "Book 1 complete: pages + narration + video + YouTube

- Generated 16 illustrated story pages (reference-conditioned from Concept 2)
- Created 18-page book (cover + 16 pages + teaser)
- Generated warm Rachel voice narration
- Assembled video with audio (1920x1080, H.264)
- Uploaded to YouTube: https://www.youtube.com/@SunnyBedtimeTales

Ready for Books 2-17!

https://claude.ai/code/session_016B7mS1Zne9k2ZZtnb59zyP" || echo "No changes to commit"
          git push origin claude/github-sunny-file-search-65awr

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: book1-complete
          path: |
            BOOK-1-ILLUSTRATED-PAGES/
            BOOK-1-ASSEMBLED/
            BOOK-1-NARRATION/
            BOOK-1-VIDEO/
          retention-days: 30

      - name: Summary
        run: |
          echo "## ✓ Book 1 Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Sunny's Cozy Quokka Bedtime Tales - Book 1: Sunny and the Flying Fox**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Completed Steps:" >> $GITHUB_STEP_SUMMARY
          echo "1. ✓ Generated 16 illustrated story pages (reference-conditioned)" >> $GITHUB_STEP_SUMMARY
          echo "2. ✓ Assembled 18-page book (cover + 16 pages + teaser)" >> $GITHUB_STEP_SUMMARY
          echo "3. ✓ Generated warm motherly voice narration (Rachel, ElevenLabs)" >> $GITHUB_STEP_SUMMARY
          echo "4. ✓ Created complete video with audio (H.264, 1920x1080)" >> $GITHUB_STEP_SUMMARY
          echo "5. ✓ Uploaded to YouTube" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Video Details:" >> $GITHUB_STEP_SUMMARY
          echo "- Channel: https://www.youtube.com/@SunnyBedtimeTales" >> $GITHUB_STEP_SUMMARY
          echo "- Runtime: ~8-10 minutes" >> $GITHUB_STEP_SUMMARY
          echo "- Format: 1920x1080 H.264" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps:" >> $GITHUB_STEP_SUMMARY
          echo "- [ ] Add custom thumbnail" >> $GITHUB_STEP_SUMMARY
          echo "- [ ] Add video to playlist" >> $GITHUB_STEP_SUMMARY
          echo "- [ ] Enable monetization" >> $GITHUB_STEP_SUMMARY
          echo "- [ ] Generate Books 2-17" >> $GITHUB_STEP_SUMMARY
