name: Validate YouTube token

on:
  push:
    branches: [claude/youtube-tv-research-fla0ts]
    paths: [kids-channel/.validate-token-trigger]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refresh-token check
        env:
          YT_REFRESH: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        run: |
          python3 - <<'EOF'
          import urllib.request as r, urllib.parse as p, json, os, sys

          rt  = os.environ['YT_REFRESH'].strip()
          cid = os.environ['YT_CLIENT_ID'].strip()
          cs  = os.environ['YT_CLIENT_SECRET'].strip()

          print(f"refresh_token : len={len(rt)}, first6={rt[:6]!r}")
          print(f"client_id     : len={len(cid)}, ...{cid[-30:]!r}")
          print(f"client_secret : len={len(cs)}, first7={cs[:7]!r}")

          body = p.urlencode({
              'client_id': cid, 'client_secret': cs,
              'refresh_token': rt, 'grant_type': 'refresh_token',
          }).encode()
          req = r.Request('https://oauth2.googleapis.com/token', data=body,
                          headers={'Content-Type': 'application/x-www-form-urlencoded'})
          try:
              with r.urlopen(req, timeout=30) as resp:
                  data = json.loads(resp.read())
              print(f"\n✅ TOKEN OK — got a fresh access_token (len={len(data.get('access_token',''))}, "
                    f"expires_in={data.get('expires_in')}s, scope={data.get('scope','?')})")
              print("Uploads will work. Ready to publish real episodes.")
          except r.HTTPError as e:
              try: err = json.loads(e.read())
              except Exception: err = {}
              print(f"\n❌ TOKEN FAILED: {err.get('error')}: {err.get('error_description')}")
              print("The tokens still aren't valid — re-check the OAuth Playground steps "
                    "(especially that Client ID + Secret match and the youtube.upload scope was granted).")
              sys.exit(1)
          EOF
