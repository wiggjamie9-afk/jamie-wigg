name: Book 1 — Redesigned Watercolour Edition

on:
  workflow_dispatch: {}
  push:
    # Test hook: pushing the trigger file on the rebuild branch regenerates
    # the book. Scoped to that branch only.
    branches: [claude/youtube-tv-research-fla0ts]
    paths: [kids-channel/.book1-redesign-trigger]

jobs:
  build-book:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: pip install requests python-dotenv Pillow

      - name: Download Quicksand fonts
        run: |
          mkdir -p /tmp/fonts
          UA="Mozilla/5.0 (Windows; U; Windows NT 5.1; en-US; rv:1.9.0.5) Gecko/2008120122 Firefox/3.0.5"
          CSS=$(curl -fsSL -H "User-Agent: $UA" "https://fonts.googleapis.com/css?family=Quicksand:400,500,700" || true)
          for SPEC in "400:Regular" "500:Medium" "700:Bold"; do
            WEIGHT="${SPEC%%:*}"; NAME="${SPEC##*:}"
            F="/tmp/fonts/Quicksand-${NAME}.ttf"
            URL=$(printf '%s' "$CSS" | grep -A2 "font-weight: ${WEIGHT};" | grep -o 'url([^)]*)' | head -1 | sed 's/url(//;s/)//')
            [ -n "$URL" ] && curl -fsSL "$URL" -o "$F" || echo "Quicksand ${NAME} download failed (non-fatal)"
          done

      - name: Generate redesigned book
        env:
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
        run: python generate-book1-redesign.py

      - name: Commit book + character reference
        run: |
          git config user.email "sunny-bot@rhythmixapp.com.au"
          git config user.name "Sunny Bot"
          git add book1/redesign/pages book1/redesign/*.pdf kids-channel/character/ 2>/dev/null || true
          git rm -r --cached book1/redesign/work 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "book1: regenerate redesigned watercolour edition"
            git pull --rebase origin ${{ github.ref_name }} || true
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "No changes to commit"
          fi

      - name: Upload book artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: book1-redesign
          path: |
            book1/redesign/pages/
            book1/redesign/*.pdf
          retention-days: 14
