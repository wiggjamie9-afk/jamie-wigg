name: Generate Buddy Portraits

# Manually triggered. Generates 50 photoreal buddy portraits via Higgsfield
# Soul and commits them to apps/portraits/. The carousel auto-upgrades each
# card to its photo once present.

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Regenerate all (overwrite existing portraits)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  portraits:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate portraits
        env:
          HIGGSFIELD_API_KEY: ${{ secrets.HIGGSFIELD_API_KEY }}
          HIGGSFIELD_SECRET: ${{ secrets.HIGGSFIELD_SECRET }}
          FORCE: ${{ inputs.force && '1' || '0' }}
        run: node scripts/generate-portraits.mjs

      - name: Commit portraits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/portraits/*.jpg || true
          if git diff --cached --quiet; then
            echo "No new portraits to commit."
          else
            git commit -m "Add generated buddy portraits (Higgsfield Soul)"
            git push
          fi
