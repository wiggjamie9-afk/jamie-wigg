name: Generate Channel Art

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install requests Pillow python-dotenv

      - name: Write .env
        run: |
          cat > .env <<EOF
          HIGGSFIELD_API_KEY=${{ secrets.HIGGSFIELD_API_KEY }}
          HIGGSFIELD_SECRET=${{ secrets.HIGGSFIELD_SECRET }}
          EOF

      - name: Generate channel art
        run: python3 kids-channel/generate_channel_art.py

      - name: Commit and push
        run: |
          git config user.email "sunny-bot@rhythmixapp.com.au"
          git config user.name "Sunny Bot"
          git add kids-channel/channel-art.png kids-channel/sunny-ai.png || true
          git diff --cached --quiet && echo "No changes to commit" || \
            (git commit -m "art: regenerate channel art with AI-painted Sunny" && git push origin main)
