name: Book read-aloud video (generic)

on:
  push:
    branches: [claude/youtube-tv-research-fla0ts]
    paths: [kids-channel/.book-readaloud-trigger]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install requests python-dotenv Pillow

      - name: Install Piper TTS (fallback voice)
        run: |
          PIPER_VER="2023.11.14-2"
          curl -fsSL "https://github.com/rhasspy/piper/releases/download/${PIPER_VER}/piper_linux_x86_64.tar.gz" | tar -xz -C /tmp/
          sudo mv /tmp/piper/piper /usr/local/bin/piper || echo "Piper install failed (non-fatal)"
          mkdir -p /tmp/piper-voices
          BASE="https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/lessac/medium"
          curl -fsSL "${BASE}/en_US-lessac-medium.onnx" -o /tmp/piper-voices/en_US-lessac-medium.onnx || true
          curl -fsSL "${BASE}/en_US-lessac-medium.onnx.json" -o /tmp/piper-voices/en_US-lessac-medium.onnx.json || true

      - name: Build read-aloud video
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          PIPER_VOICE_DIR: /tmp/piper-voices
        run: |
          SPEC=$(grep -oP '^spec=\K.+' kids-channel/.book-readaloud-trigger)
          echo "Building read-aloud for spec: $SPEC"
          python build_book_readaloud.py "$SPEC"

      - name: Commit video
        run: |
          git config user.email "sunny-bot@rhythmixapp.com.au"
          git config user.name "Sunny Bot"
          NUM=$(grep -oP '"num"\s*:\s*\K[0-9]+' $(grep -oP '^spec=\K.+' kids-channel/.book-readaloud-trigger))
          VID=$(ls book${NUM}/redesign/*-readaloud.mp4 2>/dev/null | head -1)
          SIZE=$(stat -c%s "$VID")
          if [ "$SIZE" -lt 94371840 ]; then
            git add "$VID"
            git commit -m "book${NUM}: read-aloud video"
            git pull --rebase origin ${{ github.ref_name }} || true
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "Video ${SIZE} bytes — artifact only"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: book-readaloud
          path: book*/redesign/*-readaloud.mp4
          retention-days: 14
