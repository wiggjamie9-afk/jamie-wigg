name: Book 1 — Read-aloud video

on:
  workflow_dispatch: {}
  push:
    branches: [claude/youtube-tv-research-fla0ts]
    paths: [kids-channel/.book1-readaloud-trigger]

jobs:
  build-readaloud:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install requests python-dotenv Pillow

      - name: Install Piper TTS (fallback voice)
        run: |
          PIPER_VER="2023.11.14-2"
          curl -fsSL "https://github.com/rhasspy/piper/releases/download/${PIPER_VER}/piper_linux_x86_64.tar.gz" | tar -xz -C /tmp/
          sudo mv /tmp/piper/piper /usr/local/bin/piper || echo "Piper install failed (non-fatal)"
          mkdir -p /tmp/piper-voices
          BASE="https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/lessac/medium"
          curl -fsSL "${BASE}/en_US-lessac-medium.onnx" -o /tmp/piper-voices/en_US-lessac-medium.onnx || true
          curl -fsSL "${BASE}/en_US-lessac-medium.onnx.json" -o /tmp/piper-voices/en_US-lessac-medium.onnx.json || true

      - name: Build read-aloud video
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          PIPER_VOICE_DIR: /tmp/piper-voices
        run: python generate-book1-readaloud.py

      - name: Commit video
        run: |
          git config user.email "sunny-bot@rhythmixapp.com.au"
          git config user.name "Sunny Bot"
          SIZE=$(stat -c%s "book1/redesign/sunny-and-the-flying-fox-readaloud.mp4")
          if [ "$SIZE" -lt 94371840 ]; then
            git add book1/redesign/sunny-and-the-flying-fox-readaloud.mp4
            git commit -m "book1: read-aloud video"
            git pull --rebase origin ${{ github.ref_name }} || true
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "Video ${SIZE} bytes — too large to commit, artifact only"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: book1-readaloud
          path: book1/redesign/sunny-and-the-flying-fox-readaloud.mp4
          retention-days: 14
