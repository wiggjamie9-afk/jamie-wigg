name: HumApp Swift Tests

on:
  push:
    paths:
      - 'hum-ios/**'
  pull_request:
    paths:
      - 'hum-ios/**'

jobs:
  test:
    name: swift test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        run: swift test
        working-directory: hum-ios
