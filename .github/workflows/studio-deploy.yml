# Deploy studio/ (Next.js 15 static export) to Cloudflare Pages.
#
# - Any branch push touching studio/** → preview deployment on Cloudflare
#   Pages at https://<branch>.rhythmix-studio.pages.dev
# - main branch → production deployment, GATED behind the `production`
#   GitHub Environment (manual reviewer approval). On approval, the build
#   is promoted and lives at studio.rhythmixapp.com.au.
#
# Satisfies: spec rhythmix-app / T2 / N1.
#
# Required GitHub secrets (configure under Settings → Secrets and variables
# → Actions, scoped to the repository):
#   - CLOUDFLARE_API_TOKEN   (token with Pages:Edit permission)
#   - CLOUDFLARE_ACCOUNT_ID  (the Cloudflare account hosting the project)
#
# Required GitHub environment:
#   - `production` — created under Settings → Environments, with at least
#     one Required reviewer set so the deploy waits for manual approval.
#
# Note: workflow_dispatch is included so the production deploy can be
# re-run from the Actions tab without a fresh push.

name: studio-deploy

on:
  push:
    branches:
      - "**"
    paths:
      - "studio/**"
      - ".github/workflows/studio-deploy.yml"
  workflow_dispatch:

# Cancel in-flight builds for the same branch — only the latest commit's
# deployment is meaningful.
concurrency:
  group: studio-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  # ---------------------------------------------------------------------
  # build — runs for every branch. Produces the static export at
  # studio/out/ which both the preview and production deploys consume.
  # ---------------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: studio/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static export
        run: pnpm build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: studio-out
          path: studio/out
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------
  # deploy-preview — every non-main branch push. Cloudflare Pages will
  # serve the result at https://<branch>.rhythmix-studio.pages.dev.
  # No approval gate; previews are cheap and disposable.
  # ---------------------------------------------------------------------
  deploy-preview:
    needs: build
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: studio-out
          path: studio/out

      - name: Deploy preview to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy studio/out --project-name=rhythmix-studio --branch=${{ github.ref_name }}

  # ---------------------------------------------------------------------
  # deploy-production — only on push to main. The `environment: production`
  # block is the manual-approval gate: the job waits in the "Waiting"
  # state until a reviewer listed on the `production` GitHub Environment
  # approves the deployment from the Actions UI.
  # ---------------------------------------------------------------------
  deploy-production:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://studio.rhythmixapp.com.au
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: studio-out
          path: studio/out

      - name: Deploy production to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy studio/out --project-name=rhythmix-studio --branch=main
