name: Deploy Studio to Cloudflare Pages

on:
  push:
    branches:
      - '**'
    paths:
      - 'studio/**'
  workflow_dispatch:

concurrency:
  group: studio-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: studio/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Studio imports files from repo-root sibling dirs (lib/, rhythmix-studio/)
      # whose bare imports (openai, @ffmpeg/*) resolve against the ROOT
      # node_modules, so the root package must be installed for the build.
      - name: Install root dependencies
        working-directory: .
        run: npm ci

      - name: Lint
        run: pnpm lint

      - name: Build static export
        run: pnpm build

      - uses: actions/upload-artifact@v4
        with:
          name: studio-out
          path: studio/out
          retention-days: 1

  deploy-preview:
    name: Deploy preview
    needs: build
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: studio-out
          path: studio/out

      - name: Deploy to Cloudflare Pages (preview)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy studio/out --project-name=starlightmix-studio --branch=${{ github.head_ref || github.ref_name }}

  deploy-production:
    name: Deploy production
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://studio.starlightmix.com
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: studio-out
          path: studio/out

      - name: Deploy to Cloudflare Pages (production)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy studio/out --project-name=starlightmix-studio --branch=main
