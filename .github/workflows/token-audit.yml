name: Monthly token audit

on:
  schedule:
    - cron: "23 21 1 * *" # 1st of month, ~7:23am AEST
  workflow_dispatch:

permissions:
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check per-session token overhead has not drifted
        id: audit
        run: |
          DRIFT=""
          # 1. CLAUDE.md must stay under 12KB
          size=$(wc -c < CLAUDE.md)
          echo "CLAUDE.md: ${size} bytes"
          [ "$size" -le 12288 ] || DRIFT="$DRIFT CLAUDE.md-grew-to-${size}B;"
          # 2. Skill count should stay near the pruned baseline (111)
          skills=$(ls .claude/skills | wc -l)
          echo "skills: $skills"
          [ "$skills" -le 140 ] || DRIFT="$DRIFT skills-regrew-to-${skills};"
          # 3. Agent roster should stay near the pruned baseline (43)
          agents=$(ls .claude/agents/*.md 2>/dev/null | wc -l)
          echo "agents: $agents"
          [ "$agents" -le 60 ] || DRIFT="$DRIFT agents-regrew-to-${agents};"
          # 4. Config files must be valid JSON
          for f in .mcp.json .claude/settings.json skills-lock.json; do
            python3 -c "import json; json.load(open('$f'))" || DRIFT="$DRIFT invalid-json:$f;"
          done
          # 5. No broken symlinks in skills
          broken=$(find .claude/skills -xtype l | wc -l)
          [ "$broken" -eq 0 ] || DRIFT="$DRIFT broken-symlinks:${broken};"
          # 6. skills-lock.json paths must exist
          missing=$(python3 -c "import json,os; d=json.load(open('skills-lock.json')); print(sum(1 for k,v in d.items() for p in [v.get('source') or v.get('vendored')] if p and not os.path.exists(p)))")
          [ "$missing" = "0" ] || DRIFT="$DRIFT lock-paths-missing:${missing};"

          if [ -n "$DRIFT" ]; then
            echo "drift=$DRIFT" >> "$GITHUB_OUTPUT"
            echo "::error::Token overhead drift:$DRIFT"
            exit 1
          fi
          echo "✅ token overhead stable"

      - name: Open issue on drift
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const drift = `${{ steps.audit.outputs.drift }}` || 'see workflow log';
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'token-audit'
            });
            const body = `Monthly token audit found drift: ${drift}\n\nFix guide: docs/AUTOMATION.md (monthly-token-audit spec). Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            if (open.data.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: open.data[0].number, body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: '🟡 Token audit: config drift detected', body, labels: ['token-audit']
              });
            }
