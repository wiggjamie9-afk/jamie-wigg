# Runs Anthropic's claude-code-security-review action on every PR.
#
# Scans the diff with Claude, posts findings as PR review comments.
# Costs Anthropic API tokens per run (small per-PR; depends on diff size).
#
# Requires repo secret: CLAUDE_API_KEY  (Anthropic API key with Claude Code
# usage enabled — set under Settings → Secrets and variables → Actions).
#
# Defaults to Sonnet 4.6 rather than the action's Opus default to keep
# per-PR cost low; bump to opus for high-stakes branches if needed.
#
# Excludes vendored / generated trees that produce noise without security
# value (node_modules, the Remotion starter's deps, graphify output, the
# rhythmix-studio.zip bundle's unpacked deps).
#
# Skip pattern: skip the run on draft PRs and on PRs that only touch
# markdown / docs (security review of a docs-only diff is pure cost).

name: claude-security-review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"

permissions:
  pull-requests: write
  contents: read

concurrency:
  group: security-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  security:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2

      - uses: anthropics/claude-code-security-review@main
        with:
          claude-api-key: ${{ secrets.CLAUDE_API_KEY }}
          claude-model: claude-sonnet-4-6
          comment-pr: true
          upload-results: true
          exclude-directories: node_modules,video/node_modules,video/.remotion,graphify-out,.agents/skills,.claude/skills,rhythmix-studio/node_modules,studio/node_modules,studio/.next
          claudecode-timeout: 20
