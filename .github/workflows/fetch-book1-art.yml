name: Fetch Book 1 art (download Higgsfield results)

# Downloads the image URLs listed in book1/redesign/art-v2/manifest.txt
# (generated via Higgsfield MCP) and commits them into art-v2/. This is the
# egress bridge: the cloud sandbox can't reach the CDN, but CI can.
# Sparse + shallow checkout keeps it fast despite the large repo.

on:
  workflow_dispatch: {}
  push:
    branches: [claude/youtube-tv-research-fla0ts]
    paths: [book1/redesign/art-v2/manifest.txt]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout (sparse, shallow)
        uses: actions/checkout@v4
        with:
          ref: claude/youtube-tv-research-fla0ts
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1
          sparse-checkout: book1/redesign/art-v2
          sparse-checkout-cone-mode: false

      - name: Download art from manifest
        run: |
          cd book1/redesign/art-v2
          while IFS=$'\t' read -r name url; do
            case "$name" in ''|\#*) continue;; esac
            [ -z "$url" ] && continue
            echo "Downloading $name"
            curl -fsSL --retry 5 --retry-delay 3 "$url" -o "$name" || { echo "FAILED $name"; exit 1; }
          done < manifest.txt
          ls -lh

      - name: Commit
        run: |
          git config user.email "sunny-bot@rhythmixapp.com.au"
          git config user.name "Sunny Bot"
          git add book1/redesign/art-v2/*.png 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No new art to commit"
          else
            git commit -m "book1 redesign: fetch generated art-v2 from manifest"
            git pull --rebase origin claude/youtube-tv-research-fla0ts || true
            git push origin HEAD:claude/youtube-tv-research-fla0ts
          fi
