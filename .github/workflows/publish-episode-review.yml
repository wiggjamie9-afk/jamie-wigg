name: Publish episode review files

on:
  push:
    # Test hook: pushing the trigger file copies the latest episode artifact's
    # reviewable files (scene images, thumbnail, ebook) onto the branch so they
    # can be inspected from the sandbox. Scoped to the rebuild branch only.
    branches: [claude/youtube-tv-research-fla0ts]
    paths: [kids-channel/.publish-review-trigger]

jobs:
  publish-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read artifact run id from trigger file
        id: cfg
        run: |
          RUN_ID=$(grep -oE 'run_id=[0-9]+' kids-channel/.publish-review-trigger | cut -d= -f2)
          if [ -z "$RUN_ID" ]; then
            echo "::error::No run_id=<id> line in kids-channel/.publish-review-trigger"
            exit 1
          fi
          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT

      - name: Download episode artifact
        uses: actions/download-artifact@v4
        with:
          name: episode-files
          run-id: ${{ steps.cfg.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/episode-artifact

      - name: Copy review files into repo
        run: |
          set -e
          mkdir -p review/episode
          # scene images, thumbnail, ebook, script — skip mp4/frames/audio
          find /tmp/episode-artifact \
            \( -name 'scene_*.jpg' -o -name 'thumbnail.jpg' -o -name '*.pdf' -o -name 'script.json' \) \
            -not -path '*frames*' -print -exec cp {} review/episode/ \;
          ls -la review/episode/

      - name: Commit review files
        run: |
          git config user.email "sunny-bot@rhythmixapp.com.au"
          git config user.name "Sunny Bot"
          git add review/episode
          if ! git diff --cached --quiet; then
            git commit -m "review: publish episode artwork for inspection"
            git pull --rebase origin ${{ github.ref_name }} || true
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "No review files to commit"
          fi
