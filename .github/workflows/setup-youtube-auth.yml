name: YouTube OAuth Setup (one-time)

on:
  workflow_dispatch:
    inputs:
      client_id_override:
        description: "Your Client ID — paste here to see it in the URL (not masked)"
        required: false
        type: string
      auth_code:
        description: "Step 2 only: paste the code from the redirect URL (leave blank to generate auth URL)"
        required: false
        type: string

jobs:
  oauth:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate auth URL or exchange code
        run: |
          python3 -c "
          import os, json, sys
          from urllib.parse import urlencode

          # Use override input (visible in logs) if provided, else fall back to secret
          client_id     = os.environ.get('CLIENT_ID_OVERRIDE', '').strip() or os.environ['YT_CLIENT_ID']
          client_secret = os.environ['YT_CLIENT_SECRET']
          auth_code     = os.environ.get('AUTH_CODE', '').strip()
          redirect_uri  = 'http://localhost'
          scope         = 'https://www.googleapis.com/auth/youtube.upload'

          print(f'client_id used: len={len(client_id)}, first16={client_id[:16]!r}')

          if not auth_code:
              params = {
                  'client_id':     client_id,
                  'redirect_uri':  redirect_uri,
                  'scope':         scope,
                  'response_type': 'code',
                  'access_type':   'offline',
                  'prompt':        'consent',
                  'login_hint':    'wiggjamie9@gmail.com',
              }
              url = 'https://accounts.google.com/o/oauth2/auth?' + urlencode(params)
              print()
              print('======================================================')
              print('STEP 1 — Open this URL in your browser (Private window):')
              print('======================================================')
              print()
              print(url)
              print()
              print('It will pre-select wiggjamie9@gmail.com automatically.')
              print('Tap Allow. Browser tries to open http://localhost — fails.')
              print('Copy the full URL from the address bar.')
              print('The code is the part after code= and before &')
              print()
              print('Run this workflow again, paste the code in auth_code.')
              print('======================================================')
          else:
              import urllib.request, urllib.parse
              data = urllib.parse.urlencode({
                  'code':          auth_code,
                  'client_id':     client_id,
                  'client_secret': client_secret,
                  'redirect_uri':  redirect_uri,
                  'grant_type':    'authorization_code',
              }).encode()
              req = urllib.request.Request(
                  'https://oauth2.googleapis.com/token',
                  data=data,
                  method='POST'
              )
              try:
                  with urllib.request.urlopen(req) as resp:
                      result = json.loads(resp.read())
              except urllib.request.HTTPError as e:
                  try: err = json.loads(e.read())
                  except: err = {}
                  print(f'Token exchange FAILED: {err}')
                  sys.exit(1)

              if 'refresh_token' not in result:
                  print('ERROR — no refresh_token in response:')
                  print(json.dumps(result, indent=2))
                  sys.exit(1)

              print()
              print('======================================================')
              print('SUCCESS — save these as GitHub Secrets:')
              print('======================================================')
              print()
              print('YOUTUBE_REFRESH_TOKEN =', result['refresh_token'])
              print()
              print('(Also update YOUTUBE_ACCESS_TOKEN if needed)')
              print('YOUTUBE_ACCESS_TOKEN  =', result['access_token'])
              print()
              print('Go to: repo Settings -> Secrets and variables -> Actions')
              print('======================================================')
          "
        env:
          YT_CLIENT_ID:       ${{ secrets.YOUTUBE_CLIENT_ID }}
          YT_CLIENT_SECRET:   ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          AUTH_CODE:          ${{ inputs.auth_code }}
          CLIENT_ID_OVERRIDE: ${{ inputs.client_id_override }}
