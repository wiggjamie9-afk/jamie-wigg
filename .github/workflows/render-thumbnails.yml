name: Generate thumbnails

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  thumbnails:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install sharp (no Chromium needed)
        run: npm install --no-save sharp@0.34.5

      - name: Render thumbnails from SVG
        run: node scripts/render-thumbnails.mjs

      - name: Commit thumbnails
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          git add thumbnails/*.png
          if git diff --cached --quiet; then
            echo "Nothing to commit (already up to date)"
          else
            git commit -m "Generate brand thumbnails (16:9, square, 9:16)"
            git push
          fi

      - name: Summary
        if: always()
        run: |
          echo "## Thumbnails generated" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Tap to download:" >> $GITHUB_STEP_SUMMARY
          echo "- **16:9** (YouTube/Twitter): https://github.com/${{ github.repository }}/raw/main/thumbnails/rhythmix-thumbnail-16-9.png" >> $GITHUB_STEP_SUMMARY
          echo "- **Square** (Gumroad/IG): https://github.com/${{ github.repository }}/raw/main/thumbnails/rhythmix-thumbnail-square.png" >> $GITHUB_STEP_SUMMARY
          echo "- **9:16** (TikTok/Reels): https://github.com/${{ github.repository }}/raw/main/thumbnails/rhythmix-thumbnail-vertical.png" >> $GITHUB_STEP_SUMMARY
