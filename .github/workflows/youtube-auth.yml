name: YouTube — Get Auth Token

on:
  workflow_dispatch:
    inputs:
      auth_code:
        description: "Leave blank for Step 1. Paste the code from the URL bar for Step 2."
        required: false
        type: string

jobs:
  youtube-auth:
    runs-on: ubuntu-latest
    steps:
      - name: Debug — Verify CLIENT_ID secret
        if: inputs.auth_code == ''
        env:
          CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        run: |
          python3 - <<'EOF'
          import os
          cid = os.environ.get("CLIENT_ID", "")
          sec = os.environ.get("CLIENT_SECRET", "")
          print(f"CLIENT_ID length: {len(cid)}")
          print(f"CLIENT_ID first 20: {cid[:20]}")
          print(f"CLIENT_ID last 30: {cid[-30:]}")
          print(f"CLIENT_ID valid: {'.apps.googleusercontent.com' in cid}")
          print(f"CLIENT_SECRET length: {len(sec)}")
          print(f"CLIENT_SECRET first 7: {sec[:7]}")
          print(f"CLIENT_SECRET last 4: {sec[-4:]}")
          EOF

      - name: Step 1 — Generate authorization URL
        if: inputs.auth_code == ''
        env:
          CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
        run: |
          python3 - <<'EOF'
          import urllib.parse, os

          client_id = os.environ["CLIENT_ID"]
          redirect_uri = "http://localhost"
          scope = "https://www.googleapis.com/auth/youtube.upload"

          params = {
              "client_id": client_id,
              "redirect_uri": redirect_uri,
              "response_type": "code",
              "scope": scope,
              "access_type": "offline",
              "prompt": "consent"
          }

          auth_url = "https://accounts.google.com/o/oauth2/v2/auth?" + urllib.parse.urlencode(params)

          print("=" * 60)
          print("OPEN THIS URL IN SAFARI:")
          print()
          print(auth_url)
          print()
          print("Sign in and tap Allow. Safari will show an error page")
          print("(that's normal). Tap the address bar at the top.")
          print("The URL will look like: http://localhost/?code=XXXXX&scope=...")
          print("Copy everything after 'code=' up to (not including) '&'")
          print("Then run this workflow again, pasting that code as the input.")
          print("=" * 60)
          EOF

      - name: Step 2 — Exchange code for token
        if: inputs.auth_code != ''
        env:
          CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          AUTH_CODE: ${{ inputs.auth_code }}
        run: |
          python3 - <<'EOF'
          import urllib.request, urllib.parse, json, os, sys

          data = urllib.parse.urlencode({
              "client_id": os.environ["CLIENT_ID"],
              "client_secret": os.environ["CLIENT_SECRET"],
              "code": os.environ["AUTH_CODE"],
              "redirect_uri": "http://localhost",
              "grant_type": "authorization_code"
          }).encode()

          req = urllib.request.Request(
              "https://oauth2.googleapis.com/token",
              data=data
          )
          try:
              with urllib.request.urlopen(req) as r:
                  token = json.loads(r.read())
          except Exception as e:
              body = e.read().decode() if hasattr(e, 'read') else str(e)
              print("ERROR:", e)
              print("Google response:", body)
              sys.exit(1)

          token_json = json.dumps({
              "token": token["access_token"],
              "refresh_token": token.get("refresh_token", ""),
              "token_uri": "https://oauth2.googleapis.com/token",
              "client_id": os.environ["CLIENT_ID"],
              "client_secret": os.environ["CLIENT_SECRET"],
              "scopes": ["https://www.googleapis.com/auth/youtube.upload"],
              "expiry": None
          }, indent=2)

          print("=" * 60)
          print("SUCCESS! Copy everything between the lines below")
          print("and save it as GitHub Secret: YOUTUBE_TOKEN")
          print("=" * 60)
          print(token_json)
          print("=" * 60)
          EOF
