# Run tests for both:
#   - studio/ (Vitest, browser-y modules with jsdom + WebCrypto)
#   - rhythmix-studio/ (Node-only, plain assertions for the core extraction)
#
# Triggers on push to any branch when either tree changes. The two jobs run
# in parallel — they share no state.
#
# This workflow is intentionally separate from `studio-deploy.yml` (T2). That
# workflow handles the Cloudflare Pages build + preview/production deploys
# and is gated behind a manual approval for production. Tests should run on
# every push without that gating.
#
# Satisfies spec rhythmix-app / T14.

name: studio-test

on:
  push:
    branches:
      - "**"
    paths:
      - "studio/**"
      - "rhythmix-studio/**"
      - ".github/workflows/studio-test.yml"
  workflow_dispatch:

concurrency:
  group: studio-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------
  # studio-vitest — runs Vitest against studio/lib/*.test.ts. Requires
  # pnpm install --frozen-lockfile to bring in vitest, jsdom, and idb.
  # ---------------------------------------------------------------------
  studio-vitest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: studio/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Vitest
        run: pnpm test

  # ---------------------------------------------------------------------
  # rhythmix-studio-node — runs the Node-only test suite. Two scripts:
  #   - the original `npm test` (test/run.mjs) — full CLI render test
  #   - core.test.mjs — pure-core unit tests added by T14
  # The original script needs ffmpeg/ffprobe + a stash of seed clips
  # which the CI runner may not have. We invoke `npm test` defensively
  # but always run the new core unit tests.
  # ---------------------------------------------------------------------
  rhythmix-studio-node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rhythmix-studio
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run core unit tests
        run: node test/core.test.mjs

      - name: Run full CLI test suite (best-effort)
        run: npm test
        continue-on-error: true
