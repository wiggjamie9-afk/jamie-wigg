name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build site folder
        run: |
          mkdir -p _site
          cp *.html _site/
          cp CNAME _site/
          cp favicon.svg _site/
          # Buyer-deliverable zips at the repo root (e.g. rhythmix-studio.zip)
          for z in *.zip; do
            [ -f "$z" ] && cp "$z" _site/
          done
          touch _site/.nojekyll

          # Frequency sub-brand assets at repo root (PWA + OG + cover +
          # promo videos). Whitelisted with explicit globs so we don't
          # accidentally publish unrelated files.
          for f in frequency-*.png frequency-*.mp4 frequency-*.webmanifest frequency-*.js \
                   frequency.webmanifest; do
            [ -f "$f" ] && cp "$f" _site/
          done

          # Static asset directories referenced from HTML pages.
          [ -d thumbnails ] && cp -r thumbnails _site/
          [ -d videos ] && cp -r videos _site/

          # Per-video preview GIFs, poster JPGs, and QR PNGs scattered across
          # rhythmix-*/ directories. cp --parents preserves nested structure
          # so relative <img src> paths continue to resolve.
          find . -type f \( \
              -name '*-preview.gif' \
              -o -name '*-poster.jpg' \
              -o -name '*-qr.png' \
            \) \
            -not -path './.git/*' \
            -not -path './node_modules/*' \
            -not -path './_site/*' \
            -exec cp --parents {} _site/ \;

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
