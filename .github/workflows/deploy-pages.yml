name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build site folder
        run: |
          mkdir -p _site
          cp *.html _site/
          cp CNAME _site/
          touch _site/.nojekyll

          # Copy small static assets referenced by downloads.html, launch.html,
          # and any other HTML pages — preview GIFs, poster JPGs, and QR PNGs.
          # cp --parents preserves the nested rhythmix-*/renders/... structure
          # so relative <img src> paths continue to resolve.
          find . -type f \( \
              -name '*-preview.gif' \
              -o -name '*-poster.jpg' \
              -o -name '*-qr.png' \
            \) \
            -not -path './.git/*' \
            -not -path './node_modules/*' \
            -not -path './_site/*' \
            -exec cp --parents {} _site/ \;

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
