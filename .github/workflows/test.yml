name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  api-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.9, '3.11']
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Install dependencies
        working-directory: pdf-analyzer-api
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov
      
      - name: Lint with pylint
        working-directory: pdf-analyzer-api
        run: pylint main.py --disable=all --enable=E,F
        continue-on-error: true
      
      - name: Type check with mypy
        working-directory: pdf-analyzer-api
        run: mypy main.py
        continue-on-error: true

  frontend-tests:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
      
      - name: Install dependencies
        working-directory: pdf-analyzer-web
        run: npm ci
      
      - name: Lint
        working-directory: pdf-analyzer-web
        run: npm run lint
        continue-on-error: true
      
      - name: Build
        working-directory: pdf-analyzer-web
        run: npm run build

  code-reviewer-tests:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
      
      - name: Install dependencies
        working-directory: code-reviewer
        run: npm ci
      
      - name: Lint
        working-directory: code-reviewer
        run: npm run lint
        continue-on-error: true
      
      - name: Build
        working-directory: code-reviewer
        run: npm run build
