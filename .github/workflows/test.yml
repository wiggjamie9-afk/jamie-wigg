name: Tests

on:
  push:
    branches: [claude/*, main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      
      - name: Install dependencies
        run: npm install
      
      - name: Run tests
        run: npm test --if-present

      - name: Type check
        run: npm run type-check 2>/dev/null || echo "No type-check script"
      
      - name: Lint
        run: npm run lint 2>/dev/null || echo "No lint script"

  agent-builder:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: cd agent-builder && npm install
      
      - name: Test
        run: cd agent-builder && npm test
      
      - name: Lint
        run: cd agent-builder && npm run lint
      
      - name: Build
        run: cd agent-builder && npm run build
