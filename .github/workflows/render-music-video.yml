name: Render music video

on:
  workflow_dispatch:
    inputs:
      track:
        description: 'Audio track path (relative to repo root)'
        required: true
        default: 'voiceover-adam.wav'
      theme:
        description: 'Visual theme (one line)'
        required: true
        default: 'neon midnight city, lone figure on rooftop, blade runner aesthetic'
      bpm:
        description: 'BPM (track tempo)'
        required: false
        default: '120'
      model:
        description: 'Replicate model'
        required: false
        default: 'minimax-video'
        type: choice
        options:
          - minimax-video
          - hunyuan-video
          - luma-ray
          - kling-v2
      output_name:
        description: 'Output filename (under videos/)'
        required: false
        default: 'rhythmix-studio-001.mp4'

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Validate Replicate token
        id: validate
        env:
          RAW_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
        run: |
          mkdir -p .debug
          DEBUG=.debug/last-render.txt
          : > "$DEBUG"
          log() { echo "$@" | tee -a "$DEBUG"; }

          log "Run: ${{ github.run_id }} ($(date -u +%FT%TZ))"
          log "Inputs: track=${{ inputs.track }} theme='${{ inputs.theme }}' model=${{ inputs.model }}"
          log ""

          if [ -z "$RAW_TOKEN" ]; then
            log "RESULT: TOKEN_NOT_SET"
            log "REPLICATE_API_TOKEN secret is not set on this repository."
            log "Add it at: https://github.com/${{ github.repository }}/settings/secrets/actions"
            exit 1
          fi

          TRIMMED=$(printf '%s' "$RAW_TOKEN" | tr -d '[:space:]')
          log "Raw secret length:    ${#RAW_TOKEN}"
          log "Trimmed length:       ${#TRIMMED}"
          log "Trimmed prefix:       ${TRIMMED:0:5}..."
          log "Trimmed suffix:       ...${TRIMMED: -3}"

          if [ "${TRIMMED:0:3}" != "r8_" ]; then
            log ""
            log "RESULT: WRONG_PREFIX"
            log "Token doesn't start with 'r8_'. Got '${TRIMMED:0:5}'."
            exit 1
          fi

          if [ ${#TRIMMED} -lt 35 ]; then
            log ""
            log "RESULT: TOKEN_TOO_SHORT (${#TRIMMED} chars, expected ~40)"
            log ""
            log "The secret was truncated when pasted. Mobile Safari sometimes only"
            log "selects/pastes part of a long token. Fix:"
            log "  1. Copy the FULL token (40 chars, starts with r8_)"
            log "  2. Open https://github.com/${{ github.repository }}/settings/secrets/actions"
            log "  3. Tap pencil icon, Select All, Delete, Paste, Update secret"
            log "  4. Verify by re-running this workflow"
            exit 1
          fi

          log ""
          log "Auth tests against https://api.replicate.com/v1/account"

          T_STATUS=$(curl -s -o /tmp/t.txt -w "%{http_code}" \
            -H "Authorization: Token $TRIMMED" \
            https://api.replicate.com/v1/account || echo "000")
          log "  Token  auth: HTTP $T_STATUS"

          B_STATUS=$(curl -s -o /tmp/b.txt -w "%{http_code}" \
            -H "Authorization: Bearer $TRIMMED" \
            https://api.replicate.com/v1/account || echo "000")
          log "  Bearer auth: HTTP $B_STATUS"

          log ""
          log "Token response body:"
          cat /tmp/t.txt | head -c 500 | tee -a "$DEBUG" || true
          log ""
          log "Bearer response body:"
          cat /tmp/b.txt | head -c 500 | tee -a "$DEBUG" || true
          log ""

          if [ "$T_STATUS" = "200" ] || [ "$B_STATUS" = "200" ]; then
            log "RESULT: AUTH_OK"
          else
            log "RESULT: AUTH_REJECTED (Token=$T_STATUS Bearer=$B_STATUS)"
            log "Token rejected by Replicate. Most likely:"
            log "  - Token has been deleted/rotated on Replicate side"
            log "  - Token belongs to a different account"
            log "  - Replicate account billing issue"
            log ""
            log "Fix: visit https://replicate.com/account/api-tokens, create a fresh"
            log "token, and update the GitHub secret."
            exit 1
          fi

      - name: Render
        env:
          RAW_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
        working-directory: rhythmix-studio
        run: |
          export REPLICATE_API_TOKEN=$(printf '%s' "$RAW_TOKEN" | tr -d '[:space:]')
          node bin/rhythmix-studio.mjs render "../${{ inputs.track }}" \
            --theme "${{ inputs.theme }}" \
            --bpm "${{ inputs.bpm }}" \
            --model "${{ inputs.model }}" \
            --concurrency 4 \
            --out ../rhythmix-out/render 2>&1 | tee -a ../.debug/last-render.txt

      - name: Move output to videos/
        run: |
          mkdir -p videos
          cp rhythmix-out/render/final.mp4 "videos/${{ inputs.output_name }}"
          ls -la "videos/${{ inputs.output_name }}"

      - name: Commit debug log + video (always)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          git add .debug/last-render.txt 2>/dev/null || true
          if [ -f "videos/${{ inputs.output_name }}" ]; then
            git add "videos/${{ inputs.output_name }}"
          fi
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Workflow run ${{ github.run_id }}: $([ -f videos/${{ inputs.output_name }} ] && echo render OK || echo debug log)"
            git push || echo "Push failed (rare race condition)"
          fi

      - name: Output download link
        if: success()
        run: |
          echo "## ✅ Render complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Download:** https://github.com/${{ github.repository }}/raw/main/videos/${{ inputs.output_name }}" >> $GITHUB_STEP_SUMMARY
