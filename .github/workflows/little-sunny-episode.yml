name: Little Sunny — New Episode

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Episode topic (e.g. Sunny finds a baby frog)"
        required: true
        type: string
      dry_run:
        description: "Dry run (skip YouTube upload)"
        required: false
        type: boolean
        default: false

jobs:
  produce-episode:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps (ffmpeg)
        run: sudo apt-get install -y ffmpeg

      - name: Install Python deps
        run: |
          pip install requests python-dotenv anthropic \
            google-auth google-auth-oauthlib google-api-python-client \
            elevenlabs

      - name: Write .env
        run: |
          cat > .env <<EOF
          ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
          ELEVENLABS_API_KEY=${{ secrets.ELEVENLABS_API_KEY }}
          HIGGSFIELD_API_KEY=${{ secrets.HIGGSFIELD_API_KEY }}
          HIGGSFIELD_SECRET=${{ secrets.HIGGSFIELD_SECRET }}
          YOUTUBE_CLIENT_ID=${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET=${{ secrets.YOUTUBE_CLIENT_SECRET }}
          EOF

      - name: Write YouTube token
        run: |
          echo '${{ secrets.YOUTUBE_TOKEN }}' > kids-channel/token.json

      - name: Run pipeline
        run: |
          ARGS="--topic \"${{ inputs.topic }}\""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          eval python kids-channel/pipeline.py $ARGS --skip-video

      - name: Upload episode artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: episode-files
          path: kids-channel/episodes/
          retention-days: 7
