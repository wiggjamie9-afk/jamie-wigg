name: Little Sunny — New Episode

on:
  workflow_dispatch:
    inputs:
      script_file:
        description: "Override script path (leave blank to use queue)"
        required: false
        type: string
      dry_run:
        description: "Dry run (skip YouTube upload)"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "0 21 * * *"   # 7 AM AEST every day
    - cron: "0 3 * * *"    # 1 PM AEST every day
    - cron: "0 9 * * *"    # 7 PM AEST every day
  push:
    # Test hook: pushing the trigger file on the rebuild branch starts a
    # dry-run build (no upload, no queue advance). Scoped to that branch only.
    branches: [claude/youtube-tv-research-fla0ts]
    paths: [kids-channel/.dry-run-trigger]

jobs:
  produce-episode:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      # Push-triggered runs are always dry runs
      DRY_RUN: ${{ github.event_name == 'push' || inputs.dry_run == true }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # No ref pin: scheduled runs use main, manual dispatch uses the
          # branch it was dispatched on — so workflow fixes can be tested
          # from a feature branch before merging.
          token: ${{ secrets.GITHUB_TOKEN }}
          submodules: false

      - name: Determine script from queue
        id: pick-script
        run: |
          OVERRIDE="${{ github.event.inputs.script_file }}"
          if [ -n "$OVERRIDE" ]; then
            echo "script=$OVERRIDE" >> $GITHUB_OUTPUT
            echo "from_queue=false" >> $GITHUB_OUTPUT
            echo "Using override: $OVERRIDE"
          else
            NEXT=$(head -1 kids-channel/queue.txt 2>/dev/null | tr -d '[:space:]')
            if [ -z "$NEXT" ]; then
              echo "::error::Episode queue is empty — add more scripts to kids-channel/queue.txt"
              exit 1
            fi
            echo "script=$NEXT" >> $GITHUB_OUTPUT
            echo "from_queue=true" >> $GITHUB_OUTPUT
            echo "Using queue: $NEXT"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps (ffmpeg)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python deps
        run: |
          pip install requests python-dotenv anthropic \
            google-auth google-auth-oauthlib google-api-python-client \
            elevenlabs Pillow fal-client

      - name: Install OpenMontage deps
        run: |
          if [ -f OpenMontage/requirements.txt ]; then
            pip install -r OpenMontage/requirements.txt || true
          fi

      - name: Download Piper TTS voice model
        run: |
          mkdir -p /tmp/piper-voices
          MODEL="en_US-lessac-medium"
          ONNX="/tmp/piper-voices/${MODEL}.onnx"
          JSON="/tmp/piper-voices/${MODEL}.onnx.json"
          BASE="https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/lessac/medium"
          if [ ! -f "$ONNX" ]; then
            curl -fsSL "${BASE}/${MODEL}.onnx" -o "$ONNX" || echo "Piper model download failed (non-fatal)"
          fi
          if [ ! -f "$JSON" ]; then
            curl -fsSL "${BASE}/${MODEL}.onnx.json" -o "$JSON" || echo "Piper config download failed (non-fatal)"
          fi

      - name: Download Quicksand fonts
        run: |
          mkdir -p /tmp/fonts
          # Google Fonts only ships Quicksand as a variable font; fetch static
          # TTF instances via the legacy-browser CSS endpoint (old Firefox UA
          # gets .ttf src URLs instead of .woff/.woff2).
          UA="Mozilla/5.0 (Windows; U; Windows NT 5.1; en-US; rv:1.9.0.5) Gecko/2008120122 Firefox/3.0.5"
          CSS=$(curl -fsSL -H "User-Agent: $UA" "https://fonts.googleapis.com/css?family=Quicksand:400,500,700" || true)
          for SPEC in "400:Regular" "500:Medium" "700:Bold"; do
            WEIGHT="${SPEC%%:*}"
            NAME="${SPEC##*:}"
            F="/tmp/fonts/Quicksand-${NAME}.ttf"
            URL=$(printf '%s' "$CSS" | grep -A2 "font-weight: ${WEIGHT};" | grep -o 'url([^)]*)' | head -1 | sed 's/url(//;s/)//')
            if [ -n "$URL" ] && [ ! -f "$F" ]; then
              curl -fsSL "$URL" -o "$F" || echo "Quicksand ${NAME} download failed (non-fatal)"
            fi
          done

      - name: Install Piper TTS binary
        run: |
          PIPER_VER="2023.11.14-2"
          PIPER_URL="https://github.com/rhasspy/piper/releases/download/${PIPER_VER}/piper_linux_x86_64.tar.gz"
          if ! command -v piper >/dev/null 2>&1; then
            curl -fsSL "$PIPER_URL" | tar -xz -C /tmp/
            sudo mv /tmp/piper/piper /usr/local/bin/piper || echo "Piper install failed (non-fatal)"
          fi

      - name: Write .env
        run: |
          cat > .env <<EOF
          ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
          ELEVENLABS_API_KEY=${{ secrets.ELEVENLABS_API_KEY }}
          REPLICATE_API_TOKEN=${{ secrets.REPLICATE_API_TOKEN }}
          HIGGSFIELD_API_KEY=${{ secrets.HIGGSFIELD_API_KEY }}
          HIGGSFIELD_SECRET=${{ secrets.HIGGSFIELD_SECRET }}
          FAL_KEY=${{ secrets.FAL_KEY }}
          PEXELS_API_KEY=${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY=${{ secrets.PIXABAY_API_KEY }}
          YOUTUBE_CLIENT_ID=${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET=${{ secrets.YOUTUBE_CLIENT_SECRET }}
          PIPER_VOICE_DIR=/tmp/piper-voices
          EOF

      - name: Write YouTube token
        if: ${{ env.DRY_RUN != 'true' }}
        run: |
          python3 -c "
          import json, os
          token = {
              'access_token': os.environ['YT_ACCESS'].strip(),
              'refresh_token': os.environ['YT_REFRESH'].strip(),
              'token_uri': 'https://oauth2.googleapis.com/token',
              'client_id': os.environ['YT_CLIENT_ID'].strip(),
              'client_secret': os.environ['YT_CLIENT_SECRET'].strip(),
              'scopes': ['https://www.googleapis.com/auth/youtube.upload']
          }
          with open('kids-channel/token.json', 'w') as f:
              json.dump(token, f)
          print('token.json written OK')
          "
        env:
          YT_ACCESS: ${{ secrets.YOUTUBE_ACCESS_TOKEN }}
          YT_REFRESH: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}

      - name: Validate YouTube token (pre-flight)
        # Dry runs never upload, so they must not be blocked by dead tokens —
        # this is what lets us test the build pipeline while OAuth is broken.
        if: ${{ env.DRY_RUN != 'true' }}
        env:
          YT_REFRESH: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        run: |
          python3 - <<'EOF'
          import urllib.request as r, urllib.parse as p, json, os, sys

          rt  = os.environ['YT_REFRESH'].strip()
          cid = os.environ['YT_CLIENT_ID'].strip()
          cs  = os.environ['YT_CLIENT_SECRET'].strip()

          print(f"refresh_token  : len={len(rt)}, first8={rt[:8]!r}, last4={rt[-4:]!r}")
          print(f"client_id      : len={len(cid)}, first12={cid[:12]!r}")
          print(f"client_secret  : len={len(cs)}, last4={cs[-4:]!r}")

          body = p.urlencode({
              'client_id': cid,
              'client_secret': cs,
              'refresh_token': rt,
              'grant_type': 'refresh_token',
          }).encode()
          req = r.Request(
              'https://oauth2.googleapis.com/token',
              data=body,
              headers={'Content-Type': 'application/x-www-form-urlencoded'},
          )
          try:
              with r.urlopen(req, timeout=30) as resp:
                  data = json.loads(resp.read())
              print(f"✓ Token refresh OK — access_token len={len(data.get('access_token',''))}")
          except r.HTTPError as e:
              try:
                  err = json.loads(e.read())
              except Exception:
                  err = {}
              print(f"✗ Token refresh FAILED: {err.get('error')}: {err.get('error_description')}")
              print()
              print("Fix: go to rhythmixapp.com.au/kids-channel/token-fix.html")
              print("     re-do OAuth Playground with 'Use your own OAuth credentials' ticked,")
              print("     enter Web Client 1 ID + Secret, then update all 4 YOUTUBE_* secrets.")
              sys.exit(1)
          EOF

      - name: Run pipeline
        id: run-pipeline
        env:
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          HIGGSFIELD_API_KEY: ${{ secrets.HIGGSFIELD_API_KEY }}
          HIGGSFIELD_SECRET: ${{ secrets.HIGGSFIELD_SECRET }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          DRY_RUN_FLAG=""
          if [ "$DRY_RUN" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
          fi
          python kids-channel/pipeline.py \
            --script-file "${{ steps.pick-script.outputs.script }}" \
            $DRY_RUN_FLAG

      - name: Persist character reference
        # Commit the canonical Sonny reference even on dry runs — it is the
        # seed-locked source of character consistency for every future episode.
        if: steps.run-pipeline.conclusion == 'success'
        run: |
          git config user.email "sunny-bot@rhythmixapp.com.au"
          git config user.name "Sunny Bot"
          git add kids-channel/character/ 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "character: persist canonical Sonny reference"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "Character reference unchanged — nothing to commit"
          fi

      - name: Advance queue
        # Never advance the queue on a dry run — nothing was published.
        if: steps.pick-script.outputs.from_queue == 'true' && steps.run-pipeline.conclusion == 'success' && env.DRY_RUN != 'true'
        run: |
          git config user.email "sunny-bot@rhythmixapp.com.au"
          git config user.name "Sunny Bot"
          tail -n +2 kids-channel/queue.txt > kids-channel/queue_tmp.txt
          mv kids-channel/queue_tmp.txt kids-channel/queue.txt
          git add kids-channel/queue.txt
          git commit -m "queue: processed ${{ steps.pick-script.outputs.script }}"
          git pull --rebase origin ${{ github.ref_name }} || true
          git push origin HEAD:${{ github.ref_name }}

      - name: Upload episode artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: episode-files
          path: kids-channel/episodes/
          retention-days: 7
