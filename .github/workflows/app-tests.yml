name: App Factory · Tests

# Functional smoke tests (jsdom) for every shipping app. Runs on app or
# harness changes so a broken app never ships unnoticed.

on:
  workflow_dispatch:
  push:
    paths:
      - 'apps/**'
      - 'test-harness/**'
      - 'scripts/app-factory/**'
      - '.github/workflows/app-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install test deps
        working-directory: test-harness
        run: npm ci

      - name: Run functional smoke tests (all apps)
        run: node test-harness/run.mjs --all

      - name: Readability / contrast lint (all apps)
        run: node test-harness/contrast.mjs --all
