name: YouTube — Step 2 Exchange Code for Token

on:
  workflow_dispatch:

jobs:
  exchange-token:
    runs-on: ubuntu-latest
    steps:
      - name: Debug — Verify secrets
        env:
          CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        run: |
          python3 - <<'EOF'
          import os
          cid = os.environ.get("CLIENT_ID", "").strip().strip("<>")
          sec = os.environ.get("CLIENT_SECRET", "").strip().strip("<>")
          print(f"CLIENT_ID length: {len(cid)}")
          print(f"CLIENT_ID correct prefix: {cid.startswith('578929572423-78f9nl')}")
          print(f"CLIENT_SECRET length: {len(sec)}")
          print(f"CLIENT_SECRET starts GOCSPX-: {sec.startswith('GOCSPX-')}")
          print(f"CLIENT_SECRET last 6: {sec[-6:]}")
          EOF

      - name: Exchange YOUTUBE_AUTH_CODE for token
        env:
          CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          AUTH_CODE: ${{ secrets.YOUTUBE_AUTH_CODE }}
        run: |
          python3 - <<'EOF'
          import urllib.request, urllib.parse, json, os, sys

          client_id = os.environ["CLIENT_ID"].strip().strip("<>")
          client_secret = os.environ["CLIENT_SECRET"].strip().strip("<>")
          auth_code = os.environ.get("AUTH_CODE", "").strip().strip("<>")

          if not auth_code:
              print("ERROR: YOUTUBE_AUTH_CODE secret is empty.")
              print("Add the code from Safari's address bar as a GitHub Secret")
              print("named YOUTUBE_AUTH_CODE, then re-run this workflow.")
              sys.exit(1)

          data = urllib.parse.urlencode({
              "client_id": client_id,
              "client_secret": client_secret,
              "code": auth_code,
              "redirect_uri": "http://localhost",
              "grant_type": "authorization_code"
          }).encode()

          req = urllib.request.Request(
              "https://oauth2.googleapis.com/token",
              data=data
          )
          try:
              with urllib.request.urlopen(req) as r:
                  token = json.loads(r.read())
          except Exception as e:
              body = e.read().decode() if hasattr(e, 'read') else str(e)
              print("ERROR:", e)
              print("Google response:", body)
              sys.exit(1)

          token_json = json.dumps({
              "token": token["access_token"],
              "refresh_token": token.get("refresh_token", ""),
              "token_uri": "https://oauth2.googleapis.com/token",
              "client_id": client_id,
              "client_secret": client_secret,
              "scopes": ["https://www.googleapis.com/auth/youtube.upload"],
              "expiry": None
          }, indent=2)

          print("=" * 60)
          print("SUCCESS! Copy everything between the lines below")
          print("and save it as GitHub Secret: YOUTUBE_TOKEN")
          print("=" * 60)
          print(token_json)
          print("=" * 60)
          EOF
