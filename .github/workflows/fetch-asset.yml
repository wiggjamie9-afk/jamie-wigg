name: Fetch external asset into repo

on:
  push:
    # Utility hook: the trigger file holds "url=<https URL>" and "dest=<repo path>"
    # lines; the runner downloads the asset and commits it to the branch. Lets the
    # sandbox retrieve files from hosts its egress proxy blocks.
    branches: [claude/youtube-tv-research-fla0ts]
    paths: [kids-channel/.fetch-asset-trigger]

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download assets
        run: |
          # Trigger file: one "url=<https URL>|dest=<repo path>" pair per line.
          FAILED=0
          while IFS= read -r LINE; do
            case "$LINE" in url=*) ;; *) continue;; esac
            URL="${LINE#url=}"; URL="${URL%%|dest=*}"
            DEST="${LINE##*|dest=}"
            case "$DEST" in
              /*|*..*) echo "::error::dest must be a relative repo path without .."; exit 1;;
            esac
            mkdir -p "$(dirname "$DEST")"
            if curl -fsSL "$URL" -o "$DEST"; then
              echo "fetched $DEST ($(stat -c%s "$DEST") bytes)"
            else
              echo "::warning::failed to fetch $DEST from $URL"
              FAILED=$((FAILED+1))
            fi
          done < kids-channel/.fetch-asset-trigger
          [ "$FAILED" -eq 0 ] || echo "$FAILED downloads failed"

      - name: Commit assets
        run: |
          git config user.email "sunny-bot@rhythmixapp.com.au"
          git config user.name "Sunny Bot"
          grep -oP '\|dest=\K.+' kids-channel/.fetch-asset-trigger | while read -r DEST; do
            [ -f "$DEST" ] && git add "$DEST"
          done
          if ! git diff --cached --quiet; then
            git commit -m "assets: fetch external files"
            git pull --rebase origin ${{ github.ref_name }} || true
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "No changes"
          fi
