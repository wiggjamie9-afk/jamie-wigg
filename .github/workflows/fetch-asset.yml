name: Fetch external asset into repo

on:
  push:
    # Utility hook: the trigger file holds "url=<https URL>" and "dest=<repo path>"
    # lines; the runner downloads the asset and commits it to the branch. Lets the
    # sandbox retrieve files from hosts its egress proxy blocks.
    branches: [claude/youtube-tv-research-fla0ts]
    paths: [kids-channel/.fetch-asset-trigger]

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download asset
        run: |
          URL=$(grep -oP '^url=\K.+' kids-channel/.fetch-asset-trigger)
          DEST=$(grep -oP '^dest=\K.+' kids-channel/.fetch-asset-trigger)
          if [ -z "$URL" ] || [ -z "$DEST" ]; then
            echo "::error::Trigger file needs url= and dest= lines"; exit 1
          fi
          case "$DEST" in
            /*|*..*) echo "::error::dest must be a relative repo path without .."; exit 1;;
          esac
          mkdir -p "$(dirname "$DEST")"
          curl -fsSL "$URL" -o "$DEST"
          ls -la "$DEST"

      - name: Commit asset
        run: |
          git config user.email "sunny-bot@rhythmixapp.com.au"
          git config user.name "Sunny Bot"
          DEST=$(grep -oP '^dest=\K.+' kids-channel/.fetch-asset-trigger)
          git add "$DEST"
          if ! git diff --cached --quiet; then
            git commit -m "assets: fetch $DEST"
            git pull --rebase origin ${{ github.ref_name }} || true
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "No changes"
          fi
