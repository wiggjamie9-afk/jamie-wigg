<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>RHYTHMIX — Backstory Poster</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    background: #050505;
    color: #ffffff;
    font-family: "Inter", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .poster {
    position: relative;
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    background:
      radial-gradient(ellipse 900px 700px at 20% 16%, rgba(255, 31, 90, 0.32), transparent 60%),
      radial-gradient(ellipse 800px 700px at 85% 84%, rgba(245, 192, 0, 0.22), transparent 62%),
      radial-gradient(ellipse 700px 600px at 75% 38%, rgba(124, 58, 237, 0.20), transparent 65%),
      #050505;
  }

  /* Grid texture */
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
    background-size: 80px 80px;
    mask-image: radial-gradient(ellipse 800px 1400px at 50% 50%, #000 40%, transparent 90%);
    -webkit-mask-image: radial-gradient(ellipse 800px 1400px at 50% 50%, #000 40%, transparent 90%);
  }

  /* Diagonal scanlines */
  .scan {
    position: absolute; inset: 0;
    background: repeating-linear-gradient(
      135deg,
      rgba(255, 255, 255, 0.02) 0px,
      rgba(255, 255, 255, 0.02) 1px,
      transparent 1px,
      transparent 6px
    );
    pointer-events: none;
  }

  /* Noise speckle */
  .noise {
    position: absolute; inset: 0;
    opacity: 0.32;
    mix-blend-mode: overlay;
    background-image: radial-gradient(rgba(255,255,255,0.08) 1px, transparent 1px);
    background-size: 3px 3px;
    pointer-events: none;
  }

  /* Top eyebrow */
  .eyebrow {
    position: absolute;
    top: 90px; left: 80px; right: 80px;
    display: flex; justify-content: space-between; align-items: center;
    font-family: "JetBrains Mono", monospace;
    font-size: 26px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #cfcfd8;
  }
  .eyebrow .left { color: #ffd9e8; }
  .eyebrow .dot {
    display: inline-block;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: #ff1f5a;
    box-shadow: 0 0 22px #ff1f5a;
    vertical-align: middle;
    margin-right: 14px;
    transform: translateY(-2px);
  }
  .eyebrow .right { color: #f5c000; }

  /* WORDMARK */
  .wordmark {
    position: absolute;
    top: 190px; left: 0; right: 0;
    text-align: center;
    font-family: "Inter", system-ui, sans-serif;
    font-weight: 900;
    font-size: 138px;
    letter-spacing: -0.02em;
    line-height: 1;
    background: linear-gradient(135deg, #ff1f5a 0%, #7c3aed 50%, #00d8ff 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
    text-shadow: 0 0 80px rgba(124, 58, 237, 0.28);
  }
  .wordmark::after {
    content: "";
    display: block;
    width: 240px; height: 4px;
    margin: 26px auto 0;
    background: linear-gradient(90deg, transparent, #ff1f5a, #f5c000, #00d8ff, transparent);
    box-shadow: 0 0 18px rgba(255, 31, 90, 0.55);
  }

  /* HEADLINE — backstory hook */
  .hook {
    position: absolute;
    top: 470px;
    left: 60px;
    right: 60px;
    text-align: left;
    font-family: "Inter", system-ui, sans-serif;
    font-weight: 800;
    line-height: 0.94;
    letter-spacing: -0.02em;
    text-transform: uppercase;
  }
  .hook .said {
    display: block;
    font-size: 118px;
    color: #ffffff;
    margin-bottom: 14px;
  }
  .hook .couldnt {
    display: block;
    font-size: 118px;
    color: #f0f0f5;
    position: relative;
    margin-bottom: 38px;
  }
  .hook .couldnt::after {
    content: "";
    position: absolute;
    left: -8px; right: -8px;
    top: 50%;
    height: 12px;
    background: linear-gradient(90deg, #ff1f5a, #ff7aa6);
    transform: skewY(-2deg);
    box-shadow: 0 0 22px rgba(255, 31, 90, 0.6);
  }
  .hook .wrong {
    display: block;
    font-size: 196px;
    font-weight: 900;
    line-height: 0.92;
    letter-spacing: -0.03em;
    color: #f5c000;
    text-shadow: 0 0 60px rgba(245, 192, 0, 0.35);
  }
  .hook .wrong .period { color: #ff1f5a; }

  /* Pivot block — the act of building */
  .pivot {
    position: absolute;
    top: 1170px;
    left: 60px; right: 60px;
    font-family: "Inter", system-ui, sans-serif;
    font-weight: 800;
    font-size: 96px;
    line-height: 0.98;
    letter-spacing: -0.02em;
    color: #ffffff;
    text-transform: uppercase;
  }
  .pivot .small {
    display: block;
    font-family: "JetBrains Mono", monospace;
    font-size: 26px;
    letter-spacing: 0.28em;
    color: #00e676;
    margin-bottom: 20px;
    font-weight: 500;
    text-transform: uppercase;
  }
  .pivot .built {
    background: linear-gradient(135deg, #ff1f5a 0%, #7c3aed 50%, #00d8ff 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
  }

  /* Floating chips — the proof points */
  .chip {
    position: absolute;
    font-family: "JetBrains Mono", monospace;
    font-size: 20px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    padding: 10px 18px;
    border-radius: 999px;
    background: rgba(255, 31, 90, 0.18);
    color: #ffd9e8;
    border: 1px solid rgba(255, 31, 90, 0.45);
    font-weight: 700;
  }
  .chip.c1 { top: 1075px; right: 70px; transform: rotate(6deg); }
  .chip.c2 {
    top: 1108px; left: 60px; transform: rotate(-4deg);
    background: rgba(245, 192, 0, 0.16);
    color: #ffe89a;
    border-color: rgba(245, 192, 0, 0.5);
  }

  /* Subhead band — the offer */
  .subhead {
    position: absolute;
    bottom: 280px;
    left: 60px; right: 60px;
    padding: 38px 44px;
    background: linear-gradient(135deg, rgba(40, 24, 30, 0.88), rgba(20, 16, 28, 0.6));
    border: 1px solid rgba(245, 192, 0, 0.35);
    border-radius: 22px;
    backdrop-filter: blur(8px);
  }
  .subhead .label {
    font-family: "JetBrains Mono", monospace;
    font-size: 22px;
    letter-spacing: 0.3em;
    color: #ffd9e8;
    text-transform: uppercase;
    margin-bottom: 14px;
    font-weight: 500;
  }
  .subhead .price {
    font-family: "Inter", system-ui, sans-serif;
    font-weight: 900;
    font-size: 78px;
    line-height: 1;
    letter-spacing: -0.015em;
    color: #ffffff;
    display: flex;
    align-items: baseline;
    gap: 22px;
    flex-wrap: wrap;
  }
  .subhead .price .amount {
    background: linear-gradient(135deg, #ff1f5a, #f5c000);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
  }
  .subhead .price .sep {
    width: 8px; height: 8px;
    background: #f5c000;
    box-shadow: 0 0 16px #f5c000;
    border-radius: 50%;
    transform: translateY(-14px);
  }
  .subhead .price .lifetime {
    font-size: 62px;
    color: #ffffff;
    font-weight: 800;
  }

  /* CTA strip */
  .cta {
    position: absolute;
    bottom: 110px;
    left: 60px; right: 60px;
    display: flex; align-items: center; justify-content: space-between;
    font-family: "JetBrains Mono", monospace;
    text-transform: uppercase;
  }
  .cta .url {
    font-size: 34px;
    letter-spacing: 0.2em;
    color: #ffffff;
    font-weight: 700;
  }
  .cta .url .dot { color: #ff1f5a; }
  .cta .badge {
    font-size: 22px;
    letter-spacing: 0.3em;
    color: #050505;
    background: #00e676;
    box-shadow: 0 0 22px rgba(0, 230, 118, 0.55);
    padding: 14px 22px;
    border-radius: 999px;
    font-weight: 700;
  }

  /* Bottom edge glow bar — full RHYTHMIX spectrum */
  .edge {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 6px;
    background: linear-gradient(90deg, #ff1f5a, #f5c000 30%, #00e676 60%, #00d8ff);
    box-shadow: 0 0 30px rgba(255, 31, 90, 0.5);
  }
</style>
</head>
<body>
  <div class="poster">
    <div class="grid"></div>
    <div class="scan"></div>

    <div class="eyebrow">
      <span class="left"><span class="dot"></span>BACKSTORY // 60s</span>
      <span class="right">ONE iPHONE</span>
    </div>

    <div class="wordmark">RHYTHMIX</div>

    <div class="hook">
      <span class="said">Everyone said</span>
      <span class="couldnt">it couldn&apos;t be done.</span>
      <span class="wrong">They were<br/>wrong<span class="period">.</span></span>
    </div>

    <div class="chip c1">22 AI Tools</div>
    <div class="chip c2">Built on iPhone</div>

    <div class="pivot">
      <span class="small">ONE PERSON —</span>
      <span class="built">Built RHYTHMIX.</span>
    </div>

    <div class="subhead">
      <div class="label">A COMPLETE AI MUSIC PLATFORM</div>
      <div class="price">
        <span class="amount">AU$149</span>
        <span class="sep"></span>
        <span class="lifetime">Lifetime.</span>
      </div>
    </div>

    <div class="cta">
      <div class="url">RHYTHMIX<span class="dot">.</span>APP<span class="dot">.</span>AU</div>
      <div class="badge">100% To Artist</div>
    </div>

    <div class="noise"></div>
    <div class="edge"></div>
  </div>
</body>
</html>
