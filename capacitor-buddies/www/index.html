<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>50 Buddy Apps</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #060912;
      color: #f0f0f0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      text-align: center;
      max-width: 600px;
    }
    h1 { font-size: 28px; margin-bottom: 16px; }
    p { font-size: 16px; margin-bottom: 24px; color: #a0a0a0; }
    .button {
      display: inline-block;
      padding: 16px 32px;
      background: linear-gradient(135deg, rgba(100,200,255,0.2), rgba(200,100,255,0.2));
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 12px;
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      transition: all 0.3s ease;
      cursor: pointer;
    }
    .button:hover {
      background: linear-gradient(135deg, rgba(100,200,255,0.3), rgba(200,100,255,0.3));
      border-color: rgba(255,255,255,0.4);
    }
  </style>
  <script>
    window.addEventListener('load', () => {
      setTimeout(() => {
        window.location.href = 'apps/buddies.html';
      }, 500);
    });
  </script>
</head>
<body>
  <div class="container">
    <h1>🤝 50 Buddy Apps</h1>
    <p>Loading your personalized companion apps...</p>
    <button class="button" onclick="window.location.href='apps/buddies.html'">Continue</button>
  </div>
</body>
</html>
