<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <!-- Shot 18: Superpower 1 — Hyperfocus (6:30–7:00) -->

  <!-- Deep concentration background (dark, focused) -->
  <rect width="1920" height="1080" fill="#0a0a2a"/>

  <!-- Tunnel vision vignette (only center sharp) -->
  <defs>
    <radialGradient id="hyperfocus-tunnel" cx="50%" cy="50%" r="45%">
      <stop offset="0%" style="stop-color:#000;stop-opacity:0"/>
      <stop offset="70%" style="stop-color:#000;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#000;stop-opacity:0.8"/>
    </radialGradient>
  </defs>
  <circle cx="960" cy="540" r="800" fill="url(#hyperfocus-tunnel)"/>

  <!-- Ziggy (sharp, intense focus, eyes locked forward) -->
  <circle cx="960" cy="540" r="100" fill="#a89a7a" stroke="#0052CC" stroke-width="4" opacity="1"/>

  <!-- Hair (slicked back by intensity, still asymmetrical) -->
  <path d="M 880 460 Q 900 440 920 435 Q 950 430 980 435 Q 1000 440 1020 460" fill="#3d2817" opacity="1"/>
  <g stroke="#0052CC" stroke-width="3" fill="none" opacity="0.9">
    <line x1="890" y1="450" x2="880" y2="410"/>
    <line x1="960" y1="430" x2="960" y2="390"/>
    <line x1="1030" y1="450" x2="1040" y2="410"/>
  </g>

  <!-- Eyes (hyperfocused, laser-sharp, Electric Blue intense) -->
  <ellipse cx="930" cy="535" rx="24" ry="28" fill="#0052CC" stroke="#0052CC" stroke-width="2"/>
  <ellipse cx="990" cy="535" rx="24" ry="28" fill="#0052CC" stroke="#0052CC" stroke-width="2"/>
  <!-- Pupils (tiny, locked) -->
  <circle cx="930" cy="540" r="5" fill="#000" opacity="1"/>
  <circle cx="990" cy="540" r="5" fill="#000" opacity="1"/>
  <!-- Highlights (sharp focus light) -->
  <circle cx="935" cy="535" r="4" fill="#ffffff" opacity="1"/>
  <circle cx="995" cy="535" r="4" fill="#ffffff" opacity="1"/>

  <!-- Expression (intense, determined) -->
  <path d="M 920 570 Q 960 575 1000 570" stroke="#3d2817" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- SURGE hoodie (glowing Electric Blue, fully charged) -->
  <rect x="870" y="630" width="180" height="130" fill="#0052CC" stroke="#0052CC" stroke-width="4" rx="20" opacity="1"/>
  <!-- Orange accent doubled for intensity -->
  <rect x="890" y="650" width="140" height="10" fill="#FF8C3A" opacity="1"/>
  <rect x="890" y="720" width="140" height="6" fill="#FF8C3A" opacity="0.8"/>

  <!-- Focus beam (straight down from eyes) -->
  <g stroke="#0052CC" stroke-width="8" fill="none" opacity="0.9">
    <line x1="930" y1="565" x2="930" y2="800"/>
    <line x1="990" y1="565" x2="990" y2="800"/>
  </g>

  <!-- Sharp clarity radius (everything outside is blurred/irrelevant) -->
  <circle cx="960" cy="540" r="180" fill="none" stroke="#0052CC" stroke-width="2" opacity="0.7" stroke-dasharray="8,4"/>

  <!-- Text/visual elements in focus area (sharp, readable) -->
  <text x="600" y="900" font-family="monospace" font-size="14" fill="#0052CC" opacity="0.9" font-weight="bold">
    HYPERFOCUS ACTIVATED | Sharp pattern recognition | 100% concentration
  </text>

  <!-- Blurred background elements (to show tunnel effect) -->
  <g opacity="0.1" filter="url(#blur)">
    <rect x="100" y="200" width="200" height="150" fill="#4a4a5a"/>
    <circle cx="1700" cy="300" r="60" fill="#a89a7a"/>
  </g>

  <!-- Blur filter definition -->
  <defs>
    <filter id="blur">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8"/>
    </filter>
  </defs>

  <!-- Power indicator (90% charged) -->
  <rect x="50" y="50" width="400" height="40" fill="#0a0a2a" stroke="#0052CC" stroke-width="3" rx="4"/>
  <rect x="60" y="60" width="360" height="20" fill="#0052CC" opacity="0.8" rx="2"/>
  <rect x="60" y="60" width="324" height="20" fill="#0052CC" opacity="1" rx="2"/>
  <text x="480" y="85" font-family="Arial" font-size="16" fill="#0052CC" font-weight="bold">
    HYPERFOCUS: 90%
  </text>
</svg>
