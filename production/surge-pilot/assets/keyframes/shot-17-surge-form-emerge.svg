<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <!-- Shot 17: SURGE Form Emergence (6:00–6:30) -->

  <!-- Electric Blue dominant background -->
  <rect width="1920" height="1080" fill="#0052CC" opacity="0.3"/>
  <!-- Dark space (otherworldly) -->
  <rect width="1920" height="1080" fill="#1a1a3a"/>

  <!-- Ziggy body (transforming, more confident) -->
  <circle cx="960" cy="540" r="110" fill="#a89a7a" stroke="#0052CC" stroke-width="4" opacity="0.95"/>

  <!-- Hair (still asymmetrical but now glowing Electric Blue) -->
  <path d="M 870 450 Q 890 410 910 400 Q 950 390 990 400 Q 1010 410 1030 450" fill="#3d2817" opacity="0.95"/>
  <g stroke="#0052CC" stroke-width="2" fill="none" opacity="0.8">
    <path d="M 880 440 Q 890 420 900 410"/>
    <path d="M 960 390 Q 970 370 975 350"/>
    <path d="M 1040 440 Q 1050 420 1060 410"/>
  </g>

  <!-- Eyes (Electric Blue, now luminous) -->
  <circle cx="930" cy="530" r="20" fill="#0052CC" stroke="#0052CC" stroke-width="2"/>
  <circle cx="990" cy="530" r="20" fill="#0052CC" stroke="#0052CC" stroke-width="2"/>
  <!-- Core light -->
  <circle cx="930" cy="530" r="12" fill="#ffffff" opacity="0.9"/>
  <circle cx="990" cy="530" r="12" fill="#ffffff" opacity="0.9"/>
  <!-- Glow effect around eyes -->
  <circle cx="930" cy="530" r="30" fill="#0052CC" opacity="0.3"/>
  <circle cx="990" cy="530" r="30" fill="#0052CC" opacity="0.3"/>

  <!-- Hoodie (Electric Blue, now part of SURGE form) -->
  <rect x="870" y="620" width="180" height="140" fill="#0052CC" stroke="#0052CC" stroke-width="3" rx="20" opacity="0.9"/>
  <!-- Orange accent stripe (signature) -->
  <rect x="900" y="630" width="120" height="8" fill="#FF8C3A" opacity="0.95"/>

  <!-- Body aura (Electric Blue glow) -->
  <circle cx="960" cy="540" r="150" fill="#0052CC" opacity="0.2"/>
  <circle cx="960" cy="540" r="200" fill="#0052CC" opacity="0.1"/>

  <!-- Socks visible (one blue up, one orange down) -->
  <circle cx="920" cy="760" r="12" fill="#0052CC" opacity="0.9"/>
  <circle cx="1000" cy="760" r="12" fill="#FF8C3A" opacity="0.9"/>

  <!-- Arms (extended, ready for action) -->
  <g opacity="0.9">
    <rect x="780" y="600" width="90" height="60" fill="#c9a881" stroke="#0052CC" stroke-width="2" rx="8"/>
    <rect x="1050" y="600" width="90" height="60" fill="#c9a881" stroke="#0052CC" stroke-width="2" rx="8"/>
    <!-- Hands (Electric Blue outline) -->
    <circle cx="780" cy="660" r="20" fill="#c9a881" stroke="#0052CC" stroke-width="2"/>
    <circle cx="1140" cy="660" r="20" fill="#c9a881" stroke="#0052CC" stroke-width="2"/>
  </g>

  <!-- Energy waves (transformation happening) -->
  <g stroke="#0052CC" stroke-width="3" fill="none" opacity="0.8">
    <path d="M 600 540 Q 700 400 800 540"/>
    <path d="M 1120 540 Q 1220 400 1320 540"/>
    <path d="M 700 200 Q 800 300 900 250"/>
    <path d="M 1220 200 Q 1120 300 1020 250"/>
  </g>

  <!-- Transformation particles (Electric Blue sparkles) -->
  <g fill="#0052CC" opacity="0.8">
    <circle cx="700" cy="300" r="3"/>
    <circle cx="1220" cy="320" r="3"/>
    <circle cx="850" cy="250" r="2"/>
    <circle cx="1070" cy="270" r="2"/>
    <circle cx="950" cy="200" r="4"/>
    <circle cx="1200" cy="650" r="3"/>
    <circle cx="700" cy="700" r="2"/>
  </g>

  <!-- Interior monologue (growing realization) -->
  <text x="300" y="900" font-family="Caveat, cursive" font-size="44" fill="#0052CC" opacity="1" font-weight="bold">
    This is... me. This is who I am.
  </text>

  <!-- Power indicator (building) -->
  <rect x="50" y="50" width="400" height="40" fill="#1a1a3a" stroke="#0052CC" stroke-width="2" rx="4"/>
  <rect x="60" y="60" width="360" height="20" fill="#0052CC" opacity="0.7" rx="2"/>
  <!-- Fill 60% -->
  <rect x="60" y="60" width="216" height="20" fill="#0052CC" opacity="0.95" rx="2"/>
  <text x="480" y="85" font-family="Arial" font-size="16" fill="#0052CC" font-weight="bold">
    SURGE Activation: 60%
  </text>
</svg>
