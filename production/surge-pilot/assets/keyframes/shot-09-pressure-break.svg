<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <!-- Shot 9: Pressure Break / Shutdown Moment (5:00–5:30) — Transition to Shame -->

  <!-- Fading classroom reality -->
  <rect width="1920" height="1080" fill="#1a1a2a" opacity="0.8"/>
  <rect width="1920" height="1080" fill="#2a1a2a" opacity="0.7"/>

  <!-- Burgundy shame color bleeding in -->
  <rect width="1920" height="1080" fill="#5D1E3B" opacity="0.25"/>

  <!-- Ziggy's face (close-up, eyes beginning to shut, overwhelmed) -->
  <circle cx="960" cy="540" r="120" fill="#8a7060" stroke="#3d2817" stroke-width="4"/>

  <!-- Hair (limp, losing structure from Act 1) -->
  <path d="M 880 440 Q 900 400 920 390 Q 950 380 980 390 Q 1000 400 1020 440" fill="#3d2817" opacity="0.8"/>
  <path d="M 890 430 Q 920 390 960 380 Q 1000 390 1030 430" fill="#3d2817" opacity="0.7"/>

  <!-- Eyes (wide, pupils dilating with fear, then constricting into shutdown) -->
  <!-- Left eye -->
  <ellipse cx="920" cy="520" rx="22" ry="26" fill="#ffffff" stroke="#3d2817" stroke-width="2" opacity="0.9"/>
  <circle cx="920" cy="530" r="12" fill="#000" opacity="0.8"/>
  <!-- Right eye -->
  <ellipse cx="1000" cy="520" rx="22" ry="26" fill="#ffffff" stroke="#3d2817" stroke-width="2" opacity="0.9"/>
  <circle cx="1000" cy="530" r="12" fill="#000" opacity="0.8"/>

  <!-- Eyebrows (furrowed, stressed) -->
  <path d="M 900 500 Q 920 485 940 500" stroke="#3d2817" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 980 500 Q 1000 485 1020 500" stroke="#3d2817" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Mouth (opening, shock/dissociation beginning) -->
  <ellipse cx="960" cy="575" rx="25" ry="20" fill="#5d4535" stroke="#3d2817" stroke-width="2" opacity="0.9"/>
  <!-- Inner mouth darkness (shutdown void) -->
  <ellipse cx="960" cy="575" rx="18" ry="14" fill="#1a0a0a" opacity="0.8"/>

  <!-- Pressure waves still radiating but fragmenting (losing coherence) -->
  <g stroke="#ff9999" stroke-width="3" fill="none" opacity="0.6">
    <path d="M 960 420 Q 900 300 850 200" stroke-dasharray="5,5"/>
    <path d="M 960 420 Q 1020 300 1070 200" stroke-dasharray="5,5"/>
    <path d="M 960 660 Q 900 800 850 900" stroke-dasharray="5,5"/>
    <path d="M 960 660 Q 1020 800 1070 900" stroke-dasharray="5,5"/>
  </g>

  <!-- Concentric pressure circles (still present but collapsing inward) -->
  <g stroke="#ff6666" stroke-width="2" fill="none" opacity="0.5">
    <circle cx="960" cy="540" r="100"/>
    <circle cx="960" cy="540" r="150"/>
    <circle cx="960" cy="540" r="200"/>
  </g>

  <!-- Shame color wash beginning (burgundy tint increasing) -->
  <rect width="1920" height="1080" fill="#5D1E3B" opacity="0.35"/>

  <!-- Body language shift (shoulders tensing, closing in) -->
  <g opacity="0.7">
    <!-- Left shoulder -->
    <path d="M 850 650 Q 880 680 900 700" stroke="#3d2817" stroke-width="8" fill="none" stroke-linecap="round"/>
    <!-- Right shoulder -->
    <path d="M 1070 650 Q 1040 680 1020 700" stroke="#3d2817" stroke-width="8" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Interior monologue (fractured, stuttering) -->
  <text x="300" y="300" font-family="Caveat, cursive" font-size="42" fill="#0052CC" opacity="0.9" font-weight="bold">
    I can't... I can't...
  </text>

  <!-- Classroom (now completely faded, irrelevant) -->
  <g opacity="0.08">
    <circle cx="300" cy="300" r="40" fill="#a89a7a"/>
    <circle cx="1600" cy="350" r="40" fill="#a89a7a"/>
  </g>

  <!-- Breathing indicator (visible but slowing, shallow) -->
  <circle cx="960" cy="750" r="4" fill="#8a7060" opacity="0.6"/>
  <text x="980" y="760" font-family="Arial" font-size="14" fill="#8a7060" opacity="0.5">
    [shallow breathing]
  </text>

  <!-- Vignette effect intensifying (tunnel vision / dissociation) -->
  <defs>
    <radialGradient id="vignette-break" cx="50%" cy="50%" r="55%">
      <stop offset="0%" style="stop-color:#1a1a2a;stop-opacity:0"/>
      <stop offset="100%" style="stop-color:#1a1a2a;stop-opacity:0.7"/>
    </radialGradient>
  </defs>
  <circle cx="960" cy="540" r="800" fill="url(#vignette-break)"/>

  <!-- Pressure gauge (still maxed, but color shifting to burgundy shame) -->
  <rect x="50" y="50" width="300" height="30" fill="#4a4a5a" stroke="#2d2d3d" stroke-width="2" rx="4"/>
  <rect x="55" y="55" width="270" height="20" fill="#5D1E3B" opacity="0.8" rx="2"/>
  <text x="370" y="75" font-family="Arial" font-size="16" fill="#5D1E3B" font-weight="bold">
    SHAME CYCLE TRIGGERED
  </text>
</svg>
