<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <!-- Shot 1: Classroom Establishing (Cool Desaturated Reality Mode) -->

  <!-- Background -->
  <rect width="1920" height="1080" fill="#f5f5f5"/>

  <!-- Wall panels (light gray) -->
  <rect x="0" y="0" width="1920" height="720" fill="#e8e8e8"/>

  <!-- Fluorescent ceiling lights -->
  <rect x="200" y="20" width="280" height="40" fill="#e0e8f0" stroke="#b0b8c8" stroke-width="3" rx="4"/>
  <circle cx="260" cy="40" r="8" fill="#f0f8ff" opacity="0.8"/>
  <circle cx="340" cy="40" r="8" fill="#f0f8ff" opacity="0.8"/>

  <rect x="700" y="20" width="280" height="40" fill="#e0e8f0" stroke="#b0b8c8" stroke-width="3" rx="4"/>
  <circle cx="760" cy="40" r="8" fill="#f0f8ff" opacity="0.8"/>
  <circle cx="840" cy="40" r="8" fill="#f0f8ff" opacity="0.8"/>

  <rect x="1300" y="20" width="280" height="40" fill="#e0e8f0" stroke="#b0b8c8" stroke-width="3" rx="4"/>
  <circle cx="1360" cy="40" r="8" fill="#f0f8ff" opacity="0.8"/>
  <circle cx="1440" cy="40" r="8" fill="#f0f8ff" opacity="0.8"/>

  <!-- Windows (left side) -->
  <rect x="50" y="100" width="120" height="400" fill="#c8dff8" stroke="#5d8fbf" stroke-width="4"/>
  <line x1="110" y1="100" x2="110" y2="500" stroke="#5d8fbf" stroke-width="2"/>
  <line x1="50" y1="250" x2="170" y2="250" stroke="#5d8fbf" stroke-width="2"/>

  <!-- Teacher's desk (front of room) -->
  <rect x="800" y="550" width="320" height="180" fill="#c4a87d" stroke="#8b7355" stroke-width="3" rx="6"/>
  <rect x="820" y="560" width="280" height="140" fill="#dab899" stroke="#8b7355" stroke-width="2"/>

  <!-- Student desks (rows) -->
  <!-- Row 1 -->
  <rect x="200" y="380" width="100" height="80" fill="#d4c5b9" stroke="#8b7355" stroke-width="2" rx="2"/>
  <rect x="380" y="380" width="100" height="80" fill="#d4c5b9" stroke="#8b7355" stroke-width="2" rx="2"/>
  <rect x="560" y="380" width="100" height="80" fill="#d4c5b9" stroke="#8b7355" stroke-width="2" rx="2"/>
  <rect x="740" y="380" width="100" height="80" fill="#d4c5b9" stroke="#8b7355" stroke-width="2" rx="2"/>

  <!-- Row 2 -->
  <rect x="200" y="550" width="100" height="80" fill="#d4c5b9" stroke="#8b7355" stroke-width="2" rx="2"/>
  <rect x="380" y="550" width="100" height="80" fill="#d4c5b9" stroke="#8b7355" stroke-width="2" rx="2"/>
  <rect x="560" y="550" width="100" height="80" fill="#d4c5b9" stroke="#8b7355" stroke-width="2" rx="2"/>
  <rect x="740" y="550" width="100" height="80" fill="#d4c5b9" stroke="#8b7355" stroke-width="2" rx="2"/>

  <!-- Bulletin board (back wall) -->
  <rect x="1100" y="150" width="400" height="300" fill="#8b6f4d" stroke="#5d4e3f" stroke-width="3" rx="4"/>
  <rect x="1120" y="170" width="360" height="260" fill="#c4a87d"/>

  <!-- Teacher (standing at front, back view) -->
  <!-- Head -->
  <circle cx="920" cy="480" r="24" fill="#d4a574" stroke="#8b7355" stroke-width="2"/>
  <!-- Hair (short) -->
  <path d="M 896 456 Q 896 432 920 432 Q 944 432 944 456" fill="#8b6f4d" stroke="#5d4e3f" stroke-width="2"/>
  <!-- Body -->
  <rect x="896" y="510" width="48" height="70" fill="#6b5d4f" stroke="#3d3530" stroke-width="2" rx="4"/>
  <!-- Arms -->
  <rect x="860" y="520" width="36" height="20" fill="#d4a574" stroke="#8b7355" stroke-width="2" rx="8"/>
  <rect x="944" y="520" width="36" height="20" fill="#d4a574" stroke="#8b7355" stroke-width="2" rx="8"/>

  <!-- Mood text (morning calm before anxiety) -->
  <text x="960" y="850" font-family="Inter, sans-serif" font-size="32" fill="#8b8b8b">Morning. The classroom is quiet.</text>
</svg>
