<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <!-- Shot 21: Full SURGE Form Revealed (8:00–8:30) -->

  <!-- Powerful background (all colors active) -->
  <defs>
    <radialGradient id="surge-full" cx="50%" cy="50%" r="70%">
      <stop offset="0%" style="stop-color:#0052CC;stop-opacity:0.3"/>
      <stop offset="40%" style="stop-color:#FF8C3A;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#D8B5E6;stop-opacity:0.15"/>
    </radialGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#surge-full)"/>
  <rect width="1920" height="1080" fill="#1a1a3a" opacity="0.4"/>

  <!-- Full-body SURGE form (powerful, confident) -->
  <!-- Head -->
  <circle cx="960" cy="380" r="110" fill="#a89a7a" stroke="#0052CC" stroke-width="5" opacity="1"/>

  <!-- Hair (now stylized, superhero asymmetry) -->
  <path d="M 870 290 Q 880 260 900 250 Q 950 240 1000 250 Q 1020 260 1050 290" fill="#3d2817" opacity="1"/>
  <!-- Speed lines in hair -->
  <g stroke="#0052CC" stroke-width="3" fill="none" opacity="0.8">
    <line x1="860" y1="280" x2="800" y2="240"/>
    <line x1="960" y1="240" x2="960" y2="190"/>
    <line x1="1060" y1="280" x2="1120" y2="240"/>
  </g>

  <!-- Eyes (fully charged, radiating power) -->
  <circle cx="930" cy="370" r="24" fill="#0052CC" stroke="#0052CC" stroke-width="3"/>
  <circle cx="990" cy="370" r="24" fill="#0052CC" stroke="#0052CC" stroke-width="3"/>
  <!-- Pupils (laser-focused) -->
  <circle cx="930" cy="375" r="8" fill="#000" opacity="1"/>
  <circle cx="990" cy="375" r="8" fill="#000" opacity="1"/>
  <!-- Highlights (brilliant, confident) -->
  <circle cx="935" cy="365" r="5" fill="#ffffff" opacity="1"/>
  <circle cx="995" cy="365" r="5" fill="#ffffff" opacity="1"/>
  <!-- Glow aura around eyes -->
  <circle cx="930" cy="370" r="40" fill="#0052CC" opacity="0.25"/>
  <circle cx="990" cy="370" r="40" fill="#0052CC" opacity="0.25"/>

  <!-- Expression (powerful, heroic smile) -->
  <path d="M 910 410 Q 960 425 1010 410" stroke="#3d2817" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Body (powerful stance) -->
  <rect x="840" y="490" width="240" height="200" fill="#0052CC" stroke="#0052CC" stroke-width="4" rx="30" opacity="1"/>

  <!-- SURGE costume details (three-color design) -->
  <!-- Electric Blue base -->
  <!-- Orange stripe 1 (chest) -->
  <rect x="870" y="520" width="180" height="15" fill="#FF8C3A" opacity="1"/>
  <!-- Lavender accent stripe -->
  <rect x="870" y="585" width="180" height="12" fill="#D8B5E6" opacity="0.9"/>
  <!-- Orange stripe 2 (lower) -->
  <rect x="870" y="660" width="180" height="12" fill="#FF8C3A" opacity="0.9"/>

  <!-- Arms (powerful, ready) -->
  <g opacity="1">
    <!-- Left arm -->
    <rect x="720" y="540" width="120" height="80" fill="#c9a881" stroke="#0052CC" stroke-width="3" rx="12" opacity="1"/>
