    <circle cx="700" cy="660" r="28" fill="#c9a881" stroke="#0052CC" stroke-width="3"/>
    <!-- Power glow around hand -->
    <circle cx="700" cy="660" r="45" fill="#0052CC" opacity="0.2"/>

    <!-- Right arm -->
    <rect x="1080" y="540" width="120" height="80" fill="#c9a881" stroke="#0052CC" stroke-width="3" rx="12" opacity="1"/>
    <!-- Hand -->
    <circle cx="1220" cy="660" r="28" fill="#c9a881" stroke="#0052CC" stroke-width="3"/>
    <!-- Power glow around hand -->
    <circle cx="1220" cy="660" r="45" fill="#0052CC" opacity="0.2"/>
  </g>

  <!-- Legs (powerful stance) -->
  <g opacity="1">
    <!-- Left leg -->
    <rect x="870" y="690" width="60" height="140" fill="#c9a881" stroke="#0052CC" stroke-width="2" rx="8"/>
    <!-- Left foot -->
    <ellipse cx="900" cy="840" rx="40" ry="24" fill="#4a4a4a" stroke="#0052CC" stroke-width="2"/>

    <!-- Right leg -->
    <rect x="1030" y="690" width="60" height="140" fill="#c9a881" stroke="#0052CC" stroke-width="2" rx="8"/>
    <!-- Right foot -->
