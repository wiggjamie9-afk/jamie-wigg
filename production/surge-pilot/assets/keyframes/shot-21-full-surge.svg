  <!-- Radiating energy (power burst) -->
  <g stroke="#0052CC" stroke-width="3" fill="none" opacity="0.7">
    <circle cx="960" cy="580" r="180" stroke-dasharray="10,5"/>
    <circle cx="960" cy="580" r="250" stroke-dasharray="10,5" opacity="0.5"/>
    <circle cx="960" cy="580" r="320" stroke-dasharray="10,5" opacity="0.3"/>
