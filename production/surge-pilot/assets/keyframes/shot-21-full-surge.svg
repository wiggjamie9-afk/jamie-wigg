  </g>

  <!-- Signature socks (one blue up, one orange down) -->
  <circle cx="900" cy="690" r="14" fill="#0052CC" opacity="0.95"/>
  <circle cx="1060" cy="690" r="14" fill="#FF8C3A" opacity="0.95"/>

  <!-- Full-body power aura (all three colors) -->
  <g opacity="0.6">
