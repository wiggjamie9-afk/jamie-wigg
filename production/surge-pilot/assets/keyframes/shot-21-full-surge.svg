  <!-- Power indicator (ALL SYSTEMS 100%) -->
  <rect x="50" y="50" width="600" height="50" fill="#1a1a3a" stroke="#0052CC" stroke-width="4" rx="4"/>
  <rect x="70" y="70" width="560" height="30" fill="#0052CC" opacity="0.8" rx="2"/>
  <rect x="70" y="70" width="560" height="30" fill="#0052CC" opacity="1" rx="2"/>
  <text x="750" y="105" font-family="Arial" font-size="20" fill="#0052CC" font-weight="bold">
    HYPERFOCUS: 100% | SPEED: 100% | EMPATHY: 100% | SURGE ACTIVE ⚡
