<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <!-- Shot 22: Power Montage (8:30–9:00) — Superpowers in Action -->

  <!-- Dynamic action background -->
  <rect width="1920" height="1080" fill="#0052CC" opacity="0.2"/>
  <rect width="1920" height="1080" fill="#1a1a3a"/>

  <!-- Three-way split visualization (montage style) -->

  <!-- SECTION 1: HYPERFOCUS (Top-Left) -->
  <g opacity="0.95">
    <!-- Frame background -->
    <rect x="50" y="50" width="600" height="320" fill="#0a0a2a" stroke="#0052CC" stroke-width="3" rx="8"/>

    <!-- Tunnel vision effect -->
    <circle cx="350" cy="210" r="120" fill="#0052CC" opacity="0.3"/>

    <!-- Ziggy in focus state (small) -->
    <circle cx="350" cy="210" r="50" fill="#a89a7a" stroke="#0052CC" stroke-width="2" opacity="1"/>
    <!-- Eyes locked -->
    <circle cx="335" cy="200" r="6" fill="#0052CC" opacity="1"/>
    <circle cx="365" cy="200" r="6" fill="#0052CC" opacity="1"/>

    <!-- Focus beam -->
    <line x1="350" y1="260" x2="350" y2="320" stroke="#0052CC" stroke-width="4" opacity="0.8"/>

    <!-- Text: HYPERFOCUS -->
    <text x="350" y="360" font-family="Arial" font-size="18" fill="#0052CC" text-anchor="middle" font-weight="bold">
      HYPERFOCUS
    </text>
    <text x="350" y="385" font-family="Arial" font-size="12" fill="#0052CC" text-anchor="middle" opacity="0.8">
      100% concentration
    </text>
  </g>

  <!-- SECTION 2: SPEED (Top-Right) -->
  <g opacity="0.95">
    <!-- Frame background -->
    <rect x="1270" y="50" width="600" height="320" fill="#0a0a2a" stroke="#FF8C3A" stroke-width="3" rx="8"/>

    <!-- Speed lines -->
    <g stroke="#FF8C3A" stroke-width="2" fill="none" opacity="0.7">
      <line x1="1350" y1="150" x2="1450" y2="150"/>
      <line x1="1340" y1="180" x2="1460" y2="180"/>
      <line x1="1350" y1="210" x2="1450" y2="210"/>
      <line x1="1345" y1="240" x2="1455" y2="240"/>
    </g>

    <!-- Ziggy in motion (blurred, multiple positions) -->
    <circle cx="1450" cy="210" r="45" fill="#a89a7a" opacity="0.6"/>
    <circle cx="1480" cy="210" r="42" fill="#a89a7a" opacity="0.4"/>
    <circle cx="1510" cy="210" r="40" fill="#a89a7a" opacity="0.2"/>
    <!-- Main Ziggy -->
    <circle cx="1420" cy="210" r="48" fill="#a89a7a" stroke="#FF8C3A" stroke-width="2" opacity="1"/>

    <!-- Eyes wide (speed) -->
    <circle cx="1408" cy="200" r="5" fill="#0052CC" opacity="1"/>
    <circle cx="1432" cy="200" r="5" fill="#0052CC" opacity="1"/>

    <!-- Text: SPEED -->
    <text x="1570" y="360" font-family="Arial" font-size="18" fill="#FF8C3A" text-anchor="middle" font-weight="bold">
      SPEED
    </text>
    <text x="1570" y="385" font-family="Arial" font-size="12" fill="#FF8C3A" text-anchor="middle" opacity="0.8">
      x100 processing power
    </text>
  </g>

  <!-- SECTION 3: EMPATHY (Bottom-Center) -->
  <g opacity="0.95">
    <!-- Frame background -->
    <rect x="660" y="410" width="600" height="320" fill="#0a0a2a" stroke="#D8B5E6" stroke-width="3" rx="8"/>

    <!-- Ziggy (center, radiating warmth) -->
    <circle cx="960" cy="570" r="55" fill="#a89a7a" stroke="#D8B5E6" stroke-width="2" opacity="1"/>

    <!-- Empathy hearts -->
    <g fill="#D8B5E6" opacity="0.8">
      <path d="M 960 510 Q 968 495 976 495 Q 984 495 984 503 Q 984 515 960 530 Q 936 515 936 503 Q 936 495 944 495 Q 952 495 960 510" transform="scale(0.6)"/>
      <path d="M 860 570 Q 868 555 876 555 Q 884 555 884 563 Q 884 575 860 590 Q 836 575 836 563 Q 836 555 844 555 Q 852 555 860 570" transform="scale(0.5)"/>
      <path d="M 1060 570 Q 1068 555 1076 555 Q 1084 555 1084 563 Q 1084 575 1060 590 Q 1036 575 1036 563 Q 1036 555 1044 555 Q 1052 555 1060 570" transform="scale(0.5)"/>
      <path d="M 960 650 Q 968 635 976 635 Q 984 635 984 643 Q 984 655 960 670 Q 936 655 936 643 Q 936 635 944 635 Q 952 635 960 650" transform="scale(0.6)"/>
    </g>

    <!-- Connection lines to others -->
    <g stroke="#D8B5E6" stroke-width="1" fill="none" opacity="0.6">
      <line x1="820" y1="570" x2="900" y2="570"/>
      <line x1="1020" y1="570" x2="1100" y2="570"/>
      <line x1="960" y1="510" x2="960" y2="450"/>
      <line x1="960" y1="630" x2="960" y2="690"/>
    </g>

    <!-- Eyes (warm, open) -->
    <circle cx="945" cy="560" r="4" fill="#0052CC" opacity="1"/>
    <circle cx="975" cy="560" r="4" fill="#0052CC" opacity="1"/>

    <!-- Text: EMPATHY -->
    <text x="960" y="760" font-family="Arial" font-size="18" fill="#D8B5E6" text-anchor="middle" font-weight="bold">
      EMPATHY
    </text>
    <text x="960" y="785" font-family="Arial" font-size="12" fill="#D8B5E6" text-anchor="middle" opacity="0.8">
      Emotional connection x1000
    </text>
  </g>

  <!-- Central explosion effect (power moment) -->
  <g stroke="#FF8C3A" stroke-width="2" fill="none" opacity="0.6">
    <circle cx="960" cy="540" r="150" stroke-dasharray="8,4"/>
    <circle cx="960" cy="540" r="220" stroke-dasharray="8,4" opacity="0.4"/>
    <circle cx="960" cy="540" r="280" stroke-dasharray="8,4" opacity="0.2"/>
  </g>

  <!-- SURGE title (small, integrated) -->
  <text x="960" y="1020" font-family="Arial" font-size="24" fill="#0052CC" text-anchor="middle" font-weight="bold" opacity="0.9">
    SURGE: HYPERFOCUS + SPEED + EMPATHY = SUPERPOWER
  </text>
</svg>
