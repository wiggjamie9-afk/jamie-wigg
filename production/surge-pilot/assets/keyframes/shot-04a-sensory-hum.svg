<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <!-- Shot 4a: Sensory Montage - Fluorescent Hum (Overwhelming Shimmer) -->

  <!-- Dark background (sensory overload) -->
  <rect width="1920" height="1080" fill="#2a2a3e"/>

  <!-- Fluorescent light fixture (center, close-up) -->
  <rect x="400" y="200" width="1120" height="200" fill="#f0f8ff" stroke="#b8d0e8" stroke-width="6" rx="8"/>

  <!-- Inner light core (bright white-blue) -->
  <rect x="450" y="240" width="1020" height="120" fill="#ffffff" opacity="0.9"/>

  <!-- Shimmer/hum effect - animated wavy lines -->
  <!-- Horizontal shimmer waves -->
  <path d="M 0 350 Q 240 340 480 350 T 960 350 T 1440 350 T 1920 350"
        stroke="#e8f0ff" stroke-width="3" fill="none" opacity="0.6" stroke-dasharray="8,4"/>

  <path d="M 0 380 Q 240 370 480 380 T 960 380 T 1440 380 T 1920 380"
        stroke="#e8f0ff" stroke-width="2" fill="none" opacity="0.4" stroke-dasharray="6,6"/>

  <path d="M 0 410 Q 240 400 480 410 T 960 410 T 1440 410 T 1920 410"
        stroke="#e8f0ff" stroke-width="2" fill="none" opacity="0.5" stroke-dasharray="4,8"/>

  <!-- Concentric circles (hum effect) -->
  <circle cx="960" cy="300" r="100" fill="none" stroke="#e0e8f0" stroke-width="2" opacity="0.6"/>
  <circle cx="960" cy="300" r="150" fill="none" stroke="#e0e8f0" stroke-width="1.5" opacity="0.4"/>
  <circle cx="960" cy="300" r="200" fill="none" stroke="#e0e8f0" stroke-width="1" opacity="0.3"/>

  <!-- Radiating lines (shimmer) -->
  <g stroke="#f0f8ff" stroke-width="3" opacity="0.7">
    <line x1="960" y1="50" x2="960" y2="150"/>
    <line x1="960" y1="450" x2="960" y2="550"/>
    <line x1="700" y1="300" x2="800" y2="300"/>
    <line x1="1120" y1="300" x2="1220" y2="300"/>
    <line x1="780" y1="140" x2="850" y2="210"/>
    <line x1="1070" y1="210" x2="1140" y2="140"/>
    <line x1="780" y1="460" x2="850" y2="390"/>
    <line x1="1070" y1="390" x2="1140" y2="460"/>
  </g>

  <!-- Harsh bright spots (glare) -->
  <circle cx="600" cy="280" r="40" fill="#ffffff" opacity="0.8"/>
  <circle cx="1320" cy="280" r="40" fill="#ffffff" opacity="0.8"/>
  <circle cx="960" cy="180" r="35" fill="#ffffff" opacity="0.7"/>

  <!-- Overall shimmer overlay (animation ready) -->
  <rect width="1920" height="1080" fill="#f0f8ff" opacity="0.15"/>

  <!-- Sound wave indicators -->
  <g stroke="#d8e8f8" stroke-width="2" fill="none" opacity="0.5">
    <path d="M 300 700 Q 400 650 500 700"/>
    <path d="M 280 740 Q 400 670 520 740"/>
    <path d="M 320 740 Q 440 670 560 740"/>
    <path d="M 1400 700 Q 1500 650 1600 700"/>
    <path d="M 1380 740 Q 1500 670 1620 740"/>
    <path d="M 1440 740 Q 1560 670 1680 740"/>
  </g>

  <!-- Mood text -->
  <text x="960" y="950" font-family="Inter, sans-serif" font-size="40" fill="#e8f0ff" text-anchor="middle" opacity="0.8">
    The hum. So bright. So present.
  </text>
</svg>
