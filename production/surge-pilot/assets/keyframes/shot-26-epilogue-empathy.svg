<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <!-- Shot 26: Epilogue — Empathy Helping Someone Emotionally (10:30–11:00) -->

  <!-- Quiet bench / park setting -->
  <rect width="1920" height="1080" fill="#c8d8a8"/>

  <!-- Tree (calm, peaceful setting) -->
  <rect x="100" y="200" width="40" height="300" fill="#5a4a3a" opacity="0.7"/>
  <circle cx="120" cy="180" r="120" fill="#4a7a3a" opacity="0.6"/>

  <!-- Bench -->
  <rect x="400" y="600" width="400" height="60" fill="#8a7a6a" stroke="#3d2d1d" stroke-width="2" rx="4"/>

  <!-- Peer sitting alone (sad, isolated) -->
  <circle cx="500" cy="450" r="40" fill="#8a7a6a" stroke="#3d2d1d" stroke-width="2"/>
  <!-- Head down (sad) -->
  <!-- Tears/sadness indicators -->
  <g fill="#5a7a9a" opacity="0.7">
    <circle cx="490" cy="480" r="2"/>
    <circle cx="495" cy="500" r="2"/>
    <circle cx="510" cy="490" r="2"/>
    <circle cx="515" cy="510" r="2"/>
  </g>
  <!-- Posture (curled, alone) -->
  <path d="M 470 480 Q 500 520 530 510" stroke="#8a7a6a" stroke-width="4" fill="none" opacity="0.7"/>

  <!-- Ziggy approaching (warm, open, welcoming) -->
  <circle cx="700" cy="480" r="45" fill="#a89a7a" stroke="#D8B5E6" stroke-width="3" opacity="1"/>
  <!-- Eyes warm and open -->
  <circle cx="685" cy="470" r="6" fill="#0052CC" opacity="0.9"/>
  <circle cx="715" cy="470" r="6" fill="#0052CC" opacity="0.9"/>
  <!-- Smile (genuine, warm) -->
  <path d="M 680 495 Q 700 510 720 495" stroke="#3d2d1d" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Empathy connection (hearts, warmth) -->
  <g fill="#D8B5E6" opacity="0.75">
    <!-- Heart 1 (from Ziggy) -->
    <path d="M 660 420 Q 668 405 676 405 Q 684 405 684 413 Q 684 425 660 440 Q 636 425 636 413 Q 636 405 644 405 Q 652 405 660 420" transform="scale(0.5)"/>
    <!-- Heart 2 (to peer) -->
    <path d="M 550 420 Q 558 405 566 405 Q 574 405 574 413 Q 574 425 550 440 Q 526 425 526 413 Q 526 405 534 405 Q 542 405 550 420" transform="scale(0.5)"/>
  </g>

  <!-- Connection line (empathy bridge) -->
  <line x1="625" y1="470" x2="700" y2="470" stroke="#D8B5E6" stroke-width="2" opacity="0.6" stroke-dasharray="5,5"/>

  <!-- Result: Peer looking up (helped, comforted) -->
  <!-- Peer's face lifts -->
  <circle cx="500" cy="420" r="40" fill="#8a7a6a" stroke="#3d2d1d" stroke-width="2"/>
  <!-- Eyes up (hope) -->
  <circle cx="485" cy="410" r="4" fill="#000" opacity="0.9"/>
  <circle cx="515" cy="410" r="4" fill="#000" opacity="0.9"/>
  <!-- Smile (grateful) -->
  <path d="M 480 430 Q 500 445 520 430" stroke="#3d2d1d" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Hug/comfort (showing connection) -->
  <path d="M 600 460 Q 650 470 680 460" stroke="#D8B5E6" stroke-width="2" fill="none" opacity="0.6"/>

  <!-- Text: Impact -->
  <text x="800" y="600" font-family="Caveat, cursive" font-size="36" fill="#D8B5E6" opacity="0.95" font-weight="bold">
    "Thank you for understanding me..." — Peer finding hope
  </text>

  <!-- Time stamp -->
  <text x="50" y="1050" font-family="Arial" font-size="14" fill="#999" opacity="0.7">
    Late afternoon: Connected with someone who needed it
  </text>
</svg>
