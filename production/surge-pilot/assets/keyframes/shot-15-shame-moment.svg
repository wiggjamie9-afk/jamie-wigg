<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <!-- Shot 15: Shame Moment (Dissociation, Burgundy Color Cast) -->

  <!-- Desaturated grayscale background -->
  <rect width="1920" height="1080" fill="#4a4a4a"/>

  <!-- Burgundy color cast overlay -->
  <rect width="1920" height="1080" fill="#5D1E3B" opacity="0.4"/>

  <!-- Ziggy's face (close-up, dissociated) -->
  <!-- Head (slightly smaller due to dissociation perspective) -->
  <circle cx="960" cy="450" r="120" fill="#8a7060" stroke="#3d2817" stroke-width="4"/>

  <!-- Hair (limp, not moving) -->
  <path d="M 880 360 Q 900 320 920 300 Q 940 290 960 300 Q 985 310 980 360" fill="#3d2817"/>
  <path d="M 960 300 Q 980 270 1000 250 Q 1020 240 1040 270 Q 1030 330 1010 360" fill="#3d2817"/>

  <!-- Eyes (downcast, pupils constricted) -->
  <!-- Left eye -->
  <ellipse cx="905" cy="430" rx="20" ry="24" fill="#ffffff" stroke="#3d2817" stroke-width="2" opacity="0.9"/>
  <!-- Constricted pupil (small, staring down) -->
  <circle cx="905" cy="445" r="6" fill="#000" opacity="0.7"/>
  <!-- Right eye -->
  <ellipse cx="1015" cy="430" rx="20" ry="24" fill="#ffffff" stroke="#3d2817" stroke-width="2" opacity="0.9"/>
  <!-- Constricted pupil (small, staring down) -->
  <circle cx="1015" cy="445" r="6" fill="#000" opacity="0.7"/>

  <!-- Eyebrows (furrowed, tense) -->
  <path d="M 885 410 Q 905 400 925 410" stroke="#3d2817" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 995 410 Q 1015 400 1035 410" stroke="#3d2817" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Mouth (slightly open, shocked/embarrassed) -->
  <ellipse cx="960" cy="510" rx="28" ry="18" fill="#5d4535" stroke="#3d2817" stroke-width="2"/>

  <!-- Nose (simple line) -->
  <line x1="960" y1="420" x2="960" y2="480" stroke="#3d2817" stroke-width="3"/>

  <!-- Body (barely visible, dissociated) -->
  <rect x="880" y="570" width="160" height="120" fill="#5d5d5d" stroke="#3d2817" stroke-width="2" opacity="0.7" rx="4"/>

  <!-- Vignette effect (darkness closing in - dissociation visual) -->
  <defs>
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%" style="stop-color:#5D1E3B;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#3d1f2f;stop-opacity:0.6"/>
    </radialGradient>
  </defs>
  <circle cx="960" cy="540" r="700" fill="url(#vignette)"/>

  <!-- Dissociation indicators (subtle floating effect) -->
  <g opacity="0.3" stroke="#8a7060" stroke-width="1" fill="none" stroke-dasharray="3,3">
    <circle cx="950" cy="440" r="150"/>
    <circle cx="970" cy="440" r="180"/>
  </g>

  <!-- Subtle glitch effect (dissociation) -->
  <rect x="880" y="350" width="160" height="240" fill="#7d4d6f" opacity="0.15"/>
  <rect x="890" y="360" width="140" height="220" fill="#5D1E3B" opacity="0.08"/>

  <!-- Burgundy-tinted highlights -->
  <g opacity="0.3" fill="#8a1946">
    <circle cx="920" cy="400" r="8"/>
    <circle cx="1000" cy="420" r="6"/>
  </g>

  <!-- Interior monologue (silent, no text - just emptiness) -->
  <text x="960" y="850" font-family="Inter, sans-serif" font-size="32" fill="#8a7060" text-anchor="middle" opacity="0.4" font-style="italic">
    [sound fades to silence]
  </text>

  <!-- Breathing indicator (subtle animation cue) -->
  <circle cx="960" cy="700" r="3" fill="#8a7060" opacity="0.4"/>
</svg>
