<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <!-- Shot 5: Fan Click Intrusion (3:00–3:30) -->

  <!-- Classroom background (desaturated from Shot 4a) -->
  <rect width="1920" height="1080" fill="#3a3a4a"/>

  <!-- Fan fixture (ceiling-mounted, center-top) -->
  <circle cx="960" cy="150" r="80" fill="#6a6a7a" stroke="#2d2d3d" stroke-width="4"/>

  <!-- Fan blade 1 (rotating, frozen mid-rotation) -->
  <path d="M 960 150 L 900 100 Q 930 120 960 150" fill="#8a8a9a" stroke="#2d2d3d" stroke-width="3"/>

  <!-- Fan blade 2 -->
  <path d="M 960 150 L 960 70 Q 960 110 960 150" fill="#8a8a9a" stroke="#2d2d3d" stroke-width="3"/>

  <!-- Fan blade 3 -->
  <path d="M 960 150 L 1020 100 Q 990 120 960 150" fill="#8a8a9a" stroke="#2d2d3d" stroke-width="3"/>

  <!-- Click indicators (sound visualization) -->
  <g stroke="#ffb3b3" stroke-width="3" fill="none" opacity="0.8">
    <!-- Concentric click circles -->
    <circle cx="960" cy="150" r="60" stroke-dasharray="4,4"/>
    <circle cx="960" cy="150" r="100" stroke-dasharray="4,4" opacity="0.6"/>
    <circle cx="960" cy="150" r="140" stroke-dasharray="4,4" opacity="0.4"/>
  </g>

  <!-- Pressure waves radiating outward -->
  <g stroke="#ff9999" stroke-width="2" fill="none" opacity="0.7">
    <path d="M 400 150 Q 600 100 800 150"/>
    <path d="M 1120 150 Q 1300 100 1500 150"/>
    <path d="M 500 250 Q 700 350 900 400"/>
    <path d="M 1020 250 Q 1220 350 1420 400"/>
  </g>

  <!-- Ziggy silhouette (distant, at desk) -->
  <circle cx="300" cy="600" r="50" fill="#9a7a5a" opacity="0.6" stroke="#3d2d1d" stroke-width="2"/>

  <!-- Interior monologue emerging -->
  <text x="400" y="700" font-family="Caveat, cursive" font-size="28" fill="#0052CC" opacity="0.7">
    What's that sound?
  </text>

  <!-- Classroom ambient (faint desk outlines) -->
  <g stroke="#5a5a6a" stroke-width="2" fill="none" opacity="0.3">
    <rect x="200" y="450" width="120" height="80" rx="4"/>
    <rect x="500" y="450" width="120" height="80" rx="4"/>
    <rect x="800" y="450" width="120" height="80" rx="4"/>
  </g>

  <!-- Anxiety pressure indicator (subtle pulsing area) -->
  <circle cx="960" cy="540" r="200" fill="#ff6666" opacity="0.1"/>
</svg>
