<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <!-- Shot 23: Snap Back to Classroom (Reality) / SURGE Moment (9:00–9:30) — Epilogue -->

  <!-- Classroom (back, but now bright, not threatening) -->
  <rect width="1920" height="1080" fill="#f5f5f5"/>

  <!-- Ceiling fluorescent lights (now welcoming, not overwhelming) -->
  <g opacity="0.8">
    <rect x="300" y="80" width="400" height="80" fill="#ffffff" stroke="#b8d0e8" stroke-width="3" rx="4"/>
    <rect x="1220" y="80" width="400" height="80" fill="#ffffff" stroke="#b8d0e8" stroke-width="3" rx="4"/>
  </g>

  <!-- Student desks (regular, peaceful) -->
  <g opacity="0.6">
    <rect x="100" y="350" width="150" height="100" fill="#c9a881" stroke="#2d1f0f" stroke-width="2" rx="4"/>
    <rect x="350" y="350" width="150" height="100" fill="#c9a881" stroke="#2d1f0f" stroke-width="2" rx="4"/>
    <rect x="1450" y="350" width="150" height="100" fill="#c9a881" stroke="#2d1f0f" stroke-width="2" rx="4"/>
    <rect x="1700" y="350" width="150" height="100" fill="#c9a881" stroke="#2d1f0f" stroke-width="2" rx="4"/>
  </g>

  <!-- Teacher at front (kind, supportive) -->
  <g opacity="0.7">
    <circle cx="200" cy="200" r="40" fill="#8a7a6a" stroke="#3d2d1d" stroke-width="2"/>
    <rect x="170" y="250" width="60" height="80" fill="#6a5a5a"/>
    <!-- Smile -->
    <path d="M 185 200 Q 200 210 215 200" stroke="#3d2d1d" stroke-width="2" fill="none"/>
  </g>

  <!-- Peer students (now smiling, not watching judgmentally) -->
  <g opacity="0.8">
    <!-- Peer 1 -->
    <circle cx="600" cy="250" r="35" fill="#8a7a6a" stroke="#3d2d1d" stroke-width="2"/>
    <path d="M 585 260 Q 600 270 615 260" stroke="#3d2d1d" stroke-width="2" fill="none"/>

    <!-- Peer 2 -->
    <circle cx="1300" cy="280" r="35" fill="#8a7a6a" stroke="#3d2d1d" stroke-width="2"/>
    <path d="M 1285 290 Q 1300 300 1315 290" stroke="#3d2d1d" stroke-width="2" fill="none"/>

    <!-- Peer 3 -->
    <circle cx="900" cy="300" r="32" fill="#8a7a6a" stroke="#3d2d1d" stroke-width="2"/>
    <path d="M 885 310 Q 900 320 915 310" stroke="#3d2d1d" stroke-width="2" fill="none"/>
  </g>

  <!-- ZIGGY IN SURGE FORM (classroom context, but glowing with confidence) -->
  <!-- Head -->
  <circle cx="960" cy="550" r="95" fill="#a89a7a" stroke="#0052CC" stroke-width="4" opacity="1"/>

  <!-- Hair (superhero asymmetry, glowing) -->
  <path d="M 880 475 Q 895 445 915 435 Q 950 425 985 435 Q 1005 445 1020 475" fill="#3d2817" opacity="1"/>
  <g stroke="#0052CC" stroke-width="2" fill="none" opacity="0.7">
    <line x1="870" y1="465" x2="830" y2="420"/>
    <line x1="960" y1="425" x2="960" y2="385"/>
    <line x1="1050" y1="465" x2="1090" y2="420"/>
  </g>

  <!-- Eyes (Electric Blue, confident, kind) -->
  <circle cx="930" cy="540" r="20" fill="#0052CC" stroke="#0052CC" stroke-width="2"/>
  <circle cx="990" cy="540" r="20" fill="#0052CC" stroke="#0052CC" stroke-width="2"/>
  <!-- Pupils (engaged, warm) -->
  <circle cx="930" cy="545" r="7" fill="#000" opacity="1"/>
  <circle cx="990" cy="545" r="7" fill="#000" opacity="1"/>
  <!-- Highlights (kindness, confidence) -->
  <circle cx="933" cy="537" r="3" fill="#ffffff" opacity="1"/>
  <circle cx="993" cy="537" r="3" fill="#ffffff" opacity="1"/>

  <!-- Expression (confident smile) -->
  <path d="M 915" y="575 Q 960 590 1005 575" stroke="#3d2817" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- SURGE Hoodie (Electric Blue + Orange) -->
  <rect x="840" y="640" width="240" height="160" fill="#0052CC" stroke="#0052CC" stroke-width="3" rx="20" opacity="1"/>
  <rect x="870" y="670" width="180" height="12" fill="#FF8C3A" opacity="1"/>
  <rect x="870" y="750" width="180" height="10" fill="#FF8C3A" opacity="0.8"/>

  <!-- Arms (open, welcoming pose) -->
  <g opacity="1">
    <!-- Left arm (raised, waving) -->
    <rect x="740" y="680" width="100" height="70" fill="#c9a881" stroke="#0052CC" stroke-width="2" rx="8" opacity="1" transform="rotate(-25 790 715)"/>
    <circle cx="720" cy="680" r="24" fill="#c9a881" stroke="#0052CC" stroke-width="2"/>

    <!-- Right arm (raised, waving) -->
    <rect x="1080" y="680" width="100" height="70" fill="#c9a881" stroke="#0052CC" stroke-width="2" rx="8" opacity="1" transform="rotate(25 1130 715)"/>
    <circle cx="1200" cy="680" r="24" fill="#c9a881" stroke="#0052CC" stroke-width="2"/>
  </g>

  <!-- Legs (standing confident) -->
  <rect x="900" y="800" width="50" height="140" fill="#c9a881" stroke="#0052CC" stroke-width="2" rx="6"/>
  <rect x="970" y="800" width="50" height="140" fill="#c9a881" stroke="#0052CC" stroke-width="2" rx="6"/>

  <!-- Socks (signature asymmetry) -->
  <circle cx="925" cy="800" r="13" fill="#0052CC" opacity="0.95"/>
  <circle cx="995" cy="800" r="13" fill="#FF8C3A" opacity="0.95"/>

  <!-- SURGE aura (powerful but welcoming) -->
  <circle cx="960" cy="650" r="180" fill="#0052CC" opacity="0.15"/>
  <g stroke="#0052CC" stroke-width="2" fill="none" opacity="0.5">
    <circle cx="960" cy="650" r="140" stroke-dasharray="8,4"/>
    <circle cx="960" cy="650" r="200" stroke-dasharray="8,4" opacity="0.3"/>
  </g>

  <!-- Connection moments (Ziggy helping peers) -->
  <!-- Arrow from Ziggy to Peer 1 (helping with focus) -->
  <line x1="900" y1="650" x2="620" y2="300" stroke="#0052CC" stroke-width="2" opacity="0.5" marker-end="url(#arrowhead)"/>

  <!-- Arrow from Ziggy to Peer 2 (empathy connection) -->
  <line x1="1000" y1="680" x2="1300" y2="330" stroke="#0052CC" stroke-width="2" opacity="0.5" marker-end="url(#arrowhead)"/>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <polygon points="0 0, 10 5, 0 10" fill="#0052CC" opacity="0.6"/>
    </marker>
  </defs>

  <!-- Final Interior Monologue (realization) -->
  <text x="400" y="1000" font-family="Caveat, cursive" font-size="38" fill="#0052CC" opacity="1" font-weight="bold">
    I was never broken. I was just... waiting to SURGE.
  </text>

  <!-- Power Status (ACTIVE IN FIELD) -->
  <rect x="1350" y="900" width="520" height="150" fill="#f5f5f5" stroke="#0052CC" stroke-width="3" rx="4" opacity="1"/>
  <text x="1610" y="945" font-family="Arial" font-size="18" fill="#0052CC" text-anchor="middle" font-weight="bold">
    ⚡ SURGE ACTIVE IN FIELD ⚡
  </text>
  <text x="1610" y="975" font-family="Arial" font-size="14" fill="#0052CC" text-anchor="middle" opacity="0.9">
    Hyperfocus: Ready | Speed: Ready | Empathy: Ready
  </text>
  <text x="1610" y="1005" font-family="Arial" font-size="12" fill="#0052CC" text-anchor="middle" opacity="0.8">
    Status: UNSTOPPABLE
  </text>
</svg>
