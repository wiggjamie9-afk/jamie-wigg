<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <!-- Shot 16: Vignette Dissolution / Electric Blue Emergence (5:30–6:00) -->

  <!-- Burgundy shame fade-out -->
  <rect width="1920" height="1080" fill="#5D1E3B" opacity="0.9"/>

  <!-- Electric Blue light breaking through (center, intense) -->
  <defs>
    <radialGradient id="blue-breakthrough" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#0052CC;stop-opacity:0.9"/>
      <stop offset="40%" style="stop-color:#0052CC;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#5D1E3B;stop-opacity:0.8"/>
    </radialGradient>
  </defs>
  <circle cx="960" cy="540" r="600" fill="url(#blue-breakthrough)"/>

  <!-- Ziggy silhouette (in center, still human but illuminated) -->
  <circle cx="960" cy="540" r="100" fill="#8a7060" opacity="0.8" stroke="#3d2817" stroke-width="3"/>

  <!-- Hair (still asymmetrical, starting to shimmer) -->
  <path d="M 880 460 Q 900 420 920 410 Q 950 400 980 410 Q 1000 420 1020 460" fill="#3d2817" opacity="0.9"/>

  <!-- Eyes (Electric Blue, beginning to glow) -->
  <circle cx="930" cy="530" r="18" fill="#0052CC" stroke="#2d1f0f" stroke-width="2"/>
  <circle cx="990" cy="530" r="18" fill="#0052CC" stroke="#2d1f0f" stroke-width="2"/>
  <!-- Inner light -->
  <circle cx="930" cy="530" r="10" fill="#ffffff" opacity="0.7"/>
  <circle cx="990" cy="530" r="10" fill="#ffffff" opacity="0.7"/>

  <!-- Body outline (still human, but Electric Blue aura building) -->
  <rect x="880" y="600" width="160" height="120" fill="none" stroke="#0052CC" stroke-width="3" rx="8" opacity="0.8"/>

  <!-- Light rays emanating from Ziggy (Electric Blue) -->
  <g stroke="#0052CC" stroke-width="2" fill="none" opacity="0.7">
    <line x1="960" y1="420" x2="960" y2="300"/>
    <line x1="960" y1="660" x2="960" y2="780"/>
    <line x1="800" y1="540" x2="600" y2="540"/>
    <line x1="1120" y1="540" x2="1320" y2="540"/>
    <line x1="820" y1="460" x2="680" y2="340"/>
    <line x1="1100" y1="620" x2="1240" y2="740"/>
  </g>

  <!-- Classroom behind vignette (fading, irrelevant) -->
  <g opacity="0.15">
    <rect x="200" y="300" width="150" height="120" fill="#4a4a5a"/>
    <circle cx="300" cy="400" r="40" fill="#a89a7a"/>
    <circle cx="1600" cy="300" r="40" fill="#a89a7a"/>
  </g>

  <!-- Interior monologue (realization dawning) -->
  <text x="400" y="900" font-family="Caveat, cursive" font-size="40" fill="#0052CC" opacity="0.9" font-weight="bold">
    Wait... what if...?
  </text>

  <!-- Color gradient (burgundy to blue transition) -->
  <defs>
    <linearGradient id="shame-to-surge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5D1E3B;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#2a2a3a;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#0052CC;stop-opacity:0.6"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#shame-to-surge)" opacity="0.5"/>
</svg>
