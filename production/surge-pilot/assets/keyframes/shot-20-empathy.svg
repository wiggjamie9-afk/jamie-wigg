<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <!-- Shot 20: Superpower 3 — Emotional Intensity / Empathy (7:30–8:00) -->

  <!-- Warm emotional background -->
  <rect width="1920" height="1080" fill="#FF8C3A" opacity="0.1"/>
  <rect width="1920" height="1080" fill="#1a1a3a"/>

  <!-- Empathy aura (warm colors mixing with Electric Blue) -->
  <defs>
    <radialGradient id="empathy-aura" cx="50%" cy="50%" r="60%">
      <stop offset="0%" style="stop-color:#0052CC;stop-opacity:0.4"/>
      <stop offset="50%" style="stop-color:#FF8C3A;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#D8B5E6;stop-opacity:0.2"/>
    </radialGradient>
  </defs>
  <circle cx="960" cy="540" r="400" fill="url(#empathy-aura)"/>

  <!-- Ziggy (radiating warmth and connection) -->
  <circle cx="960" cy="540" r="100" fill="#a89a7a" stroke="#0052CC" stroke-width="4" opacity="1"/>

  <!-- Hair (soft, flowing, less aggressive than speed) -->
  <path d="M 880 460 Q 900 445 920 440 Q 950 435 980 440 Q 1000 445 1020 460" fill="#3d2817" opacity="1"/>

  <!-- Eyes (warm, compassionate, Electric Blue but soft) -->
  <circle cx="930" cy="535" r="20" fill="#0052CC" stroke="#0052CC" stroke-width="2"/>
  <circle cx="990" cy="535" r="20" fill="#0052CC" stroke="#0052CC" stroke-width="2"/>
  <!-- Pupils (warm, engaged) -->
  <circle cx="930" cy="540" r="8" fill="#000" opacity="0.9"/>
  <circle cx="990" cy="540" r="8" fill="#000" opacity="0.9"/>
  <!-- Highlights (kind, gentle) -->
  <circle cx="932" cy="532" r="3" fill="#ffffff" opacity="1"/>
  <circle cx="992" cy="532" r="3" fill="#ffffff" opacity="1"/>

  <!-- Expression (warm smile) -->
  <path d="M 915 575 Q 960 590 1005 575" stroke="#3d2817" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- SURGE hoodie (now warm-toned, still Electric Blue core) -->
  <rect x="870" y="630" width="180" height="130" fill="#0052CC" stroke="#FF8C3A" stroke-width="3" rx="20" opacity="1"/>
  <rect x="890" y="650" width="140" height="10" fill="#FF8C3A" opacity="1"/>

  <!-- Heart-shaped empathy symbols radiating outward -->
  <g fill="#D8B5E6" opacity="0.7">
    <!-- Heart 1 (top) -->
    <path d="M 960 250 Q 970 230 980 230 Q 990 230 990 240 Q 990 250 960 270 Q 930 250 930 240 Q 930 230 940 230 Q 950 230 960 250" fill="#D8B5E6"/>
    <!-- Heart 2 (right) -->
    <path d="M 1230 540 Q 1250 530 1270 530 Q 1290 530 1290 545 Q 1290 560 1250 585 Q 1210 560 1210 545 Q 1210 530 1230 530" fill="#D8B5E6" transform="scale(0.8)"/>
    <!-- Heart 3 (left) -->
    <path d="M 690 540 Q 670 530 650 530 Q 630 530 630 545 Q 630 560 670 585 Q 710 560 710 545 Q 710 530 690 530" fill="#D8B5E6" transform="scale(0.8)"/>
    <!-- Heart 4 (bottom) -->
    <path d="M 960 830 Q 970 810 980 810 Q 990 810 990 820 Q 990 835 960 855 Q 930 835 930 820 Q 930 810 940 810 Q 950 810 960 830" fill="#D8B5E6" transform="scale(0.75)"/>
  </g>

  <!-- Connection waves (reaching out to others) -->
  <g stroke="#FF8C3A" stroke-width="2" fill="none" opacity="0.6">
    <circle cx="960" cy="540" r="150" stroke-dasharray="8,4"/>
    <circle cx="960" cy="540" r="220" stroke-dasharray="8,4" opacity="0.4"/>
    <circle cx="960" cy="540" r="290" stroke-dasharray="8,4" opacity="0.2"/>
  </g>

  <!-- Other people (simplified, connected by empathy) -->
  <g opacity="0.7">
    <!-- Person 1 (left) -->
    <circle cx="400" cy="400" r="35" fill="#a89a7a" stroke="#FF8C3A" stroke-width="2"/>
    <line x1="400" y1="440" x2="400" y2="480" stroke="#FF8C3A" stroke-width="2"/>
    <!-- Connection line to Ziggy -->
    <line x1="400" y1="400" x2="860" y2="500" stroke="#FF8C3A" stroke-width="1" opacity="0.6"/>

    <!-- Person 2 (right) -->
    <circle cx="1520" cy="450" r="35" fill="#a89a7a" stroke="#FF8C3A" stroke-width="2"/>
    <line x1="1520" y1="490" x2="1520" y2="530" stroke="#FF8C3A" stroke-width="2"/>
    <!-- Connection line to Ziggy -->
    <line x1="1520" y1="450" x2="1060" y2="500" stroke="#FF8C3A" stroke-width="1" opacity="0.6"/>

    <!-- Person 3 (front center-left) -->
    <circle cx="700" cy="700" r="32" fill="#a89a7a" stroke="#FF8C3A" stroke-width="2"/>
    <!-- Connection line -->
    <line x1="700" y1="700" x2="890" y2="630" stroke="#FF8C3A" stroke-width="1" opacity="0.5"/>
  </g>

  <!-- Empathy text indicator -->
  <text x="400" y="900" font-family="monospace" font-size="14" fill="#D8B5E6" opacity="0.9" font-weight="bold">
    EMPATHY ACTIVATED | Emotional resonance x1000 | Connecting with everyone
  </text>

  <!-- Power indicator (100% charged) -->
  <rect x="50" y="50" width="400" height="40" fill="#1a1a3a" stroke="#FF8C3A" stroke-width="3" rx="4"/>
  <rect x="60" y="60" width="360" height="20" fill="#FF8C3A" opacity="0.7" rx="2"/>
  <rect x="60" y="60" width="360" height="20" fill="#FF8C3A" opacity="1" rx="2"/>
  <text x="480" y="85" font-family="Arial" font-size="16" fill="#FF8C3A" font-weight="bold">
    EMPATHY: 100% ⚡ ALL SYSTEMS GO
  </text>

  <!-- Warm glow around Ziggy -->
  <circle cx="960" cy="540" r="120" fill="#D8B5E6" opacity="0.15"/>
</svg>
