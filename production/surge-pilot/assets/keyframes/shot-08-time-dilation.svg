<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <!-- Shot 8: Time Dilation / Peak Pressure (4:30–5:00) -->

  <!-- Warped, distorted background (visual dissociation beginning) -->
  <defs>
    <filter id="warp" x="-50%" y="-50%" width="200%" height="200%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="20"/>
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="#1a1a2a" filter="url(#warp)" opacity="0.9"/>
  <rect width="1920" height="1080" fill="#ff6666" opacity="0.15"/>

  <!-- Distorted wall (stretched perspective) -->
  <polygon points="0,300 1920,250 1920,800 0,850" fill="#3a3a4a" opacity="0.7"/>

  <!-- Clock face (stretched/warped, frozen moment) -->
  <circle cx="960" cy="400" r="150" fill="#6a6a7a" stroke="#2d2d3d" stroke-width="4"/>
  <!-- Clock numbers (warped) -->
  <text x="960" y="280" font-family="Arial" font-size="20" fill="#2d2d3d" text-anchor="middle" opacity="0.8">12</text>
  <text x="1080" y="410" font-family="Arial" font-size="20" fill="#2d2d3d" text-anchor="middle" opacity="0.8">3</text>
  <text x="960" y="530" font-family="Arial" font-size="20" fill="#2d2d3d" text-anchor="middle" opacity="0.8">6</text>
  <text x="840" y="410" font-family="Arial" font-size="20" fill="#2d2d3d" text-anchor="middle" opacity="0.8">9</text>

  <!-- Hour hand (pointing down, stuck) -->
  <line x1="960" y1="400" x2="960" y2="500" stroke="#2d2d3d" stroke-width="6" stroke-linecap="round"/>
  <!-- Minute hand (stretched, tremoring) -->
  <line x1="960" y1="400" x2="960" y2="250" stroke="#ff6666" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
  <!-- Second hand (vibrating, anxiety-colored) -->
  <line x1="960" y1="400" x2="1050" y2="350" stroke="#ff9999" stroke-width="2" stroke-linecap="round" opacity="0.8"/>

  <!-- Multiple ghost clock faces (time multiplying, fracturing) -->
  <circle cx="400" cy="250" r="80" fill="none" stroke="#ff6666" stroke-width="2" opacity="0.4"/>
  <circle cx="1500" cy="600" r="90" fill="none" stroke="#ff6666" stroke-width="2" opacity="0.35"/>
  <circle cx="300" cy="700" r="70" fill="none" stroke="#ff6666" stroke-width="2" opacity="0.3"/>

  <!-- Ziggy's hand reaching toward clock (slow-motion effect) -->
  <circle cx="850" cy="550" r="35" fill="#c9a881" stroke="#2d1f0f" stroke-width="2" opacity="0.7"/>
  <!-- Fingers splayed (frozen mid-motion) -->
  <line x1="825" y1="520" x2="810" y2="480" stroke="#c9a881" stroke-width="8" opacity="0.6"/>
  <line x1="850" y1="505" x2="850" y2="460" stroke="#c9a881" stroke-width="8" opacity="0.6"/>
  <line x1="875" y1="520" x2="890" y2="480" stroke="#c9a881" stroke-width="8" opacity="0.6"/>

  <!-- Pressure intensity maxing out -->
  <g opacity="0.9">
    <!-- Expanding pressure circles -->
    <circle cx="960" cy="540" r="200" fill="none" stroke="#ff6666" stroke-width="3" opacity="0.7"/>
    <circle cx="960" cy="540" r="300" fill="none" stroke="#ff6666" stroke-width="2" opacity="0.5"/>
    <circle cx="960" cy="540" r="400" fill="none" stroke="#ff6666" stroke-width="1" opacity="0.3"/>
  </g>

  <!-- Classroom fade (background becomes irrelevant) -->
  <g opacity="0.2">
    <rect x="100" y="150" width="150" height="120" fill="#4a4a5a"/>
    <rect x="1600" y="200" width="150" height="120" fill="#4a4a5a"/>
  </g>

  <!-- Interior monologue (internal time distortion) -->
  <text x="400" y="900" font-family="Caveat, cursive" font-size="38" fill="#0052CC" opacity="1" font-weight="bold">
    Time is stretching. Everything slowing down. Can't...
  </text>

  <!-- Pressure intensity gauge (5/5 — MAX) -->
  <rect x="50" y="50" width="300" height="30" fill="#4a4a5a" stroke="#2d2d3d" stroke-width="2" rx="4"/>
  <rect x="55" y="55" width="270" height="20" fill="#ff6666" opacity="0.9" rx="2"/>
  <text x="370" y="75" font-family="Arial" font-size="16" fill="#ff0000" font-weight="bold">
    PRESSURE: 5/5 MAX
  </text>

  <!-- Vignette (tunnel vision beginning) -->
  <defs>
    <radialGradient id="vignette-time" cx="50%" cy="50%" r="60%">
      <stop offset="0%" style="stop-color:#1a1a2a;stop-opacity:0"/>
      <stop offset="100%" style="stop-color:#1a1a2a;stop-opacity:0.6"/>
    </radialGradient>
  </defs>
  <circle cx="960" cy="540" r="800" fill="url(#vignette-time)"/>
</svg>
