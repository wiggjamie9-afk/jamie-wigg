<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <!-- Shot 25: Epilogue — Speed Helping in an Emergency (10:00–10:30) -->

  <!-- School hallway / outdoor setting -->
  <rect width="1920" height="1080" fill="#e8d8c8"/>

  <!-- Background students (classroom blurred) -->
  <g opacity="0.3">
    <circle cx="1600" cy="200" r="35" fill="#8a7a6a"/>
    <circle cx="1700" cy="250" r="35" fill="#8a7a6a"/>
    <rect x="1300" y="300" width="200" height="150" fill="#c9a881"/>
  </g>

  <!-- Someone dropping books/falling (mid-action) -->
  <g opacity="0.8">
    <!-- Person falling -->
    <circle cx="1200" cy="400" r="40" fill="#8a7a6a" stroke="#3d2d1d" stroke-width="2"/>
    <!-- Books scattered (falling) -->
    <rect x="1050" y="350" width="60" height="40" fill="#4a5a6a" stroke="#3d2d1d" stroke-width="1" transform="rotate(-30 1080 370)"/>
    <rect x="1150" y="360" width="60" height="40" fill="#6a4a5a" stroke="#3d2d1d" stroke-width="1" transform="rotate(20 1180 380)"/>
    <rect x="1250" y="355" width="60" height="40" fill="#5a6a4a" stroke="#3d2d1d" stroke-width="1" transform="rotate(-15 1280 375)"/>
  </g>

  <!-- Ziggy arriving at SPEED (multiple motion trails) -->
  <g opacity="0.7">
    <!-- Trail 1 (far back) -->
    <circle cx="600" cy="450" r="40" fill="#a89a7a" opacity="0.2"/>
    <!-- Trail 2 -->
    <circle cx="850" cy="440" r="42" fill="#a89a7a" opacity="0.4"/>
    <!-- Trail 3 -->
    <circle cx="1050" cy="430" r="44" fill="#a89a7a" opacity="0.6"/>
  </g>

  <!-- Ziggy (main, catching the person) -->
  <circle cx="1200" cy="350" r="48" fill="#a89a7a" stroke="#FF8C3A" stroke-width="3" opacity="1"/>
  <!-- Arms out (catching) -->
  <line x1="1160" y1="360" x2="1100" y2="380" stroke="#c9a881" stroke-width="8" opacity="0.9"/>
  <line x1="1240" y1="360" x2="1300" y2="380" stroke="#c9a881" stroke-width="8" opacity="0.9"/>
  <!-- Eyes wide (alert, in action) -->
  <circle cx="1185" cy="340" r="5" fill="#0052CC"/>
  <circle cx="1215" cy="340" r="5" fill="#0052CC"/>

  <!-- Speed effect (motion lines) -->
  <g stroke="#FF8C3A" stroke-width="2" fill="none" opacity="0.7">
    <path d="M 500 450 Q 700 420 1000 400"/>
    <path d="M 550 470 Q 750 450 1050 440"/>
    <path d="M 480 430 Q 680 400 980 380"/>
  </g>

  <!-- Result: Person caught (safe) -->
  <!-- Books caught mid-air -->
  <g opacity="0.95">
    <rect x="1050" y="300" width="60" height="40" fill="#4a5a6a" stroke="#3d2d1d" stroke-width="1"/>
    <rect x="1150" y="310" width="60" height="40" fill="#6a4a5a" stroke="#3d2d1d" stroke-width="1"/>
    <rect x="1250" y="305" width="60" height="40" fill="#5a6a4a" stroke="#3d2d1d" stroke-width="1"/>
  </g>

  <!-- Impact: Person's amazed reaction -->
  <circle cx="1200" cy="500" r="35" fill="#8a7a6a" stroke="#3d2d1d" stroke-width="2"/>
  <!-- Eyes wide (amazed) -->
  <circle cx="1185" cy="490" r="4" fill="#000" opacity="1"/>
  <circle cx="1215" cy="490" r="4" fill="#000" opacity="1"/>
  <!-- Mouth open (shocked/grateful) -->
  <ellipse cx="1200" cy="515" rx="15" ry="10" fill="#d45a5a" opacity="0.7"/>

  <!-- Text: Impact -->
  <text x="700" y="750" font-family="Caveat, cursive" font-size="38" fill="#FF8C3A" opacity="0.95" font-weight="bold">
    She saved me! Ziggy's fast as lightning!
  </text>

  <!-- Time stamp -->
  <text x="50" y="1050" font-family="Arial" font-size="14" fill="#999" opacity="0.7">
    Afternoon: Saved someone from falling
  </text>
</svg>
