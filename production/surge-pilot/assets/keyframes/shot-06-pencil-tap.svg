<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <!-- Shot 6: Pencil Tap Staccato (3:30–4:00) -->

  <!-- Dark pressured background -->
  <rect width="1920" height="1080" fill="#2a2a3a"/>

  <!-- Desk surface (closer view) -->
  <rect x="400" y="400" width="1120" height="280" fill="#4a4a5a" stroke="#1a1a2a" stroke-width="3"/>

  <!-- Pencil (eraser end up, tip down on desk) -->
  <rect x="900" y="200" width="30" height="400" fill="#FFD700" stroke="#3d2d1d" stroke-width="2" rx="8"/>
  <!-- Eraser -->
  <rect x="890" y="190" width="50" height="30" fill="#FF6B6B" stroke="#3d2d1d" stroke-width="2" rx="2"/>
  <!-- Pencil tip -->
  <polygon points="915,600 905,610 925,610" fill="#3d2d1d"/>

  <!-- Tap indicators (staccato) — rapid impact lines -->
  <g stroke="#ff9999" stroke-width="4" fill="none" opacity="0.9">
    <!-- First tap -->
    <circle cx="915" cy="600" r="30" opacity="0.8"/>
    <!-- Second tap (offset) -->
    <circle cx="920" cy="610" r="25" opacity="0.7"/>
    <!-- Third tap (further) -->
    <circle cx="910" cy="615" r="20" opacity="0.6"/>
  </g>

  <!-- Pressure lines radiating from pencil point -->
  <g stroke="#ff6666" stroke-width="2" fill="none" opacity="0.8">
    <line x1="915" y1="600" x2="700" y2="500"/>
    <line x1="915" y1="600" x2="1130" y2="500"/>
    <line x1="915" y1="600" x2="800" y2="700"/>
    <line x1="915" y1="600" x2="1030" y2="750"/>
    <line x1="915" y1="600" x2="915" y2="300"/>
  </g>

  <!-- Cumulative anxiety overlay (hum + click + tap layering) -->
  <rect width="1920" height="1080" fill="#ff6666" opacity="0.08"/>

  <!-- Ziggy's hand (clutching pencil, tremoring) -->
  <circle cx="880" cy="620" r="35" fill="#c9a881" stroke="#2d1f0f" stroke-width="2" opacity="0.8"/>
  <!-- Fingers gripping -->
  <circle cx="860" cy="610" r="12" fill="#c9a881" opacity="0.7"/>
  <circle cx="870" cy="630" r="10" fill="#c9a881" opacity="0.7"/>

  <!-- Interior monologue (heightened) -->
  <text x="300" y="250" font-family="Caveat, cursive" font-size="32" fill="#0052CC" opacity="0.8">
    Tap. Tap. Tap.
  </text>

  <!-- Classroom peer figures (blurred/indistinct due to Ziggy focus) -->
  <g opacity="0.2">
    <circle cx="200" cy="300" r="40" fill="#8a7a6a"/>
    <circle cx="1700" cy="350" r="40" fill="#8a7a6a"/>
    <circle cx="1600" cy="700" r="40" fill="#8a7a6a"/>
  </g>

  <!-- Pressure intensity gauge (visual metaphor) -->
  <rect x="50" y="50" width="300" height="30" fill="#4a4a5a" stroke="#2d2d3d" stroke-width="2" rx="4"/>
  <rect x="55" y="55" width="270" height="20" fill="#ff6666" opacity="0.6" rx="2"/>
  <!-- Pressure indicator (3/5 filled) -->
  <text x="370" y="75" font-family="Arial" font-size="16" fill="#ff6666" opacity="0.7">
    Pressure: 3/5
  </text>
</svg>
