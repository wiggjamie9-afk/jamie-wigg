<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <!-- Shot 3: Ziggy at Desk (Close-up, Jittery Energy) -->

  <!-- Background (classroom, desaturated) -->
  <rect width="1920" height="1080" fill="#e8e8e8"/>

  <!-- Ziggy's desk (front and center) -->
  <rect x="600" y="600" width="200" height="120" fill="#d4c5b9" stroke="#8b7355" stroke-width="3" rx="4"/>
  <rect x="620" y="620" width="160" height="80" fill="#dab899" stroke="#8b7355" stroke-width="2"/>

  <!-- ZIGGY (Circle head, asymmetrical hair, anxious) -->

  <!-- Head (circle) -->
  <circle cx="820" cy="380" r="80" fill="#e8d4b8" stroke="#2d1f0f" stroke-width="4"/>

  <!-- Hair (asymmetrical, messy) -->
  <!-- Left side (higher) -->
  <path d="M 760 320 Q 780 280 800 250 Q 810 240 820 250 Q 825 260 820 300 Q 810 320 800 340" fill="#3d2817" stroke="#2d1f0f" stroke-width="2"/>
  <!-- Right side (chaotic) -->
  <path d="M 840 310 Q 860 270 880 240 Q 895 220 905 260 Q 900 310 890 350 Q 875 340 860 340" fill="#3d2817" stroke="#2d1f0f" stroke-width="2"/>
  <!-- Top spiky bits -->
  <line x1="810" y1="280" x2="805" y2="240" stroke="#3d2817" stroke-width="3" stroke-linecap="round"/>
  <line x1="830" y1="275" x2="835" y2="235" stroke="#3d2817" stroke-width="3" stroke-linecap="round"/>
  <line x1="850" y1="285" x2="860" y2="245" stroke="#3d2817" stroke-width="3" stroke-linecap="round"/>

  <!-- Eyes (Electric Blue, wide, anxious) -->
  <circle cx="795" cy="360" r="14" fill="#0052CC" stroke="#2d1f0f" stroke-width="2"/>
  <circle cx="845" cy="360" r="14" fill="#0052CC" stroke="#2d1f0f" stroke-width="2"/>
  <!-- Pupils (enlarged, anxious) -->
  <circle cx="795" cy="362" r="7" fill="#fff" opacity="0.9"/>
  <circle cx="845" cy="362" r="7" fill="#fff" opacity="0.9"/>
  <!-- Pupils looking slightly right (anxious attention) -->
  <circle cx="800" cy="360" r="5" fill="#000"/>
  <circle cx="850" cy="360" r="5" fill="#000"/>

  <!-- Mouth (neutral, slightly tense) -->
  <path d="M 810 420 Q 820 430 830 420" stroke="#2d1f0f" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Body (Blue hoodie) -->
  <rect x="760" y="460" width="120" height="100" fill="#0052CC" stroke="#2d1f0f" stroke-width="3" rx="8"/>

  <!-- Arms (extended, fidgeting position) -->
  <rect x="690" y="490" width="70" height="24" fill="#e8d4b8" stroke="#2d1f0f" stroke-width="2" rx="12"/>
  <rect x="880" y="490" width="70" height="24" fill="#e8d4b8" stroke="#2d1f0f" stroke-width="2" rx="12"/>

  <!-- Pencil in hand (right side) -->
  <line x1="920" y1="500" x2="950" y2="470" stroke="#d4a574" stroke-width="4"/>
  <line x1="950" y1="470" x2="960" y2="460" stroke="#2d1f0f" stroke-width="2"/>

  <!-- Socks (one up, one down - asymmetry indicator of chaos) -->
  <!-- Left sock (up) - Electric Blue #0052CC -->
  <rect x="755" y="560" width="35" height="45" fill="#0052CC" stroke="#2d1f0f" stroke-width="2" rx="4"/>
  <!-- Right sock (down) - Orange #FF8C3A -->
  <rect x="810" y="580" width="35" height="25" fill="#FF8C3A" stroke="#2d1f0f" stroke-width="2" rx="4"/>

  <!-- Jitter effect (animated lines radiating anxiety) -->
  <g opacity="0.4" stroke="#0052CC" stroke-width="2" stroke-dasharray="4,4" fill="none">
    <circle cx="820" cy="380" r="100"/>
    <circle cx="820" cy="380" r="120"/>
    <path d="M 720 380 L 650 380" stroke-linecap="round"/>
    <path d="M 920 380 L 990 380" stroke-linecap="round"/>
  </g>

  <!-- Interior monologue cue (Caveat font simulation) -->
  <text x="1000" y="500" font-family="cursive" font-size="36" fill="#0052CC" opacity="0.8">
    Wait... what?
  </text>
</svg>
