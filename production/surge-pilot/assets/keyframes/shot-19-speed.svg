<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <!-- Shot 19: Superpower 2 — Speed / Rapid Processing (7:00–7:30) -->

  <!-- Fast-action background (motion blur) -->
  <rect width="1920" height="1080" fill="#0052CC" opacity="0.15"/>
  <rect width="1920" height="1080" fill="#1a1a3a"/>

  <!-- Motion trails (speed lines) -->
  <g stroke="#0052CC" stroke-width="2" fill="none" opacity="0.6">
    <!-- Horizontal speed lines -->
    <line x1="300" y1="540" x2="800" y2="540" stroke-dasharray="10,10"/>
    <line x1="350" y1="480" x2="850" y2="480" stroke-dasharray="10,10"/>
    <line x1="350" y1="600" x2="850" y2="600" stroke-dasharray="10,10"/>
    <line x1="1120" y1="540" x2="1620" y2="540" stroke-dasharray="10,10"/>
    <line x1="1070" y1="480" x2="1570" y2="480" stroke-dasharray="10,10"/>
    <line x1="1070" y1="600" x2="1570" y2="600" stroke-dasharray="10,10"/>
  </g>

  <!-- Multiple Ziggy "ghost" frames (showing motion path) -->
  <!-- Ghost 1 (trailing behind, fading) -->
  <circle cx="650" cy="540" r="80" fill="#a89a7a" opacity="0.2"/>
  <path d="M 610 480 Q 630 460 650 455" fill="#3d2817" opacity="0.15"/>

  <!-- Ghost 2 (mid-motion) -->
  <circle cx="800" cy="540" r="85" fill="#a89a7a" opacity="0.4"/>
  <path d="M 760 480 Q 780 460 800 455" fill="#3d2817" opacity="0.3"/>

  <!-- Main Ziggy (sharp, in motion) -->
  <circle cx="960" cy="540" r="95" fill="#a89a7a" stroke="#0052CC" stroke-width="4" opacity="1"/>

  <!-- Hair (flowing back from speed) -->
  <path d="M 880 460 Q 900 440 920 435 Q 950 430 980 435 Q 1000 440 1020 460" fill="#3d2817" opacity="1"/>
  <!-- Speed wind effect on hair -->
  <g stroke="#0052CC" stroke-width="2" fill="none" opacity="0.7">
    <path d="M 870 450 Q 800 430 700 450"/>
    <path d="M 1050 450 Q 1120 430 1220 450"/>
  </g>

  <!-- Eyes (wide, processing rapidly) -->
  <circle cx="930" cy="535" r="22" fill="#0052CC" stroke="#0052CC" stroke-width="2"/>
  <circle cx="990" cy="535" r="22" fill="#0052CC" stroke="#0052CC" stroke-width="2"/>
  <!-- Pupils (dilated with speed/adrenaline) -->
  <circle cx="930" cy="540" r="8" fill="#000" opacity="1"/>
  <circle cx="990" cy="540" r="8" fill="#000" opacity="1"/>

  <!-- SURGE hoodie (fast, dynamic) -->
  <rect x="870" y="630" width="180" height="130" fill="#0052CC" stroke="#0052CC" stroke-width="3" rx="20" opacity="1"/>
  <rect x="890" y="650" width="140" height="10" fill="#FF8C3A" opacity="1"/>

  <!-- Speed aura (Electric Blue motion around Ziggy) -->
  <circle cx="960" cy="540" r="140" fill="#0052CC" opacity="0.25"/>
  <circle cx="960" cy="540" r="180" fill="#0052CC" opacity="0.1"/>

  <!-- Rapid processing indicators (multiple focal points) -->
  <g fill="#0052CC" opacity="0.8">
    <circle cx="500" cy="350" r="4"/>
    <circle cx="1400" cy="400" r="4"/>
    <circle cx="400" cy="700" r="4"/>
    <circle cx="1500" cy="650" r="4"/>
    <circle cx="960" cy="250" r="5"/>
    <circle cx="960" cy="830" r="5"/>
  </g>

  <!-- Connecting lines (processing multiple inputs simultaneously) -->
  <g stroke="#0052CC" stroke-width="1" fill="none" opacity="0.5">
    <line x1="500" y1="350" x2="960" y2="540"/>
    <line x1="1400" y1="400" x2="960" y2="540"/>
    <line x1="400" y1="700" x2="960" y2="540"/>
    <line x1="1500" y1="650" x2="960" y2="540"/>
  </g>

  <!-- Expression (excited, processing fast) -->
  <path d="M 920 575 Q 960 585 1000 575" stroke="#3d2817" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Speed text/data visual -->
  <text x="400" y="900" font-family="monospace" font-size="14" fill="#0052CC" opacity="0.9" font-weight="bold">
    SPEED ACTIVATED | Processing 1000ms tasks in 10ms | Pattern recognition x100
  </text>

  <!-- Power indicator (95% charged) -->
  <rect x="50" y="50" width="400" height="40" fill="#1a1a3a" stroke="#0052CC" stroke-width="3" rx="4"/>
  <rect x="60" y="60" width="360" height="20" fill="#0052CC" opacity="0.8" rx="2"/>
  <rect x="60" y="60" width="342" height="20" fill="#0052CC" opacity="1" rx="2"/>
  <text x="480" y="85" font-family="Arial" font-size="16" fill="#0052CC" font-weight="bold">
    SPEED: 95%
  </text>

  <!-- Snap effect (speed impact) -->
  <g stroke="#FF8C3A" stroke-width="2" fill="none" opacity="0.4">
    <circle cx="960" cy="540" r="120" stroke-dasharray="5,5"/>
    <circle cx="960" cy="540" r="160" stroke-dasharray="5,5"/>
  </g>
</svg>
