<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <!-- Shot 24: Epilogue — Hyperfocus Helping a Friend (9:30–10:00) -->

  <!-- Bedroom / homework space -->
  <rect width="1920" height="1080" fill="#f5f5f5"/>

  <!-- Desk with homework -->
  <rect x="200" y="300" width="500" height="300" fill="#d4a574" stroke="#3d2d1d" stroke-width="3" rx="8"/>

  <!-- Paper spread (homework) -->
  <g opacity="0.7">
    <rect x="220" y="320" width="200" height="140" fill="#ffffff" stroke="#3d2d1d" stroke-width="2"/>
    <rect x="450" y="320" width="200" height="140" fill="#ffffff" stroke="#3d2d1d" stroke-width="2"/>
    <line x1="250" y1="350" x2="400" y2="350" stroke="#3d2d1d" stroke-width="1" opacity="0.5"/>
    <line x1="250" y1="380" x2="400" y2="380" stroke="#3d2d1d" stroke-width="1" opacity="0.5"/>
  </g>

  <!-- Friend (frustrated, stressed) -->
  <circle cx="800" cy="380" r="45" fill="#8a7a6a" stroke="#3d2d1d" stroke-width="2"/>
  <!-- Hands up (frustrated) -->
  <line x1="770" y1="350" x2="750" y2="320" stroke="#c9a881" stroke-width="6" opacity="0.8"/>
  <line x1="830" y1="350" x2="850" y2="320" stroke="#c9a881" stroke-width="6" opacity="0.8"/>
  <!-- Expression (confused) -->
  <path d="M 785 390 Q 800 400 815 390" stroke="#3d2d1d" stroke-width="2" fill="none"/>

  <!-- Ziggy (Electric Blue glow, helping) -->
  <circle cx="400" cy="450" r="50" fill="#a89a7a" stroke="#0052CC" stroke-width="3" opacity="1"/>
  <!-- Eyes focused -->
  <circle cx="385" cy="440" r="6" fill="#0052CC"/>
  <circle cx="415" cy="440" r="6" fill="#0052CC"/>
  <!-- Finger pointing at homework (helpful) -->
  <line x1="450" y1="450" x2="520" y2="400" stroke="#c9a881" stroke-width="4"/>

  <!-- Hyperfocus beam (connecting Ziggy to homework) -->
  <g stroke="#0052CC" stroke-width="2" fill="none" opacity="0.6">
    <line x1="400" y1="500" x2="350" y2="400"/>
    <circle cx="350" cy="380" r="40" stroke-dasharray="8,4"/>
  </g>

  <!-- Result: Friend understanding (lightbulb moment) -->
  <g opacity="0.8">
    <!-- Lightbulb -->
    <circle cx="800" cy="300" r="30" fill="#FFD700" stroke="#FF8C3A" stroke-width="3"/>
    <!-- Glow -->
    <circle cx="800" cy="300" r="50" fill="#FFD700" opacity="0.3"/>
    <!-- Rays -->
    <g stroke="#FFD700" stroke-width="2" fill="none">
      <line x1="800" y1="240" x2="800" y2="200"/>
      <line x1="800" y1="360" x2="800" y2="400"/>
      <line x1="740" y1="300" x2="700" y2="300"/>
      <line x1="860" y1="300" x2="900" y2="300"/>
    </g>
  </g>

  <!-- Text: Impact -->
  <text x="400" y="750" font-family="Caveat, cursive" font-size="36" fill="#0052CC" opacity="0.95" font-weight="bold">
    "Wait, I GET IT now!" — Friend learning with Ziggy's focus
  </text>

  <!-- Time stamp -->
  <text x="50" y="1050" font-family="Arial" font-size="14" fill="#999" opacity="0.7">
    Afternoon: Homework help
  </text>
</svg>
