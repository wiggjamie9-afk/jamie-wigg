<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <!-- Shot 28: Series Teaser / Title Card (11:30–12:47) — Closing -->

  <!-- Black background (dramatic) -->
  <rect width="1920" height="1080" fill="#000000"/>

  <!-- Electric Blue gradient -->
  <defs>
    <linearGradient id="teaser-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0052CC;stop-opacity:0.3"/>
      <stop offset="50%" style="stop-color:#FF8C3A;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#D8B5E6;stop-opacity:0.25"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#teaser-grad)"/>

  <!-- SURGE logo / title (large, bold) -->
  <text x="960" y="300" font-family="Arial, sans-serif" font-size="120" fill="#0052CC" text-anchor="middle" font-weight="900" letter-spacing="8">
    SURGE
  </text>

  <!-- Glow behind title -->
  <circle cx="960" cy="250" r="300" fill="#0052CC" opacity="0.15"/>

  <!-- Subtitle -->
  <text x="960" y="420" font-family="Arial, sans-serif" font-size="48" fill="#FF8C3A" text-anchor="middle" opacity="0.95" font-weight="bold">
    My ADHD Is My Superpower
  </text>

  <!-- Character showcase (Ziggy in SURGE form, small) -->
  <g opacity="0.9" transform="translate(960, 600)">
    <!-- Ziggy silhouette (small, heroic pose) -->
    <circle cx="0" cy="-100" r="60" fill="#a89a7a" stroke="#0052CC" stroke-width="3"/>
    <!-- Head outline -->
    <!-- Arms (superhero pose) -->
    <line x1="-50" y1="-30" x2="-100" y2="-80" stroke="#c9a881" stroke-width="6" stroke-linecap="round"/>
    <line x1="50" y1="-30" x2="100" y2="-80" stroke="#c9a881" stroke-width="6" stroke-linecap="round"/>
    <!-- Body -->
    <rect x="-45" y="10" width="90" height="90" fill="#0052CC" stroke="#0052CC" stroke-width="3" rx="12" opacity="0.95"/>
    <!-- Legs -->
    <rect x="-25" y="100" width="20" height="70" fill="#c9a881" stroke="#0052CC" stroke-width="2" rx="4"/>
    <rect x="5" y="100" width="20" height="70" fill="#c9a881" stroke="#0052CC" stroke-width="2" rx="4"/>
    <!-- Glow -->
    <circle cx="0" cy="0" r="150" fill="#0052CC" opacity="0.15"/>
  </g>

  <!-- Coming Soon text -->
  <text x="960" y="850" font-family="Arial, sans-serif" font-size="56" fill="#D8B5E6" text-anchor="middle" font-weight="bold" letter-spacing="3">
    COMING SOON
  </text>

  <!-- Episodes count -->
  <text x="960" y="930" font-family="Arial, sans-serif" font-size="28" fill="#ffffff" text-anchor="middle" opacity="0.8">
    Season 1: 8 Episodes | 60 Minutes of Pure SURGE Energy
  </text>

  <!-- Credits line -->
  <text x="960" y="1000" font-family="Arial, sans-serif" font-size="16" fill="#999999" text-anchor="middle" opacity="0.8">
    Animation by HYPERFRAMES | Music by RHYTHMIX | For Everyone Who Thinks Differently
  </text>

  <!-- Decorative elements (Energy particles) -->
  <g fill="#FF8C3A" opacity="0.7">
    <circle cx="200" cy="200" r="4"/>
    <circle cx="1700" cy="250" r="4"/>
    <circle cx="150" cy="850" r="3"/>
    <circle cx="1800" cy="900" r="3"/>
    <circle cx="800" cy="150" r="3"/>
    <circle cx="1150" cy="950" r="3"/>
  </g>

  <!-- Lavender sparkles -->
  <g fill="#D8B5E6" opacity="0.6">
    <circle cx="400" cy="400" r="2"/>
    <circle cx="1600" cy="600" r="2"/>
    <circle cx="1200" cy="250" r="2"/>
    <circle cx="700" cy="800" r="2"/>
  </g>
</svg>
