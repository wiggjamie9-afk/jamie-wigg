<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <!-- Shot 7: Classroom Murmur Overwhelm (4:00–4:30) -->

  <!-- Chaotic classroom background -->
  <rect width="1920" height="1080" fill="#2a2a3a"/>

  <!-- Multiple peer heads (abstract, focusing on mouths/voices) -->
  <!-- Peer 1 (left front) -->
  <circle cx="300" cy="300" r="45" fill="#a89a7a" stroke="#3d2d1d" stroke-width="2"/>
  <ellipse cx="285" cy="320" rx="12" ry="18" fill="#3d2d1d"/>
  <ellipse cx="315" cy="320" rx="12" ry="18" fill="#3d2d1d"/>
  <!-- Mouth open (speaking) -->
  <ellipse cx="300" cy="345" rx="20" ry="15" fill="#d45a5a" opacity="0.8"/>

  <!-- Peer 2 (center-left) -->
  <circle cx="600" cy="250" r="40" fill="#a89a7a" stroke="#3d2d1d" stroke-width="2" opacity="0.9"/>
  <ellipse cx="590" cy="265" rx="10" ry="15" fill="#3d2d1d"/>
  <ellipse cx="610" cy="265" rx="10" ry="15" fill="#3d2d1d"/>
  <ellipse cx="600" cy="290" rx="18" ry="12" fill="#d45a5a" opacity="0.7"/>

  <!-- Peer 3 (right) -->
  <circle cx="1300" cy="320" r="42" fill="#a89a7a" stroke="#3d2d1d" stroke-width="2" opacity="0.85"/>
  <ellipse cx="1290" cy="335" rx="11" ry="16" fill="#3d2d1d"/>
  <ellipse cx="1310" cy="335" rx="11" ry="16" fill="#3d2d1d"/>
  <ellipse cx="1300" cy="360" rx="19" ry="13" fill="#d45a5a" opacity="0.75"/>

  <!-- Peer 4 (far right back) -->
  <circle cx="1650" cy="400" r="38" fill="#a89a7a" stroke="#3d2d1d" stroke-width="2" opacity="0.8"/>
  <ellipse cx="1641" cy="413" rx="9" ry="14" fill="#3d2d1d"/>
  <ellipse cx="1659" cy="413" rx="9" ry="14" fill="#3d2d1d"/>
  <ellipse cx="1650" cy="435" rx="17" ry="11" fill="#d45a5a" opacity="0.6"/>

  <!-- Peer 5 (center back) -->
  <circle cx="950" cy="200" r="36" fill="#a89a7a" stroke="#3d2d1d" stroke-width="2" opacity="0.75"/>
  <ellipse cx="942" cy="212" rx="8" ry="13" fill="#3d2d1d"/>
  <ellipse cx="958" cy="212" rx="8" ry="13" fill="#3d2d1d"/>
  <ellipse cx="950" cy="232" rx="16" ry="10" fill="#d45a5a" opacity="0.65"/>

  <!-- Speech bubbles (murmur visualization) -->
  <g fill="none" stroke="#ffb3b3" stroke-width="2" opacity="0.7">
    <!-- Bubble 1 -->
    <path d="M 250 200 Q 200 150 280 150 Q 320 150 330 200 Q 280 180 250 200"/>
    <!-- Bubble 2 -->
    <path d="M 600 150 Q 550 100 650 90 Q 700 85 710 140 Q 650 110 600 150"/>
    <!-- Bubble 3 -->
    <path d="M 1350 220 Q 1320 170 1420 155 Q 1480 145 1500 210 Q 1420 175 1350 220"/>
  </g>

  <!-- Overlapping speech text (illegible, just marks) -->
  <g font-family="Arial" font-size="12" fill="#ffb3b3" opacity="0.6">
    <text x="260" y="175">...blah...</text>
    <text x="600" y="110">...yeah...</text>
    <text x="1370" y="190">...what...</text>
    <text x="950" y="80">...hey...</text>
  </g>

  <!-- Cumulative sensory pressure (hum + click + tap + murmur) -->
  <rect width="1920" height="1080" fill="#ff6666" opacity="0.12"/>

  <!-- Pressure waves from all directions -->
  <g stroke="#ff9999" stroke-width="2" fill="none" opacity="0.6">
    <path d="M 300 345 Q 500 300 700 400"/>
    <path d="M 600 290 Q 800 250 950 300"/>
    <path d="M 1300 360 Q 1200 400 1000 450"/>
    <path d="M 1650 435 Q 1500 500 1200 600"/>
  </g>

  <!-- Ziggy in center (surrounded, small, overwhelmed) -->
  <circle cx="950" cy="600" r="40" fill="#a89a7a" stroke="#3d2d1d" stroke-width="2" opacity="0.6"/>
  <!-- Ziggy's eyes (wide, overwhelmed) -->
  <circle cx="935" cy="590" r="8" fill="#0052CC" opacity="0.8"/>
  <circle cx="965" cy="590" r="8" fill="#0052CC" opacity="0.8"/>
  <!-- Ziggy's mouth (tight, closed) -->
  <line x1="940" y1="620" x2="960" y2="620" stroke="#3d2d1d" stroke-width="2"/>

  <!-- Interior monologue (escalating) -->
  <text x="200" y="850" font-family="Caveat, cursive" font-size="36" fill="#0052CC" opacity="0.9">
    Everyone's talking. Everyone's watching.
  </text>

  <!-- Pressure intensity gauge (4/5) -->
  <rect x="50" y="50" width="300" height="30" fill="#4a4a5a" stroke="#2d2d3d" stroke-width="2" rx="4"/>
  <rect x="55" y="55" width="270" height="20" fill="#ff6666" opacity="0.7" rx="2"/>
  <text x="370" y="75" font-family="Arial" font-size="16" fill="#ff6666">
    Pressure: 4/5
  </text>
</svg>
