<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <!-- Shot 27: Epilogue — Community / Integration (11:00–11:30) -->

  <!-- Classroom setting (welcoming, not threatening) -->
  <rect width="1920" height="1080" fill="#f5f5f5"/>

  <!-- Fluorescent lights (now familiar, not overwhelming) -->
  <g opacity="0.6">
    <rect x="300" y="60" width="400" height="80" fill="#ffffff" stroke="#b8d0e8" stroke-width="3" rx="4"/>
    <rect x="1220" y="60" width="400" height="80" fill="#ffffff" stroke="#b8d0e8" stroke-width="3" rx="4"/>
  </g>

  <!-- Teacher (supportive, in background) -->
  <circle cx="300" cy="250" r="40" fill="#8a7a6a" stroke="#3d2d1d" stroke-width="2" opacity="0.8"/>
  <path d="M 285 260 Q 300 270 315 260" stroke="#3d2d1d" stroke-width="2" fill="none"/>

  <!-- Ziggy (center, confident, glowing with Electric Blue) -->
  <circle cx="960" cy="550" r="70" fill="#a89a7a" stroke="#0052CC" stroke-width="4" opacity="1"/>
  <!-- Eyes confident and warm -->
  <circle cx="945" cy="540" r="8" fill="#0052CC"/>
  <circle cx="975" cy="540" r="8" fill="#0052CC"/>
  <!-- Smile (genuine, belonging) -->
  <path d="M 935 565 Q 960 580 985 565" stroke="#3d2d1d" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Peers around Ziggy (diverse, connected) -->
  <!-- Peer 1 (left) -->
  <circle cx="500" cy="500" r="40" fill="#8a7a6a" stroke="#0052CC" stroke-width="2" opacity="0.9"/>
  <path d="M 485 515 Q 500 525 515 515" stroke="#3d2d1d" stroke-width="2" fill="none"/>
  <!-- Connection to Ziggy -->
  <line x1="540" y1="500" x2="890" y2="540" stroke="#0052CC" stroke-width="1" opacity="0.5"/>

  <!-- Peer 2 (right) -->
  <circle cx="1420" cy="480" r="40" fill="#8a7a6a" stroke="#0052CC" stroke-width="2" opacity="0.9"/>
  <path d="M 1405 495 Q 1420 505 1435 495" stroke="#3d2d1d" stroke-width="2" fill="none"/>
  <!-- Connection to Ziggy -->
  <line x1="1380" y1="480" x2="1030" y2="540" stroke="#0052CC" stroke-width="1" opacity="0.5"/>

  <!-- Peer 3 (front left) -->
  <circle cx="700" cy="700" r="38" fill="#8a7a6a" stroke="#0052CC" stroke-width="2" opacity="0.85"/>
  <path d="M 685 715 Q 700 728 715 715" stroke="#3d2d1d" stroke-width="2" fill="none"/>
  <!-- Connection -->
  <line x1="738" y1="700" x2="920" y2="610" stroke="#0052CC" stroke-width="1" opacity="0.5"/>

  <!-- Peer 4 (front right) -->
  <circle cx="1220" cy="700" r="38" fill="#8a7a6a" stroke="#0052CC" stroke-width="2" opacity="0.85"/>
  <path d="M 1205 715 Q 1220 728 1235 715" stroke="#3d2d1d" stroke-width="2" fill="none"/>
  <!-- Connection -->
  <line x1="1182" y1="700" x2="1000" y2="610" stroke="#0052CC" stroke-width="1" opacity="0.5"/>

  <!-- Peer 5 (back center) -->
  <circle cx="960" cy="350" r="36" fill="#8a7a6a" stroke="#0052CC" stroke-width="2" opacity="0.8"/>
  <path d="M 945 363 Q 960 373 975 363" stroke="#3d2d1d" stroke-width="2" fill="none"/>
  <!-- Connection -->
  <line x1="960" y1="386" x2="960" y2="480" stroke="#0052CC" stroke-width="1" opacity="0.5"/>

  <!-- Ziggy's Electric Blue aura (including everyone) -->
  <circle cx="960" cy="550" r="200" fill="#0052CC" opacity="0.1"/>
  <g stroke="#0052CC" stroke-width="1" fill="none" opacity="0.4">
    <circle cx="960" cy="550" r="150" stroke-dasharray="8,4"/>
    <circle cx="960" cy="550" r="200" stroke-dasharray="8,4"/>
  </g>

  <!-- Classroom items (normal, integrated) -->
  <g opacity="0.5">
    <rect x="150" y="850" width="120" height="80" fill="#c9a881" stroke="#3d2d1d" stroke-width="1" rx="4"/>
    <rect x="350" y="850" width="120" height="80" fill="#c9a881" stroke="#3d2d1d" stroke-width="1" rx="4"/>
    <rect x="1450" y="850" width="120" height="80" fill="#c9a881" stroke="#3d2d1d" stroke-width="1" rx="4"/>
    <rect x="1650" y="850" width="120" height="80" fill="#c9a881" stroke="#3d2d1d" stroke-width="1" rx="4"/>
  </g>

  <!-- Text: Belonging -->
  <text x="960" y="250" font-family="Caveat, cursive" font-size="48" fill="#0052CC" text-anchor="middle" opacity="1" font-weight="bold">
    I'm not alone. I'm SURGE.
  </text>
  <text x="960" y="310" font-family="Caveat, cursive" font-size="32" fill="#0052CC" text-anchor="middle" opacity="0.95" font-weight="bold">
    And I'm here for my people.
  </text>

  <!-- Time stamp -->
  <text x="50" y="1050" font-family="Arial" font-size="14" fill="#999" opacity="0.7">
    Evening: Community found
  </text>
</svg>
