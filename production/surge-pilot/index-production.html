<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SURGE Pilot — Episode 01 (Animated)</title>
  <style>
    * { margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; }
    body { background: #000; overflow: hidden; }
    canvas { display: block; }
  </style>
</head>
<body>
  <canvas id="canvas-container" data-composition-id="surge-pilot-episode-01" data-width="1920" data-height="1080" data-start="0" data-duration="767"></canvas>
  <audio id="surge-audio" src="narration.wav" data-start="0" data-duration="767"></audio>

  <script src="gsap.min.js"></script>
  <script>
    const canvas = document.getElementById('canvas-container');
    const ctx = canvas.getContext('2d');
    canvas.width = 1920;
    canvas.height = 1080;

    const audio = document.getElementById('surge-audio');
    window.__timelines = {};

    // ============================================
    // CHARACTER ANIMATION SYSTEM
    // ============================================

    const characterSystem = {
      // Ziggy character properties
      ziggy: {
        x: 960,
        y: 540,
        width: 400,
        height: 500,
        expression: 'neutral', // neutral, happy, anxious, focused, powerful, grateful
        opacity: 1,
        scale: 1,
        rotation: 0,
        glowIntensity: 0
      },

      // Character expressions (simple procedural rendering)
      drawCharacter(x, y, width, height, expression, opacity, scale, glowIntensity) {
        ctx.save();
        ctx.globalAlpha = opacity;
        ctx.translate(x, y);
        ctx.scale(scale, scale);

        // Head
        const headRadius = width * 0.25;
        ctx.fillStyle = `rgba(230, 180, 140, ${opacity})`;
        ctx.beginPath();
        ctx.arc(0, -height * 0.15, headRadius, 0, Math.PI * 2);
        ctx.fill();

        // Hair
        ctx.fillStyle = `rgba(100, 60, 40, ${opacity})`;
        ctx.beginPath();
        ctx.ellipse(0, -height * 0.15, headRadius * 0.95, headRadius * 0.85, 0, 0, Math.PI * 2);
        ctx.fill();

        // Eyes based on expression
        const eyeY = -height * 0.2;
        const eyeX1 = -width * 0.08;
        const eyeX2 = width * 0.08;
        const eyeSize = width * 0.04;

        ctx.fillStyle = `rgba(80, 40, 20, ${opacity})`;

        switch(expression) {
          case 'happy':
            // Smiling eyes
            ctx.beginPath();
            ctx.arc(eyeX1, eyeY, eyeSize, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(eyeX2, eyeY, eyeSize, 0, Math.PI * 2);
            ctx.fill();
            // Smile
            ctx.strokeStyle = `rgba(100, 60, 40, ${opacity})`;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(0, -height * 0.05, width * 0.08, 0, Math.PI, false);
            ctx.stroke();
            break;

          case 'anxious':
            // Wide worried eyes
            ctx.beginPath();
            ctx.ellipse(eyeX1, eyeY - 5, eyeSize, eyeSize * 1.3, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(eyeX2, eyeY - 5, eyeSize, eyeSize * 1.3, 0, 0, Math.PI * 2);
            ctx.fill();
            // Worried mouth (downturned)
            ctx.strokeStyle = `rgba(100, 60, 40, ${opacity})`;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(0, -height * 0.02, width * 0.08, Math.PI, 0, false);
            ctx.stroke();
            break;

          case 'focused':
            // Concentrated eyes
            ctx.beginPath();
            ctx.arc(eyeX1, eyeY, eyeSize * 0.8, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(eyeX2, eyeY, eyeSize * 0.8, 0, Math.PI * 2);
            ctx.fill();
            // Determined mouth
            ctx.strokeStyle = `rgba(100, 60, 40, ${opacity})`;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(-width * 0.06, height * 0.05);
            ctx.lineTo(width * 0.06, height * 0.05);
            ctx.stroke();
            break;

          case 'powerful':
            // Glowing eyes
            ctx.fillStyle = `rgba(0, 216, 255, ${opacity * 0.8})`;
            ctx.beginPath();
            ctx.arc(eyeX1, eyeY, eyeSize * 1.2, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(eyeX2, eyeY, eyeSize * 1.2, 0, Math.PI * 2);
            ctx.fill();
            // Confident smile
            ctx.strokeStyle = `rgba(100, 60, 40, ${opacity})`;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(0, -height * 0.05, width * 0.1, 0, Math.PI, false);
            ctx.stroke();
            break;

          case 'grateful':
            // Gentle happy eyes
            ctx.fillStyle = `rgba(80, 40, 20, ${opacity})`;
            ctx.beginPath();
            ctx.arc(eyeX1, eyeY, eyeSize, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(eyeX2, eyeY, eyeSize, 0, Math.PI * 2);
            ctx.fill();
            // Warm smile
            ctx.strokeStyle = `rgba(100, 60, 40, ${opacity})`;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(0, -height * 0.05, width * 0.12, 0, Math.PI, false);
            ctx.stroke();
            break;

          default: // neutral
            ctx.beginPath();
            ctx.arc(eyeX1, eyeY, eyeSize, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(eyeX2, eyeY, eyeSize, 0, Math.PI * 2);
            ctx.fill();
        }

        // Body
        ctx.fillStyle = `rgba(100, 150, 200, ${opacity})`;
        ctx.fillRect(-width * 0.15, -height * 0.1, width * 0.3, height * 0.35);

        // Glow effect for powerful moments
        if (glowIntensity > 0) {
          ctx.strokeStyle = `rgba(0, 216, 255, ${glowIntensity * opacity * 0.5})`;
          ctx.lineWidth = 4 + (glowIntensity * 8);
          ctx.beginPath();
          ctx.arc(0, -height * 0.15, headRadius * (1 + glowIntensity * 0.3), 0, Math.PI * 2);
          ctx.stroke();
        }

        ctx.restore();
      }
    };

    // ============================================
    // SCENE DEFINITIONS WITH ANIMATION TIMING
    // ============================================

    const scenes = {
      'act1': {
        start: 0, end: 180,
        title: 'ACT 1 — THE CLASSROOM',
        bgFrom: [15, 20, 25], bgTo: [26, 42, 58],
        narrative: [
          { time: 1.5, text: 'Fluorescent lights hum above.\nEveryone\'s watching.\nEveryone except me is fine.', y: 200, style: 'body', expression: 'anxious' },
          { time: 8, text: 'Wait, what? What\'d she say?', y: 700, style: 'italic', expression: 'anxious' },
          { time: 15, text: 'Tap. Click. Hum.\nEvery sound screams.', y: 850, style: 'body', expression: 'anxious' },
          { time: 30, characterExpression: 'anxious', characterScale: 0.9 },
          { time: 60, characterOpacity: 0.7, anxietyIntensity: 0.3 },
          { time: 120, characterScale: 1, anxietyIntensity: 0.5 },
          { time: 165, characterOpacity: 0.6, anxietyIntensity: 0.8 }
        ],
        effect: 'anxiety'
      },
      'act2': {
        start: 180, end: 330,
        title: 'ACT 2 — SENSORY OVERLOAD',
        bgFrom: [26, 15, 46], bgTo: [45, 27, 62],
        narrative: [
          { time: 182, text: 'The sensory world collapses inward.', y: 200, style: 'body', expression: 'anxious' },
          { time: 187, text: 'What\'s that sound?', y: 700, style: 'italic', expression: 'anxious' },
          { time: 193, text: 'Tap. Tap. Tap.', y: 850, style: 'body', expression: 'anxious' },
          { time: 203, text: 'Everyone\'s talking.\nEveryone\'s watching.\nTime is stretching...', y: 500, style: 'italic', expression: 'anxious' },
          { time: 240, characterOpacity: 0.5, characterScale: 0.8, overloadIntensity: 0.8 },
          { time: 280, overloadIntensity: 1.0, characterGlow: 0.2 },
          { time: 320, characterOpacity: 0.6, characterScale: 0.9 }
        ],
        effect: 'overload'
      },
      'act3': {
        start: 330, end: 560,
        title: 'ACT 3 — THE SURGE',
        bgFrom: [10, 15, 26], bgTo: [26, 58, 82],
        narrative: [
          { time: 338, text: 'This is... me.', y: 300, style: 'italic', expression: 'focused' },
          { time: 341, text: 'This is who I am.', y: 450, style: 'body', expression: 'powerful' },
          { time: 347, text: 'POWERS ACTIVATED', y: 600, style: 'power', expression: 'powerful' },
          { time: 353, text: '⚡ HYPERFOCUS    🚀 SPEED    ❤️ EMPATHY', y: 750, style: 'badge', expression: 'powerful' },
          { time: 366, text: 'I was never broken.\nI was just waiting to SURGE.', y: 900, style: 'italic', expression: 'powerful' },
          { time: 340, characterScale: 1, characterGlow: 0 },
          { time: 347, characterGlow: 0.8, characterScale: 1.1 },
          { time: 365, characterGlow: 1.0, powerGlow: 1.0 }
        ],
        effect: 'power'
      },
      'epilogue': {
        start: 560, end: 767,
        title: 'EPILOGUE — THE HERO',
        bgFrom: [13, 19, 25], bgTo: [26, 35, 47],
        narrative: [
          { time: 577, text: 'Ziggy helps a friend with homework.', y: 250, style: 'italic', expression: 'focused' },
          { time: 583, text: 'My hyperfocus is a gift.', y: 450, style: 'body', expression: 'grateful' },
          { time: 591, text: 'Ziggy rushes to help in an emergency.', y: 650, style: 'italic', expression: 'powerful' },
          { time: 597, text: 'My speed saves the day.', y: 850, style: 'body', expression: 'grateful' },
          { time: 605, text: 'Ziggy listens with deep understanding.', y: 950, style: 'italic', expression: 'grateful' },
          { time: 611, text: 'My empathy heals.', y: 1050, style: 'body', expression: 'grateful' },
          { time: 643, text: 'SURGE: The Superhero Inside', y: 300, style: 'title-final', expression: 'grateful' },
          { time: 651, text: 'Your ADHD isn\'t a limitation.\nIt\'s your superpower.', y: 600, style: 'final', expression: 'happy' },
          { time: 560, characterGlow: 0.3, characterScale: 1 },
          { time: 600, characterGlow: 0.2 },
          { time: 750, characterOpacity: 0.9, characterGlow: 0.4 }
        ],
        effect: 'hero'
      }
    };

    // ============================================
    // UTILITY FUNCTIONS
    // ============================================

    function lerpColor(from, to, t) {
      return [
        Math.round(from[0] + (to[0] - from[0]) * t),
        Math.round(from[1] + (to[1] - from[1]) * t),
        Math.round(from[2] + (to[2] - from[2]) * t)
      ];
    }

    function drawGradient(fromRGB, toRGB) {
      const grad = ctx.createLinearGradient(0, 0, 1920, 1080);
      grad.addColorStop(0, `rgb(${fromRGB[0]}, ${fromRGB[1]}, ${fromRGB[2]})`);
      grad.addColorStop(1, `rgb(${toRGB[0]}, ${toRGB[1]}, ${toRGB[2]})`);
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 1920, 1080);
    }

    function drawText(text, y, size, color, style = 'normal') {
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = color;

      if (style === 'italic') {
        ctx.font = `italic ${size}px 'Georgia', serif`;
      } else if (style === 'power' || style === 'title-final') {
        ctx.font = `900 ${size}px 'Arial', sans-serif`;
        ctx.letterSpacing = '2px';
      } else if (style === 'final') {
        ctx.font = `${size}px 'Georgia', serif`;
      } else if (style === 'badge') {
        ctx.font = `${size}px 'Arial', sans-serif`;
      } else {
        ctx.font = `${size}px 'Arial', sans-serif`;
      }

      const lines = text.split('\n');
      lines.forEach((line, i) => {
        ctx.fillText(line, 960, y + i * (size + 25));
      });
    }

    // ============================================
    // MAIN RENDER FUNCTION
    // ============================================

    function render(time) {
      let currentScene = null;
      for (const [key, scene] of Object.entries(scenes)) {
        if (time >= scene.start && time < scene.end) {
          currentScene = { key, ...scene };
          break;
        }
      }

      if (!currentScene) {
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, 1920, 1080);
        return;
      }

      // Background gradient
      const sceneProgress = (time - currentScene.start) / (currentScene.end - currentScene.start);
      const bgColor = lerpColor(currentScene.bgFrom, currentScene.bgTo, sceneProgress);
      drawGradient(currentScene.bgFrom, currentScene.bgTo);

      // Scene-specific effects
      if (currentScene.effect === 'anxiety' && time > 165) {
        const anxietyIntensity = Math.min(0.5, (time - 165) * 0.1);
        ctx.fillStyle = `rgba(139, 0, 80, ${anxietyIntensity})`;
        ctx.fillRect(0, 0, 1920, 1080);
      }

      if (currentScene.effect === 'overload') {
        const waveIntensity = Math.sin(time * 2) * 0.08 + 0.1;
        ctx.fillStyle = `rgba(138, 43, 226, ${waveIntensity})`;
        ctx.fillRect(0, 0, 1920, 1080);

        // Chaotic noise effect
        const noiseIntensity = Math.sin(time * 3) * 0.15 + 0.2;
        ctx.fillStyle = `rgba(255, 31, 90, ${noiseIntensity * 0.3})`;
        for (let i = 0; i < 5; i++) {
          ctx.fillRect(
            Math.random() * 1920,
            Math.random() * 1080,
            Math.random() * 200,
            Math.random() * 50
          );
        }
      }

      if (currentScene.effect === 'power' && time > 331) {
        const glowPulse = Math.sin((time - 331) * 1.5) * 0.15 + 0.2;
        const grad = ctx.createRadialGradient(960, 540, 0, 960, 540, 1200);
        grad.addColorStop(0, `rgba(0, 216, 255, ${glowPulse})`);
        grad.addColorStop(1, 'transparent');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 1920, 1080);
      }

      // Title
      drawText(currentScene.title, 150, 64, '#00d8ff');

      // Character animation
      let charExpression = 'neutral';
      let charOpacity = 1;
      let charScale = 1;
      let charGlow = 0;

      for (const event of currentScene.narrative) {
        if (time >= event.time && time < currentScene.end) {
          if (event.characterExpression) charExpression = event.characterExpression;
          if (event.characterOpacity !== undefined) charOpacity = event.characterOpacity;
          if (event.characterScale !== undefined) charScale = event.characterScale;
          if (event.characterGlow !== undefined) charGlow = event.characterGlow;
          if (event.expression) charExpression = event.expression;
        }
      }

      // Draw character
      characterSystem.drawCharacter(
        960, 650, 400, 500,
        charExpression, charOpacity, charScale, charGlow
      );

      // Text lines with smooth fade-in
      currentScene.narrative.forEach((line, idx) => {
        if (line.text && time >= line.time && time < currentScene.end) {
          const fadeIn = Math.min(1, (time - line.time) * 1.5);
          const opacity = fadeIn;
          const color = `rgba(224, 224, 224, ${opacity})`;
          const titleColor = `rgba(0, 216, 255, ${opacity})`;

          if (line.style === 'italic') {
            drawText(line.text, line.y, 36, titleColor, 'italic');
          } else if (line.style === 'power') {
            drawText(line.text, line.y, 50, titleColor, 'power');
          } else if (line.style === 'badge') {
            drawText(line.text, line.y, 24, titleColor);
          } else if (line.style === 'title-final') {
            drawText(line.text, line.y, 56, titleColor, 'title-final');
          } else if (line.style === 'final') {
            drawText(line.text, line.y, 32, titleColor, 'final');
          } else {
            drawText(line.text, line.y, 36, color);
          }
        }
      });
    }

    // ============================================
    // GSAP TIMELINE
    // ============================================

    const tl = gsap.timeline({ paused: false });
    window.__timelines['surge-pilot-episode-01'] = tl;

    tl.to({ time: 0 }, {
      time: 767,
      duration: 767,
      onUpdate: function() {
        render(this.targets()[0].time);
      }
    }, 0);
  </script>
</body>
</html>
