<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000">
  <!-- ZIGGY CHEN - Character Portrait -->
  <!-- Background -->
  <rect width="800" height="1000" fill="#f5f5f5"/>

  <!-- Soft glow behind character -->
  <circle cx="400" cy="400" r="300" fill="#0052CC" opacity="0.08"/>

  <!-- ZIGGY - Full Body Portrait -->

  <!-- Legs -->
  <rect x="340" y="600" width="50" height="120" fill="#c9a881" stroke="#2d1f0f" stroke-width="3" rx="6"/>
  <rect x="410" y="600" width="50" height="120" fill="#c9a881" stroke="#2d1f0f" stroke-width="3" rx="6"/>

  <!-- Shoes (simple) -->
  <ellipse cx="365" cy="730" rx="32" ry="20" fill="#4a4a4a" stroke="#2d1f0f" stroke-width="2"/>
  <ellipse cx="435" cy="730" rx="32" ry="20" fill="#4a4a4a" stroke="#2d1f0f" stroke-width="2"/>

  <!-- SOCKS (Asymmetry - design signature) -->
  <!-- Left sock (up) - Electric Blue -->
  <rect x="335" y="570" width="60" height="40" fill="#0052CC" stroke="#2d1f0f" stroke-width="2" rx="4"/>
  <text x="365" y="600" font-family="Arial" font-size="10" fill="#2d1f0f" text-anchor="middle" font-weight="bold">UP</text>

  <!-- Right sock (down) - Warm Orange -->
  <rect x="405" y="585" width="60" height="25" fill="#FF8C3A" stroke="#2d1f0f" stroke-width="2" rx="3"/>
  <text x="435" y="605" font-family="Arial" font-size="10" fill="#2d1f0f" text-anchor="middle" font-weight="bold">DOWN</text>

  <!-- Body (Blue Hoodie) -->
  <rect x="320" y="420" width="160" height="180" fill="#0052CC" stroke="#2d1f0f" stroke-width="4" rx="20"/>

  <!-- Hoodie drawstrings -->
  <line x1="380" y1="420" x2="370" y2="450" stroke="#2d1f0f" stroke-width="2"/>
  <line x1="420" y1="420" x2="430" y2="450" stroke="#2d1f0f" stroke-width="2"/>

  <!-- Arms (extended, ready for action) -->
  <!-- Left arm -->
  <g>
    <rect x="270" y="440" width="50" height="100" fill="#c9a881" stroke="#2d1f0f" stroke-width="3" rx="8"/>
    <!-- Hand -->
    <circle cx="280" cy="560" r="18" fill="#c9a881" stroke="#2d1f0f" stroke-width="2"/>
  </g>

  <!-- Right arm -->
  <g>
    <rect x="480" y="440" width="50" height="100" fill="#c9a881" stroke="#2d1f0f" stroke-width="3" rx="8"/>
    <!-- Hand -->
    <circle cx="520" cy="560" r="18" fill="#c9a881" stroke="#2d1f0f" stroke-width="2"/>
  </g>

  <!-- Head (Circle) -->
  <circle cx="400" cy="300" r="100" fill="#e8d4b8" stroke="#2d1f0f" stroke-width="5"/>

  <!-- Hair (Asymmetrical, Messy) -->
  <!-- Left side (higher, spiky) -->
  <path d="M 330 220 Q 340 160 360 120 Q 370 100 385 130 Q 380 180 365 240" fill="#3d2817" stroke="#2d1f0f" stroke-width="2"/>

  <!-- Right side (chaotic, wild) -->
  <path d="M 415 215 Q 430 150 460 100 Q 480 70 495 140 Q 485 200 470 250" fill="#3d2817" stroke="#2d1f0f" stroke-width="2"/>

  <!-- Top spiky bits -->
  <line x1="375" y1="190" x2="370" y2="130" stroke="#3d2817" stroke-width="4" stroke-linecap="round"/>
  <line x1="400" y1="185" x2="405" y2="110" stroke="#3d2817" stroke-width="4" stroke-linecap="round"/>
  <line x1="425" y1="190" x2="435" y2="120" stroke="#3d2817" stroke-width="4" stroke-linecap="round"/>

  <!-- Eyes (Electric Blue, Wide, Bright, Expressive) -->
  <g>
    <!-- Left eye -->
    <circle cx="365" cy="280" r="20" fill="#0052CC" stroke="#2d1f0f" stroke-width="3"/>
    <circle cx="365" cy="280" r="12" fill="#ffffff" opacity="0.9"/>
    <circle cx="368" cy="278" r="7" fill="#000"/>
    <!-- Highlight (spark of intelligence) -->
    <circle cx="370" cy="275" r="3" fill="#ffffff"/>

    <!-- Right eye -->
    <circle cx="435" cy="280" r="20" fill="#0052CC" stroke="#2d1f0f" stroke-width="3"/>
    <circle cx="435" cy="280" r="12" fill="#ffffff" opacity="0.9"/>
    <circle cx="438" cy="278" r="7" fill="#000"/>
    <!-- Highlight -->
    <circle cx="440" cy="275" r="3" fill="#ffffff"/>
  </g>

  <!-- Eyebrows (Expressive, slightly worried) -->
  <path d="M 350 260 Q 365 250 380 260" stroke="#3d2817" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 420 260 Q 435 250 450 260" stroke="#3d2817" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Nose (simple, centered) -->
  <line x1="400" y1="270" x2="400" y2="330" stroke="#3d2817" stroke-width="3"/>

  <!-- Mouth (Open, engaged, intelligent expression) -->
  <path d="M 385 350 Q 400 365 415 350" stroke="#2d1f0f" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Character details: Freckles (East Asian features) -->
  <g fill="#c9956d" opacity="0.6">
    <circle cx="350" cy="310" r="2"/>
    <circle cx="450" cy="315" r="2"/>
    <circle cx="370" cy="320" r="1.5"/>
    <circle cx="430" cy="320" r="1.5"/>
  </g>

  <!-- Orange Accents (on hoodie) -->
  <rect x="360" y="430" width="80" height="8" fill="#FF8C3A" stroke="#2d1f0f" stroke-width="1" rx="2"/>

  <!-- Name and Character Info -->
  <text x="400" y="800" font-family="Arial, sans-serif" font-size="48" fill="#0052CC" text-anchor="middle" font-weight="bold">ZIGGY CHEN</text>

  <text x="400" y="850" font-family="Arial, sans-serif" font-size="20" fill="#8b8b8b" text-anchor="middle">Age: 10 | Mixed ADHD | Midwest</text>

  <text x="400" y="880" font-family="Arial, sans-serif" font-size="16" fill="#c9a881" text-anchor="middle" font-style="italic">Superpower: Hyperfocus + Pattern Recognition + Emotional Intensity</text>

  <!-- Design Notes -->
  <g font-family="Arial, sans-serif" font-size="12" fill="#5d5d5d">
    <text x="30" y="950">• Circle head • Asymmetrical hair • Electric Blue eyes • Blue hoodie • One sock up, one down</text>
  </g>
</svg>
