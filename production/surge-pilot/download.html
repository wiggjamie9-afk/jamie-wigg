<!DOCTYPE html>

    body {

      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      text-align: center;
      max-width: 600px;
    }
    h1 {
      font-size: 2.5em;
      margin-bottom: 20px;
      background: linear-gradient(135deg, #00d8ff, #ff1f5a);
      -webkit-background-clip: text;

      text-decoration: none;
      border-radius: 8px;
      font-size: 1.1em;
      font-weight: 600;
      margin: 20px 10px;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .download-btn:active {
      transform: scale(0.98);
      box-shadow: 0 0 20px rgba(0, 216, 255, 0.5);
    }
    .concept-btn {
      display: inline-block;
      padding: 12px 30px;
      background: rgba(0, 216, 255, 0.2);
      border: 1px solid #00d8ff;
      color: #00d8ff;
      text-decoration: none;
      border-radius: 6px;
