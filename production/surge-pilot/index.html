<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SURGE Pilot — Act 1 (Opening Sequence)</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #000;
      overflow: hidden;
    }

    #canvas-container {
      width: 100vw;
      height: 100vh;
      position: relative;
      background: #1a1a1a;
    }

    /* Scene wrapper */
    .scene {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      opacity: 0;
    }

    .scene.active {
      opacity: 1;
    }

    /* Shot containers */
    .shot {
      width: 100%;
      height: 100%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background-size: cover;
      background-position: center;
    }

    /* Interior monologue text (Caveat font) */
    .interior-monologue {
      position: absolute;
      bottom: 20%;
      left: 5%;
      right: 5%;
      font-family: 'Caveat', cursive;
      font-size: 24px;
      color: #0052CC; /* Electric Blue */
      line-height: 1.6;
      max-width: 60%;
      opacity: 0;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    }

    /* Jitter effect class */
    .jitter {
      animation: jitter-effect 0.08s infinite;
    }

    @keyframes jitter-effect {
      0%, 100% { transform: translate(0, 0); }
      25% { transform: translate(-1px, 1px); }
      50% { transform: translate(1px, -1px); }
      75% { transform: translate(-1px, -1px); }
    }

    /* Sensory overlay (for montage) */
    .sensory-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      opacity: 0;
    }

    /* Shame color cast (Burgundy) */
    .shame-cast {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(93, 30, 59, 0.4); /* Burgundy with alpha */
      pointer-events: none;
      opacity: 0;
    }

    /* Timecode display (dev only, hidden on render) */
    .timecode {
      position: absolute;
      top: 20px;
      left: 20px;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      color: #999;
      z-index: 1000;
    }
  </style>
</head>
<body>
  <div id="canvas-container">
    <!-- SCENE 1: ACT 1 OPENING SEQUENCE -->
    <div class="scene act-1" id="scene-act1">
      <!-- SHOT 1: Classroom Establishing (0:00–0:30) -->
      <div class="shot" id="shot-01" style="background-image: url('assets/keyframes/shot-01-classroom-establishing.png');">
        <div class="timecode">0:00–0:30</div>
      </div>

      <!-- SHOT 2: Teacher Speaking (0:30–1:00) -->
      <div class="shot" id="shot-02" style="background-image: url('assets/keyframes/shot-02-teacher.png');">
        <div class="timecode">0:30–1:00</div>
      </div>

      <!-- SHOT 3: Ziggy at Desk (1:00–1:30) — WITH JITTER -->
      <div class="shot jitter" id="shot-03" style="background-image: url('assets/keyframes/shot-03-ziggy-desk.png');">
        <div class="timecode">1:00–1:30</div>
        <div class="interior-monologue">
          Wait, what? What'd she say?
        </div>
      </div>

      <!-- SHOT 4: Sensory Montage (1:30–2:30) — 4 QUICK LAYERS -->
      <div class="shot" id="shot-04-montage">
        <!-- Layer 1: Fluorescent Hum -->
        <div class="sensory-overlay" id="layer-hum" style="background-image: url('assets/keyframes/shot-04a-sensory-hum.png');"></div>

        <!-- Layer 2: Fan Click -->
        <div class="sensory-overlay" id="layer-fan" style="background-image: url('assets/keyframes/shot-04b-sensory-fan.png');"></div>

        <!-- Layer 3: Pencil Tap -->
        <div class="sensory-overlay" id="layer-pencil" style="background-image: url('assets/keyframes/shot-04c-sensory-pencil.png');"></div>

        <!-- Layer 4: Isolation -->
        <div class="sensory-overlay" id="layer-isolation" style="background-image: url('assets/keyframes/shot-04d-sensory-isolation.png');"></div>

        <div class="timecode">1:30–2:30</div>
        <div class="interior-monologue">
          Hum... click... tap... everyone's watching...
        </div>
      </div>

      <!-- SHOT 15: Shame Moment (2:30–3:00) — BURGUNDY CAST + DISSOCIATION -->
      <div class="shot" id="shot-15" style="background-image: url('assets/keyframes/shot-15-shame-moment.png');">
        <div class="shame-cast"></div>
        <div class="timecode">2:30–3:00</div>
      </div>
    </div>
  </div>

  <!-- GSAP for motion control -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

  <script>
    // Timeline master (SURGE pilot)
    const tl = gsap.timeline({ paused: false });

    // SCENE: Act 1 Opening Sequence
    const scene1 = gsap.timeline();

    // SHOT 1: Classroom establishing (0:00–0:30)
    // Fade in, hold steady
    scene1.to('#shot-01', {
      opacity: 1,
      duration: 0.5,
    }, 0);
    scene1.to('#shot-01', {
      opacity: 0,
      duration: 0.5,
    }, '1.5'); // Exit at 1:00 (500ms fade + 500ms hold + fade)

    // SHOT 3: Ziggy at desk (1:00–1:30)
    // Jitter effect intensifies, interior monologue appears
    scene1.to('#shot-03', {
      opacity: 1,
      duration: 0.3,
    }, '1.0');
    scene1.to('.interior-monologue', {
      opacity: 1,
      duration: 0.5,
    }, '1.2');
    scene1.to('#shot-03', {
      opacity: 0,
      duration: 0.3,
    }, '1.7');

    // SHOT 4: Sensory montage (1:30–2:30)
    // Layer in sensory overlays one by one
    scene1.to('#layer-hum', { opacity: 0.6, duration: 0.2 }, '1.5'); // Hum appears
    scene1.to('#layer-fan', { opacity: 0.4, duration: 0.2 }, '1.7'); // Fan adds
    scene1.to('#layer-pencil', { opacity: 0.4, duration: 0.2 }, '1.9'); // Pencil adds
    scene1.to('#layer-isolation', { opacity: 0.5, duration: 0.2 }, '2.1'); // Isolation adds

    // Cumulative pressure: fade them all out together
    scene1.to([
      '#layer-hum',
      '#layer-fan',
      '#layer-pencil',
      '#layer-isolation',
    ], {
      opacity: 0,
      duration: 0.3,
    }, '2.5');

    // SHOT 15: Shame moment (2:30–3:00)
    // Burgundy cast appears, eyes close, dissociation visible
    scene1.to('#shot-15', {
      opacity: 1,
      duration: 0.2,
    }, '2.5');
    scene1.to('.shame-cast', {
      opacity: 1,
      duration: 0.3,
    }, '2.6');
    scene1.to('#shot-15', {
      opacity: 0,
      duration: 0.5,
    }, '2.8'); // Hold briefly then fade out

    // Attach timeline to master
    tl.add(scene1, 0);

    // Play from start
    tl.play();
  </script>
</body>
</html>
