<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SURGE Pilot — Episode 01</title>
  <style>
    * { margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; }
    body { background: #000; overflow: hidden; }
    canvas { display: block; }
  </style>
</head>
<body>
  <canvas id="canvas-container" data-composition-id="surge-pilot-episode-01" data-width="1920" data-height="1080" data-start="0" data-duration="767"></canvas>
  <audio id="surge-audio" src="narration.wav" data-start="0" data-duration="767" data-track-index="0" data-volume="1"></audio>

  <script src="gsap.min.js"></script>
  <script>
    const canvas = document.getElementById('canvas-container');
    const ctx = canvas.getContext('2d', { alpha: false });
    canvas.width = 1920;
    canvas.height = 1080;

    window.__timelines = {};

    // Scene data
    const scenes = {
      'act1': {
        start: 0,
        end: 180,
        bg: { from: [15, 20, 25], to: [26, 42, 58] },
        title: 'ACT 1 — THE CLASSROOM',
        lines: [
          { time: 1.5, text: 'Fluorescent lights hum above.\nEveryone\'s watching.\nEveryone except me is fine.' },
          { time: 8, text: 'Wait, what? What\'d she say?', style: 'italic' },
          { time: 15, text: 'Tap. Click. Hum.\nEvery sound screams.' }
        ]
      },
      'act2': {
        start: 180,
        end: 330,
        bg: { from: [26, 15, 46], to: [45, 27, 62] },
        title: 'ACT 2 — SENSORY OVERLOAD',
        lines: [
          { time: 182, text: 'The sensory world collapses inward.' },
          { time: 187, text: 'What\'s that sound?', style: 'italic' },
          { time: 193, text: 'Tap. Tap. Tap.' },
          { time: 203, text: 'Everyone\'s talking.\nEveryone\'s watching.\nTime is stretching...', style: 'italic' },
          { time: 215, text: 'Everything slowing.\nPressure building.' }
        ]
      },
      'act3': {
        start: 330,
        end: 560,
        bg: { from: [10, 15, 26], to: [26, 58, 82] },
        title: 'ACT 3 — THE SURGE',
        lines: [
          { time: 338, text: 'This is... me.', style: 'italic' },
          { time: 341, text: 'This is who I am.' },
          { time: 347, text: 'POWERS ACTIVATED', style: 'power' },
          { time: 353, text: '⚡ HYPERFOCUS    🚀 SPEED    ❤️ EMPATHY', style: 'badge' },
          { time: 366, text: 'I was never broken.\nI was just waiting to SURGE.', style: 'italic' },
          { time: 377, text: 'The classroom transforms.' }
        ]
      },
      'epilogue': {
        start: 570,
        end: 767,
        bg: { from: [13, 19, 25], to: [26, 35, 47] },
        title: 'EPILOGUE — THE HERO',
        lines: [
          { time: 577, text: 'Ziggy helps a friend with homework.', style: 'italic' },
          { time: 583, text: 'My hyperfocus is a gift.' },
          { time: 591, text: 'Ziggy rushes to help in an emergency.', style: 'italic' },
          { time: 597, text: 'My speed saves the day.' },
          { time: 605, text: 'Ziggy listens with deep understanding.', style: 'italic' },
          { time: 611, text: 'My empathy heals.' },
          { time: 643, text: 'SURGE: The Superhero Inside', style: 'title-final' },
          { time: 651, text: 'Your ADHD isn\'t a limitation.\nIt\'s your superpower.', style: 'final' }
        ]
      }
    };

    // Drawing functions
    function lerpColor(from, to, t) {
      return [
        Math.round(from[0] + (to[0] - from[0]) * t),
        Math.round(from[1] + (to[1] - from[1]) * t),
        Math.round(from[2] + (to[2] - from[2]) * t)
      ];
    }

    function drawGradient(fromRGB, toRGB) {
      const grad = ctx.createLinearGradient(0, 0, 1920, 1080);
      grad.addColorStop(0, `rgb(${fromRGB[0]}, ${fromRGB[1]}, ${fromRGB[2]})`);
      grad.addColorStop(1, `rgb(${toRGB[0]}, ${toRGB[1]}, ${toRGB[2]})`);
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 1920, 1080);
    }

    function drawText(text, y, size, color, style = 'normal') {
      ctx.font = `${size}px 'Inter', sans-serif`;
      ctx.fillStyle = color;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      if (style === 'italic') ctx.font = `italic ${size}px 'Caveat', cursive`;
      if (style === 'power' || style === 'title-final') ctx.font = `900 ${size}px 'Inter', sans-serif`;

      const lines = text.split('\n');
      lines.forEach((line, i) => {
        ctx.fillText(line, 960, y + i * (size + 20));
      });
    }

    // Master render function
    function render(time) {
      // Determine scene
      let currentScene = null;
      for (const [key, scene] of Object.entries(scenes)) {
        if (time >= scene.start && time < scene.end) {
          currentScene = { key, ...scene };
          break;
        }
      }

      if (!currentScene) {
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, 1920, 1080);
        return;
      }

      // Draw background gradient
      const sceneProgress = (time - currentScene.start) / (currentScene.end - currentScene.start);
      const bgColor = lerpColor(currentScene.bg.from, currentScene.bg.to, sceneProgress);
      drawGradient(currentScene.bg.from, currentScene.bg.to);

      // Draw title
      drawText(currentScene.title, 150, 64, '#00d8ff');

      // Draw lines with opacity based on time
      currentScene.lines.forEach(line => {
        if (time >= line.time && time < currentScene.end) {
          const lineOpacity = Math.min(1, (time - line.time) * 2);
          const color = `rgba(224, 224, 224, ${lineOpacity})`;
          const titleColor = `rgba(0, 216, 255, ${lineOpacity})`;

          if (line.style === 'italic') {
            drawText(line.text, 400 + currentScene.lines.indexOf(line) * 120, 36, titleColor, 'italic');
          } else if (line.style === 'power') {
            drawText(line.text, 500, 40, titleColor, 'power');
          } else if (line.style === 'badge') {
            drawText(line.text, 600, 20, titleColor);
          } else if (line.style === 'title-final') {
            drawText(line.text, 300, 56, titleColor, 'title-final');
          } else if (line.style === 'final') {
            drawText(line.text, 700, 28, titleColor);
          } else {
            drawText(line.text, 400 + currentScene.lines.indexOf(line) * 120, 32, color);
          }
        }
      });

      // Visual effects
      if (currentScene.key === 'act1' && time > 165) {
        ctx.fillStyle = `rgba(139, 0, 80, ${Math.min(0.4, (time - 165) * 0.2)})`;
        ctx.fillRect(0, 0, 1920, 1080);
      }

      if (currentScene.key === 'act3' && time > 331) {
        const glowOpacity = Math.sin((time - 331) * 0.5) * 0.1 + 0.15;
        ctx.fillStyle = `rgba(0, 216, 255, ${glowOpacity})`;
        const grad = ctx.createRadialGradient(960, 540, 0, 960, 540, 1200);
        grad.addColorStop(0, `rgba(0, 216, 255, ${glowOpacity})`);
        grad.addColorStop(1, 'transparent');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 1920, 1080);
      }
    }

    // GSAP timeline
    const tl = gsap.timeline({ paused: false });
    window.__timelines['surge-pilot-episode-01'] = tl;

    // Simple tween over entire duration that triggers render
    tl.to({ time: 0 }, {
      time: 767,
      duration: 767,
      onUpdate: function() {
        render(this.targets()[0].time);
      }
    }, 0);
  </script>
</body>
</html>
