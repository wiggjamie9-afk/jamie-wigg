<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px; height: 1920px;
        overflow: hidden;
        background: #08050d;
        font-family: "Space Grotesk", system-ui, sans-serif;
        color: #ffffff;
      }
      .scene { position: absolute; inset: 0; width: 1080px; height: 1920px; }
      .scene-inner {
        position: absolute; inset: 0;
        display: flex; flex-direction: column;
        justify-content: center; align-items: center;
        padding: 130px 70px;
        background: #08050d;
      }
      .scene-bg-radial {
        position: absolute; inset: 0;
        background:
          radial-gradient(700px 800px at 25% 25%, rgba(124, 58, 237, 0.30), transparent 60%),
          radial-gradient(700px 800px at 75% 75%, rgba(255, 31, 90, 0.24), transparent 65%);
        pointer-events: none;
      }
      .grid-overlay {
        position: absolute; inset: 0;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.045) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.045) 1px, transparent 1px);
        background-size: 60px 60px;
        pointer-events: none;
      }
      .gradient-text {
        background: linear-gradient(135deg, #ff7aa6, #e0c0ff 50%, #8af6ff);
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .label-mono {
        font-family: "JetBrains Mono", monospace;
        font-size: 24px; letter-spacing: 5px;
        color: #e6e6ee; text-transform: uppercase;
      }
      /* Scene 1 — Stop dreaming + reveal */
      #scene1 .hook { font-weight: 800; font-size: 110px; letter-spacing: -3px; line-height: 1.0; text-align: center; }
      #scene1 .hook em { font-style: normal; }
      #scene1 .reveal { opacity: 0; text-align: center; margin-top: 60px; }
      #scene1 .reveal .wordmark { font-weight: 800; font-size: 170px; letter-spacing: -6px; line-height: 0.9; margin-bottom: 26px; }
      #scene1 .reveal .tagline { font-family: "JetBrains Mono", monospace; font-size: 28px; letter-spacing: 6px; color: #fff; text-transform: uppercase; }
      /* Scene 2 — Steps stack */
      #scene2 .eyebrow { margin-bottom: 50px; }
      #scene2 .steps { display: flex; flex-direction: column; gap: 24px; width: 100%; }
      #scene2 .step {
        display: flex; align-items: center; gap: 22px;
        background: linear-gradient(90deg, rgba(40,30,60,0.95), rgba(28,22,42,0.6));
        border: 1px solid rgba(255,255,255,0.14);
        border-radius: 22px;
        padding: 26px 32px;
      }
      #scene2 .step-num { font-family: "JetBrains Mono", monospace; font-weight: 800; font-size: 50px; min-width: 80px; }
      #scene2 .step-num.cyan { color: #8af6ff; }
      #scene2 .step-num.purple { color: #e0c0ff; }
      #scene2 .step-num.pink { color: #ff7aa6; }
      #scene2 .step-name { font-weight: 800; font-size: 56px; letter-spacing: -1.5px; }
      /* Scene 3 — Pillars 4-up */
      #scene3 .eyebrow { margin-bottom: 50px; }
      #scene3 .pillars { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; width: 100%; }
      #scene3 .pillar {
        background: linear-gradient(135deg, rgba(40,30,60,0.95), rgba(28,22,42,0.6));
        border: 1px solid rgba(255,255,255,0.14);
        border-radius: 22px;
        padding: 30px 22px;
        text-align: center;
      }
      #scene3 .pillar-num { font-family: "JetBrains Mono", monospace; font-size: 32px; font-weight: 800; }
      #scene3 .pillar-num.pink { color: #ffaedb; }
      #scene3 .pillar-num.green { color: #6effc0; }
      #scene3 .pillar-num.cyan { color: #8af6ff; }
      #scene3 .pillar-num.gold { color: #ffe070; }
      #scene3 .pillar-name { font-weight: 800; font-size: 52px; letter-spacing: -1.5px; margin-top: 6px; }
      /* Scene 4 — CTA */
      #scene4 .badge {
        display: inline-flex; align-items: center; gap: 14px;
        padding: 14px 28px;
        border: 1px solid rgba(110, 255, 192, 0.55);
        background: rgba(110, 255, 192, 0.14);
        border-radius: 999px;
        font-family: "JetBrains Mono", monospace;
        font-size: 22px; letter-spacing: 5px;
        color: #b6ffe0; text-transform: uppercase;
        margin-bottom: 50px;
      }
      #scene4 .badge .dot { width: 12px; height: 12px; border-radius: 50%; background: #6effc0; box-shadow: 0 0 22px #6effc0; }
      #scene4 .h2 { font-weight: 800; font-size: 180px; letter-spacing: -7px; line-height: 1; margin-bottom: 28px; text-align: center; }
      #scene4 .deck { font-family: "JetBrains Mono", monospace; font-size: 26px; letter-spacing: 6px; color: #fff; text-transform: uppercase; margin-bottom: 50px; text-align: center; line-height: 1.5; }
      #scene4 .wordmark { font-weight: 800; font-size: 130px; letter-spacing: -4px; line-height: 0.9; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="30" data-width="1080" data-height="1920">
      <audio id="narration" class="clip" data-start="0.8" data-duration="16" data-track-index="0" data-volume="1" src="narration.wav"></audio>

      <!-- Scene 1: HOOK + REVEAL 0–8s -->
      <div id="scene1" class="scene clip" data-start="0" data-duration="8" data-track-index="1">
        <div class="scene-inner" id="scene1-inner">
          <div class="scene-bg-radial"></div>
          <div class="grid-overlay"></div>
          <div class="hook" id="hook-1">Stop dreaming<br/>about making <em class="gradient-text">music.</em></div>
          <div class="reveal" id="reveal">
            <div class="wordmark gradient-text">RHYTHMIX</div>
            <div class="tagline">A studio in your pocket</div>
          </div>
        </div>
      </div>

      <!-- Scene 2: STEPS 7.5–15s — Describe / Refine / Release -->
      <div id="scene2" class="scene clip" data-start="7.5" data-duration="7.5" data-track-index="2">
        <div class="scene-inner" id="scene2-inner">
          <div class="scene-bg-radial"></div>
          <div class="grid-overlay"></div>
          <div class="eyebrow label-mono">How it works</div>
          <div class="steps">
            <div class="step"><div class="step-num cyan">01</div><div class="step-name">Describe</div></div>
            <div class="step"><div class="step-num purple">02</div><div class="step-name">Refine</div></div>
            <div class="step"><div class="step-num pink">03</div><div class="step-name">Release</div></div>
          </div>
        </div>
      </div>

      <!-- Scene 3: PILLARS 14.5–22s -->
      <div id="scene3" class="scene clip" data-start="14.5" data-duration="7.5" data-track-index="3">
        <div class="scene-inner" id="scene3-inner">
          <div class="scene-bg-radial"></div>
          <div class="grid-overlay"></div>
          <div class="eyebrow label-mono">Four pillars</div>
          <div class="pillars">
            <div class="pillar"><div class="pillar-num pink">01</div><div class="pillar-name">Generate</div></div>
            <div class="pillar"><div class="pillar-num green">02</div><div class="pillar-name">Master</div></div>
            <div class="pillar"><div class="pillar-num cyan">03</div><div class="pillar-name">Distribute</div></div>
            <div class="pillar"><div class="pillar-num gold">04</div><div class="pillar-name">Earn</div></div>
          </div>
        </div>
      </div>

      <!-- Scene 4: CTA 21.5–30s -->
      <div id="scene4" class="scene clip" data-start="21.5" data-duration="8.5" data-track-index="4">
        <div class="scene-inner" id="scene4-inner">
          <div class="scene-bg-radial"></div>
          <div class="grid-overlay"></div>
          <div class="badge"><span class="dot"></span>Waitlist open</div>
          <div class="h2"><span class="gradient-text">Be first.</span></div>
          <div class="deck">No payment.<br/>No pressure.</div>
          <div class="wordmark gradient-text">RHYTHMIX</div>
        </div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Scene 1
      tl.from("#hook-1", { y: 50, opacity: 0, duration: 0.7, ease: "expo.out" }, 0.3);
      tl.to("#hook-1", { opacity: 0, y: -30, duration: 0.4, ease: "power2.in" }, 3.4);
      tl.fromTo("#reveal", { opacity: 0, y: 0 }, { opacity: 1, duration: 0.5, ease: "power1.out" }, 3.6);
      tl.from("#scene1 .reveal .wordmark", { y: 60, opacity: 0, scale: 0.94, duration: 0.85, ease: "expo.out" }, 3.7);
      tl.from("#scene1 .reveal .tagline", { y: 22, opacity: 0, duration: 0.55, ease: "power2.out" }, 4.4);
      tl.to("#scene1-inner", { opacity: 0, duration: 0.5, ease: "power1.inOut" }, 7.0);

      // Scene 2
      tl.from("#scene2-inner", { opacity: 0, duration: 0.5, ease: "power1.inOut" }, 7.5);
      tl.from("#scene2 .eyebrow", { y: -20, opacity: 0, duration: 0.45, ease: "power2.out" }, 7.8);
      tl.from("#scene2 .step", { x: -50, opacity: 0, duration: 0.5, ease: "expo.out", stagger: 0.5 }, 8.0);
      tl.to("#scene2-inner", { opacity: 0, duration: 0.5, ease: "power1.inOut" }, 14.5);

      // Scene 3
      tl.from("#scene3-inner", { opacity: 0, duration: 0.5, ease: "power1.inOut" }, 14.5);
      tl.from("#scene3 .eyebrow", { y: -20, opacity: 0, duration: 0.45, ease: "power2.out" }, 14.8);
      tl.from("#scene3 .pillar", { y: 40, opacity: 0, duration: 0.45, ease: "expo.out", stagger: 0.3 }, 15.1);
      tl.from("#scene3 .pillar-num", { scale: 0.6, opacity: 0, duration: 0.4, ease: "back.out(1.6)", stagger: 0.3 }, 15.25);
      tl.to("#scene3-inner", { opacity: 0, duration: 0.5, ease: "power1.inOut" }, 21.5);

      // Scene 4 CTA
      tl.from("#scene4-inner", { opacity: 0, duration: 0.5, ease: "power1.inOut" }, 21.5);
      tl.from("#scene4 .badge", { y: -22, opacity: 0, duration: 0.55, ease: "power3.out" }, 21.9);
      tl.from("#scene4 .h2", { y: 60, opacity: 0, scale: 0.92, duration: 0.95, ease: "expo.out" }, 22.4);
      tl.from("#scene4 .deck", { opacity: 0, duration: 0.6, ease: "power1.out" }, 23.4);
      tl.from("#scene4 .wordmark", { scale: 0.85, opacity: 0, duration: 0.8, ease: "back.out(1.5)" }, 24.1);
      tl.to("#scene4 .wordmark", { scale: 1.05, duration: 2.0, ease: "sine.inOut", yoyo: true, repeat: 1 }, 25.5);
      tl.to("#scene4-inner", { opacity: 0, duration: 0.6, ease: "power2.inOut" }, 29.4);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
