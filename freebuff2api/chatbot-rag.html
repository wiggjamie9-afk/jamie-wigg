<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Assistant with RAG</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 700px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      height: 700px;
      overflow: hidden;
    }

    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 24px;
      text-align: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .header h1 {
      font-size: 24px;
      margin-bottom: 8px;
    }

    .header p {
      font-size: 13px;
      opacity: 0.9;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message {
      display: flex;
      gap: 12px;
      animation: slideIn 0.3s ease-out;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message.user {
      justify-content: flex-end;
    }

    .message-content {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 12px;
      word-wrap: break-word;
      white-space: pre-wrap;
      line-height: 1.5;
    }

    .message.user .message-content {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border-bottom-right-radius: 4px;
    }

    .message.assistant .message-content {
      background: #f0f0f0;
      color: #333;
      border-bottom-left-radius: 4px;
    }

    .message.error .message-content {
      background: #fee;
      color: #c33;
      border-left: 3px solid #c33;
    }

    .sources {
      font-size: 11px;
      opacity: 0.7;
      margin-top: 8px;
      font-style: italic;
    }

    .typing-indicator {
      display: flex;
      gap: 4px;
      padding: 12px 16px;
    }

    .typing-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #667eea;
      animation: typing 1.4s infinite;
    }

    .typing-dot:nth-child(2) {
      animation-delay: 0.2s;
    }

    .typing-dot:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes typing {
      0%, 60%, 100% {
        opacity: 0.5;
        transform: translateY(0);
      }
      30% {
        opacity: 1;
        transform: translateY(-10px);
      }
    }

    .footer {
      border-top: 1px solid #e0e0e0;
      padding: 16px;
      background: white;
    }

    .input-group {
      display: flex;
      gap: 12px;
    }

    #message {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      resize: none;
      max-height: 100px;
    }

    #message:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    button {
      padding: 12px 24px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s;
      white-space: nowrap;
      height: fit-content;
    }

    button:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 16px rgba(102, 126, 234, 0.4);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .status {
      font-size: 12px;
      color: #999;
      margin-top: 8px;
      text-align: center;
    }

    .status.error {
      color: #c33;
    }

    .messages::-webkit-scrollbar {
      width: 6px;
    }

    .messages::-webkit-scrollbar-track {
      background: #f1f1f1;
    }

    .messages::-webkit-scrollbar-thumb {
      background: #ccc;
      border-radius: 3px;
    }

    @media (max-width: 600px) {
      .container {
        height: 100vh;
        border-radius: 0;
      }

      .message-content {
        max-width: 90%;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🤖 AI Assistant</h1>
      <p>With RAG (Retrieval-Augmented Generation)</p>
    </div>

    <div class="messages" id="messages"></div>

    <div class="footer">
      <form id="chat">
        <div class="input-group">
          <textarea
            id="message"
            placeholder="Ask me anything..."
            rows="1"
          ></textarea>
          <button type="submit" id="send-btn">Send</button>
        </div>
        <div class="status" id="status"></div>
      </form>
    </div>
  </div>

  <script>
    const FREEBUFF_API = 'http://localhost:8080/v1/chat/completions';
    const messagesDiv = document.getElementById('messages');
    const form = document.getElementById('chat');
    const messageInput = document.getElementById('message');
    const sendBtn = document.getElementById('send-btn');
    const statusDiv = document.getElementById('status');

    // Sample knowledge base
    const knowledgeBase = [
      {
        id: 1,
        title: "What is Freebuff2API?",
        content: "Freebuff2API is an OpenAI-compatible proxy server that translates standard OpenAI API requests into Freebuff's backend format. It enables any OpenAI-compatible client, SDK, or CLI tool to work with Freebuff's free models."
      },
      {
        id: 2,
        title: "How to get Freebuff tokens",
        content: "Visit https://freebuff.llm.pm, log in with your account, and copy your authToken. Or use the Freebuff CLI: npm install -g freebuff && freebuff. Your token will be saved to ~/.config/manicode/credentials.json"
      },
      {
        id: 3,
        title: "Token rotation features",
        content: "Freebuff2API supports multi-token rotation with configurable intervals. Add multiple tokens to the AUTH_TOKENS array in config.json, and the proxy will automatically rotate between them on a schedule (default 6 hours)."
      },
      {
        id: 4,
        title: "Stealth request handling",
        content: "The proxy uses randomized user agents and includes stealth request handling to mimic official Freebuff SDK behavior. This helps avoid detection and ensures compatibility with Freebuff's security measures."
      },
      {
        id: 5,
        title: "Deployment options",
        content: "Freebuff2API can be deployed via Docker, Docker Compose, Kubernetes, AWS ECS, or from source. Use 'make docker-build' for Docker or 'docker compose up' for quick deployment with environment variables."
      },
      {
        id: 6,
        title: "Configuration",
        content: "Configuration is via config.json or environment variables. Key settings: LISTEN_ADDR (default :8080), UPSTREAM_BASE_URL (https://codebuff.com), AUTH_TOKENS, ROTATION_INTERVAL (6h), REQUEST_TIMEOUT (15m), API_KEYS, HTTP_PROXY."
      },
      {
        id: 7,
        title: "Health checks",
        content: "The proxy exposes a health check endpoint at GET /health that returns {'status':'healthy'}. Use this for load balancer health checks or monitoring."
      },
      {
        id: 8,
        title: "API endpoints",
        content: "Supported endpoints: POST /v1/chat/completions (chat), POST /v1/completions (text), GET /v1/models (list models), GET /health (health check). All endpoints require valid authentication."
      }
    ];

    let isLoading = false;

    // Compute simple embedding (hash-based for demo)
    function getEmbedding(text) {
      const words = text.toLowerCase().split(/\s+/);
      const embedding = new Array(128).fill(0);
      for (let word of words) {
        let hash = 0;
        for (let i = 0; i < word.length; i++) {
          hash = ((hash << 5) - hash) + word.charCodeAt(i);
          hash = hash & hash;
        }
        embedding[Math.abs(hash) % 128]++;
      }
      return embedding;
    }

    // Cosine similarity
    function cosineSimilarity(a, b) {
      let dot = 0, normA = 0, normB = 0;
      for (let i = 0; i < a.length; i++) {
        dot += a[i] * b[i];
        normA += a[i] * a[i];
        normB += b[i] * b[i];
      }
      return dot / (Math.sqrt(normA) * Math.sqrt(normB) || 1);
    }

    // Retrieve relevant documents
    function retrieveRelevantDocs(query, k = 3) {
      const queryEmbedding = getEmbedding(query);
      const scored = knowledgeBase.map(doc => ({
        ...doc,
        score: cosineSimilarity(queryEmbedding, getEmbedding(doc.content))
      }));
      return scored.sort((a, b) => b.score - a.score).slice(0, k);
    }

    messageInput.addEventListener('input', () => {
      messageInput.style.height = 'auto';
      messageInput.style.height = Math.min(messageInput.scrollHeight, 100) + 'px';
    });

    form.onsubmit = async (e) => {
      e.preventDefault();

      const userMessage = messageInput.value.trim();
      if (!userMessage || isLoading) return;

      messageInput.value = '';
      messageInput.style.height = 'auto';

      isLoading = true;
      sendBtn.disabled = true;
      statusDiv.textContent = '';

      addMessage(userMessage, 'user');

      try {
        const typingId = showTypingIndicator();

        // Retrieve relevant documents
        const relevantDocs = retrieveRelevantDocs(userMessage, 3);
        const context = relevantDocs
          .map(doc => `[${doc.title}] ${doc.content}`)
          .join('\n\n');

        // System prompt with context
        const systemPrompt = `You are a helpful AI assistant with access to knowledge about Freebuff2API.
Use the following context to answer user questions accurately:

${context}

If the user's question is not covered in the knowledge base, say "I don't have information about that in my knowledge base."`;

        const response = await fetch(FREEBUFF_API, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            model: 'gpt-4',
            messages: [
              { role: 'system', content: systemPrompt },
              { role: 'user', content: userMessage }
            ],
            temperature: 0.7,
            max_tokens: 1000,
          }),
        });

        removeTypingIndicator(typingId);

        if (!response.ok) {
          const errorData = await response.json().catch(() => ({}));
          throw new Error(
            errorData.error?.message ||
              `API Error: ${response.status} ${response.statusText}`
          );
        }

        const data = await response.json();
        const assistantMessage = data.choices?.[0]?.message?.content || 'No response received';

        const messageDiv = document.createElement('div');
        messageDiv.className = 'message assistant';

        const contentDiv = document.createElement('div');
        contentDiv.className = 'message-content';
        contentDiv.innerHTML = assistantMessage.replace(/\n/g, '<br>');

        // Add sources
        if (relevantDocs.length > 0) {
          const sourcesDiv = document.createElement('div');
          sourcesDiv.className = 'sources';
          sourcesDiv.textContent = `📚 Sources: ${relevantDocs.map(d => d.title).join(', ')}`;
          contentDiv.appendChild(document.createElement('br'));
          contentDiv.appendChild(sourcesDiv);
        }

        messageDiv.appendChild(contentDiv);
        messagesDiv.appendChild(messageDiv);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;

        statusDiv.textContent = `Retrieved ${relevantDocs.length} relevant documents`;
        statusDiv.className = 'status success';
      } catch (error) {
        console.error('Error:', error);
        addMessage(`Error: ${error.message}`, 'error');
        statusDiv.textContent = `Error: ${error.message}`;
        statusDiv.className = 'status error';
      } finally {
        isLoading = false;
        sendBtn.disabled = false;
        messageInput.focus();
      }
    };

    function addMessage(content, role) {
      const messageDiv = document.createElement('div');
      messageDiv.className = `message ${role}`;

      const contentDiv = document.createElement('div');
      contentDiv.className = 'message-content';
      contentDiv.textContent = content;

      messageDiv.appendChild(contentDiv);
      messagesDiv.appendChild(messageDiv);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function showTypingIndicator() {
      const id = Date.now();
      const messageDiv = document.createElement('div');
      messageDiv.className = 'message assistant';
      messageDiv.id = `typing-${id}`;

      const typingDiv = document.createElement('div');
      typingDiv.className = 'typing-indicator';

      for (let i = 0; i < 3; i++) {
        const dot = document.createElement('div');
        dot.className = 'typing-dot';
        typingDiv.appendChild(dot);
      }

      messageDiv.appendChild(typingDiv);
      messagesDiv.appendChild(messageDiv);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;

      return id;
    }

    function removeTypingIndicator(id) {
      const element = document.getElementById(`typing-${id}`);
      if (element) element.remove();
    }

    messageInput.focus();
  </script>
</body>
</html>
