version: '3.8'

services:
  freebuff2api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      AUTH_TOKENS: "${AUTH_TOKENS:-token1,token2}"
      LISTEN_ADDR: ":8080"
      UPSTREAM_BASE_URL: "https://codebuff.com"
      ROTATION_INTERVAL: "6h"
      REQUEST_TIMEOUT: "15m"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    restart: unless-stopped
