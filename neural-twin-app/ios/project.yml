# XcodeGen spec — generate the Xcode project with:  xcodegen generate
# (Codemagic / CI runs this before building, so the .xcodeproj is not committed.)
name: NeuralTwin
options:
  bundleIdPrefix: com.neuraltwin
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Set via Xcode automatic signing or Codemagic env (CM_CERTIFICATE etc.)
    DEVELOPMENT_TEAM: ""
targets:
  NeuralTwin:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: NeuralTwin
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.neuraltwin.app
        PRODUCT_NAME: NeuralTwin
        INFOPLIST_FILE: NeuralTwin/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
        CODE_SIGN_STYLE: Automatic
