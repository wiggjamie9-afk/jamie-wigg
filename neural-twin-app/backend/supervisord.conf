[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

# PostgreSQL Service
[program:postgres]
command=/usr/local/bin/docker-entrypoint.sh postgres -c listen_addresses='*'
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/postgres.err.log
stdout_logfile=/var/log/supervisor/postgres.out.log
priority=1

# Wait for PostgreSQL to be ready
[program:migrations]
command=bash -c 'sleep 10 && npx prisma migrate deploy'
autostart=true
autorestart=false
stderr_logfile=/var/log/supervisor/migrations.err.log
stdout_logfile=/var/log/supervisor/migrations.out.log
priority=2
startsecs=0

# Node.js Backend
[program:backend]
command=node dist/index.js
directory=/app
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/backend.err.log
stdout_logfile=/var/log/supervisor/backend.out.log
priority=3
startsecs=0

[group:neural-twin]
programs=postgres,migrations,backend
