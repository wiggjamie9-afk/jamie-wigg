<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RHYTHMIX · LinkedIn personal banner (1584×396)</title>
<meta name="viewport" content="width=1584">
<link rel="stylesheet" href="_banner-base.css">
<style>
  /* Lock to exact platform dimensions */
  html, body { width: 1584px; height: 396px; }
  .stage { padding: 50px 80px; }

  .orb-red    { width: 360px; height: 360px; top: -80px;  left: -80px; }
  .orb-purple { width: 460px; height: 460px; bottom: -180px; right: -100px; }

  /* LinkedIn "safe zone" — profile photo lives bottom-left, ~210px wide.
     Mobile crops the right ~25%. Keep CTA + headline center-left. */
  .content { position: relative; z-index: 2; max-width: 1100px; margin-left: 260px; }

  .row-top { display: flex; align-items: center; gap: 16px; margin-bottom: 14px; }
  .badge { font-size: 11px; padding: 6px 14px; }
  .pill {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--color-premium);
    background: rgba(245, 192, 0, .1);
    border: 1px solid rgba(245, 192, 0, .25);
    padding: 6px 12px;
    border-radius: var(--radius-pill);
  }

  h1 {
    font-family: var(--font-heading);
    font-size: 56px;
    font-weight: 800;
    line-height: 1;
    letter-spacing: -1.5px;
    margin: 0 0 14px;
  }
  .sub {
    font-size: 17px;
    color: var(--color-text-soft);
    margin: 0;
    max-width: 820px;
  }

  .right-rail {
    position: absolute;
    right: 80px;
    top: 50%;
    transform: translateY(-50%);
    z-index: 2;
    text-align: right;
  }
  .logo { font-size: 22px; margin-bottom: 12px; }
  .stat {
    font-family: var(--font-heading);
    font-size: 44px;
    font-weight: 800;
    line-height: 1;
    background: var(--gradient-text);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .stat-label {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--color-text-muted);
    text-transform: uppercase;
    margin-top: 4px;
  }
</style>
</head>
<body>
<div class="stage">
  <div class="grid"></div>
  <div class="orb orb-red"></div>
  <div class="orb orb-purple"></div>

  <div class="content">
    <div class="row-top">
      <div class="badge"><span class="badge-dot"></span> WORLD'S FIRST</div>
      <div class="pill">14 AI FEATURES · ONE PLATFORM</div>
    </div>
    <h1>Building the music industry <span class="gradient-text">artists deserve.</span></h1>
    <p class="sub">RHYTHMIX is an end-to-end AI music platform — generate, master, distribute and monetise. Used by <strong style="color:var(--color-text)">4,800+ creators</strong>.</p>
  </div>

  <div class="right-rail">
    <div class="logo"><span class="logo-mark">R</span> RHYTHMIX</div>
    <div class="stat">$2.4K</div>
    <div class="stat-label">avg sync payout</div>
  </div>
</div>
</body>
</html>
