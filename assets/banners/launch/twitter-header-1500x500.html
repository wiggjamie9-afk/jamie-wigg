<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RHYTHMIX · Twitter/X header (1500×500)</title>
<meta name="viewport" content="width=1500">
<link rel="stylesheet" href="_banner-base.css">
<style>
  /* Lock to exact platform dimensions */
  html, body { width: 1500px; height: 500px; }
  .stage { padding: 60px 80px; }

  .orb-red    { width: 480px; height: 480px; top: -120px; left: -100px; }
  .orb-purple { width: 520px; height: 520px; bottom: -200px; right: -120px; }

  /* Twitter "safe zone" — profile pic punches the bottom-left ~200x200.
     Keep critical content out of bottom-left 280px. */
  .content { position: relative; z-index: 2; max-width: 920px; margin-left: 320px; }

  .badge { font-size: 12px; padding: 8px 16px; margin-bottom: 18px; }
  h1 {
    font-family: var(--font-heading);
    font-size: 76px;
    font-weight: 800;
    line-height: .95;
    letter-spacing: -2px;
    margin: 0 0 18px;
  }
  .sub {
    font-size: 18px;
    color: var(--color-text-soft);
    max-width: 700px;
    margin: 0 0 26px;
    line-height: 1.4;
  }
  .row { display: flex; align-items: center; gap: 20px; }
  .cta { font-size: 15px; padding: 13px 24px; }
  .proof { font-size: 12px; }

  .logo {
    position: absolute;
    top: 40px;
    right: 60px;
    z-index: 2;
    font-size: 22px;
  }
</style>
</head>
<body>
<div class="stage">
  <div class="grid"></div>
  <div class="orb orb-red"></div>
  <div class="orb orb-purple"></div>

  <div class="logo"><span class="logo-mark">R</span> RHYTHMIX</div>

  <div class="content">
    <div class="badge"><span class="badge-dot"></span> NOW LIVE · 14 AI FEATURES · WORLD'S FIRST</div>
    <h1>Generate. Master.<br><span class="gradient-text">Get paid.</span></h1>
    <p class="sub">The world's most complete AI music platform — all in one place.</p>
    <div class="row">
      <a class="cta" href="#">Start free →</a>
      <span class="proof"><strong>4,800+</strong> creators <span class="dot">·</span> <strong>$2.4K</strong> avg sync payout</span>
    </div>
  </div>
</div>
</body>
</html>
