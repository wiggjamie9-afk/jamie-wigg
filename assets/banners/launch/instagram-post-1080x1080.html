<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RHYTHMIX · Instagram post (1080×1080)</title>
<meta name="viewport" content="width=1080">
<link rel="stylesheet" href="_banner-base.css">
<style>
  /* Lock to exact platform dimensions */
  html, body { width: 1080px; height: 1080px; }
  .stage { flex-direction: column; padding: 80px 70px; align-items: stretch; justify-content: space-between; }

  .orb-red    { width: 600px; height: 600px; top: -200px; right: -200px; }
  .orb-purple { width: 700px; height: 700px; bottom: -300px; left: -200px; }

  .top { position: relative; z-index: 2; display: flex; justify-content: space-between; align-items: center; }
  .logo { font-size: 22px; }
  .badge { font-size: 12px; padding: 7px 14px; }

  .body { position: relative; z-index: 2; }
  .eyebrow {
    font-family: var(--font-mono);
    font-size: 13px;
    letter-spacing: 4px;
    color: var(--color-primary);
    text-transform: uppercase;
    margin-bottom: 22px;
  }
  h1 {
    font-family: var(--font-heading);
    font-size: 110px;
    font-weight: 800;
    line-height: .9;
    letter-spacing: -3px;
    margin: 0 0 28px;
  }
  .sub {
    font-size: 22px;
    color: var(--color-text-soft);
    line-height: 1.4;
    max-width: 820px;
    margin: 0;
  }
  .sub strong { color: var(--color-text); font-weight: 600; }

  .footer { position: relative; z-index: 2; display: flex; justify-content: space-between; align-items: flex-end; }
  .cta { font-size: 18px; padding: 18px 32px; }
  .proof-stack { text-align: right; }
  .stat {
    font-family: var(--font-heading);
    font-size: 56px;
    font-weight: 800;
    line-height: 1;
    background: var(--gradient-text);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .stat-label {
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: 2px;
    color: var(--color-text-muted);
    margin-top: 6px;
    text-transform: uppercase;
  }
</style>
</head>
<body>
<div class="stage">
  <div class="grid"></div>
  <div class="orb orb-red"></div>
  <div class="orb orb-purple"></div>

  <div class="top">
    <div class="logo"><span class="logo-mark">R</span> RHYTHMIX</div>
    <div class="badge"><span class="badge-dot"></span> NOW LIVE</div>
  </div>

  <div class="body">
    <div class="eyebrow">14 AI features · one platform</div>
    <h1>Generate.<br>Master.<br><span class="gradient-text">Get paid.</span></h1>
    <p class="sub">The world's most complete AI music platform. <strong>Generate, master, distribute and monetise</strong> — without leaving the app.</p>
  </div>

  <div class="footer">
    <a class="cta" href="#">Start free →</a>
    <div class="proof-stack">
      <div class="stat">4,800+</div>
      <div class="stat-label">creators shipping</div>
    </div>
  </div>
</div>
</body>
</html>
