<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>RHYTHMIX — Debut Poster</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    background: #08050d;
    color: #ffffff;
    font-family: "Space Grotesk", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .poster {
    position: relative;
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    /* Dawn palette — debut/first-light energy */
    background:
      radial-gradient(ellipse 900px 700px at 20% 16%, rgba(255, 122, 166, 0.42), transparent 60%),
      radial-gradient(ellipse 900px 800px at 82% 84%, rgba(138, 246, 255, 0.30), transparent 62%),
      radial-gradient(ellipse 700px 600px at 70% 38%, rgba(255, 224, 112, 0.18), transparent 65%),
      #08050d;
  }

  /* Grid texture, masked vignette */
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
    background-size: 72px 72px;
    mask-image: radial-gradient(ellipse 820px 1500px at 50% 50%, #000 35%, transparent 92%);
    -webkit-mask-image: radial-gradient(ellipse 820px 1500px at 50% 50%, #000 35%, transparent 92%);
  }

  /* Diagonal scanlines for grit */
  .scan {
    position: absolute; inset: 0;
    background: repeating-linear-gradient(
      135deg,
      rgba(255, 255, 255, 0.022) 0px,
      rgba(255, 255, 255, 0.022) 1px,
      transparent 1px,
      transparent 6px
    );
    pointer-events: none;
  }

  /* Noise speckle */
  .noise {
    position: absolute; inset: 0;
    opacity: 0.32;
    mix-blend-mode: overlay;
    background-image: radial-gradient(rgba(255,255,255,0.08) 1px, transparent 1px);
    background-size: 3px 3px;
    pointer-events: none;
  }

  /* ---- TOP EYEBROW ---- */
  .eyebrow {
    position: absolute;
    top: 90px; left: 80px; right: 80px;
    display: flex; justify-content: space-between; align-items: center;
    font-family: "JetBrains Mono", monospace;
    font-size: 26px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #cfcfd8;
  }
  .eyebrow .left { color: #ffd9e8; }
  .eyebrow .dot {
    display: inline-block;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: #ff7aa6;
    box-shadow: 0 0 22px #ff7aa6;
    vertical-align: middle;
    margin-right: 14px;
    transform: translateY(-2px);
  }
  .eyebrow .right { color: #8af6ff; }

  /* ---- WORDMARK ---- */
  .wordmark {
    position: absolute;
    top: 188px; left: 0; right: 0;
    text-align: center;
    font-family: "Space Grotesk", system-ui, sans-serif;
    font-weight: 700;
    font-size: 132px;
    letter-spacing: 0.06em;
    line-height: 1;
    background: linear-gradient(135deg, #ff7aa6, #e0c0ff 50%, #8af6ff);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
    text-shadow: 0 0 80px rgba(224, 192, 255, 0.25);
  }
  .wordmark::after {
    content: "";
    display: block;
    width: 240px; height: 4px;
    margin: 28px auto 0;
    background: linear-gradient(90deg, transparent, #ff7aa6, #ffe070, #8af6ff, transparent);
    box-shadow: 0 0 18px rgba(255, 122, 166, 0.6);
  }

  /* ---- THRESHOLD STRIP ---- listener → artist ---- */
  .threshold {
    position: absolute;
    top: 480px; left: 60px; right: 60px;
    display: flex; align-items: center; justify-content: center;
    gap: 36px;
    font-family: "JetBrains Mono", monospace;
    font-size: 36px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
  }
  .threshold .before {
    color: rgba(230, 230, 238, 0.55);
    text-decoration: line-through;
    text-decoration-color: rgba(255, 31, 90, 0.75);
    text-decoration-thickness: 3px;
  }
  .threshold .arrow {
    font-size: 44px;
    color: #8af6ff;
    text-shadow: 0 0 18px rgba(138, 246, 255, 0.7);
    transform: translateY(-2px);
  }
  .threshold .after {
    color: #ffd9e8;
    font-weight: 700;
    text-shadow: 0 0 22px rgba(255, 122, 166, 0.55);
  }

  /* sweep line under the threshold */
  .sweep {
    position: absolute;
    top: 555px;
    left: 140px; right: 140px;
    height: 3px;
    background: linear-gradient(90deg, transparent, #ff7aa6 25%, #e0c0ff 50%, #8af6ff 75%, transparent);
    opacity: 0.7;
    box-shadow: 0 0 22px rgba(255, 122, 166, 0.4);
  }

  /* ---- HEADLINE ---- "Your debut starts here." ---- */
  .hook {
    position: absolute;
    top: 640px;
    left: 60px;
    right: 60px;
    text-align: left;
    font-family: "Space Grotesk", system-ui, sans-serif;
    font-weight: 800;
    line-height: 0.9;
    letter-spacing: -0.03em;
  }
  .hook .l1 {
    display: block;
    font-size: 188px;
    color: #ffffff;
    margin-bottom: 10px;
  }
  .hook .l2 {
    display: block;
    font-size: 188px;
    background: linear-gradient(135deg, #ff1f5a, #ff7aa6 50%, #ffe070);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
    text-shadow: 0 0 80px rgba(255, 122, 166, 0.25);
  }
  .hook .l2 .here {
    position: relative;
    display: inline-block;
  }
  .hook .l2 .here::after {
    content: "";
    position: absolute;
    left: -8px; right: -8px;
    bottom: 14px;
    height: 12px;
    background: linear-gradient(90deg, #ff1f5a, #ffe070);
    transform: skewY(-1.5deg);
    box-shadow: 0 0 22px rgba(255, 224, 112, 0.55);
    z-index: -1;
    opacity: 0.85;
    border-radius: 2px;
  }

  /* ---- FLOATING CHIPS ---- */
  .chip {
    position: absolute;
    font-family: "JetBrains Mono", monospace;
    font-size: 20px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    padding: 12px 20px;
    border-radius: 999px;
    background: rgba(255, 122, 166, 0.16);
    color: #ffd9e8;
    border: 1px solid rgba(255, 122, 166, 0.5);
  }
  .chip.c1 {
    top: 1080px; right: 70px; transform: rotate(5deg);
  }
  .chip.c2 {
    top: 1115px; left: 60px; transform: rotate(-4deg);
    background: rgba(138, 246, 255, 0.14);
    color: #c8f7ff;
    border-color: rgba(138, 246, 255, 0.5);
  }

  /* ---- PIVOT BLOCK ---- "The first release." ---- */
  .pivot {
    position: absolute;
    top: 1210px;
    left: 60px; right: 60px;
    font-family: "Space Grotesk", system-ui, sans-serif;
    font-weight: 800;
    font-size: 138px;
    line-height: 0.92;
    letter-spacing: -0.025em;
    background: linear-gradient(135deg, #8af6ff, #e0c0ff 55%, #ff7aa6);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
    text-shadow: 0 0 80px rgba(138, 246, 255, 0.18);
  }
  .pivot .small {
    display: block;
    font-family: "JetBrains Mono", monospace;
    font-size: 28px;
    letter-spacing: 0.3em;
    color: #c8f7ff;
    -webkit-text-fill-color: #c8f7ff;
    margin-bottom: 24px;
    font-weight: 500;
    text-transform: uppercase;
  }

  /* ---- PRICE BAND ---- */
  .subhead {
    position: absolute;
    bottom: 280px;
    left: 60px; right: 60px;
    padding: 38px 44px;
    background: linear-gradient(135deg, rgba(40, 30, 60, 0.88), rgba(28, 22, 42, 0.6));
    border: 1px solid rgba(255, 122, 166, 0.4);
    border-radius: 22px;
    backdrop-filter: blur(8px);
  }
  .subhead .label {
    font-family: "JetBrains Mono", monospace;
    font-size: 22px;
    letter-spacing: 0.3em;
    color: #ffd9e8;
    text-transform: uppercase;
    margin-bottom: 14px;
  }
  .subhead .price {
    font-family: "Space Grotesk", system-ui, sans-serif;
    font-weight: 800;
    font-size: 76px;
    line-height: 1;
    letter-spacing: -0.01em;
    color: #ffffff;
    display: flex;
    align-items: baseline;
    gap: 22px;
    flex-wrap: wrap;
  }
  .subhead .price .amount {
    background: linear-gradient(135deg, #ff1f5a, #ff7aa6 50%, #ffe070);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
  }
  .subhead .price .sep {
    width: 8px; height: 8px;
    background: #ffe070;
    box-shadow: 0 0 16px #ffe070;
    border-radius: 50%;
    transform: translateY(-12px);
  }
  .subhead .price .lifetime {
    font-size: 60px;
    color: #ffffff;
  }

  /* ---- CTA STRIP ---- */
  .cta {
    position: absolute;
    bottom: 110px;
    left: 60px; right: 60px;
    display: flex; align-items: center; justify-content: space-between;
    font-family: "JetBrains Mono", monospace;
    text-transform: uppercase;
  }
  .cta .url {
    font-size: 34px;
    letter-spacing: 0.18em;
    color: #ffffff;
    font-weight: 700;
  }
  .cta .url .dot { color: #ff7aa6; }
  .cta .badge {
    font-size: 22px;
    letter-spacing: 0.3em;
    color: #08050d;
    background: #ffe070;
    box-shadow: 0 0 22px rgba(255, 224, 112, 0.65);
    padding: 14px 22px;
    border-radius: 999px;
    font-weight: 700;
  }

  /* ---- BOTTOM EDGE GLOW ---- */
  .edge {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 6px;
    background: linear-gradient(90deg, #ff1f5a, #ff7aa6 25%, #ffe070 55%, #8af6ff);
    box-shadow: 0 0 30px rgba(255, 122, 166, 0.55);
  }
</style>
</head>
<body>
  <div class="poster">
    <div class="grid"></div>
    <div class="scan"></div>

    <div class="eyebrow">
      <span class="left"><span class="dot"></span>DEBUT // 60s</span>
      <span class="right">FIRST RELEASE EDITION</span>
    </div>

    <div class="wordmark">RHYTHMIX</div>

    <div class="threshold">
      <span class="before">Listener</span>
      <span class="arrow">&rarr;</span>
      <span class="after">Artist</span>
    </div>
    <div class="sweep"></div>

    <div class="hook">
      <span class="l1">Your debut</span>
      <span class="l2">starts <span class="here">here.</span></span>
    </div>

    <div class="chip c1">First track</div>
    <div class="chip c2">First release</div>

    <div class="pivot">
      <span class="small">THE STUDIO BEHIND&mdash;</span>
      your first release.
    </div>

    <div class="subhead">
      <div class="label">ONE PRICE &middot; ONCE &middot; FOREVER</div>
      <div class="price">
        <span class="amount">AU$149</span>
        <span class="sep"></span>
        <span class="lifetime">Lifetime.</span>
      </div>
    </div>

    <div class="cta">
      <div class="url">RHYTHMIXAPP<span class="dot">.</span>COM<span class="dot">.</span>AU</div>
      <div class="badge">No Subscription</div>
    </div>

    <div class="noise"></div>
    <div class="edge"></div>
  </div>
</body>
</html>
