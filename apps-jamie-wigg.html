<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>App Portal JW</title>
<meta name="description" content="Every app in the Jamie Wigg ecosystem, in one place." />
<style>
  :root{
    --canvas:#08050d; --magenta:#ff1f5a; --purple:#7c3aed; --cyan:#00d8ff;
    --green:#00e887; --gold:#f5c000; --pink:#ff6fc8; --white:#ffffff;
    --muted:#a0a0b0; --card:#1a1325; --card-2:#221a30;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    background:var(--canvas); color:var(--white);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1240px;margin:0 auto;padding:0 20px}

  /* Header */
  header{
    position:relative; padding:64px 0 40px; text-align:center; overflow:hidden;
    background:
      radial-gradient(60% 120% at 50% -10%, rgba(124,58,237,.35), transparent 60%),
      radial-gradient(40% 80% at 80% 0%, rgba(255,31,90,.25), transparent 60%);
  }
  .eyebrow{
    display:inline-block; letter-spacing:.35em; text-transform:uppercase;
    font-size:12px; color:var(--cyan); margin-bottom:18px; font-weight:700;
  }
  h1{
    font-size:clamp(40px,8vw,84px); line-height:.95; font-weight:900; letter-spacing:-.02em;
    background:linear-gradient(120deg,var(--white) 20%,var(--pink) 55%,var(--cyan) 90%);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
  }
  .sub{color:var(--muted); max-width:600px; margin:18px auto 0; font-size:17px}
  .stats{display:flex;gap:28px;justify-content:center;flex-wrap:wrap;margin-top:30px}
  .stat b{display:block;font-size:30px;font-weight:900;color:var(--gold)}
  .stat span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}

  /* Controls */
  .controls{position:sticky;top:0;z-index:20;background:rgba(8,5,13,.85);backdrop-filter:blur(14px);
    border-bottom:1px solid rgba(255,255,255,.07);padding:14px 0}
  .controls .wrap{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  #search{
    flex:1;min-width:200px;background:var(--card);border:1px solid rgba(255,255,255,.12);
    color:var(--white);padding:12px 16px;border-radius:12px;font-size:15px;outline:none;
  }
  #search:focus{border-color:var(--magenta)}
  .filters{display:flex;gap:8px;flex-wrap:wrap}
  .chip{
    background:var(--card);border:1px solid rgba(255,255,255,.12);color:var(--muted);
    padding:8px 14px;border-radius:999px;font-size:13px;cursor:pointer;font-weight:600;
    transition:.15s; white-space:nowrap;
  }
  .chip:hover{color:var(--white);border-color:var(--purple)}
  .chip.active{background:linear-gradient(120deg,var(--magenta),var(--purple));color:#fff;border-color:transparent}

  /* Sections */
  main{padding:40px 0 80px}
  .section{margin-bottom:46px;scroll-margin-top:90px}
  .section h2{font-size:24px;font-weight:800;margin-bottom:4px;display:flex;align-items:center;gap:10px}
  .section h2 .dot{width:10px;height:10px;border-radius:50%}
  .section .desc{color:var(--muted);font-size:14px;margin-bottom:20px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(225px,1fr));gap:14px}

  .card{
    display:block;background:var(--card);border:1px solid rgba(255,255,255,.08);
    border-radius:16px;padding:18px;transition:.18s;position:relative;overflow:hidden;
  }
  .card::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--accent,var(--purple));opacity:.7}
  .card:hover{transform:translateY(-4px);border-color:var(--accent,var(--purple));background:var(--card-2)}
  .card .name{font-weight:800;font-size:17px;margin-bottom:6px}
  .card .blurb{color:var(--muted);font-size:13px;min-height:34px}
  .card .tag{display:inline-block;margin-top:12px;font-size:11px;color:var(--accent,var(--cyan));
    text-transform:uppercase;letter-spacing:.08em;font-weight:700}
  .card .badge{position:absolute;top:14px;right:14px;font-size:10px;background:rgba(255,255,255,.1);
    padding:3px 8px;border-radius:999px;color:var(--muted);font-weight:700}

  /* Buddy sub-grid */
  details.buddies{margin-top:16px;background:var(--card);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:18px}
  details.buddies summary{cursor:pointer;font-weight:800;font-size:16px;list-style:none}
  details.buddies summary::-webkit-details-marker{display:none}
  details.buddies summary::after{content:" ▾";color:var(--muted)}
  details.buddies[open] summary::after{content:" ▴"}
  .buddy-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px;margin-top:16px}
  .buddy-grid a{background:var(--card-2);border:1px solid rgba(255,255,255,.08);border-radius:10px;
    padding:12px 6px;text-align:center;font-size:12px;font-weight:700;color:var(--muted);transition:.15s}
  .buddy-grid a:hover{color:#fff;border-color:var(--pink);background:rgba(255,111,200,.12)}

  .empty{text-align:center;color:var(--muted);padding:60px 0;display:none}
  footer{border-top:1px solid rgba(255,255,255,.07);padding:30px 0;text-align:center;color:var(--muted);font-size:13px}
  footer a{color:var(--cyan)}
  .hidden{display:none !important}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <span class="eyebrow">Jamie Wigg · Apps Ecosystem</span>
    <h1>App Portal&nbsp;JW</h1>
    <p class="sub">Every app I've built — wellness, finance, education, AI tools, music, and more — in one portal.</p>
    <div class="stats">
      <div class="stat"><b id="stat-apps">0</b><span>Apps</span></div>
      <div class="stat"><b>11</b><span>Categories</span></div>
      <div class="stat"><b>50</b><span>Buddies</span></div>
      <div class="stat"><b>6</b><span>Flagships</span></div>
    </div>
  </div>
</header>

<div class="controls">
  <div class="wrap">
    <input id="search" type="search" placeholder="Search all apps…" autocomplete="off" />
    <div class="filters" id="filters"></div>
  </div>
</div>

<main class="wrap">
  <div id="sections"></div>
  <div class="empty" id="empty">No apps match your search.</div>
</main>

<footer>
  <div class="wrap">
    Apps Jamie Wigg · the one portal. Full inventory in <a href="./APPS-JAMIE-WIGG.md">APPS-JAMIE-WIGG.md</a>.
  </div>
</footer>

  // Fitness
  {c:"fitness",n:"FitCoach Pro",b:"AI fitness coaching",u:"apps/fitcoach/index.html",t:"PWA"},
  {c:"fitness",n:"Workout Timer",b:"Interval / circuit timer",u:"apps/workout-timer.html"},

  {c:"productivity",n:"TaskList",b:"Get things done",u:"apps/tasklist.html"},

  // Finance
  {c:"finance",n:"Budget Tracker",b:"Save smarter",u:"apps/budget-tracker.html"},
  {c:"finance",n:"Expense Tracker",b:"Budget control",u:"apps/expense-tracker.html"},

  {c:"untapped",n:"SPOT",b:"Pet teledermatology triage",u:"apps/untapped/spot.html"},
  {c:"untapped",n:"STACK",b:"Indoor air, identified",u:"apps/untapped/stack.html"},

  // Flagships
  {c:"flagship",n:"HerdCheck",b:"Phone-camera livestock screening",u:"livestock/index.html",t:"PWA"},
  {c:"flagship",n:"Reset",b:"Recovery tracking for team sport",u:"recovery/index.html",t:"PWA"},
  {c:"flagship",n:"STARLIGHTMIX Studio",b:"AI music video generation",u:"studio.html",t:"Next.js"},
  {c:"flagship",n:"Agent Builder",b:"Build & deploy AI agents",u:"agent-builder/",t:"Next.js"},
  {c:"flagship",n:"Sunny Kids Channel",b:"Animated bedtime stories",u:"kids-channel/",t:"Pipeline"},
  {c:"flagship",n:"Codex of Reality",b:"Biofeedback for mystics",u:"codex.html",t:"PWA"},
];

const colorFor = id => (CATS.find(c=>c.id===id)||{}).color || "#7c3aed";

// Render filter chips
const filters = document.getElementById("filters");
let activeCat = "all";
const allChip = document.createElement("button");
allChip.className="chip active"; allChip.textContent="All"; allChip.dataset.cat="all";
filters.appendChild(allChip);
CATS.forEach(cat=>{
  const b=document.createElement("button");
  b.className="chip"; b.textContent=cat.name.split(" ")[0].replace("&",""); b.title=cat.name; b.dataset.cat=cat.id;
  filters.appendChild(b);
});

// Render sections
const sections = document.getElementById("sections");
CATS.forEach(cat=>{
  const sec=document.createElement("section");
  sec.className="section"; sec.dataset.cat=cat.id; sec.id="sec-"+cat.id;
  sec.innerHTML = `<h2><span class="dot" style="background:${cat.color}"></span>${cat.name}</h2>
    <p class="desc">${cat.desc}</p><div class="grid"></div>`;
  const grid=sec.querySelector(".grid");
  APPS.filter(a=>a.c===cat.id).forEach(a=>{
    const card=document.createElement("a");
    card.className="card"; card.href=a.u; card.style.setProperty("--accent",cat.color);
    card.dataset.name=a.n.toLowerCase(); card.dataset.blurb=(a.b||"").toLowerCase();
    card.innerHTML = `${a.t?`<span class="badge">${a.t}</span>`:""}
      <div class="name">${a.n}</div><div class="blurb">${a.b||""}</div>
      <span class="tag">Open →</span>`;
    grid.appendChild(card);
  });
  // Buddy system gets the 50-companion expander
  if(cat.id==="buddy"){
    const hub=document.createElement("a");
    hub.className="card"; hub.href="apps/buddy-system.html"; hub.style.setProperty("--accent",cat.color);
    hub.dataset.name="buddy system"; hub.dataset.blurb="50 ai companions hub";
    hub.innerHTML=`<span class="badge">Hub</span><div class="name">Buddy System</div>
      <div class="blurb">One launcher for all 50 AI companions.</div><span class="tag">Open hub →</span>`;
    grid.appendChild(hub);
    const dir=document.createElement("a");
    dir.className="card"; dir.href="apps/buddies.html"; dir.style.setProperty("--accent",cat.color);
    dir.dataset.name="buddies directory"; dir.dataset.blurb="browse all buddies";
    dir.innerHTML=`<div class="name">Buddies Directory</div><div class="blurb">Browse every companion.</div><span class="tag">Open →</span>`;
    grid.appendChild(dir);
    const det=document.createElement("details");
    det.className="buddies";
    let links=""; for(let i=1;i<=50;i++){links+=`<a href="apps/buddy-${i}.html">Buddy ${i}</a>`;}
    det.innerHTML=`<summary>All 50 individual Buddy apps</summary><div class="buddy-grid">${links}</div>`;
    sec.appendChild(det);
  }
  sections.appendChild(sec);
});

document.getElementById("stat-apps").textContent = APPS.length;

// Search + filter logic
const search=document.getElementById("search");
const empty=document.getElementById("empty");
function apply(){
  const q=search.value.trim().toLowerCase();
  let anyVisible=false;
  document.querySelectorAll(".section").forEach(sec=>{
    const catOk = activeCat==="all" || sec.dataset.cat===activeCat;
    let secVisible=false;
    sec.querySelectorAll(".card").forEach(card=>{
      const match=!q || card.dataset.name.includes(q) || card.dataset.blurb.includes(q);
      const show=catOk && match;
      card.classList.toggle("hidden",!show);
      if(show){secVisible=true;anyVisible=true;}
    });
    const det=sec.querySelector("details.buddies");
    if(det) det.classList.toggle("hidden", !(catOk && (!q || "buddy".includes(q))));
    sec.classList.toggle("hidden", !secVisible && !(det && !det.classList.contains("hidden")));
  });
  empty.style.display=anyVisible?"none":"block";
}
search.addEventListener("input",apply);
filters.addEventListener("click",e=>{
  const chip=e.target.closest(".chip"); if(!chip)return;
  activeCat=chip.dataset.cat;
  document.querySelectorAll(".chip").forEach(c=>c.classList.toggle("active",c===chip));
  apply();
});
</script>
</body>
</html>
