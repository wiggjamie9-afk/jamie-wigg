workflows:
  resonance-ios:
    name: Resonance iOS (Capacitor) — App Store
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 22
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install Capacitor dependencies
        script: |
          cd resonance-ios
          npm ci
      - name: Stage resonance.html into www and sync iOS project
        script: |
          cd resonance-ios
          rm -rf www
          mkdir -p www
          cp ../resonance.html www/index.html
          cp ../manifest.json www/
          cp ../sw.js www/
          cp ../icon-192.png www/
          cp ../icon-512.png www/
          npx cap sync ios
      - name: pod install
        script: |
          cd resonance-ios/ios/App
          pod install --repo-update
      - name: Build iOS app (unsigned debug)
        script: |
          cd resonance-ios/ios/App
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
    artifacts:
      - resonance-ios/ios/App/build/Build/Products/Debug-iphonesimulator/*.app
    publishing:
      email:
        recipients:
          - wiggjamie9@gmail.com
        notify:
          success: true
          failure: true

  ios-capacitor:
    name: Reset iOS (Capacitor) — unsigned debug
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 22
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install Capacitor dependencies
        script: |
          cd recovery-ios
          npm ci
      - name: Stage /recovery/ into www and sync iOS project
        script: |
          cd recovery-ios
          rm -rf www
          cp -r ../recovery www
          npx cap sync ios
      - name: pod install
        script: |
          cd recovery-ios/ios/App
          pod install --repo-update
      - name: Build iOS app (unsigned debug, just to prove it compiles)
        script: |
          cd recovery-ios/ios/App
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
    artifacts:
      - recovery-ios/ios/App/build/Build/Products/Debug-iphonesimulator/*.app
    publishing:
      email:
        recipients:
          - wiggjamie9@gmail.com
        notify:
          success: true
          failure: true
