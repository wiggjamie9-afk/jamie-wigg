<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="storybg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ec4899;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f43f5e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="storyskin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fdbcb4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f8a8a0;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <circle cx="100" cy="100" r="100" fill="url(#storybg)"/>

  <!-- Head -->
  <circle cx="100" cy="70" r="35" fill="url(#storyskin)"/>

  <!-- Hair -->
  <path d="M 65 45 Q 65 30 100 28 Q 135 30 135 45 L 135 70 Q 100 75 65 70 Z" fill="#d4424a"/>

  <!-- Eyes - energetic and bright -->
  <circle cx="88" cy="65" r="4" fill="#1f2937"/>
  <circle cx="112" cy="65" r="4" fill="#1f2937"/>
  <circle cx="89" cy="64" r="1.5" fill="#ffffff"/>
  <circle cx="113" cy="64" r="1.5" fill="#ffffff"/>

  <!-- Eyebrows - expressive -->
  <path d="M 82 58 Q 88 56 94 57.5" stroke="#d4424a" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M 106 57.5 Q 112 56 118 58" stroke="#d4424a" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Nose -->
  <path d="M 100 65 L 100 75" stroke="#e8b4ab" stroke-width="1.5" fill="none"/>

  <!-- Mouth - warm smile -->
  <path d="M 88 80 Q 100 86 112 80" stroke="#d4424a" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Body/Torso -->
  <ellipse cx="100" cy="115" rx="25" ry="30" fill="#ec4899"/>

  <!-- Creative element - paint palette in hand -->
  <ellipse cx="75" cy="130" rx="8" ry="10" fill="#fbbf24"/>
  <circle cx="72" cy="128" r="2" fill="#ef4444"/>
  <circle cx="75" cy="126" r="2" fill="#3b82f6"/>
  <circle cx="78" cy="128" r="2" fill="#10b981"/>
  <circle cx="80" cy="131" r="2" fill="#8b5cf6"/>

  <!-- Highlight - energetic aura -->
  <circle cx="100" cy="100" r="45" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.3"/>
</svg>
