<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="grocerybg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="groceryskin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fde2d9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fad2c4;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <circle cx="100" cy="100" r="100" fill="url(#grocerybg)"/>

  <!-- Head -->
  <circle cx="100" cy="70" r="35" fill="url(#groceryskin)"/>

  <!-- Hair - friendly and neat -->
  <path d="M 65 48 Q 65 32 100 30 Q 135 32 135 48 L 135 72 Q 100 78 65 72 Z" fill="#6b4423"/>
  <circle cx="85" cy="45" r="3" fill="#8b6f47" opacity="0.6"/>
  <circle cx="115" cy="45" r="3" fill="#8b6f47" opacity="0.6"/>

  <!-- Eyes - bright and helpful -->
  <circle cx="88" cy="66" r="4" fill="#1f2937"/>
  <circle cx="112" cy="66" r="4" fill="#1f2937"/>
  <circle cx="89" cy="65" r="1.5" fill="#ffffff"/>
  <circle cx="113" cy="65" r="1.5" fill="#ffffff"/>
  <circle cx="87.5" cy="68" r="0.8" fill="#10b981" opacity="0.7"/>
  <circle cx="111.5" cy="68" r="0.8" fill="#10b981" opacity="0.7"/>

  <!-- Eyebrows - friendly and approachable -->
  <path d="M 82 59 Q 88 57 94 58.5" stroke="#6b4423" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <path d="M 106 58.5 Q 112 57 118 59" stroke="#6b4423" stroke-width="1.8" fill="none" stroke-linecap="round"/>

  <!-- Nose -->
  <path d="M 100 66 L 100 75" stroke="#f0d5c8" stroke-width="1.5" fill="none"/>

  <!-- Mouth - bright, warm smile -->
  <path d="M 87 81 Q 100 87 113 81" stroke="#6b4423" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M 89 81 Q 100 85 111 81" stroke="#10b981" stroke-width="1" fill="none" stroke-linecap="round" opacity="0.4"/>

  <!-- Body/Torso - practical helper -->
  <ellipse cx="100" cy="115" rx="25" ry="30" fill="#10b981"/>

  <!-- Shopping basket/practical element -->
  <path d="M 73 130 L 76 140 L 84 140 L 82 130 Z" fill="#f59e0b" opacity="0.8"/>
  <rect x="73" y="128" width="11" height="2" fill="#b45309" opacity="0.6"/>

  <!-- Fresh produce accent - vegetables -->
  <circle cx="78" cy="136" r="2.5" fill="#ef4444" opacity="0.7"/>
  <circle cx="82" cy="136" r="2.5" fill="#f97316" opacity="0.7"/>

  <!-- Helpful aura - bright and practical -->
  <circle cx="100" cy="100" r="46" fill="none" stroke="#6ee7b7" stroke-width="1.5" opacity="0.5"/>
  <circle cx="100" cy="100" r="50" fill="none" stroke="#6ee7b7" stroke-width="1" opacity="0.2"/>

  <!-- Practical highlight elements -->
  <circle cx="60" cy="75" r="2" fill="#d1fae5" opacity="0.5"/>
  <circle cx="140" cy="80" r="2.5" fill="#d1fae5" opacity="0.4"/>
  <circle cx="65" cy="125" r="1.5" fill="#d1fae5" opacity="0.3"/>
</svg>
