<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="voicebg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c084fc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a78bfa;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="voiceskin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fcd5ce;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f9c5bc;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <circle cx="100" cy="100" r="100" fill="url(#voicebg)"/>

  <!-- Head -->
  <circle cx="100" cy="70" r="35" fill="url(#voiceskin)"/>

  <!-- Hair - gentle, flowing -->
  <path d="M 65 50 Q 65 32 100 30 Q 135 32 135 50 L 135 72 Q 100 78 65 72 Z" fill="#7c3aed"/>
  <path d="M 70 45 Q 75 38 85 37" stroke="#7c3aed" stroke-width="1.5" fill="none" opacity="0.6"/>
  <path d="M 130 45 Q 125 38 115 37" stroke="#7c3aed" stroke-width="1.5" fill="none" opacity="0.6"/>

  <!-- Eyes - warm and compassionate -->
  <circle cx="88" cy="67" r="4.5" fill="#1f2937"/>
  <circle cx="112" cy="67" r="4.5" fill="#1f2937"/>
  <circle cx="89.5" cy="66" r="2" fill="#ffffff"/>
  <circle cx="113.5" cy="66" r="2" fill="#ffffff"/>

  <!-- Eyebrows - soft, caring -->
  <path d="M 82 60 Q 88 59 94 60" stroke="#7c3aed" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M 106 60 Q 112 59 118 60" stroke="#7c3aed" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- Nose -->
  <path d="M 100 67 L 100 76" stroke="#f0d9cc" stroke-width="1.5" fill="none"/>

  <!-- Mouth - gentle, reassuring smile -->
  <path d="M 87 82 Q 100 87 113 82" stroke="#7c3aed" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M 90 82 Q 100 85 110 82" stroke="#a78bfa" stroke-width="1" fill="none" stroke-linecap="round" opacity="0.5"/>

  <!-- Body/Torso -->
  <ellipse cx="100" cy="115" rx="26" ry="32" fill="#c084fc"/>

  <!-- Wellness element - heart symbol -->
  <path d="M 75 135 L 78 130 Q 80 128 82 130 L 85 135 Q 82.5 137 80 137 Q 77.5 137 75 135" fill="#f472b6" opacity="0.8"/>

  <!-- Healing aura - soft glow -->
  <circle cx="100" cy="100" r="48" fill="none" stroke="#fda4af" stroke-width="1.5" opacity="0.4"/>
  <circle cx="100" cy="100" r="52" fill="none" stroke="#fda4af" stroke-width="1" opacity="0.2"/>

  <!-- Gentle shimmer elements -->
  <circle cx="65" cy="85" r="3" fill="#f8d5e2" opacity="0.4"/>
  <circle cx="135" cy="90" r="2.5" fill="#f8d5e2" opacity="0.3"/>
</svg>
