<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Codex thumbnail · YouTube 1280×720</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600&family=JetBrains+Mono:wght@500;700&display=swap" />
<style>
  html, body { margin: 0; padding: 0; background: #000; }
  body { display: grid; place-items: center; min-height: 100vh; }
  .card {
    width: 1280px; height: 720px;
    background:
      radial-gradient(ellipse at 25% 60%, rgba(212,168,67,0.30), transparent 55%),
      radial-gradient(ellipse at 80% 40%, rgba(92,229,224,0.15), transparent 55%),
      #0a1628;
    color: #f4ecd6; position: relative; overflow: hidden;
    font-family: 'JetBrains Mono', monospace;
  }
  .card::before {
    content: ''; position: absolute; inset: 0;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.83  0 0 0 0 0.65  0 0 0 0 0.26  0 0 0 0.05 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    opacity: 0.4; mix-blend-mode: overlay;
  }
  .left { position: absolute; left: 70px; top: 0; bottom: 0; width: 720px; display: flex; flex-direction: column; justify-content: center; }
  .right { position: absolute; right: 30px; top: 50%; transform: translateY(-50%); width: 420px; height: 420px; }
  .pre {
    font-size: 16px; letter-spacing: 0.36em; text-transform: uppercase;
    color: #d4a843; margin-bottom: 24px; font-weight: 700;
  }
  h1 {
    font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 500;
    font-size: 116px; line-height: 0.95; margin: 0 0 24px;
    letter-spacing: -0.015em;
  }
  h1 .gold { color: #d4a843; }
  h1 .strike { text-decoration: line-through; text-decoration-color: #d4a843; color: #a89e85; font-size: 0.7em; }
  .sub {
    font-size: 18px; letter-spacing: 0.14em; text-transform: uppercase;
    color: #a89e85; line-height: 1.7; max-width: 640px;
  }
  .sub .gold { color: #d4a843; font-weight: 700; }
  .footer {
    position: absolute; left: 70px; bottom: 36px;
    display: flex; gap: 20px; align-items: center;
    font-size: 14px; letter-spacing: 0.22em; text-transform: uppercase; color: #a89e85;
  }
  .footer .pill {
    background: #d4a843; color: #0a1628; font-weight: 700;
    padding: 10px 22px; border-radius: 999px;
    letter-spacing: 0.2em;
  }
  .footer .url { color: #f4ecd6; font-weight: 700; }
</style>
</head>
<body>

    <div class="sub">
      Live heart coherence · Tesla 3-6-9 breath<br/>
      Schumann lock · 16 ancient protocols<br/>
      <span class="gold">AU$30 lifetime · no subscription</span>
    </div>
  </div>

  <div class="right">
    <svg width="100%" height="100%" viewBox="0 0 420 420">
      <defs>
        <radialGradient id="yt-glow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#d4a843" stop-opacity="0.55"/>
          <stop offset="50%" stop-color="#d4a843" stop-opacity="0.15"/>
          <stop offset="100%" stop-color="#d4a843" stop-opacity="0"/>

      </defs>
      <circle cx="210" cy="210" r="210" fill="url(#yt-glow)"/>

      <circle cx="210" cy="210" r="190" fill="none" stroke="#d4a843" stroke-width="2" opacity="0.3"/>
      <circle cx="210" cy="210" r="160" fill="none" stroke="#d4a843" stroke-width="2" opacity="0.45"/>
      <circle cx="210" cy="210" r="130" fill="none" stroke="#d4a843" stroke-width="2" opacity="0.6"/>

      </g>
      <circle cx="210" cy="210" r="70" fill="url(#yt-orb)"/>
      <circle cx="210" cy="210" r="22" fill="#d4a843"/>
    </svg>
  </div>

  <div class="footer">
    <span class="pill">AU$30 LIFETIME</span>
    <span class="url">rhythmixapp.com.au/codex</span>
  </div>
</div>
</body>
</html>
