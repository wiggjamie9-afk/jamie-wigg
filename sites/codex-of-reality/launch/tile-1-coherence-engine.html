<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Codex tile 1 · Coherence Engine</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600&family=JetBrains+Mono:wght@400;500;700&display=swap" />
<style>
  html, body { margin: 0; padding: 0; background: #000; }
  body { display: grid; place-items: center; min-height: 100vh; }
  .tile {
    width: 1080px; height: 1080px;
    background:
      radial-gradient(ellipse at 50% 50%, rgba(212,168,67,0.20), transparent 60%),
      #0a1628;
    color: #f4ecd6;
    position: relative; overflow: hidden;
    font-family: 'JetBrains Mono', monospace;
  }
  .tile::before {
    content: ''; position: absolute; inset: 0;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.83  0 0 0 0 0.65  0 0 0 0 0.26  0 0 0 0.05 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    opacity: 0.4; mix-blend-mode: overlay;
  }
  .top {
    position: absolute; top: 64px; left: 64px; right: 64px;
    display: flex; justify-content: space-between; align-items: baseline;
  }
  .brand {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic; font-size: 30px; color: #f4ecd6;
  }
  .brand .dot { color: #d4a843; }
  .tag {
    font-size: 14px; letter-spacing: 0.3em;
    text-transform: uppercase; color: #d4a843; font-weight: 700;
  }
  .stage {
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    width: 100%; text-align: center;
  }
  .eyebrow {
    font-size: 16px; letter-spacing: 0.34em;
    text-transform: uppercase; color: #a89e85;
    margin-bottom: 32px;
  }
  h1 {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic; font-weight: 500;
    font-size: 132px; line-height: 0.95;
    margin: 0 0 56px; letter-spacing: -0.015em;
    color: #f4ecd6;
  }
  h1 .gold { color: #d4a843; }
  .readout {
    display: inline-flex; align-items: baseline; gap: 24px;
    background: rgba(15,29,51,0.65);
    border: 1px solid rgba(212,168,67,0.4);
    border-radius: 999px;
    padding: 18px 42px;
    margin-bottom: 32px;
  }
  .readout .label {
    font-size: 12px; letter-spacing: 0.3em;
    color: #a89e85; text-transform: uppercase;
  }
  .readout .val { font-size: 42px; color: #d4a843; font-weight: 700; line-height: 1; }
  .readout .unit { font-size: 14px; color: #a89e85; margin-left: 4px; }
  .sub {
    font-size: 18px; letter-spacing: 0.18em;
    text-transform: uppercase; color: #a89e85;
    line-height: 1.7; max-width: 720px; margin: 0 auto;
  }
  .sub .gold { color: #d4a843; }
  .bottom {
    position: absolute; bottom: 64px; left: 64px; right: 64px;
    display: flex; justify-content: space-between; align-items: center;
    font-size: 14px; letter-spacing: 0.24em;
    text-transform: uppercase; color: #a89e85;
  }
  .bottom .url { color: #d4a843; font-weight: 700; }
  /* visual: orb in the background */
  .orb {
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    width: 600px; height: 600px;
    pointer-events: none; opacity: 0.55;
  }
</style>
</head>
<body>
<div class="tile">
  <svg class="orb" viewBox="0 0 600 600">
    <defs>
      <radialGradient id="o1" cx="35%" cy="35%" r="55%">
        <stop offset="0%" stop-color="#d4a843" stop-opacity="0.8"/>
        <stop offset="55%" stop-color="#d4a843" stop-opacity="0.2"/>
        <stop offset="100%" stop-color="#d4a843" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <circle cx="300" cy="300" r="280" fill="none" stroke="#d4a843" stroke-width="1.5" opacity="0.18"/>
    <circle cx="300" cy="300" r="220" fill="none" stroke="#d4a843" stroke-width="1.5" opacity="0.28"/>
    <circle cx="300" cy="300" r="160" fill="url(#o1)"/>
  </svg>

  <div class="top">
    <div class="brand">Codex<span class="dot"> · </span><em>of Reality</em></div>
    <div class="tag">01 / 04</div>
  </div>

  <div class="stage">
    <div class="eyebrow">THE COHERENCE ENGINE</div>
    <h1><span class="gold">Live HRV</span><br/>in your browser.</h1>
    <div class="readout">
      <div><div class="val" id="bpm">72</div><div class="label">BPM</div></div>
      <div><div class="val" style="color:#5ce5e0">68</div><div class="label">Coherence</div></div>
      <div><div class="val">832<span class="unit">ms</span></div><div class="label">RR</div></div>
    </div>
    <p class="sub">Reads your pulse through your phone camera. <span class="gold">Same biofeedback HeartMath sells for $249.</span> No sensor required.</p>
  </div>

  <div class="bottom">
    <span>Lifetime · AU$30</span>
    <span class="url">rhythmixapp.com.au/codex</span>
  </div>
</div>
</body>
</html>
