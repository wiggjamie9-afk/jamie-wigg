<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Codex people 1/3 · Place finger on camera</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600&family=JetBrains+Mono:wght@400;500;700&display=swap" />
<style>
  html, body { margin: 0; padding: 0; background: #000; }
  body { display: grid; place-items: center; min-height: 100vh; }
  .card {
    width: 1080px; height: 1350px;
    background:
      radial-gradient(ellipse at 50% 55%, rgba(212,168,67,0.22), transparent 55%),
      #0a1628;
    color: #f4ecd6; position: relative; overflow: hidden;
    font-family: 'JetBrains Mono', monospace;
  }
  .card::before {
    content: ''; position: absolute; inset: 0;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.83  0 0 0 0 0.65  0 0 0 0 0.26  0 0 0 0.05 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    opacity: 0.4; mix-blend-mode: overlay;
  }
  .top {
    position: absolute; top: 64px; left: 64px; right: 64px;
    display: flex; justify-content: space-between; align-items: baseline;
  }
  .brand { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 28px; }
  .brand .dot { color: #d4a843; }
  .step { font-size: 14px; letter-spacing: 0.32em; text-transform: uppercase; color: #d4a843; font-weight: 700; }

  .stage {
    position: absolute; left: 0; right: 0; top: 220px; height: 720px;
    display: grid; place-items: center;
  }
  .illus { width: 600px; height: 700px; }

  .caption {
    position: absolute; left: 0; right: 0; top: 970px;
    text-align: center; padding: 0 80px;
  }
  .eyebrow {
    font-size: 14px; letter-spacing: 0.36em; text-transform: uppercase;
    color: #a89e85; margin-bottom: 20px;
  }
  h1 {
    font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 500;
    font-size: 80px; line-height: 1; margin: 0 0 22px;
  }
  h1 .gold { color: #d4a843; }
  .sub {
    font-size: 17px; letter-spacing: 0.16em; text-transform: uppercase;
    color: #a89e85; line-height: 1.7;
  }
  .footer {
    position: absolute; bottom: 64px; left: 64px; right: 64px;
    display: flex; justify-content: space-between; align-items: center;
    font-size: 13px; letter-spacing: 0.24em; text-transform: uppercase; color: #a89e85;
  }
  .footer .url { color: #d4a843; font-weight: 700; }
</style>
</head>
<body>
<div class="card">
  <div class="top">
    <div class="brand">Codex<span class="dot"> · </span><em>of Reality</em></div>
    <div class="step">STEP 01 / 03</div>
  </div>

  <div class="stage">
    <svg class="illus" viewBox="0 0 600 700">
      <defs>
        <radialGradient id="p1-glow" cx="50%" cy="50%" r="40%">
          <stop offset="0%" stop-color="#d4a843" stop-opacity="0.9"/>
          <stop offset="60%" stop-color="#d4a843" stop-opacity="0.2"/>
          <stop offset="100%" stop-color="#d4a843" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="p1-phone" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#152744"/>
          <stop offset="100%" stop-color="#0a1628"/>
        </linearGradient>
        <linearGradient id="p1-hand" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#3a3a4a"/>
          <stop offset="100%" stop-color="#1a1a26"/>
        </linearGradient>
      </defs>

      <!-- glow behind the camera lens -->
      <circle cx="300" cy="260" r="180" fill="url(#p1-glow)"/>

      <!-- phone (back view, tilted slightly) -->
      <g transform="rotate(-8 300 380)">
        <!-- phone body -->
        <rect x="170" y="180" width="260" height="500" rx="38" ry="38"
              fill="url(#p1-phone)" stroke="#d4a843" stroke-width="2" stroke-opacity="0.6"/>
        <!-- camera island -->
        <rect x="210" y="220" width="120" height="120" rx="22" ry="22"
              fill="#0a1628" stroke="#d4a843" stroke-width="1.5" stroke-opacity="0.4"/>
        <!-- lens 1 (the one finger covers) -->
        <circle cx="250" cy="260" r="32" fill="#152744" stroke="#d4a843" stroke-width="1.5"/>
        <circle cx="250" cy="260" r="22" fill="#0a1628"/>
        <circle cx="250" cy="260" r="14" fill="#1a3050"/>
        <circle cx="244" cy="254" r="4" fill="#5ce5e0" opacity="0.8"/>
        <!-- lens 2 -->
        <circle cx="295" cy="300" r="22" fill="#152744" stroke="#d4a843" stroke-width="1" stroke-opacity="0.5"/>
        <circle cx="295" cy="300" r="14" fill="#0a1628"/>
        <!-- LED / flash -->
        <circle cx="250" cy="305" r="6" fill="#d4a843"/>
      </g>

      <!-- fingertip covering lens (stylized) -->
      <g>
        <!-- finger arc — coming in from top -->
        <path d="M 240 80 Q 230 180 250 250 Q 270 290 285 260 Q 295 230 285 180 Q 275 110 265 70 Z"
              fill="url(#p1-hand)" stroke="#d4a843" stroke-width="1" stroke-opacity="0.4"/>
        <!-- fingernail highlight -->
        <ellipse cx="262" cy="100" rx="14" ry="22" fill="#4a4a5a" opacity="0.6"/>
        <!-- pulse glow at fingertip -->
        <circle cx="265" cy="240" r="40" fill="#d4a843" opacity="0.18"/>
        <circle cx="265" cy="240" r="20" fill="#d4a843" opacity="0.35"/>
      </g>

      <!-- live BPM readout chip -->
      <g transform="translate(60 600)">
        <rect x="0" y="0" width="220" height="68" rx="34" ry="34"
              fill="rgba(15,29,51,0.85)" stroke="#d4a843" stroke-width="1.5" stroke-opacity="0.6"/>
        <text x="22" y="42" font-family="JetBrains Mono" font-size="32" font-weight="700" fill="#d4a843">72</text>
        <text x="78" y="44" font-family="JetBrains Mono" font-size="13" fill="#a89e85" letter-spacing="2">BPM · LIVE</text>
      </g>
      <!-- coherence chip -->
      <g transform="translate(330 600)">
        <rect x="0" y="0" width="220" height="68" rx="34" ry="34"
              fill="rgba(15,29,51,0.85)" stroke="#5ce5e0" stroke-width="1.5" stroke-opacity="0.7"/>
        <text x="22" y="42" font-family="JetBrains Mono" font-size="32" font-weight="700" fill="#5ce5e0">68</text>
        <text x="78" y="44" font-family="JetBrains Mono" font-size="13" fill="#a89e85" letter-spacing="2">COHERENCE</text>
      </g>
    </svg>
  </div>

  <div class="caption">
    <div class="eyebrow">PLACE FINGER ON CAMERA</div>
    <h1>Your <span class="gold">pulse</span> →<br/>read in <span class="gold">8 seconds</span>.</h1>
    <div class="sub">No sensor. No subscription. Just your phone.</div>
  </div>

  <div class="footer">
    <span>Coherence Engine</span>
    <span class="url">rhythmixapp.com.au/codex</span>
  </div>
</div>
</body>
</html>
