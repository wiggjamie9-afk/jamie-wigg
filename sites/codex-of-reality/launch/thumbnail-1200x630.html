<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Codex thumbnail · 1200×630</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600&family=JetBrains+Mono:wght@500;700&display=swap" />
<style>
  html, body { margin: 0; padding: 0; background: #000; }
  body { display: grid; place-items: center; min-height: 100vh; }
  .card {
    width: 1200px; height: 630px;
    background:
      radial-gradient(ellipse at 75% 40%, rgba(212,168,67,0.18), transparent 55%),
      radial-gradient(ellipse at 20% 70%, rgba(92,229,224,0.10), transparent 60%),
      #0a1628;
    color: #f4ecd6;
    position: relative;
    overflow: hidden;
    box-shadow: 0 20px 80px rgba(0,0,0,0.5);
  }
  /* parchment grain */
  .card::before {
    content: ''; position: absolute; inset: 0;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.83  0 0 0 0 0.65  0 0 0 0 0.26  0 0 0 0.06 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    opacity: 0.45; mix-blend-mode: overlay; pointer-events: none;
  }
  .left { position: absolute; left: 80px; top: 80px; right: 540px; bottom: 80px; }
  .right { position: absolute; right: 80px; top: 50%; transform: translateY(-50%); width: 440px; height: 440px; }
  .mono {
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: #a89e85;
    margin-bottom: 32px;
  }
  .mono .dot { color: #d4a843; }
  h1 {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic; font-weight: 500;
    font-size: 88px; line-height: 0.98;
    letter-spacing: -0.015em;
    margin: 0 0 28px;
    color: #f4ecd6;
  }
  h1 .gold { color: #d4a843; }
  .sub {
    font-family: 'JetBrains Mono', monospace;
    font-size: 16px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #a89e85;
    line-height: 1.7;
  }
  .sub .gold { color: #d4a843; font-weight: 700; }
  .price {
    position: absolute; left: 80px; bottom: 80px;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic; font-weight: 600;
    color: #d4a843; font-size: 56px; line-height: 1;
    text-shadow: 0 0 60px rgba(212,168,67,0.5);
  }
  .price .cur {
    font-family: 'JetBrains Mono', monospace;
    font-style: normal; font-weight: 500;
    font-size: 0.5em; vertical-align: 0.5em;
    letter-spacing: 0.04em; margin-right: 0.1em;
  }
  .price .tag {
    display: block;
    font-family: 'JetBrains Mono', monospace;
    font-style: normal; font-weight: 500;
    font-size: 11px; letter-spacing: 0.3em;
    color: #a89e85; margin-top: 8px; text-transform: uppercase;
  }
  /* logo: concentric circles + center dot */
  .logo { width: 100%; height: 100%; }
  /* download note (hidden when screenshotted) */
  .note {
    position: fixed; top: 10px; left: 10px;
    color: #555; font-family: monospace; font-size: 11px;
  }
  @media print { .note { display: none; } }
</style>
</head>
<body>
<div class="note">Open at any size · screenshot the 1200×630 card · or print as PDF</div>
<div class="card">
  <div class="left">
    <div class="mono">CODEX <span class="dot">·</span> OF REALITY</div>
    <h1><span class="gold">Reality</span><br/>has a&nbsp;frequency.</h1>
    <div class="sub">
      Live HRV coherence <span class="gold">·</span> Tesla 3-6-9<br/>
      In your browser <span class="gold">·</span> <span class="gold">AU$30</span> lifetime
    </div>
  </div>
  <div class="right">
    <svg class="logo" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="glow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#d4a843" stop-opacity="0.45"/>
          <stop offset="50%" stop-color="#d4a843" stop-opacity="0.1"/>
          <stop offset="100%" stop-color="#d4a843" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="orb" cx="35%" cy="35%" r="60%">
          <stop offset="0%" stop-color="#d4a843" stop-opacity="0.95"/>
          <stop offset="60%" stop-color="#d4a843" stop-opacity="0.3"/>
          <stop offset="100%" stop-color="#d4a843" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <circle cx="200" cy="200" r="190" fill="url(#glow)"/>
      <!-- outer rings -->
      <circle cx="200" cy="200" r="170" fill="none" stroke="#d4a843" stroke-width="2" opacity="0.35"/>
      <circle cx="200" cy="200" r="140" fill="none" stroke="#d4a843" stroke-width="2" opacity="0.5"/>
      <circle cx="200" cy="200" r="110" fill="none" stroke="#d4a843" stroke-width="2" opacity="0.7"/>
      <!-- tick marks for 3-6-9 -->
      <g stroke="#d4a843" stroke-width="2.5" opacity="0.6">
        <line x1="200" y1="30" x2="200" y2="50"/>
        <line x1="200" y1="350" x2="200" y2="370"/>
        <line x1="30" y1="200" x2="50" y2="200"/>
        <line x1="350" y1="200" x2="370" y2="200"/>
      </g>
      <!-- numbers 3 / 6 / 9 around -->
      <g font-family="Cormorant Garamond" font-style="italic" font-size="34" fill="#d4a843" opacity="0.85" text-anchor="middle">
        <text x="200" y="22">3</text>
        <text x="200" y="395">6</text>
        <text x="385" y="212">9</text>
      </g>
      <!-- center orb -->
      <circle cx="200" cy="200" r="65" fill="url(#orb)"/>
      <circle cx="200" cy="200" r="22" fill="#d4a843"/>
    </svg>
  </div>
  <div class="price"><span class="cur">AU$</span>30<span class="tag">PAY ONCE · YOURS FOREVER</span></div>
</div>
</body>
</html>
