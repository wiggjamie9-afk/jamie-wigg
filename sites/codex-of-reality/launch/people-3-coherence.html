<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Codex people 3/3 · Coherence achieved</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600&family=JetBrains+Mono:wght@400;500;700&display=swap" />
<style>
  html, body { margin: 0; padding: 0; background: #000; }
  body { display: grid; place-items: center; min-height: 100vh; }
  .card {
    width: 1080px; height: 1350px;
    background:
      radial-gradient(ellipse at 50% 42%, rgba(92,229,224,0.20), transparent 55%),
      radial-gradient(ellipse at 50% 60%, rgba(212,168,67,0.15), transparent 55%),
      #0a1628;
    color: #f4ecd6; position: relative; overflow: hidden;
    font-family: 'JetBrains Mono', monospace;
  }
  .card::before {
    content: ''; position: absolute; inset: 0;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.83  0 0 0 0 0.65  0 0 0 0 0.26  0 0 0 0.05 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    opacity: 0.4; mix-blend-mode: overlay;
  }
  .top {
    position: absolute; top: 64px; left: 64px; right: 64px;
    display: flex; justify-content: space-between; align-items: baseline;
  }
  .brand { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 28px; }
  .brand .dot { color: #5ce5e0; }
  .step { font-size: 14px; letter-spacing: 0.32em; text-transform: uppercase; color: #5ce5e0; font-weight: 700; }

  .stage {
    position: absolute; left: 0; right: 0; top: 180px; height: 760px;
    display: grid; place-items: center;
  }
  .illus { width: 760px; height: 760px; }

  .caption {
    position: absolute; left: 0; right: 0; top: 970px;
    text-align: center; padding: 0 80px;
  }
  .eyebrow {
    font-size: 14px; letter-spacing: 0.36em; text-transform: uppercase;
    color: #a89e85; margin-bottom: 20px;
  }
  h1 {
    font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 500;
    font-size: 80px; line-height: 1; margin: 0 0 22px;
  }
  h1 .cyan { color: #5ce5e0; }
  .sub {
    font-size: 17px; letter-spacing: 0.16em; text-transform: uppercase;
    color: #a89e85; line-height: 1.7;
  }
  .footer {
    position: absolute; bottom: 64px; left: 64px; right: 64px;
    display: flex; justify-content: space-between; align-items: center;
    font-size: 13px; letter-spacing: 0.24em; text-transform: uppercase; color: #a89e85;
  }
  .footer .url { color: #d4a843; font-weight: 700; }
</style>
</head>
<body>
<div class="card">
  <div class="top">
    <div class="brand">Codex<span class="dot"> · </span><em>of Reality</em></div>
    <div class="step">STEP 03 / 03</div>
  </div>

  <div class="stage">
    <svg class="illus" viewBox="0 0 760 760">
      <defs>
        <radialGradient id="p3-glow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#5ce5e0" stop-opacity="0.7"/>
          <stop offset="50%" stop-color="#5ce5e0" stop-opacity="0.18"/>
          <stop offset="100%" stop-color="#5ce5e0" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="p3-orb" cx="35%" cy="35%" r="55%">
          <stop offset="0%" stop-color="#5ce5e0" stop-opacity="0.95"/>
          <stop offset="50%" stop-color="#5ce5e0" stop-opacity="0.35"/>
          <stop offset="100%" stop-color="#5ce5e0" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="p3-fig" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#1a2440"/>
          <stop offset="100%" stop-color="#0a1628"/>
        </linearGradient>
        <linearGradient id="p3-heart" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#5ce5e0"/>
          <stop offset="100%" stop-color="#d4a843"/>
        </linearGradient>
      </defs>

      <!-- coherence glow (now CYAN — meaning the user is in coherence state) -->
      <circle cx="380" cy="220" r="320" fill="url(#p3-glow)"/>

      <!-- concentric rings — locked in coherence -->
      <circle cx="380" cy="220" r="220" fill="none" stroke="#5ce5e0" stroke-width="2" opacity="0.3"/>
      <circle cx="380" cy="220" r="170" fill="none" stroke="#5ce5e0" stroke-width="2" opacity="0.5"/>
      <circle cx="380" cy="220" r="125" fill="none" stroke="#5ce5e0" stroke-width="2" opacity="0.7"/>

      <!-- the coherent orb (cyan) -->
      <circle cx="380" cy="220" r="90" fill="url(#p3-orb)"/>
      <circle cx="380" cy="220" r="28" fill="#5ce5e0"/>

      <!-- coherence score callout -->
      <g transform="translate(540 80)">
        <rect x="0" y="0" width="170" height="80" rx="40" ry="40"
              fill="rgba(15,29,51,0.85)" stroke="#5ce5e0" stroke-width="1.5" stroke-opacity="0.85"/>
        <text x="22" y="50" font-family="JetBrains Mono" font-size="36" font-weight="700" fill="#5ce5e0">84</text>
        <text x="80" y="38" font-family="JetBrains Mono" font-size="10" fill="#a89e85" letter-spacing="2">COHERENCE</text>
        <text x="80" y="58" font-family="JetBrains Mono" font-size="10" fill="#5ce5e0" letter-spacing="2">/ 100 · HIGH</text>
      </g>
      <!-- BPM callout -->
      <g transform="translate(50 80)">
        <rect x="0" y="0" width="170" height="80" rx="40" ry="40"
              fill="rgba(15,29,51,0.85)" stroke="#d4a843" stroke-width="1.5" stroke-opacity="0.7"/>
        <text x="22" y="50" font-family="JetBrains Mono" font-size="36" font-weight="700" fill="#d4a843">63</text>
        <text x="80" y="38" font-family="JetBrains Mono" font-size="10" fill="#a89e85" letter-spacing="2">BPM</text>
        <text x="80" y="58" font-family="JetBrains Mono" font-size="10" fill="#a89e85" letter-spacing="2">RESTING</text>
      </g>

      <!-- HRV waveform (sine-locked at 0.1 Hz — visible coherence) -->
      <g transform="translate(50 390)" stroke="#5ce5e0" stroke-width="2.5" fill="none" opacity="0.9">
        <path d="M 0 30
                 Q 30 0 60 30 T 120 30
                 Q 150 60 180 30 T 240 30
                 Q 270 0 300 30 T 360 30
                 Q 390 60 420 30 T 480 30
                 Q 510 0 540 30 T 600 30
                 Q 630 60 660 30" />
      </g>
      <text x="380" y="450" text-anchor="middle"
            font-family="JetBrains Mono" font-size="11" fill="#a89e85" letter-spacing="3">
        RESPIRATORY SINUS ARRHYTHMIA · LOCKED
      </text>

      <!-- meditating figure with heart glow (front view) -->
      <g transform="translate(380 600)">
        <circle cx="0" cy="-30" r="46" fill="url(#p3-fig)" stroke="#5ce5e0" stroke-width="1.5" stroke-opacity="0.7"/>
        <path d="M -18 12 L -18 28
                 C -90 36 -140 90 -160 160
                 L 160 160
                 C 140 90 90 36 18 28
                 L 18 12 Z"
              fill="url(#p3-fig)" stroke="#5ce5e0" stroke-width="1.5" stroke-opacity="0.7"/>
        <!-- heart glow (cyan + gold combined) -->
        <circle cx="0" cy="90" r="30" fill="#5ce5e0" opacity="0.18"/>
        <circle cx="0" cy="90" r="18" fill="url(#p3-heart)" opacity="0.9"/>
        <!-- breath-line connecting heart to orb above -->
        <line x1="0" y1="80" x2="0" y2="-280" stroke="#5ce5e0" stroke-width="1.2" stroke-dasharray="4 6" opacity="0.5"/>
      </g>
    </svg>
  </div>

  <div class="caption">
    <div class="eyebrow">COHERENCE LOCK</div>
    <h1>The <span class="cyan">orb glows.</span><br/>Your heart is in&nbsp;sync.</h1>
    <div class="sub">Live HRV biofeedback · the practice score climbs</div>
  </div>

  <div class="footer">
    <span>The Coherence Engine</span>
    <span class="url">rhythmixapp.com.au/codex</span>
  </div>
</div>
</body>
</html>
