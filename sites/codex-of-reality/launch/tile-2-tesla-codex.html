<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Codex tile 2 · The Tesla Codex</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500;1,600&family=JetBrains+Mono:wght@400;500;700&display=swap" />
<style>
  html, body { margin: 0; padding: 0; background: #000; }
  body { display: grid; place-items: center; min-height: 100vh; }
  .tile {
    width: 1080px; height: 1080px;
    background:
      radial-gradient(ellipse at 50% 35%, rgba(212,168,67,0.18), transparent 60%),
      #0a1628;
    color: #f4ecd6;
    position: relative; overflow: hidden;
    font-family: 'JetBrains Mono', monospace;
  }
  .tile::before {
    content: ''; position: absolute; inset: 0;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.83  0 0 0 0 0.65  0 0 0 0 0.26  0 0 0 0.05 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    opacity: 0.4; mix-blend-mode: overlay;
  }
  .top {
    position: absolute; top: 64px; left: 64px; right: 64px;
    display: flex; justify-content: space-between; align-items: baseline;
  }
  .brand { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 30px; color: #f4ecd6; }
  .brand .dot { color: #d4a843; }
  .tag { font-size: 14px; letter-spacing: 0.3em; text-transform: uppercase; color: #d4a843; font-weight: 700; }
  .center {
    position: absolute; left: 0; right: 0; top: 50%;
    transform: translateY(-50%); text-align: center;
  }
  .eyebrow {
    font-size: 16px; letter-spacing: 0.34em;
    text-transform: uppercase; color: #a89e85;
    margin-bottom: 36px;
  }
  .nums {
    display: inline-flex; gap: 32px; align-items: baseline;
    margin-bottom: 36px;
  }
  .num {
    font-family: 'Cormorant Garamond', serif; font-style: italic;
    font-weight: 600; color: #d4a843;
    font-size: 260px; line-height: 0.9;
    text-shadow: 0 0 80px rgba(212,168,67,0.4);
  }
  .num small {
    display: block; font-family: 'JetBrains Mono', monospace;
    font-style: normal; font-weight: 500;
    font-size: 14px; color: #a89e85;
    letter-spacing: 0.3em; text-transform: uppercase; margin-top: 8px;
  }
  .sep {
    font-family: 'Cormorant Garamond', serif; font-style: italic;
    font-weight: 500; color: #a89e85;
    font-size: 80px; line-height: 1; align-self: center;
  }
  h1 {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic; font-weight: 500;
    font-size: 64px; line-height: 1.05;
    margin: 0 0 24px; color: #f4ecd6;
  }
  h1 .gold { color: #d4a843; }
  .quote {
    font-family: 'Cormorant Garamond', serif; font-style: italic;
    font-size: 22px; color: #a89e85;
    max-width: 760px; margin: 0 auto;
    line-height: 1.6;
  }
  .quote .attr {
    display: block; margin-top: 16px;
    font-family: 'JetBrains Mono', monospace;
    font-style: normal; font-size: 12px;
    letter-spacing: 0.3em; text-transform: uppercase; color: #d4a843;
  }
  .bottom {
    position: absolute; bottom: 64px; left: 64px; right: 64px;
    display: flex; justify-content: space-between; align-items: center;
    font-size: 14px; letter-spacing: 0.24em; text-transform: uppercase; color: #a89e85;
  }
  .bottom .url { color: #d4a843; font-weight: 700; }
</style>
</head>
<body>
<div class="tile">
  <div class="top">
    <div class="brand">Codex<span class="dot"> · </span><em>of Reality</em></div>
    <div class="tag">02 / 04</div>
  </div>

  <div class="center">
    <div class="eyebrow">THE TESLA CODEX · BREATH PROTOCOL</div>
    <div class="nums">
      <div class="num">3<small>IN</small></div>
      <span class="sep">·</span>
      <div class="num">6<small>HOLD</small></div>
      <span class="sep">·</span>
      <div class="num">9<small>OUT</small></div>
    </div>
    <h1><span class="gold">Tesla's key,</span> in the body.</h1>
    <p class="quote">
      &ldquo;If you knew the magnificence of the three, six and nine,<br/>
      you would have a key to the universe.&rdquo;
      <span class="attr">— attributed to Nikola Tesla</span>
    </p>
  </div>

  <div class="bottom">
    <span>One of 16 protocols</span>
    <span class="url">rhythmixapp.com.au/codex</span>
  </div>
</div>
</body>
</html>
