<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Codex people 2/3 · Breathing with the orb</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600&family=JetBrains+Mono:wght@400;500;700&display=swap" />
<style>
  html, body { margin: 0; padding: 0; background: #000; }
  body { display: grid; place-items: center; min-height: 100vh; }
  .card {
    width: 1080px; height: 1350px;
    background:
      radial-gradient(ellipse at 50% 42%, rgba(212,168,67,0.25), transparent 55%),
      #0a1628;
    color: #f4ecd6; position: relative; overflow: hidden;
    font-family: 'JetBrains Mono', monospace;
  }
  .card::before {
    content: ''; position: absolute; inset: 0;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.83  0 0 0 0 0.65  0 0 0 0 0.26  0 0 0 0.05 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    opacity: 0.4; mix-blend-mode: overlay;
  }
  .top {
    position: absolute; top: 64px; left: 64px; right: 64px;
    display: flex; justify-content: space-between; align-items: baseline;
  }
  .brand { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 28px; }
  .brand .dot { color: #d4a843; }
  .step { font-size: 14px; letter-spacing: 0.32em; text-transform: uppercase; color: #d4a843; font-weight: 700; }
  .stage {
    position: absolute; left: 0; right: 0; top: 180px; height: 760px;
    display: grid; place-items: center;
  }
  .illus { width: 720px; height: 760px; }
  .caption {
    position: absolute; left: 0; right: 0; top: 970px;
    text-align: center; padding: 0 80px;
  }
  .eyebrow {
    font-size: 14px; letter-spacing: 0.36em; text-transform: uppercase;
    color: #a89e85; margin-bottom: 20px;
  }
  h1 {
    font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 500;
    font-size: 80px; line-height: 1; margin: 0 0 22px;
  }
  h1 .gold { color: #d4a843; }
  .sub {
    font-size: 17px; letter-spacing: 0.16em; text-transform: uppercase;
    color: #a89e85; line-height: 1.7;
  }
  .footer {
    position: absolute; bottom: 64px; left: 64px; right: 64px;
    display: flex; justify-content: space-between; align-items: center;
    font-size: 13px; letter-spacing: 0.24em; text-transform: uppercase; color: #a89e85;
  }
  .footer .url { color: #d4a843; font-weight: 700; }
</style>
</head>
<body>
<div class="card">
  <div class="top">
    <div class="brand">Codex<span class="dot"> · </span><em>of Reality</em></div>
    <div class="step">STEP 02 / 03</div>
  </div>

  <div class="stage">
    <svg class="illus" viewBox="0 0 720 760">
      <defs>
        <radialGradient id="p2-orb-glow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#d4a843" stop-opacity="0.65"/>
          <stop offset="50%" stop-color="#d4a843" stop-opacity="0.15"/>
          <stop offset="100%" stop-color="#d4a843" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="p2-orb" cx="35%" cy="35%" r="55%">
          <stop offset="0%" stop-color="#d4a843" stop-opacity="0.95"/>
          <stop offset="50%" stop-color="#d4a843" stop-opacity="0.35"/>
          <stop offset="100%" stop-color="#d4a843" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="p2-fig" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#1a2440"/>
          <stop offset="100%" stop-color="#0a1628"/>
        </linearGradient>
      </defs>

      <!-- ambient orb glow -->
      <circle cx="360" cy="220" r="300" fill="url(#p2-orb-glow)"/>

      <!-- concentric coherence rings around the orb -->
      <circle cx="360" cy="220" r="200" fill="none" stroke="#d4a843" stroke-width="2" opacity="0.25"/>
      <circle cx="360" cy="220" r="160" fill="none" stroke="#d4a843" stroke-width="2" opacity="0.4"/>
      <circle cx="360" cy="220" r="120" fill="none" stroke="#d4a843" stroke-width="2" opacity="0.6"/>

      <!-- the breath orb (large, glowing) -->
      <circle cx="360" cy="220" r="90" fill="url(#p2-orb)"/>
      <circle cx="360" cy="220" r="30" fill="#d4a843"/>

      <!-- inhale / exhale arrows around the orb -->
      <g stroke="#d4a843" stroke-width="2" fill="none" opacity="0.7" stroke-linecap="round">
        <path d="M 460 180 q 30 -10 50 10" />
        <path d="M 500 188 l 12 2 l -2 -12" />
        <text x="540" y="170" font-family="JetBrains Mono" font-size="14" font-weight="700" fill="#d4a843" letter-spacing="2">IN</text>

        <path d="M 260 260 q -30 10 -50 -10" />
        <path d="M 220 248 l -12 -2 l 2 12" />
        <text x="140" y="282" font-family="JetBrains Mono" font-size="14" font-weight="700" fill="#d4a843" letter-spacing="2">OUT</text>
      </g>

      <!-- meditating figure (silhouette, seated lotus, profile) -->
      <g transform="translate(360 360)">
        <!-- head (with subtle gold halo where breath meets the orb) -->
        <circle cx="0" cy="0" r="58" fill="url(#p2-fig)" stroke="#d4a843" stroke-width="1.5" stroke-opacity="0.6"/>
        <!-- neck + shoulders + torso (front view, symmetric) -->
        <path d="M -22 50 L -22 70
                 C -120 78 -180 130 -200 240
                 L 200 240
                 C 180 130 120 78 22 70
                 L 22 50 Z"
              fill="url(#p2-fig)" stroke="#d4a843" stroke-width="1.5" stroke-opacity="0.6"/>
        <!-- crossed legs / lap -->
        <path d="M -200 240 Q -240 280 -260 360 L 260 360 Q 240 280 200 240 Z"
              fill="#0a1628" stroke="#d4a843" stroke-width="1.5" stroke-opacity="0.4"/>
        <!-- hands in mudra position at lap -->
        <circle cx="-50" cy="290" r="20" fill="#0a1628" stroke="#d4a843" stroke-width="1.5" stroke-opacity="0.5"/>
        <circle cx="50" cy="290" r="20" fill="#0a1628" stroke="#d4a843" stroke-width="1.5" stroke-opacity="0.5"/>
        <!-- subtle chest glow showing heart -->
        <circle cx="0" cy="140" r="14" fill="#d4a843" opacity="0.55"/>
        <circle cx="0" cy="140" r="28" fill="#d4a843" opacity="0.2"/>
      </g>

      <!-- 3-6-9 small marks at outer corners -->
      <g font-family="Cormorant Garamond" font-style="italic" font-size="26" fill="#d4a843" opacity="0.55">
        <text x="40" y="40">3</text>
        <text x="680" y="40" text-anchor="end">6</text>
        <text x="40" y="740">9</text>
      </g>
    </svg>
  </div>

  <div class="caption">
    <div class="eyebrow">BREATHE WITH THE ORB</div>
    <h1>5 in. <span class="gold">5 out.</span><br/>The orb does the&nbsp;rest.</h1>
    <div class="sub">Coherence frequency · 6 breaths per minute</div>
  </div>

  <div class="footer">
    <span>The Breath Pacer</span>
    <span class="url">rhythmixapp.com.au/codex</span>
  </div>
</div>
</body>
</html>
