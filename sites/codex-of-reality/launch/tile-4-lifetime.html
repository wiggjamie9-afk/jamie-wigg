<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Codex tile 4 · Lifetime</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600&family=JetBrains+Mono:wght@400;500;700&display=swap" />
<style>
  html, body { margin: 0; padding: 0; background: #000; }
  body { display: grid; place-items: center; min-height: 100vh; }
  .tile {
    width: 1080px; height: 1080px;
    background:
      radial-gradient(ellipse at 50% 40%, rgba(212,168,67,0.30), transparent 55%),
      #0a1628;
    color: #f4ecd6;
    position: relative; overflow: hidden;
    font-family: 'JetBrains Mono', monospace;
  }
  .tile::before {
    content: ''; position: absolute; inset: 0;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.83  0 0 0 0 0.65  0 0 0 0 0.26  0 0 0 0.05 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    opacity: 0.4; mix-blend-mode: overlay;
  }
  .top {
    position: absolute; top: 64px; left: 64px; right: 64px;
    display: flex; justify-content: space-between; align-items: baseline;
  }
  .brand { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 30px; color: #f4ecd6; }
  .brand .dot { color: #d4a843; }
  .tag { font-size: 14px; letter-spacing: 0.3em; text-transform: uppercase; color: #d4a843; font-weight: 700; }
  .center {
    position: absolute; left: 0; right: 0; top: 50%;
    transform: translateY(-50%); text-align: center;
  }
  .eyebrow {
    font-size: 16px; letter-spacing: 0.34em;
    text-transform: uppercase; color: #a89e85; margin-bottom: 28px;
  }
  .lifetime {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic; font-weight: 500;
    font-size: 72px; line-height: 1; color: #f4ecd6;
    margin: 0 0 40px;
  }
  .price {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic; font-weight: 600;
    color: #d4a843; font-size: 320px; line-height: 0.9;
    text-shadow: 0 0 100px rgba(212,168,67,0.6);
    margin: 0 0 28px;
  }
  .price .cur {
    font-family: 'JetBrains Mono', monospace; font-style: normal;
    font-weight: 500; font-size: 0.32em; vertical-align: 0.55em;
    letter-spacing: 0.04em; margin-right: 0.1em;
  }
  .seal {
    font-size: 18px; letter-spacing: 0.32em;
    text-transform: uppercase; color: #d4a843;
    font-weight: 700; margin-bottom: 36px;
  }
  ul.bullets {
    list-style: none; padding: 0;
    font-size: 16px; letter-spacing: 0.18em;
    text-transform: uppercase; color: #f4ecd6;
    max-width: 800px; margin: 0 auto;
  }
  ul.bullets li { padding: 8px 0; }
  ul.bullets li::before { content: '· '; color: #d4a843; font-weight: 700; margin-right: 0.5em; }
  .bottom {
    position: absolute; bottom: 64px; left: 64px; right: 64px;
    display: flex; justify-content: space-between; align-items: center;
    font-size: 14px; letter-spacing: 0.24em; text-transform: uppercase; color: #a89e85;
  }
  .bottom .url { color: #d4a843; font-weight: 700; }
</style>
</head>
<body>
<div class="tile">
  <div class="top">
    <div class="brand">Codex<span class="dot"> · </span><em>of Reality</em></div>
    <div class="tag">04 / 04</div>
  </div>

  <div class="center">
    <div class="eyebrow">FOUNDING MEMBER · LIFETIME</div>
    <div class="lifetime">One price.<br/>Lifetime in.</div>
    <div class="price"><span class="cur">AU$</span>30</div>
    <div class="seal">PAY ONCE · YOURS FOREVER</div>
    <ul class="bullets">
      <li>Every frequency, protocol &amp; program</li>
      <li>The Coherence Engine · Live HRV</li>
      <li>12 months of new content</li>
      <li>No subscription · No renewals</li>
    </ul>
  </div>

  <div class="bottom">
    <span>Founding membership</span>
    <span class="url">rhythmixapp.com.au/codex</span>
  </div>
</div>
</body>
</html>
