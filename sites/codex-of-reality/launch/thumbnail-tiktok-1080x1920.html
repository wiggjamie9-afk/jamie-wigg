<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Codex thumbnail · TikTok 1080×1920</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600&family=JetBrains+Mono:wght@500;700&display=swap" />
<style>
  html, body { margin: 0; padding: 0; background: #000; }
  body { display: grid; place-items: center; min-height: 100vh; }
  .card {
    width: 1080px; height: 1920px;
    background:
      radial-gradient(ellipse at 50% 38%, rgba(212,168,67,0.30), transparent 60%),
      #0a1628;
    color: #f4ecd6; position: relative; overflow: hidden;
    font-family: 'JetBrains Mono', monospace;
  }
  .card::before {
    content: ''; position: absolute; inset: 0;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.83  0 0 0 0 0.65  0 0 0 0 0.26  0 0 0 0.05 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    opacity: 0.4; mix-blend-mode: overlay;
  }
  .brand-mark {
    position: absolute; top: 120px; left: 50%; transform: translateX(-50%);
    font-family: 'Cormorant Garamond', serif; font-style: italic;
    font-size: 38px; color: #f4ecd6;
  }
  .brand-mark .dot { color: #d4a843; }
  .hook {
    position: absolute; top: 230px; left: 50%; transform: translateX(-50%);
    font-size: 22px; letter-spacing: 0.4em; text-transform: uppercase;
    color: #d4a843; font-weight: 700;
    background: rgba(212,168,67,0.12);
    border: 1px solid rgba(212,168,67,0.5);
    padding: 16px 36px; border-radius: 999px;
  }
  .orb-stage {
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -52%);
    width: 720px; height: 720px;
  }
  h1 {
    position: absolute; left: 0; right: 0; top: 1280px;
    font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 500;
    font-size: 132px; line-height: 0.95; letter-spacing: -0.015em;
    text-align: center; margin: 0; color: #f4ecd6;
  }
  h1 .gold { color: #d4a843; }
  .price-strip {
    position: absolute; bottom: 180px; left: 0; right: 0; text-align: center;
  }
  .price {
    font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 600;
    color: #d4a843; font-size: 220px; line-height: 0.9;
    text-shadow: 0 0 100px rgba(212,168,67,0.6);
  }
  .price .cur {
    font-family: 'JetBrains Mono', monospace; font-style: normal;
    font-weight: 500; font-size: 0.32em; vertical-align: 0.55em;
    letter-spacing: 0.04em; margin-right: 0.1em;
  }
  .url {
    margin-top: 24px;
    font-family: 'JetBrains Mono', monospace; font-weight: 700;
    font-size: 24px; letter-spacing: 0.18em; text-transform: uppercase;
    color: #f4ecd6;
  }
  .seal {
    font-size: 16px; letter-spacing: 0.32em; text-transform: uppercase;
    color: #a89e85; margin-top: 12px;
  }
</style>
</head>
<body>
<div class="card">
  <div class="brand-mark">Codex<span class="dot"> · </span><em>of Reality</em></div>
  <div class="hook">THE FIRST IN THE WORLD</div>

  <div class="orb-stage">
    <svg width="100%" height="100%" viewBox="0 0 720 720">
      <defs>
        <radialGradient id="tk-glow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#d4a843" stop-opacity="0.5"/>
          <stop offset="50%" stop-color="#d4a843" stop-opacity="0.15"/>
          <stop offset="100%" stop-color="#d4a843" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="tk-orb" cx="35%" cy="35%" r="55%">
          <stop offset="0%" stop-color="#d4a843" stop-opacity="1"/>
          <stop offset="50%" stop-color="#d4a843" stop-opacity="0.4"/>
          <stop offset="100%" stop-color="#d4a843" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <circle cx="360" cy="360" r="350" fill="url(#tk-glow)"/>
      <circle cx="360" cy="360" r="320" fill="none" stroke="#d4a843" stroke-width="2" opacity="0.25"/>
      <circle cx="360" cy="360" r="270" fill="none" stroke="#d4a843" stroke-width="2" opacity="0.4"/>
      <circle cx="360" cy="360" r="220" fill="none" stroke="#d4a843" stroke-width="2" opacity="0.55"/>
      <circle cx="360" cy="360" r="170" fill="none" stroke="#d4a843" stroke-width="2" opacity="0.7"/>
      <!-- 3-6-9 numerals at cardinal points -->
      <g font-family="Cormorant Garamond" font-style="italic" font-size="84" fill="#d4a843" text-anchor="middle">
        <text x="360" y="40">3</text>
        <text x="360" y="710">6</text>
        <text x="710" y="383">9</text>
      </g>
      <!-- center orb -->
      <circle cx="360" cy="360" r="120" fill="url(#tk-orb)"/>
      <circle cx="360" cy="360" r="42" fill="#d4a843"/>
    </svg>
  </div>

  <h1>
    <span class="gold">Reality</span> has<br/>
    a&nbsp;frequency.
  </h1>

  <div class="price-strip">
    <div class="price"><span class="cur">AU$</span>30</div>
    <div class="seal">LIFETIME · NO SUBSCRIPTION</div>
    <div class="url">rhythmixapp.com.au/codex</div>
  </div>
</div>
</body>
</html>
