<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Codex hero · 1920×1080</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600&family=JetBrains+Mono:wght@500;700&display=swap" />
<style>
  html, body { margin: 0; padding: 0; background: #000; }
  body { display: grid; place-items: center; min-height: 100vh; }
  .card {
    width: 1920px; height: 1080px;
    background:
      radial-gradient(ellipse at 70% 50%, rgba(212,168,67,0.20), transparent 55%),
      radial-gradient(ellipse at 20% 80%, rgba(92,229,224,0.10), transparent 60%),
      #0a1628;
    color: #f4ecd6;
    position: relative;
    overflow: hidden;
  }
  .card::before {
    content: ''; position: absolute; inset: 0;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.83  0 0 0 0 0.65  0 0 0 0 0.26  0 0 0 0.05 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    opacity: 0.4; mix-blend-mode: overlay;
  }
  .left { position: absolute; left: 140px; top: 50%; transform: translateY(-50%); width: 1000px; }
  .right { position: absolute; right: 100px; top: 50%; transform: translateY(-50%); width: 680px; height: 680px; }
  .mono {
    font-family: 'JetBrains Mono', monospace;
    font-size: 20px; letter-spacing: 0.34em;
    text-transform: uppercase; color: #a89e85;
    margin-bottom: 44px;
  }
  .mono .dot { color: #d4a843; }
  h1 {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic; font-weight: 500;
    font-size: 168px; line-height: 0.95;
    letter-spacing: -0.02em;
    margin: 0 0 48px;
  }
  h1 .gold { color: #d4a843; }
  .lead {
    font-family: 'JetBrains Mono', monospace;
    font-size: 22px; line-height: 1.6;
    letter-spacing: 0.12em; text-transform: uppercase;
    color: #a89e85; max-width: 720px;
  }
  .lead .gold { color: #d4a843; font-weight: 700; }
  .price-strip {
    position: absolute; left: 140px; bottom: 90px;
    display: flex; align-items: baseline; gap: 32px;
  }
  .price {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic; font-weight: 600;
    color: #d4a843; font-size: 96px; line-height: 1;
    text-shadow: 0 0 80px rgba(212,168,67,0.6);
  }
  .price .cur {
    font-family: 'JetBrains Mono', monospace; font-style: normal;
    font-weight: 500; font-size: 0.4em; vertical-align: 0.65em;
    letter-spacing: 0.04em; margin-right: 0.12em;
  }
  .url {
    font-family: 'JetBrains Mono', monospace;
    font-size: 18px; letter-spacing: 0.18em; text-transform: uppercase;
    color: #f4ecd6;
  }
  .url small {
    display: block; color: #a89e85; font-size: 12px;
    letter-spacing: 0.3em; margin-top: 6px;
  }
</style>
</head>
<body>
<div class="card">
  <div class="left">
    <div class="mono">CODEX <span class="dot">·</span> OF REALITY <span class="dot">·</span> FOUNDING MEMBER</div>
    <h1>
      <span class="gold">Reality</span><br/>
      has a&nbsp;frequency.
    </h1>
    <div class="lead">
      The first biofeedback platform built for the mystic. <span class="gold">·</span><br/>
      Live HRV coherence. Tesla 3-6-9 protocols. Schumann lock. <span class="gold">·</span><br/>
      <span class="gold">One price. Yours forever.</span>
    </div>
  </div>

  <div class="right">
    <svg width="100%" height="100%" viewBox="0 0 680 680" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="hglow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#d4a843" stop-opacity="0.5"/>
          <stop offset="40%" stop-color="#d4a843" stop-opacity="0.15"/>
          <stop offset="100%" stop-color="#d4a843" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="hcyan" cx="60%" cy="40%" r="50%">
          <stop offset="0%" stop-color="#5ce5e0" stop-opacity="0.25"/>
          <stop offset="100%" stop-color="#5ce5e0" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="horb" cx="35%" cy="35%" r="55%">
          <stop offset="0%" stop-color="#d4a843" stop-opacity="1"/>
          <stop offset="50%" stop-color="#d4a843" stop-opacity="0.4"/>
          <stop offset="100%" stop-color="#d4a843" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <circle cx="340" cy="340" r="330" fill="url(#hglow)"/>
      <circle cx="340" cy="340" r="330" fill="url(#hcyan)"/>
      <!-- concentric coherence rings -->
      <circle cx="340" cy="340" r="305" fill="none" stroke="#d4a843" stroke-width="2" opacity="0.25"/>
      <circle cx="340" cy="340" r="265" fill="none" stroke="#d4a843" stroke-width="2" opacity="0.35"/>
      <circle cx="340" cy="340" r="220" fill="none" stroke="#d4a843" stroke-width="2" opacity="0.5"/>
      <circle cx="340" cy="340" r="175" fill="none" stroke="#d4a843" stroke-width="2" opacity="0.7"/>
      <!-- 3-6-9 ticks -->
      <g stroke="#d4a843" stroke-width="3" opacity="0.65">
        <line x1="340" y1="10" x2="340" y2="50"/>
        <line x1="340" y1="630" x2="340" y2="670"/>
        <line x1="10" y1="340" x2="50" y2="340"/>
        <line x1="630" y1="340" x2="670" y2="340"/>
      </g>
      <g font-family="Cormorant Garamond" font-style="italic" font-size="56" fill="#d4a843" text-anchor="middle">
        <text x="340" y="-1">3</text>
        <text x="340" y="670">6</text>
        <text x="666" y="358">9</text>
      </g>
      <!-- breath orb -->
      <circle cx="340" cy="340" r="110" fill="url(#horb)"/>
      <circle cx="340" cy="340" r="36" fill="#d4a843"/>
    </svg>
  </div>

  <div class="price-strip">
    <div class="price"><span class="cur">AU$</span>30</div>
    <div class="url">rhythmixapp.com.au/codex<small>OPEN ON YOUR PHONE</small></div>
  </div>
</div>
</body>
</html>
