# STARLIGHTMIX Replicate-proxy Worker
#
# Deployed at https://replicate-proxy.studio.starlightmix.com/api/replicate-proxy/v1/*
#
# This Worker is stateless. It has:
#   - no KV bindings
#   - no D1 / R2 / Durable Object bindings
#   - no secrets (the user's Replicate token rides in the request's
#     Authorization header — it is NEVER stored in Worker config)
#
# Required setup (post-`wrangler login`):
#
#   1. Ensure the zone `starlightmix.com` is on Cloudflare (proxied).
#   2. Add a DNS record for `replicate-proxy.studio` pointing at this Worker
#      (Cloudflare will provision the cert automatically once the
#      custom-domain route below is applied).
#   3. Deploy:
#        wrangler deploy

name = "starlightmix-replicate-proxy"
main = "src/index.ts"
compatibility_date = "2025-05-01"
workers_dev = false

# Custom-domain route. Matches everything under the proxy prefix; non-matching
# paths fall through to the Worker's own 404.
[[routes]]
pattern = "replicate-proxy.studio.starlightmix.com/api/replicate-proxy/v1/*"
custom_domain = true

[observability]
enabled = true
