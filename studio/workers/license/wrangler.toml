# RHYTHMIX license-validation Worker
#
# Deployed at https://license.studio.rhythmixapp.com.au/api/license
#
# Required setup (post-`wrangler login`):
#
#   1. Create the KV namespace:
#        wrangler kv namespace create LICENSE_CACHE
#      Paste the returned `id = "..."` into the [[kv_namespaces]] block below.
#
#   2. Set the Gumroad product secret (one-off, never committed):
#        wrangler secret put GUMROAD_PRODUCT_ID
#      Value: the numeric / UUID `product_id` from your Gumroad product API
#      (NOT the public `permalink`). Find it in Gumroad's "Show advanced" panel
#      or via `GET https://api.gumroad.com/v2/products` with your access token.
#
#   3. Deploy:
#        wrangler deploy

name = "rhythmix-license"
main = "src/index.ts"
compatibility_date = "2025-05-01"
workers_dev = false

# Custom-domain route. The zone `rhythmixapp.com.au` must already be on
# Cloudflare (proxied) and `license.studio` should resolve to this Worker.
[[routes]]
pattern = "license.studio.rhythmixapp.com.au/api/license*"
custom_domain = true

# 24 h cache of valid license lookups, keyed `cached:<license_key>`.
# Run `wrangler kv namespace create LICENSE_CACHE` and replace the placeholder id.
[[kv_namespaces]]
binding = "LICENSE_CACHE"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Note: GUMROAD_PRODUCT_ID is set as a Worker secret, NOT in [vars]:
#   wrangler secret put GUMROAD_PRODUCT_ID
# Do not add it to this file — secrets must never be committed.

[observability]
enabled = true
