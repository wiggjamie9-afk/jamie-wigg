# Cloudflare Pages config for the RHYTHMIX Studio web app.
#
# This file describes the Pages project only. The two Workers (license
# validator, optional Replicate CORS proxy) each have their own wrangler.toml
# under studio/workers/* — do NOT add Workers config here.
#
# Pages deploys are produced by `.github/workflows/studio-deploy.yml` via
# `cloudflare/wrangler-action@v3` with the command
#   pages deploy studio/out --project-name=rhythmix-studio
# so this file mainly documents the project for humans + future tooling.
#
# Satisfies: N1 (Next.js static export → Cloudflare Pages at
# studio.rhythmixapp.com.au)

name = "rhythmix-studio"
pages_build_output_dir = "out"
compatibility_date = "2025-05-01"

# Branch → environment mapping for Pages.
#
# Cloudflare Pages automatically creates a preview deployment for every
# non-production branch at:
#   https://<branch>.rhythmix-studio.pages.dev
# (the project subdomain is derived from `name` above — note this differs
# slightly from the spec wording `<branch>.studio.rhythmixapp-pages.dev`,
# which is not a real Cloudflare Pages URL pattern; see README.md).
#
# `main` is the production branch — that deploy is gated behind the
# `production` GitHub Environment in the workflow, and lands at the custom
# domain `studio.rhythmixapp.com.au` once the DNS record is wired (see
# README.md → "Custom domain setup").
[env.production]
name = "rhythmix-studio"

[env.preview]
name = "rhythmix-studio"

# Custom domain — this is set in the Cloudflare dashboard under
# Pages → rhythmix-studio → Custom domains, not here. Listed for
# discoverability:
#   studio.rhythmixapp.com.au  (production)
