<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>RHYTHMIX is live — Poster</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #08050d;
        font-family: "Space Grotesk", system-ui, -apple-system, sans-serif;
        color: #ffffff;
        -webkit-font-smoothing: antialiased;
      }

      .poster {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #08050d;
      }

      /* Layered radial wash — green + violet, mirrors scene1/scene5 launch beat */
      .bg-radial {
        position: absolute; inset: 0;
        background:
          radial-gradient(700px 600px at 18% 14%, rgba(110, 255, 192, 0.30), transparent 62%),
          radial-gradient(900px 800px at 82% 78%, rgba(124, 58, 237, 0.40), transparent 65%),
          radial-gradient(600px 500px at 50% 110%, rgba(255, 31, 90, 0.22), transparent 70%);
        pointer-events: none;
      }

      /* Engineering grid — anchors the brand */
      .grid {
        position: absolute; inset: 0;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
        background-size: 60px 60px;
        pointer-events: none;
      }

      /* Vignette to push the eye to centre at thumb size */
      .vignette {
        position: absolute; inset: 0;
        background: radial-gradient(ellipse at center, transparent 50%, rgba(8, 5, 13, 0.65) 100%);
        pointer-events: none;
      }

      /* Scanline glow that feels like a 'now live' broadcast */
      .scan {
        position: absolute; left: 0; right: 0; top: 38%;
        height: 2px;
        background: linear-gradient(90deg, transparent, rgba(110, 255, 192, 0.55), transparent);
        box-shadow: 0 0 28px rgba(110, 255, 192, 0.6);
        pointer-events: none;
      }

      /* Frame */
      .frame {
        position: absolute; inset: 48px;
        border: 1px solid rgba(255, 255, 255, 0.10);
        border-radius: 28px;
        pointer-events: none;
      }

      .content {
        position: absolute; inset: 0;
        display: flex; flex-direction: column;
        justify-content: space-between;
        padding: 120px 96px 110px;
      }

      /* ===== TOP: Live badge + meta row ===== */
      .top {
        display: flex; flex-direction: column; gap: 36px;
        align-items: flex-start;
      }
      .badge {
        display: inline-flex; align-items: center; gap: 18px;
        padding: 18px 36px;
        border: 1px solid rgba(110, 255, 192, 0.6);
        background: rgba(110, 255, 192, 0.14);
        border-radius: 999px;
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 26px; letter-spacing: 8px;
        color: #b6ffe0; text-transform: uppercase;
      }
      .badge .dot {
        width: 18px; height: 18px; border-radius: 50%;
        background: #6effc0;
        box-shadow: 0 0 28px #6effc0, 0 0 6px #fff inset;
        animation: pulse 1.6s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { box-shadow: 0 0 28px #6effc0; }
        50% { box-shadow: 0 0 44px #6effc0, 0 0 12px #6effc0; }
      }

      .meta-row {
        display: flex; align-items: center; gap: 24px;
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 22px; letter-spacing: 6px;
        color: rgba(230, 230, 238, 0.65);
        text-transform: uppercase;
      }
      .meta-row .sep {
        width: 8px; height: 8px; border-radius: 50%;
        background: rgba(255, 255, 255, 0.25);
      }

      /* ===== MIDDLE: Headline stack ===== */
      .headline {
        display: flex; flex-direction: column;
        gap: 14px;
        position: relative;
      }

      /* Layered "The wait is over." — ghost echo behind the live copy */
      .h-stack {
        position: relative;
        margin-top: 10px;
      }
      .h1 {
        font-weight: 800;
        font-size: 168px;
        line-height: 0.92;
        letter-spacing: -6px;
        color: #ffffff;
        position: relative;
      }
      .h1 .over {
        font-style: normal;
        background: linear-gradient(135deg, #ff7aa6, #e0c0ff 50%, #8af6ff);
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .h1-ghost {
        position: absolute;
        top: -10px; left: -8px;
        font-weight: 800;
        font-size: 168px;
        line-height: 0.92;
        letter-spacing: -6px;
        color: transparent;
        -webkit-text-stroke: 1px rgba(255, 255, 255, 0.10);
        pointer-events: none;
        user-select: none;
      }

      .h2-wrap {
        margin-top: 56px;
        display: flex; flex-direction: column; gap: 18px;
      }
      .h2 {
        font-weight: 800;
        font-size: 140px;
        line-height: 0.92;
        letter-spacing: -5px;
      }
      .h2 .rhythmix {
        background: linear-gradient(135deg, #6effc0, #8af6ff 60%, #e0c0ff);
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent;
        text-shadow: 0 0 80px rgba(110, 255, 192, 0.25);
      }
      .h2 .islive {
        font-style: normal;
        background: linear-gradient(135deg, #ffe070, #ff7aa6);
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      /* Underline accent — energy bar */
      .energy {
        margin-top: 26px;
        display: flex; align-items: center; gap: 14px;
      }
      .energy .bar {
        height: 6px; border-radius: 3px;
      }
      .energy .b1 { width: 220px; background: linear-gradient(90deg, #6effc0, #8af6ff); box-shadow: 0 0 22px rgba(110, 255, 192, 0.55); }
      .energy .b2 { width: 90px; background: linear-gradient(90deg, #8af6ff, #e0c0ff); }
      .energy .b3 { width: 40px; background: #ff7aa6; }
      .energy .b4 { width: 14px; background: #ffe070; }

      /* ===== BOTTOM: spec + url ===== */
      .bottom {
        display: flex; flex-direction: column; gap: 44px;
        align-items: flex-start;
      }

      .spec {
        display: flex; flex-direction: column; gap: 18px;
        font-family: "Space Grotesk", system-ui, sans-serif;
      }
      .spec .lead {
        font-size: 44px;
        font-weight: 600;
        letter-spacing: -1px;
        color: #ffffff;
      }
      .spec .lead .em {
        background: linear-gradient(135deg, #ffe070, #ff7aa6);
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent;
        font-weight: 800;
      }
      .spec .terms {
        display: flex; align-items: center; gap: 22px;
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 24px; letter-spacing: 5px;
        color: rgba(230, 230, 238, 0.78);
        text-transform: uppercase;
      }
      .spec .terms .pip {
        width: 8px; height: 8px;
        background: #6effc0;
        border-radius: 50%;
        box-shadow: 0 0 16px #6effc0;
      }

      .url-block {
        width: 100%;
        display: flex; align-items: center; justify-content: space-between;
        gap: 24px;
        padding: 30px 40px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        background: linear-gradient(135deg, rgba(40, 30, 60, 0.7), rgba(28, 22, 42, 0.4));
        border-radius: 22px;
        backdrop-filter: blur(6px);
      }
      .url {
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 38px; letter-spacing: 2px;
        color: #ffffff;
        font-weight: 600;
      }
      .url .scheme { color: rgba(230, 230, 238, 0.55); }
      .url .host {
        background: linear-gradient(135deg, #8af6ff, #e0c0ff);
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .arrow {
        width: 56px; height: 56px;
        border-radius: 50%;
        background: linear-gradient(135deg, #6effc0, #8af6ff);
        display: flex; align-items: center; justify-content: center;
        color: #08050d;
        font-weight: 800;
        font-size: 28px;
        box-shadow: 0 0 36px rgba(110, 255, 192, 0.4);
        flex-shrink: 0;
      }

      /* Corner crop marks — print/poster feel */
      .crop {
        position: absolute;
        width: 32px; height: 32px;
        border: 2px solid rgba(255, 255, 255, 0.30);
      }
      .crop.tl { top: 28px; left: 28px; border-right: none; border-bottom: none; }
      .crop.tr { top: 28px; right: 28px; border-left: none; border-bottom: none; }
      .crop.bl { bottom: 28px; left: 28px; border-right: none; border-top: none; }
      .crop.br { bottom: 28px; right: 28px; border-left: none; border-top: none; }

      /* Side label — vertical "now streaming" */
      .side-label {
        position: absolute;
        right: 78px;
        top: 50%;
        transform: translateY(-50%) rotate(90deg);
        transform-origin: right center;
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 18px;
        letter-spacing: 10px;
        color: rgba(230, 230, 238, 0.45);
        text-transform: uppercase;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div class="poster">
      <div class="bg-radial"></div>
      <div class="grid"></div>
      <div class="scan"></div>
      <div class="vignette"></div>
      <div class="frame"></div>

      <div class="crop tl"></div>
      <div class="crop tr"></div>
      <div class="crop bl"></div>
      <div class="crop br"></div>

      <div class="side-label">Now Streaming · 2026</div>

      <div class="content">

        <div class="top">
          <div class="badge"><span class="dot"></span>Live Now</div>
          <div class="meta-row">
            <span>Announcement</span>
            <span class="sep"></span>
            <span>05 / 26</span>
            <span class="sep"></span>
            <span>AU</span>
          </div>
        </div>

        <div class="headline">
          <div class="h-stack">
            <div class="h1-ghost">The wait<br/>is over.</div>
            <div class="h1">The wait<br/>is <span class="over">over.</span></div>
          </div>

          <div class="h2-wrap">
            <div class="h2"><span class="rhythmix">RHYTHMIX</span></div>
            <div class="h2">is <span class="islive">live.</span></div>
          </div>

          <div class="energy">
            <span class="bar b1"></span>
            <span class="bar b2"></span>
            <span class="bar b3"></span>
            <span class="bar b4"></span>
          </div>
        </div>

        <div class="bottom">
          <div class="spec">
            <div class="lead">
              An AI music platform. <span class="em">AU$149.</span> Lifetime.
            </div>
            <div class="terms">
              <span class="pip"></span>
              <span>One payment</span>
              <span class="sep" style="width:6px;height:6px;background:rgba(255,255,255,0.25);border-radius:50%;"></span>
              <span>No subscription</span>
              <span class="sep" style="width:6px;height:6px;background:rgba(255,255,255,0.25);border-radius:50%;"></span>
              <span>Lifetime updates</span>
            </div>
          </div>

          <div class="url-block">
            <div class="url"><span class="scheme">→ </span><span class="host">rhythmixapp.com.au</span></div>
            <div class="arrow">↗</div>
          </div>
        </div>

      </div>
    </div>
  </body>
</html>
