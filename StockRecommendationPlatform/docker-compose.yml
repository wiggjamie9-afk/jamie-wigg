version: '3.8'

services:
  stock-api:
    build: .
    container_name: stock-recommendation-platform
    ports:
      - "8000:8000"
    environment:
      - POLYGON_API_KEY=${POLYGON_API_KEY:-}
      - PYTHONUNBUFFERED=1
    volumes:
      - .:/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  # Optional: Add reverse proxy (Nginx)
  nginx:
    image: nginx:alpine
    container_name: stock-platform-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - stock-api
    restart: unless-stopped
    profiles:
      - with-proxy
