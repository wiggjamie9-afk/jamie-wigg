name: Send Daily Email Sequences

on:
  schedule:
    # Run daily at 9 AM UTC
    - cron: '0 9 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  send-emails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Send Day-0 Welcome Emails
        run: |
          curl -X POST https://${{ secrets.VERCEL_URL }}/api/email/sequences \
            -H "Content-Type: application/json" \
            -d '{"action":"send-sequences"}' \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

      - name: Log Success
        if: success()
        run: echo "✅ Daily email sequences sent successfully"

      - name: Alert on Failure
        if: failure()
        run: |
          curl -X POST ${{ secrets.SLACK_WEBHOOK }} \
            -H 'Content-Type: application/json' \
            -d '{
              "text": "❌ Email sequence failed",
              "attachments": [{"color": "danger", "text": "Check GitHub Actions logs"}]
            }'
