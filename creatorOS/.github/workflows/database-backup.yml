name: Database Backup & Health Check

on:
  schedule:
    # Run daily at midnight UTC
    - cron: '0 0 * * *'
    # Run every 6 hours for health check
    - cron: '0 */6 * * *'
  workflow_dispatch:

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

jobs:
  backup-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Node
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Check Database Health
        run: |
          npm install @supabase/supabase-js
          node - <<'EOF'
          const { createClient } = require('@supabase/supabase-js');
          const supabase = createClient(
            process.env.SUPABASE_URL,
            process.env.SUPABASE_SERVICE_ROLE_KEY
          );

          (async () => {
            try {
              // Test query
              const { data, error } = await supabase
                .from('users')
                .select('count')
                .limit(1);

              if (error) throw error;

              console.log('✅ Database is healthy');

              // Get table stats
              const tables = ['users', 'content', 'earnings', 'referrals'];
              for (const table of tables) {
                const { count } = await supabase
                  .from(table)
                  .select('*', { count: 'exact', head: true });
                console.log(`  ${table}: ${count} records`);
              }
            } catch (err) {
              console.error('❌ Database health check failed:', err.message);
              process.exit(1);
            }
          })();
          EOF

      - name: Backup to GitHub (Weekly)
        if: github.event.schedule == '0 0 * * 0' || github.event_name == 'workflow_dispatch'
        run: |
          echo "Database backup stored in Supabase (automatic)"
          echo "GitHub Actions workflow logs: $(date)" >> .github/BACKUP_LOG.txt
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add .github/BACKUP_LOG.txt
          git commit -m "Weekly database backup snapshot - $(date)" || true
          git push || true

      - name: Notify Slack on Success
        if: success()
        run: |
          curl -X POST ${{ secrets.SLACK_WEBHOOK }} \
            -H 'Content-Type: application/json' \
            -d '{
              "text": "✅ Database health check passed",
              "attachments": [{"color": "good", "text": "All systems operational"}]
            }'

      - name: Alert on Failure
        if: failure()
        run: |
          curl -X POST ${{ secrets.SLACK_WEBHOOK }} \
            -H 'Content-Type: application/json' \
            -d '{
              "text": "🚨 DATABASE HEALTH CHECK FAILED",
              "attachments": [{"color": "danger", "text": "Investigate immediately at https://app.supabase.com"}]
            }'
