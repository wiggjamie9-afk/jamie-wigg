<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fart Man: The Grocery Store Incident</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 1080px; height: 1920px; background: #87ceeb; font-family: 'Comic Sans MS', Arial, sans-serif; overflow: hidden; display: flex; align-items: center; justify-content: center; }
    .scene { width: 100%; height: 100%; position: absolute; display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.8s ease; }
    .scene.active { opacity: 1; }
    .grocery { background: linear-gradient(180deg, #fff9e6 0%, #fff0cc 100%); }
    .checkout { background: linear-gradient(180deg, #ffe6cc 0%, #ffccaa 100%); }
    .produce { background: linear-gradient(180deg, #e6ffe6 0%, #ccffcc 100%); }
    .title { position: absolute; top: 120px; left: 0; right: 0; text-align: center; color: #2c3e50; font-size: 64px; font-weight: bold; text-shadow: 3px 3px 0 #e0e0e0; }
    .shelf { position: absolute; bottom: 600px; width: 800px; height: 200px; background: repeating-linear-gradient(90deg, #8b6f47 0 20px, #6b5839 20px 40px); border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
    .person { font-size: 140px; position: absolute; }
    .fart-text { position: absolute; font-size: 80px; font-weight: bold; color: #fff; text-shadow: 3px 3px 0 #c1121f; }
    @keyframes shake { 0%, 100% { transform: translateY(0) rotate(0); } 25% { transform: translateY(-15px) rotate(-3deg); } 75% { transform: translateY(15px) rotate(3deg); } }
    .scene.active { animation: shake 0.4s; }
  </style>
</head>
<body>
  <div class="scene grocery active">
    <div class="title">GROCERY STORE INCIDENT</div>
    <div class="shelf"></div>
    <div class="person fart-guy" style="bottom: 650px; left: 50%; transform: translateX(-50%);">🧑</div>
  </div>
  <div class="scene checkout">
    <div class="title">QUIET CHECKOUT LINE</div>
    <div class="person" style="left: 150px; bottom: 700px;">👴</div>
    <div class="person fart-guy" style="left: 400px; bottom: 700px;">🧑</div>
    <div class="person" style="left: 650px; bottom: 700px;">👩</div>
    <div class="fart-text" style="top: 800px;">PPPPFFFFFTTT</div>
  </div>
  <div class="scene produce">
    <div class="title">PRODUCE SECTION</div>
    <div class="person fart-guy" style="left: 300px; bottom: 700px;">🧑</div>
    <div class="person" style="right: 250px; bottom: 700px;">🧘‍♀️</div>
    <div class="fart-text" style="top: 600px;">BRRRP 😳</div>
  </div>
  <div class="scene checkout" style="background: linear-gradient(180deg, #ffcccc 0%, #ff9999 100%);">
    <div class="title">MANAGER INCOMING</div>
    <div class="person fart-guy" style="left: 200px; bottom: 700px;">🧑</div>
    <div class="person" style="right: 150px; bottom: 700px; color: #000;">🕴️</div>
    <div class="fart-text" style="top: 500px; font-size: 100px;">BRRAAAAP</div>
    <div style="position: absolute; bottom: 300px; font-size: 80px;">💀</div>
  </div>
  <div style="position: absolute; inset: 0; background: #1a1a2e; display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0;">
    <h2 style="font-size: 72px; color: #fff; margin-bottom: 20px;">Just trying to buy milk</h2>
    <div style="font-size: 50px; color: #ffb703;">Subscribe for Fart Man</div>
  </div>
  <script>
    const scenes = document.querySelectorAll('.scene');
    const timings = [12, 14, 14, 14, 6];
    let time = 0;
    setInterval(() => {
      let total = 0;
      for (let i = 0; i < timings.length; i++) {
        if (time >= total && time < total + timings[i]) {
          scenes.forEach(s => s.classList.remove('active'));
          if (i < scenes.length) scenes[i].classList.add('active');
          break;
        }
        total += timings[i];
      }
      time++;
      if (time >= 60) time = 0;
    }, 1000);
  </script>
</body>
</html>
