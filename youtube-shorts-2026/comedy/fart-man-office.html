<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fart Man: The Office Meeting</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 1080px;
      height: 1920px;
      background: #1a1a1a;
      font-family: Arial, sans-serif;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .scene {
      width: 100%;
      height: 100%;
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.8s ease;
    }

    .scene.active { opacity: 1; }

    /* Scene 1: Office Setup */
    .scene-1 {
      background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
    }

    .conference-table {
      width: 800px;
      height: 400px;
      background: linear-gradient(180deg, #8b7355 0%, #5d4e37 100%);
      border-radius: 20px;
      position: relative;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    .chair {
      width: 120px;
      height: 140px;
      background: #34495e;
      border-radius: 10px;
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 60px;
      font-weight: bold;
    }

    .fart-guy {
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      background: linear-gradient(135deg, #3498db, #2980b9);
      z-index: 10;
    }

    .executive {
      background: #34495e;
    }

    .exec-1 { left: 50px; top: 50%; transform: translateY(-50%); }
    .exec-2 { right: 50px; top: 50%; transform: translateY(-50%); }
    .exec-3 { left: 200px; top: -80px; }
    .exec-4 { right: 200px; top: -80px; }

    .title {
      position: absolute;
      top: 100px;
      left: 0;
      right: 0;
      text-align: center;
      color: white;
      font-size: 56px;
      font-weight: bold;
    }

    /* Scene 2-4: Reactions */
    .reaction-scene {
      display: flex;
      gap: 40px;
      align-items: center;
      justify-content: center;
    }

    .person {
      width: 200px;
      height: 300px;
      background: linear-gradient(135deg, #e67e22, #d35400);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 100px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.4);
    }

    .reaction-text {
      position: absolute;
      top: 150px;
      font-size: 64px;
      color: white;
      font-weight: bold;
      text-shadow: 2px 2px 8px rgba(0,0,0,0.6);
    }

    /* Scene 2: First fart */
    .scene-2 {
      background: linear-gradient(135deg, #c0392b 0%, #a93226 100%);
    }

    .scene-2 .person { background: linear-gradient(135deg, #e74c3c, #c0392b); }

    /* Scene 3: Escalation */
    .scene-3 {
      background: linear-gradient(135deg, #8e44ad 0%, #6c3483 100%);
    }

    .scene-3 .person { background: linear-gradient(135deg, #af7ac5, #7d3c98); }

    /* Scene 4: Grand finale */
    .scene-4 {
      background: linear-gradient(135deg, #d35400 0%, #ba4a00 100%);
    }

    .scene-4 .person { background: linear-gradient(135deg, #f39c12, #d68910); }

    /* Scene 5: CTA */
    .scene-5 {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
    }

    .cta-text {
      text-align: center;
      color: white;
    }

    .cta-text h2 {
      font-size: 72px;
      margin-bottom: 30px;
      color: #f39c12;
    }

    .cta-text p {
      font-size: 48px;
      margin-bottom: 50px;
    }

    .cta-text .handle {
      font-size: 52px;
      color: #f39c12;
      font-weight: bold;
    }

    @keyframes shake {
      0%, 100% { transform: translateY(0); }
      25% { transform: translateY(-10px); }
      75% { transform: translateY(10px); }
    }

    @keyframes bounce {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }

    .scene-2.active, .scene-3.active, .scene-4.active {
      animation: shake 0.3s;
    }

    .scene-4.active .person {
      animation: bounce 0.5s;
    }
  </style>
</head>
<body>
  <!-- Scene 1: Setup -->
  <div class="scene scene-1 active">
    <div class="title">THE OFFICE MEETING</div>
    <div class="conference-table">
      <div class="chair fart-guy">🧑</div>
      <div class="chair executive exec-1">👨‍💼</div>
      <div class="chair executive exec-2">👩‍💼</div>
      <div class="chair executive exec-3">🕴️</div>
      <div class="chair executive exec-4">👨‍💻</div>
    </div>
  </div>

  <!-- Scene 2: First Fart -->
  <div class="scene scene-2">
    <div class="reaction-text">💨 PPPPFFFTTT</div>
    <div style="position: absolute; bottom: 200px; font-size: 150px;">😶</div>
  </div>

  <!-- Scene 3: Escalation -->
  <div class="scene scene-3">
    <div class="reaction-text">💨 BRRRRPPP...</div>
    <div style="position: absolute; left: 100px; bottom: 300px; font-size: 120px;">😱</div>
    <div style="position: absolute; right: 100px; bottom: 300px; font-size: 120px;">🤢</div>
  </div>

  <!-- Scene 4: Grand Finale -->
  <div class="scene scene-4">
    <div class="reaction-text">💨 BRRRRAAAAPPPPP</div>
    <div style="position: absolute; left: 150px; bottom: 300px; font-size: 140px; animation: bounce 0.5s;">💀</div>
    <div style="position: absolute; right: 150px; bottom: 300px; font-size: 140px;">😵</div>
  </div>

  <!-- Scene 5: CTA -->
  <div class="scene scene-5">
    <div class="cta-text">
      <h2>DON'T GO</h2>
      <p>Subscribe for more chaos</p>
      <div class="handle">@fart.man.comedy</div>
    </div>
  </div>

  <script>
    const scenes = document.querySelectorAll('.scene');
    const timings = [10, 12, 15, 15, 8]; // seconds per scene
    let currentTime = 0;
    let currentScene = 0;

    setInterval(() => {
      let totalTime = 0;
      for (let i = 0; i < timings.length; i++) {
        if (currentTime >= totalTime && currentTime < totalTime + timings[i]) {
          if (i !== currentScene) {
            scenes[currentScene].classList.remove('active');
            currentScene = i;
            scenes[currentScene].classList.add('active');
          }
          break;
        }
        totalTime += timings[i];
      }
      currentTime++;
      if (currentTime >= 60) currentTime = 0;
    }, 1000);
  </script>
</body>
</html>
