<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fart Man: First Day at the Gym</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 1080px; height: 1920px; background: #222; font-family: 'Comic Sans MS', Arial, sans-serif; overflow: hidden; }
    .scene { width: 100%; height: 100%; position: absolute; display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.8s ease; }
    .scene.active { opacity: 1; }
    .gym-1 { background: linear-gradient(180deg, #444 0%, #222 100%); }
    .gym-2 { background: linear-gradient(180deg, #d9534f 0%, #c9302c 100%); }
    .gym-3 { background: linear-gradient(180deg, #8b7355 0%, #5d4e37 100%); }
    .gym-4 { background: linear-gradient(180deg, #ff6b6b 0%, #d63031 100%); }
    .title { position: absolute; top: 150px; left: 0; right: 0; text-align: center; color: #fff; font-size: 60px; font-weight: bold; text-shadow: 3px 3px 0 #000; }
    .equipment { position: absolute; font-size: 120px; }
    .person { font-size: 140px; position: absolute; }
    .fart-text { position: absolute; font-size: 100px; font-weight: bold; color: #fff; text-shadow: 4px 4px 0 #d63031; }
    @keyframes shake { 0%, 100% { transform: translateY(0); } 25% { transform: translateY(-20px); } 75% { transform: translateY(20px); } }
    .scene.active { animation: shake 0.4s; }
  </style>
</head>
<body>
  <div class="scene gym-1 active">
    <div class="title">FIRST DAY AT THE GYM</div>
    <div class="equipment" style="left: 150px; bottom: 800px;">🏋️</div>
    <div class="equipment" style="right: 150px; bottom: 800px;">🏋️</div>
    <div class="person fart-guy" style="bottom: 700px; left: 50%; transform: translateX(-50%);">🧑</div>
    <div style="position: absolute; bottom: 300px; font-size: 60px; opacity: 0.6;">Everyone focused. Quiet.</div>
  </div>
  <div class="scene gym-2">
    <div class="title">TREADMILL TIME</div>
    <div class="person" style="left: 100px; bottom: 700px;">🏃</div>
    <div class="person fart-guy" style="left: 400px; bottom: 700px;">🧑</div>
    <div class="person" style="right: 100px; bottom: 700px;">💪</div>
    <div class="fart-text" style="top: 600px;">PPPPFFFFFTTT</div>
  </div>
  <div class="scene gym-3">
    <div class="title">WEIGHT BENCH</div>
    <div class="person fart-guy" style="left: 300px; bottom: 700px;">🧑</div>
    <div class="person" style="right: 200px; bottom: 700px;">💪</div>
    <div class="fart-text" style="top: 500px; font-size: 90px;">BRRRP</div>
    <div style="position: absolute; right: 100px; bottom: 600px; font-size: 100px;">🚶</div>
  </div>
  <div class="scene gym-4">
    <div class="title">LOCKER ROOM FINALE</div>
    <div class="person fart-guy" style="left: 250px; bottom: 700px;">🧑</div>
    <div class="person" style="left: 600px; bottom: 700px; animation: fadeOut 1s;">👨</div>
    <div class="person" style="right: 150px; bottom: 700px; animation: fadeOut 1s;">👨</div>
    <div class="fart-text" style="top: 400px; font-size: 110px;">BRRAAAAPPPPP</div>
    <div style="position: absolute; bottom: 250px; font-size: 120px;">💀💀💀</div>
  </div>
  <script>
    const scenes = document.querySelectorAll('.scene');
    const timings = [10, 15, 15, 20];
    let time = 0;
    setInterval(() => {
      let total = 0;
      for (let i = 0; i < timings.length; i++) {
        if (time >= total && time < total + timings[i]) {
          scenes.forEach(s => s.classList.remove('active'));
          if (i < scenes.length) scenes[i].classList.add('active');
          break;
        }
        total += timings[i];
      }
      time++;
      if (time >= 60) time = 0;
    }, 1000);
  </script>
</body>
</html>
