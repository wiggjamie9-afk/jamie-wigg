<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mr. Fart Man: The Next-Door Neighbourhood</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 1080px;
      height: 1920px;
      background: #87ceeb;
      font-family: 'Comic Sans MS', 'Chalkboard SE', Arial, sans-serif;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .scene {
      width: 100%;
      height: 100%;
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.8s ease;
    }

    .scene.active { opacity: 1; }

    /* Sky + grass base for outdoor neighbourhood feel */
    .outdoor {
      background: linear-gradient(180deg, #87ceeb 0%, #b0e0e6 55%, #7cbb5a 55%, #5a9e3a 100%);
    }

    .title {
      position: absolute;
      top: 120px;
      left: 0;
      right: 0;
      text-align: center;
      color: white;
      font-size: 72px;
      font-weight: bold;
      text-shadow: 4px 4px 0 #2c3e50;
      line-height: 1.1;
    }

    .subtitle {
      position: absolute;
      top: 320px;
      left: 0;
      right: 0;
      text-align: center;
      color: #2c3e50;
      font-size: 40px;
      font-weight: bold;
    }

    /* Houses row */
    .street {
      position: absolute;
      bottom: 420px;
      display: flex;
      gap: 30px;
      align-items: flex-end;
    }

    .house {
      width: 220px;
      height: 260px;
      background: #f4d35e;
      border-radius: 8px;
      position: relative;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    }

    .house.blue { background: #8ecae6; }
    .house.pink { background: #ffb4a2; }

    .house::before {
      content: '';
      position: absolute;
      top: -70px;
      left: -10px;
      right: -10px;
      height: 90px;
      background: #c1121f;
      clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
    }

    .door {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 70px;
      height: 110px;
      background: #6f4518;
      border-radius: 8px 8px 0 0;
    }

    .fence {
      position: absolute;
      bottom: 380px;
      left: 0;
      right: 0;
      height: 90px;
      background: repeating-linear-gradient(90deg, #fff 0 30px, #ddd 30px 36px);
      opacity: 0.9;
    }

    /* Character */
    .fart-man {
      font-size: 200px;
      position: absolute;
      bottom: 430px;
      z-index: 20;
    }

    .reaction-text {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      font-size: 96px;
      color: #fff;
      font-weight: bold;
      text-shadow: 4px 4px 0 #c1121f, 8px 8px 12px rgba(0,0,0,0.4);
      z-index: 30;
    }

    .neighbour {
      font-size: 150px;
      position: absolute;
      z-index: 25;
    }

    /* Scene-specific backgrounds */
    .scene-bbq { background: linear-gradient(180deg, #ffb703 0%, #fb8500 100%); }
    .scene-door { background: linear-gradient(180deg, #a2d2ff 0%, #cdb4db 100%); }
    .scene-fence { background: linear-gradient(180deg, #95d5b2 0%, #52b788 100%); }

    .scene-cta {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
    }

    .cta-text { text-align: center; color: white; }
    .cta-text h2 { font-size: 80px; margin-bottom: 30px; color: #ffb703; text-shadow: 3px 3px 0 #c1121f; }
    .cta-text p { font-size: 46px; margin-bottom: 50px; }
    .cta-text .handle { font-size: 54px; color: #ffb703; font-weight: bold; }

    @keyframes shake {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      25% { transform: translateY(-12px) rotate(-3deg); }
      75% { transform: translateY(12px) rotate(3deg); }
    }
    @keyframes bounce {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-20px); }
    }

    .scene.active .reaction-text { animation: bounce 0.5s; }
    .scene-bbq.active, .scene-door.active, .scene-fence.active { animation: shake 0.4s; }
    .fart-man { animation: float 2s ease-in-out infinite; }
  </style>
</head>
<body>
  <!-- Scene 1: Setup — the neighbourhood street -->
  <div class="scene outdoor active">
    <div class="title">MR. FART MAN</div>
    <div class="subtitle">moves into the neighbourhood 🏡</div>
    <div class="fence"></div>
    <div class="street">
      <div class="house blue"><div class="door"></div></div>
      <div class="house"><div class="door"></div></div>
      <div class="house pink"><div class="door"></div></div>
    </div>
    <div class="fart-man" style="bottom: 420px;">🧑</div>
  </div>

  <!-- Scene 2: Next-door BBQ -->
  <div class="scene scene-bbq">
    <div class="title" style="text-shadow: 4px 4px 0 #6a040f;">THE BBQ INVITE</div>
    <div class="neighbour" style="left: 180px; bottom: 600px;">👨‍🍳</div>
    <div class="fart-man" style="right: 180px; bottom: 600px;">🧑</div>
    <div class="reaction-text" style="bottom: 400px; top: auto;">💨 PFFFT</div>
    <div style="position: absolute; bottom: 250px; font-size: 130px;">🍔🔥</div>
  </div>

  <!-- Scene 3: Borrowing sugar at the door -->
  <div class="scene scene-door">
    <div class="title" style="color:#2c3e50; text-shadow:none;">"Can I borrow sugar?"</div>
    <div class="house pink" style="position:absolute; bottom:500px; width:300px; height:340px;">
      <div class="door"></div>
    </div>
    <div class="neighbour" style="left: 220px; bottom: 560px;">👩</div>
    <div class="fart-man" style="right: 220px; bottom: 560px;">🧑</div>
    <div class="reaction-text" style="bottom: 380px; top:auto;">💨 BRRRP 😳</div>
  </div>

  <!-- Scene 4: The garden fence chat -->
  <div class="scene scene-fence">
    <div class="title" style="text-shadow: 4px 4px 0 #1b4332;">THE FENCE CHAT</div>
    <div class="fence" style="bottom: 560px; height: 140px;"></div>
    <div class="neighbour" style="left: 230px; bottom: 600px;">🧓</div>
    <div class="fart-man" style="right: 230px; bottom: 600px;">🧑</div>
    <div class="reaction-text" style="bottom: 360px; top:auto;">💨 BRRRAAAP 💀</div>
  </div>

  <!-- Scene 5: CTA -->
  <div class="scene scene-cta">
    <div class="cta-text">
      <h2>NEW NEIGHBOUR<br>WHO DIS? 💨</h2>
      <p>Subscribe for Mr. Fart Man's<br>next disaster</p>
      <div class="handle">@mr.fartman</div>
    </div>
  </div>

  <script>
    const scenes = document.querySelectorAll('.scene');
    const timings = [10, 14, 13, 13, 10]; // seconds per scene = 60s
    let currentTime = 0;
    let currentScene = 0;

    setInterval(() => {
      let totalTime = 0;
      for (let i = 0; i < timings.length; i++) {
        if (currentTime >= totalTime && currentTime < totalTime + timings[i]) {
          if (i !== currentScene) {
            scenes[currentScene].classList.remove('active');
            currentScene = i;
            scenes[currentScene].classList.add('active');
          }
          break;
        }
        totalTime += timings[i];
      }
      currentTime++;
      if (currentTime >= 60) currentTime = 0;
    }, 1000);
  </script>
</body>
</html>
