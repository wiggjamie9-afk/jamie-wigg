<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Post 20 — 60 spots left at $149 lifetime</title>
<link rel="stylesheet" href="brand.css">
<style>
.canvas-1080-1350 {
  background: linear-gradient(135deg, rgba(245,192,0,0.06), rgba(255,31,90,0.04)), var(--canvas);
}
.spots-banner {
  font-family: var(--mono);
  font-weight: 700;
  font-size: 32px;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: var(--magenta);
  margin-bottom: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.canvas-1080-1350 .hero-num { font-size: 360px; }
.was {
  font-family: var(--mono);
  font-size: 26px;
  color: var(--muted);
  text-decoration: line-through;
  margin-top: 32px;
  letter-spacing: 0.15em;
}
.forever {
  font-family: var(--mono);
  font-weight: 700;
  font-size: 32px;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--green);
  margin-top: 16px;
}
.cta-pill {
  display: inline-block;
  font-family: var(--display);
  font-weight: 700;
  font-size: 22px;
  padding: 18px 44px;
  border-radius: 100px;
  background: linear-gradient(135deg, var(--magenta), var(--purple));
  color: var(--white);
  margin-top: 56px;
  letter-spacing: 0.05em;
}
</style>
</head>
<body>
  <div class="canvas canvas-1080-1350">
    <div class="spots-banner"><span class="pulse-dot"></span>60 Spots Left</div>
    <div class="hero-num gold">$149</div>
    <div class="mono-caps lg" style="margin-top: 24px; color: var(--white);">Once · Lifetime</div>
    <div class="was">$348 / year</div>
    <div class="forever">Forever Access</div>
    <div class="cta-pill">Comment 60 for the link</div>
    <div class="wordmark">
      RHYTHMIX
      <span class="url">rhythmix.app/lifetime</span>
    </div>
  </div>
  <div class="slide-label">Post 20 · Instagram · 1080×1350</div>
</body>
</html>
