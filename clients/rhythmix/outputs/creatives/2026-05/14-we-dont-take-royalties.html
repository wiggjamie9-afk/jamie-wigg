<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Post 14 — We don't take royalties</title>
<link rel="stylesheet" href="brand.css">
<style>
.canvas-1080 { padding: 80px; }
.zero-cut {
  font-family: var(--mono);
  font-weight: 700;
  font-size: 24px;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--green);
  margin-bottom: 40px;
  display: inline-flex;
  align-items: center;
  gap: 14px;
}
.zero-cut .dot {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: var(--green);
  box-shadow: 0 0 16px rgba(0,232,135,0.6);
}
.hook {
  font-family: var(--display);
  font-weight: 800;
  font-size: 84px;
  line-height: 1.05;
  letter-spacing: -0.015em;
  margin-bottom: 56px;
  max-width: 920px;
}
.hook em {
  font-style: normal;
  color: var(--green);
}
.compare-row {
  display: flex;
  gap: 32px;
  margin-bottom: 48px;
  font-family: var(--mono);
  font-size: 18px;
  text-transform: uppercase;
  letter-spacing: 0.18em;
}
.compare-row .item {
  flex: 1;
  text-align: center;
  padding: 24px 16px;
  border-radius: 14px;
}
.compare-row .them {
  background: rgba(255,31,90,0.05);
  border: 1px solid rgba(255,31,90,0.25);
  color: var(--muted);
}
.compare-row .them .pct { color: var(--magenta); font-size: 32px; font-weight: 700; display: block; margin-top: 8px; font-family: var(--display); }
.compare-row .us {
  background: rgba(0,232,135,0.06);
  border: 1px solid rgba(0,232,135,0.3);
  color: var(--white);
}
.compare-row .us .pct { color: var(--green); font-size: 32px; font-weight: 700; display: block; margin-top: 8px; font-family: var(--display); }
.cta {
  display: inline-block;
  font-family: var(--display);
  font-weight: 700;
  font-size: 22px;
  padding: 16px 40px;
  border-radius: 100px;
  background: linear-gradient(135deg, var(--magenta), var(--purple));
  color: var(--white);
  letter-spacing: 0.04em;
}
</style>
</head>
<body>
  <div class="canvas canvas-1080 glow-purple">
    <div class="zero-cut"><span class="dot"></span>0% Royalty Cut</div>
    <h1 class="hook">We don't take royalties.<br>Your music <em>stays yours.</em></h1>
    <div class="compare-row">
      <div class="item them">DistroKid<span class="pct">9%</span></div>
      <div class="item them">AI Platforms<span class="pct">Partial</span></div>
      <div class="item them">Some Labels<span class="pct">80%</span></div>
      <div class="item us">RHYTHMIX<span class="pct">0%</span></div>
    </div>
    <div class="cta">Comment OWN for the LTD</div>
    <div class="wordmark">
      RHYTHMIX
      <span class="url">rhythmix.app/lifetime</span>
    </div>
  </div>
  <div class="slide-label">Post 14 · IG (auto-shares to Threads) · 1080×1080</div>
</body>
</html>
