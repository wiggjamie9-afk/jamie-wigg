<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Post 13 — $0 forever or $149 once</title>
<link rel="stylesheet" href="brand.css">
<style>
.price-row {
  display: flex;
  gap: 32px;
  align-items: stretch;
  width: 100%;
  max-width: 880px;
}
.price-card {
  flex: 1;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 24px;
  padding: 56px 40px;
  text-align: center;
}
.price-card.lifetime {
  background: linear-gradient(135deg, rgba(245,192,0,0.08), rgba(255,31,90,0.06));
  border: 2px solid rgba(245,192,0,0.3);
  position: relative;
}
.price-card .label {
  font-family: var(--mono);
  font-size: 14px;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 24px;
}
.price-card.lifetime .label { color: var(--gold); }
.price-card .amount {
  font-family: var(--display);
  font-weight: 800;
  font-size: 180px;
  line-height: 1;
  color: var(--white);
}
.price-card.lifetime .amount { color: var(--gold); }
.price-card .period {
  font-family: var(--mono);
  font-size: 18px;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: var(--muted);
  margin-top: 12px;
}
.price-card.lifetime .period { color: var(--white); }
.spots {
  position: absolute;
  top: 16px;
  right: 16px;
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: 0.2em;
  color: var(--magenta);
  text-transform: uppercase;
  display: flex;
  align-items: center;
}
.headline {
  font-family: var(--display);
  font-weight: 800;
  font-size: 64px;
  line-height: 1.05;
  margin-bottom: 64px;
  max-width: 880px;
}
.headline em { font-style: normal; color: var(--gold); }
</style>
</head>
<body>
  <div class="canvas canvas-1080-1350 glow-purple">
    <div class="headline">$0 forever. Or <em>$149 once.</em><br>That's it.</div>
    <div class="price-row">
      <div class="price-card">
        <div class="label">Free Forever</div>
        <div class="amount">$0</div>
        <div class="period">No Card</div>
      </div>
      <div class="price-card lifetime">
        <div class="spots"><span class="pulse-dot"></span>60 Spots Left</div>
        <div class="label">Lifetime · Once</div>
        <div class="amount">$149</div>
        <div class="period">Forever Access</div>
      </div>
    </div>
    <div class="wordmark">
      RHYTHMIX
      <span class="url">rhythmix.app/lifetime</span>
    </div>
  </div>
  <div class="slide-label">Post 13 · Instagram · 1080×1350</div>
</body>
</html>
