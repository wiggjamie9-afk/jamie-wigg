<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Post 08 — Nova VR concert</title>
<link rel="stylesheet" href="brand.css">
<style>
.canvas-1080 .hero-num { font-size: 240px; }
.world-grid {
  position: absolute;
  inset: 0;
  background-image:
    radial-gradient(circle at 18% 36%, var(--cyan) 0 4px, transparent 5px),
    radial-gradient(circle at 28% 28%, var(--cyan) 0 3px, transparent 4px),
    radial-gradient(circle at 38% 42%, var(--cyan) 0 4px, transparent 5px),
    radial-gradient(circle at 52% 30%, var(--cyan) 0 3px, transparent 4px),
    radial-gradient(circle at 62% 48%, var(--cyan) 0 4px, transparent 5px),
    radial-gradient(circle at 72% 36%, var(--cyan) 0 3px, transparent 4px),
    radial-gradient(circle at 82% 52%, var(--cyan) 0 4px, transparent 5px),
    radial-gradient(circle at 22% 58%, var(--cyan) 0 3px, transparent 4px),
    radial-gradient(circle at 36% 68%, var(--cyan) 0 4px, transparent 5px),
    radial-gradient(circle at 50% 60%, var(--cyan) 0 3px, transparent 4px),
    radial-gradient(circle at 60% 72%, var(--cyan) 0 4px, transparent 5px),
    radial-gradient(circle at 74% 64%, var(--cyan) 0 3px, transparent 4px),
    radial-gradient(circle at 88% 70%, var(--cyan) 0 4px, transparent 5px);
  filter: drop-shadow(0 0 12px rgba(0,216,255,0.7));
  opacity: 0.65;
  pointer-events: none;
}
.subhead {
  font-family: var(--mono);
  font-weight: 600;
  font-size: 28px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--pink);
  margin-top: 32px;
}
</style>
</head>
<body>
  <div class="canvas canvas-1080 glow-purple">
    <div class="world-grid"></div>
    <div style="position: relative;">
      <div class="hero-num white">$96,000</div>
      <div class="mono-caps lg" style="margin-top: 16px; color: var(--white);">One Night</div>
      <div class="subhead">2,847 Fans · 127 Countries</div>
    </div>
    <div class="avatar-chip" style="margin-top: 64px; position: relative;">
      <div class="av" style="background: linear-gradient(135deg, #00d8ff, #00e887);">NV</div>
      <span><strong style="color: var(--white); font-family: var(--display); font-size: 18px;">Nova Vance ✓</strong> · @nova_creates · VR Concert</span>
    </div>
    <div class="wordmark">
      RHYTHMIX
      <span class="url">rhythmix.app/lifetime</span>
    </div>
  </div>
  <div class="slide-label">Post 08 · Threads · 1080×1080</div>
</body>
</html>
