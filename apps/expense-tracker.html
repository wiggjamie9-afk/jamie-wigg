<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker – Budget Control</title>
    <style>
        :root { --primary: #F59E0B; --bg-dark: #0F172A; --bg-light: #1E293B; --text-primary: #F1F5F9; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { font-family: -apple-system, sans-serif; background: var(--bg-dark); color: var(--text-primary); }
        .container { max-width: 480px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }
        .header { background: linear-gradient(135deg, var(--primary) 0%, #D97706 100%); padding: 24px 20px; text-align: center; }
        .header h1 { font-size: 28px; margin-bottom: 4px; }
        .content { flex: 1; padding: 20px; overflow-y: auto; }
        .card { background: var(--bg-light); border-radius: 12px; padding: 16px; margin-bottom: 16px; border-left: 4px solid var(--primary); }
        .card h2 { font-size: 16px; margin-bottom: 12px; font-weight: 700; }
        input, select { width: 100%; padding: 10px 12px; background: var(--bg-dark); border: 2px solid #334155; border-radius: 8px; color: var(--text-primary); margin-bottom: 10px; font-size: 13px; }
        input:focus, select:focus { outline: none; border-color: var(--primary); }
        button { width: 100%; padding: 12px; background: var(--primary); border: none; border-radius: 8px; color: #0F172A; font-weight: 600; cursor: pointer; }
        button:hover { background: #D97706; }
        .expense { background: var(--bg-dark); padding: 12px; border-radius: 6px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .expense-info { flex: 1; }
        .expense-amount { color: var(--primary); font-weight: 600; }
        .label { display: block; font-size: 12px; color: #CBD5E1; margin-bottom: 4px; font-weight: 600; }
        .total { font-size: 24px; font-weight: 700; color: var(--primary); margin: 12px 0; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💰 EXPENSE TRACKER</h1>
            <p style="font-size: 12px;">Control your spending</p>
        </div>
        <div class="content">
            <div class="card">
                <h2>📊 Today's Total</h2>
                <div class="total" id="todayTotal">₹0</div>
            </div>

            <div class="card">
                <h2>➕ Add Expense</h2>
                <label>Description</label>
                <input type="text" id="desc" placeholder="E.g., Groceries">
                <label>Amount</label>
                <input type="number" id="amount" placeholder="0.00" step="0.01" min="0">
                <label>Category</label>
                <select id="category">
                    <option>Food</option>
                    <option>Transport</option>
                    <option>Health</option>
                    <option>Work</option>
                    <option>Other</option>
                </select>
                <button onclick="addExpense()">Add Expense</button>
            </div>

            <div class="card">
                <h2>📋 Recent Expenses</h2>
                <div id="expenseList">No expenses yet</div>
            </div>
        </div>
    </div>

    <script>
        function addExpense() {
            const desc = document.getElementById('desc').value;
            const amt = parseFloat(document.getElementById('amount').value);
            const cat = document.getElementById('category').value;

            if (!desc || !amt) { alert('Fill all fields'); return; }

            let exps = JSON.parse(localStorage.getItem('expenses') || '[]');
            exps.push({ desc, amt, cat, date: new Date().toISOString().split('T')[0], id: Date.now() });
            localStorage.setItem('expenses', JSON.stringify(exps));

            document.getElementById('desc').value = '';
            document.getElementById('amount').value = '';
            displayExpenses();
        }

        function deleteExpense(id) {
            let exps = JSON.parse(localStorage.getItem('expenses') || '[]');
            exps = exps.filter(e => e.id !== id);
            localStorage.setItem('expenses', JSON.stringify(exps));
            displayExpenses();
        }

        function displayExpenses() {
            const exps = JSON.parse(localStorage.getItem('expenses') || '[]');
            const today = new Date().toISOString().split('T')[0];
            const todayExps = exps.filter(e => e.date === today);
            const total = todayExps.reduce((sum, e) => sum + e.amt, 0);

            document.getElementById('todayTotal').textContent = '₹' + total.toFixed(2);

            const list = document.getElementById('expenseList');
            if (exps.length === 0) {
                list.innerHTML = '<p style="color: #CBD5E1; font-size: 12px;">No expenses yet</p>';
                return;
            }

            list.innerHTML = exps.slice().reverse().map(e => `
                <div class="expense">
                    <div class="expense-info">
                        <div><strong>${e.desc}</strong></div>
                        <div style="font-size: 11px; color: #CBD5E1;">${e.cat} • ${e.date}</div>
                    </div>
                    <div style="display: flex; gap: 8px; align-items: center;">
                        <div class="expense-amount">₹${e.amt.toFixed(2)}</div>
                        <button onclick="deleteExpense(${e.id})" style="width: auto; padding: 6px 10px; margin: 0; background: #DC2626; color: white;">×</button>
                    </div>
                </div>
            `).join('');
        }

        displayExpenses();
    </script>
</body>
</html>
