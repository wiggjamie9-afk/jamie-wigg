<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#08050d">
    <title>Expense Tracker</title>
    <style>
        :root { --canvas:#08050d; --green:#00e887; --red:#ff1f5a; --cyan:#00d8ff; --purple:#7c3aed; --text:#fff; --text-muted:#aaa; }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:var(--canvas); color:var(--text); min-height:100vh; padding-bottom:80px; }
        .header { padding:20px; border-bottom:1px solid rgba(0,232,135,0.2); display:flex; justify-content:space-between; }
        h1 { font-size:24px; font-weight:700; }
        .badge { background:var(--green); color:var(--canvas); padding:4px 12px; border-radius:20px; font-size:11px; }
        .content { padding:20px; }
        input, select { background:rgba(0,232,135,0.05); border:1px solid rgba(0,232,135,0.2); border-radius:6px; color:var(--text); padding:10px; margin:8px 0; width:100%; }
        button { background:var(--green); color:var(--canvas); border:0; padding:10px 16px; border-radius:6px; cursor:pointer; font-weight:600; width:100%; }
        .card { background:rgba(0,232,135,0.05); border:1px solid rgba(0,232,135,0.2); border-radius:8px; padding:12px; margin:12px 0; }
        .item { padding:8px; border-bottom:1px solid rgba(0,232,135,0.1); display:flex; justify-content:space-between; }
        .amount { color:var(--red); font-weight:600; }
        .panel { display:none; }
        .panel.on { display:block; }
        .tabs { position:fixed; bottom:0; left:0; right:0; background:var(--canvas); border-top:1px solid rgba(0,232,135,0.2); display:flex; justify-content:space-around; height:70px; z-index:100; }
        .tab { flex:1; background:0; border:0; color:var(--text-muted); cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:12px; }
        .tab.on { color:var(--green); }
        .chart { margin:15px 0; }
        .bar { background:rgba(0,232,135,0.1); border-radius:4px; margin:8px 0; overflow:hidden; height:20px; display:flex; align-items:center; }
        .bar-fill { background:var(--green); height:100%; color:var(--canvas); font-size:11px; display:flex; align-items:center; padding:0 4px; }
        .premium { background:rgba(124,58,237,0.1); border-left:3px solid var(--purple); padding:12px; margin-top:20px; border-radius:4px; font-size:13px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>💳 Expenses</h1>
        <div class="badge">FREE</div>
    </div>
    <div class="content">
        <div id="daily" class="panel on">
            <input type="number" id="amt" placeholder="Amount ($)" step="0.01" min="0">
            <select id="desc">
                <option>Lunch</option>
                <option>Gas</option>
                <option>Coffee</option>
                <option>Groceries</option>
                <option>Other</option>
            </select>
            <button onclick="logExp()">+ Log</button>
            
            <div class="card" style="margin-top:20px">
                <div style="font-weight:600;margin-bottom:10px">Today</div>
                <div class="item"><span>Total:</span><span class="amount" id="today">$0</span></div>
            </div>
            
            <div id="exp-list"></div>
            <div class="premium">💎 Premium: Receipt scanning & AI categorization</div>
        </div>
        
        <div id="trends" class="panel">
            <div style="font-weight:600;margin-bottom:15px">7-Day Trend</div>
            <div class="chart" id="chart"></div>
            <div style="margin-top:20px">
                <div class="item"><span>7-Day Avg:</span><span class="amount" id="avg">$0</span></div>
                <div class="item"><span>7-Day Total:</span><span class="amount" id="total">$0</span></div>
            </div>
        </div>
    </div>
    <div class="tabs">
        <button class="tab on" data-p="daily">📝 Daily</button>
        <button class="tab" data-p="trends">📈 Trends</button>
    </div>
    <script>
        let exps = [];
        let today = new Date().toISOString().slice(0,10);
        
        function load() {
            let d = localStorage.getItem('expense');
            if (d) exps = JSON.parse(d);
            draw();
        }
        
        function save() {
            localStorage.setItem('expense', JSON.stringify(exps));
            draw();
        }
        
        function logExp() {
            let a = parseFloat(document.getElementById('amt').value);
            let d = document.getElementById('desc').value;
            if (!a) return;
            exps.push({a, d, t:new Date().toISOString()});
            document.getElementById('amt').value = '';
            save();
        }
        
        function draw() {
            let todayExps = exps.filter(x => x.t.slice(0,10) === today);
            let todayTotal = todayExps.reduce((s,x) => s + x.a, 0);
            document.getElementById('today').textContent = '$' + todayTotal.toFixed(2);
            
            document.getElementById('exp-list').innerHTML = todayExps.length ?
                todayExps.map(x => `<div class="item"><span>${x.d}</span><span class="amount">-$${x.a.toFixed(2)}</span></div>`).join('') :
                '<p style="color:var(--text-muted);margin-top:15px">No expenses today</p>';
            
            let last7 = [];
            for (let i = 6; i >= 0; i--) {
                let d = new Date();
                d.setDate(d.getDate() - i);
                let ds = d.toISOString().slice(0,10);
                let sum = exps.filter(x => x.t.slice(0,10) === ds).reduce((s,x) => s + x.a, 0);
                last7.push({d:ds.slice(5), sum});
            }
            
            let max = Math.max(...last7.map(x => x.sum), 1);
            document.getElementById('chart').innerHTML = last7.map(x =>
                `<div class="bar"><div class="bar-fill" style="width:${x.sum/max*100}%">${x.sum>0?'$'+x.sum.toFixed(0):''}</div></div><div style="font-size:11px;color:var(--text-muted)">${x.d}</div>`
            ).join('');
            
            let total7 = last7.reduce((s,x) => s + x.sum, 0);
            document.getElementById('total').textContent = '$' + total7.toFixed(2);
            document.getElementById('avg').textContent = '$' + (total7/7).toFixed(2);
        }
        
        document.querySelectorAll('.tab').forEach(t => {
            t.onclick = () => {
                document.querySelectorAll('.tab').forEach(x => x.classList.remove('on'));
                document.querySelectorAll('.panel').forEach(x => x.classList.remove('on'));
                t.classList.add('on');
                document.getElementById(t.dataset.p).classList.add('on');
            };
        });
        
        load();
        if ('serviceWorker' in navigator) navigator.serviceWorker.register('data:application/javascript,self.addEventListener("install",e=>self.skipWaiting());');
    </script>
</body>
</html>
