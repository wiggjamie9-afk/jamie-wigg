<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation Studio — Daily lessons for visual creators</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1a0033 0%, #2d0052 100%);
            color: #f1f5f9;
            min-height: 100vh;
            padding: 16px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            padding: 24px 0 16px;
            border-bottom: 1px solid rgba(147, 51, 234, 0.3);
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(90deg, #e9d5ff, #d8b4fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            font-size: 14px;
            color: #d8b4fe;
        }

        #onboard {
            animation: fadeIn 0.4s ease-out;
        }

        .onboard-content {
            text-align: center;
        }

        .onboard-content h2 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 16px;
            color: #e9d5ff;
        }

        .onboard-content p {
            font-size: 15px;
            line-height: 1.6;
            color: #d8b4fe;
            margin-bottom: 24px;
        }

        .track-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 12px;
        }

        .track-btn {
            padding: 16px 12px;
            border: 2px solid rgba(147, 51, 234, 0.6);
            background: rgba(26, 0, 51, 0.5);
            color: #d8b4fe;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .track-btn:hover {
            border-color: #d8b4fe;
            background: rgba(88, 28, 135, 0.3);
            color: #f3e8ff;
        }

        #styleCard {
            display: none;
            margin-top: 20px;
            padding: 20px;
            background: rgba(88, 28, 135, 0.2);
            border: 1px solid rgba(216, 180, 254, 0.3);
            border-radius: 12px;
            animation: slideDown 0.4s ease-out;
        }

        .style-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 16px;
        }

        .style-opt {
            padding: 12px;
            border: 2px solid rgba(147, 51, 234, 0.6);
            background: rgba(26, 0, 51, 0.5);
            color: #d8b4fe;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .style-opt:hover {
            border-color: #d8b4fe;
            background: rgba(88, 28, 135, 0.3);
            color: #f3e8ff;
        }

        #lessonView {
            display: none;
            animation: fadeIn 0.4s ease-out;
        }

        .lesson-content {
            background: rgba(88, 28, 135, 0.15);
            border: 1px solid rgba(216, 180, 254, 0.2);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
        }

        .lesson-title {
            font-size: 22px;
            font-weight: 700;
            color: #e9d5ff;
            margin-bottom: 16px;
            line-height: 1.3;
        }

        .lesson-body {
            font-size: 15px;
            line-height: 1.7;
            color: #d8b4fe;
            margin-bottom: 20px;
        }

        .lesson-body p {
            margin-bottom: 12px;
        }

        .lesson-affirmation {
            padding: 16px;
            background: rgba(216, 180, 254, 0.1);
            border-left: 4px solid #d8b4fe;
            border-radius: 4px;
            font-style: italic;
            color: #d8b4fe;
            font-size: 14px;
            margin-bottom: 16px;
        }

        .lesson-strength {
            display: inline-block;
            padding: 8px 12px;
            background: rgba(216, 180, 254, 0.2);
            color: #d8b4fe;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }

        .controls {
            display: flex;
            gap: 12px;
            margin-top: 24px;
            flex-wrap: wrap;
        }

        .btn {
            flex: 1;
            min-width: 100px;
            padding: 12px 16px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: linear-gradient(90deg, #d8b4fe, #c084fc);
            color: #1a0033;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(216, 180, 254, 0.3);
        }

        .btn-secondary {
            background: rgba(147, 51, 234, 0.4);
            color: #d8b4fe;
            border: 1px solid rgba(216, 180, 254, 0.3);
        }

        .btn-secondary:hover {
            border-color: #d8b4fe;
            color: #f3e8ff;
        }

        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            font-size: 13px;
            color: #c4b5fd;
            flex-wrap: wrap;
            gap: 12px;
        }

        .streak {
            font-weight: 600;
            color: #d8b4fe;
        }

        #celebrate {
            display: none;
            text-align: center;
            padding: 40px 20px;
            animation: scaleIn 0.5s ease-out;
        }

        .celebrate-emoji {
            font-size: 60px;
            margin-bottom: 16px;
        }

        .celebrate-text {
            font-size: 24px;
            font-weight: 700;
            color: #d8b4fe;
            margin-bottom: 24px;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .next-btn {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Animation Studio</h1>
            <p>One lesson a day for visual creators</p>
        </div>

        <div id="onboard">
            <div class="onboard-content">
                <h2>What's your creative focus?</h2>
                <p>Where do you want to grow as a visual creator?</p>
                <div class="track-buttons">
                    <button class="track-btn" onclick="selectTrack('vision')">👁️ Vision</button>
                    <button class="track-btn" onclick="selectTrack('emotion')">💫 Emotion</button>
                    <button class="track-btn" onclick="selectTrack('craft')">✏️ Craft</button>
                    <button class="track-btn" onclick="selectTrack('blocks')">🚀 Blocks</button>
                </div>
            </div>
            <div id="styleCard">
                <p style="margin-bottom: 12px; font-size: 14px; color: #d8b4fe;">How do you like to create?</p>
                <div class="style-options">
                    <button class="style-opt" onclick="selectStyle('visual')">Visual thinking</button>
                    <button class="style-opt" onclick="selectStyle('narrative')">Story-driven</button>
                    <button class="style-opt" onclick="selectStyle('technical')">Technical craft</button>
                    <button class="style-opt" onclick="selectStyle('expressive')">Expressive</button>
                </div>
            </div>
        </div>

        <div id="lessonView">
            <div class="lesson-content">
                <div class="lesson-title" id="lessonTitle"></div>
                <div class="lesson-body" id="lessonBody"></div>
                <div class="lesson-affirmation" id="lessonAffirmation"></div>
                <div class="lesson-strength" id="lessonStrength"></div>
            </div>

            <div class="controls">
                <button class="btn btn-primary" onclick="speak()">🔊 Read aloud</button>
                <button class="btn btn-secondary" onclick="nextLesson()">Next →</button>
                <button class="btn btn-secondary" onclick="markDone()">✓ Done</button>
            </div>

            <div class="footer">
                <div id="progress"></div>
                <div><span class="streak" id="streak"></span></div>
            </div>
        </div>

        <div id="celebrate">
            <div class="celebrate-emoji">🎨</div>
            <div class="celebrate-text">Creation in progress!</div>
            <p style="color: #d8b4fe; margin-bottom: 24px;">Your vision is growing. Come back tomorrow.</p>
            <button class="btn btn-primary" onclick="resetView()">Back to start</button>
        </div>
    </div>

    <script>
        const lessons = [
            {t:"You see the world differently—that's your superpower",b:["Most people see surfaces. You see depth, movement, emotion. That's not a bug—it's your gift.","The artists who change the world are the ones who see what others miss: the way light moves through a moment, how a gesture tells a story, the rhythm hidden in stillness.","Today's tiny step: sit for 5 minutes and watch one thing move. Don't draw it. Just see it."],a:"Your unique way of seeing isn't weird. It's art waiting to be made.",s:"Unique vision"},
            {t:"Your style is already inside you—you don't need to find it",b:["The trap is copying until you find your style. The truth: your style emerges when you stop hiding.","You have a way of seeing, moving, creating that's entirely yours. It shows up in the small choices: the colors you're drawn to, the rhythms you feel, the subjects that haunt you.","Today's tiny step: make something small in 10 minutes without thinking about style. That's closer to it than you know."],a:"Your voice is in every frame. Trust it.",s:"Authentic style"},
            {t:"Animation is about the pause, not the motion",b:["New animators move everything fast. Great animators understand: the power is in what doesn't move, what waits, what breathes.","Timing is everything. A character's glance that lasts one frame too long changes the whole moment. A pause before a jump makes the jump matter.","Today's tiny step: watch your favorite animated scene and notice what's still. That stillness is doing the work."],a:"The space between frames is where emotion lives.",s:"Timing mastery"},
            {t:"Color is language—learn to speak it",b:["Every color you choose tells a story. Red means urgency, passion, danger. Blue means calm, truth, sadness. Purple means magic, mystery, power.","The animators who move people are the ones who understand color psychology and use it to tell stories without words.","Today's tiny step: pick a scene from your work. What story do your colors tell? Are they saying what you want?"],a:"Color is your emotional vocabulary.",s:"Color language"},
            {t:"Movement has rhythm and your eye can hear it",b:["Just like music has tempo, animation has rhythm. Fast cuts feel urgent. Slow dissolves feel peaceful. Bouncing movement feels playful.","Great animators compose motion like musicians compose songs: building tension, resolving it, creating patterns that satisfy the eye.","Today's tiny step: find an animated film you love and feel the rhythm. Can you hear the pacing?"],a:"Animation is visual music.",s:"Movement rhythm"},
            {t:"Your creative block is a message, not a wall",b:["When you can't create, you're not broken. Your unconscious is saying something isn't aligned: maybe the idea isn't true for you, maybe you need rest, maybe you're trying to please someone else.","The block dissolves when you listen to it instead of pushing through it.","Today's tiny step: sit with the block. Ask it: what are you protecting me from? What's actually true?"],a:"Creative blocks protect you until you're ready.",s:"Block wisdom"},
            {t:"Emotion comes before technique",b:["You can have perfect animation with no emotion and it feels dead. You can have imperfect animation dripping with emotion and it moves people.","The technical skills are the vessel. Emotion is what fills it.","Today's tiny step: what story are you desperate to tell? That's where your best work lives. Make that your next project."],a:"Mastery is learning the rules so you can break them with purpose.",s:"Emotion first"},
            {t:"Watch everything—it's all research",b:["The best animators steal from life constantly. How does a leaf fall? How does fear move through someone's body? How does a child's excitement look different from an adult's?","Your real research isn't other animation. It's the world. Watch people. Watch animals. Watch water. Watch light.","Today's tiny step: study one thing in nature for 10 minutes. How does it move? How would you animate it?"],a:"Reality is your greatest teacher.",s:"Life observation"},
            {t:"Your weird ideas are your best ideas",b:["Safe, conventional animation looks like everything else. The work that lasts comes from the ideas that scare you, the ones that don't fit the mold.","When you have an idea that feels too weird, too specific, too risky: that's the one.","Today's tiny step: write down the weirdest, most specific idea you have. Don't judge it. That's your next project."],a:"The edge of weird is where art lives.",s:"Brave creativity"},
            {t:"You're not competing with other artists—you're building with them",b:["The creativity pie isn't fixed. When another animator succeeds, the whole ecosystem grows. When you share your work, you inspire others to share theirs.","The artists who last are the ones who build community instead of guarding turf.","Today's tiny step: follow an animator whose work moves you. Reach out and say so. Community is where magic happens."],a:"Collaboration amplifies everyone's voice.",s:"Shared vision"},
            {t:"Your imperfect work is more honest than your perfect work",b:["The moment you start animating to impress, you lose your voice. The moment you animate to understand, to express, to communicate: that's when it hits.","Imperfection is integrity. It says: this is what I actually feel, not what I think you want to see.","Today's tiny step: make something small and rough. Don't polish it. Let it be imperfect. That's where the power is."],a:"Your first instinct knows more than your doubts.",s:"Raw authenticity"},
            {t:"The story is always about transformation",b:["Every great animated story is about someone (or something) who starts one way and ends another. They learn, they grow, they become.","Your animation is only as strong as the change it shows. Show the before. Show the struggle. Show the after.","Today's tiny step: what does your character learn? What are they at the start? What are they at the end? Build toward that transformation."],a:"Every frame should move toward change.",s:"Transformation arc"},
            {t:"Silence is more powerful than sound",b:["The best animations often work without dialogue or music. The movement itself tells the story. The emotion is in the frame.","When you rely on sound, you're outsourcing your storytelling. When you make the movement do the work, you're an artist.","Today's tiny step: take a scene with sound and imagine it silent. Does the emotion still land? If not, fix the animation."],a:"The image should speak louder than the audio.",s:"Visual storytelling"},
            {t:"Your body knows things your mind hasn't learned yet",b:["The best animators move their own bodies to feel what they're animating. How does fear move through the spine? How does joy bounce in the step?","Your body is your research lab. Animate from lived experience, not theory.","Today's tiny step: feel an emotion fully in your own body. Now animate that. That authenticity will show."],a:"Your body is your greatest animation reference.",s:"Embodied knowledge"},
            {t:"Constraint is a gift—it makes you creative",b:["Unlimited resources paradoxically make worse art. Constraints force you to be clever: fewer colors, fewer frames, fewer characters.","The best animation often comes from working within limits: 2-frame animation, one color, 15-second stories.","Today's tiny step: set a constraint for your next piece. Maybe it's one color, or 10 seconds, or 12 frames. Create inside that limit."],a:"Limitations unlock your imagination.",s:"Creative constraint"},
            {t:"Every frame you make is a conversation with your future self",b:["When you animate, you're not just making images. You're leaving messages for the person you'll be when you're done. You're building something that will outlast you.","That's why it matters: this frame might move someone's heart years from now.","Today's tiny step: animate something you know only you can make. Something that's true for you. That's the one that will matter."],a:"Your animation is your legacy in motion.",s:"Lasting impact"},
            {t:"Rest is part of the creative process",b:["The animators who burn out are the ones who think the only way forward is constant work. The ones who last take rest seriously.","Your best ideas come after you rest. Your hands need breaks. Your eyes need breaks. Your mind needs space to process.","Today's tiny step: don't animate today. Walk. Sleep. Let your mind wander. Tomorrow you'll see your work with fresh eyes."],a:"Rest isn't laziness. It's refueling.",s:"Sustainable creation"},
            {t:"You don't need permission—you're the creator",b:["The animation industry doesn't decide if your work is valid. You do. If it matters to you, it matters.","The most revolutionary animations came from people who didn't wait for permission. They made what was in them to make.","Today's tiny step: give yourself permission to make something that only you can make. This is your work. This is your world."],a:"You are the authority of your own vision.",s:"Creator power"},
            {t:"Beauty isn't the goal—truth is",b:["The most beautiful animation in the world feels empty if it's not true. The roughest animation feels transcendent if it's honest.","Chase truth, not beauty. Chase emotion, not perfection. Chase your vision, not the trend.","Today's tiny step: what truth are you trying to tell? What do you actually believe? Make that the heart of your next piece."],a:"The most beautiful thing is a heart fully expressed.",s:"Honest creation"},
            {t:"Your animation practice is your life practice",b:["How you animate is how you live: with patience or rushing, with honesty or hiding, with joy or obligation.","The animation that changes you is the one that teaches you how to be more human. That teaches you to see better. That teaches you to feel deeper.","Today's tiny step: notice how you work. Are you present? Are you rushing? What would it feel like to animate with full presence?"],a:"The craft is the teacher. The art is the transformation.",s:"Life integration"}
        ];

        const tracks = { vision: 0, emotion: 5, craft: 10, blocks: 15 };

        let state = JSON.parse(localStorage.getItem('animState')) || {
            track: null,
            style: null,
            done: [],
            lastDay: null,
            streak: 0,
            seen: {}
        };

        function selectTrack(t) {
            state.track = t;
            state.style = null;
            state.seen = {};
            document.getElementById('styleCard').style.display = 'block';
        }

        function selectStyle(s) {
            state.style = s;
            state.lastDay = new Date().toDateString();
            saveState();
            showLesson();
        }

        function saveState() {
            localStorage.setItem('animState', JSON.stringify(state));
        }

        function getTrackIndex(offset) {
            const trackStart = tracks[state.track];
            let idx = trackStart + offset;
            while (state.done.includes(idx)) idx++;
            return idx < trackStart + 5 ? idx : trackStart + (Math.floor(Math.random() * 5));
        }

        function showLesson() {
            if (!state.track || !state.style) return;
            const offset = state.seen[state.track] ? (state.seen[state.track] + 1) % 5 : 0;
            const idx = getTrackIndex(offset);
            state.seen[state.track] = offset;
            const l = lessons[idx];
            document.getElementById('lessonTitle').textContent = l.t;
            document.getElementById('lessonBody').innerHTML = l.b.map(p => `<p>${p}</p>`).join('');
            document.getElementById('lessonAffirmation').textContent = l.a;
            document.getElementById('lessonStrength').textContent = l.s;
            updateUI();
        }

        function updateUI() {
            const today = new Date().toDateString();
            if (state.lastDay !== today) state.streak = 0;
            if (state.done.length > 0) {
                const lastDone = state.done[state.done.length - 1];
                if (new Date().toDateString() === state.lastDay) {
                    document.getElementById('onboard').style.display = 'none';
                    document.getElementById('celebrate').style.display = 'block';
                    document.getElementById('lessonView').style.display = 'none';
                } else {
                    document.getElementById('onboard').style.display = 'none';
                    document.getElementById('lessonView').style.display = 'block';
                    document.getElementById('celebrate').style.display = 'none';
                }
            } else {
                document.getElementById('onboard').style.display = 'block';
                document.getElementById('lessonView').style.display = 'none';
                document.getElementById('celebrate').style.display = 'none';
            }
            document.getElementById('progress').textContent = `${state.done.length} lesson${state.done.length !== 1 ? 's' : ''} done`;
            document.getElementById('streak').textContent = `🎬 ${state.streak} day${state.streak !== 1 ? 's' : ''} here`;
        }

        function speak() {
            const title = document.getElementById('lessonTitle').textContent;
            const body = document.getElementById('lessonBody').innerText;
            const aff = document.getElementById('lessonAffirmation').textContent;
            speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(`${title}. ${body}. ${aff}`);
            u.rate = 0.93;
            speechSynthesis.speak(u);
        }

        function nextLesson() {
            showLesson();
        }

        function markDone() {
            const idx = lessons.findIndex(l => l.t === document.getElementById('lessonTitle').textContent);
            if (!state.done.includes(idx)) {
                state.done.push(idx);
                if (state.lastDay === new Date().toDateString()) state.streak++;
                state.lastDay = new Date().toDateString();
                saveState();
            }
            document.getElementById('onboard').style.display = 'none';
            document.getElementById('lessonView').style.display = 'none';
            document.getElementById('celebrate').style.display = 'block';
        }

        function resetView() {
            document.getElementById('celebrate').style.display = 'none';
            document.getElementById('onboard').style.display = 'block';
            state.track = null;
            state.style = null;
            saveState();
        }

        updateUI();
        if (state.track && state.style) showLesson();
    </script>
</body>
</html>
