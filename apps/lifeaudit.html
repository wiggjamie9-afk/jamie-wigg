<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#08050d">
    <title>LifeAudit</title>
    <style>
        :root { --canvas:#08050d; --green:#00e887; --red:#ff1f5a; --cyan:#00d8ff; --purple:#7c3aed; --text:#fff; --text-muted:#aaa; }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:var(--canvas); color:var(--text); min-height:100vh; padding-bottom:80px; }
        .header { padding:20px; border-bottom:1px solid rgba(0,232,135,0.2); display:flex; justify-content:space-between; }
        h1 { font-size:24px; font-weight:700; }
        .badge { background:var(--green); color:var(--canvas); padding:4px 12px; border-radius:20px; font-size:11px; }
        .content { padding:20px; }
        .area-card { background:rgba(0,232,135,0.05); border:1px solid rgba(0,232,135,0.2); border-radius:8px; padding:15px; margin:12px 0; }
        .area-label { font-weight:600; margin-bottom:10px; display:flex; justify-content:space-between; }
        .area-score { color:var(--green); font-weight:700; }
        .slider { width:100%; }
        .radar { background:rgba(0,232,135,0.05); border:1px solid rgba(0,232,135,0.2); border-radius:8px; padding:20px; margin:20px 0; text-align:center; }
        .overall-score { font-size:48px; color:var(--green); font-weight:700; margin:15px 0; }
        .radar-text { font-size:12px; color:var(--text-muted); line-height:1.6; }
        button { background:var(--green); color:var(--canvas); border:0; padding:10px 16px; border-radius:6px; cursor:pointer; font-weight:600; width:100%; margin-top:10px; }
        .panel { display:none; }
        .panel.on { display:block; }
        .tabs { position:fixed; bottom:0; left:0; right:0; background:var(--canvas); border-top:1px solid rgba(0,232,135,0.2); display:flex; justify-content:space-around; height:70px; z-index:100; }
        .tab { flex:1; background:0; border:0; color:var(--text-muted); cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:12px; }
        .tab.on { color:var(--green); }
        .premium { background:rgba(124,58,237,0.1); border-left:3px solid var(--purple); padding:12px; margin-top:20px; border-radius:4px; font-size:13px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🎯 LifeAudit</h1>
        <div class="badge">FREE</div>
    </div>
    <div class="content">
        <div id="audit" class="panel on">
            <div id="areas"></div>
            <button onclick="calculate()">Calculate</button>
            <div class="premium">💎 Premium: Detailed quarterly reports & recommendations</div>
        </div>
        
        <div id="results" class="panel">
            <div class="radar">
                <div style="font-weight:600;margin-bottom:15px">Overall Life Score</div>
                <div class="overall-score" id="overall">0</div>
                <div class="radar-text" id="radar-text"></div>
            </div>
            <button onclick="document.querySelectorAll('.tab')[0].click()" style="background:var(--cyan);color:var(--canvas)">← Back</button>
        </div>
    </div>
    <div class="tabs">
        <button class="tab on" data-p="audit">📋 Audit</button>
    </div>
    <script>
        const areas = [
            {name:'Health',emoji:'❤️'},
            {name:'Finances',emoji:'💰'},
            {name:'Relationships',emoji:'👫'},
            {name:'Career',emoji:'💼'},
            {name:'Personal Growth',emoji:'📚'},
            {name:'Recreation',emoji:'🎮'},
            {name:'Spirituality',emoji:'🙏'},
            {name:'Home',emoji:'🏠'}
        ];
        
        let scores = {};
        
        function load() {
            let d = localStorage.getItem('lifeaudit');
            if (d) scores = JSON.parse(d);
            else areas.forEach(a => scores[a.name] = 5);
            draw();
        }
        
        function save() {
            localStorage.setItem('lifeaudit', JSON.stringify(scores));
        }
        
        function draw() {
            document.getElementById('areas').innerHTML = areas.map(a => `
                <div class="area-card">
                    <div class="area-label">
                        <span>${a.emoji} ${a.name}</span>
                        <span class="area-score" id="score-${a.name}">${scores[a.name]||5}/10</span>
                    </div>
                    <input type="range" class="slider" min="1" max="10" value="${scores[a.name]||5}" 
                        oninput="scores['${a.name}']=parseInt(this.value);document.getElementById('score-${a.name}').textContent=this.value+'/10'">
                </div>
            `).join('');
        }
        
        function calculate() {
            let avg = Object.values(scores).reduce((a,b) => a+b, 0) / areas.length;
            let msg = avg >= 8 ? 'Excellent life balance!' : avg >= 6 ? 'Good overall, room to improve' : 'Focus on priority areas';
            
            document.getElementById('overall').textContent = avg.toFixed(1);
            document.getElementById('radar-text').textContent = msg;
            
            save();
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('on'));
            document.getElementById('results').classList.add('on');
        }
        
        document.querySelectorAll('.tab').forEach(t => {
            t.onclick = () => {
                document.querySelectorAll('.tab').forEach(x => x.classList.remove('on'));
                document.querySelectorAll('.panel').forEach(x => x.classList.remove('on'));
                t.classList.add('on');
                document.getElementById(t.dataset.p).classList.add('on');
            };
        });
        
        load();
        if ('serviceWorker' in navigator) navigator.serviceWorker.register('data:application/javascript,self.addEventListener("install",e=>self.skipWaiting());');
    </script>
</body>
</html>
