<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Lab — Daily lessons for musicians</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #2a0845 0%, #4d1157 100%);
            color: #f1f5f9;
            min-height: 100vh;
            padding: 16px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            padding: 24px 0 16px;
            border-bottom: 1px solid rgba(236, 72, 153, 0.3);
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(90deg, #f472b6, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            font-size: 14px;
            color: #f472b6;
        }

        #onboard {
            animation: fadeIn 0.4s ease-out;
        }

        .onboard-content {
            text-align: center;
        }

        .onboard-content h2 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 16px;
            color: #f9a8d4;
        }

        .onboard-content p {
            font-size: 15px;
            line-height: 1.6;
            color: #f472b6;
            margin-bottom: 24px;
        }

        .track-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 12px;
        }

        .track-btn {
            padding: 16px 12px;
            border: 2px solid rgba(236, 72, 153, 0.6);
            background: rgba(42, 8, 69, 0.5);
            color: #f472b6;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .track-btn:hover {
            border-color: #f9a8d4;
            background: rgba(96, 20, 140, 0.3);
            color: #f9a8d4;
        }

        #styleCard {
            display: none;
            margin-top: 20px;
            padding: 20px;
            background: rgba(96, 20, 140, 0.2);
            border: 1px solid rgba(244, 114, 182, 0.3);
            border-radius: 12px;
            animation: slideDown 0.4s ease-out;
        }

        .style-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 16px;
        }

        .style-opt {
            padding: 12px;
            border: 2px solid rgba(236, 72, 153, 0.6);
            background: rgba(42, 8, 69, 0.5);
            color: #f472b6;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .style-opt:hover {
            border-color: #f9a8d4;
            background: rgba(96, 20, 140, 0.3);
            color: #f9a8d4;
        }

        #lessonView {
            display: none;
            animation: fadeIn 0.4s ease-out;
        }

        .lesson-content {
            background: rgba(96, 20, 140, 0.15);
            border: 1px solid rgba(244, 114, 182, 0.2);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
        }

        .lesson-title {
            font-size: 22px;
            font-weight: 700;
            color: #f9a8d4;
            margin-bottom: 16px;
            line-height: 1.3;
        }

        .lesson-body {
            font-size: 15px;
            line-height: 1.7;
            color: #f472b6;
            margin-bottom: 20px;
        }

        .lesson-body p {
            margin-bottom: 12px;
        }

        .lesson-affirmation {
            padding: 16px;
            background: rgba(244, 114, 182, 0.1);
            border-left: 4px solid #f472b6;
            border-radius: 4px;
            font-style: italic;
            color: #f472b6;
            font-size: 14px;
            margin-bottom: 16px;
        }

        .lesson-strength {
            display: inline-block;
            padding: 8px 12px;
            background: rgba(244, 114, 182, 0.2);
            color: #f472b6;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }

        .controls {
            display: flex;
            gap: 12px;
            margin-top: 24px;
            flex-wrap: wrap;
        }

        .btn {
            flex: 1;
            min-width: 100px;
            padding: 12px 16px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: linear-gradient(90deg, #f472b6, #ec4899);
            color: #2a0845;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(244, 114, 182, 0.3);
        }

        .btn-secondary {
            background: rgba(236, 72, 153, 0.4);
            color: #f472b6;
            border: 1px solid rgba(244, 114, 182, 0.3);
        }

        .btn-secondary:hover {
            border-color: #f9a8d4;
            color: #f9a8d4;
        }

        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            font-size: 13px;
            color: #f472b6;
            flex-wrap: wrap;
            gap: 12px;
        }

        .streak {
            font-weight: 600;
            color: #f472b6;
        }

        #celebrate {
            display: none;
            text-align: center;
            padding: 40px 20px;
            animation: scaleIn 0.5s ease-out;
        }

        .celebrate-emoji {
            font-size: 60px;
            margin-bottom: 16px;
        }

        .celebrate-text {
            font-size: 24px;
            font-weight: 700;
            color: #f472b6;
            margin-bottom: 24px;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .next-btn {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Music Lab</h1>
            <p>One lesson a day for your sound</p>
        </div>

        <div id="onboard">
            <div class="onboard-content">
                <h2>What's your musical passion?</h2>
                <p>Where do you want your music to go?</p>
                <div class="track-buttons">
                    <button class="track-btn" onclick="selectTrack('emotion')">💖 Emotion</button>
                    <button class="track-btn" onclick="selectTrack('sound')">🎵 Sound</button>
                    <button class="track-btn" onclick="selectTrack('compose')">✍️ Compose</button>
                    <button class="track-btn" onclick="selectTrack('impact')">🌍 Impact</button>
                </div>
            </div>
            <div id="styleCard">
                <p style="margin-bottom: 12px; font-size: 14px; color: #f472b6;">How do you create?</p>
                <div class="style-options">
                    <button class="style-opt" onclick="selectStyle('theory')">Theory & craft</button>
                    <button class="style-opt" onclick="selectStyle('intuitive')">Intuitive</button>
                    <button class="style-opt" onclick="selectStyle('science')">Neuroscience</button>
                    <button class="style-opt" onclick="selectStyle('storytelling')">Story-driven</button>
                </div>
            </div>
        </div>

        <div id="lessonView">
            <div class="lesson-content">
                <div class="lesson-title" id="lessonTitle"></div>
                <div class="lesson-body" id="lessonBody"></div>
                <div class="lesson-affirmation" id="lessonAffirmation"></div>
                <div class="lesson-strength" id="lessonStrength"></div>
            </div>

            <div class="controls">
                <button class="btn btn-primary" onclick="speak()">🔊 Read aloud</button>
                <button class="btn btn-secondary" onclick="nextLesson()">Next →</button>
                <button class="btn btn-secondary" onclick="markDone()">✓ Done</button>
            </div>

            <div class="footer">
                <div id="progress"></div>
                <div><span class="streak" id="streak"></span></div>
            </div>
        </div>

        <div id="celebrate">
            <div class="celebrate-emoji">🎶</div>
            <div class="celebrate-text">Your sound is evolving</div>
            <p style="color: #f472b6; margin-bottom: 24px;">Keep listening. Come back tomorrow.</p>
            <button class="btn btn-primary" onclick="resetView()">Back to start</button>
        </div>
    </div>

    <script>
        const lessons = [
            {t:"Music isn't about notes—it's about emotion",b:["The notes are just the vehicle. The real music is the emotion traveling through them.","Two musicians play the same melody. One is mechanical. One is transcendent. The difference isn't the notes. It's the feeling behind them.","Today's tiny step: listen to a piece of music you love. Don't think about the notes. Just feel. What emotion is it creating?"],a:"Master emotion first, technique second.",s:"Emotional resonance"},
            {t:"Your unique sound is your signature",b:["Every great musician has a sound that's unmistakable. You can hear 3 seconds of their music and know exactly who it is.","That signature comes from their choices: the frequencies they're drawn to, the rhythms that move them, the instruments they can't resist.","Today's tiny step: listen to your favorite musicians. What's their sonic signature? What frequencies do you hear in all their work?"],a:"Your sound is your fingerprint.",s:"Sonic identity"},
            {t:"Silence is as important as sound",b:["The space between notes is music. The pause before the drop is what makes the drop matter. Absence creates anticipation.","The most powerful moments in music are often the quiet ones.","Today's tiny step: compose or arrange something with intentional silence. Make the quiet part of the song."],a:"Space is where emotion lives.",s:"Silence mastery"},
            {t:"The human ear is a poet, not a scientist",b:["Our ears don't hear frequencies. They hear meaning. They hear intention. They hear story.","The most 'wrong' chord progression can be perfect if it's serving emotion. The most 'correct' progression can be dead if there's no feeling.","Today's tiny step: find a chord progression that breaks the rules. Why does it work? What emotion is it creating?"],a:"The rules are starting points, not ceilings.",s:"Breaking rules"},
            {t:"Your limitations breed creativity",b:["The bedroom producer with one keyboard often makes more interesting music than the studio with 10,000 plug-ins.","Constraint forces you to be intentional. You can't hide behind fancy gear. You have to make every note count.","Today's tiny step: write something using only 3 instruments. See what you create under that constraint."],a:"Limitation is liberation.",s:"Creative constraint"},
            {t:"Music heals because it's honest",b:["The most powerful music is the stuff where the artist couldn't hide, where they were too vulnerable to be anything but real.","People don't connect with perfect music. They connect with honest music.","Today's tiny step: what's the most honest thing you could say with music right now? Make that."],a:"Authenticity is magnetic.",s:"Honest creation"},
            {t:"The 12 notes are infinite",b:["Every possible combination of the 12 notes has not been discovered. The music you're supposed to create hasn't been made yet.","You're not reinventing the wheel. You're discovering something that's never existed before.","Today's tiny step: take a familiar melody and reharmonize it. Explore notes you've never tried under that melody."],a:"The unknown is inside the known.",s:"Hidden possibilities"},
            {t:"Rhythm is the heartbeat of emotion",b:["Change the tempo or rhythm and you change everything about the emotional impact. A song at 120 BPM feels different at 100 BPM.","The rhythm you're drawn to is usually connected to your heartbeat, your breath, your natural cadence.","Today's tiny step: take a song and play it at a completely different tempo. Notice how the emotion shifts."],a:"Rhythm is language without words.",s:"Rhythmic wisdom"},
            {t:"Your influences are your DNA",b:["Every artist is a remix of their influences. You can hear the echoes of the artists who shaped them.","The trap is trying to erase your influences. The path is integrating them so fully they become invisible—they're just part of who you are.","Today's tiny step: identify 5 artists who influence you. What do they have in common? That's your sonic DNA."],a:"Influence becomes mastery when fully digested.",s:"Integrated influence"},
            {t:"Composition is problem-solving",b:["A great song solves a problem: how to express a feeling that has no words, how to create tension and resolve it, how to say something that's never been said.","Every compositional choice is an answer to a question: what does this emotion need next?","Today's tiny step: pick an emotion. Write 5 bars that express it. Then ask: what does this emotion need next? Compose from the answer."],a:"Composition is dialogue with feeling.",s:"Compositional thinking"},
            {t:"Dynamics are what make you feel alive",b:["A song with no dynamic range is exhausting to listen to. Dynamic range is the ebb and flow, the loud and soft, the tension and release.","The best songs have journeys: they go from intimate to explosive, from quiet to overwhelming, from tension to peace.","Today's tiny step: create a dynamic journey: start very quiet, build to overwhelming intensity, resolve back to silence."],a:"Dynamics are emotional ups and downs.",s:"Dynamic mastery"},
            {t:"Frequency is color",b:["Just like visual artists think in color, musicians think in frequency. The bass frequencies are red and earth. The high frequencies are light and air.","Learning frequency balancing is like learning color theory. It transforms everything.","Today's tiny step: close your eyes and listen to a song. What colors do you see? What frequencies create those colors?"],a:"Frequency is your sonic palette.",s:"Harmonic color"},
            {t:"The progression is a conversation",b:["A chord progression is a conversation between chords. Each chord leads to the next, creating expectation and resolution.","The most interesting progressions have surprises: the chord you didn't expect, the resolution you didn't see coming.","Today's tiny step: take a 4-bar progression and replace one chord with something completely unexpected. Does it work? Why or why not?"],a:"Harmony is a dialogue.",s:"Progression mastery"},
            {t:"Your sound is already inside you",b:["You don't need to find your sound. It's already there. You just need to get out of the way and let it come out.","Stop trying to sound like someone else. Stop trying to be clever. Just express what's true for you.","Today's tiny step: play or compose something without thinking. Don't evaluate it. Just create. That's closer to your real sound than anything you've thought through."],a:"Your sound is waiting to be released, not invented.",s:"Authentic voice"},
            {t:"Music connects across all languages",b:["A person who speaks no English can cry to a song in English. Music bypasses language and goes straight to feeling.","This is the power and responsibility: your music can move people in ways words can't. It can heal, inspire, and transform.","Today's tiny step: listen to music in a language you don't speak. What do you feel? That's the power of pure emotion."],a:"Music is the universal language.",s:"Transcendent power"},
            {t:"Imperfection is character",b:["The most interesting recordings have imperfections: the slightly flat note, the breath between phrases, the barely-heard footstep, the string squeak.","These imperfections are what make music human. They're what make it real.","Today's tiny step: instead of fixing every imperfection, try keeping one. Let it be part of your character."],a:"Imperfection proves you're human.",s:"Authentic imperfection"},
            {t:"Production serves emotion",b:["Production isn't decoration. Good production is invisible—it serves the emotion without calling attention to itself. Bad production is either too polished or too raw.","The right production choices amplify the feeling. The wrong ones bury it.","Today's tiny step: take a simple vocal line. Try two different production approaches. Which one serves the emotion better?"],a:"Production is the vessel. Emotion is the wine.",s:"Production mastery"},
            {t:"Listen more than you play",b:["The musicians who develop the most interesting ears are the ones who listen obsessively to the music they love.","Listening is research. Listening is inspiration. Listening is how you learn what's possible.","Today's tiny step: spend 30 minutes listening to a song you love. Listen for the details you've never noticed. What's in there?"],a:"The best composers are the best listeners.",s:"Listening depth"},
            {t:"Music is a conversation with yourself",b:["When you create, you're not creating for others. You're creating to understand yourself. You're having a conversation with your own soul.","Paradoxically, the most personal music is the most universal. When you're honest, everyone resonates.","Today's tiny step: create something without thinking about anyone else hearing it. What do you want to say to yourself?"],a:"Your deepest truth resonates with everyone.",s:"Self-dialogue"},
            {t:"Your music matters because you made it",b:["You don't need millions of listeners. You don't need a record deal. Your music matters because it comes from you.","Every song you finish is a victory. Every piece of music you put into the world is a gift.","Today's tiny step: finish something. It doesn't need to be perfect. It just needs to be done. That's enough."],a:"Your music is your legacy.",s:"Creative completion"}
        ];

        const tracks = { emotion: 0, sound: 5, compose: 10, impact: 15 };

        let state = JSON.parse(localStorage.getItem('musicState')) || {
            track: null,
            style: null,
            done: [],
            lastDay: null,
            streak: 0,
            seen: {}
        };

        function selectTrack(t) {
            state.track = t;
            state.style = null;
            state.seen = {};
            document.getElementById('styleCard').style.display = 'block';
        }

        function selectStyle(s) {
            state.style = s;
            state.lastDay = new Date().toDateString();
            saveState();
            showLesson();
        }

        function saveState() {
            localStorage.setItem('musicState', JSON.stringify(state));
        }

        function getTrackIndex(offset) {
            const trackStart = tracks[state.track];
            let idx = trackStart + offset;
            while (state.done.includes(idx)) idx++;
            return idx < trackStart + 5 ? idx : trackStart + (Math.floor(Math.random() * 5));
        }

        function showLesson() {
            if (!state.track || !state.style) return;
            const offset = state.seen[state.track] ? (state.seen[state.track] + 1) % 5 : 0;
            const idx = getTrackIndex(offset);
            state.seen[state.track] = offset;
            const l = lessons[idx];
            document.getElementById('lessonTitle').textContent = l.t;
            document.getElementById('lessonBody').innerHTML = l.b.map(p => `<p>${p}</p>`).join('');
            document.getElementById('lessonAffirmation').textContent = l.a;
            document.getElementById('lessonStrength').textContent = l.s;
            updateUI();
        }

        function updateUI() {
            const today = new Date().toDateString();
            if (state.lastDay !== today) state.streak = 0;
            if (state.done.length > 0) {
                const lastDone = state.done[state.done.length - 1];
                if (new Date().toDateString() === state.lastDay) {
                    document.getElementById('onboard').style.display = 'none';
                    document.getElementById('celebrate').style.display = 'block';
                    document.getElementById('lessonView').style.display = 'none';
                } else {
                    document.getElementById('onboard').style.display = 'none';
                    document.getElementById('lessonView').style.display = 'block';
                    document.getElementById('celebrate').style.display = 'none';
                }
            } else {
                document.getElementById('onboard').style.display = 'block';
                document.getElementById('lessonView').style.display = 'none';
                document.getElementById('celebrate').style.display = 'none';
            }
            document.getElementById('progress').textContent = `${state.done.length} lesson${state.done.length !== 1 ? 's' : ''} done`;
            document.getElementById('streak').textContent = `🎼 ${state.streak} day${state.streak !== 1 ? 's' : ''} here`;
        }

        function speak() {
            const title = document.getElementById('lessonTitle').textContent;
            const body = document.getElementById('lessonBody').innerText;
            const aff = document.getElementById('lessonAffirmation').textContent;
            speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(`${title}. ${body}. ${aff}`);
            u.rate = 0.91;
            speechSynthesis.speak(u);
        }

        function nextLesson() {
            showLesson();
        }

        function markDone() {
            const idx = lessons.findIndex(l => l.t === document.getElementById('lessonTitle').textContent);
            if (!state.done.includes(idx)) {
                state.done.push(idx);
                if (state.lastDay === new Date().toDateString()) state.streak++;
                state.lastDay = new Date().toDateString();
                saveState();
            }
            document.getElementById('onboard').style.display = 'none';
            document.getElementById('lessonView').style.display = 'none';
            document.getElementById('celebrate').style.display = 'block';
        }

        function resetView() {
            document.getElementById('celebrate').style.display = 'none';
            document.getElementById('onboard').style.display = 'block';
            state.track = null;
            state.style = null;
            saveState();
        }

        updateUI();
        if (state.track && state.style) showLesson();
    </script>
</body>
</html>
