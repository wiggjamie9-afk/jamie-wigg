<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#241a33"/>
      <stop offset="100%" stop-color="#08050d"/>
    </radialGradient>
    <linearGradient id="cart" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e887"/>
      <stop offset="100%" stop-color="#00d8ff"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="180" fill="rgba(0, 232, 135, 0.1)"/>

  <!-- Shopping Cart -->
  <g transform="translate(256, 256)">
    <!-- Cart body -->
    <path d="M -80 -30 L -70 50 Q -70 60 -60 60 L 80 60 Q 90 60 90 50 L 100 -30 Z" fill="none" stroke="url(#cart)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Cart handle -->
    <path d="M -60 -30 Q 0 -80 60 -30" fill="none" stroke="url(#cart)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Left wheel -->
    <circle cx="-50" cy="70" r="12" fill="none" stroke="rgba(0, 232, 135, 0.5)" stroke-width="6"/>
    <!-- Right wheel -->
    <circle cx="50" cy="70" r="12" fill="none" stroke="rgba(0, 216, 255, 0.5)" stroke-width="6"/>
    <!-- Items in cart (lines) -->
    <line x1="-60" y1="0" x2="70" y2="0" stroke="rgba(0, 232, 135, 0.4)" stroke-width="5" stroke-linecap="round"/>
    <line x1="-50" y1="20" x2="80" y2="20" stroke="rgba(0, 216, 255, 0.4)" stroke-width="5" stroke-linecap="round"/>
    <line x1="-65" y1="40" x2="75" y2="40" stroke="rgba(0, 232, 135, 0.3)" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Glow -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="rgba(0, 232, 135, 0.3)" stroke-width="3" opacity="0.6"/>
</svg>
