<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#9333EA">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Water Tracker — 2026</title>
    <style>
        :root {
            --primary: #9333EA;
            --accent: #F97316;
            --secondary: #3B82F6;
            --success: #10B981;
            --error: #EF4444;
            --bg: #0F172A;
            --light: #1E293B;
            --lighter: #334155;
            --text: #F1F5F9;
            --text-secondary: #CBD5E1;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: linear-gradient(135deg, #0f172a 0%, #1a1a2e 100%); color: var(--text); min-height: 100vh; }
        .container { max-width: 480px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; padding: max(20px, env(safe-area-inset-left)); }
        
        /* Header with glassmorphism */
        .header {
            background: rgba(147, 51, 234, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(147, 51, 234, 0.2);
            border-radius: 16px;
            padding: 24px 20px;
            margin-bottom: 24px;
            text-align: center;
        }
        .header h1 { font-size: 32px; margin-bottom: 4px; background: linear-gradient(135deg, #9333EA, #F97316); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; font-weight: 800; }
        .header p { color: var(--text-secondary); font-size: 14px; }
        
        /* Carousel */
        .carousel { margin-bottom: 24px; position: relative; }
        .carousel-container { overflow-x: auto; scroll-behavior: smooth; display: flex; gap: 12px; padding-bottom: 12px; }
        .carousel-container::-webkit-scrollbar { height: 4px; }
        .carousel-container::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 4px; }
        .carousel-item {
            flex-shrink: 0;
            width: 280px;
            background: linear-gradient(135deg, rgba(147, 51, 234, 0.15), rgba(249, 115, 22, 0.1));
            border: 1px solid rgba(147, 51, 234, 0.2);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
        }
        .carousel-title { font-weight: 700; font-size: 16px; margin-bottom: 8px; }
        .carousel-value { font-size: 28px; font-weight: 800; color: var(--primary); margin-bottom: 4px; }
        .carousel-label { font-size: 12px; color: var(--text-secondary); }
        
        /* Main glass card */
        .glass-card {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(147, 51, 234, 0.2);
            border-radius: 20px;
            padding: 32px 20px;
            text-align: center;
            margin-bottom: 24px;
        }
        
        .glass {
            width: 140px;
            height: 180px;
            border: 3px solid var(--primary);
            border-radius: 16px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            overflow: hidden;
            position: relative;
            background: rgba(147, 51, 234, 0.05);
            margin: 0 auto 20px;
            box-shadow: 0 0 40px rgba(147, 51, 234, 0.3);
        }
        .glass-fill {
            width: 100%;
            background: linear-gradient(180deg, var(--primary) 0%, var(--accent) 100%);
            transition: height 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .glass-label { font-size: 32px; font-weight: 800; background: linear-gradient(135deg, var(--primary), var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 20px; }
        
        /* Button grid with modern styling */
        .button-group { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 0; }
        button {
            padding: 16px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--primary), #7e22ce);
            color: white;
            font-weight: 700;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            min-height: 48px;
            box-shadow: 0 4px 20px rgba(147, 51, 234, 0.3);
        }
        button:active { transform: scale(0.92); }
        button:hover { box-shadow: 0 8px 40px rgba(147, 51, 234, 0.5); }
        
        .reset-btn {
            grid-column: 1/3;
            background: linear-gradient(135deg, var(--accent), #ea580c);
            box-shadow: 0 4px 20px rgba(249, 115, 22, 0.3);
        }
        .reset-btn:hover { box-shadow: 0 8px 40px rgba(249, 115, 22, 0.5); }
        
        /* Stats cards */
        .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; }
        .stat-card {
            background: rgba(147, 51, 234, 0.08);
            border: 1px solid rgba(147, 51, 234, 0.2);
            border-radius: 12px;
            padding: 12px;
            text-align: center;
        }
        .stat-value { font-size: 18px; font-weight: 800; color: var(--primary); }
        .stat-label { font-size: 11px; color: var(--text-secondary); margin-top: 4px; }
        
        /* Animations */
        @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-8px); } }
        .float { animation: float 3s ease-in-out infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .pulse { animation: pulse 2s ease-in-out infinite; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💧 Water Tracker</h1>
            <p>Stay hydrated, feel energized — 2026 Edition</p>
        </div>

        <!-- Carousel of hydration tips -->
        <div class="carousel">
            <div class="carousel-container">
                <div class="carousel-item">
                    <div class="carousel-title">🎯 Daily Goal</div>
                    <div class="carousel-value" id="dailyGoal">2L</div>
                    <div class="carousel-label">Stay on track</div>
                </div>
                <div class="carousel-item">
                    <div class="carousel-title">💪 Today's Progress</div>
                    <div class="carousel-value" id="progressPct">0%</div>
                    <div class="carousel-label">Keep going</div>
                </div>
                <div class="carousel-item">
                    <div class="carousel-title">📊 Weekly Average</div>
                    <div class="carousel-value">1.8L</div>
                    <div class="carousel-label">Great consistency</div>
                </div>
            </div>
        </div>

        <!-- Main glass morphism card -->
        <div class="glass-card">
            <div class="glass">
                <div class="glass-fill" id="fill" style="height: 0%;"></div>
            </div>

            <div class="glass-label" id="label">0L / 2L</div>

            <!-- Quick action buttons -->
            <div class="button-group">
                <button onclick="addWater(0.25)">➕ 250ml</button>
                <button onclick="addWater(0.5)">➕ 500ml</button>
                <button onclick="addWater(0.75)">➕ 750ml</button>
                <button onclick="addWater(1)">➕ 1L</button>
                <button class="reset-btn" onclick="resetWater()">🔄 Reset</button>
            </div>

            <!-- Stats -->
            <div class="stats">
                <div class="stat-card">
                    <div class="stat-value" id="servings">0</div>
                    <div class="stat-label">Servings Today</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="remaining">2L</div>
                    <div class="stat-label">Remaining</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let waterIntake = 0;
        const goal = 2;

        function addWater(amount) {
            waterIntake = Math.min(waterIntake + amount, goal);
            updateDisplay();
        }

        function resetWater() {
            waterIntake = 0;
            updateDisplay();
        }

        function updateDisplay() {
            const pct = (waterIntake / goal) * 100;
            const servings = Math.round((waterIntake / 0.25));
            const rem = Math.max(0, goal - waterIntake).toFixed(1);
            
            document.getElementById('fill').style.height = pct + '%';
            document.getElementById('label').textContent = waterIntake.toFixed(1) + 'L / ' + goal + 'L';
            document.getElementById('progressPct').textContent = Math.round(pct) + '%';
            document.getElementById('servings').textContent = servings;
            document.getElementById('remaining').textContent = rem + 'L';
        }

        updateDisplay();
        
        // Restore from localStorage
        const today = new Date().toISOString().split('T')[0];
        const saved = localStorage.getItem('waterIntake_' + today);
        if (saved) { waterIntake = parseFloat(saved); updateDisplay(); }
        
        // Save on update
        window.addEventListener('beforeunload', () => {
            localStorage.setItem('waterIntake_' + today, waterIntake);
        });
    </script>
</body>
</html>
