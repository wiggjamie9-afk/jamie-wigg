<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Junior Dev Career Coach — Career Development Mentor</title>
<style>
:root{--accent:#3b82f6;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0a0e1a;color:#f4f7fc;height:100vh;display:flex;flex-direction:column;}
header{padding:16px 20px;background:rgba(255,255,255,0.04);border-bottom:1px solid rgba(255,255,255,0.1);display:flex;align-items:center;gap:12px;}
header .emoji{font-size:32px;}
header .name{font-weight:700;font-size:18px;}
header .role{font-size:12px;color:#b0b8c6;}
#crisis{display:none;margin:12px 20px;padding:12px 16px;border-radius:10px;background:rgba(239,68,68,0.12);border:1px solid rgba(239,68,68,0.4);font-size:13px;color:#fca5a5;}
#crisis a{color:#fff;}
#chat{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:12px;}
.msg{max-width:78%;padding:10px 14px;border-radius:14px;font-size:14px;line-height:1.5;white-space:pre-wrap;}
.msg.user{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:4px;}
.msg.bot{align-self:flex-start;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-bottom-left-radius:4px;}
.composer{padding:14px 20px;border-top:1px solid rgba(255,255,255,0.1);display:flex;gap:10px;background:rgba(255,255,255,0.02);}
#input{flex:1;padding:12px 14px;border-radius:10px;border:1px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.04);color:#f4f7fc;font-size:14px;font-family:inherit;}
#input:focus{outline:none;border-color:var(--accent);}
button{padding:12px 18px;border:none;border-radius:10px;background:var(--accent);color:#fff;font-weight:600;cursor:pointer;}
button:disabled{opacity:0.5;cursor:default;}
.setup{padding:12px 20px;background:rgba(255,255,255,0.02);border-top:1px solid rgba(255,255,255,0.08);font-size:12px;color:#b0b8c6;display:flex;gap:8px;align-items:center;}
.setup input{flex:1;padding:8px 10px;border-radius:8px;border:1px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.04);color:#f4f7fc;font-size:12px;}
</style>
</head>
<body>
<header><span class="emoji">💼</span><div><div class="name">Junior Dev Career Coach</div><div class="role">Career Development Mentor</div></div></header>
<div id="crisis">It sounds like you may be going through something serious. You deserve support right now. <strong>Call or text 988</strong> (US Suicide &amp; Crisis Lifeline), text HOME to 741741, or find a line near you at <a href="https://findahelpline.com" target="_blank" rel="noopener">findahelpline.com</a>.</div>
<div id="chat"></div>
<div class="composer"><input id="input" placeholder="Message Junior Dev Career Coach..." autocomplete="off"><button id="send">Send</button></div>
<div class="setup"><span>Claude API key:</span><input id="apikey" type="password" placeholder="sk-ant-..."><button id="savekey" style="padding:8px 12px;font-size:12px;">Save</button></div>
<script>
var CONFIG = {"name":"Junior Dev Career Coach","emoji":"💼","role":"Career Development Mentor","accent":"#3b82f6","model":"claude-3-5-sonnet-20241022","systemPrompt":"You are Junior Dev Career Coach, a Career Development Mentor. Your personality: direct, honest, practical, encouraging. Your purpose: help junior developers land their first job through resume reviews, interview prep, and salary negotiation. Be direct, confident, and candid. Challenge assumptions kindly. Get to the point. Keep replies concise (2-4 sentences unless asked for more). You are a supportive companion, not a licensed professional. Do not diagnose or prescribe. If someone is in crisis or talking about self-harm, gently encourage them to reach out to a crisis line and share the resources shown in the app.","crisisTerms":["suicide","kill myself","end my life","self-harm","self harm","hurt myself","want to die","don't want to live","no reason to live"],"storageKey":"buddy_junior_dev_career_coach"};
var chat = document.getElementById("chat");
var input = document.getElementById("input");
var sendBtn = document.getElementById("send");
var messages = [];
function load(){
  try{ messages = JSON.parse(localStorage.getItem(CONFIG.storageKey)) || []; }catch(e){ messages = []; }
  var k = localStorage.getItem(CONFIG.storageKey + "_key"); if(k){ document.getElementById("apikey").value = k; }
  if(messages.length === 0){ addBot("Hi, I\u2019m " + CONFIG.name + ". " + "How can I help you today?", false); }
  else { messages.forEach(function(m){ render(m.role, m.content); }); }
}
function save(){ localStorage.setItem(CONFIG.storageKey, JSON.stringify(messages)); }
function render(role, content){
  var d = document.createElement("div"); d.className = "msg " + (role === "user" ? "user" : "bot"); d.textContent = content; chat.appendChild(d); chat.scrollTop = chat.scrollHeight;
}
function addUser(t){ messages.push({role:"user",content:t}); render("user",t); save(); }
function addBot(t, store){ if(store !== false){ messages.push({role:"assistant",content:t}); } render("assistant",t); save(); }
function checkCrisis(t){
  var low = t.toLowerCase(); var hit = CONFIG.crisisTerms.some(function(term){ return low.indexOf(term) !== -1; });
  if(hit){ document.getElementById("crisis").style.display = "block"; }
  return hit;
}
function apiMessages(){ return messages.map(function(m){ return {role: m.role === "user" ? "user" : "assistant", content: m.content}; }); }
async function callClaude(){
  var key = localStorage.getItem(CONFIG.storageKey + "_key");
  if(!key){ addBot("Please add your Claude API key below to enable replies.", false); return; }
  sendBtn.disabled = true;
  try{
    var res = await fetch("https://api.anthropic.com/v1/messages", {
      method:"POST",
      headers:{"Content-Type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
      body: JSON.stringify({ model: CONFIG.model, max_tokens: 1024, system: CONFIG.systemPrompt, messages: apiMessages() })
    });
    var data = await res.json();
    if(data.content && data.content[0]){ addBot(data.content[0].text); }
    else if(data.error){ addBot("Error: " + data.error.message, false); }
    else { addBot("Sorry, I could not generate a reply.", false); }
  }catch(e){ addBot("Network error: " + e.message, false); }
  sendBtn.disabled = false;
}
function send(){
  var t = input.value.trim(); if(!t) return; input.value = "";
  addUser(t); checkCrisis(t); callClaude();
}
sendBtn.addEventListener("click", send);
input.addEventListener("keydown", function(e){ if(e.key === "Enter"){ send(); } });
document.getElementById("savekey").addEventListener("click", function(){
  var k = document.getElementById("apikey").value.trim();
  localStorage.setItem(CONFIG.storageKey + "_key", k); addBot("API key saved. Ready to chat.", false);
});
load();
</script>
</body>
</html>
