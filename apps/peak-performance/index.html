<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peak Performance — Daily lessons for athletes</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #001f3f 0%, #003d7a 100%);
            color: #f1f5f9;
            min-height: 100vh;
            padding: 16px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            padding: 24px 0 16px;
            border-bottom: 1px solid rgba(0, 184, 148, 0.3);
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(90deg, #5eead4, #2dd4bf);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            font-size: 14px;
            color: #5eead4;
        }

        #onboard {
            animation: fadeIn 0.4s ease-out;
        }

        .onboard-content {
            text-align: center;
        }

        .onboard-content h2 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 16px;
            color: #5eead4;
        }

        .onboard-content p {
            font-size: 15px;
            line-height: 1.6;
            color: #2dd4bf;
            margin-bottom: 24px;
        }

        .track-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 12px;
        }

        .track-btn {
            padding: 16px 12px;
            border: 2px solid rgba(0, 184, 148, 0.6);
            background: rgba(0, 31, 63, 0.5);
            color: #2dd4bf;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .track-btn:hover {
            border-color: #5eead4;
            background: rgba(0, 61, 122, 0.3);
            color: #5eead4;
        }

        #styleCard {
            display: none;
            margin-top: 20px;
            padding: 20px;
            background: rgba(0, 61, 122, 0.2);
            border: 1px solid rgba(94, 234, 212, 0.3);
            border-radius: 12px;
            animation: slideDown 0.4s ease-out;
        }

        .style-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 16px;
        }

        .style-opt {
            padding: 12px;
            border: 2px solid rgba(0, 184, 148, 0.6);
            background: rgba(0, 31, 63, 0.5);
            color: #2dd4bf;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .style-opt:hover {
            border-color: #5eead4;
            background: rgba(0, 61, 122, 0.3);
            color: #5eead4;
        }

        #lessonView {
            display: none;
            animation: fadeIn 0.4s ease-out;
        }

        .lesson-content {
            background: rgba(0, 61, 122, 0.15);
            border: 1px solid rgba(94, 234, 212, 0.2);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
        }

        .lesson-title {
            font-size: 22px;
            font-weight: 700;
            color: #5eead4;
            margin-bottom: 16px;
            line-height: 1.3;
        }

        .lesson-body {
            font-size: 15px;
            line-height: 1.7;
            color: #2dd4bf;
            margin-bottom: 20px;
        }

        .lesson-body p {
            margin-bottom: 12px;
        }

        .lesson-affirmation {
            padding: 16px;
            background: rgba(94, 234, 212, 0.1);
            border-left: 4px solid #2dd4bf;
            border-radius: 4px;
            font-style: italic;
            color: #2dd4bf;
            font-size: 14px;
            margin-bottom: 16px;
        }

        .lesson-strength {
            display: inline-block;
            padding: 8px 12px;
            background: rgba(94, 234, 212, 0.2);
            color: #2dd4bf;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }

        .controls {
            display: flex;
            gap: 12px;
            margin-top: 24px;
            flex-wrap: wrap;
        }

        .btn {
            flex: 1;
            min-width: 100px;
            padding: 12px 16px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: linear-gradient(90deg, #2dd4bf, #14b8a6);
            color: #001f3f;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(45, 212, 191, 0.3);
        }

        .btn-secondary {
            background: rgba(0, 184, 148, 0.4);
            color: #2dd4bf;
            border: 1px solid rgba(94, 234, 212, 0.3);
        }

        .btn-secondary:hover {
            border-color: #5eead4;
            color: #5eead4;
        }

        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            font-size: 13px;
            color: #06b6d4;
            flex-wrap: wrap;
            gap: 12px;
        }

        .streak {
            font-weight: 600;
            color: #2dd4bf;
        }

        #celebrate {
            display: none;
            text-align: center;
            padding: 40px 20px;
            animation: scaleIn 0.5s ease-out;
        }

        .celebrate-emoji {
            font-size: 60px;
            margin-bottom: 16px;
        }

        .celebrate-text {
            font-size: 24px;
            font-weight: 700;
            color: #2dd4bf;
            margin-bottom: 24px;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .next-btn {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Peak Performance</h1>
            <p>One lesson a day for your body</p>
        </div>

        <div id="onboard">
            <div class="onboard-content">
                <h2>What's your athletic focus?</h2>
                <p>Where are you pushing yourself?</p>
                <div class="track-buttons">
                    <button class="track-btn" onclick="selectTrack('body')">💪 Your Body</button>
                    <button class="track-btn" onclick="selectTrack('recovery')">😴 Recovery</button>
                    <button class="track-btn" onclick="selectTrack('training')">⚙️ Training</button>
                    <button class="track-btn" onclick="selectTrack('peak')">🏆 Peak</button>
                </div>
            </div>
            <div id="styleCard">
                <p style="margin-bottom: 12px; font-size: 14px; color: #2dd4bf;">What matters to you?</p>
                <div class="style-options">
                    <button class="style-opt" onclick="selectStyle('science')">Science-based</button>
                    <button class="style-opt" onclick="selectStyle('practical')">Practical tips</button>
                    <button class="style-opt" onclick="selectStyle('mindset')">Mindset</button>
                    <button class="style-opt" onclick="selectStyle('personalized')">Customized</button>
                </div>
            </div>
        </div>

        <div id="lessonView">
            <div class="lesson-content">
                <div class="lesson-title" id="lessonTitle"></div>
                <div class="lesson-body" id="lessonBody"></div>
                <div class="lesson-affirmation" id="lessonAffirmation"></div>
                <div class="lesson-strength" id="lessonStrength"></div>
            </div>

            <div class="controls">
                <button class="btn btn-primary" onclick="speak()">🔊 Read aloud</button>
                <button class="btn btn-secondary" onclick="nextLesson()">Next →</button>
                <button class="btn btn-secondary" onclick="markDone()">✓ Done</button>
            </div>

            <div class="footer">
                <div id="progress"></div>
                <div><span class="streak" id="streak"></span></div>
            </div>
        </div>

        <div id="celebrate">
            <div class="celebrate-emoji">💯</div>
            <div class="celebrate-text">Another day stronger!</div>
            <p style="color: #2dd4bf; margin-bottom: 24px;">Your body remembers this. Come back tomorrow.</p>
            <button class="btn btn-primary" onclick="resetView()">Back to start</button>
        </div>
    </div>

    <script>
        const lessons = [
            {t:"Your body is not like anyone else's—stop comparing",b:["Two athletes doing the exact same training respond completely differently. One gains muscle, the other gets injured. One thrives on morning workouts, the other needs evening training.","The key to peak performance is understanding YOUR specific physiology, not copying someone else's program.","Today's tiny step: name 3 ways your body is unique. How does it respond to stress? To food? To sleep? Write it down."],a:"Your body is the data source. Listen to it.",s:"Individual biology"},
            {t:"Recovery is where you actually get stronger",b:["The training doesn't make you stronger—the recovery does. During the training, you're breaking down tissue. During recovery, your body rebuilds it stronger.","This is why sleep is not optional, why rest days are not weak, why nutrition matters more than the workout.","Today's tiny step: add one recovery action today: sleep an extra hour, take an ice bath, eat actual protein, or just rest."],a:"Strength is built during sleep, not during the set.",s:"Recovery priority"},
            {t:"Pain is information, not weakness",b:["There's the pain of your muscles getting stronger (good) and the pain of injury (bad). Most athletes can't tell the difference.","Sharp, shooting pain is usually bad. Muscular fatigue burning is usually good. One is a stop sign. One is a progress sign.","Today's tiny step: tune in to your pain today. What kind is it? Where is it? What's it telling you?"],a:"Listen to your body before it has to shout.",s:"Pain literacy"},
            {t:"Strength isn't just muscle—it's nervous system",b:["You can have huge muscles but be weak if your nervous system isn't firing right. Conversely, you can be not-muscular but incredibly strong if your nervous system is optimized.","The best athletes train their nervous system: coordination, reaction time, proprioception, mind-muscle connection.","Today's tiny step: do one movement that requires full focus and coordination. Slow, controlled, with total attention. That's nervous system training."],a:"Strength is your brain talking to your muscles.",s:"Nervous system"},
            {t:"Your mind determines your ceiling",b:["The athletes who break through plateaus aren't the ones with the best genetics. They're the ones who believed they could improve and kept showing up.","Mental toughness, belief, focus—these create real physiological changes. They affect which muscle fibers activate, how hard your heart works, how much pain you can tolerate.","Today's tiny step: what belief do you have about your body that might be limiting? Can you challenge it?"],a:"Your mindset is your physiology.",s:"Mental ceiling"},
            {t:"Peak performance has a rhythm—learn yours",b:["Your body doesn't perform the same way every day. You have circadian rhythms (time of day), ultradian rhythms (90-minute cycles), and longer cycles.","The athletes who perform at their best are the ones who know when their body naturally peaks and schedule important training then.","Today's tiny step: track when you naturally have the most energy this week. Morning? Evening? That's when your peak training should happen."],a:"Timing is half the battle.",s:"Rhythm awareness"},
            {t:"Breathing is performance software",b:["Most people breathe shallow and fast (stress breath). Athletes who breathe deep and slow (calm breath) are stronger, faster, and more durable.","Controlled breathing activates your parasympathetic nervous system, which is where actual adaptation happens. It's not woo—it's physiology.","Today's tiny step: practice 4-7-8 breathing: inhale for 4, hold for 7, exhale for 8. Do it for 2 minutes before training or sleep."],a:"Your breath is a control lever you've been ignoring.",s:"Breathwork power"},
            {t:"Mobility is strength waiting to happen",b:["An athlete with full range of motion can generate more force than one who's tight. A tight muscle is a weak muscle.","This is why mobility work isn't optional. It's the foundation everything else is built on.","Today's tiny step: find one area where you're tight (hips, shoulders, ankles). Spend 5 minutes on it. Mobility work is prevention."],a:"Flexibility is functional strength.",s:"Mobility mastery"},
            {t:"Your goals are changing you right now",b:["The moment you commit to a goal, your brain starts working toward it. Your body starts making the physiological changes needed to achieve it.","But only if you actually believe it's possible. Doubt creates sabotage. Belief creates adaptation.","Today's tiny step: what's one goal that scares you? Not because it's hard, but because you're not sure you can do it? That's your real goal."],a:"Your goal is reshaping you even before you achieve it.",s:"Goal power"},
            {t:"Nutrition is specificity, not restriction",b:["Generic diet advice works for no one. What works is nutrition tailored to YOUR body, YOUR goals, YOUR metabolism.","Some athletes thrive on high carb. Others on higher fat. Some recover better with frequent small meals. Others with two big ones. The right nutrition feels effortless.","Today's tiny step: experiment: eat and notice how you feel and perform. Your body will tell you what it needs."],a:"Listen to your body, not the diet trend.",s:"Nutritional listening"},
            {t:"Your weakness isn't a flaw—it's your growth edge",b:["The areas where you're weak are where you have the most room to grow. Most athletes avoid them. The best ones lean in.","If your squat is weak, that's where your biggest strength gains are. If your cardio is bad, that's where your biggest improvements are waiting.","Today's tiny step: name one thing your body can't do well. That's your next focus. That's where the breakthrough is."],a:"Your weakness is your superpower waiting to be unlocked.",s:"Growth edge"},
            {t:"Overtraining is underperformance in disguise",b:["The belief is more is always better. The truth: there's a training load above which you stop improving and start breaking down.","When you're overtrained, you're weaker, slower, more injury-prone, and more likely to get sick.","Today's tiny step: are you doing too much? Look at your last two weeks. Could you cut 20% and actually perform better? Probably."],a:"Less, done right, beats more done wrong.",s:"Training wisdom"},
            {t:"Sleep is your secret weapon",b:["Two athletes with identical training. One sleeps 8 hours. One sleeps 5. The 8-hour sleeper will be stronger, faster, leaner, and healthier.","Sleep affects strength gains, fat loss, injury recovery, immune function, and mental clarity. Nothing works without it.","Today's tiny step: add one hour to your sleep tonight. Notice how you feel tomorrow."],a:"Sleep is when your body becomes elite.",s:"Sleep priority"},
            {t:"Your training philosophy matters as much as your training",b:["Are you training to prove something? To escape something? To achieve something? To feel strong? These different motivations create very different results.","Training with purpose is different from training with force. Training with joy is different from training with obligation.","Today's tiny step: why are you training? What's the real reason? Connect with that."],a:"Your why shapes your how.",s:"Purpose-driven training"},
            {t:"Competitive edge is 90% mental",b:["Two athletes with identical physical ability. One wins consistently. One chokes. The difference is mental: focus, belief, and resilience.","The athlete who can stay calm under pressure, who believes they'll succeed, who sees challenges as opportunities—that's the one who performs.","Today's tiny step: in your last competition or tough moment, what did your mind do? Did it help you or hurt you? What would help you next time?"],a:"The strongest athlete is the one between the ears.",s:"Mental competition"},
            {t:"Your body knows things your mind hasn't learned",b:["Sometimes your body refuses to do something you're forcing. That's not weakness—that's wisdom. Your nervous system might be protecting you from injury.","Sometimes your body wants to do something your mind says no to. That's instinct. Your muscle memory might know it's possible.","Today's tiny step: feel into your body. What is it telling you right now that your mind isn't listening to?"],a:"Embodied intelligence is your best coach.",s:"Body wisdom"},
            {t:"Injury prevention is better than recovery",b:["Once you're injured, you can't train. Once you can't train, you lose fitness. Once you lose fitness, you lose confidence.","The athletes who last are the ones who prevent injuries through mobility, balance, proper progression, and listening to their body.","Today's tiny step: what's one repetitive stress area in your training? Address it now before it becomes an injury."],a:"An ounce of prevention beats a pound of rehab.",s:"Prevention focus"},
            {t:"Your peak performance has seasons",b:["You can't be at 100% all year. The athletes who know this, who plan peak cycles, outperform those who try to stay maxed out forever.","Build, peak, recover, repeat. Each cycle makes you stronger.","Today's tiny step: where are you in your cycle right now? Building, peaking, recovering, or off-season? Train accordingly."],a:"Periodization is how you sustain improvement.",s:"Seasonal training"},
            {t:"Consistency beats intensity",b:["The athlete who trains 3x per week for a year will be stronger than the athlete who trains 6x per week for a month and then quits.","Consistency creates adaptation. Intensity creates adaptation too, but only if it's consistent.","Today's tiny step: can you commit to showing up consistently this week? Not hard, just consistent."],a:"The best training plan is the one you'll actually do.",s:"Consistency power"},
            {t:"Your performance is your best feedback",b:["Forget the metrics that don't matter. Forget the opinions of people who aren't you. Your actual performance tells you everything.","If you're getting stronger, faster, more durable—you're on the right track. If you're stagnating or declining—something needs to change.","Today's tiny step: how are you actually performing in your sport right now? Not compared to others—compared to where you were 3 months ago?"],a:"Trust the evidence of your own performance.",s:"Performance truth"}
        ];

        const tracks = { body: 0, recovery: 5, training: 10, peak: 15 };

        let state = JSON.parse(localStorage.getItem('perfState')) || {
            track: null,
            style: null,
            done: [],
            lastDay: null,
            streak: 0,
            seen: {}
        };

        function selectTrack(t) {
            state.track = t;
            state.style = null;
            state.seen = {};
            document.getElementById('styleCard').style.display = 'block';
        }

        function selectStyle(s) {
            state.style = s;
            state.lastDay = new Date().toDateString();
            saveState();
            showLesson();
        }

        function saveState() {
            localStorage.setItem('perfState', JSON.stringify(state));
        }

        function getTrackIndex(offset) {
            const trackStart = tracks[state.track];
            let idx = trackStart + offset;
            while (state.done.includes(idx)) idx++;
            return idx < trackStart + 5 ? idx : trackStart + (Math.floor(Math.random() * 5));
        }

        function showLesson() {
            if (!state.track || !state.style) return;
            const offset = state.seen[state.track] ? (state.seen[state.track] + 1) % 5 : 0;
            const idx = getTrackIndex(offset);
            state.seen[state.track] = offset;
            const l = lessons[idx];
            document.getElementById('lessonTitle').textContent = l.t;
            document.getElementById('lessonBody').innerHTML = l.b.map(p => `<p>${p}</p>`).join('');
            document.getElementById('lessonAffirmation').textContent = l.a;
            document.getElementById('lessonStrength').textContent = l.s;
            updateUI();
        }

        function updateUI() {
            const today = new Date().toDateString();
            if (state.lastDay !== today) state.streak = 0;
            if (state.done.length > 0) {
                const lastDone = state.done[state.done.length - 1];
                if (new Date().toDateString() === state.lastDay) {
                    document.getElementById('onboard').style.display = 'none';
                    document.getElementById('celebrate').style.display = 'block';
                    document.getElementById('lessonView').style.display = 'none';
                } else {
                    document.getElementById('onboard').style.display = 'none';
                    document.getElementById('lessonView').style.display = 'block';
                    document.getElementById('celebrate').style.display = 'none';
                }
            } else {
                document.getElementById('onboard').style.display = 'block';
                document.getElementById('lessonView').style.display = 'none';
                document.getElementById('celebrate').style.display = 'none';
            }
            document.getElementById('progress').textContent = `${state.done.length} lesson${state.done.length !== 1 ? 's' : ''} done`;
            document.getElementById('streak').textContent = `💯 ${state.streak} day${state.streak !== 1 ? 's' : ''} here`;
        }

        function speak() {
            const title = document.getElementById('lessonTitle').textContent;
            const body = document.getElementById('lessonBody').innerText;
            const aff = document.getElementById('lessonAffirmation').textContent;
            speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(`${title}. ${body}. ${aff}`);
            u.rate = 0.92;
            speechSynthesis.speak(u);
        }

        function nextLesson() {
            showLesson();
        }

        function markDone() {
            const idx = lessons.findIndex(l => l.t === document.getElementById('lessonTitle').textContent);
            if (!state.done.includes(idx)) {
                state.done.push(idx);
                if (state.lastDay === new Date().toDateString()) state.streak++;
                state.lastDay = new Date().toDateString();
                saveState();
            }
            document.getElementById('onboard').style.display = 'none';
            document.getElementById('lessonView').style.display = 'none';
            document.getElementById('celebrate').style.display = 'block';
        }

        function resetView() {
            document.getElementById('celebrate').style.display = 'none';
            document.getElementById('onboard').style.display = 'block';
            state.track = null;
            state.style = null;
            saveState();
        }

        updateUI();
        if (state.track && state.style) showLesson();
    </script>
</body>
</html>
