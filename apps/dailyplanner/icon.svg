<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#241a33"/>
      <stop offset="100%" stop-color="#08050d"/>
    </radialGradient>
    <linearGradient id="check" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d8ff"/>
      <stop offset="100%" stop-color="#00e887"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="180" fill="rgba(0, 216, 255, 0.1)"/>
  <!-- Calendar grid -->
  <g transform="translate(256, 256)">
    <!-- Calendar frame -->
    <rect x="-70" y="-70" width="140" height="140" rx="8" fill="none" stroke="url(#check)" stroke-width="4"/>
    <!-- Days grid (3x3) -->
    <g stroke="url(#check)" stroke-width="2" opacity="0.5">
      <line x1="-70" y1="-30" x2="70" y2="-30"/>
      <line x1="-70" y1="10" x2="70" y2="10"/>
      <line x1="-30" y1="-70" x2="-30" y2="70"/>
      <line x1="10" y1="-70" x2="10" y2="70"/>
    </g>
    <!-- Checkmark over date -->
    <path d="M -15 15 L -5 25 L 20 0" fill="none" stroke="url(#check)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- Productivity glow -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="rgba(0, 216, 255, 0.3)" stroke-width="3" opacity="0.6"/>
</svg>
