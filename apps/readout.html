<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#08050d">
    <title>Readout - Text-to-Speech Reader</title>
    <style>
        :root { --canvas:#08050d; --green:#00e887; --red:#ff1f5a; --cyan:#00d8ff; --purple:#7c3aed; --text:#fff; --text-muted:#aaa; }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:var(--canvas); color:var(--text); min-height:100vh; padding-bottom:80px; }
        .header { padding:20px; border-bottom:1px solid rgba(0,232,135,0.2); display:flex; justify-content:space-between; align-items:center; }
        h1 { font-size:24px; font-weight:700; }
        .badge { background:var(--green); color:var(--canvas); padding:4px 12px; border-radius:20px; font-size:11px; font-weight:600; }
        .content { padding:20px; }
        textarea { width:100%; min-height:120px; background:rgba(0,232,135,0.05); border:1px solid rgba(0,232,135,0.2); border-radius:8px; color:var(--text); padding:12px; font-family:inherit; resize:vertical; }
        .controls { display:flex; gap:10px; margin:20px 0; flex-wrap:wrap; }
        input[type="range"] { flex:1; min-width:150px; }
        button { background:var(--green); color:var(--canvas); border:0; padding:12px 20px; border-radius:8px; cursor:pointer; font-weight:600; font-size:14px; }
        button:active { transform:scale(0.95); }
        .history { margin-top:20px; }
        .hist-item { padding:12px; background:rgba(0,232,135,0.05); border:1px solid rgba(0,232,135,0.1); border-radius:8px; margin-bottom:8px; cursor:pointer; }
        .hist-item:hover { background:rgba(0,232,135,0.15); }
        .panel { display:none; }
        .panel.on { display:block; }
        .tabs { position:fixed; bottom:0; left:0; right:0; background:var(--canvas); border-top:1px solid rgba(0,232,135,0.2); display:flex; justify-content:space-around; height:70px; z-index:100; }
        .tab { flex:1; background:0; border:0; color:var(--text-muted); cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:12px; }
        .tab.on { color:var(--green); }
        .premium { background:rgba(124,58,237,0.1); border-left:3px solid var(--purple); padding:12px; margin-top:20px; border-radius:4px; font-size:13px; }
        .info { font-size:13px; color:var(--text-muted); margin-top:10px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>📖 Readout</h1>
        <div class="badge">FREE</div>
    </div>
    <div class="content">
        <div id="reader" class="panel on">
            <textarea id="text" placeholder="Paste text here..."></textarea>
            <div class="controls">
                <button onclick="speak()">▶ Read Aloud</button>
                <button onclick="stop()">⏹ Stop</button>
            </div>
            <div style="display:flex; gap:20px; margin:15px 0;">
                <div>
                    <label style="font-size:12px">Speed</label><br>
                    <input type="range" id="rate" min="0.5" max="2" step="0.1" value="1">
                </div>
                <div>
                    <label style="font-size:12px">Volume</label><br>
                    <input type="range" id="vol" min="0" max="1" step="0.1" value="1">
                </div>
            </div>
            <div class="premium">💎 Premium: Upload documents (PDF, DOCX)</div>
        </div>
        <div id="history" class="panel">
            <div id="hist-list"></div>
        </div>
    </div>
    <div class="tabs">
        <button class="tab on" data-p="reader">📖 Reader</button>
        <button class="tab" data-p="history">📚 History</button>
    </div>
    <script>
        let hist = [];
        let speaking = false;
        
        function load() {
            let h = localStorage.getItem('readout-hist');
            hist = h ? JSON.parse(h) : [];
            updateHist();
        }
        
        function saveHist() {
            localStorage.setItem('readout-hist', JSON.stringify(hist));
        }
        
        function speak() {
            let txt = document.getElementById('text').value;
            if (!txt) return;
            
            let uttr = new SpeechSynthesisUtterance(txt);
            uttr.rate = parseFloat(document.getElementById('rate').value);
            uttr.volume = parseFloat(document.getElementById('vol').value);
            
            speechSynthesis.speak(uttr);
            speaking = true;
            
            let entry = txt.substring(0, 50) + (txt.length > 50 ? '...' : '');
            if (!hist.includes(entry)) {
                hist.unshift(entry);
                if (hist.length > 15) hist.pop();
                saveHist();
            }
        }
        
        function stop() {
            speechSynthesis.cancel();
            speaking = false;
        }
        
        function updateHist() {
            document.getElementById('hist-list').innerHTML = hist.length ?
                hist.map((h,i) => `<div class="hist-item" onclick="document.getElementById('text').value='${h.replace(/'/g,"\\'")}'">${h}</div>`).join('') :
                '<p style="color:var(--text-muted);padding:20px">No history</p>';
        }
        
        document.querySelectorAll('.tab').forEach(t => {
            t.onclick = () => {
                let p = t.dataset.p;
                document.querySelectorAll('.tab').forEach(x => x.classList.remove('on'));
                document.querySelectorAll('.panel').forEach(x => x.classList.remove('on'));
                t.classList.add('on');
                document.getElementById(p).classList.add('on');
            };
        });
        
        load();
        if ('serviceWorker' in navigator) navigator.serviceWorker.register('data:application/javascript,self.addEventListener("install",e=>self.skipWaiting());');
    </script>
</body>
</html>
