<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Helper – Quick Calculations</title>
    <style>
        :root { --primary: #3B82F6; --bg-dark: #0F172A; --bg-light: #1E293B; --text-primary: #F1F5F9; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { font-family: -apple-system, sans-serif; background: var(--bg-dark); color: var(--text-primary); }
        .container { max-width: 480px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }
        .header { background: linear-gradient(135deg, var(--primary) 0%, #1E40AF 100%); padding: 24px 20px; text-align: center; }
        .header h1 { font-size: 28px; margin-bottom: 4px; }
        .content { flex: 1; padding: 20px; overflow-y: auto; }
        .card { background: var(--bg-light); border-radius: 12px; padding: 16px; margin-bottom: 16px; border-left: 4px solid var(--primary); }
        .card h2 { font-size: 16px; margin-bottom: 12px; font-weight: 700; }
        input { width: 100%; padding: 10px 12px; background: var(--bg-dark); border: 2px solid #334155; border-radius: 8px; color: var(--text-primary); margin-bottom: 10px; font-size: 13px; }
        input:focus { outline: none; border-color: var(--primary); }
        button { width: 100%; padding: 12px; background: var(--primary); border: none; border-radius: 8px; color: white; font-weight: 600; cursor: pointer; margin-bottom: 8px; }
        button:hover { background: #1E40AF; }
        .calc-btn { width: 100%; padding: 10px; margin-bottom: 8px; }
        .result { background: var(--bg-dark); padding: 16px; border-radius: 8px; text-align: center; font-size: 20px; font-weight: 700; color: var(--primary); }
        .label { display: block; font-size: 12px; color: #CBD5E1; margin-bottom: 4px; font-weight: 600; }
    </style>
    <meta name="theme-color" content="#9333EA">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🧮 MATH HELPER</h1>
            <p style="font-size: 12px;">Quick calculations</p>
        </div>
        <div class="content">
            <div class="card">
                <h2>Basic Math</h2>
                <label>Number 1</label>
                <input type="number" id="num1" placeholder="0">
                <label>Number 2</label>
                <input type="number" id="num2" placeholder="0">
                <button class="calc-btn" onclick="calculate('add')">➕ Add</button>
                <button class="calc-btn" onclick="calculate('subtract')" style="background: #F97316;">➖ Subtract</button>
                <button class="calc-btn" onclick="calculate('multiply')" style="background: #9333EA;">✕ Multiply</button>
                <button class="calc-btn" onclick="calculate('divide')" style="background: #10B981;">÷ Divide</button>
                <div class="result" id="result">0</div>
            </div>

            <div class="card">
                <h2>Percentage</h2>
                <label>Amount</label>
                <input type="number" id="amount" placeholder="100">
                <label>Percentage</label>
                <input type="number" id="percent" placeholder="10">
                <button onclick="calcPercent()">Calculate %</button>
                <div class="result" id="percentResult">0</div>
            </div>

            <div class="card">
                <h2>Average</h2>
                <label>Numbers (comma separated)</label>
                <input type="text" id="numbers" placeholder="10, 20, 30">
                <button onclick="calcAverage()">Calculate Average</button>
                <div class="result" id="avgResult">0</div>
            </div>
        </div>
    </div>

    <script>
        function calculate(op) {
            const n1 = parseFloat(document.getElementById('num1').value) || 0;
            const n2 = parseFloat(document.getElementById('num2').value) || 0;
            let result = 0;

            if (op === 'add') result = n1 + n2;
            else if (op === 'subtract') result = n1 - n2;
            else if (op === 'multiply') result = n1 * n2;
            else if (op === 'divide') result = n2 !== 0 ? n1 / n2 : 0;

            document.getElementById('result').textContent = result.toFixed(2);
        }

        function calcPercent() {
            const amt = parseFloat(document.getElementById('amount').value) || 0;
            const pct = parseFloat(document.getElementById('percent').value) || 0;
            const result = (amt * pct) / 100;
            document.getElementById('percentResult').textContent = result.toFixed(2);
        }

        function calcAverage() {
            const nums = document.getElementById('numbers').value.split(',').map(n => parseFloat(n.trim())).filter(n => !isNaN(n));
            if (nums.length === 0) { document.getElementById('avgResult').textContent = '0'; return; }
            const avg = nums.reduce((a, b) => a + b) / nums.length;
            document.getElementById('avgResult').textContent = avg.toFixed(2);
        }
    </script>
</body>
</html>
