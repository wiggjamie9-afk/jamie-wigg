<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#08050d">
    <title>Math Helper</title>
    <style>
        :root { --canvas:#08050d; --green:#00e887; --red:#ff1f5a; --cyan:#00d8ff; --purple:#7c3aed; --text:#fff; --text-muted:#aaa; }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:var(--canvas); color:var(--text); min-height:100vh; padding-bottom:80px; }
        .header { padding:20px; border-bottom:1px solid rgba(0,232,135,0.2); display:flex; justify-content:space-between; }
        h1 { font-size:24px; font-weight:700; }
        .badge { background:var(--green); color:var(--canvas); padding:4px 12px; border-radius:20px; font-size:11px; }
        .content { padding:20px; }
        input { background:rgba(0,232,135,0.05); border:1px solid rgba(0,232,135,0.2); border-radius:6px; color:var(--text); padding:10px; margin:8px 0; width:100%; }
        button { background:var(--green); color:var(--canvas); border:0; padding:10px 16px; border-radius:6px; cursor:pointer; font-weight:600; width:100%; }
        .calc-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin:15px 0; }
        .calc-btn { padding:15px; font-size:18px; font-weight:600; }
        .result { background:rgba(0,232,135,0.05); border:1px solid rgba(0,232,135,0.2); border-radius:8px; padding:15px; margin:15px 0; }
        .result-val { font-size:28px; color:var(--green); font-weight:700; margin:10px 0; }
        .history { padding:8px; background:rgba(0,232,135,0.05); border:1px solid rgba(0,232,135,0.1); border-radius:6px; margin:6px 0; cursor:pointer; font-size:12px; }
        .panel { display:none; }
        .panel.on { display:block; }
        .tabs { position:fixed; bottom:0; left:0; right:0; background:var(--canvas); border-top:1px solid rgba(0,232,135,0.2); display:flex; justify-content:space-around; height:70px; z-index:100; }
        .tab { flex:1; background:0; border:0; color:var(--text-muted); cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:12px; }
        .tab.on { color:var(--green); }
        .premium { background:rgba(124,58,237,0.1); border-left:3px solid var(--purple); padding:12px; margin-top:20px; border-radius:4px; font-size:13px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🔢 Math</h1>
        <div class="badge">FREE</div>
    </div>
    <div class="content">
        <div id="calc" class="panel on">
            <input type="text" id="display" readonly style="text-align:right;font-size:20px">
            <div class="calc-grid">
                <button class="calc-btn" onclick="press('7')">7</button>
                <button class="calc-btn" onclick="press('8')">8</button>
                <button class="calc-btn" onclick="press('9')">9</button>
                <button class="calc-btn" onclick="press('/')" style="background:var(--cyan);color:var(--canvas)">/</button>
                <button class="calc-btn" onclick="press('4')">4</button>
                <button class="calc-btn" onclick="press('5')">5</button>
                <button class="calc-btn" onclick="press('6')">6</button>
                <button class="calc-btn" onclick="press('*')" style="background:var(--cyan);color:var(--canvas)">*</button>
                <button class="calc-btn" onclick="press('1')">1</button>
                <button class="calc-btn" onclick="press('2')">2</button>
                <button class="calc-btn" onclick="press('3')">3</button>
                <button class="calc-btn" onclick="press('-')" style="background:var(--cyan);color:var(--canvas)">-</button>
                <button class="calc-btn" onclick="press('0')" style="grid-column:1/3">0</button>
                <button class="calc-btn" onclick="press('.')"  style="background:var(--cyan);color:var(--canvas)">.</button>
                <button class="calc-btn" onclick="calculate()" style="background:var(--green);color:var(--canvas)">=</button>
            </div>
            <button onclick="clear()">Clear</button>
            
            <div id="conv" style="margin-top:20px">
                <div style="font-weight:600;margin:10px 0">Unit Conversion</div>
                <input type="number" id="conv-val" placeholder="Value" step="0.01">
                <select id="conv-type" style="width:100%;background:rgba(0,232,135,0.05);border:1px solid rgba(0,232,135,0.2);border-radius:6px;color:var(--text);padding:10px;margin:8px 0">
                    <option>km to miles</option>
                    <option>lbs to kg</option>
                    <option>°F to °C</option>
                </select>
                <button onclick="convert()">Convert</button>
                <div id="conv-result"></div>
            </div>
            
            <div class="premium">💎 Premium: Step-by-step solving & algebra</div>
        </div>
        
        <div id="history" class="panel">
            <div id="hist-list"></div>
        </div>
    </div>
    <div class="tabs">
        <button class="tab on" data-p="calc">🧮 Calc</button>
        <button class="tab" data-p="history">📜 History</button>
    </div>
    <script>
        let display = '';
        let history = [];
        
        function load() {
            let d = localStorage.getItem('mathhelper');
            if (d) history = JSON.parse(d);
            drawHist();
        }
        
        function save() {
            localStorage.setItem('mathhelper', JSON.stringify(history));
        }
        
        function press(c) {
            display += c;
            document.getElementById('display').value = display;
        }
        
        function calculate() {
            try {
                let result = eval(display);
                history.unshift({expr: display, result});
                if (history.length > 20) history.pop();
                save();
                display = result.toString();
                document.getElementById('display').value = display;
                drawHist();
            } catch (e) {
                document.getElementById('display').value = 'Error';
            }
        }
        
        function clear() {
            display = '';
            document.getElementById('display').value = '';
        }
        
        function convert() {
            let v = parseFloat(document.getElementById('conv-val').value);
            let t = document.getElementById('conv-type').value;
            let result = 0;
            
            if (t === 'km to miles') result = (v * 0.621371).toFixed(2);
            else if (t === 'lbs to kg') result = (v / 2.20462).toFixed(2);
            else if (t === '°F to °C') result = ((v - 32) * 5 / 9).toFixed(2);
            
            document.getElementById('conv-result').innerHTML = `<div style="margin-top:10px;color:var(--green);font-weight:600">${v} ${t.split(' to ')[0]} = ${result} ${t.split(' to ')[1]}</div>`;
        }
        
        function drawHist() {
            document.getElementById('hist-list').innerHTML = history.length ?
                history.map(h => `<div class="history" onclick="display='${h.expr}';document.getElementById('display').value=display">${h.expr} = ${h.result}</div>`).join('') :
                '<p style="padding:20px;color:var(--text-muted)">No history</p>';
        }
        
        document.querySelectorAll('.tab').forEach(t => {
            t.onclick = () => {
                document.querySelectorAll('.tab').forEach(x => x.classList.remove('on'));
                document.querySelectorAll('.panel').forEach(x => x.classList.remove('on'));
                t.classList.add('on');
                document.getElementById(t.dataset.p).classList.add('on');
            };
        });
        
        load();
        if ('serviceWorker' in navigator) navigator.serviceWorker.register('data:application/javascript,self.addEventListener("install",e=>self.skipWaiting());');
    </script>
</body>
</html>
