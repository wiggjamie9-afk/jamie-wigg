<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#08050d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="description" content="Blood Pressure Buddy — BP logging with trend charts and health insights">
  <title>BP Buddy</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.svg">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{--canvas:#08050d;--bg:#0f0d18;--muted:#a0a0b0;--text:#f5f0e8;--green:#00e887;--red:#ff1f5a}
    html,body{width:100%;height:100%;background:var(--canvas);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
    #app{height:100dvh;display:flex;flex-direction:column;z-index:1}
    .header{padding:16px 20px 12px;padding-top:calc(16px + env(safe-area-inset-top,0px));border-bottom:1px solid rgba(255,255,255,.07);display:flex;justify-content:space-between}
    .logo{font-weight:700;font-size:18px;background:linear-gradient(120deg,#00e887,#00d8ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .content{flex:1;overflow-y:auto;padding:16px 20px;padding-bottom:calc(72px + env(safe-area-inset-bottom,16px))}
    .stat-card{background:var(--bg);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:16px;margin-bottom:12px}
    .stat-title{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:8px}
    .stat-value{font-size:32px;font-weight:900;color:var(--green)}
    .stat-meta{font-size:12px;color:var(--muted);margin-top:6px}
    .input-group{display:flex;gap:8px;margin-bottom:12px}
    .input-group input{flex:1;padding:10px 12px;background:var(--bg);border:1px solid rgba(255,255,255,.08);border-radius:10px;color:var(--text);font-size:14px;outline:none}
    .input-group button{padding:10px 16px;background:linear-gradient(120deg,var(--green),#00d8ff);border:none;border-radius:10px;color:#000;font-weight:700;cursor:pointer;font-size:13px}
    .entries{margin-top:16px}
    .entry{background:var(--bg);border-left:4px solid var(--green);border-radius:10px;padding:12px;margin-bottom:8px;font-size:13px}
    .entry.high{border-left-color:var(--red)}
    .entry-sys{font-size:16px;font-weight:700}
    .entry-time{font-size:11px;color:var(--muted);margin-top:4px}
    .tabs{position:fixed;bottom:0;left:0;right:0;background:rgba(8,5,13,.95);border-top:1px solid rgba(255,255,255,.07);display:flex;height:72px;padding-bottom:env(safe-area-inset-bottom,0px)}
    .tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border:none;background:none;color:var(--muted);cursor:pointer;font-size:11px;font-weight:600;gap:4px}
    .tab.active{color:var(--green)}
  </style>
</head>
<body>
<div id="app">
  <div class="header">
    <div class="logo">💚 BP Buddy</div>
    <div style="font-size:12px;color:var(--muted)">FREE</div>
  </div>
  <div class="content">
    <div class="stat-card">
      <div class="stat-title">Latest Reading</div>
      <div class="stat-value" id="latestBP">—</div>
      <div class="stat-meta" id="latestTime">No readings yet</div>
    </div>
    <div class="stat-card">
      <div class="stat-title">Average (Last 7 Days)</div>
      <div class="stat-value" id="avgBP">—</div>
      <div class="stat-meta" id="trend">—</div>
    </div>
    <div class="stat-card">
      <label class="stat-title">Log Reading</label>
      <div class="input-group">
        <input id="sysBP" type="number" placeholder="Systolic (e.g., 120)" min="60" max="200">
        <input id="diaBP" type="number" placeholder="Diastolic (e.g., 80)" min="40" max="130">
        <button onclick="addReading()">+</button>
      </div>
    </div>
    <div class="entries" id="entries"></div>
  </div>
  <div class="tabs">
    <button class="tab active" onclick="showView('log')">📋 Log</button>
    <button class="tab" onclick="showView('trend')">📈 Trend</button>
  </div>
</div>

<script>
  if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
  let readings=[];

  function load(){
    const s=localStorage.getItem('bpbuddy');
    readings=s?JSON.parse(s):[];
    updateUI();
  }

  function save(){
    localStorage.setItem('bpbuddy', JSON.stringify(readings));
  }

  function addReading(){
    const sys=parseInt(document.getElementById('sysBP').value);
    const dia=parseInt(document.getElementById('diaBP').value);
    if(!sys||!dia||sys<60||dia<40){
      alert('Invalid values');
      return;
    }
    readings.push({sys,dia,date:new Date().toISOString()});
    document.getElementById('sysBP').value='';
    document.getElementById('diaBP').value='';
    save();
    updateUI();
  }

  function updateUI(){
    if(!readings.length) return;
    const latest=readings[readings.length-1];
    document.getElementById('latestBP').textContent=`${latest.sys}/${latest.dia}`;
    document.getElementById('latestTime').textContent=new Date(latest.date).toLocaleString();

    const last7=readings.slice(-7);
    const avgSys=Math.round(last7.reduce((s,r)=>s+r.sys,0)/last7.length);
    const avgDia=Math.round(last7.reduce((s,r)=>s+r.dia,0)/last7.length);
    document.getElementById('avgBP').textContent=`${avgSys}/${avgDia}`;

    const trend=latest.sys>avgSys?'📈 Rising':'📉 Stable';
    document.getElementById('trend').textContent=trend;

    const html=readings.slice(-10).reverse().map(r=>{
      const high=r.sys>=140||r.dia>=90;
      return `<div class="entry ${high?'high':''}"><div class="entry-sys">${r.sys}/${r.dia}</div><div class="entry-time">${new Date(r.date).toLocaleString()}</div></div>`;
    }).join('');
    document.getElementById('entries').innerHTML=html;
  }

  function showView(v){
    document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',(['log','trend'][i]===v)));
  }

  load();
</script>
</body>
</html>
