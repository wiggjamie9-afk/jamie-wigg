<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#08050d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="description" content="Medicine Companion — medication tracker with reminders">
  <title>Medicine Companion</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.svg">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{--canvas:#08050d;--bg:#0f0d18;--muted:#a0a0b0;--text:#f5f0e8;--pink:#ff6fc8;--cyan:#00d8ff}
    html,body{width:100%;height:100%;background:var(--canvas);color:var(--text);font-family:-apple-system,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
    #app{height:100dvh;display:flex;flex-direction:column;z-index:1}
    .header{padding:16px 20px 12px;padding-top:calc(16px + env(safe-area-inset-top,0px));border-bottom:1px solid rgba(255,255,255,.07);display:flex;justify-content:space-between}
    .logo{font-weight:700;font-size:18px;background:linear-gradient(120deg,var(--pink),#ff1f5a);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .content{flex:1;overflow-y:auto;padding:16px 20px;padding-bottom:calc(72px + env(safe-area-inset-bottom,16px))}
    .med-card{background:var(--bg);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:14px;margin-bottom:10px;display:flex;gap:12px}
    .med-icon{font-size:24px;flex-shrink:0}
    .med-info{flex:1;min-width:0}
    .med-name{font-weight:600;font-size:14px}
    .med-meta{font-size:12px;color:var(--muted);margin-top:4px}
    .med-actions{display:flex;gap:6px}
    .btn-sm{padding:6px 10px;background:rgba(255,255,255,.1);border:none;border-radius:8px;color:var(--text);font-size:11px;cursor:pointer;font-weight:600}
    .input-group{display:flex;gap:8px;margin-bottom:12px}
    .input-group input{flex:1;padding:10px 12px;background:var(--bg);border:1px solid rgba(255,255,255,.08);border-radius:10px;color:var(--text);font-size:14px;outline:none}
    .input-group button{padding:10px 16px;background:linear-gradient(120deg,var(--pink),#ff1f5a);border:none;border-radius:10px;color:#fff;font-weight:700;cursor:pointer;font-size:13px}
    .tabs{position:fixed;bottom:0;left:0;right:0;background:rgba(8,5,13,.95);border-top:1px solid rgba(255,255,255,.07);display:flex;height:72px;padding-bottom:env(safe-area-inset-bottom,0px)}
    .tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border:none;background:none;color:var(--muted);cursor:pointer;font-size:11px;gap:4px;font-weight:600}
    .tab.active{color:var(--pink)}
    .fab{position:absolute;bottom:calc(72px + env(safe-area-inset-bottom,16px) + 16px);right:20px;width:56px;height:56px;border-radius:999px;border:none;background:linear-gradient(120deg,var(--pink),#ff1f5a);color:#fff;font-size:24px;cursor:pointer}
  </style>
</head>
<body>
<div id="app">
  <div class="header">
    <div class="logo">💊 Medicine</div>
    <div style="font-size:12px;color:var(--muted)">FREE</div>
  </div>
  <div class="content">
    <div class="input-group">
      <input id="medName" placeholder="Medicine name">
      <input id="medDose" placeholder="Dose (e.g., 5mg)">
      <button onclick="addMed()">+</button>
    </div>
    <div id="meds"></div>
  </div>
  <button class="fab" id="fab" onclick="addMed()" style="display:none">+</button>
  <div class="tabs">
    <button class="tab active">📋 Active</button>
    <button class="tab">✅ History</button>
  </div>
</div>

<script>
  if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
  let meds=[];

  function load(){
    const s=localStorage.getItem('meds');
    meds=s?JSON.parse(s):[];
    updateUI();
  }

  function save(){
    localStorage.setItem('meds', JSON.stringify(meds));
  }

  function addMed(){
    const name=document.getElementById('medName').value.trim();
    const dose=document.getElementById('medDose').value.trim();
    if(!name||!dose){
      alert('Name and dose required');
      return;
    }
    meds.push({id:Date.now(),name,dose,taken:[],createdAt:new Date().toISOString()});
    document.getElementById('medName').value='';
    document.getElementById('medDose').value='';
    save();
    updateUI();
  }

  function logTaken(id){
    const m=meds.find(x=>x.id===id);
    if(m){
      m.taken.push(new Date().toISOString());
      save();
      updateUI();
    }
  }

  function deleteMed(id){
    if(confirm('Delete?')){
      meds=meds.filter(m=>m.id!==id);
      save();
      updateUI();
    }
  }

  function updateUI(){
    document.getElementById('meds').innerHTML=meds.map(m=>`
      <div class="med-card">
        <div class="med-icon">💊</div>
        <div class="med-info">
          <div class="med-name">${m.name}</div>
          <div class="med-meta">${m.dose} • ${m.taken.length} doses taken</div>
        </div>
        <div class="med-actions">
          <button class="btn-sm" onclick="logTaken(${m.id})">Take</button>
          <button class="btn-sm" onclick="deleteMed(${m.id})" style="color:#ff6fc8">✕</button>
        </div>
      </div>
    `).join('');
  }

  load();
</script>
</body>
</html>
