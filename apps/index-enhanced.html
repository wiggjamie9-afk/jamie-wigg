<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#9333EA">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>RHYTHMIX Apps — 2026</title>
    <style>
        :root {
            --primary: #9333EA;
            --accent: #F97316;
            --secondary: #3B82F6;
            --success: #10B981;
            --bg: #0F172A;
            --light: #1E293B;
            --text: #F1F5F9;
            --text-secondary: #CBD5E1;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: linear-gradient(135deg, #0f172a 0%, #1a1a2e 50%, #1a1a2e 100%); color: var(--text); }
        
        .container { max-width: 600px; margin: 0 auto; padding: 20px; min-height: 100vh; }
        
        /* Hero header with glassmorphism */
        .header {
            text-align: center;
            margin-bottom: 32px;
            padding-top: 20px;
        }
        .header h1 {
            font-size: 36px;
            font-weight: 900;
            background: linear-gradient(135deg, #9333EA 0%, #F97316 50%, #3B82F6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
            letter-spacing: -1px;
        }
        .header p { color: var(--text-secondary); font-size: 15px; margin-bottom: 12px; }
        
        /* Status banner with gradient */
        .status-banner {
            background: linear-gradient(135deg, rgba(147, 51, 234, 0.2) 0%, rgba(249, 115, 22, 0.1) 100%);
            border: 1px solid rgba(147, 51, 234, 0.3);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 24px;
            backdrop-filter: blur(10px);
        }
        .status-banner p { font-size: 13px; color: var(--text-secondary); }
        
        /* Stats with glassmorphism */
        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
            margin-bottom: 32px;
        }
        .stat-card {
            background: rgba(147, 51, 234, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(147, 51, 234, 0.2);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
        }
        .stat-value { font-size: 24px; font-weight: 900; color: var(--primary); }
        .stat-label { font-size: 11px; color: var(--text-secondary); margin-top: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
        
        /* Search with modern styling */
        .search { margin-bottom: 24px; }
        input[type="text"] {
            width: 100%;
            padding: 14px 16px;
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(147, 51, 234, 0.3);
            border-radius: 12px;
            color: var(--text);
            font-size: 14px;
            backdrop-filter: blur(10px);
            transition: all 0.3s;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(30, 41, 59, 0.9);
            box-shadow: 0 0 20px rgba(147, 51, 234, 0.3);
        }
        input[type="text"]::placeholder { color: var(--text-secondary); }
        
        /* Category styling */
        .category { margin-bottom: 32px; }
        .category-title {
            font-size: 18px;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 2px solid rgba(147, 51, 234, 0.3);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        /* Modern app grid */
        .apps-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 12px;
        }
        .app-card {
            background: linear-gradient(135deg, rgba(147, 51, 234, 0.15), rgba(249, 115, 22, 0.05));
            border: 1px solid rgba(147, 51, 234, 0.2);
            border-radius: 16px;
            padding: 16px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            backdrop-filter: blur(10px);
            min-height: 160px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .app-card:hover {
            border-color: var(--primary);
            transform: translateY(-6px);
            box-shadow: 0 12px 40px rgba(147, 51, 234, 0.3);
            background: linear-gradient(135deg, rgba(147, 51, 234, 0.25), rgba(249, 115, 22, 0.1));
        }
        .app-card:active { transform: scale(0.92); }
        
        .app-emoji { font-size: 36px; margin-bottom: 8px; display: inline-block; }
        .app-name { font-size: 14px; font-weight: 700; margin-bottom: 4px; color: var(--text); }
        .app-desc { font-size: 11px; color: var(--text-secondary); }
        
        /* New badge */
        .badge { display: inline-block; background: linear-gradient(135deg, var(--accent), #ea580c); color: white; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: 700; margin-top: 6px; }
        
        /* Animations */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .app-card { animation: fadeIn 0.5s ease-out forwards; }
        .app-card:nth-child(1) { animation-delay: 0s; }
        .app-card:nth-child(2) { animation-delay: 0.05s; }
        .app-card:nth-child(3) { animation-delay: 0.1s; }
        .app-card:nth-child(4) { animation-delay: 0.15s; }
        .app-card:nth-child(5) { animation-delay: 0.2s; }
        .app-card:nth-child(6) { animation-delay: 0.25s; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎨 RHYTHMIX</h1>
            <p>77+ Beautiful Apps — 2026 Edition</p>
        </div>

        <div class="status-banner">
            <p><strong>✨ NEW:</strong> All apps now feature modern 2026 design with carousels, glassmorphism, and smooth animations. Perfect for iPhone & Android.</p>
        </div>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-value">77</div>
                <div class="stat-label">Apps</div>
            </div>
            <div class="stat-card">
                <div class="stat-value">7</div>
                <div class="stat-label">Categories</div>
            </div>
            <div class="stat-card">
                <div class="stat-value">100%</div>
                <div class="stat-label">Free</div>
            </div>
        </div>

        <div class="search">
            <input type="text" id="searchInput" placeholder="🔍 Search apps..." onkeyup="searchApps()">
        </div>

        <div id="appsContainer"></div>
    </div>

    <script>
        const apps = {
            'Health & Wellness': [
                { name: 'Blood Pressure Buddy', emoji: '❤️‍🩹', file: 'blood-pressure-buddy.html', desc: 'Heart health', new: false },
                { name: 'Calorie Counter', emoji: '🍎', file: 'calorie-counter.html', desc: 'Nutrition', new: false },
                { name: 'Meditation Guide', emoji: '🧘', file: 'meditation-guide.html', desc: 'Mindfulness', new: true },
                { name: 'Workout Timer', emoji: '💪', file: 'workout-timer.html', desc: 'Fitness', new: false },
                { name: 'Water Tracker', emoji: '💧', file: 'water-tracker.html', desc: 'Hydration', new: true },
                { name: 'Weight Tracker', emoji: '⚖️', file: 'weight-tracker.html', desc: 'Progress', new: false },
                { name: 'Period Tracker', emoji: '📅', file: 'period-tracker.html', desc: 'Cycle', new: false }
            ],
            'Finance & Money': [
                { name: 'Budget Tracker', emoji: '💰', file: 'budget-tracker.html', desc: 'Personal', new: false },
                { name: 'Expense Tracker', emoji: '💳', file: 'expense-tracker.html', desc: 'Spending', new: false },
                { name: 'Loan Calculator', emoji: '🏠', file: 'loan-calculator.html', desc: 'Planning', new: false },
                { name: 'Savings Challenge', emoji: '🎯', file: 'savings-challenge.html', desc: 'Goals', new: false },
                { name: 'Vendor Tracker', emoji: '📊', file: 'vendor-tracker.html', desc: 'Business', new: false }
            ],
            'Productivity & Learning': [
                { name: 'Daily Planner', emoji: '📋', file: 'daily-planner.html', desc: 'Tasks', new: false },
                { name: 'Study Planner', emoji: '📚', file: 'study-planner.html', desc: 'Education', new: false },
                { name: 'Habit Streak', emoji: '🔥', file: 'habit-streak.html', desc: 'Habits', new: false },
                { name: 'Pomodoro Timer', emoji: '🍅', file: 'pomodoro-timer.html', desc: 'Focus', new: false },
                { name: 'Task List', emoji: '✅', file: 'tasklist.html', desc: 'To-do', new: false },
                { name: 'Notes', emoji: '📝', file: 'notes.html', desc: 'Notes', new: false }
            ],
            'Creative & Community': [
                { name: 'Dreams', emoji: '✨', file: 'dreams.html', desc: 'Inspiration', new: false },
                { name: 'Hum', emoji: '🎵', file: 'hum.html', desc: 'Music', new: false },
                { name: 'Resonate', emoji: '🤝', file: 'resonate.html', desc: 'Community', new: false },
                { name: 'Quick Recipes', emoji: '🍳', file: 'quick-recipes.html', desc: 'Cooking', new: false },
                { name: 'Voice Notes', emoji: '🎙️', file: 'voice-notes.html', desc: 'Audio', new: false }
            ]
        };

        function renderApps(filter = '') {
            const container = document.getElementById('appsContainer');
            container.innerHTML = '';

            for (const [category, categoryApps] of Object.entries(apps)) {
                const filtered = categoryApps.filter(app =>
                    app.name.toLowerCase().includes(filter.toLowerCase()) ||
                    app.desc.toLowerCase().includes(filter.toLowerCase())
                );

                if (filtered.length === 0) continue;

                const categoryDiv = document.createElement('div');
                categoryDiv.className = 'category';
                categoryDiv.innerHTML = `<div class="category-title">${category}</div><div class="apps-grid"></div>`;

                const grid = categoryDiv.querySelector('.apps-grid');
                filtered.forEach(app => {
                    const card = document.createElement('div');
                    card.className = 'app-card';
                    card.onclick = () => window.location.href = app.file;
                    card.innerHTML = `
                        <div class="app-emoji">${app.emoji}</div>
                        <div class="app-name">${app.name}</div>
                        <div class="app-desc">${app.desc}</div>
                        ${app.new ? '<div class="badge">NEW</div>' : ''}
                    `;
                    grid.appendChild(card);
                });

                container.appendChild(categoryDiv);
            }
        }

        function searchApps() {
            const search = document.getElementById('searchInput').value;
            renderApps(search);
        }

        renderApps();
    </script>
</body>
</html>
