<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avatar Proxy Tester</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #0b1120;
            color: #f3f6fb;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }
        .container {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 20px;
        }
        h1 {
            margin-bottom: 20px;
            font-size: 24px;
            background: linear-gradient(135deg, #f59e0b, #06b6d4);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #c3cdda;
            margin-bottom: 6px;
            font-weight: 600;
        }
        input, textarea, select {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.04);
            color: #f3f6fb;
            font-family: inherit;
            font-size: 14px;
        }
        textarea {
            resize: vertical;
            min-height: 80px;
        }
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #f59e0b;
            background: rgba(255,255,255,0.08);
        }
        .button-group {
            display: flex;
            gap: 8px;
            margin-top: 20px;
        }
        button {
            flex: 1;
            padding: 12px 16px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #f59e0b, #06b6d4);
            color: white;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
        }
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .btn-secondary {
            background: rgba(255,255,255,0.1);
            color: #f3f6fb;
        }
        .btn-secondary:hover {
            background: rgba(255,255,255,0.15);
        }
        .status {
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            font-size: 12px;
            line-height: 1.6;
        }
        .status.success {
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: #86efac;
        }
        .status.error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
        }
        .status.info {
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.3);
            color: #93c5fd;
        }
        .status {
            display: none;
        }
        .status.show {
            display: block;
        }
        .spinner {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .result-image {
            margin-top: 20px;
            text-align: center;
        }
        .result-image img {
            max-width: 100%;
            height: auto;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        code {
            background: rgba(0,0,0,0.3);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>✨ Avatar Proxy Tester</h1>
        <p style="margin-bottom: 16px; font-size: 14px; color: #c3cdda;">
            Test the Higgsfield avatar generation proxy locally.
            Make sure the proxy is running: <code>node avatar-proxy-local.mjs</code>
        </p>

        <div class="form-group">
            <label for="endpoint">API Endpoint</label>
            <input type="text" id="endpoint" value="http://localhost:3001/api/higgsfield-generate" placeholder="http://localhost:3001/api/higgsfield-generate">
        </div>

        <div class="form-group">
            <label for="model">Model</label>
            <select id="model">
                <option value="soul">Soul (Text-to-Image)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="prompt">Buddy Description</label>
            <textarea id="prompt" placeholder="E.g., warm older mentor with kind eyes and gentle smile">warm older mentor with kind eyes and gentle smile</textarea>
        </div>

        <div class="button-group">
            <button class="btn-primary" id="generateBtn" onclick="generateAvatar()">Generate Avatar</button>
            <button class="btn-secondary" onclick="resetForm()">Reset</button>
        </div>

        <div id="statusMessage" class="status"></div>

        <div class="result-image" id="resultImage" style="display: none;">
            <p style="font-size: 12px; color: #c3cdda; margin-bottom: 12px;">Generated Avatar:</p>
            <img id="resultImg" alt="Generated avatar">
        </div>
    </div>

    <script>
        async function generateAvatar() {
            const endpoint = document.getElementById('endpoint').value;
            const model = document.getElementById('model').value;
            const prompt = document.getElementById('prompt').value;
            const button = document.getElementById('generateBtn');
            const statusEl = document.getElementById('statusMessage');

            if (!endpoint) {
                showStatus('Missing endpoint URL', 'error');
                return;
            }
            if (!prompt.trim()) {
                showStatus('Please enter a buddy description', 'error');
                return;
            }

            // Disable button and show loading
            button.disabled = true;
            const originalText = button.textContent;
            button.innerHTML = '<span class="spinner"></span> Generating...';
            document.getElementById('resultImage').style.display = 'none';

            try {
                showStatus('Sending request to ' + endpoint.split('?')[0] + '...', 'info');

                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt, model })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || `HTTP ${response.status}`);
                }

                if (data.imageUrl) {
                    // Show image
                    const img = document.getElementById('resultImg');
                    img.src = data.imageUrl;
                    img.onload = () => {
                        document.getElementById('resultImage').style.display = 'block';
                        showStatus('Avatar generated successfully!', 'success');
                    };
                    img.onerror = () => {
                        showStatus('Image loaded but failed to display. URL may be invalid.', 'error');
                    };
                } else {
                    throw new Error('No image URL in response');
                }

            } catch (error) {
                showStatus('Error: ' + error.message, 'error');
            } finally {
                button.disabled = false;
                button.textContent = originalText;
            }
        }

        function showStatus(message, type) {
            const el = document.getElementById('statusMessage');
            el.textContent = message;
            el.className = 'status show ' + type;
        }

        function resetForm() {
            document.getElementById('prompt').value = '';
            document.getElementById('statusMessage').classList.remove('show');
            document.getElementById('resultImage').style.display = 'none';
            document.getElementById('prompt').focus();
        }

        // Test endpoint on load
        window.addEventListener('load', async () => {
            const endpoint = document.getElementById('endpoint').value;
            try {
                const healthEndpoint = endpoint.replace('/api/higgsfield-generate', '/health');
                const response = await fetch(healthEndpoint);
                if (response.ok) {
                    const data = await response.json();
                    if (data.apiConfigured) {
                        showStatus('✓ Proxy connected and configured!', 'success');
                    } else {
                        showStatus('⚠ Proxy running but missing API credentials in .env', 'error');
                    }
                } else {
                    showStatus('✗ Proxy not responding. Start with: node avatar-proxy-local.mjs', 'error');
                }
            } catch (error) {
                showStatus('✗ Cannot reach proxy at ' + endpoint, 'error');
            }
        });
    </script>
</body>
</html>
