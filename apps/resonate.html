<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#08050d">
    <title>Resonate - AI Music Player</title>
    <style>
        :root { --canvas:#08050d; --green:#00e887; --red:#ff1f5a; --cyan:#00d8ff; --purple:#7c3aed; --text:#fff; --text-muted:#aaa; }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:var(--canvas); color:var(--text); min-height:100vh; padding-bottom:80px; }
        .header { padding:20px; border-bottom:1px solid rgba(0,232,135,0.2); display:flex; align-items:center; justify-content:space-between; }
        .title h1 { font-size:24px; font-weight:700; }
        .badge { background:var(--green); color:var(--canvas); padding:4px 12px; border-radius:20px; font-size:11px; font-weight:600; }
        .content { padding:20px; }
        .track-list { display:flex; flex-direction:column; gap:12px; }
        .track { background:rgba(0,232,135,0.05); border:1px solid rgba(0,232,135,0.2); border-radius:8px; padding:16px; display:flex; align-items:center; gap:12px; }
        .track.active { border-color:var(--green); background:rgba(0,232,135,0.15); }
        .play-btn { width:48px; height:48px; border-radius:50%; background:var(--green); color:var(--canvas); border:0; cursor:pointer; font-size:18px; flex-shrink:0; }
        .track-info { flex:1; }
        .track-name { font-weight:600; margin-bottom:4px; }
        .track-time { font-size:12px; color:var(--text-muted); }
        .fav { background:0; border:0; color:var(--text-muted); cursor:pointer; font-size:18px; }
        .fav.on { color:var(--red); }
        .tabs { position:fixed; bottom:0; left:0; right:0; background:var(--canvas); border-top:1px solid rgba(0,232,135,0.2); display:flex; justify-content:space-around; height:70px; z-index:100; }
        .tab { flex:1; background:0; border:0; color:var(--text-muted); cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; font-size:12px; }
        .tab.on { color:var(--green); }
        .panel { display:none; }
        .panel.on { display:block; }
        .premium { background:rgba(124,58,237,0.1); border-left:3px solid var(--purple); padding:12px; margin-top:20px; border-radius:4px; font-size:13px; }
        .item { padding:12px; border-bottom:1px solid rgba(0,232,135,0.1); }
        @media (min-width:480px) { .content { padding:24px; } }
    </style>
</head>
<body>
    <div class="header">
        <div class="title"><h1>♪ Resonate</h1></div>
        <div class="badge">FREE</div>
    </div>
    <div class="content">
        <div id="tracks" class="panel on">
            <div class="track-list" id="list"></div>
            <div class="premium">💎 Premium: 50+ tracks + offline</div>
        </div>
        <div id="favs" class="panel"></div>
        <div id="hist" class="panel"></div>
    </div>
    <div class="tabs">
        <button class="tab on" data-panel="tracks">♪ Tracks</button>
        <button class="tab" data-panel="favs">♡ Fav</button>
        <button class="tab" data-panel="hist">📊 History</button>
    </div>
    <script>
        const tracks = {'1':{n:'Ambient Dreams',t:'8:32'},'2':{n:'Meditation Flow',t:'10:15'},'3':{n:'Drone Cosmos',t:'12:00'},'4':{n:'Sleep Soundscape',t:'45:00'}};
        let st = {play:null, fav:new Set(), hist:[]};
        
        function load() {
            let d = localStorage.getItem('resonate');
            if (d) { let p = JSON.parse(d); st.fav = new Set(p.fav||[]); st.hist = p.hist||[]; }
        }
        
        function save() {
            localStorage.setItem('resonate', JSON.stringify({fav:[...st.fav], hist:st.hist}));
        }
        
        function draw() {
            document.getElementById('list').innerHTML = Object.entries(tracks).map(([k,v]) => 
                `<div class="track ${st.play===k?'active':''}" data-id="${k}">
                    <button class="play-btn">▶</button>
                    <div class="track-info">
                        <div class="track-name">${v.n}</div>
                        <div class="track-time">${v.t}</div>
                    </div>
                    <button class="fav ${st.fav.has(k)?'on':''}">♡</button>
                </div>`
            ).join('');
            
            document.getElementById('favs').innerHTML = st.fav.size ? 
                `<div>${[...st.fav].map(k => `<div class="item">♥ ${tracks[k].n}</div>`).join('')}</div>` :
                '<div style="padding:20px;color:var(--text-muted)">No favorites</div>';
            
            document.getElementById('hist').innerHTML = st.hist.length ?
                `<div>${st.hist.map(k => `<div class="item">▶ ${tracks[k].n}</div>`).join('')}</div>` :
                '<div style="padding:20px;color:var(--text-muted)">No history</div>';
        }
        
        function bind() {
            document.querySelectorAll('.play-btn').forEach((btn,i) => {
                let k = Object.keys(tracks)[i];
                btn.onclick = () => {
                    st.play = st.play === k ? null : k;
                    if (st.play === k && !st.hist.includes(k)) {
                        st.hist.unshift(k);
                        if (st.hist.length > 20) st.hist.pop();
                    }
                    save(); draw();
                };
            });
            
            document.querySelectorAll('.fav').forEach((btn,i) => {
                let k = Object.keys(tracks)[i];
                btn.onclick = (e) => {
                    e.stopPropagation();
                    if (st.fav.has(k)) st.fav.delete(k);
                    else st.fav.add(k);
                    save(); draw();
                };
            });
            
            document.querySelectorAll('.tab').forEach(btn => {
                btn.onclick = () => {
                    let p = btn.dataset.panel;
                    document.querySelectorAll('.tab').forEach(t => t.classList.remove('on'));
                    document.querySelectorAll('.panel').forEach(pl => pl.classList.remove('on'));
                    btn.classList.add('on');
                    document.getElementById(p).classList.add('on');
                };
            });
        }
        
        load(); draw(); bind();
        if ('serviceWorker' in navigator) navigator.serviceWorker.register('data:application/javascript,self.addEventListener("install",e=>self.skipWaiting());');
    </script>
</body>
</html>
