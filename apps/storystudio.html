<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#08050d">
    <title>StoryStudio</title>
    <style>
        :root { --canvas:#08050d; --green:#00e887; --red:#ff1f5a; --cyan:#00d8ff; --purple:#7c3aed; --text:#fff; --text-muted:#aaa; }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:var(--canvas); color:var(--text); min-height:100vh; padding-bottom:80px; }
        .header { padding:20px; border-bottom:1px solid rgba(0,232,135,0.2); display:flex; justify-content:space-between; }
        h1 { font-size:24px; font-weight:700; }
        .badge { background:var(--green); color:var(--canvas); padding:4px 12px; border-radius:20px; font-size:11px; }
        .content { padding:20px; }
        .template-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin:15px 0; }
        .template-btn { background:rgba(0,232,135,0.1); border:1px solid rgba(0,232,135,0.2); color:var(--text); padding:15px; border-radius:8px; cursor:pointer; font-weight:600; text-align:center; }
        .template-btn:hover { background:rgba(0,232,135,0.2); }
        input, textarea { background:rgba(0,232,135,0.05); border:1px solid rgba(0,232,135,0.2); border-radius:6px; color:var(--text); padding:10px; margin:8px 0; width:100%; }
        textarea { min-height:150px; font-family:inherit; resize:vertical; }
        button { background:var(--green); color:var(--canvas); border:0; padding:10px 16px; border-radius:6px; cursor:pointer; font-weight:600; width:100%; }
        .story-display { background:rgba(0,232,135,0.05); border:1px solid rgba(0,232,135,0.2); border-radius:8px; padding:20px; margin:15px 0; line-height:1.8; }
        .panel { display:none; }
        .panel.on { display:block; }
        .tabs { position:fixed; bottom:0; left:0; right:0; background:var(--canvas); border-top:1px solid rgba(0,232,135,0.2); display:flex; justify-content:space-around; height:70px; z-index:100; }
        .tab { flex:1; background:0; border:0; color:var(--text-muted); cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:12px; }
        .tab.on { color:var(--green); }
        .premium { background:rgba(124,58,237,0.1); border-left:3px solid var(--purple); padding:12px; margin-top:20px; border-radius:4px; font-size:13px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>📖 StoryStudio</h1>
        <div class="badge">FREE</div>
    </div>
    <div class="content">
        <div id="templates" class="panel on">
            <div style="font-weight:600;margin:15px 0">Select Template:</div>
            <div class="template-grid">
                <button class="template-btn" onclick="selectTemplate('hero')">⚔️ Hero's Journey</button>
                <button class="template-btn" onclick="selectTemplate('romance')">💕 Romance</button>
                <button class="template-btn" onclick="selectTemplate('mystery')">🔍 Mystery</button>
                <button class="template-btn" onclick="selectTemplate('adventure')">🗺️ Adventure</button>
            </div>
            <div class="premium">💎 Premium: AI story generation & editing</div>
        </div>
        
        <div id="editor" class="panel">
            <div style="font-weight:600;margin-bottom:10px" id="template-title"></div>
            <div id="form-fields"></div>
            <button onclick="generateStory()">Generate Story</button>
        </div>
        
        <div id="reader" class="panel">
            <div class="story-display" id="story-text"></div>
            <button onclick="copyStory()" style="margin-top:10px">Copy</button>
            <button onclick="document.querySelectorAll('.tab')[0].click()" style="background:var(--cyan);color:var(--canvas)">← New Story</button>
        </div>
    </div>
    <div class="tabs">
        <button class="tab on" data-p="templates">📚 Templates</button>
    </div>
    <script>
        const templates = {
            hero: {
                title: "Hero's Journey",
                fields: [{n:'Hero name',p:'e.g., Luke'},{n:'Villain name',p:'e.g., Darth'},{n:'Quest',p:'e.g., Save the realm'}],
                story: (h,v,q) => `${h} was an ordinary person until destiny called. ${v} had been oppressing the land for years, and ${h} knew something had to be done. With courage in their heart, ${h} embarked on a quest to ${q}. Through trials and tribulations, ${h} discovered inner strength and finally confronted ${v}. Against all odds, ${h} emerged victorious, and peace was restored.`
            },
            romance: {
                title: "Romance",
                fields: [{n:'Character 1',p:'e.g., Emma'},{n:'Character 2',p:'e.g., James'},{n:'Setting',p:'e.g., Paris'}],
                story: (c1,c2,s) => `${c1} had always dreamed of visiting ${s}, but never expected to fall in love. When ${c1} met ${c2} at a charming café, sparks flew immediately. They spent long nights walking through ${s}, sharing stories and dreams. ${c2} admired ${c1}'s spirit, while ${c1} was drawn to ${c2}'s kindness. As days turned to weeks, their bond deepened into true love. ${c1} and ${c2} decided ${s} would be the start of their forever.`
            },
            mystery: {
                title: "Mystery",
                fields: [{n:'Detective name',p:'e.g., Holmes'},{n:'Crime',p:'e.g., Stolen jewel'},{n:'Culprit clue',p:'e.g., Red scarf'}],
                story: (d,c,clue) => `Detective ${d} was called to investigate a baffling case: a ${c}. The crime scene was puzzling, with few clues except a ${clue}. ${d} interviewed suspects, examined evidence, and followed leads across the city. The ${clue} proved crucial—it led to an unexpected culprit. Just when the case seemed hopeless, ${d}'s keen deduction cracked it wide open. The criminal was apprehended, and ${d} solved another case.`
            },
            adventure: {
                title: "Adventure",
                fields: [{n:'Adventurer',p:'e.g., Indiana'},{n:'Treasure',p:'e.g., Lost city'},{n:'Challenge',p:'e.g., Ancient curse'}],
                story: (a,t,ch) => `${a} had heard legends of a ${t} hidden in remote lands. With a team of trusted companions, ${a} set out on a dangerous expedition. They faced extreme weather, treacherous terrain, and mysteries at every turn. The greatest challenge came when they encountered a ${ch}. Using wit and courage, ${a} overcame every obstacle. Finally, the ${t} was found, revealing treasures and knowledge beyond imagination. ${a}'s adventure would be remembered for generations.`
            }
        };
        
        let currentTemplate;
        
        function selectTemplate(t) {
            currentTemplate = t;
            let tpl = templates[t];
            document.getElementById('template-title').textContent = tpl.title;
            document.getElementById('form-fields').innerHTML = tpl.fields.map((f, i) =>
                `<label style="font-size:12px">${f.n}</label><input type="text" id="field-${i}" placeholder="${f.p}">`
            ).join('');
            
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('on'));
            document.getElementById('editor').classList.add('on');
        }
        
        function generateStory() {
            let tpl = templates[currentTemplate];
            let vals = tpl.fields.map((_, i) => document.getElementById(`field-${i}`).value).filter(v => v);
            if (vals.length !== tpl.fields.length) {
                alert('Please fill all fields');
                return;
            }
            
            let story = tpl.story(...vals);
            document.getElementById('story-text').textContent = story;
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('on'));
            document.getElementById('reader').classList.add('on');
        }
        
        function copyStory() {
            navigator.clipboard.writeText(document.getElementById('story-text').textContent);
            alert('Story copied!');
        }
        
        if ('serviceWorker' in navigator) navigator.serviceWorker.register('data:application/javascript,self.addEventListener("install",e=>self.skipWaiting());');
    </script>
</body>
</html>
