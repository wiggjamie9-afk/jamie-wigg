<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#08050d">
    <title>Budget Tracker</title>
    <style>
        :root { --canvas:#08050d; --green:#00e887; --red:#ff1f5a; --cyan:#00d8ff; --purple:#7c3aed; --text:#fff; --text-muted:#aaa; }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:var(--canvas); color:var(--text); min-height:100vh; padding-bottom:80px; }
        .header { padding:20px; border-bottom:1px solid rgba(0,232,135,0.2); display:flex; justify-content:space-between; }
        h1 { font-size:24px; font-weight:700; }
        .badge { background:var(--green); color:var(--canvas); padding:4px 12px; border-radius:20px; font-size:11px; }
        .content { padding:20px; }
        input, select { background:rgba(0,232,135,0.05); border:1px solid rgba(0,232,135,0.2); border-radius:6px; color:var(--text); padding:10px; margin:8px 0; width:100%; }
        button { background:var(--green); color:var(--canvas); border:0; padding:10px 16px; border-radius:6px; cursor:pointer; font-weight:600; width:100%; }
        .card { background:rgba(0,232,135,0.05); border:1px solid rgba(0,232,135,0.2); border-radius:8px; padding:15px; margin:12px 0; }
        .card-title { font-weight:600; margin-bottom:8px; }
        .amount { color:var(--green); font-size:18px; font-weight:700; }
        .item { display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid rgba(0,232,135,0.1); font-size:14px; }
        .panel { display:none; }
        .panel.on { display:block; }
        .tabs { position:fixed; bottom:0; left:0; right:0; background:var(--canvas); border-top:1px solid rgba(0,232,135,0.2); display:flex; justify-content:space-around; height:70px; z-index:100; }
        .tab { flex:1; background:0; border:0; color:var(--text-muted); cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:12px; }
        .tab.on { color:var(--green); }
        .premium { background:rgba(124,58,237,0.1); border-left:3px solid var(--purple); padding:12px; margin-top:20px; border-radius:4px; font-size:13px; }
        .cat-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin:10px 0; }
        .cat-btn { background:rgba(0,232,135,0.1); border:1px solid rgba(0,232,135,0.2); color:var(--text); padding:10px; border-radius:6px; cursor:pointer; }
        .cat-btn.on { background:var(--green); color:var(--canvas); }
    </style>
</head>
<body>
    <div class="header">
        <h1>💰 Budget</h1>
        <div class="badge">FREE</div>
    </div>
    <div class="content">
        <div id="add" class="panel on">
            <input type="number" id="amount" placeholder="Amount ($)" step="0.01" min="0">
            <select id="cat">
                <option>Food</option>
                <option>Transport</option>
                <option>Entertainment</option>
                <option>Utilities</option>
                <option>Other</option>
            </select>
            <input type="date" id="date">
            <button onclick="addExp()">+ Add Expense</button>
            
            <div class="card" style="margin-top:20px">
                <div class="card-title">Monthly Budget</div>
                <input type="number" id="budget" placeholder="Set budget ($)" step="0.01" min="0" style="margin-top:10px">
                <button onclick="setBudget()" style="margin-top:10px">Set Budget</button>
            </div>
            
            <div class="card">
                <div class="card-title">This Month</div>
                <div class="item"><span>Spent:</span><span class="amount" id="spent">$0</span></div>
                <div class="item"><span>Budget:</span><span id="bud-show">$0</span></div>
                <div class="item"><span>Remaining:</span><span id="rem" style="color:var(--green)">$0</span></div>
            </div>
            
            <div id="exp-list" style="margin-top:20px"></div>
            <div class="premium">💎 Premium: Advanced analytics & reports</div>
        </div>
        
        <div id="breakdown" class="panel">
            <div id="cat-breakdown"></div>
        </div>
    </div>
    <div class="tabs">
        <button class="tab on" data-p="add">➕ Add</button>
        <button class="tab" data-p="breakdown">📊 Breakdown</button>
    </div>
    <script>
        let exps = [];
        let budget = 0;
        let currentMonth = new Date().toISOString().slice(0,7);
        
        function load() {
            let d = localStorage.getItem('budget');
            if (d) {
                let p = JSON.parse(d);
                exps = p.exps || [];
                budget = p.budget || 0;
            }
            document.getElementById('date').valueAsDate = new Date();
            document.getElementById('budget').value = budget;
            draw();
        }
        
        function save() {
            localStorage.setItem('budget', JSON.stringify({exps, budget}));
            draw();
        }
        
        function addExp() {
            let a = parseFloat(document.getElementById('amount').value);
            let c = document.getElementById('cat').value;
            let d = document.getElementById('date').value;
            if (!a || !d) return;
            exps.push({a, c, d});
            document.getElementById('amount').value = '';
            save();
        }
        
        function setBudget() {
            budget = parseFloat(document.getElementById('budget').value) || 0;
            save();
        }
        
        function draw() {
            let thisMonth = exps.filter(x => x.d.startsWith(currentMonth));
            let spent = thisMonth.reduce((s,x) => s + x.a, 0);
            let rem = budget - spent;
            
            document.getElementById('spent').textContent = '$' + spent.toFixed(2);
            document.getElementById('bud-show').textContent = '$' + budget.toFixed(2);
            document.getElementById('rem').textContent = '$' + Math.max(0, rem).toFixed(2);
            document.getElementById('rem').style.color = rem < 0 ? 'var(--red)' : 'var(--green)';
            
            document.getElementById('exp-list').innerHTML = thisMonth.length ?
                thisMonth.map((x,i) => `<div class="item"><span>${x.c}</span><span style="color:var(--red)">-$${x.a.toFixed(2)}</span></div>`).join('') :
                '<p style="color:var(--text-muted)">No expenses</p>';
            
            let bycat = {};
            thisMonth.forEach(x => bycat[x.c] = (bycat[x.c]||0) + x.a);
            
            document.getElementById('cat-breakdown').innerHTML = Object.entries(bycat).length ?
                Object.entries(bycat).map(([c,a]) => 
                    `<div class="card"><div class="card-title">${c}</div><div class="amount">$${a.toFixed(2)}</div></div>`
                ).join('') :
                '<p style="padding:20px;color:var(--text-muted)">No expenses this month</p>';
        }
        
        document.querySelectorAll('.tab').forEach(t => {
            t.onclick = () => {
                document.querySelectorAll('.tab').forEach(x => x.classList.remove('on'));
                document.querySelectorAll('.panel').forEach(x => x.classList.remove('on'));
                t.classList.add('on');
                document.getElementById(t.dataset.p).classList.add('on');
            };
        });
        
        load();
        if ('serviceWorker' in navigator) navigator.serviceWorker.register('data:application/javascript,self.addEventListener("install",e=>self.skipWaiting());');
    </script>
</body>
</html>
