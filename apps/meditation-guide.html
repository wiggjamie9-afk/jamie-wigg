<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#08050d">
    <title>Meditation Guide</title>
    <style>
        :root { --canvas:#08050d; --green:#00e887; --red:#ff1f5a; --cyan:#00d8ff; --purple:#7c3aed; --text:#fff; --text-muted:#aaa; }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:var(--canvas); color:var(--text); min-height:100vh; padding-bottom:80px; }
        .header { padding:20px; border-bottom:1px solid rgba(0,232,135,0.2); display:flex; justify-content:space-between; }
        h1 { font-size:24px; font-weight:700; }
        .badge { background:var(--green); color:var(--canvas); padding:4px 12px; border-radius:20px; font-size:11px; }
        .content { padding:20px; }
        .exercise-card { background:rgba(0,232,135,0.05); border:1px solid rgba(0,232,135,0.2); border-radius:8px; padding:20px; margin:15px 0; text-align:center; }
        .exercise-title { font-weight:600; color:var(--cyan); margin-bottom:10px; }
        .duration-input { width:80px; background:rgba(0,232,135,0.05); border:1px solid rgba(0,232,135,0.2); border-radius:6px; color:var(--text); padding:8px; text-align:center; }
        button { background:var(--green); color:var(--canvas); border:0; padding:10px 16px; border-radius:6px; cursor:pointer; font-weight:600; width:100%; margin-top:10px; }
        .timer { font-size:48px; font-weight:700; color:var(--green); margin:20px 0; text-align:center; }
        .breathing-circle { width:100px; height:100px; border:3px solid var(--green); border-radius:50%; margin:20px auto; animation:breathe 8s infinite; }
        @keyframes breathe { 0%, 100% { transform:scale(1); opacity:0.8; } 50% { transform:scale(1.3); opacity:1; } }
        .guide-text { background:rgba(0,232,135,0.05); border:1px solid rgba(0,232,135,0.2); border-radius:8px; padding:15px; margin:15px 0; line-height:1.8; }
        .panel { display:none; }
        .panel.on { display:block; }
        .tabs { position:fixed; bottom:0; left:0; right:0; background:var(--canvas); border-top:1px solid rgba(0,232,135,0.2); display:flex; justify-content:space-around; height:70px; z-index:100; }
        .tab { flex:1; background:0; border:0; color:var(--text-muted); cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:12px; }
        .tab.on { color:var(--green); }
        .premium { background:rgba(124,58,237,0.1); border-left:3px solid var(--purple); padding:12px; margin-top:20px; border-radius:4px; font-size:13px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🧘 Meditation</h1>
        <div class="badge">FREE</div>
    </div>
    <div class="content">
        <div id="exercises" class="panel on">
            <div class="exercise-card">
                <div class="exercise-title">4-7-8 Breathing</div>
                <p style="font-size:12px;color:var(--text-muted);margin:10px 0">Inhale 4 counts, hold 7, exhale 8</p>
                <button onclick="startBreathing('478')">▶ Start</button>
            </div>
            
            <div class="exercise-card">
                <div class="exercise-title">Box Breathing</div>
                <p style="font-size:12px;color:var(--text-muted);margin:10px 0">Inhale, hold, exhale, hold (each 4 counts)</p>
                <button onclick="startBreathing('box')">▶ Start</button>
            </div>
            
            <div class="exercise-card">
                <div class="exercise-title">Guided Meditation</div>
                <select id="script-select" style="width:100%;background:rgba(0,232,135,0.05);border:1px solid rgba(0,232,135,0.2);border-radius:6px;color:var(--text);padding:10px;margin:10px 0">
                    <option value="body">Body Scan</option>
                    <option value="loving">Loving Kindness</option>
                    <option value="mindful">Mindfulness</option>
                </select>
                <button onclick="startMeditation()">▶ Begin</button>
            </div>
            
            <div class="premium">💎 Premium: Audio-guided meditations</div>
        </div>
        
        <div id="session" class="panel">
            <div class="timer" id="timer">0:00</div>
            <div id="breathing-visual"></div>
            <div id="guide-display" class="guide-text"></div>
            <button onclick="stopSession()" style="background:var(--red);color:var(--text)">Stop</button>
        </div>
    </div>
    <div class="tabs">
        <button class="tab on" data-p="exercises">📋 Exercises</button>
    </div>
    <script>
        let timeLeft = 0;
        let timerInterval = null;
        let sessionType = null;
        
        const scripts = {
            body: "Close your eyes. Feel your feet on the ground... Now scan up your legs... Feel your torso... Arms... Neck and face... Everything is calm...",
            loving: "Send love to yourself first... Then to a loved one... Extend it to a stranger... And to the whole world...",
            mindful: "Focus on your breath. Notice each inhale... Each exhale... Let thoughts pass like clouds... Return to the breath..."
        };
        
        function startBreathing(type) {
            sessionType = type;
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('on'));
            document.getElementById('session').classList.add('on');
            
            let text = type === '478' ? 'Breathe in (4)... Hold (7)... Out (8)' : 'Inhale... Hold... Exhale... Hold...';
            document.getElementById('guide-display').textContent = text;
            document.getElementById('breathing-visual').innerHTML = '<div class="breathing-circle"></div>';
            
            timeLeft = type === '478' ? 180 : 240;
            startTimer();
        }
        
        function startMeditation() {
            sessionType = 'meditation';
            let script = document.getElementById('script-select').value;
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('on'));
            document.getElementById('session').classList.add('on');
            document.getElementById('guide-display').textContent = scripts[script];
            document.getElementById('breathing-visual').innerHTML = '';
            
            timeLeft = 300;
            startTimer();
        }
        
        function startTimer() {
            timerInterval = setInterval(() => {
                let m = Math.floor(timeLeft / 60);
                let s = timeLeft % 60;
                document.getElementById('timer').textContent = `${m}:${s < 10 ? '0' : ''}${s}`;
                timeLeft--;
                if (timeLeft < 0) stopSession();
            }, 1000);
        }
        
        function stopSession() {
            clearInterval(timerInterval);
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('on'));
            document.getElementById('exercises').classList.add('on');
        }
        
        if ('serviceWorker' in navigator) navigator.serviceWorker.register('data:application/javascript,self.addEventListener("install",e=>self.skipWaiting());');
    </script>
</body>
</html>
