<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Meditation Guide: Find peace and calm">
    <meta name="theme-color" content="#06B6D4">
    <title>Meditation Guide – Breathe easy</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        :root {
            --primary: #9333EA;
            --secondary: #F97316;
            --accent: #3B82F6;
            --success: #10B981;
            --bg-dark: #0F172A;
            --bg-light: #1E293B;
            --text-primary: #F1F5F9;
            --text-secondary: #CBD5E1;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { font-family: system-ui, sans-serif; background: var(--bg-dark); color: var(--text-primary); min-height: 100vh; }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            min-height: 100vh;
        }

        .header {
            text-align: center;
            padding: 16px 0;
            border-bottom: 2px solid var(--primary);
        }

        .header h1 { font-size: 28px; margin-bottom: 4px; }

        .meditation-display {
            text-align: center;
            padding: 40px 16px;
            background: var(--bg-light);
            border-radius: 8px;
            border: 2px solid var(--primary);
        }

        .breathing-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 3px solid var(--primary);
            margin: 20px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: breathe 8s infinite;
        }

        @keyframes breathe {
            0%, 100% { transform: scale(1); opacity: 0.6; }
            50% { transform: scale(1.3); opacity: 1; }
        }

        .breathing-circle.paused {
            animation: none;
            transform: scale(1);
            opacity: 0.6;
        }

        .circle-text {
            font-size: 20px;
            font-weight: bold;
            color: var(--primary);
        }

        .meditation-info {
            margin-top: 16px;
        }

        .meditation-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .meditation-duration {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .timer-display {
            font-size: 32px;
            font-weight: bold;
            color: var(--primary);
            font-family: 'Courier New', monospace;
            margin-top: 16px;
        }

        .controls {
            display: flex;
            gap: 8px;
            margin-top: 16px;
        }

        button {
            flex: 1;
            padding: 12px 20px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:hover { opacity: 0.9; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        .stop-btn {
            background: #EF4444;
        }

        .meditation-list {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .meditation-card {
            padding: 12px;
            background: var(--bg-light);
            border-radius: 6px;
            border-left: 4px solid var(--secondary);
            cursor: pointer;
            transition: transform 0.2s;
        }

        .meditation-card:hover {
            transform: translateY(-2px);
        }

        .card-emoji {
            font-size: 24px;
            margin-bottom: 4px;
        }

        .card-title {
            font-weight: bold;
            font-size: 13px;
            margin-bottom: 4px;
        }

        .card-time {
            font-size: 11px;
            color: var(--text-secondary);
        }

        .stats {
            padding: 12px;
            background: var(--bg-light);
            border-radius: 6px;
            text-align: center;
            font-size: 14px;
        }

        .stat-number {
            font-size: 18px;
            font-weight: bold;
            color: var(--primary);
        }

        .stat-label {
            font-size: 11px;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🧘 Meditation Guide</h1>
        </div>

        <div id="sessionView" style="display: none;">
            <div class="meditation-display">
                <div class="breathing-circle" id="breathingCircle">
                    <div class="circle-text" id="breathText">Breathe</div>
                </div>
                <div class="meditation-info">
                    <div class="meditation-title" id="sessionTitle"></div>
                    <div class="meditation-duration" id="sessionDesc"></div>
                </div>
                <div class="timer-display" id="sessionTimer">00:00</div>
                <div class="controls">
                    <button id="pauseBtn" onclick="toggleSession()">Pause</button>
                    <button class="stop-btn" onclick="stopSession()">Stop</button>
                </div>
            </div>
        </div>

        <div id="menuView">
            <div class="stats">
                <div class="stat-number" id="totalSessions">0</div>
                <div class="stat-label">Sessions Completed</div>
            </div>

            <div class="meditation-list" id="meditationList"></div>
        </div>
    </div>

    <script>
        const meditations = [
            {
                id: 1,
                title: "Morning Calm",
                emoji: "🌅",
                duration: 5,
                description: "Start your day with peace"
            },
            {
                id: 2,
                title: "Breathing Basics",
                emoji: "💨",
                duration: 3,
                description: "Simple 4-7-8 breathing"
            },
            {
                id: 3,
                title: "Stress Relief",
                emoji: "😌",
                duration: 10,
                description: "Release tension"
            },
            {
                id: 4,
                title: "Evening Unwind",
                emoji: "🌙",
                duration: 7,
                description: "Relax before sleep"
            },
            {
                id: 5,
                title: "Focus Builder",
                emoji: "🎯",
                duration: 5,
                description: "Enhance concentration"
            },
            {
                id: 6,
                title: "Gratitude Session",
                emoji: "❤️",
                duration: 8,
                description: "Practice appreciation"
            },
            {
                id: 7,
                title: "Body Scan",
                emoji: "🧬",
                duration: 10,
                description: "Awareness meditation"
            },
            {
                id: 8,
                title: "Quick Reset",
                emoji: "⚡",
                duration: 2,
                description: "2-minute recharge"
            }
        ];

        let currentSession = null;
        let sessionTimer = null;
        let sessionTimeLeft = 0;
        let isSessionRunning = false;

        const appState = {
            sessions: JSON.parse(localStorage.getItem('meditationSessions')) || [],

            save() {
                localStorage.setItem('meditationSessions', JSON.stringify(this.sessions));
            }
        };

        function startMeditation(id) {
            currentSession = meditations.find(m => m.id === id);
            if (!currentSession) return;

            sessionTimeLeft = currentSession.duration * 60;
            isSessionRunning = true;

            document.getElementById('menuView').style.display = 'none';
            document.getElementById('sessionView').style.display = 'block';
            document.getElementById('sessionTitle').textContent = currentSession.title;
            document.getElementById('sessionDesc').textContent = currentSession.description;
            document.getElementById('pauseBtn').textContent = 'Pause';

            runSession();
        }

        function runSession() {
            document.getElementById('breathingCircle').classList.remove('paused');
            updateTimer();

            sessionTimer = setInterval(() => {
                sessionTimeLeft--;
                updateTimer();

                if (sessionTimeLeft <= 0) {
                    completeSession();
                }
            }, 1000);
        }

        function updateTimer() {
            const mins = Math.floor(sessionTimeLeft / 60);
            const secs = sessionTimeLeft % 60;
            document.getElementById('sessionTimer').textContent =
                `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        }

        function toggleSession() {
            if (isSessionRunning) {
                clearInterval(sessionTimer);
                isSessionRunning = false;
                document.getElementById('breathingCircle').classList.add('paused');
                document.getElementById('pauseBtn').textContent = 'Resume';
                showToast('Session paused', 'info');
            } else {
                isSessionRunning = true;
                document.getElementById('breathingCircle').classList.remove('paused');
                document.getElementById('pauseBtn').textContent = 'Pause';
                runSession();
            }
        }

        function stopSession() {
            clearInterval(sessionTimer);
            document.getElementById('menuView').style.display = 'block';
            document.getElementById('sessionView').style.display = 'none';
            showToast('Session ended', 'info');
            currentSession = null;
        }

        function completeSession() {
            clearInterval(sessionTimer);

            const session = {
                id: Date.now(),
                title: currentSession.title,
                duration: currentSession.duration,
                date: new Date().toLocaleDateString()
            };

            appState.sessions.unshift(session);
            appState.save();

            document.getElementById('menuView').style.display = 'block';
            document.getElementById('sessionView').style.display = 'none';
            showToast(`Great job! Session complete! 🧘`, 'success');
            render();
        }

        function render() {
            const list = document.getElementById('meditationList');
            const stats = document.getElementById('totalSessions');

            stats.textContent = appState.sessions.length;

            list.innerHTML = meditations.map(med => `
                <div class="meditation-card" onclick="startMeditation(${med.id})">
                    <div class="card-emoji">${med.emoji}</div>
                    <div class="card-title">${med.title}</div>
                    <div class="card-time">${med.duration} min</div>
                </div>
            `).join('');
        }

        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            toast.style.cssText = `
                position: fixed;
                bottom: 20px;
                left: 50%;
                transform: translateX(-50%);
                padding: 12px 20px;
                background: ${type === 'success' ? '#10B981' : type === 'error' ? '#EF4444' : '#6366F1'};
                color: white;
                border-radius: 6px;
                font-size: 14px;
                z-index: 1000;
            `;
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        render();
    </script>
</body>
</html>
