<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>MathTutor Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #10b981;
            --accent: #06b6d4;
            --bg: #0f172a;
            --bg-secondary: #1a1f3a;
            --text: #f8fafc;
            --text-secondary: #cbd5e1;
            --border: rgba(255,255,255,0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
            width: 100%;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, var(--bg) 0%, #1a1f3a 100%);
            background-attachment: fixed;
            color: var(--text);
            overflow: hidden;
        }

        .app {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding-top: max(env(safe-area-inset-top), 12px);
        }

        .header {
            padding: 16px 20px;
            font-size: 28px;
            font-weight: 700;
            background: rgba(30, 41, 59, 0.4);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .carousel-container {
            flex: 1;
            overflow: hidden;
            position: relative;
            width: 100%;
        }

        .carousel {
            display: flex;
            height: 100%;
            width: 100%;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            touch-action: none;
        }

        .screen {
            flex-shrink: 0;
            width: 100%;
            height: 100%;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 20px;
            padding-bottom: 80px;
        }

        .screen-title {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 24px;
            letter-spacing: -0.5px;
        }

        /* HOME SCREEN */
        .home-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }

        .feature-card {
            background: rgba(16, 185, 129, 0.08);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 24px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            min-height: 140px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .feature-card::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        .feature-card:active {
            transform: scale(0.98);
        }

        .feature-card:active::before {
            opacity: 1;
        }

        .feature-icon {
            font-size: 40px;
            margin-bottom: 12px;
        }

        .feature-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text);
        }

        .feature-desc {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.4;
        }

        /* INPUT AREA */
        .input-box {
            background: rgba(16, 185, 129, 0.05);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .input-label {
            font-size: 12px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            display: block;
            font-weight: 600;
        }

        input[type="text"], textarea {
            width: 100%;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px;
            color: var(--text);
            font-family: 'JetBrains Mono', monospace;
            font-size: 16px;
            margin-bottom: 12px;
            resize: vertical;
            min-height: 100px;
        }

        input[type="text"]:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(16, 185, 129, 0.1);
        }

        /* UPLOAD */
        .upload-box {
            border: 2px dashed var(--primary);
            border-radius: 20px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: rgba(16, 185, 129, 0.05);
            min-height: 300px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
        }

        .upload-box:active {
            background: rgba(16, 185, 129, 0.1);
            transform: scale(0.98);
        }

        .upload-icon {
            font-size: 60px;
            margin-bottom: 16px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .upload-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .upload-subtitle {
            font-size: 14px;
            color: var(--text-secondary);
        }

        input[type="file"] {
            display: none;
        }

        /* SOLUTION */
        .solution-box {
            background: rgba(16, 185, 129, 0.08);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
        }

        .step {
            background: rgba(16, 185, 129, 0.05);
            border-left: 4px solid var(--primary);
            padding: 12px;
            margin-bottom: 12px;
            border-radius: 8px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
        }

        .step-num {
            font-weight: 600;
            color: var(--primary);
            font-size: 11px;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .answer-box {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: #0f172a;
            padding: 16px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 18px;
            text-align: center;
            font-family: 'JetBrains Mono', monospace;
            margin-top: 12px;
        }

        /* BUTTONS */
        .btn {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: #0f172a;
            border: none;
            border-radius: 12px;
            padding: 14px 24px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
            min-height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
            width: 100%;
        }

        .btn:active {
            transform: scale(0.96);
            box-shadow: 0 2px 6px rgba(16, 185, 129, 0.2);
        }

        .btn-small {
            width: 52px;
            height: 52px;
            padding: 0;
            border-radius: 12px;
            font-size: 20px;
        }

        .btn-group {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        /* PRACTICE */
        .problem-card {
            background: rgba(16, 185, 129, 0.08);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            text-align: center;
            font-family: 'JetBrains Mono', monospace;
        }

        .problem-text {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 20px;
            color: var(--text);
        }

        .pagination {
            position: fixed;
            bottom: max(env(safe-area-inset-bottom), 20px);
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            z-index: 100;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255,255,255,0.3);
            cursor: pointer;
            transition: all 0.3s;
        }

        .dot.active {
            background: var(--primary);
            width: 28px;
            border-radius: 4px;
        }

        /* PROGRESS */
        .progress-bar {
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            overflow: hidden;
            margin: 20px 0;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            transition: width 0.2s;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.2);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* RESPONSIVE */
        @media (max-width: 480px) {
            .app-header {
                padding: 0 16px;
                margin-bottom: 16px;
            }

            .app-title {
                font-size: 24px;
            }

            .swiper {
                padding: 0 16px;
            }

            .screen-title {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>
    <div class="app">
        <div class="header">🧮 MathTutor</div>

        <div class="carousel-container">
            <div class="carousel" id="carousel">
                <!-- SCREEN 0: HOME -->
                <div class="screen">
                        <div class="screen-title">Math Help</div>
                        <div class="home-grid">
                            <div class="feature-card" onclick="goTo(1)">
                                <div class="feature-icon">🔢</div>
                                <div class="feature-title">Solve</div>
                                <div class="feature-desc">Get step-by-step solutions instantly</div>
                            </div>
                            <div class="feature-card" onclick="goTo(2)">
                                <div class="feature-icon">💬</div>
                                <div class="feature-title">Ask Tutor</div>
                                <div class="feature-desc">Chat with your AI math assistant</div>
                            </div>
                            <div class="feature-card" onclick="goTo(3)">
                                <div class="feature-icon">📝</div>
                                <div class="feature-title">Practice</div>
                                <div class="feature-desc">Generate and solve practice problems</div>
                            </div>
                        </div>
                </div>

                <!-- SCREEN 1: SOLVE -->
                <div class="screen">
                        <div class="screen-title">Problem Solver</div>
                        <div class="input-box">
                            <label class="input-label">Type or Upload</label>
                            <textarea id="problemInput" placeholder="e.g., 2x + 5 = 13"></textarea>
                            <button class="btn" onclick="solveProblem()">Solve</button>
                        </div>

                        <div class="input-box" style="border:2px dashed var(--primary); background:transparent;">
                            <label class="input-label">Or Snap a Photo</label>
                            <div class="upload-box" onclick="document.getElementById('fileInput').click()" style="margin:0;">
                                <div class="upload-icon" style="font-size:40px; margin:10px 0;">📸</div>
                                <div class="upload-subtitle">Tap to upload</div>
                                <input type="file" id="fileInput" accept="image/*" onchange="handlePhotoUpload(event)">
                            </div>
                            <div id="ocrProgress" style="display:none; margin-top:16px;">
                                <div class="spinner" style="margin:0 auto 12px;"></div>
                                <div style="font-size:12px;">Reading... <span id="ocrPercent">0</span>%</div>
                                <div class="progress-bar"><div class="progress-fill" id="ocrFill"></div></div>
                            </div>
                        </div>

                        <div id="solutionContainer"></div>
                </div>

                <!-- SCREEN 2: CHAT -->
                <div class="screen">
                        <div class="screen-title">Ask Tutor</div>
                        <div class="input-box">
                            <label class="input-label">Your Question</label>
                            <textarea id="chatInput" placeholder="Ask anything about math..."></textarea>
                            <button class="btn" onclick="sendMessage()">Send</button>
                        </div>
                </div>

                <!-- SCREEN 3: CHAT OUTPUT -->
                <div class="screen">
                        <div class="screen-title">Tutor Response</div>
                        <div id="chatOutput" style="font-size:16px; line-height:1.6; color:var(--text-secondary);">
                            Your tutor response will appear here...
                        </div>
                </div>

                <!-- SCREEN 4: PRACTICE -->
                <div class="screen">
                        <div class="screen-title">Practice</div>
                        <button class="btn" onclick="generateProblem()" style="margin-bottom:20px;">New Problem</button>
                        <div class="problem-card" id="practiceContent">
                            <div class="problem-text">5 + 3 = ?</div>
                            <button class="btn" onclick="alert('Answer: 8')">Show Answer</button>
                        </div>
                </div>
            </div>
        </div>

        <div class="pagination">
            <div class="dot active" onclick="goTo(0)"></div>
            <div class="dot" onclick="goTo(1)"></div>
            <div class="dot" onclick="goTo(2)"></div>
            <div class="dot" onclick="goTo(3)"></div>
            <div class="dot" onclick="goTo(4)"></div>
        </div>
    </div>

    <script>
        const carousel = document.getElementById('carousel');
        let currentIndex = 0;
        let startX = 0;
        let currentX = 0;
        let isDragging = false;

        carousel.addEventListener('touchstart', (e) => {
            startX = e.touches[0].clientX;
            isDragging = true;
        });

        carousel.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            currentX = e.touches[0].clientX;
            const diff = currentX - startX;
            carousel.style.transition = 'none';
            carousel.style.transform = `translateX(calc(-${currentIndex * 100}% + ${diff}px))`;
        });

        carousel.addEventListener('touchend', () => {
            isDragging = false;
            const diff = currentX - startX;
            const threshold = 50;

            if (Math.abs(diff) > threshold) {
                if (diff > 0 && currentIndex > 0) {
                    currentIndex--;
                } else if (diff < 0 && currentIndex < 4) {
                    currentIndex++;
                }
            }

            updateCarousel();
        });

        function goTo(index) {
            currentIndex = index;
            updateCarousel();
        }

        function updateCarousel() {
            carousel.style.transition = 'transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1)';
            carousel.style.transform = `translateX(-${currentIndex * 100}%)`;

            document.querySelectorAll('.dot').forEach((dot, i) => {
                dot.classList.toggle('active', i === currentIndex);
            });
        }

        async function handlePhotoUpload(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async (evt) => {
                document.getElementById('ocrProgress').style.display = 'block';

                try {
                    const result = await Tesseract.recognize(evt.target.result, 'eng', {
                        logger: m => {
                            if (m.status === 'recognizing') {
                                const p = Math.round(m.progress * 100);
                                document.getElementById('ocrPercent').textContent = p;
                                document.getElementById('ocrFill').style.width = p + '%';
                            }
                        }
                    });

                    document.getElementById('problemInput').value = result.data.text.trim();
                    document.getElementById('ocrProgress').style.display = 'none';
                    solveProblem();
                } catch (err) {
                    alert('Error reading image');
                    document.getElementById('ocrProgress').style.display = 'none';
                }
            };
            reader.readAsDataURL(file);
        }

        function solveProblem() {
            const problem = document.getElementById('problemInput').value.trim();
            if (!problem) return;

            const steps = [
                `Problem: ${problem}`,
                'Identify the equation type',
                'Apply mathematical operations',
                'Verify the solution'
            ];

            let answer = 'x = 4';
            const html = `
                <div class="solution-box">
                    <h3 style="margin-bottom:16px; color:var(--primary);">Solution</h3>
                    ${steps.map((s, i) => `<div class="step"><div class="step-num">Step ${i+1}</div>${s}</div>`).join('')}
                    <div class="answer-box">${answer}</div>
                </div>
            `;
            document.getElementById('solutionContainer').innerHTML = html;

            const utterance = new SpeechSynthesisUtterance(steps.join('. ') + '. Answer: ' + answer);
            utterance.rate = 0.9;
            window.speechSynthesis.speak(utterance);
        }

        function sendMessage() {
            const msg = document.getElementById('chatInput').value.trim();
            if (!msg) return;
            document.getElementById('chatOutput').innerHTML = `Great question about "${msg}". Your tutor says: That's an interesting problem! Let me help you work through it step by step.`;
            goTo(3);
        }

        function generateProblem() {
            const problems = [
                { text: '2x + 5 = 13', answer: 'x = 4' },
                { text: '3x - 7 = 8', answer: 'x = 5' },
                { text: '45% of 200 = ?', answer: '90' },
                { text: '100 ÷ 4 = ?', answer: '25' }
            ];
            const p = problems[Math.floor(Math.random() * problems.length)];
            document.getElementById('practiceContent').innerHTML = `
                <div class="problem-text">${p.text}</div>
                <button class="btn" onclick="alert('Answer: ${p.answer}')" style="margin-top:16px;">Show Answer</button>
            `;
        }

        generateProblem();
    </script>
</body>
</html>
