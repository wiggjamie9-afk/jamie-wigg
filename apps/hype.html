<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#08050d">
    <title>Hype - Daily Motivation</title>
    <style>
        :root { --canvas:#08050d; --green:#00e887; --red:#ff1f5a; --cyan:#00d8ff; --purple:#7c3aed; --text:#fff; --text-muted:#aaa; }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:var(--canvas); color:var(--text); min-height:100vh; padding-bottom:80px; }
        .header { padding:20px; border-bottom:1px solid rgba(0,232,135,0.2); display:flex; justify-content:space-between; }
        h1 { font-size:24px; font-weight:700; }
        .badge { background:var(--green); color:var(--canvas); padding:4px 12px; border-radius:20px; font-size:11px; }
        .content { padding:20px; }
        .motivation-card { background:linear-gradient(135deg,rgba(0,232,135,0.1),rgba(0,216,255,0.1)); border:1px solid rgba(0,232,135,0.2); border-radius:12px; padding:30px; margin:20px 0; text-align:center; min-height:150px; display:flex; flex-direction:column; justify-content:center; }
        .quote { font-size:24px; font-weight:700; line-height:1.6; margin:15px 0; }
        .author { font-size:12px; color:var(--text-muted); font-style:italic; }
        button { background:var(--green); color:var(--canvas); border:0; padding:12px 20px; border-radius:6px; cursor:pointer; font-weight:600; width:100%; margin-top:10px; }
        .hype-meter { background:rgba(0,232,135,0.1); border-radius:8px; padding:15px; margin:15px 0; }
        .meter-bar { background:rgba(0,232,135,0.2); height:30px; border-radius:6px; overflow:hidden; margin:10px 0; }
        .meter-fill { background:linear-gradient(90deg,var(--cyan),var(--green)); height:100%; width:75%; display:flex; align-items:center; justify-content:center; color:var(--canvas); font-weight:600; font-size:12px; }
        .streak { font-size:18px; color:var(--green); font-weight:700; text-align:center; margin:20px 0; }
        .checkin-btn { background:var(--purple); color:var(--text); border:0; padding:15px; border-radius:8px; cursor:pointer; font-weight:600; width:100%; font-size:16px; }
        .panel { display:none; }
        .panel.on { display:block; }
        .tabs { position:fixed; bottom:0; left:0; right:0; background:var(--canvas); border-top:1px solid rgba(0,232,135,0.2); display:flex; justify-content:space-around; height:70px; z-index:100; }
        .tab { flex:1; background:0; border:0; color:var(--text-muted); cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:12px; }
        .tab.on { color:var(--green); }
        .premium { background:rgba(124,58,237,0.1); border-left:3px solid var(--purple); padding:12px; margin-top:20px; border-radius:4px; font-size:13px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🔥 Hype</h1>
        <div class="badge">FREE</div>
    </div>
    <div class="content">
        <div id="hype" class="panel on">
            <div class="motivation-card">
                <div class="quote" id="quote">"You've got this!"</div>
                <div class="author" id="author"></div>
            </div>
            
            <button onclick="newQuote()" style="background:var(--cyan);color:var(--canvas)">Get Motivated</button>
            
            <div class="hype-meter">
                <div style="font-weight:600;margin-bottom:8px">Hype Level</div>
                <div class="meter-bar">
                    <div class="meter-fill" id="meter" style="width:50%">50%</div>
                </div>
            </div>
            
            <div class="streak">
                🔥 <span id="streak-num">0</span> Days Fired Up
            </div>
            
            <button class="checkin-btn" onclick="checkIn()">✓ Check In Today</button>
            
            <div class="premium">💎 Premium: Custom messages & team challenges</div>
        </div>
    </div>
    <div class="tabs">
        <button class="tab on" data-p="hype">🎯 Hype</button>
    </div>
    <script>
        const quotes = [
            'You are unstoppable',
            'Great things take time',
            'Every day is a new opportunity',
            'You are capable of amazing things',
            'Your potential is limitless',
            'Success is a journey, not a destination',
            'You got this!',
            'Be the energy you want'
        ];
        
        let state = {streak: 0, lastCheckin: null, hype: 50};
        
        function load() {
            let d = localStorage.getItem('hype');
            if (d) state = JSON.parse(d);
            draw();
        }
        
        function save() {
            localStorage.setItem('hype', JSON.stringify(state));
            draw();
        }
        
        function newQuote() {
            let q = quotes[Math.floor(Math.random() * quotes.length)];
            document.getElementById('quote').textContent = `"${q}"`;
            state.hype = Math.min(100, state.hype + 5);
            save();
        }
        
        function checkIn() {
            let today = new Date().toDateString();
            if (state.lastCheckin !== today) {
                state.streak++;
                state.lastCheckin = today;
                state.hype = 100;
            }
            save();
        }
        
        function draw() {
            document.getElementById('streak-num').textContent = state.streak;
            document.getElementById('meter').style.width = state.hype + '%';
            document.getElementById('meter').textContent = state.hype + '%';
        }
        
        load();
        if ('serviceWorker' in navigator) navigator.serviceWorker.register('data:application/javascript,self.addEventListener("install",e=>self.skipWaiting());');
    </script>
</body>
</html>
