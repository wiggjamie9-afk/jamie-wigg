<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loan Calculator – Understand Your Debt</title>
    <style>
        :root { --primary: #F59E0B; --bg-dark: #0F172A; --bg-light: #1E293B; --text-primary: #F1F5F9; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { font-family: -apple-system, sans-serif; background: var(--bg-dark); color: var(--text-primary); }
        .container { max-width: 480px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }
        .header { background: linear-gradient(135deg, var(--primary) 0%, #D97706 100%); padding: 24px 20px; text-align: center; }
        .header h1 { font-size: 28px; margin-bottom: 4px; }
        .content { flex: 1; padding: 20px; overflow-y: auto; }
        .card { background: var(--bg-light); border-radius: 12px; padding: 16px; margin-bottom: 16px; border-left: 4px solid var(--primary); }
        .card h2 { font-size: 16px; margin-bottom: 12px; font-weight: 700; }
        input { width: 100%; padding: 10px 12px; background: var(--bg-dark); border: 2px solid #334155; border-radius: 8px; color: var(--text-primary); margin-bottom: 10px; font-size: 13px; }
        input:focus { outline: none; border-color: var(--primary); }
        button { width: 100%; padding: 12px; background: var(--primary); border: none; border-radius: 8px; color: #0F172A; font-weight: 600; cursor: pointer; }
        button:hover { background: #D97706; }
        .result { background: var(--bg-dark); padding: 12px; border-radius: 6px; margin-bottom: 8px; }
        .result-label { font-size: 12px; color: #CBD5E1; }
        .result-value { font-size: 18px; font-weight: 700; color: var(--primary); }
        .label { display: block; font-size: 12px; color: #CBD5E1; margin-bottom: 4px; font-weight: 600; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏦 LOAN CALCULATOR</h1>
            <p style="font-size: 12px;">Understand your loan</p>
        </div>
        <div class="content">
            <div class="card">
                <h2>Enter Loan Details</h2>
                <label>Loan amount (₹)</label>
                <input type="number" id="principal" placeholder="100000" min="0">
                <label>Annual interest rate (%)</label>
                <input type="number" id="rate" placeholder="10" step="0.01" min="0">
                <label>Loan duration (years)</label>
                <input type="number" id="years" placeholder="5" min="1">
                <button onclick="calculate()">Calculate</button>
            </div>

            <div class="card">
                <h2>📊 Results</h2>
                <div class="result">
                    <div class="result-label">Monthly payment</div>
                    <div class="result-value" id="monthly">₹0</div>
                </div>
                <div class="result">
                    <div class="result-label">Total interest paid</div>
                    <div class="result-value" id="totalInt">₹0</div>
                </div>
                <div class="result">
                    <div class="result-label">Total amount to pay</div>
                    <div class="result-value" id="totalAmount">₹0</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function calculate() {
            const p = parseFloat(document.getElementById('principal').value) || 0;
            const r = parseFloat(document.getElementById('rate').value) / 100 / 12;
            const n = parseFloat(document.getElementById('years').value) * 12;

            if (p <= 0 || n <= 0) return;

            const emi = (p * r * Math.pow(1 + r, n)) / (Math.pow(1 + r, n) - 1);
            const totalPaid = emi * n;
            const totalInt = totalPaid - p;

            document.getElementById('monthly').textContent = '₹' + emi.toFixed(2);
            document.getElementById('totalInt').textContent = '₹' + totalInt.toFixed(2);
            document.getElementById('totalAmount').textContent = '₹' + totalPaid.toFixed(2);
        }
    </script>
</body>
</html>
