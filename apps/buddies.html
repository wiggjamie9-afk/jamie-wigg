<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>50 AI Buddy Apps — Swipe to choose</title>
  <meta name="theme-color" content="#060912">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    :root {
      --bg: #060912;
      --glass: rgba(255,255,255,0.06);
      --glass-border: rgba(255,255,255,0.12);
      --blur: 22px;
    }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: #f0f0f0;
      display: flex;
      flex-direction: column;
      padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    }

    /* Ambient mesh */
    @keyframes meshDrift { 0% { background-position: 0% 0%; } 100% { background-position: 100% 100%; } }
    body::before {
      content: '';
      position: fixed; inset: 0;
      background:
        radial-gradient(60% 50% at 20% 20%, rgba(139,92,246,0.18), transparent 70%),
        radial-gradient(50% 50% at 85% 30%, rgba(59,130,246,0.16), transparent 70%),
        radial-gradient(55% 55% at 50% 90%, rgba(236,72,153,0.14), transparent 70%);
      background-size: 200% 200%, 200% 200%, 200% 200%;
      animation: meshDrift 24s ease-in-out infinite alternate;
      pointer-events: none; z-index: 0;
    }

    /* Header */
    .header { position: relative; z-index: 2; text-align: center; padding: 22px 20px 8px; }
    .header h1 {
      font-size: 26px; font-weight: 800; letter-spacing: -0.5px;
      background: linear-gradient(135deg, #c4b5fd, #93c5fd);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .header p { font-size: 13px; color: #9aa3b2; margin-top: 4px; }

    /* Category chips */
    .chips {
      position: relative; z-index: 2;
      display: flex; gap: 8px; overflow-x: auto; padding: 14px 20px 6px;
      scrollbar-width: none;
    }
    .chips::-webkit-scrollbar { display: none; }
    .chip {
      flex: 0 0 auto;
      padding: 9px 16px; border-radius: 100px;
      background: var(--glass); border: 1px solid var(--glass-border);
      color: #cbd5e1; font-size: 13px; font-weight: 600; cursor: pointer;
      backdrop-filter: blur(var(--blur)); -webkit-backdrop-filter: blur(var(--blur));
      transition: all 0.25s cubic-bezier(0.34,1.56,0.64,1);
      white-space: nowrap;
    }
    .chip.active { background: rgba(255,255,255,0.16); color: #fff; border-color: rgba(255,255,255,0.3); transform: scale(1.04); }

    /* Carousel track */
    .carousel {
      position: relative; z-index: 1;
      flex: 1;
      display: flex; align-items: center;
      overflow-x: scroll; overflow-y: hidden;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      scroll-behavior: smooth;
      scrollbar-width: none;
      scroll-padding: 0 9vw;
      padding: 8px 9vw;
    }
    .carousel::-webkit-scrollbar { display: none; }

    /* Peek card (App Store Today style) */
    .card {
      flex: 0 0 82vw;
      max-width: 380px;
      height: min(64vh, 540px);
      scroll-snap-align: center;
      border-radius: 30px;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(var(--blur)); -webkit-backdrop-filter: blur(var(--blur));
      box-shadow: 0 24px 60px -20px rgba(0,0,0,0.6);
      display: flex; flex-direction: column;
      padding: 30px 26px;
      position: relative; overflow: hidden;
      transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1), opacity 0.4s ease;
      transform: scale(0.92); opacity: 0.55;
      margin-right: 4vw;
      cursor: pointer;
    }
    .card:last-child { margin-right: 0; }
    .card.is-center { transform: scale(1); opacity: 1; }

    /* per-card glow bloom */
    .card .bloom {
      position: absolute; top: -30%; left: 50%; transform: translateX(-50%);
      width: 120%; height: 60%;
      background: radial-gradient(circle, var(--glow, #8b5cf6) 0%, transparent 65%);
      opacity: 0.35; filter: blur(40px); pointer-events: none;
    }
    .card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.35), transparent);
    }

    .card .emoji {
      font-size: 88px; line-height: 1; text-align: center; margin-top: 18px;
      filter: drop-shadow(0 8px 22px rgba(0,0,0,0.4));
    }
    .card .cat-tag {
      align-self: center; margin-top: 22px;
      font-size: 11px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase;
      padding: 5px 12px; border-radius: 100px;
      background: color-mix(in srgb, var(--glow) 22%, transparent);
      color: var(--glow);
      border: 1px solid color-mix(in srgb, var(--glow) 40%, transparent);
    }
    .card .name { font-size: 28px; font-weight: 800; text-align: center; margin-top: 18px; letter-spacing: -0.5px; }
    .card .desc { font-size: 15px; color: #aab3c2; text-align: center; margin-top: 10px; line-height: 1.5; flex: 1; }
    .card .open-btn {
      display: block; text-align: center; text-decoration: none;
      padding: 16px; border-radius: 16px; font-size: 16px; font-weight: 700; color: #fff;
      background: linear-gradient(135deg, var(--glow), color-mix(in srgb, var(--glow) 55%, #1e293b));
      box-shadow: 0 10px 26px -8px var(--glow);
      transition: transform 0.2s;
    }
    .card .open-btn:active { transform: scale(0.96); }

    /* Counter + hint */
    .footer { position: relative; z-index: 2; text-align: center; padding: 12px 20px 18px; }
    .counter { font-size: 13px; color: #9aa3b2; font-variant-numeric: tabular-nums; }
    .counter b { color: #fff; font-weight: 700; }
    .hint { font-size: 11px; color: #5b6675; margin-top: 4px; }
  </style>
</head>
<body>
  <div class="header">
    <h1>🤝 50 AI Buddies</h1>
    <p>Swipe sideways to find your companion</p>
  </div>

  <div class="chips" id="chips">
    <button class="chip active" data-start="1">All 50</button>
    <button class="chip" data-start="1">Original</button>
    <button class="chip" data-start="29">Loneliness</button>
    <button class="chip" data-start="39">Enterprise</button>
  </div>

  <div class="carousel" id="carousel"></div>

  <div class="footer">
    <div class="counter"><b id="cur">1</b> / 50</div>
    <div class="hint">← swipe →</div>
  </div>

  <script>
    const BUDDIES = [
      { id: 1, name: 'My Buddy', emoji: '👋', desc: 'Your easygoing best friend', cat: 'Original', color: '#8b5cf6' },
      { id: 2, name: 'Anxiety Relief', emoji: '😰', desc: 'Calm, grounding support', cat: 'Original', color: '#3b82f6' },
      { id: 3, name: 'Depression Buddy', emoji: '😔', desc: 'Gentle, compassionate listener', cat: 'Original', color: '#ec4899' },
      { id: 4, name: 'Sleep Buddy', emoji: '🌙', desc: 'Rest and relaxation guide', cat: 'Original', color: '#10b981' },
      { id: 5, name: 'Grief Buddy', emoji: '💔', desc: 'Compassionate support', cat: 'Original', color: '#f59e0b' },
      { id: 6, name: 'Elderly Companion', emoji: '👵', desc: 'For older adults', cat: 'Original', color: '#06b6d4' },
      { id: 7, name: 'Parenting Coach', emoji: '👨‍👩‍👧‍👦', desc: 'Parent support', cat: 'Original', color: '#6366f1' },
      { id: 8, name: 'Teen Mentor', emoji: '👦', desc: 'For teenagers', cat: 'Original', color: '#8b5cf6' },
      { id: 9, name: 'Recovery Buddy', emoji: '🌱', desc: 'Addiction recovery', cat: 'Original', color: '#14b8a6' },
      { id: 10, name: 'Job Search Buddy', emoji: '💼', desc: 'Career transition', cat: 'Original', color: '#d946ef' },
      { id: 11, name: 'Career Coach', emoji: '📈', desc: 'Professional growth', cat: 'Original', color: '#f97316' },
      { id: 12, name: 'Study Buddy', emoji: '📚', desc: 'Learning companion', cat: 'Original', color: '#06b6d4' },
      { id: 13, name: 'Creative Partner', emoji: '🎨', desc: 'Artistic support', cat: 'Original', color: '#14b8a6' },
      { id: 14, name: 'Startup Mentor', emoji: '⚡', desc: 'Entrepreneurship guide', cat: 'Original', color: '#3b82f6' },
      { id: 15, name: 'Fitness Coach', emoji: '💪', desc: 'Health & wellness', cat: 'Original', color: '#ec4899' },
      { id: 16, name: 'Nutrition Buddy', emoji: '🥗', desc: 'Eating well', cat: 'Original', color: '#10b981' },
      { id: 17, name: 'Travel Companion', emoji: '✈️', desc: 'Adventure planning', cat: 'Original', color: '#f59e0b' },
      { id: 18, name: 'Financial Coach', emoji: '💰', desc: 'Money management', cat: 'Original', color: '#8b5cf6' },
      { id: 19, name: 'Hobby Explorer', emoji: '🎸', desc: 'Passion pursuits', cat: 'Original', color: '#6366f1' },
      { id: 20, name: 'Life Goals Coach', emoji: '🎯', desc: 'Goal achievement', cat: 'Original', color: '#06b6d4' },
      { id: 21, name: 'Anti-Bullying Buddy', emoji: '🛡️', desc: 'Against bullying', cat: 'Original', color: '#14b8a6' },
      { id: 22, name: 'ADHD Buddy', emoji: '⚡', desc: 'Focus & organization', cat: 'Original', color: '#d946ef' },
      { id: 23, name: 'Autism Spectrum Buddy', emoji: '🌈', desc: 'Neurodivergent support', cat: 'Original', color: '#f97316' },
      { id: 24, name: 'Chronic Pain Buddy', emoji: '🩹', desc: 'Pain management', cat: 'Original', color: '#3b82f6' },
      { id: 25, name: 'Addiction Recovery Buddy', emoji: '🔥', desc: 'Recovery support', cat: 'Original', color: '#ec4899' },
      { id: 26, name: 'LGBTQ+ Ally Buddy', emoji: '🏳️‍🌈', desc: 'Affirming support', cat: 'Original', color: '#10b981' },
      { id: 27, name: 'Disability Buddy', emoji: '♿', desc: 'Disability support', cat: 'Original', color: '#f59e0b' },
      { id: 28, name: 'Imposter Syndrome Buddy', emoji: '🌟', desc: 'Confidence building', cat: 'Original', color: '#8b5cf6' },
      { id: 29, name: 'Dating & Romance Coach', emoji: '💕', desc: 'Love, dating, connection', cat: 'Loneliness', color: '#ec4899' },
      { id: 30, name: 'New Relationship Buddy', emoji: '🌹', desc: 'Early-stage love support', cat: 'Loneliness', color: '#f97316' },
      { id: 31, name: 'Breakup Recovery Buddy', emoji: '💔', desc: 'Healing from heartbreak', cat: 'Loneliness', color: '#8b5cf6' },
      { id: 32, name: 'Long-Distance Love Buddy', emoji: '📱', desc: 'Sustaining love across distance', cat: 'Loneliness', color: '#3b82f6' },
      { id: 33, name: 'Social Anxiety & Friends Coach', emoji: '🤝', desc: 'Build genuine friendships', cat: 'Loneliness', color: '#06b6d4' },
      { id: 34, name: 'New City Companion', emoji: '🏙️', desc: 'Settle in & find community', cat: 'Loneliness', color: '#10b981' },
      { id: 35, name: 'Workplace Friendship Coach', emoji: '👥', desc: 'Build authentic work connections', cat: 'Loneliness', color: '#14b8a6' },
      { id: 36, name: 'Meetup & Social Skills Coach', emoji: '🎉', desc: 'Join groups, find your people', cat: 'Loneliness', color: '#f59e0b' },
      { id: 37, name: 'Solo Traveler Buddy', emoji: '✈️', desc: 'Travel companionship', cat: 'Loneliness', color: '#06b6d4' },
      { id: 38, name: 'Self-Love & Solo Life Buddy', emoji: '🌟', desc: 'Build a fulfilling solo life', cat: 'Loneliness', color: '#d946ef' },
      { id: 39, name: 'Burnout Recovery Buddy', emoji: '🔥', desc: 'Recover from work burnout', cat: 'Enterprise', color: '#ef4444' },
      { id: 40, name: 'Executive Stress Coach', emoji: '💼', desc: 'C-suite stress management', cat: 'Enterprise', color: '#6366f1' },
      { id: 41, name: 'Work-Life Balance Buddy', emoji: '⚖️', desc: 'Boundary setting, work-life', cat: 'Enterprise', color: '#8b5cf6' },
      { id: 42, name: 'Sleep Optimization Coach', emoji: '😴', desc: 'Sleep quality & recovery', cat: 'Enterprise', color: '#3b82f6' },
      { id: 43, name: 'Recovery & Wellness Buddy', emoji: '💪', desc: 'Physical recovery support', cat: 'Enterprise', color: '#06b6d4' },
      { id: 44, name: 'Deep Work & Focus Coach', emoji: '⏱️', desc: 'Focus, flow, productivity', cat: 'Enterprise', color: '#f59e0b' },
      { id: 45, name: 'Executive Performance Coach', emoji: '🎯', desc: 'Leadership performance', cat: 'Enterprise', color: '#10b981' },
      { id: 46, name: 'Remote Work Isolation Buddy', emoji: '🌍', desc: 'Combat WFH isolation', cat: 'Enterprise', color: '#ec4899' },
      { id: 47, name: 'Nutrition & Meal Planning Buddy', emoji: '🥗', desc: 'Corporate wellness nutrition', cat: 'Enterprise', color: '#f97316' },
      { id: 48, name: 'Meditation & Mindfulness Studio', emoji: '🧘', desc: 'Meditation practice', cat: 'Enterprise', color: '#14b8a6' },
      { id: 49, name: 'Healthy Habits Buddy', emoji: '🏃', desc: 'Build healthy habits', cat: 'Enterprise', color: '#6366f1' },
      { id: 50, name: 'Mental Resilience Trainer', emoji: '💪', desc: 'First responder resilience', cat: 'Enterprise', color: '#ef4444' },
    ];

    const carousel = document.getElementById('carousel');
    const curEl = document.getElementById('cur');
    const chips = Array.from(document.querySelectorAll('.chip'));
    const cards = [];

    BUDDIES.forEach(b => {
      const card = document.createElement('div');
      card.className = 'card';
      card.style.setProperty('--glow', b.color);
      card.dataset.id = b.id;
      card.innerHTML = `
        <div class="bloom"></div>
        <div class="emoji">${b.emoji}</div>
        <div class="cat-tag">${b.cat}</div>
        <div class="name">${b.name}</div>
        <div class="desc">${b.desc}</div>
        <a class="open-btn" href="buddy-${b.id}.html">Open Buddy →</a>
      `;
      card.addEventListener('click', e => {
        if (!e.target.closest('.open-btn')) window.location.href = `buddy-${b.id}.html`;
      });
      carousel.appendChild(card);
      cards.push(card);
    });

    // Track centered card -> update counter, scale, active chip
    const io = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting && entry.intersectionRatio > 0.7) {
          cards.forEach(c => c.classList.remove('is-center'));
          entry.target.classList.add('is-center');
          const id = parseInt(entry.target.dataset.id);
          curEl.textContent = id;
          chips.forEach(ch => ch.classList.remove('active'));
          if (id >= 39) chips[3].classList.add('active');
          else if (id >= 29) chips[2].classList.add('active');
          else chips[1].classList.add('active');
        }
      });
    }, { root: carousel, threshold: [0.7, 0.9] });
    cards.forEach(c => io.observe(c));

    // Chip jump
    chips.forEach((chip) => {
      chip.addEventListener('click', () => {
        const start = parseInt(chip.dataset.start);
        chips.forEach(ch => ch.classList.remove('active'));
        chip.classList.add('active');
        cards[start - 1].scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
      });
    });

    requestAnimationFrame(() => cards[0].classList.add('is-center'));
  </script>
</body>
</html>
