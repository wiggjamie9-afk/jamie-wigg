<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>28 AI Buddy Apps — Your Companion for Every Journey</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, rgba(255,255,255,0.02) 0%, rgba(100,200,255,0.03) 50%, rgba(255,100,200,0.02) 100%);
      background-attachment: fixed;
      color: #f0f0f0;
      --bg: #060912;
      --glass: rgba(255,255,255,0.055);
      --glass-border: rgba(255,255,255,0.1);
      --blur: 22px;
      --shadow-float: 0 16px 40px -12px rgba(0,0,0,0.4);
    }

    @keyframes meshDrift {
      0% { background-position: 0% 0%; }
      100% { background-position: 100% 100%; }
    }

    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background:
        linear-gradient(45deg, transparent 30%, rgba(255,200,100,0.05) 50%, transparent 70%),
        linear-gradient(-45deg, transparent 30%, rgba(100,200,255,0.05) 50%, transparent 70%),
        linear-gradient(90deg, transparent 30%, rgba(200,100,255,0.05) 50%, transparent 70%);
      background-size: 300% 300%, 300% 300%, 300% 300%;
      animation: meshDrift 20s ease-in-out infinite;
      pointer-events: none;
      z-index: 0;
    }

    .container { position: relative; z-index: 1; max-width: 1200px; margin: 0 auto; }

    .header {
      text-align: center;
      padding: 40px 20px;
      background: var(--glass);
      backdrop-filter: blur(var(--blur));
      border-bottom: 1px solid var(--glass-border);
      margin-bottom: 40px;
      border-radius: 16px;
      margin: 20px;
    }

    .header h1 {
      font-size: 40px;
      margin-bottom: 12px;
      background: linear-gradient(135deg, #8b5cf6, #3b82f6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .header p {
      font-size: 16px;
      color: #ccc;
      line-height: 1.6;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      padding: 0 20px 40px;
    }

    .buddy-card {
      background: var(--glass);
      backdrop-filter: blur(var(--blur));
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s;
      position: relative;
      overflow: hidden;
    }

    .buddy-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
    }

    .buddy-card:hover {
      transform: translateY(-8px);
      box-shadow: var(--shadow-float);
    }

    .buddy-card:active { transform: scale(0.95); }

    .buddy-emoji {
      font-size: 40px;
      margin-bottom: 12px;
      display: block;
    }

    .buddy-name {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .buddy-description {
      font-size: 12px;
      color: #999;
      line-height: 1.4;
    }

    a { text-decoration: none; color: inherit; }

    .footer {
      text-align: center;
      padding: 40px 20px;
      color: #666;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="container">

      <p><strong>28 Original + 10 Loneliness + 12 Enterprise Wellness</strong></p>

    </div>

    <div class="grid" id="buddies"></div>

    <div class="footer">
      <p>Powered by Claude AI, ElevenLabs TTS, and Higgsfield Avatar AI</p>
      <p>Your privacy matters. All data stays on your device.</p>
    </div>

    ];

    const grid = document.getElementById('buddies');
    BUDDIES.forEach(buddy => {

      card.className = 'buddy-card';
      card.innerHTML = `
        <span class="buddy-emoji">${buddy.emoji}</span>

      grid.appendChild(card);

  </script>
</body>
</html>
