<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="theme-color" content="#0b1120">
    <title>Buddy System - Your AI Companion Ecosystem</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b1120;
            --text: #f3f6fb;
            --text-soft: #c3cdda;
            --border: rgba(255,255,255,0.09);
            --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
            --font-ui: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { width: 100%; height: 100%; overflow: hidden; }
        body {
            font-family: var(--font-ui);
            background: linear-gradient(160deg, var(--bg) 0%, #0d1426 100%);
            color: var(--text);
            -webkit-font-smoothing: antialiased;
        }

        .app { width: 100%; height: 100%; display: flex; flex-direction: column; padding-top: max(env(safe-area-inset-top), 10px); }

        .header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 20px 14px; border-bottom: 1px solid var(--border);
        }
        .brand { font-size: 19px; font-weight: 800; background: linear-gradient(135deg, #f59e0b, #06b6d4); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }

        .carousel-container { flex: 1; overflow: hidden; position: relative; width: 100%; }
        .carousel { display: flex; height: 100%; width: 100%; transition: transform 0.45s var(--spring); touch-action: pan-y; }
        .screen { min-width: 100%; height: 100%; display: flex; flex-direction: column; overflow-y: auto; }

        /* Hub Screen */
        .hub-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 16px; }
        .buddy-card {
            border-radius: 20px; padding: 16px; cursor: pointer;
            border: 1px solid rgba(255,255,255,0.1);
            transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
            backdrop-filter: blur(10px);
            display: flex; flex-direction: column; gap: 8px;
        }
        .buddy-card:active { transform: scale(0.95); }
        .buddy-avatar { width: 48px; height: 48px; border-radius: 12px; background: rgba(255,255,255,0.1); display: grid; place-items: center; font-size: 24px; }
        .buddy-name { font-size: 14px; font-weight: 600; }
        .buddy-desc { font-size: 11px; color: var(--text-soft); }

        /* Buddy Detail Screen */
        .buddy-detail { display: flex; flex-direction: column; height: 100%; }
        .buddy-header { padding: 20px; border-bottom: 1px solid var(--border); }
        .buddy-hero { display: flex; align-items: center; gap: 16px; }
        .buddy-big-avatar { width: 80px; height: 80px; border-radius: 20px; background: rgba(255,255,255,0.1); display: grid; place-items: center; font-size: 48px; }
        .buddy-info h2 { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
        .buddy-info p { font-size: 13px; color: var(--text-soft); }

        .buddy-tabs { display: flex; gap: 8px; padding: 12px 20px; border-bottom: 1px solid var(--border); overflow-x: auto; }
        .tab { padding: 8px 12px; border-radius: 8px; font-size: 12px; cursor: pointer; background: rgba(255,255,255,0.04); transition: all 0.3s; }
        .tab.active { background: rgba(255,255,255,0.12); font-weight: 600; }

        .buddy-content { flex: 1; overflow-y: auto; padding: 16px 20px; }
        .screen-section { margin-bottom: 20px; }
        .section-title { font-size: 12px; font-weight: 700; color: var(--text-soft); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }

        .check-in-card {
            border-radius: 16px; padding: 20px;
            backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 12px;
        }
        .check-in-text { font-size: 16px; font-weight: 600; margin-bottom: 12px; }
        .mood-buttons { display: flex; gap: 8px; flex-wrap: wrap; }
        .mood-btn {
            padding: 8px 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.04); cursor: pointer; font-size: 13px;
            transition: all 0.3s; color: var(--text);
        }
        .mood-btn:active { background: rgba(255,255,255,0.12); }

        .chat-box {
            display: flex; gap: 8px; margin-bottom: 12px;
        }
        .chat-input {
            flex: 1; padding: 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.04); color: var(--text); font-family: var(--font-ui); font-size: 14px;
        }
        .chat-btn {
            padding: 12px 16px; border-radius: 12px; border: none; cursor: pointer; font-weight: 600; font-size: 13px;
            transition: all 0.3s;
        }

        .affirmation-box {
            border-radius: 16px; padding: 20px; backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1); text-align: center;
            margin-bottom: 12px; min-height: 80px; display: flex; align-items: center; justify-content: center;
        }
        .affirmation-text { font-size: 16px; font-weight: 500; line-height: 1.5; }

        .health-stat {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .stat-label { font-size: 13px; color: var(--text-soft); }
        .stat-value { font-size: 16px; font-weight: 700; }

        .photo-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
        .photo-item { aspect-ratio: 1; border-radius: 12px; background: rgba(255,255,255,0.06); border: 1px dashed rgba(255,255,255,0.2); display: grid; place-items: center; cursor: pointer; font-size: 24px; }

        .notes-input {
            width: 100%; padding: 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.04); color: var(--text); font-family: var(--font-ui); font-size: 14px;
            resize: vertical; min-height: 60px; margin-bottom: 8px;
        }

        .settings-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .settings-label { font-size: 14px; }
        .settings-input {
            padding: 6px 8px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.04); color: var(--text); font-size: 12px; width: 120px;
        }

        .emergency-buttons { display: flex; gap: 8px; flex-wrap: wrap; }
        .emergency-btn {
            padding: 12px 16px; border-radius: 12px; border: none; cursor: pointer; font-weight: 600; font-size: 13px;
            transition: all 0.3s;
        }

        .back-btn {
            padding: 8px 12px; border-radius: 8px; background: rgba(255,255,255,0.1);
            border: none; color: var(--text); cursor: pointer; font-weight: 600;
            margin-bottom: 12px;
        }

        .pagination { display: flex; gap: 6px; justify-content: center; padding: 16px; }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.3); cursor: pointer; transition: all 0.3s; }
        .dot.active { width: 30px; border-radius: 4px; background: rgba(255,255,255,0.8); }

        @media (max-height: 600px) {
            .buddy-content { padding: 12px 16px; }
        }
    </style>
</head>
<body>
    <div class="app">
        <div class="header">
            <div class="brand">Buddy System</div>
        </div>
        <div class="carousel-container">
            <div class="carousel" id="carousel">
                <!-- Hub Screen -->
                <div class="screen">
                    <div class="hub-grid" id="buddyGrid"></div>
                </div>
                <!-- Buddy Detail Screens (will be generated) -->
            </div>
        </div>
        <div class="pagination" id="pagination"></div>
    </div>

    <script>
        // Buddy data - 28 buddies with unique colors and personalities
        const BUDDIES = [
            { id: 1, name: 'My Buddy', emoji: '😊', color: '#f59e0b', accent: '#fef3c7', desc: 'Your best friend' },
            { id: 2, name: 'Anxiety Relief', emoji: '🧘', color: '#3b82f6', accent: '#93c5fd', desc: 'Calm support' },
            { id: 3, name: 'Depression Buddy', emoji: '💜', color: '#a855f7', accent: '#e9d5ff', desc: 'Hopeful companion' },
            { id: 4, name: 'Sleep Buddy', emoji: '🌙', color: '#1e3a8a', accent: '#f3e8ff', desc: 'Restful guide' },
            { id: 5, name: 'Grief Buddy', emoji: '🌸', color: '#6b7280', accent: '#fecdd3', desc: 'Gentle support' },
            { id: 6, name: 'Elderly Companion', emoji: '👵', color: '#ea580c', accent: '#fed7aa', desc: 'Caring presence' },
            { id: 7, name: 'Parenting Coach', emoji: '👶', color: '#ec4899', accent: '#fbcfe8', desc: 'Parent support' },
            { id: 8, name: 'Teen Mentor', emoji: '🌟', color: '#14b8a6', accent: '#ccfbf1', desc: 'Youth guide' },
            { id: 9, name: 'Recovery Buddy', emoji: '💚', color: '#16a34a', accent: '#dcfce7', desc: 'Strength ally' },
            { id: 10, name: 'Job Search Buddy', emoji: '💼', color: '#1f2937', accent: '#e2e8f0', desc: 'Career helper' },
            { id: 11, name: 'Career Coach', emoji: '🚀', color: '#f97316', accent: '#fed7aa', desc: 'Career mentor' },
            { id: 12, name: 'Study Buddy', emoji: '📚', color: '#0ea5e9', accent: '#cffafe', desc: 'Learning partner' },
            { id: 13, name: 'Creative Partner', emoji: '🎨', color: '#ec4899', accent: '#f0abfc', desc: 'Art collaborator' },
            { id: 14, name: 'Startup Mentor', emoji: '⚡', color: '#7c3aed', accent: '#ede9fe', desc: 'Business guide' },
            { id: 15, name: 'Fitness Coach', emoji: '💪', color: '#dc2626', accent: '#fee2e2', desc: 'Workout buddy' },
            { id: 16, name: 'Nutrition Buddy', emoji: '🥗', color: '#22c55e', accent: '#86efac', desc: 'Health helper' },
            { id: 17, name: 'Travel Companion', emoji: '✈️', color: '#0369a1', accent: '#e0f2fe', desc: 'Adventure guide' },
            { id: 18, name: 'Financial Coach', emoji: '💰', color: '#b45309', accent: '#fcd34d', desc: 'Money mentor' },
            { id: 19, name: 'Hobby Explorer', emoji: '🎯', color: '#7c3aed', accent: '#f3e8ff', desc: 'Interest finder' },
            { id: 20, name: 'Life Goals Coach', emoji: '🎆', color: '#4f46e5', accent: '#dbeafe', desc: 'Goal guide' },
            { id: 21, name: 'Anti-Bullying Buddy', emoji: '💛', color: '#eab308', accent: '#fef08a', desc: 'Self-worth builder' },
            { id: 22, name: 'ADHD Buddy', emoji: '⚙️', color: '#06b6d4', accent: '#cffafe', desc: 'Focus helper' },
            { id: 23, name: 'Autism Spectrum', emoji: '🌈', color: '#8b5cf6', accent: '#ede9fe', desc: 'Understanding friend' },
            { id: 24, name: 'Chronic Pain Buddy', emoji: '🤝', color: '#f43f5e', accent: '#ffe4e6', desc: 'Pain support' },
            { id: 25, name: 'Addiction Buddy', emoji: '🌱', color: '#10b981', accent: '#d1fae5', desc: 'Recovery strength' },
            { id: 26, name: 'LGBTQ+ Ally', emoji: '🏳️‍🌈', color: '#f472b6', accent: '#fbcfe8', desc: 'Safe space' },
            { id: 27, name: 'Disability Buddy', emoji: '♿', color: '#6366f1', accent: '#e0e7ff', desc: 'Accessibility friend' },
            { id: 28, name: 'Imposter Syndrome', emoji: '⭐', color: '#d97706', accent: '#fef3c7', desc: 'Confidence builder' },
        ];

        const carousel = document.getElementById('carousel');
        let currentScreen = 0;
        let startX = 0;

        // Generate hub grid
        const buddyGrid = document.getElementById('buddyGrid');
        BUDDIES.forEach(buddy => {
            const card = document.createElement('div');
            card.className = 'buddy-card';
            card.style.background = `linear-gradient(135deg, ${buddy.color}20, ${buddy.accent}10)`;
            card.style.borderColor = `${buddy.color}40`;
            card.onclick = () => goToBuddy(buddy.id);
            card.innerHTML = `
                <div class="buddy-avatar" style="background: ${buddy.color}30;">${buddy.emoji}</div>
                <div class="buddy-name">${buddy.name}</div>
                <div class="buddy-desc">${buddy.desc}</div>
            `;
            buddyGrid.appendChild(card);
        });

        // Generate buddy detail screens
        BUDDIES.forEach(buddy => {
            const screen = document.createElement('div');
            screen.className = 'screen';
            screen.innerHTML = `
                <button class="back-btn" onclick="goToHub()">← Back</button>
                <div class="buddy-header" style="background: linear-gradient(135deg, ${buddy.color}15, transparent);">
                    <div class="buddy-hero">
                        <div class="buddy-big-avatar" style="background: ${buddy.color}30;">${buddy.emoji}</div>
                        <div class="buddy-info">
                            <h2>${buddy.name}</h2>
                            <p>${buddy.desc}</p>
                        </div>
                    </div>
                </div>

                <div class="buddy-tabs">
                    <div class="tab active" onclick="switchTab(this, 'home')">Home</div>
                    <div class="tab" onclick="switchTab(this, 'health')">Health</div>
                    <div class="tab" onclick="switchTab(this, 'photos')">Photos</div>
                    <div class="tab" onclick="switchTab(this, 'chat')">Chat</div>
                    <div class="tab" onclick="switchTab(this, 'notes')">Notes</div>
                    <div class="tab" onclick="switchTab(this, 'settings')">Settings</div>
                </div>

                <div class="buddy-content">
                    <!-- Home Tab -->
                    <div class="tab-content" data-tab="home">
                        <div class="section-title">✨ Daily Affirmation</div>
                        <div class="affirmation-box" style="background: linear-gradient(135deg, ${buddy.color}20, ${buddy.accent}10); border-color: ${buddy.color}40;">
                            <div class="affirmation-text" id="affirmation-${buddy.id}">You're doing amazing. Keep going. 💫</div>
                        </div>

                        <div class="section-title">💬 How Are You Feeling?</div>
                        <div class="check-in-card" style="background: ${buddy.color}08; border-color: ${buddy.color}20;">
                            <div class="check-in-text">Tell me about your day</div>
                            <div class="mood-buttons">
                                <button class="mood-btn">😊 Good</button>
                                <button class="mood-btn">😐 Okay</button>
                                <button class="mood-btn">😔 Struggling</button>
                            </div>
                        </div>

                        <div class="section-title">🎯 Quick Actions</div>
                        <div style="display: flex; gap: 8px; flex-wrap: wrap;">
                            <button class="mood-btn" style="flex: 1; padding: 12px;">Breathing Exercise</button>
                            <button class="mood-btn" style="flex: 1; padding: 12px;">Meditation</button>
                        </div>
                    </div>

                    <!-- Health Tab -->
                    <div class="tab-content" data-tab="health" style="display: none;">
                        <div class="section-title">❤️ Health Check</div>
                        <div class="health-stat">
                            <span class="stat-label">Heart Rate</span>
                            <span class="stat-value" style="color: ${buddy.color};">-- bpm</span>
                        </div>
                        <div class="health-stat">
                            <span class="stat-label">Breathing</span>
                            <span class="stat-value" style="color: ${buddy.color};">-- breaths/min</span>
                        </div>
                        <div class="health-stat">
                            <span class="stat-label">Mood Score</span>
                            <span class="stat-value" style="color: ${buddy.color};">-- / 10</span>
                        </div>
                        <div class="health-stat">
                            <span class="stat-label">Sleep Quality</span>
                            <span class="stat-value" style="color: ${buddy.color};">-- hours</span>
                        </div>
                        <div style="margin-top: 16px;">
                            <input type="number" placeholder="Your mood (1-10)" class="settings-input" style="width: 100%;">
                            <button class="mood-btn" style="width: 100%; padding: 10px; margin-top: 8px; background: ${buddy.color}20; border-color: ${buddy.color};">Log Health Data</button>
                        </div>
                    </div>

                    <!-- Photos Tab -->
                    <div class="tab-content" data-tab="photos" style="display: none;">
                        <div class="section-title">📸 Your Memories</div>
                        <div class="photo-grid">
                            <div class="photo-item">+</div>
                            <div class="photo-item">+</div>
                            <div class="photo-item">+</div>
                            <div class="photo-item">+</div>
                        </div>
                        <p style="font-size: 12px; color: var(--text-soft); text-align: center; margin-top: 12px;">Add photos to create memories with ${buddy.name}</p>
                    </div>

                    <!-- Chat Tab -->
                    <div class="tab-content" data-tab="chat" style="display: none;">
                        <div class="section-title">💬 Talk to ${buddy.name}</div>
                        <div style="flex: 1; margin-bottom: 12px; padding: 12px; background: rgba(255,255,255,0.04); border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); min-height: 80px;">
                            <p style="font-size: 13px; color: var(--text-soft);">Hi! I'm here to listen and support you. What's on your mind?</p>
                        </div>
                        <div class="chat-box">
                            <input type="text" class="chat-input" placeholder="Talk to me...">
                            <button class="chat-btn" style="background: ${buddy.color}; color: white;">Send</button>
                        </div>
                    </div>

                    <!-- Notes Tab -->
                    <div class="tab-content" data-tab="notes" style="display: none;">
                        <div class="section-title">📝 Your Journal</div>
                        <textarea class="notes-input" placeholder="Write your thoughts..."></textarea>
                        <button class="mood-btn" style="width: 100%; padding: 10px; background: ${buddy.color}20; border-color: ${buddy.color};">Save Notes</button>
                    </div>

                    <!-- Settings Tab -->
                    <div class="tab-content" data-tab="settings" style="display: none;">
                        <div class="section-title">⚙️ Buddy Settings</div>
                        <div class="settings-item">
                            <span class="settings-label">Buddy Name</span>
                            <input type="text" class="settings-input" value="${buddy.name}">
                        </div>
                        <div class="settings-item">
                            <span class="settings-label">Voice Speed</span>
                            <select class="settings-input">
                                <option>Slow</option>
                                <option selected>Normal</option>
                                <option>Fast</option>
                            </select>
                        </div>
                        <div class="section-title" style="margin-top: 16px;">🆘 Emergency</div>
                        <div class="emergency-buttons">
                            <button class="emergency-btn" style="background: #ef4444; color: white; flex: 1;">🚨 Police</button>
                            <button class="emergency-btn" style="background: #f97316; color: white; flex: 1;">🚑 Ambulance</button>
                        </div>
                        <div class="emergency-buttons">
                            <button class="emergency-btn" style="background: #8b5cf6; color: white; flex: 1;">💜 Crisis Line</button>
                            <button class="emergency-btn" style="background: #06b6d4; color: white; flex: 1;">👥 Contacts</button>
                        </div>
                    </div>
                </div>
            `;
            carousel.appendChild(screen);
        });

        // Carousel navigation
        function goToBuddy(buddyId) {
            currentScreen = buddyId;
            updateCarousel();
        }
        function goToHub() {
            currentScreen = 0;
            updateCarousel();
        }
        function updateCarousel() {
            carousel.style.transition = 'none';
            carousel.style.transform = `translateX(-${currentScreen * 100}%)`;
            updatePagination();
            setTimeout(() => { carousel.style.transition = 'transform 0.45s var(--spring)'; }, 10);
        }
        function updatePagination() {
            const pagination = document.getElementById('pagination');
            pagination.innerHTML = '';
            for (let i = 0; i <= BUDDIES.length; i++) {
                const dot = document.createElement('div');
                dot.className = 'dot' + (i === currentScreen ? ' active' : '');
                dot.onclick = () => { currentScreen = i; updateCarousel(); };
                pagination.appendChild(dot);
            }
        }
        function switchTab(el, tabName) {
            el.parentElement.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
            el.closest('.screen').querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');
            el.closest('.screen').querySelector(`[data-tab="${tabName}"]`).style.display = 'block';
        }

        // Touch carousel
        carousel.addEventListener('touchstart', e => { startX = e.touches[0].clientX; carousel.style.transition = 'none'; }, false);
        carousel.addEventListener('touchmove', e => {
            const dx = e.touches[0].clientX - startX;
            const move = Math.max(-currentScreen * 100, Math.min(100 * (BUDDIES.length - currentScreen), dx * 0.5));
            carousel.style.transform = `translateX(calc(-${currentScreen * 100}% + ${move}px))`;
        }, false);
        carousel.addEventListener('touchend', e => {
            const dx = e.changedTouches[0].clientX - startX;
            if (Math.abs(dx) > 50) {
                currentScreen = Math.max(0, Math.min(BUDDIES.length, currentScreen - Math.sign(dx)));
            }
            carousel.style.transition = 'transform 0.45s var(--spring)';
            carousel.style.transform = `translateX(-${currentScreen * 100}%)`;
            updatePagination();
        }, false);

        updatePagination();
    </script>
</body>
</html>
