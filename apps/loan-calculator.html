<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#08050d">
    <title>Loan Calculator</title>
    <style>
        :root { --canvas:#08050d; --green:#00e887; --red:#ff1f5a; --cyan:#00d8ff; --purple:#7c3aed; --text:#fff; --text-muted:#aaa; }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:var(--canvas); color:var(--text); min-height:100vh; padding-bottom:80px; }
        .header { padding:20px; border-bottom:1px solid rgba(0,232,135,0.2); display:flex; justify-content:space-between; }
        h1 { font-size:24px; font-weight:700; }
        .badge { background:var(--green); color:var(--canvas); padding:4px 12px; border-radius:20px; font-size:11px; }
        .content { padding:20px; }
        input { background:rgba(0,232,135,0.05); border:1px solid rgba(0,232,135,0.2); border-radius:6px; color:var(--text); padding:10px; margin:8px 0; width:100%; }
        .result { background:rgba(0,232,135,0.05); border:1px solid rgba(0,232,135,0.2); border-radius:8px; padding:15px; margin:15px 0; }
        .result-item { display:flex; justify-content:space-between; margin:8px 0; padding:8px 0; border-bottom:1px solid rgba(0,232,135,0.1); }
        .amount { color:var(--green); font-weight:600; font-size:16px; }
        .schedule { background:rgba(0,232,135,0.05); border:1px solid rgba(0,232,135,0.1); border-radius:6px; padding:10px; margin:8px 0; font-size:13px; display:flex; justify-content:space-between; }
        .premium { background:rgba(124,58,237,0.1); border-left:3px solid var(--purple); padding:12px; margin-top:20px; border-radius:4px; font-size:13px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🏦 Loan Calc</h1>
        <div class="badge">FREE</div>
    </div>
    <div class="content">
        <div>
            <label style="font-size:12px">Principal ($)</label>
            <input type="number" id="principal" placeholder="Loan amount" value="10000" step="1000" min="0">
            
            <label style="font-size:12px">Annual Rate (%)</label>
            <input type="number" id="rate" placeholder="Interest rate" value="5" step="0.1" min="0" max="100">
            
            <label style="font-size:12px">Months</label>
            <input type="number" id="months" placeholder="Loan term" value="60" step="1" min="1">
            
            <button onclick="calculate()" style="background:var(--green);color:var(--canvas);border:0;padding:10px;border-radius:6px;cursor:pointer;font-weight:600;width:100%;margin-top:15px">Calculate</button>
            
            <div class="result">
                <div class="result-item">
                    <span>Monthly Payment</span>
                    <span class="amount" id="payment">$0</span>
                </div>
                <div class="result-item">
                    <span>Total Paid</span>
                    <span class="amount" id="total">$0</span>
                </div>
                <div class="result-item">
                    <span>Total Interest</span>
                    <span class="amount" id="interest" style="color:var(--red)">$0</span>
                </div>
            </div>
            
            <div style="margin-top:15px">
                <div style="font-weight:600;margin-bottom:10px">First 6 Payments</div>
                <div id="schedule"></div>
            </div>
            
            <div class="premium">💎 Premium: Track multiple loans & refinancing</div>
        </div>
    </div>
    <script>
        function calculate() {
            let p = parseFloat(document.getElementById('principal').value) || 0;
            let r = parseFloat(document.getElementById('rate').value) || 0;
            let m = parseInt(document.getElementById('months').value) || 1;
            
            let monthly = r / 100 / 12;
            let payment = p * (monthly * Math.pow(1 + monthly, m)) / (Math.pow(1 + monthly, m) - 1);
            let total = payment * m;
            let interest = total - p;
            
            document.getElementById('payment').textContent = '$' + payment.toFixed(2);
            document.getElementById('total').textContent = '$' + total.toFixed(2);
            document.getElementById('interest').textContent = '$' + interest.toFixed(2);
            
            let schedule = [];
            let balance = p;
            for (let i = 0; i < Math.min(6, m); i++) {
                let intPayment = balance * monthly;
                let prinPayment = payment - intPayment;
                balance -= prinPayment;
                schedule.push({p:prinPayment,i:intPayment,b:Math.max(0,balance)});
            }
            
            document.getElementById('schedule').innerHTML = schedule.map((s,i) =>
                `<div class="schedule">
                    <span>Payment ${i+1}</span>
                    <span style="color:var(--green)">${payment.toFixed(2)}</span>
                </div>`
            ).join('');
        }
        
        if ('serviceWorker' in navigator) navigator.serviceWorker.register('data:application/javascript,self.addEventListener("install",e=>self.skipWaiting());');
    </script>
</body>
</html>
