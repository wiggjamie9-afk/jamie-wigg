<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#241a33"/>
      <stop offset="100%" stop-color="#08050d"/>
    </radialGradient>
    <linearGradient id="fork" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5c000"/>
      <stop offset="100%" stop-color="#ff1f5a"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="180" fill="rgba(245, 192, 0, 0.1)"/>
  <!-- Fork & Knife -->
  <g transform="translate(256, 256)">
    <!-- Fork -->
    <g stroke="url(#fork)" stroke-width="6" fill="none" stroke-linecap="round">
      <line x1="-50" y1="-40" x2="-50" y2="40"/>
      <line x1="-60" y1="40" x2="-40" y2="40"/>
      <line x1="-60" y1="20" x2="-40" y2="20"/>
      <line x1="-60" y1="0" x2="-40" y2="0"/>
    </g>
    <!-- Knife -->
    <path d="M 50 -35 L 50 45 Q 50 55 40 55 L 30 55" stroke="url(#fork)" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- Culinary glow -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="rgba(245, 192, 0, 0.3)" stroke-width="3" opacity="0.6"/>
</svg>
