<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#08050d">
    <title>BookReader Pro</title>
    <style>
        :root { --canvas:#08050d; --green:#00e887; --red:#ff1f5a; --cyan:#00d8ff; --purple:#7c3aed; --text:#fff; --text-muted:#aaa; }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:var(--canvas); color:var(--text); min-height:100vh; padding-bottom:80px; }
        .header { padding:20px; border-bottom:1px solid rgba(0,232,135,0.2); display:flex; justify-content:space-between; }
        h1 { font-size:24px; font-weight:700; }
        .badge { background:var(--green); color:var(--canvas); padding:4px 12px; border-radius:20px; font-size:11px; }
        .content { padding:20px; }
        textarea { width:100%; min-height:150px; background:rgba(0,232,135,0.05); border:1px solid rgba(0,232,135,0.2); border-radius:6px; color:var(--text); padding:10px; font-family:inherit; }
        button { background:var(--green); color:var(--canvas); border:0; padding:10px 16px; border-radius:6px; cursor:pointer; font-weight:600; width:100%; margin-top:10px; }
        .note-card { background:rgba(0,232,135,0.05); border-left:3px solid var(--cyan); border:1px solid rgba(0,232,135,0.2); border-radius:8px; padding:15px; margin:12px 0; }
        .note-text { margin:8px 0; line-height:1.6; }
        .note-highlight { background:rgba(0,232,135,0.2); padding:2px 6px; border-radius:3px; }
        .panel { display:none; }
        .panel.on { display:block; }
        .tabs { position:fixed; bottom:0; left:0; right:0; background:var(--canvas); border-top:1px solid rgba(0,232,135,0.2); display:flex; justify-content:space-around; height:70px; z-index:100; }
        .tab { flex:1; background:0; border:0; color:var(--text-muted); cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:12px; }
        .tab.on { color:var(--green); }
        .premium { background:rgba(124,58,237,0.1); border-left:3px solid var(--purple); padding:12px; margin-top:20px; border-radius:4px; font-size:13px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>📘 BookReader</h1>
        <div class="badge">FREE</div>
    </div>
    <div class="content">
        <div id="reader" class="panel on">
            <textarea id="excerpt" placeholder="Paste a book excerpt here..."></textarea>
            <div style="margin:10px 0">
                <label style="font-size:12px">Add Note</label>
                <textarea id="note" placeholder="Your thoughts..." style="min-height:80px"></textarea>
            </div>
            <button onclick="addNote()">+ Add Note</button>
            
            <div id="notes-list" style="margin-top:20px"></div>
            <div class="premium">💎 Premium: Full book analysis & AI insights</div>
        </div>
        
        <div id="summary" class="panel">
            <div style="font-weight:600;margin-bottom:15px">Auto-Summary</div>
            <div id="summary-text" style="background:rgba(0,232,135,0.05);border:1px solid rgba(0,232,135,0.2);border-radius:8px;padding:15px;line-height:1.8"></div>
        </div>
    </div>
    <div class="tabs">
        <button class="tab on" data-p="reader">📖 Reader</button>
        <button class="tab" data-p="summary">✨ Summary</button>
    </div>
    <script>
        let notes = [];
        
        function load() {
            let d = localStorage.getItem('bookreader');
            if (d) notes = JSON.parse(d);
            drawNotes();
        }
        
        function save() {
            localStorage.setItem('bookreader', JSON.stringify(notes));
            drawNotes();
        }
        
        function addNote() {
            let exc = document.getElementById('excerpt').value;
            let n = document.getElementById('note').value;
            if (!exc || !n) return;
            
            notes.push({exc: exc.substring(0, 100), note: n, date: new Date().toLocaleDateString()});
            document.getElementById('excerpt').value = '';
            document.getElementById('note').value = '';
            save();
        }
        
        function drawNotes() {
            document.getElementById('notes-list').innerHTML = notes.length ?
                notes.map((n, i) => `
                    <div class="note-card">
                        <div style="font-size:12px;color:var(--text-muted)">${n.date}</div>
                        <div style="margin:8px 0">
                            <span class="note-highlight">"${n.exc}..."</span>
                        </div>
                        <div class="note-text">${n.note}</div>
                    </div>
                `).join('') :
                '<p style="color:var(--text-muted)">No notes yet</p>';
        }
        
        document.querySelectorAll('.tab').forEach(t => {
            t.onclick = () => {
                document.querySelectorAll('.tab').forEach(x => x.classList.remove('on'));
                document.querySelectorAll('.panel').forEach(x => x.classList.remove('on'));
                t.classList.add('on');
                let p = t.dataset.p;
                document.getElementById(p).classList.add('on');
                
                if (p === 'summary') {
                    let exc = document.getElementById('excerpt').value;
                    let summary = exc ? 
                        `This passage discusses: ${exc.split(' ').slice(0, 10).join(' ')}... The key themes include character development, plot progression, and thematic elements that contribute to the overall narrative.` :
                        'Paste an excerpt to generate a summary';
                    document.getElementById('summary-text').textContent = summary;
                }
            };
        });
        
        load();
        if ('serviceWorker' in navigator) navigator.serviceWorker.register('data:application/javascript,self.addEventListener("install",e=>self.skipWaiting());');
    </script>
</body>
</html>
