<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goal Tracker – Achieve Dreams</title>
    <style>
        :root { --primary: #9333EA; --bg: #0F172A; --light: #1E293B; --text: #F1F5F9; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); }
        .container { max-width: 480px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }
        .header { background: linear-gradient(135deg, var(--primary) 0%, #0891B2 100%); padding: 24px 20px; text-align: center; }
        .header h1 { font-size: 28px; margin-bottom: 4px; }
        .content { flex: 1; padding: 20px; overflow-y: auto; }
        .card { background: var(--light); border-radius: 12px; padding: 16px; margin-bottom: 16px; border-left: 4px solid var(--primary); }
        .card h2 { font-size: 16px; margin-bottom: 12px; font-weight: 700; }
        input { width: 100%; padding: 10px 12px; background: var(--bg); border: 2px solid #334155; border-radius: 8px; color: var(--text); margin-bottom: 10px; }
        button { width: 100%; padding: 12px; background: var(--primary); border: none; border-radius: 8px; color: white; font-weight: 600; cursor: pointer; }
        .goal { background: var(--bg); padding: 12px; border-radius: 6px; margin-bottom: 8px; }
        .progress-bar { width: 100%; height: 8px; background: #334155; border-radius: 4px; margin: 8px 0; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--primary); transition: width 0.3s; }
        .label { display: block; font-size: 12px; color: #CBD5E1; margin-bottom: 4px; font-weight: 600; }
    </style>
    <meta name="theme-color" content="#9333EA">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎯 GOAL TRACKER</h1>
            <p style="font-size: 12px;">Achieve your dreams</p>
        </div>
        <div class="content">
            <div class="card">
                <h2>➕ New Goal</h2>
                <label>Goal name</label>
                <input type="text" id="goalName" placeholder="E.g., Learn Python">
                <label>Target (%)​</label>
                <input type="number" id="target" placeholder="100" min="1" max="100" value="100">
                <button onclick="addGoal()">Create Goal</button>
            </div>

            <div class="card">
                <h2>🎯 Active Goals</h2>
                <div id="goalList">No goals yet</div>
            </div>
        </div>
    </div>

    <script>
        function addGoal() {
            const name = document.getElementById('goalName').value;
            const target = parseInt(document.getElementById('target').value);

            if (!name || !target) { alert('Fill all fields'); return; }

            let goals = JSON.parse(localStorage.getItem('goals') || '[]');
            goals.push({ name, target, progress: 0, id: Date.now() });
            localStorage.setItem('goals', JSON.stringify(goals));

            document.getElementById('goalName').value = '';
            document.getElementById('target').value = '100';
            displayGoals();
        }

        function updateProgress(id, delta) {
            let goals = JSON.parse(localStorage.getItem('goals') || '[]');
            const goal = goals.find(g => g.id === id);
            if (goal) {
                goal.progress = Math.min(goal.progress + delta, goal.target);
                localStorage.setItem('goals', JSON.stringify(goals));
                displayGoals();
            }
        }

        function deleteGoal(id) {
            let goals = JSON.parse(localStorage.getItem('goals') || '[]');
            goals = goals.filter(g => g.id !== id);
            localStorage.setItem('goals', JSON.stringify(goals));
            displayGoals();
        }

        function displayGoals() {
            const goals = JSON.parse(localStorage.getItem('goals') || '[]');
            const list = document.getElementById('goalList');

            if (goals.length === 0) {
                list.innerHTML = '<p style="color: #CBD5E1; font-size: 12px;">No goals yet</p>';
                return;
            }

            list.innerHTML = goals.map(g => {
                const pct = Math.round((g.progress / g.target) * 100);
                return `<div class="goal">
                    <div style="font-weight: 600; margin-bottom: 8px;">${g.name}</div>
                    <div class="progress-bar"><div class="progress-fill" style="width: ${pct}%;"></div></div>
                    <div style="font-size: 12px; color: #CBD5E1; margin-bottom: 8px;">${g.progress}/${g.target} (${pct}%)</div>
                    <div style="display: flex; gap: 8px;">
                        <button onclick="updateProgress(${g.id}, 10)" style="flex: 1; padding: 6px; font-size: 12px; margin: 0;">+10</button>
                        <button onclick="updateProgress(${g.id}, 25)" style="flex: 1; padding: 6px; font-size: 12px; margin: 0;">+25</button>
                        <button onclick="deleteGoal(${g.id})" style="flex: 0.5; padding: 6px; margin: 0; background: #F97316;">×</button>
                    </div>
                </div>`;
            }).join('');
        }

        displayGoals();
    </script>
</body>
</html>
