<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple Notes — Capture Ideas Instantly</title>
  <meta name="description" content="Fast, offline-first note taking with search and organization." />
  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="theme-color" content="#08050d" />
  <style>
    :root {
      --canvas: #08050d;
      --magenta: #ff1f5a;
      --purple: #7c3aed;
      --cyan: #00d8ff;
      --green: #00e887;
      --gold: #f5c000;
      --pink: #ff6fc8;
      --white: #ffffff;
      --muted: #a0a0b0;
      --card: #1a1325;
      --card-2: #221a30;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--canvas);
      color: var(--white);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      padding-bottom: 80px;
    }
    a { color: inherit; text-decoration: none; }
    .wrap { max-width: 480px; margin: 0 auto; padding: 0 20px; }

    /* Header */
    header {
      padding: 32px 0 24px;
      text-align: center;
      background: radial-gradient(60% 120% at 50% -10%, rgba(245, 192, 0, 0.2), transparent 60%);
    }
    .eyebrow {
      display: inline-block;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      font-size: 11px;
      color: var(--gold);
      margin-bottom: 12px;
      font-weight: 700;
    }
    h1 {
      font-size: 32px;
      font-weight: 900;
      line-height: 1.1;
      background: linear-gradient(120deg, var(--gold), var(--magenta));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }
    .sub { color: var(--muted); font-size: 14px; }

    /* Tab Navigation */
    .tabs {
      display: flex;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      margin-bottom: 24px;
      gap: 4px;
      overflow-x: auto;
    }
    .tab {
      flex: 1;
      min-width: 80px;
      padding: 14px 12px;
      background: none;
      border: none;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
      border-bottom: 3px solid transparent;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .tab:hover { color: var(--white); }
    .tab.active {
      color: var(--gold);
      border-bottom-color: var(--gold);
    }

    /* Tab Content */
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* Note Card */
    .note-card {
      padding: 16px;
      background: var(--card);
      border: 1px solid rgba(245, 192, 0, 0.1);
      border-radius: 12px;
      margin-bottom: 12px;
      cursor: pointer;
      transition: 0.2s;
      position: relative;
      min-height: 80px;
      display: flex;
      flex-direction: column;
    }
    .note-card:hover {
      border-color: var(--gold);
      background: var(--card-2);
    }
    .note-title {
      font-weight: 700;
      font-size: 15px;
      margin-bottom: 6px;
      color: var(--white);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .note-preview {
      font-size: 13px;
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      flex: 1;
    }
    .note-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 11px;
      color: var(--muted);
    }
    .note-tag {
      display: inline-block;
      padding: 3px 8px;
      background: rgba(245, 192, 0, 0.15);
      border-radius: 4px;
      color: var(--gold);
      font-weight: 700;
      font-size: 10px;
      text-transform: uppercase;
    }
    .note-delete {
      background: rgba(255, 31, 90, 0.2);
      color: var(--magenta);
      border: none;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 10px;
      font-weight: 700;
    }
    .note-delete:hover {
      background: rgba(255, 31, 90, 0.3);
    }

    /* Editor */
    .editor {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--canvas);
      z-index: 50;
      overflow-y: auto;
      padding-bottom: 80px;
    }
    .editor.show {
      display: flex;
      flex-direction: column;
    }
    .editor-header {
      padding: 16px 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      position: sticky;
      top: 0;
      background: rgba(8, 5, 13, 0.95);
    }
    .editor-header button {
      padding: 8px 12px;
      background: none;
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--muted);
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
      transition: 0.2s;
    }
    .editor-header button:hover {
      border-color: var(--gold);
      color: var(--gold);
    }
    .editor-header .close-btn {
      background: linear-gradient(120deg, var(--gold), var(--magenta));
      border-color: transparent;
      color: var(--white);
    }
    .editor-content {
      flex: 1;
      padding: 20px;
    }
    .editor-title {
      font-size: 28px;
      font-weight: 900;
      width: 100%;
      border: none;
      background: none;
      color: var(--white);
      margin-bottom: 12px;
      padding: 8px 0;
      outline: none;
      font-family: inherit;
    }
    .editor-body {
      font-size: 14px;
      width: 100%;
      height: 300px;
      border: none;
      background: rgba(255, 255, 255, 0.05);
      color: var(--white);
      padding: 12px;
      border-radius: 8px;
      outline: none;
      font-family: inherit;
      resize: none;
    }
    .editor-body:focus {
      border: 1px solid var(--gold);
    }
    .editor-tag-input {
      margin-top: 12px;
      padding: 8px;
      background: rgba(245, 192, 0, 0.1);
      border: 1px solid rgba(245, 192, 0, 0.3);
      color: var(--white);
      border-radius: 6px;
      font-size: 12px;
      font-family: inherit;
      outline: none;
    }
    .editor-tag-input:focus {
      border-color: var(--gold);
      background: rgba(245, 192, 0, 0.15);
    }

    /* Search */
    .search-input {
      width: 100%;
      padding: 12px;
      background: var(--card);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--white);
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 16px;
      font-family: inherit;
    }
    .search-input:focus {
      outline: none;
      border-color: var(--gold);
      background: var(--card-2);
    }

    /* Controls */
    .controls {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
    }
    .btn {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
      font-size: 13px;
      transition: 0.2s;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .btn-primary {
      background: linear-gradient(120deg, var(--gold), var(--magenta));
      color: var(--white);
    }
    .btn-primary:hover { transform: translateY(-2px); }

    /* Stats */
    .stats-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }
    .stat-box {
      padding: 16px;
      background: var(--card);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      text-align: center;
    }
    .stat-label {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 6px;
      font-weight: 700;
    }
    .stat-value {
      font-size: 28px;
      font-weight: 900;
      color: var(--gold);
    }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }
    .empty-state .emoji {
      font-size: 48px;
      margin-bottom: 12px;
    }

    /* Premium Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    .modal.show { display: flex; }
    .modal-content {
      background: var(--card-2);
      border: 1px solid rgba(245, 192, 0, 0.2);
      border-radius: 20px;
      padding: 32px 24px;
      max-width: 320px;
      text-align: center;
      animation: slide-up 0.3s ease;
    }
    @keyframes slide-up {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .modal-icon {
      font-size: 48px;
      margin-bottom: 16px;
    }
    .modal h2 {
      font-size: 20px;
      margin-bottom: 8px;
    }
    .modal p {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 24px;
    }
    .modal .btn { margin-top: 12px; }

    /* Responsive */
    @media (max-width: 480px) {
      h1 { font-size: 28px; }
      .editor-title { font-size: 24px; }
    }
  </style>
</head>
<body>
<header>
  <div class="wrap">
    <span class="eyebrow">Simple Notes</span>
    <h1>📝 Capture Ideas</h1>
    <p class="sub">Fast, offline-first note taking.</p>
  </div>
</header>

<div class="wrap" style="margin-top: 24px;">
  <div class="tabs">
    <button class="tab active" data-tab="notes">My Notes</button>
    <button class="tab" data-tab="stats">Stats</button>
  </div>

  <!-- Notes Tab -->
  <div id="notes" class="tab-content active">
    <input type="text" class="search-input" id="search-input" placeholder="Search notes..." />

    <button class="btn btn-primary" id="new-note-btn" style="width: 100%; margin-bottom: 16px;">+ New Note</button>

    <div id="notes-list"></div>
  </div>

  <!-- Stats Tab -->
  <div id="stats" class="tab-content">
    <div class="stat-box" style="width: 100%; margin-bottom: 16px;">
      <div class="stat-label">Total Notes</div>
      <div class="stat-value" id="total-notes">0</div>
    </div>

    <div class="stats-row">
      <div class="stat-box">
        <div class="stat-label">Characters</div>
        <div class="stat-value" id="total-chars">0</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Words</div>
        <div class="stat-value" id="total-words">0</div>
      </div>
    </div>

    <div class="stat-box" style="width: 100%; margin-top: 16px;">
      <div class="stat-label">Most Recent</div>
      <div style="color: var(--gold); font-size: 13px; margin-top: 8px;" id="recent-date">-</div>
    </div>
  </div>
</div>

<!-- Note Editor -->
<div id="editor" class="editor">
  <div class="editor-header">
    <button id="save-btn">Save</button>
    <button class="close-btn" id="close-editor-btn">Done</button>
  </div>
  <div class="editor-content">
    <input type="text" class="editor-title" id="editor-title" placeholder="Note title..." />
    <textarea class="editor-body" id="editor-body" placeholder="Start typing..."></textarea>
    <input type="text" class="editor-tag-input" id="editor-tag" placeholder="Add tag..." />
  </div>
</div>

<!-- Premium Modal -->
<div id="premium-modal" class="modal">
  <div class="modal-content">
    <div class="modal-icon">✨</div>
    <h2>Unlock Premium</h2>
    <p>Unlimited notes, cloud sync, and rich formatting.</p>
    <button class="btn btn-primary" id="unlock-btn">Unlock — $2.99</button>
    <button class="btn btn-secondary" id="close-modal-btn" style="background: var(--card); border: 1px solid rgba(255,255,255,.12); color: var(--muted);">Maybe Later</button>
  </div>
</div>

<script>
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("./sw.js").catch(() => {});
  }

  let state = {
    premium: localStorage.getItem("sn_premium") === "true",
    notes: JSON.parse(localStorage.getItem("sn_notes") || "[]"),
  };

  let currentNote = null;
  let searchTerm = "";

  // Tab switching
  document.querySelectorAll(".tab").forEach(tab => {
    tab.addEventListener("click", (e) => {
      document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
      document.querySelectorAll(".tab-content").forEach(c => c.classList.remove("active"));
      e.target.classList.add("active");
      const tabName = e.target.dataset.tab;
      document.getElementById(tabName).classList.add("active");
      if (tabName === "stats") renderStats();
    });
  });

  // New note button
  document.getElementById("new-note-btn").addEventListener("click", () => {
    if (!state.premium && state.notes.length >= 30) {
      showPremiumModal("Free tier limited to 30 notes. Unlock Premium for unlimited.");
      return;
    }
    currentNote = { id: Date.now(), title: "", body: "", tag: "", created: new Date().toISOString() };
    openEditor();
  });

  // Editor controls
  document.getElementById("close-editor-btn").addEventListener("click", closeEditor);
  document.getElementById("save-btn").addEventListener("click", saveNote);

  // Search
  document.getElementById("search-input").addEventListener("input", (e) => {
    searchTerm = e.target.value.toLowerCase();
    renderNotes();
  });

  // Premium modal
  document.getElementById("unlock-btn").addEventListener("click", () => {
    state.premium = true;
    localStorage.setItem("sn_premium", "true");
    document.getElementById("premium-modal").classList.remove("show");
  });

  document.getElementById("close-modal-btn").addEventListener("click", () => {
    document.getElementById("premium-modal").classList.remove("show");
  });

  function showPremiumModal(msg) {
    const modal = document.getElementById("premium-modal");
    modal.querySelector("p").textContent = msg || "Upgrade to Premium for more features.";
    modal.classList.add("show");
  }

  function openEditor() {
    document.getElementById("editor-title").value = currentNote.title;
    document.getElementById("editor-body").value = currentNote.body;
    document.getElementById("editor-tag").value = currentNote.tag;
    document.getElementById("editor").classList.add("show");
    document.getElementById("editor-title").focus();
  }

  function closeEditor() {
    document.getElementById("editor").classList.remove("show");
    currentNote = null;
  }

  function saveNote() {
    if (!currentNote.title.trim() && !currentNote.body.trim()) {
      alert("Note cannot be empty.");
      return;
    }

    currentNote.title = document.getElementById("editor-title").value.trim();
    currentNote.body = document.getElementById("editor-body").value.trim();
    currentNote.tag = document.getElementById("editor-tag").value.trim();

    const existing = state.notes.findIndex(n => n.id === currentNote.id);
    if (existing >= 0) {
      state.notes[existing] = { ...currentNote, updated: new Date().toISOString() };
    } else {
      state.notes.push(currentNote);
    }

    localStorage.setItem("sn_notes", JSON.stringify(state.notes));
    closeEditor();
    renderNotes();
  }

  function deleteNote(id) {
    if (confirm("Delete this note?")) {
      state.notes = state.notes.filter(n => n.id !== id);
      localStorage.setItem("sn_notes", JSON.stringify(state.notes));
      renderNotes();
    }
  }

  function editNote(id) {
    currentNote = { ...state.notes.find(n => n.id === id) };
    openEditor();
  }

  function renderNotes() {
    const list = document.getElementById("notes-list");
    list.innerHTML = "";

    let filtered = state.notes.filter(n =>
      n.title.toLowerCase().includes(searchTerm) ||
      n.body.toLowerCase().includes(searchTerm) ||
      n.tag.toLowerCase().includes(searchTerm)
    );

    if (filtered.length === 0) {
      list.innerHTML = '<div class="empty-state"><div class="emoji">📭</div><p>No notes yet. Create one!</p></div>';
      return;
    }

    filtered.sort((a, b) => new Date(b.updated || b.created) - new Date(a.updated || a.created)).forEach(note => {
      const date = new Date(note.updated || note.created);
      const dateStr = date.toLocaleDateString();
      const div = document.createElement("div");
      div.className = "note-card";
      div.addEventListener("click", () => editNote(note.id));
      div.innerHTML = `
        <div class="note-title">${note.title || "Untitled"}</div>
        <div class="note-preview">${note.body}</div>
        <div class="note-meta">
          <div>
            ${note.tag ? `<span class="note-tag">${note.tag}</span>` : ""}
          </div>
          <div style="display: flex; gap: 8px; align-items: center;">
            <span>${dateStr}</span>
            <button class="note-delete" onclick="event.stopPropagation(); deleteNote(${note.id})">✕</button>
          </div>
        </div>
      `;
      list.appendChild(div);
    });
  }

  function renderStats() {
    const totalChars = state.notes.reduce((sum, n) => sum + n.body.length, 0);
    const totalWords = state.notes.reduce((sum, n) => sum + n.body.split(/\s+/).filter(w => w).length, 0);
    const recent = state.notes.length > 0 ? new Date(state.notes[state.notes.length - 1].created).toLocaleDateString() : "-";

    document.getElementById("total-notes").textContent = state.notes.length;
    document.getElementById("total-chars").textContent = totalChars.toLocaleString();
    document.getElementById("total-words").textContent = totalWords.toLocaleString();
    document.getElementById("recent-date").textContent = recent;
  }

  renderNotes();
</script>
</body>
</html>
