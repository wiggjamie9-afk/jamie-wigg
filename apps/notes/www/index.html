<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Simple Notes: Quick note-taking app to capture ideas anytime">
    <meta name="theme-color" content="#F59E0B">
    <title>Simple Notes – Capture ideas instantly</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        :root {
            --primary: #F59E0B;
            --secondary: #6366F1;
            --accent: #10B981;
            --bg-dark: #0F172A;
            --bg-light: #1E293B;
            --text-primary: #F1F5F9;
            --text-secondary: #CBD5E1;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { font-family: system-ui, sans-serif; background: var(--bg-dark); color: var(--text-primary); min-height: 100vh; }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .header {
            text-align: center;
            padding: 16px 0;
            border-bottom: 2px solid var(--primary);
        }

        .header h1 { font-size: 28px; margin-bottom: 4px; }
        .header p { font-size: 14px; color: var(--text-secondary); }

        .new-note-form {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 16px;
            background: var(--bg-light);
            border-radius: 8px;
            border: 2px solid var(--primary);
        }

        textarea {
            width: 100%;
            padding: 12px;
            background: #0F172A;
            color: var(--text-primary);
            border: 1px solid var(--secondary);
            border-radius: 6px;
            font-family: system-ui, sans-serif;
            font-size: 14px;
            resize: vertical;
            min-height: 100px;
        }

        textarea::placeholder { color: var(--text-secondary); }
        textarea:focus { outline: none; border-color: var(--primary); }

        button {
            padding: 12px 20px;
            background: var(--primary);
            color: #000;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:hover { opacity: 0.9; }
        button:active { opacity: 0.8; }

        .notes-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .note-item {
            padding: 12px;
            background: var(--bg-light);
            border-left: 4px solid var(--secondary);
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .note-item:hover { background: rgba(99, 102, 241, 0.1); }

        .note-title {
            font-weight: bold;
            margin-bottom: 4px;
            font-size: 14px;
        }

        .note-preview {
            color: var(--text-secondary);
            font-size: 13px;
            line-height: 1.4;
            margin-bottom: 8px;
        }

        .note-date {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .delete-btn {
            padding: 6px 12px;
            background: #EF4444;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            margin-top: 8px;
        }

        .delete-btn:hover { opacity: 0.9; }

        .empty-state {
            text-align: center;
            padding: 40px 16px;
            color: var(--text-secondary);
        }

        .stats {
            padding: 12px;
            background: var(--bg-light);
            border-radius: 6px;
            text-align: center;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📝 Simple Notes</h1>
            <p>Capture your thoughts instantly</p>
        </div>

        <div class="new-note-form">
            <textarea id="noteInput" placeholder="Write your note here..."></textarea>
            <button onclick="addNote()">Add Note</button>
        </div>

        <div class="stats">
            <span id="noteCount">0 notes</span>
        </div>

        <div id="notesList" class="notes-list"></div>
        <div id="emptyState" class="empty-state">
            <p>No notes yet. Create your first note! 🚀</p>
        </div>
    </div>

    <script>
        const appState = {
            notes: JSON.parse(localStorage.getItem('notes')) || [],

            save() {
                localStorage.setItem('notes', JSON.stringify(this.notes));
            }
        };

        function addNote() {
            const input = document.getElementById('noteInput');
            const text = input.value.trim();

            if (!text) {
                showToast('Note cannot be empty', 'error');
                return;
            }

            const note = {
                id: Date.now(),
                text: text,
                date: new Date().toLocaleString()
            };

            appState.notes.unshift(note);
            appState.save();
            input.value = '';

            showToast('Note added! ✨', 'success');
            render();
        }

        function deleteNote(id) {
            appState.notes = appState.notes.filter(n => n.id !== id);
            appState.save();
            showToast('Note deleted', 'info');
            render();
        }

        function render() {
            const list = document.getElementById('notesList');
            const empty = document.getElementById('emptyState');
            const count = document.getElementById('noteCount');

            count.textContent = `${appState.notes.length} note${appState.notes.length !== 1 ? 's' : ''}`;

            if (appState.notes.length === 0) {
                list.style.display = 'none';
                empty.style.display = 'block';
                return;
            }

            list.style.display = 'flex';
            empty.style.display = 'none';
            list.innerHTML = appState.notes.map(note => `
                <div class="note-item">
                    <div class="note-preview">${note.text.substring(0, 60)}${note.text.length > 60 ? '...' : ''}</div>
                    <div class="note-date">${note.date}</div>
                    <button class="delete-btn" onclick="deleteNote(${note.id})">Delete</button>
                </div>
            `).join('');
        }

        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            toast.style.cssText = `
                position: fixed;
                bottom: 20px;
                left: 50%;
                transform: translateX(-50%);
                padding: 12px 20px;
                background: ${type === 'success' ? '#10B981' : type === 'error' ? '#EF4444' : '#6366F1'};
                color: white;
                border-radius: 6px;
                font-size: 14px;
                z-index: 1000;
            `;
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        render();
    </script>
</body>
</html>
