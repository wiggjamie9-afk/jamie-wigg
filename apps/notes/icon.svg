<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#241a33"/>
      <stop offset="100%" stop-color="#08050d"/>
    </radialGradient>
    <linearGradient id="notepad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5c000"/>
      <stop offset="100%" stop-color="#ff1f5a"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="180" fill="rgba(245, 192, 0, 0.1)"/>

  <!-- Notepad -->
  <g transform="translate(256, 256)">
    <!-- Paper sheet -->
    <rect x="-70" y="-90" width="140" height="180" fill="none" stroke="url(#notepad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" rx="8"/>
    <!-- Text lines -->
    <line x1="-50" y1="-60" x2="50" y2="-60" stroke="rgba(245, 192, 0, 0.5)" stroke-width="5" stroke-linecap="round"/>
    <line x1="-50" y1="-25" x2="50" y2="-25" stroke="rgba(245, 192, 0, 0.5)" stroke-width="5" stroke-linecap="round"/>
    <line x1="-50" y1="10" x2="40" y2="10" stroke="rgba(245, 192, 0, 0.4)" stroke-width="5" stroke-linecap="round"/>
    <line x1="-50" y1="45" x2="35" y2="45" stroke="rgba(255, 31, 90, 0.4)" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Glow -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="rgba(245, 192, 0, 0.3)" stroke-width="3" opacity="0.6"/>
</svg>
