<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#241a33"/>
      <stop offset="100%" stop-color="#08050d"/>
    </radialGradient>
    <linearGradient id="dumbbell" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d8ff"/>
      <stop offset="100%" stop-color="#00e887"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="180" fill="rgba(0, 216, 255, 0.1)"/>
  <!-- Dumbbell -->
  <g transform="translate(256, 256)">
    <!-- Left plate -->
    <rect x="-140" y="-24" width="32" height="48" rx="4" fill="url(#dumbbell)"/>
    <!-- Left handle -->
    <rect x="-100" y="-16" width="80" height="32" rx="8" fill="url(#dumbbell)" opacity="0.8"/>
    <!-- Right plate -->
    <rect x="108" y="-24" width="32" height="48" rx="4" fill="url(#dumbbell)"/>
    <!-- Right handle -->
    <rect x="20" y="-16" width="80" height="32" rx="8" fill="url(#dumbbell)" opacity="0.8"/>
    <!-- Center grip -->
    <rect x="-12" y="-20" width="24" height="40" rx="6" fill="#ff1f5a" opacity="0.9"/>
  </g>
  <!-- Strength aura -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="rgba(0, 232, 135, 0.3)" stroke-width="3" opacity="0.6"/>
</svg>
