<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="FitCoach Pro — AI-powered personal training, offline-first.">
  <title>FitCoach Pro</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="theme-color" content="#08050d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FitCoach Pro">
  <link rel="apple-touch-icon" href="./icon.svg">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --canvas: #08050d;
      --fg: #ffffff;
      --magenta: #ff1f5a;
      --purple: #7c3aed;
      --cyan: #00d8ff;
      --green: #00e887;
      --gold: #f5c000;
      --pink: #ff6fc8;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--canvas);
      color: var(--fg);
      line-height: 1.5;
      overflow-x: hidden;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 100vh;
    }

    .container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: 480px;
      margin: 0 auto;
      background: linear-gradient(135deg, #0f0815 0%, #1a0f25 100%);
      position: relative;
      overflow: hidden;
    }

    .header {
      background: linear-gradient(90deg, rgba(127, 60, 237, 0.1) 0%, rgba(255, 107, 200, 0.1) 100%);
      border-bottom: 1px solid rgba(255, 31, 90, 0.2);
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .header h1 {
      font-size: 24px;
      font-weight: 600;
      background: linear-gradient(90deg, var(--cyan), var(--green));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .header-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255, 31, 90, 0.2);
      border: 1px solid var(--magenta);
      color: var(--magenta);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      transition: 0.3s;
    }

    .header-btn:hover {
      background: rgba(255, 31, 90, 0.3);
      transform: scale(1.05);
    }

    .nav-tabs {
      display: flex;
      gap: 0;
      padding: 12px;
      border-bottom: 1px solid rgba(255, 31, 90, 0.1);
      overflow-x: auto;
      scroll-behavior: smooth;
    }

    .nav-tabs::-webkit-scrollbar { display: none; }

    .nav-tab {
      flex-shrink: 0;
      padding: 8px 16px;
      border: 1px solid rgba(255, 31, 90, 0.2);
      border-radius: 20px;
      background: transparent;
      color: rgba(255, 255, 255, 0.6);
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: 0.3s;
    }

    .nav-tab.active {
      background: var(--magenta);
      color: var(--canvas);
      border-color: var(--magenta);
    }

    .nav-tab:hover {
      border-color: var(--magenta);
    }

    .content {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      scroll-behavior: smooth;
    }

    .content::-webkit-scrollbar {
      width: 6px;
    }

    .content::-webkit-scrollbar-track {
      background: rgba(255, 31, 90, 0.05);
    }

    .content::-webkit-scrollbar-thumb {
      background: rgba(255, 31, 90, 0.3);
      border-radius: 3px;
    }

    .screen { display: none; }
    .screen.active { display: block; }

    /* Screens */
    .onboard-screen {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100%;
      text-align: center;
      gap: 30px;
    }

    .orb-avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, rgba(0, 216, 255, 0.8), rgba(124, 58, 237, 0.4));
      position: relative;
      animation: pulse-orb 3s ease-in-out infinite;
      box-shadow: 0 0 40px rgba(0, 216, 255, 0.4);
    }

    @keyframes pulse-orb {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }

    .onboard-screen h2 {
      font-size: 28px;
      background: linear-gradient(90deg, var(--cyan), var(--green));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-weight: 600;
    }

    .onboard-screen p {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.7);
      max-width: 280px;
    }

    .input-group {
      width: 100%;
      max-width: 300px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .input-group input {
      padding: 12px 16px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 31, 90, 0.3);
      color: var(--fg);
      font-size: 14px;
      font-family: inherit;
      transition: 0.3s;
    }

    .input-group input:focus {
      outline: none;
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--magenta);
    }

    .input-group input::placeholder {
      color: rgba(255, 255, 255, 0.4);
    }

    .level-selector {
      display: flex;
      gap: 12px;
    }

    .level-btn {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      background: rgba(255, 31, 90, 0.1);
      border: 1px solid rgba(255, 31, 90, 0.3);
      color: var(--fg);
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: 0.3s;
    }

    .level-btn.selected {
      background: var(--magenta);
      border-color: var(--magenta);
      color: var(--canvas);
    }

    .level-btn:hover {
      border-color: var(--magenta);
    }

    .cta-btn {
      padding: 14px 28px;
      border-radius: 8px;
      background: linear-gradient(90deg, var(--magenta), var(--pink));
      border: none;
      color: var(--canvas);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .cta-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(255, 31, 90, 0.4);
    }

    .cta-btn:active {
      transform: translateY(0);
    }

    /* Workout list */
    .workout-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    .workout-card {
      background: linear-gradient(135deg, rgba(127, 60, 237, 0.1) 0%, rgba(255, 107, 200, 0.05) 100%);
      border: 1px solid rgba(255, 31, 90, 0.2);
      border-radius: 12px;
      padding: 16px;
      cursor: pointer;
      transition: 0.3s;
    }

    .workout-card:hover {
      background: linear-gradient(135deg, rgba(127, 60, 237, 0.15) 0%, rgba(255, 107, 200, 0.1) 100%);
      border-color: var(--magenta);
      transform: translateY(-2px);
    }

    .workout-card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 8px;
    }

    .workout-card h3 {
      font-size: 16px;
      font-weight: 600;
      color: var(--cyan);
    }

    .workout-badge {
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 4px;
      background: rgba(0, 216, 255, 0.2);
      color: var(--cyan);
      font-weight: 600;
    }

    .workout-badge.premium {
      background: rgba(245, 192, 0, 0.2);
      color: var(--gold);
    }

    .workout-card-meta {
      display: flex;
      gap: 12px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.6);
    }

    .workout-card-desc {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.6);
      margin-top: 8px;
    }

    /* Active workout */
    .active-workout {
      text-align: center;
    }

    .active-workout h2 {
      font-size: 28px;
      margin-bottom: 20px;
      color: var(--cyan);
    }

    .exercise-card {
      background: linear-gradient(135deg, rgba(124, 58, 237, 0.15) 0%, rgba(255, 31, 90, 0.1) 100%);
      border: 1px solid rgba(255, 31, 90, 0.3);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 16px;
      text-align: center;
    }

    .exercise-name {
      font-size: 20px;
      font-weight: 600;
      color: var(--green);
      margin-bottom: 16px;
    }

    .rep-counter {
      font-size: 64px;
      font-weight: 700;
      color: var(--magenta);
      margin: 24px 0;
      font-variant-numeric: tabular-nums;
    }

    .counter-controls {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
    }

    .counter-btn {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      background: rgba(255, 31, 90, 0.2);
      border: 1px solid var(--magenta);
      color: var(--magenta);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s;
    }

    .counter-btn:hover {
      background: rgba(255, 31, 90, 0.3);
    }

    .counter-btn.increment {
      background: rgba(0, 232, 135, 0.2);
      border-color: var(--green);
      color: var(--green);
    }

    .counter-btn.increment:hover {
      background: rgba(0, 232, 135, 0.3);
    }

    .exercise-form {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.6);
      margin-bottom: 16px;
      padding: 12px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 8px;
      border-left: 3px solid var(--purple);
    }

    .exercise-form strong { color: var(--cyan); }

    .set-progress {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      justify-content: center;
    }

    .set-indicator {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 600;
      background: rgba(255, 31, 90, 0.2);
      border: 1px solid rgba(255, 31, 90, 0.4);
      color: rgba(255, 255, 255, 0.6);
    }

    .set-indicator.active {
      background: var(--magenta);
      color: var(--canvas);
      border-color: var(--magenta);
    }

    .set-indicator.done {
      background: var(--green);
      color: var(--canvas);
      border-color: var(--green);
    }

    .next-btn {
      padding: 12px 24px;
      border-radius: 8px;
      background: linear-gradient(90deg, var(--cyan), var(--green));
      border: none;
      color: var(--canvas);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s;
      width: 100%;
    }

    .next-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0, 232, 135, 0.3);
    }

    /* Stats */
    .stat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }

    .stat-card {
      background: linear-gradient(135deg, rgba(124, 58, 237, 0.15) 0%, rgba(255, 31, 90, 0.1) 100%);
      border: 1px solid rgba(255, 31, 90, 0.2);
      border-radius: 12px;
      padding: 16px;
      text-align: center;
    }

    .stat-value {
      font-size: 28px;
      font-weight: 700;
      color: var(--cyan);
      margin-bottom: 4px;
    }

    .stat-label {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.6);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Premium paywall */
    .premium-lock {
      background: linear-gradient(135deg, rgba(245, 192, 0, 0.15) 0%, rgba(255, 31, 90, 0.1) 100%);
      border: 1px solid rgba(245, 192, 0, 0.3);
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      margin: 20px 0;
    }

    .premium-lock h3 {
      color: var(--gold);
      font-size: 18px;
      margin-bottom: 12px;
    }

    .premium-lock p {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.7);
      margin-bottom: 16px;
    }

    .unlock-btn {
      padding: 12px 24px;
      border-radius: 8px;
      background: linear-gradient(90deg, var(--gold), var(--magenta));
      border: none;
      color: var(--canvas);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s;
    }

    .unlock-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(245, 192, 0, 0.3);
    }

    .streak {
      font-size: 48px;
      margin-bottom: 12px;
    }

    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.8);
      z-index: 100;
      justify-content: center;
      align-items: center;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-content {
      background: linear-gradient(135deg, #0f0815 0%, #1a0f25 100%);
      border: 1px solid rgba(255, 31, 90, 0.3);
      border-radius: 16px;
      padding: 24px;
      max-width: 90%;
      max-height: 80vh;
      overflow-y: auto;
      text-align: center;
    }

    .modal-content h3 {
      font-size: 20px;
      margin-bottom: 16px;
      color: var(--cyan);
    }

    .modal-close {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(255, 31, 90, 0.2);
      border: 1px solid var(--magenta);
      color: var(--magenta);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    @media (max-width: 480px) {
      .container { max-width: 100%; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>FitCoach Pro</h1>
      <button class="header-btn" id="settingsBtn">⚙️</button>
    </div>

    <div class="nav-tabs">
      <button class="nav-tab active" data-tab="workouts">Workouts</button>
      <button class="nav-tab" data-tab="progress">Progress</button>
      <button class="nav-tab" data-tab="settings">Settings</button>
    </div>

    <div class="content">
      <!-- Onboarding -->
      <div class="screen onboard-screen active" id="onboard">
        <div class="orb-avatar"></div>
        <div>
          <h2>Welcome to FitCoach Pro</h2>
          <p>Your AI-powered personal trainer, always with you</p>
        </div>
        <div class="input-group">
          <input type="text" id="nameInput" placeholder="What's your name?">
          <div>
            <p style="font-size: 12px; color: rgba(255,255,255,0.6); margin-bottom: 8px;">Experience Level</p>
            <div class="level-selector">
              <button class="level-btn selected" data-level="beginner">Beginner</button>
              <button class="level-btn" data-level="intermediate">Intermediate</button>
              <button class="level-btn" data-level="advanced">Advanced</button>
            </div>
          </div>
        </div>
        <button class="cta-btn" id="startBtn">Start Training</button>
      </div>

      <!-- Workouts -->
      <div class="screen" id="workouts">
        <div class="workout-grid" id="workoutList"></div>
      </div>

      <!-- Active Workout -->
      <div class="screen" id="activeWorkout"></div>

      <!-- Progress -->
      <div class="screen" id="progress">
        <h2 style="margin-bottom: 20px; color: var(--cyan);">Your Progress</h2>
        <div class="stat-grid" id="statsGrid"></div>
        <h3 style="color: var(--green); margin-bottom: 16px; margin-top: 24px;">This Week</h3>
        <div id="weekChart" style="height: 200px; background: rgba(255,31,90,0.05); border-radius: 8px; border: 1px solid rgba(255,31,90,0.1); padding: 16px; display: flex; align-items: flex-end; gap: 8px;"></div>
      </div>

      <!-- Settings -->
      <div class="screen" id="settings">
        <h2 style="margin-bottom: 20px; color: var(--cyan);">Settings</h2>
        <div style="display: flex; flex-direction: column; gap: 12px;">
          <div style="background: rgba(255,31,90,0.1); border-radius: 8px; padding: 12px;">
            <p style="font-size: 12px; color: rgba(255,255,255,0.6); margin-bottom: 8px;">Athlete Name</p>
            <p style="font-size: 16px; color: var(--cyan); font-weight: 600;" id="settingsName">—</p>
          </div>
          <div style="background: rgba(255,31,90,0.1); border-radius: 8px; padding: 12px;">
            <p style="font-size: 12px; color: rgba(255,255,255,0.6); margin-bottom: 8px;">Level</p>
            <p style="font-size: 16px; color: var(--green); font-weight: 600; text-transform: capitalize;" id="settingsLevel">—</p>
          </div>
          <div style="background: rgba(255,31,90,0.1); border-radius: 8px; padding: 12px;">
            <p style="font-size: 12px; color: rgba(255,255,255,0.6); margin-bottom: 8px;">Workouts Completed</p>
            <p style="font-size: 16px; color: var(--cyan); font-weight: 600;" id="settingsCount">0</p>
          </div>
          <button class="cta-btn" id="resetBtn" style="margin-top: 12px;">Reset Data</button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="modal">
    <div class="modal-content">
      <button class="modal-close" id="closeModal">✕</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');

    const S = {
      name: localStorage.getItem('fc_name') || '',
      level: localStorage.getItem('fc_level') || 'beginner',
      workouts: 0,
      currentWorkout: null,
      currentExercise: 0,
      premium: localStorage.getItem('fc_premium') === 'true',
    };

    const WORKOUTS = {
      beginner: [
        { id: 1, name: 'Full Body Starter', duration: '20 min', exercises: 4, desc: 'Bodyweight fundamentals', reps: [10, 10, 10, 10] },
        { id: 2, name: 'Core Blast', duration: '15 min', exercises: 5, desc: 'Ab & core work', reps: [15, 15, 12, 12, 10], free: true },
        { id: 3, name: 'Lower Body', duration: '25 min', exercises: 4, desc: 'Quads, glutes, hamstring', reps: [12, 12, 12, 12] },
      ],
      intermediate: [
        { id: 4, name: 'Upper Body Push', duration: '30 min', exercises: 6, desc: 'Chest, shoulders, triceps', reps: [8, 8, 10, 10, 12, 12] },
        { id: 5, name: 'Lower Body Power', duration: '35 min', exercises: 5, desc: 'Strength & hypertrophy', reps: [6, 8, 10, 12, 12] },
        { id: 6, name: 'HIIT Cardio', duration: '20 min', exercises: 8, desc: 'Interval training', reps: [40, 40, 40, 40, 40, 40, 40, 40] },
      ],
      advanced: [
        { id: 7, name: 'Periodized Split A', duration: '45 min', exercises: 7, desc: 'Heavy compound focus', reps: [5, 6, 8, 8, 10, 12, 12] },
        { id: 8, name: 'Periodized Split B', duration: '45 min', exercises: 8, desc: 'Hypertrophy & volume', reps: [8, 10, 10, 12, 12, 15, 15, 15] },
      ],
    };

    const EXERCISES = {
      1: { name: 'Push-ups', form: 'Keep chest low, shoulders back, engage core', sets: 3 },
      2: { name: 'Bodyweight Squats', form: 'Knees track over toes, chest up, weight in heels', sets: 3 },
      3: { name: 'Plank', form: 'Neutral spine, engage glutes & core, no sagging', sets: 3 },
      4: { name: 'Lunges', form: 'Front knee over ankle, back knee toward floor', sets: 3 },
      5: { name: 'Crunches', form: 'Small controlled movement, no neck strain', sets: 3 },
      6: { name: 'Dumbbell Bench Press', form: 'Full ROM, controlled descent, chest to floor', sets: 4 },
      7: { name: 'Incline Dumbbell Press', form: 'Elbows slightly forward, lower to chest', sets: 4 },
      8: { name: 'Barbell Back Squat', form: 'Depth to parallel+, neutral spine, tight core', sets: 4 },
    };

    function save() {
      localStorage.setItem('fc_name', S.name);
      localStorage.setItem('fc_level', S.level);
      localStorage.setItem('fc_premium', S.premium);
    }

    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    function renderWorkouts() {
      const list = document.getElementById('workoutList');
      const workouts = WORKOUTS[S.level];
      list.innerHTML = workouts.map(w => `
        <div class="workout-card" onclick="selectWorkout(${w.id})">
          <div class="workout-card-header">
            <h3>${w.name}</h3>
            ${w.free || S.premium ? '' : '<div class="workout-badge premium">PRO</div>'}
          </div>
          <div class="workout-card-meta">
            <span>⏱️ ${w.duration}</span>
            <span>💪 ${w.exercises} exercises</span>
          </div>
          <div class="workout-card-desc">${w.desc}</div>
        </div>
      `).join('');
    }

    function selectWorkout(id) {
      if (!S.premium && !WORKOUTS[S.level].find(w => w.id === id).free) {
        showPremiumModal();
        return;
      }
      S.currentWorkout = WORKOUTS[S.level].find(w => w.id === id);
      S.currentExercise = 0;
      renderActiveWorkout();
      showScreen('activeWorkout');
    }

    function renderActiveWorkout() {
      const w = S.currentWorkout;
      const ex = EXERCISES[S.currentExercise + 1];
      let html = `<h2>${w.name}</h2>`;
      html += `<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 20px;">
        <div class="stat-card"><div class="stat-label">Exercise</div><div class="stat-value">${S.currentExercise + 1}/${w.exercises}</div></div>
        <div class="stat-card"><div class="stat-label">Reps/Target</div><div class="stat-value">${w.reps[S.currentExercise]}</div></div>
      </div>`;

      if (!S.premium && S.currentExercise >= 2) {
        html += `<div class="premium-lock">
          <h3>🔒 Premium Unlock</h3>
          <p>Get access to all exercises & full workouts</p>
          <button class="unlock-btn" onclick="unlock()">Unlock Pro</button>
        </div>`;
      } else {
        let reps = parseInt(localStorage.getItem(`fc_reps_${S.currentWorkout.id}_${S.currentExercise}`) || '0');
        html += `<div class="exercise-card">
          <div class="exercise-name">${ex.name}</div>
          <div class="exercise-form"><strong>Form:</strong> ${ex.form}</div>
          <div class="rep-counter" id="repCount">${reps}</div>
          <div class="counter-controls">
            <button class="counter-btn" onclick="updateReps(-1)">−1</button>
            <button class="counter-btn" onclick="updateReps(0)">Reset</button>
            <button class="counter-btn increment" onclick="updateReps(1)">+1</button>
          </div>
          <div class="set-progress">
            ${[1,2,3].map((i, idx) => `<div class="set-indicator ${idx < 1 ? 'active' : ''}">${i}</div>`).join('')}
          </div>
        </div>`;
        html += `<button class="next-btn" onclick="nextExercise()">Next Exercise →</button>`;
      }

      document.getElementById('activeWorkout').innerHTML = html;
    }

    function updateReps(delta) {
      if (delta === 0) {
        localStorage.removeItem(`fc_reps_${S.currentWorkout.id}_${S.currentExercise}`);
        document.getElementById('repCount').textContent = '0';
      } else {
        let reps = parseInt(localStorage.getItem(`fc_reps_${S.currentWorkout.id}_${S.currentExercise}`) || '0');
        reps = Math.max(0, reps + delta);
        localStorage.setItem(`fc_reps_${S.currentWorkout.id}_${S.currentExercise}`, reps);
        document.getElementById('repCount').textContent = reps;
      }
    }

    function nextExercise() {
      S.currentExercise++;
      if (S.currentExercise >= S.currentWorkout.exercises) {
        S.workouts++;
        showWorkoutComplete();
      } else {
        renderActiveWorkout();
      }
    }

    function showWorkoutComplete() {
      const modal = document.getElementById('modal');
      document.getElementById('modalBody').innerHTML = `
        <h3>🎉 Workout Complete!</h3>
        <div style="margin: 24px 0;">
          <div class="streak" style="font-size: 48px;">💪</div>
          <p style="font-size: 14px; color: rgba(255,255,255,0.8); margin-bottom: 20px;">Great work! You crushed it.</p>
        </div>
        <button class="cta-btn" onclick="finishWorkout()">Back to Workouts</button>
      `;
      modal.classList.add('active');
    }

    function finishWorkout() {
      document.getElementById('modal').classList.remove('active');
      save();
      renderWorkouts();
      showScreen('workouts');
    }

    function unlock() {
      S.premium = true;
      save();
      renderActiveWorkout();
      document.getElementById('modal').classList.remove('active');
    }

    function showPremiumModal() {
      const modal = document.getElementById('modal');
      document.getElementById('modalBody').innerHTML = `
        <h3>🔓 Unlock FitCoach Pro</h3>
        <p style="margin: 16px 0; color: rgba(255,255,255,0.8); font-size: 14px;">Get full access to all workouts, advanced tracking, and AI coaching.</p>
        <button class="unlock-btn" style="width: 100%;" onclick="unlock()">Unlock Pro — $4.99</button>
        <p style="margin-top: 16px; font-size: 11px; color: rgba(255,255,255,0.5);">Demo unlock available</p>
      `;
      modal.classList.add('active');
    }

    function renderProgress() {
      const stats = [
        { label: 'Workouts', value: S.workouts },
        { label: 'Total Reps', value: Object.keys(localStorage).filter(k => k.startsWith('fc_reps_')).length * 10 },
        { label: 'Streak', value: '3 days 🔥' },
        { label: 'Calories', value: Math.round(S.workouts * 250) },
      ];
      document.getElementById('statsGrid').innerHTML = stats.map(s => `
        <div class="stat-card"><div class="stat-value">${s.value}</div><div class="stat-label">${s.label}</div></div>
      `).join('');

      const chart = document.getElementById('weekChart');
      const days = ['M', 'T', 'W', 'T', 'F', 'S', 'S'];
      const values = [2, 3, 1, 4, 3, 2, 0];
      chart.innerHTML = days.map((d, i) => `
        <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 4px;">
          <div style="width: 100%; background: linear-gradient(180deg, var(--magenta), var(--pink)); border-radius: 4px 4px 0 0; height: ${values[i] * 25}px; min-height: ${values[i] > 0 ? '8px' : '2px'};"></div>
          <span style="font-size: 10px; color: rgba(255,255,255,0.6);">${d}</span>
        </div>
      `).join('');
    }

    // Tab switching
    document.querySelectorAll('.nav-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        const target = tab.dataset.tab;
        if (target === 'workouts') showScreen('workouts');
        else if (target === 'progress') {
          renderProgress();
          showScreen('progress');
        } else if (target === 'settings') {
          document.getElementById('settingsName').textContent = S.name || '—';
          document.getElementById('settingsLevel').textContent = S.level;
          document.getElementById('settingsCount').textContent = S.workouts;
          showScreen('settings');
        }
      });
    });

    // Onboarding
    document.querySelectorAll('.level-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.level-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        S.level = btn.dataset.level;
      });
    });

    document.getElementById('startBtn').addEventListener('click', () => {
      const name = document.getElementById('nameInput').value.trim();
      if (!name) {
        alert('Please enter your name');
        return;
      }
      S.name = name;
      save();
      renderWorkouts();
      showScreen('workouts');
    });

    document.getElementById('settingsBtn').addEventListener('click', showPremiumModal);
    document.getElementById('closeModal').addEventListener('click', () => {
      document.getElementById('modal').classList.remove('active');
    });
    document.getElementById('resetBtn').addEventListener('click', () => {
      if (confirm('Reset all data?')) {
        Object.keys(localStorage).forEach(k => {
          if (k.startsWith('fc_')) localStorage.removeItem(k);
        });
        S.workouts = 0;
        showScreen('onboard');
      }
    });

    // Initialize
    if (S.name) {
      renderWorkouts();
      showScreen('workouts');
    }
  </script>
</body>
</html>
