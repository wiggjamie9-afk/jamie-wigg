<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning Accelerator — Master any skill faster</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #004e89 0%, #1a7fa0 100%);
            color: #f1f5f9;
            min-height: 100vh;
            padding: 16px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            padding: 24px 0 16px;
            border-bottom: 1px solid rgba(34, 197, 94, 0.3);
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(90deg, #4ade80, #22c55e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            font-size: 14px;
            color: #4ade80;
        }

        #onboard { animation: fadeIn 0.4s ease-out; }

        .onboard-content { text-align: center; }

        .onboard-content h2 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 16px;
            color: #4ade80;
        }

        .onboard-content p {
            font-size: 15px;
            line-height: 1.6;
            color: #22c55e;
            margin-bottom: 24px;
        }

        .track-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 12px;
        }

        .track-btn {
            padding: 16px 12px;
            border: 2px solid rgba(34, 197, 94, 0.6);
            background: rgba(0, 78, 137, 0.5);
            color: #22c55e;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .track-btn:hover {
            border-color: #4ade80;
            background: rgba(26, 127, 160, 0.3);
            color: #4ade80;
        }

        #styleCard {
            display: none;
            margin-top: 20px;
            padding: 20px;
            background: rgba(26, 127, 160, 0.2);
            border: 1px solid rgba(74, 222, 128, 0.3);
            border-radius: 12px;
            animation: slideDown 0.4s ease-out;
        }

        .style-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 16px;
        }

        .style-opt {
            padding: 12px;
            border: 2px solid rgba(34, 197, 94, 0.6);
            background: rgba(0, 78, 137, 0.5);
            color: #22c55e;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .style-opt:hover {
            border-color: #4ade80;
            background: rgba(26, 127, 160, 0.3);
            color: #4ade80;
        }

        #lessonView { display: none; animation: fadeIn 0.4s ease-out; }

        .lesson-content {
            background: rgba(26, 127, 160, 0.15);
            border: 1px solid rgba(74, 222, 128, 0.2);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
        }

        .lesson-title {
            font-size: 22px;
            font-weight: 700;
            color: #4ade80;
            margin-bottom: 16px;
            line-height: 1.3;
        }

        .lesson-body {
            font-size: 15px;
            line-height: 1.7;
            color: #22c55e;
            margin-bottom: 20px;
        }

        .lesson-body p { margin-bottom: 12px; }

        .lesson-affirmation {
            padding: 16px;
            background: rgba(74, 222, 128, 0.1);
            border-left: 4px solid #22c55e;
            border-radius: 4px;
            font-style: italic;
            color: #22c55e;
            font-size: 14px;
            margin-bottom: 16px;
        }

        .lesson-strength {
            display: inline-block;
            padding: 8px 12px;
            background: rgba(74, 222, 128, 0.2);
            color: #22c55e;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }

        .controls {
            display: flex;
            gap: 12px;
            margin-top: 24px;
            flex-wrap: wrap;
        }

        .btn {
            flex: 1;
            min-width: 100px;
            padding: 12px 16px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: linear-gradient(90deg, #4ade80, #22c55e);
            color: #004e89;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(74, 222, 128, 0.3);
        }

        .btn-secondary {
            background: rgba(34, 197, 94, 0.4);
            color: #22c55e;
            border: 1px solid rgba(74, 222, 128, 0.3);
        }

        .btn-secondary:hover {
            border-color: #4ade80;
            color: #4ade80;
        }

        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            font-size: 13px;
            color: #86efac;
            flex-wrap: wrap;
            gap: 12px;
        }

        .streak {
            font-weight: 600;
            color: #22c55e;
        }

        #celebrate {
            display: none;
            text-align: center;
            padding: 40px 20px;
            animation: scaleIn 0.5s ease-out;
        }

        .celebrate-emoji { font-size: 60px; margin-bottom: 16px; }

        .celebrate-text {
            font-size: 24px;
            font-weight: 700;
            color: #22c55e;
            margin-bottom: 24px;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Learning Accelerator</h1>
            <p>One lesson a day, master any skill</p>
        </div>

        <div id="onboard">
            <div class="onboard-content">
                <h2>What do you want to master?</h2>
                <p>Where do you want to accelerate?</p>
                <div class="track-buttons">
                    <button class="track-btn" onclick="selectTrack('brain')">🧠 Brain Science</button>
                    <button class="track-btn" onclick="selectTrack('memory')">💾 Memory</button>
                    <button class="track-btn" onclick="selectTrack('speed')">⚡ Speed</button>
                    <button class="track-btn" onclick="selectTrack('apply')">🎯 Application</button>
                </div>
            </div>
            <div id="styleCard">
                <p style="margin-bottom: 12px; font-size: 14px; color: #22c55e;">How do you learn best?</p>
                <div class="style-options">
                    <button class="style-opt" onclick="selectStyle('science')">Science-backed</button>
                    <button class="style-opt" onclick="selectStyle('practical')">Practical tips</button>
                    <button class="style-opt" onclick="selectStyle('story')">Story-based</button>
                    <button class="style-opt" onclick="selectStyle('meta')">Meta-learning</button>
                </div>
            </div>
        </div>

        <div id="lessonView">
            <div class="lesson-content">
                <div class="lesson-title" id="lessonTitle"></div>
                <div class="lesson-body" id="lessonBody"></div>
                <div class="lesson-affirmation" id="lessonAffirmation"></div>
                <div class="lesson-strength" id="lessonStrength"></div>
            </div>

            <div class="controls">
                <button class="btn btn-primary" onclick="speak()">🔊 Read aloud</button>
                <button class="btn btn-secondary" onclick="nextLesson()">Next →</button>
                <button class="btn btn-secondary" onclick="markDone()">✓ Done</button>
            </div>

            <div class="footer">
                <div id="progress"></div>
                <div><span class="streak" id="streak"></span></div>
            </div>
        </div>

        <div id="celebrate">
            <div class="celebrate-emoji">🧩</div>
            <div class="celebrate-text">You're getting smarter</div>
            <p style="color: #22c55e; margin-bottom: 24px;">Learning compounds. Come back tomorrow.</p>
            <button class="btn btn-primary" onclick="resetView()">Back to start</button>
        </div>
    </div>

    <script>
        const lessons = [
            {t:"Your brain learns the way it learns—not the way it's supposed to",b:["Some people learn by reading. Some by doing. Some by listening. Some by explaining. There's no right way.","Fighting your natural learning style is like trying to force yourself to be left-handed. You can do it, but it's exhausting.","Today's tiny step: think about how you learned something you know well. How did you actually absorb it? That's your learning style."],a:"Learning efficiency starts with self-knowledge.",s:"Style awareness"},
            {t:"Spaced repetition is the memory hack everyone ignores",b:["Cramming puts information in short-term memory. Spaced repetition (revisit material after 1 day, 3 days, 1 week, 1 month) puts it in long-term memory.","This is scientifically proven and almost nobody does it because it feels less productive than marathon study sessions.","Today's tiny step: review something you learned a week ago. Notice how it sticks better than yesterday's cram session."],a:"Spacing beats massing.",s:"Spaced review"},
            {t:"Struggle is the signal that learning is happening",b:["When learning feels hard, that's not a sign you're bad at it. That's a sign your brain is rewiring itself to understand something new.","If it feels easy, you're not learning—you're just reviewing what you already know.","Today's tiny step: tackle something that frustrates you. Sit with that frustration. That's where learning lives."],a:"Difficulty is the teacher.",s:"Learning through struggle"},
            {t:"Active recall beats passive review",b:["Passive: read a textbook, watch a video. Active: close the book and answer a question about what you just read.","Active recall forces your brain to retrieve information, which strengthens the neural pathway way more than passive exposure.","Today's tiny step: learn something. Then immediately try to teach it to someone (or explain it to yourself). That's active recall."],a:"Testing yourself beats studying.",s:"Active recall"},
            {t:"Sleep is where learning solidifies",b:["During the day, you're inputting information. During sleep, your brain is consolidating it into long-term memory.","Pulling an all-nighter to study is literally counterproductive. You'd learn better if you slept.","Today's tiny step: learn something in the morning. Sleep well that night. You'll remember it better than if you crammed before bed."],a:"Sleep is learning infrastructure.",s:"Sleep priority"},
            {t:"You learn by doing, not by understanding theory",b:["Theory is helpful context. But actual learning happens when you struggle to apply it to a real problem.","The moment you get stuck trying to use what you learned, that's when real learning happens—not when you're reading smoothly.","Today's tiny step: don't just learn. Apply it. Try to use it on a small problem right away."],a:"Application is the teacher.",s:"Learning by doing"},
            {t:"Confusion is a prerequisite for understanding",b:["If you're not confused while learning, you're not learning anything new. Confusion means your old model is breaking and a new one is forming.","Most people run from confusion. The best learners embrace it.","Today's tiny step: sit with one thing that confuses you. Don't look for the answer yet. Let the confusion settle."],a:"Confusion precedes clarity.",s:"Embrace confusion"},
            {t:"Teaching is the ultimate test",b:["If you can explain it simply to someone else, you understand it. If you can't, you don't—you just think you do.","Teaching forces you to organize your knowledge in a way that's clear and coherent.","Today's tiny step: teach one concept you just learned to someone else. Notice where your understanding is weak."],a:"Teaching reveals understanding.",s:"Teaching clarity"},
            {t:"Your learning environment matters",b:["Learning in the same place with the same music creates context-dependent memory, which doesn't transfer well.","Varying your learning environment (different rooms, different times, different backgrounds) forces your brain to extract the core principle, not just memorize the context.","Today's tiny step: learn something in a different environment than usual. Notice if context-switching strengthens retention."],a:"Environment variation deepens learning.",s:"Varied context"},
            {t:"Questions are more powerful than answers",b:["If you read answers, you feel smarter but don't learn. If you struggle with questions, you learn deeply.","The best learners are the ones who ask the best questions.","Today's tiny step: instead of looking up an answer, sit with the question. What do you think? Why? Generate your own answer first."],a:"Questions power learning.",s:"Question-driven learning"},
            {t:"Learn the fundamentals, not the trends",b:["The specific frameworks and tools will change. The fundamentals (first principles, core concepts) never do.","If you understand fundamentals deeply, you can learn any specific tool in hours.","Today's tiny step: identify one fundamental principle in what you're learning. Understand that deeply instead of memorizing specifics."],a:"Fundamentals are timeless.",s:"Core concepts"},
            {t:"Mistakes are your best data",b:["When you get something wrong, that's perfect feedback for your brain. Your brain literally rewires itself around mistakes.","People who avoid mistakes learn slowly. People who make lots of mistakes and correct them learn fast.","Today's tiny step: make a mistake on purpose. Analyze it. What can you learn from it?"],a:"Errors are gifts.",s:"Learning from errors"},
            {t:"You learn faster when you care",b:["Learning something you care about happens 10x faster than forced learning.","The learners who excel choose what to learn based on genuine curiosity, not what they think they should learn.","Today's tiny step: is what you're learning something you actually care about? If not, find the angle you do care about."],a:"Interest is the accelerant.",s:"Intrinsic motivation"},
            {t:"Your brain needs breaks to consolidate",b:["Pushing harder doesn't produce more learning. Breaks do. During breaks, your brain processes what you learned.","The best learners build rest into their learning schedule.","Today's tiny step: study hard for 25 minutes. Take a 5-minute break. Repeat. Notice how the break improves your next session."],a:"Rest is part of the learning cycle.",s:"Recovery cycles"},
            {t:"Depth beats breadth",b:["Learning 10 superficial things is less powerful than deeply understanding one thing.","Superficial knowledge creates the illusion of understanding but doesn't transfer to new problems.","Today's tiny step: go deep on one concept instead of skimming many. See how much deeper you understand."],a:"Deep understanding enables transfer.",s:"Depth over breadth"},
            {t:"Learn in multiple modalities",b:["Reading about basketball doesn't teach you to play. Playing teaches you. Reading teaches one thing. Doing teaches another.","Using multiple modalities (reading, speaking, doing, listening, visualizing) activates different neural pathways.","Today's tiny step: learn something in a way you haven't tried before. If you usually read, try video. If you usually listen, try doing."],a:"Multiple modes deepen understanding.",s:"Multimodal learning"},
            {t:"Your effort matters more than your talent",b:["Growth mindset research is clear: effort is the biggest predictor of learning speed, not IQ or talent.","This means you can learn anything if you're willing to exert effort and tolerate struggle.","Today's tiny step: pick something you think you're bad at. Spend 30 minutes actually trying. You'll improve."],a:"Effort creates mastery.",s:"Growth mindset"},
            {t:"Learn by connecting to what you know",b:["New information sticks when it connects to something you already understand.","The best learners are the ones who constantly ask: how does this relate to something I already know?","Today's tiny step: take one new concept. How does it relate to something you already understand? Find the connection."],a:"Connection creates understanding.",s:"Transfer learning"},
            {t:"Your learning speed is trainable",b:["You're not locked into a learning speed. The speed at which you learn is a skill you can improve.","Just like you train physical speed, you can train learning speed through better techniques and more practice.","Today's tiny step: commit to learning something new every day for a week. Notice how your learning speed increases."],a:"Your brain gets faster at learning.",s:"Learning velocity"},
            {t:"Keep learning, keep growing",b:["The moment you stop learning is the moment you start declining. Learning isn't a phase—it's a lifestyle.","The people who feel most alive are the ones who are constantly learning and growing.","Today's tiny step: what's the next thing you want to learn? Commit to it. That's how you keep evolving."],a:"Life-long learning is life worth living.",s:"Growth forever"}
        ];

        const tracks = { brain: 0, memory: 5, speed: 10, apply: 15 };

        let state = JSON.parse(localStorage.getItem('learnState')) || {
            track: null,
            style: null,
            done: [],
            lastDay: null,
            streak: 0,
            seen: {}
        };

        function selectTrack(t) {
            state.track = t;
            state.style = null;
            state.seen = {};
            document.getElementById('styleCard').style.display = 'block';
        }

        function selectStyle(s) {
            state.style = s;
            state.lastDay = new Date().toDateString();
            saveState();
            showLesson();
        }

        function saveState() {
            localStorage.setItem('learnState', JSON.stringify(state));
        }

        function getTrackIndex(offset) {
            const trackStart = tracks[state.track];
            let idx = trackStart + offset;
            while (state.done.includes(idx)) idx++;
            return idx < trackStart + 5 ? idx : trackStart + (Math.floor(Math.random() * 5));
        }

        function showLesson() {
            if (!state.track || !state.style) return;
            const offset = state.seen[state.track] ? (state.seen[state.track] + 1) % 5 : 0;
            const idx = getTrackIndex(offset);
            state.seen[state.track] = offset;
            const l = lessons[idx];
            document.getElementById('lessonTitle').textContent = l.t;
            document.getElementById('lessonBody').innerHTML = l.b.map(p => `<p>${p}</p>`).join('');
            document.getElementById('lessonAffirmation').textContent = l.a;
            document.getElementById('lessonStrength').textContent = l.s;
            updateUI();
        }

        function updateUI() {
            const today = new Date().toDateString();
            if (state.lastDay !== today) state.streak = 0;
            if (state.done.length > 0) {
                const lastDone = state.done[state.done.length - 1];
                if (new Date().toDateString() === state.lastDay) {
                    document.getElementById('onboard').style.display = 'none';
                    document.getElementById('celebrate').style.display = 'block';
                    document.getElementById('lessonView').style.display = 'none';
                } else {
                    document.getElementById('onboard').style.display = 'none';
                    document.getElementById('lessonView').style.display = 'block';
                    document.getElementById('celebrate').style.display = 'none';
                }
            } else {
                document.getElementById('onboard').style.display = 'block';
                document.getElementById('lessonView').style.display = 'none';
                document.getElementById('celebrate').style.display = 'none';
            }
            document.getElementById('progress').textContent = `${state.done.length} lesson${state.done.length !== 1 ? 's' : ''} done`;
            document.getElementById('streak').textContent = `🚀 ${state.streak} day${state.streak !== 1 ? 's' : ''} here`;
        }

        function speak() {
            const title = document.getElementById('lessonTitle').textContent;
            const body = document.getElementById('lessonBody').innerText;
            const aff = document.getElementById('lessonAffirmation').textContent;
            speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(`${title}. ${body}. ${aff}`);
            u.rate = 0.90;
            speechSynthesis.speak(u);
        }

        function nextLesson() {
            showLesson();
        }

        function markDone() {
            const idx = lessons.findIndex(l => l.t === document.getElementById('lessonTitle').textContent);
            if (!state.done.includes(idx)) {
                state.done.push(idx);
                if (state.lastDay === new Date().toDateString()) state.streak++;
                state.lastDay = new Date().toDateString();
                saveState();
            }
            document.getElementById('onboard').style.display = 'none';
            document.getElementById('lessonView').style.display = 'none';
            document.getElementById('celebrate').style.display = 'block';
        }

        function resetView() {
            document.getElementById('celebrate').style.display = 'none';
            document.getElementById('onboard').style.display = 'block';
            state.track = null;
            state.style = null;
            saveState();
        }

        updateUI();
        if (state.track && state.style) showLesson();
    </script>
</body>
</html>
