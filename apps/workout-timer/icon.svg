<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#241a33"/>
      <stop offset="100%" stop-color="#08050d"/>
    </radialGradient>
    <linearGradient id="timer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d8ff"/>
      <stop offset="100%" stop-color="#f5c000"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="180" fill="rgba(0, 216, 255, 0.1)"/>

  <!-- Stopwatch/Timer -->
  <g transform="translate(256, 256)">
    <!-- Watch case -->
    <circle cx="0" cy="20" r="100" fill="none" stroke="url(#timer)" stroke-width="10" stroke-linecap="round"/>
    <!-- Inner dial -->
    <circle cx="0" cy="20" r="80" fill="none" stroke="rgba(0, 216, 255, 0.2)" stroke-width="2"/>
    <!-- Hour markers -->
    <line x1="0" y1="-60" x2="0" y2="-80" stroke="url(#timer)" stroke-width="4" stroke-linecap="round"/>
    <line x1="57" y1="-35" x2="68" y2="-48" stroke="rgba(0, 216, 255, 0.5)" stroke-width="3" stroke-linecap="round"/>
    <line x1="80" y1="20" x2="100" y2="20" stroke="rgba(0, 216, 255, 0.5)" stroke-width="3" stroke-linecap="round"/>
    <!-- Hands -->
    <line x1="0" y1="20" x2="0" y2="-50" stroke="url(#timer)" stroke-width="5" stroke-linecap="round"/>
    <line x1="0" y1="20" x2="40" y2="20" stroke="url(#timer)" stroke-width="4" stroke-linecap="round"/>
    <!-- Center dot -->
    <circle cx="0" cy="20" r="8" fill="url(#timer)"/>
    <!-- Pushers (buttons) -->
    <rect x="-12" y="-110" width="8" height="20" fill="rgba(0, 216, 255, 0.5)" rx="2"/>
    <rect x="4" y="-110" width="8" height="20" fill="rgba(245, 192, 0, 0.5)" rx="2"/>
  </g>

  <!-- Glow -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="rgba(0, 216, 255, 0.3)" stroke-width="3" opacity="0.6"/>
</svg>
