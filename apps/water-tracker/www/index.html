<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Water Tracker – Stay Hydrated</title>
    <style>
        :root { --primary: #3B82F6; --bg: #0F172A; --light: #1E293B; --text: #F1F5F9; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); }
        .container { max-width: 480px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; }
        .glass { width: 100px; height: 120px; border: 3px solid var(--primary); border-radius: 8px; display: flex; align-items: flex-end; justify-content: center; overflow: hidden; position: relative; }
        .glass-fill { width: 100%; background: linear-gradient(180deg, #3B82F6 0%, #1E40AF 100%); transition: height 0.3s; }
        .glass-label { text-align: center; margin: 12px 0; font-size: 24px; font-weight: 700; }
        .button-group { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 24px; width: 100%; max-width: 300px; }
        button { padding: 12px; border: none; border-radius: 8px; background: var(--primary); color: white; font-weight: 600; cursor: pointer; }
        button:hover { background: #1E40AF; }
    </style>
</head>
<body>
    <div class="container">
        <h1 style="font-size: 32px; margin-bottom: 8px;">💧 WATER TRACKER</h1>
        <p style="color: #CBD5E1; margin-bottom: 32px;">Stay hydrated</p>

        <div class="glass">
            <div class="glass-fill" id="fill" style="height: 0%;"></div>
        </div>

        <div class="glass-label" id="label">0L / 2L</div>

        <div class="button-group">
            <button onclick="addWater(0.25)">+250ml</button>
            <button onclick="addWater(0.5)">+500ml</button>
            <button onclick="addWater(0.75)">+750ml</button>
            <button onclick="addWater(1)">+1L</button>
            <button onclick="resetWater()" style="grid-column: 1/3; background: #DC2626;">Reset</button>
        </div>
    </div>

    <script>
        let waterIntake = 0;
        const goal = 2;

        function addWater(amount) {
            waterIntake = Math.min(waterIntake + amount, goal);
            updateDisplay();
        }

        function resetWater() {
            waterIntake = 0;
            updateDisplay();
        }

        function updateDisplay() {
            const pct = (waterIntake / goal) * 100;
            document.getElementById('fill').style.height = pct + '%';
            document.getElementById('label').textContent = waterIntake.toFixed(1) + 'L / ' + goal + 'L';
        }

        updateDisplay();
    </script>
</body>
</html>
