<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#08050d">
    <title>DOCKET - Legal Documents</title>
    <style>
        :root { --canvas:#08050d; --green:#00e887; --red:#ff1f5a; --cyan:#00d8ff; --purple:#7c3aed; --text:#fff; --text-muted:#aaa; }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:var(--canvas); color:var(--text); min-height:100vh; padding-bottom:80px; }
        .header { padding:20px; border-bottom:1px solid rgba(0,232,135,0.2); display:flex; justify-content:space-between; }
        h1 { font-size:20px; font-weight:700; }
        .badge { background:var(--green); color:var(--canvas); padding:4px 12px; border-radius:20px; font-size:11px; }
        .content { padding:20px; }
        .doc-card { background:rgba(0,232,135,0.05); border:1px solid rgba(0,232,135,0.2); border-radius:8px; padding:15px; margin:12px 0; }
        .doc-title { font-weight:600; color:var(--cyan); margin-bottom:8px; }
        select { width:100%; background:rgba(0,232,135,0.05); border:1px solid rgba(0,232,135,0.2); border-radius:6px; color:var(--text); padding:10px; margin:8px 0; }
        textarea { width:100%; background:rgba(0,232,135,0.05); border:1px solid rgba(0,232,135,0.2); border-radius:6px; color:var(--text); padding:10px; font-family:monospace; font-size:12px; min-height:150px; margin:8px 0; }
        button { background:var(--green); color:var(--canvas); border:0; padding:10px 16px; border-radius:6px; cursor:pointer; font-weight:600; width:100%; margin-top:10px; }
        .checklist { font-size:13px; line-height:1.8; }
        .checklist li { margin:6px 0; }
        .panel { display:none; }
        .panel.on { display:block; }
        .tabs { position:fixed; bottom:0; left:0; right:0; background:var(--canvas); border-top:1px solid rgba(0,232,135,0.2); display:flex; justify-content:space-around; height:70px; z-index:100; }
        .tab { flex:1; background:0; border:0; color:var(--text-muted); cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:11px; }
        .tab.on { color:var(--green); }
        .premium { background:rgba(124,58,237,0.1); border-left:3px solid var(--purple); padding:12px; margin-top:20px; border-radius:4px; font-size:12px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>📋 DOCKET</h1>
        <div class="badge">FREE</div>
    </div>
    <div class="content">
        <div id="builder" class="panel on">
            <select id="doc-type">
                <option value="complaint">Complaint</option>
                <option value="motion">Motion</option>
                <option value="response">Response</option>
                <option value="appeal">Appeal</option>
            </select>
            
            <div id="requirements"></div>
            
            <textarea id="doc-content" placeholder="Document content..."></textarea>
            <button onclick="saveDocument()">Save Document</button>
            
            <div id="saved-docs" style="margin-top:20px"></div>
            <div class="premium">💎 Premium: AI proofreading & formatting</div>
        </div>
    </div>
    <div class="tabs">
        <button class="tab on" data-p="builder">📝 Builder</button>
    </div>
    <script>
        const templates = {
            complaint: {
                title: 'Complaint',
                checklist: ['Caption with court info','Jurisdiction paragraph','Statement of facts','Legal claims','Relief requested','Signature block']
            },
            motion: {
                title: 'Motion',
                checklist: ['Motion heading','Grounds for relief','Supporting facts','Legal basis','Prayer for relief','Certificate of service']
            },
            response: {
                title: 'Response',
                checklist: ['Caption','Admissions & denials','Affirmative defenses','Counterclaims if any','Prayer for relief','Signature']
            },
            appeal: {
                title: 'Appeal',
                checklist: ['Notice of appeal','Statement of issues','Record references','Arguments','Relief sought','Verification']
            }
        };
        
        let docs = [];
        
        function load() {
            let d = localStorage.getItem('docket');
            if (d) docs = JSON.parse(d);
            drawDocs();
            updateRequirements();
        }
        
        function save() {
            localStorage.setItem('docket', JSON.stringify(docs));
            drawDocs();
        }
        
        function updateRequirements() {
            let type = document.getElementById('doc-type').value;
            let tpl = templates[type];
            document.getElementById('requirements').innerHTML = `
                <div style="background:rgba(0,232,135,0.05);border:1px solid rgba(0,232,135,0.2);border-radius:6px;padding:12px;margin:10px 0">
                    <div style="font-weight:600;margin-bottom:8px">${tpl.title} Requirements:</div>
                    <ul class="checklist">
                        ${tpl.checklist.map(r => `<li>☐ ${r}</li>`).join('')}
                    </ul>
                </div>
            `;
        }
        
        function saveDocument() {
            let type = document.getElementById('doc-type').value;
            let content = document.getElementById('doc-content').value;
            if (!content) return;
            
            docs.push({type, content: content.substring(0,100)+'...', date: new Date().toLocaleDateString()});
            document.getElementById('doc-content').value = '';
            save();
        }
        
        function drawDocs() {
            document.getElementById('saved-docs').innerHTML = docs.length ?
                docs.map(d => `<div class="doc-card"><div class="doc-title">${d.type.toUpperCase()}</div><div style="font-size:12px;color:var(--text-muted)">${d.date}</div></div>`).join('') :
                '<p style="color:var(--text-muted)">No documents saved</p>';
        }
        
        document.getElementById('doc-type').onchange = updateRequirements;
        
        load();
        if ('serviceWorker' in navigator) navigator.serviceWorker.register('data:application/javascript,self.addEventListener("install",e=>self.skipWaiting());');
    </script>
</body>
</html>
