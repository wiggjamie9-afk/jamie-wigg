<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#241a33"/>
      <stop offset="100%" stop-color="#08050d"/>
    </radialGradient>
    <linearGradient id="leaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e887"/>
      <stop offset="100%" stop-color="#00d8ff"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="180" fill="rgba(0, 232, 135, 0.1)"/>
  <!-- Leaf -->
  <g transform="translate(256, 256)">
    <!-- Left leaf -->
    <path d="M -60 -40 Q -80 -60 -70 -20 Q -60 20 -40 40 Q -60 20 -50 0 Q -70 -20 -60 -40" fill="url(#leaf)" opacity="0.9"/>
    <!-- Right leaf -->
    <path d="M 60 -40 Q 80 -60 70 -20 Q 60 20 40 40 Q 60 20 50 0 Q 70 -20 60 -40" fill="url(#leaf)" opacity="0.7"/>
    <!-- Center stem -->
    <line x1="0" y1="-50" x2="0" y2="50" stroke="url(#leaf)" stroke-width="6" stroke-linecap="round"/>
  </g>
  <!-- Nutrition glow -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="rgba(0, 232, 135, 0.3)" stroke-width="3" opacity="0.6"/>
</svg>
