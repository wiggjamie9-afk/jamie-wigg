<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="NutriAI — AI-powered nutrition tracking, offline-first.">
  <title>NutriAI</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="theme-color" content="#08050d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NutriAI">
  <link rel="apple-touch-icon" href="./icon.svg">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --canvas: #08050d;
      --fg: #ffffff;
      --magenta: #ff1f5a;
      --purple: #7c3aed;
      --cyan: #00d8ff;
      --green: #00e887;
      --gold: #f5c000;
      --pink: #ff6fc8;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--canvas);
      color: var(--fg);
      line-height: 1.5;
      overflow-x: hidden;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 100vh;
    }

    .container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: 480px;
      margin: 0 auto;
      background: linear-gradient(135deg, #0f0815 0%, #1a0f25 100%);
      position: relative;
      overflow: hidden;
    }

    .header {
      background: linear-gradient(90deg, rgba(0, 232, 135, 0.1) 0%, rgba(0, 216, 255, 0.1) 100%);
      border-bottom: 1px solid rgba(0, 232, 135, 0.2);
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .header h1 {
      font-size: 24px;
      font-weight: 600;
      background: linear-gradient(90deg, var(--green), var(--cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .header-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(0, 232, 135, 0.2);
      border: 1px solid var(--green);
      color: var(--green);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      transition: 0.3s;
    }

    .header-btn:hover {
      background: rgba(0, 232, 135, 0.3);
      transform: scale(1.05);
    }

    .nav-tabs {
      display: flex;
      gap: 0;
      padding: 12px;
      border-bottom: 1px solid rgba(0, 232, 135, 0.1);
      overflow-x: auto;
      scroll-behavior: smooth;
    }

    .nav-tabs::-webkit-scrollbar { display: none; }

    .nav-tab {
      flex-shrink: 0;
      padding: 8px 16px;
      border: 1px solid rgba(0, 232, 135, 0.2);
      border-radius: 20px;
      background: transparent;
      color: rgba(255, 255, 255, 0.6);
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: 0.3s;
    }

    .nav-tab.active {
      background: var(--green);
      color: var(--canvas);
      border-color: var(--green);
    }

    .nav-tab:hover {
      border-color: var(--green);
    }

    .content {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      scroll-behavior: smooth;
    }

    .content::-webkit-scrollbar {
      width: 6px;
    }

    .content::-webkit-scrollbar-track {
      background: rgba(0, 232, 135, 0.05);
    }

    .content::-webkit-scrollbar-thumb {
      background: rgba(0, 232, 135, 0.3);
      border-radius: 3px;
    }

    .screen { display: none; }
    .screen.active { display: block; }

    .onboard-screen {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100%;
      text-align: center;
      gap: 30px;
    }

    .nutrient-circle {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, rgba(0, 232, 135, 0.8), rgba(0, 216, 255, 0.4));
      position: relative;
      animation: pulse-circle 3s ease-in-out infinite;
      box-shadow: 0 0 40px rgba(0, 232, 135, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
    }

    @keyframes pulse-circle {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }

    .onboard-screen h2 {
      font-size: 28px;
      background: linear-gradient(90deg, var(--green), var(--cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-weight: 600;
    }

    .onboard-screen p {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.7);
      max-width: 280px;
    }

    .input-group {
      width: 100%;
      max-width: 300px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .input-group input, .input-group select {
      padding: 12px 16px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(0, 232, 135, 0.3);
      color: var(--fg);
      font-size: 14px;
      font-family: inherit;
      transition: 0.3s;
    }

    .input-group input:focus, .input-group select:focus {
      outline: none;
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--green);
    }

    .input-group input::placeholder {
      color: rgba(255, 255, 255, 0.4);
    }

    .goal-buttons {
      display: flex;
      gap: 12px;
      flex-direction: column;
    }

    .goal-btn {
      padding: 12px;
      border-radius: 8px;
      background: rgba(0, 232, 135, 0.1);
      border: 1px solid rgba(0, 232, 135, 0.3);
      color: var(--fg);
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: 0.3s;
    }

    .goal-btn.selected {
      background: var(--green);
      border-color: var(--green);
      color: var(--canvas);
    }

    .goal-btn:hover {
      border-color: var(--green);
    }

    .cta-btn {
      padding: 14px 28px;
      border-radius: 8px;
      background: linear-gradient(90deg, var(--green), var(--cyan));
      border: none;
      color: var(--canvas);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .cta-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0, 232, 135, 0.4);
    }

    .cta-btn:active {
      transform: translateY(0);
    }

    /* Today's log */
    .today-screen h2 {
      margin-bottom: 20px;
      color: var(--green);
    }

    .macro-ring {
      position: relative;
      width: 160px;
      height: 160px;
      margin: 0 auto 20px;
    }

    .macro-ring svg {
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }

    .macro-text {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .macro-value {
      font-size: 32px;
      font-weight: 700;
      color: var(--green);
    }

    .macro-label {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.6);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .macro-breakdown {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }

    .macro-bar {
      background: rgba(0, 232, 135, 0.15);
      border: 1px solid rgba(0, 232, 135, 0.3);
      border-radius: 8px;
      padding: 12px;
      text-align: center;
    }

    .macro-bar.protein { border-color: var(--pink); background: rgba(255, 107, 200, 0.1); }
    .macro-bar.carbs { border-color: var(--cyan); background: rgba(0, 216, 255, 0.1); }
    .macro-bar.fat { border-color: var(--gold); background: rgba(245, 192, 0, 0.1); }

    .macro-number {
      font-size: 20px;
      font-weight: 700;
      color: inherit;
      margin-bottom: 4px;
    }

    .macro-bar.protein .macro-number { color: var(--pink); }
    .macro-bar.carbs .macro-number { color: var(--cyan); }
    .macro-bar.fat .macro-number { color: var(--gold); }

    .macro-name {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.6);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .add-meal-btn {
      width: 100%;
      padding: 14px;
      border-radius: 8px;
      background: linear-gradient(90deg, var(--green), var(--cyan));
      border: none;
      color: var(--canvas);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 20px;
      transition: 0.3s;
    }

    .add-meal-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0, 232, 135, 0.3);
    }

    .meal-log {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .meal-entry {
      background: linear-gradient(135deg, rgba(0, 232, 135, 0.1) 0%, rgba(0, 216, 255, 0.05) 100%);
      border: 1px solid rgba(0, 232, 135, 0.2);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .meal-info {
      flex: 1;
    }

    .meal-name {
      font-weight: 600;
      font-size: 14px;
      color: var(--green);
      margin-bottom: 4px;
    }

    .meal-cals {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.6);
    }

    .meal-remove {
      background: rgba(255, 31, 90, 0.2);
      border: 1px solid var(--magenta);
      color: var(--magenta);
      width: 28px;
      height: 28px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      transition: 0.3s;
    }

    .meal-remove:hover {
      background: rgba(255, 31, 90, 0.3);
    }

    .stat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin: 20px 0;
    }

    .stat-card {
      background: linear-gradient(135deg, rgba(0, 232, 135, 0.15) 0%, rgba(0, 216, 255, 0.1) 100%);
      border: 1px solid rgba(0, 232, 135, 0.2);
      border-radius: 12px;
      padding: 16px;
      text-align: center;
    }

    .stat-value {
      font-size: 28px;
      font-weight: 700;
      color: var(--green);
      margin-bottom: 4px;
    }

    .stat-label {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.6);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .premium-lock {
      background: linear-gradient(135deg, rgba(245, 192, 0, 0.15) 0%, rgba(255, 31, 90, 0.1) 100%);
      border: 1px solid rgba(245, 192, 0, 0.3);
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      margin: 20px 0;
    }

    .premium-lock h3 {
      color: var(--gold);
      font-size: 18px;
      margin-bottom: 12px;
    }

    .premium-lock p {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.7);
      margin-bottom: 16px;
    }

    .unlock-btn {
      padding: 12px 24px;
      border-radius: 8px;
      background: linear-gradient(90deg, var(--gold), var(--magenta));
      border: none;
      color: var(--canvas);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s;
    }

    .unlock-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(245, 192, 0, 0.3);
    }

    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.8);
      z-index: 100;
      justify-content: center;
      align-items: flex-end;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-content {
      background: linear-gradient(135deg, #0f0815 0%, #1a0f25 100%);
      border: 1px solid rgba(0, 232, 135, 0.3);
      border-radius: 16px 16px 0 0;
      padding: 24px;
      width: 100%;
      max-height: 70vh;
      overflow-y: auto;
      animation: slideUp 0.3s ease-out;
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .modal-content h3 {
      font-size: 20px;
      margin-bottom: 16px;
      color: var(--green);
    }

    .meal-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .meal-option {
      background: rgba(0, 232, 135, 0.1);
      border: 1px solid rgba(0, 232, 135, 0.2);
      border-radius: 8px;
      padding: 12px;
      text-align: center;
      cursor: pointer;
      transition: 0.3s;
    }

    .meal-option:hover {
      border-color: var(--green);
      background: rgba(0, 232, 135, 0.15);
    }

    .meal-option-icon {
      font-size: 28px;
      margin-bottom: 8px;
    }

    .meal-option-name {
      font-size: 12px;
      font-weight: 600;
      color: var(--green);
    }

    @media (max-width: 480px) {
      .container { max-width: 100%; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>NutriAI</h1>
      <button class="header-btn" id="settingsBtn">⚙️</button>
    </div>

    <div class="nav-tabs">
      <button class="nav-tab active" data-tab="today">Today</button>
      <button class="nav-tab" data-tab="insights">Insights</button>
      <button class="nav-tab" data-tab="goals">Goals</button>
    </div>

    <div class="content">
      <!-- Onboarding -->
      <div class="screen onboard-screen active" id="onboard">
        <div class="nutrient-circle">🥗</div>
        <div>
          <h2>Welcome to NutriAI</h2>
          <p>Smart nutrition tracking, meal planning & wellness</p>
        </div>
        <div class="input-group">
          <input type="text" id="nameInput" placeholder="Your name">
          <input type="number" id="calorieInput" placeholder="Daily calorie target" value="2000">
          <div>
            <p style="font-size: 12px; color: rgba(255,255,255,0.6); margin-bottom: 8px;">Goal</p>
            <div class="goal-buttons">
              <button class="goal-btn selected" data-goal="balance">Balanced Eating</button>
              <button class="goal-btn" data-goal="loss">Weight Loss</button>
              <button class="goal-btn" data-goal="gain">Muscle Gain</button>
            </div>
          </div>
        </div>
        <button class="cta-btn" id="startBtn">Start Tracking</button>
      </div>

      <!-- Today -->
      <div class="screen today-screen" id="today">
        <h2 style="text-align: center; margin-bottom: 24px;">📅 Today</h2>

        <div class="macro-ring">
          <svg viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="45" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="8"/>
            <circle cx="50" cy="50" r="45" fill="none" stroke="var(--green)" stroke-width="8" stroke-dasharray="142 188.4" stroke-linecap="round"/>
          </svg>
          <div class="macro-text">
            <div class="macro-value" id="calDisplay">0</div>
            <div class="macro-label">/ 2000</div>
          </div>
        </div>

        <div class="macro-breakdown">
          <div class="macro-bar protein">
            <div class="macro-number" id="proteinGrams">0g</div>
            <div class="macro-name">Protein</div>
          </div>
          <div class="macro-bar carbs">
            <div class="macro-number" id="carbsGrams">0g</div>
            <div class="macro-name">Carbs</div>
          </div>
          <div class="macro-bar fat">
            <div class="macro-number" id="fatGrams">0g</div>
            <div class="macro-name">Fat</div>
          </div>
        </div>

        <button class="add-meal-btn" id="addMealBtn">+ Add Meal</button>

        <div class="meal-log" id="mealLog"></div>
      </div>

      <!-- Insights -->
      <div class="screen" id="insights">
        <h2 style="margin-bottom: 20px; color: var(--green);">Weekly Insights</h2>
        <div class="stat-grid" id="insightStats"></div>
        <h3 style="color: var(--cyan); margin: 24px 0 16px;">Nutrition Trends</h3>
        <div id="trendsChart" style="height: 200px; background: rgba(0,232,135,0.05); border-radius: 8px; border: 1px solid rgba(0,232,135,0.1); padding: 16px; display: flex; align-items: flex-end; gap: 8px;"></div>
        <div id="premiumInsights" style="margin-top: 20px;"></div>
      </div>

      <!-- Goals -->
      <div class="screen" id="goals">
        <h2 style="margin-bottom: 20px; color: var(--green);">Your Goals</h2>
        <div style="display: flex; flex-direction: column; gap: 12px;">
          <div style="background: rgba(0,232,135,0.1); border-radius: 8px; padding: 12px;">
            <p style="font-size: 12px; color: rgba(255,255,255,0.6); margin-bottom: 8px;">Name</p>
            <p style="font-size: 16px; color: var(--green); font-weight: 600;" id="goalsName">—</p>
          </div>
          <div style="background: rgba(0,232,135,0.1); border-radius: 8px; padding: 12px;">
            <p style="font-size: 12px; color: rgba(255,255,255,0.6); margin-bottom: 8px;">Daily Target</p>
            <p style="font-size: 16px; color: var(--cyan); font-weight: 600;" id="goalsTarget">2000 cal</p>
          </div>
          <div style="background: rgba(0,232,135,0.1); border-radius: 8px; padding: 12px;">
            <p style="font-size: 12px; color: rgba(255,255,255,0.6); margin-bottom: 8px;">Goal</p>
            <p style="font-size: 16px; color: var(--green); font-weight: 600; text-transform: capitalize;" id="goalsGoal">—</p>
          </div>
          <button class="cta-btn" id="resetBtn" style="margin-top: 12px;">Reset Data</button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="mealModal">
    <div class="modal-content">
      <h3>➕ Add Meal</h3>
      <div class="meal-grid" id="mealOptions"></div>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');

    const S = {
      name: localStorage.getItem('nu_name') || '',
      calories: parseInt(localStorage.getItem('nu_calories')) || 2000,
      goal: localStorage.getItem('nu_goal') || 'balance',
      premium: localStorage.getItem('nu_premium') === 'true',
      meals: JSON.parse(localStorage.getItem('nu_meals')) || [],
    };

    const MEALS = {
      breakfast: [
        { name: 'Oatmeal', cal: 150, p: 6, c: 27, f: 3 },
        { name: 'Eggs & Toast', cal: 350, p: 18, c: 28, f: 16 },
        { name: 'Yogurt & Granola', cal: 280, p: 12, c: 35, f: 8 },
        { name: 'Smoothie Bowl', cal: 320, p: 10, c: 52, f: 6 },
      ],
      lunch: [
        { name: 'Grilled Chicken Salad', cal: 420, p: 38, c: 15, f: 18 },
        { name: 'Turkey Sandwich', cal: 480, p: 28, c: 45, f: 18 },
        { name: 'Sushi Roll', cal: 280, p: 10, c: 42, f: 8 },
        { name: 'Pasta Primavera', cal: 520, p: 16, c: 68, f: 18 },
      ],
      dinner: [
        { name: 'Salmon & Broccoli', cal: 580, p: 42, c: 18, f: 32 },
        { name: 'Lean Beef Tacos', cal: 520, p: 35, c: 32, f: 24 },
        { name: 'Tofu Stir-Fry', cal: 380, p: 18, c: 45, f: 14 },
        { name: 'Grilled Chicken & Rice', cal: 620, p: 45, c: 68, f: 14 },
      ],
      snack: [
        { name: 'Banana & Peanut Butter', cal: 200, p: 8, c: 22, f: 9 },
        { name: 'Protein Bar', cal: 220, p: 20, c: 22, f: 6 },
        { name: 'Apple & Almonds', cal: 180, p: 6, c: 20, f: 8 },
        { name: 'Greek Yogurt', cal: 120, p: 15, c: 8, f: 2 },
      ],
    };

    function save() {
      localStorage.setItem('nu_name', S.name);
      localStorage.setItem('nu_calories', S.calories);
      localStorage.setItem('nu_goal', S.goal);
      localStorage.setItem('nu_premium', S.premium);
      localStorage.setItem('nu_meals', JSON.stringify(S.meals));
    }

    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    function updateToday() {
      const totalCals = S.meals.reduce((sum, m) => sum + m.cal, 0);
      const totalP = S.meals.reduce((sum, m) => sum + m.p, 0);
      const totalC = S.meals.reduce((sum, m) => sum + m.c, 0);
      const totalF = S.meals.reduce((sum, m) => sum + m.f, 0);

      document.getElementById('calDisplay').textContent = totalCals;
      document.getElementById('proteinGrams').textContent = totalP + 'g';
      document.getElementById('carbsGrams').textContent = totalC + 'g';
      document.getElementById('fatGrams').textContent = totalF + 'g';

      const percent = Math.min(100, (totalCals / S.calories) * 100);
      document.querySelector('#today svg circle:nth-of-type(2)').setAttribute('stroke-dasharray', `${(percent / 100) * 188.4} 188.4`);

      const log = document.getElementById('mealLog');
      if (S.meals.length === 0) {
        log.innerHTML = '<p style="text-align: center; color: rgba(255,255,255,0.6); padding: 40px 0;">No meals logged today. Start by adding a meal!</p>';
      } else {
        log.innerHTML = S.meals.map((m, i) => `
          <div class="meal-entry">
            <div class="meal-info">
              <div class="meal-name">${m.name}</div>
              <div class="meal-cals">${m.cal} cal</div>
            </div>
            <button class="meal-remove" onclick="removeMeal(${i})">✕</button>
          </div>
        `).join('');
      }
    }

    function removeMeal(idx) {
      S.meals.splice(idx, 1);
      save();
      updateToday();
    }

    function populateMealOptions() {
      const html = Object.entries(MEALS).map(([time, meals]) => {
        const emoji = { breakfast: '🌅', lunch: '🍱', dinner: '🍽️', snack: '🍿' }[time];
        return `
          <div style="grid-column: 1 / -1; margin-top: 12px;">
            <p style="font-size: 13px; color: rgba(255,255,255,0.6); margin-bottom: 8px; text-transform: capitalize; font-weight: 600;">${time}</p>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
              ${meals.map(m => `
                <div class="meal-option" onclick="addMeal('${m.name}', ${m.cal}, ${m.p}, ${m.c}, ${m.f})">
                  <div class="meal-option-icon">${emoji}</div>
                  <div class="meal-option-name">${m.name}</div>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }).join('');
      document.getElementById('mealOptions').innerHTML = html;
    }

    function addMeal(name, cal, p, c, f) {
      if (!S.premium && S.meals.length >= 5) {
        showUnlockModal();
        return;
      }
      S.meals.push({ name, cal, p, c, f });
      save();
      updateToday();
      document.getElementById('mealModal').classList.remove('active');
    }

    function updateInsights() {
      const stats = [
        { label: 'Avg Calories', value: '2100 cal' },
        { label: 'Protein Intake', value: '115g' },
        { label: 'Log Streak', value: '12 days 🔥' },
        { label: 'Goals Met', value: '6/7 days' },
      ];
      document.getElementById('insightStats').innerHTML = stats.map(s => `
        <div class="stat-card"><div class="stat-value">${s.value}</div><div class="stat-label">${s.label}</div></div>
      `).join('');

      const chart = document.getElementById('trendsChart');
      const days = ['M', 'T', 'W', 'T', 'F', 'S', 'S'];
      const values = [0.85, 0.92, 0.78, 1.05, 0.95, 0.88, 0.75];
      chart.innerHTML = days.map((d, i) => `
        <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 4px;">
          <div style="width: 100%; background: linear-gradient(180deg, var(--green), var(--cyan)); border-radius: 4px 4px 0 0; height: ${values[i] * 150}px; min-height: 2px;"></div>
          <span style="font-size: 10px; color: rgba(255,255,255,0.6);">${d}</span>
        </div>
      `).join('');

      if (!S.premium) {
        document.getElementById('premiumInsights').innerHTML = `
          <div class="premium-lock">
            <h3>🔒 Meal Plans & AI Coaching</h3>
            <p>Get personalized meal plans, macro optimization, and weekly nutrition reports</p>
            <button class="unlock-btn" onclick="unlock()">Unlock Pro</button>
          </div>
        `;
      }
    }

    function unlock() {
      S.premium = true;
      save();
      updateToday();
      updateInsights();
      document.getElementById('mealModal').classList.remove('active');
    }

    function showUnlockModal() {
      const modal = document.getElementById('mealModal');
      document.getElementById('mealOptions').innerHTML = `
        <div style="grid-column: 1 / -1; text-align: center; padding: 20px 0;">
          <h3 style="color: var(--gold); font-size: 18px; margin-bottom: 12px;">🔓 Unlock Premium</h3>
          <p style="font-size: 13px; color: rgba(255,255,255,0.7); margin-bottom: 16px;">Add unlimited meals, meal plans, and macro optimization</p>
          <button class="unlock-btn" style="width: 100%;" onclick="unlock()">Unlock Pro — $3.99</button>
          <p style="margin-top: 16px; font-size: 11px; color: rgba(255,255,255,0.5);">Demo unlock available</p>
        </div>
      `;
    }

    // Tab switching
    document.querySelectorAll('.nav-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        const target = tab.dataset.tab;
        if (target === 'today') showScreen('today');
        else if (target === 'insights') {
          updateInsights();
          showScreen('insights');
        } else if (target === 'goals') {
          document.getElementById('goalsName').textContent = S.name || '—';
          document.getElementById('goalsTarget').textContent = S.calories + ' cal';
          document.getElementById('goalsGoal').textContent = S.goal;
          showScreen('goals');
        }
      });
    });

    // Onboarding
    document.querySelectorAll('.goal-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.goal-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        S.goal = btn.dataset.goal;
      });
    });

    document.getElementById('startBtn').addEventListener('click', () => {
      const name = document.getElementById('nameInput').value.trim();
      const cals = parseInt(document.getElementById('calorieInput').value) || 2000;
      if (!name) {
        alert('Please enter your name');
        return;
      }
      S.name = name;
      S.calories = cals;
      save();
      updateToday();
      populateMealOptions();
      showScreen('today');
    });

    document.getElementById('addMealBtn').addEventListener('click', () => {
      document.getElementById('mealModal').classList.add('active');
    });

    document.getElementById('settingsBtn').addEventListener('click', () => {
      showUnlockModal();
      document.getElementById('mealModal').classList.add('active');
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
      if (confirm('Reset all data?')) {
        Object.keys(localStorage).forEach(k => {
          if (k.startsWith('nu_')) localStorage.removeItem(k);
        });
        S.meals = [];
        showScreen('onboard');
      }
    });

    // Initialize
    if (S.name) {
      updateToday();
      populateMealOptions();
      showScreen('today');
    } else {
      populateMealOptions();
    }
  </script>
</body>
</html>
