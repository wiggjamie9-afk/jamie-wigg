<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ENGLISH POCKET: Learn English vocabulary and phrases. Offline. Free.">
    <meta name="theme-color" content="#3B82F6">
    <title>English Pocket – Language Learning</title>
    <style>
        :root {
            --primary: #5B7FBE;
            --accent: #4A63A0;
            --bg-dark: #0F172A;
            --bg-light: #1E293B;
            --text-primary: #F1F5F9;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            font-family: -apple-system, sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
        }
        .container { max-width: 480px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }
        .header { background: linear-gradient(135deg, var(--primary) 0%, #1E40AF 100%); padding: 24px 20px; text-align: center; }
        .header h1 { font-size: 28px; margin-bottom: 4px; }
        .content { flex: 1; padding: 20px; overflow-y: auto; }
        .card {
            background: var(--bg-light);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            border-left: 4px solid var(--primary);
        }
        .card h2 { font-size: 16px; margin-bottom: 12px; }
        .flashcard {
            background: linear-gradient(135deg, var(--primary) 0%, #1E40AF 100%);
            padding: 32px 20px;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            margin-bottom: 16px;
            min-height: 150px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            transition: transform 0.3s ease;
        }
        .flashcard:hover { transform: scale(1.02); }
        .flashcard-front { font-size: 32px; font-weight: 700; margin-bottom: 12px; }
        .flashcard-back { font-size: 24px; color: rgba(255,255,255,0.9); }
        .flashcard-label { font-size: 11px; color: rgba(255,255,255,0.6); margin-bottom: 12px; text-transform: uppercase; }
        .lesson-list { display: grid; gap: 8px; }
        .lesson-btn {
            padding: 12px 16px;
            border: none;
            border-radius: 8px;
            background: var(--bg-dark);
            color: var(--text-primary);
            cursor: pointer;
            border: 2px solid #334155;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s ease;
        }
        .lesson-btn:hover { border-color: var(--primary); background: var(--bg-light); }
        .lesson-btn.active { border-color: var(--primary); color: var(--primary); }
        .progress { display: flex; gap: 4px; margin-bottom: 12px; }
        .progress-dot { width: 8px; height: 8px; border-radius: 50%; background: #334155; }
        .progress-dot.completed { background: var(--accent); }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 ENGLISH POCKET</h1>
            <p style="font-size: 12px;">Learn anywhere. Offline. Free.</p>
        </div>
        <div class="content">
            <div class="card">
                <h2>Select a Lesson</h2>
                <div class="lesson-list">
                    <button class="lesson-btn active" onclick="loadLesson('greetings')">👋 Greetings</button>
                    <button class="lesson-btn" onclick="loadLesson('numbers')">🔢 Numbers</button>
                    <button class="lesson-btn" onclick="loadLesson('food')">🍎 Food</button>
                    <button class="lesson-btn" onclick="loadLesson('shopping')">🛍️ Shopping</button>
                </div>
            </div>

            <div class="card">
                <h2 id="lessonTitle">Greetings</h2>
                <div class="progress" id="progress"></div>
                <div class="flashcard" onclick="flipCard()">
                    <div class="flashcard-label" id="cardLabel">English</div>
                    <div class="flashcard-front" id="cardFront">Hello</div>
                    <div class="flashcard-back" id="cardBack" style="display:none;">नमस्ते</div>
                </div>
                <div style="display: flex; gap: 8px;">
                    <button class="lesson-btn" onclick="previousCard()" style="flex:1; padding: 10px;">← Previous</button>
                    <button class="lesson-btn" onclick="nextCard()" style="flex:1; padding: 10px;">Next →</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const lessons = {
            greetings: [
                { en: 'Hello', hi: 'नमस्ते' },
                { en: 'Good morning', hi: 'सुप्रभात' },
                { en: 'Good night', hi: 'शुभरात्रि' },
                { en: 'Thank you', hi: 'धन्यवाद' },
                { en: 'You\'re welcome', hi: 'स्वागत है' }
            ],
            numbers: [
                { en: 'One', hi: 'एक' },
                { en: 'Two', hi: 'दो' },
                { en: 'Three', hi: 'तीन' },
                { en: 'Four', hi: 'चार' },
                { en: 'Five', hi: 'पाँच' }
            ],
            food: [
                { en: 'Apple', hi: 'सेब' },
                { en: 'Rice', hi: 'चावल' },
                { en: 'Bread', hi: 'ब्रेड' },
                { en: 'Water', hi: 'पानी' },
                { en: 'Milk', hi: 'दूध' }
            ],
            shopping: [
                { en: 'How much?', hi: 'कितना?' },
                { en: 'Too expensive', hi: 'बहुत महंगा' },
                { en: 'Cheaper', hi: 'सस्ता' },
                { en: 'I want', hi: 'मुझे चाहिए' },
                { en: 'Do you have...?', hi: 'क्या तुम्हारे पास है...?' }
            ]
        };

        let currentLesson = 'greetings';
        let currentCard = 0;
        let isFlipped = false;

        function loadLesson(lesson) {
            currentLesson = lesson;
            currentCard = 0;
            isFlipped = false;
            document.querySelectorAll('.lesson-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('lessonTitle').textContent = event.target.textContent;
            displayCard();
        }

        function displayCard() {
            const card = lessons[currentLesson][currentCard];
            document.getElementById('cardFront').textContent = card.en;
            document.getElementById('cardBack').textContent = card.hi;
            document.getElementById('cardBack').style.display = isFlipped ? 'block' : 'none';
            document.getElementById('cardLabel').textContent = isFlipped ? 'Hindi' : 'English';

            const progress = document.getElementById('progress');
            progress.innerHTML = lessons[currentLesson].map((_, i) => 
                `<div class="progress-dot ${i === currentCard ? 'completed' : ''}"></div>`
            ).join('');
        }

        function flipCard() {
            isFlipped = !isFlipped;
            displayCard();
        }

        function nextCard() {
            if (currentCard < lessons[currentLesson].length - 1) {
                currentCard++;
                isFlipped = false;
                displayCard();
            }
        }

        function previousCard() {
            if (currentCard > 0) {
                currentCard--;
                isFlipped = false;
                displayCard();
            }
        }

        displayCard();
    </script>
</body>
</html>
