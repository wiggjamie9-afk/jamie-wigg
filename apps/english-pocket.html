<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#08050d">
    <title>English Pocket - Vocabulary</title>
    <style>
        :root { --canvas:#08050d; --green:#00e887; --red:#ff1f5a; --cyan:#00d8ff; --purple:#7c3aed; --text:#fff; --text-muted:#aaa; }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:var(--canvas); color:var(--text); min-height:100vh; padding-bottom:80px; }
        .header { padding:20px; border-bottom:1px solid rgba(0,232,135,0.2); display:flex; justify-content:space-between; }
        h1 { font-size:24px; font-weight:700; }
        .badge { background:var(--green); color:var(--canvas); padding:4px 12px; border-radius:20px; font-size:11px; }
        .content { padding:20px; }
        .card-flip { perspective:1000px; margin:20px 0; height:200px; cursor:pointer; }
        .card-inner { position:relative; width:100%; height:100%; transition:transform 0.6s; transform-style:preserve-3d; }
        .card-inner.flipped { transform:rotateY(180deg); }
        .card-front, .card-back { position:absolute; width:100%; height:100%; backface-visibility:hidden; display:flex; align-items:center; justify-content:center; text-align:center; border:2px solid rgba(0,232,135,0.3); border-radius:12px; font-size:24px; font-weight:600; padding:20px; }
        .card-back { transform:rotateY(180deg); background:rgba(0,232,135,0.1); }
        .controls { display:flex; gap:10px; margin:15px 0; }
        button { background:var(--green); color:var(--canvas); border:0; padding:10px 16px; border-radius:6px; cursor:pointer; font-weight:600; flex:1; }
        .progress { display:flex; gap:8px; margin:10px 0; }
        .progress-badge { background:rgba(0,232,135,0.1); border:1px solid rgba(0,232,135,0.2); padding:8px 12px; border-radius:6px; font-size:12px; }
        .progress-badge.learned { background:rgba(0,232,135,0.3); border-color:var(--green); }
        .panel { display:none; }
        .panel.on { display:block; }
        .tabs { position:fixed; bottom:0; left:0; right:0; background:var(--canvas); border-top:1px solid rgba(0,232,135,0.2); display:flex; justify-content:space-around; height:70px; z-index:100; }
        .tab { flex:1; background:0; border:0; color:var(--text-muted); cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:12px; }
        .tab.on { color:var(--green); }
        .premium { background:rgba(124,58,237,0.1); border-left:3px solid var(--purple); padding:12px; margin-top:20px; border-radius:4px; font-size:13px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>📚 English</h1>
        <div class="badge">FREE</div>
    </div>
    <div class="content">
        <div id="cards" class="panel on">
            <div class="progress" id="progress"></div>
            <div class="card-flip" id="card-flip" onclick="this.querySelector('.card-inner').classList.toggle('flipped')">
                <div class="card-inner">
                    <div class="card-front" id="front"></div>
                    <div class="card-back" id="back"></div>
                </div>
            </div>
            <div class="controls">
                <button onclick="prev()">← Prev</button>
                <button onclick="next()">Next →</button>
            </div>
            <button onclick="markLearned()" style="background:var(--cyan);color:var(--canvas)">✓ Learned</button>
            <div class="premium">💎 Premium: 10k+ words + spaced repetition</div>
        </div>
        
        <div id="stats" class="panel">
            <div style="padding:20px">
                <div style="margin:15px 0"><span>Total Words:</span> <span id="total" style="color:var(--green);font-weight:600">0</span></div>
                <div style="margin:15px 0"><span>Learned:</span> <span id="learned" style="color:var(--green);font-weight:600">0</span></div>
                <div style="margin:15px 0"><span>To Review:</span> <span id="review" style="color:var(--cyan);font-weight:600">0</span></div>
            </div>
        </div>
    </div>
    <div class="tabs">
        <button class="tab on" data-p="cards">🃏 Cards</button>
        <button class="tab" data-p="stats">📊 Stats</button>
    </div>
    <script>
        const words = [
            {en:'Hello', es:'Hola'}, {en:'Goodbye', es:'Adiós'}, {en:'Thank you', es:'Gracias'},
            {en:'Please', es:'Por favor'}, {en:'Yes', es:'Sí'}, {en:'No', es:'No'},
            {en:'Water', es:'Agua'}, {en:'Food', es:'Comida'}, {en:'Help', es:'Ayuda'},
            {en:'Friend', es:'Amigo'}, {en:'Love', es:'Amor'}, {en:'Smile', es:'Sonrisa'},
            {en:'Heart', es:'Corazón'}, {en:'Dream', es:'Sueño'}, {en:'Hope', es:'Esperanza'},
            {en:'Joy', es:'Alegría'}, {en:'Peace', es:'Paz'}, {en:'Strong', es:'Fuerte'},
            {en:'Beautiful', es:'Hermoso'}, {en:'Bright', es:'Brillante'}
        ];
        
        let state = {idx: 0, learned: new Set()};
        
        function load() {
            let d = localStorage.getItem('english-pocket');
            if (d) {
                let p = JSON.parse(d);
                state.idx = p.idx || 0;
                state.learned = new Set(p.learned || []);
            }
            draw();
        }
        
        function save() {
            localStorage.setItem('english-pocket', JSON.stringify({idx: state.idx, learned: [...state.learned]}));
        }
        
        function draw() {
            let w = words[state.idx];
            document.getElementById('front').textContent = w.en;
            document.getElementById('back').textContent = w.es;
            document.getElementById('card-flip').querySelector('.card-inner').classList.remove('flipped');
            
            document.getElementById('progress').innerHTML = words.map((_, i) =>
                `<div class="progress-badge ${state.learned.has(i)?'learned':''}">${i+1}</div>`
            ).join('');
            
            document.getElementById('total').textContent = words.length;
            document.getElementById('learned').textContent = state.learned.size;
            document.getElementById('review').textContent = words.length - state.learned.size;
        }
        
        function next() {
            state.idx = (state.idx + 1) % words.length;
            save(); draw();
        }
        
        function prev() {
            state.idx = (state.idx - 1 + words.length) % words.length;
            save(); draw();
        }
        
        function markLearned() {
            state.learned.add(state.idx);
            save(); draw();
            next();
        }
        
        document.querySelectorAll('.tab').forEach(t => {
            t.onclick = () => {
                document.querySelectorAll('.tab').forEach(x => x.classList.remove('on'));
                document.querySelectorAll('.panel').forEach(x => x.classList.remove('on'));
                t.classList.add('on');
                document.getElementById(t.dataset.p).classList.add('on');
            };
        });
        
        load();
        if ('serviceWorker' in navigator) navigator.serviceWorker.register('data:application/javascript,self.addEventListener("install",e=>self.skipWaiting());');
    </script>
</body>
</html>
