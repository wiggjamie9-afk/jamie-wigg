<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#08050d">
    <title>Mood Journal</title>
    <style>
        :root { --canvas:#08050d; --green:#00e887; --red:#ff1f5a; --cyan:#00d8ff; --purple:#7c3aed; --text:#fff; --text-muted:#aaa; }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:var(--canvas); color:var(--text); min-height:100vh; padding-bottom:80px; }
        .header { padding:20px; border-bottom:1px solid rgba(0,232,135,0.2); display:flex; justify-content:space-between; }
        h1 { font-size:24px; font-weight:700; }
        .badge { background:var(--green); color:var(--canvas); padding:4px 12px; border-radius:20px; font-size:11px; }
        .content { padding:20px; }
        .mood-scale { display:flex; gap:8px; margin:15px 0; justify-content:space-between; }
        .mood-btn { background:rgba(0,232,135,0.1); border:1px solid rgba(0,232,135,0.2); color:var(--text); padding:10px; border-radius:6px; cursor:pointer; font-size:24px; }
        .mood-btn.selected { background:var(--green); }
        input, textarea { background:rgba(0,232,135,0.05); border:1px solid rgba(0,232,135,0.2); border-radius:6px; color:var(--text); padding:10px; margin:8px 0; width:100%; }
        textarea { min-height:80px; }
        button { background:var(--green); color:var(--canvas); border:0; padding:10px 16px; border-radius:6px; cursor:pointer; font-weight:600; width:100%; }
        .entry-card { background:rgba(0,232,135,0.05); border:1px solid rgba(0,232,135,0.2); border-radius:8px; padding:15px; margin:12px 0; }
        .chart { margin:15px 0; }
        .chart-item { display:flex; align-items:center; margin:12px 0; gap:10px; }
        .chart-bar { background:rgba(0,232,135,0.2); height:24px; border-radius:4px; flex:1; display:flex; align-items:center; padding:0 8px; }
        .panel { display:none; }
        .panel.on { display:block; }
        .tabs { position:fixed; bottom:0; left:0; right:0; background:var(--canvas); border-top:1px solid rgba(0,232,135,0.2); display:flex; justify-content:space-around; height:70px; z-index:100; }
        .tab { flex:1; background:0; border:0; color:var(--text-muted); cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:12px; }
        .tab.on { color:var(--green); }
        .premium { background:rgba(124,58,237,0.1); border-left:3px solid var(--purple); padding:12px; margin-top:20px; border-radius:4px; font-size:13px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>😊 Mood Journal</h1>
        <div class="badge">FREE</div>
    </div>
    <div class="content">
        <div id="entry" class="panel on">
            <div style="font-weight:600;margin:15px 0">How's your mood? (1-10)</div>
            <div class="mood-scale">
                <button class="mood-btn" data-mood="1" onclick="selectMood(this, 1)">😞</button>
                <button class="mood-btn" data-mood="5" onclick="selectMood(this, 5)">😐</button>
                <button class="mood-btn" data-mood="7" onclick="selectMood(this, 7)">🙂</button>
                <button class="mood-btn" data-mood="10" onclick="selectMood(this, 10)">😄</button>
            </div>
            <input type="range" id="mood-slider" min="1" max="10" value="5" oninput="updateSlider()">
            <div style="text-align:center;color:var(--text-muted);font-size:12px">Current: <span id="mood-display">5</span>/10</div>
            
            <textarea id="notes" placeholder="What's on your mind?"></textarea>
            <button onclick="saveEntry()">Save</button>
            
            <div id="entries" style="margin-top:20px"></div>
            <div class="premium">💎 Premium: AI emotion detection & detailed insights</div>
        </div>
        
        <div id="analytics" class="panel">
            <div style="font-weight:600;margin-bottom:15px">Weekly Mood Chart</div>
            <div class="chart" id="chart"></div>
            <div style="margin-top:20px">
                <div style="font-size:12px;color:var(--text-muted)">Patterns detected: </div>
                <div id="patterns"></div>
            </div>
        </div>
    </div>
    <div class="tabs">
        <button class="tab on" data-p="entry">📝 Entry</button>
        <button class="tab" data-p="analytics">📊 Analytics</button>
    </div>
    <script>
        let entries = [];
        let selectedMood = 5;
        
        function load() {
            let d = localStorage.getItem('moodjournal');
            if (d) entries = JSON.parse(d);
            drawEntries();
        }
        
        function save() {
            localStorage.setItem('moodjournal', JSON.stringify(entries));
            drawEntries();
        }
        
        function selectMood(btn, m) {
            selectedMood = m;
            document.getElementById('mood-slider').value = m;
            updateSlider();
        }
        
        function updateSlider() {
            selectedMood = parseInt(document.getElementById('mood-slider').value);
            document.getElementById('mood-display').textContent = selectedMood;
        }
        
        function saveEntry() {
            let notes = document.getElementById('notes').value;
            if (!notes) return;
            
            entries.unshift({
                mood: selectedMood,
                notes: notes,
                date: new Date().toLocaleDateString()
            });
            if (entries.length > 30) entries.pop();
            
            document.getElementById('notes').value = '';
            selectedMood = 5;
            document.getElementById('mood-slider').value = 5;
            updateSlider();
            save();
        }
        
        function drawEntries() {
            document.getElementById('entries').innerHTML = entries.length ?
                entries.slice(0, 5).map(e => `
                    <div class="entry-card">
                        <div style="display:flex;justify-content:space-between">
                            <span>${e.date}</span>
                            <span style="color:var(--green);font-weight:600">${e.mood}/10</span>
                        </div>
                        <div style="font-size:13px;color:var(--text-muted);margin-top:8px">${e.notes.substring(0, 100)}</div>
                    </div>
                `).join('') :
                '<p style="color:var(--text-muted)">No entries</p>';
            
            let last7 = [];
            for (let i = 6; i >= 0; i--) {
                let d = new Date();
                d.setDate(d.getDate() - i);
                let ds = d.toLocaleDateString();
                let mood = entries.filter(e => e.date === ds).slice(0, 1).map(e => e.mood)[0] || 0;
                last7.push({d: ds.split('/')[0], m: mood});
            }
            
            document.getElementById('chart').innerHTML = last7.map(x => `
                <div class="chart-item">
                    <div style="width:40px;font-size:12px">${x.d}</div>
                    <div class="chart-bar" style="width:${x.m * 10}%">${x.m ? x.m : ''}</div>
                </div>
            `).join('');
            
            let avgMood = entries.slice(0,7).reduce((s,e) => s+e.mood, 0) / Math.min(7, entries.length) || 0;
            document.getElementById('patterns').innerHTML = `<p style="font-size:12px;margin-top:8px">Average mood: ${avgMood.toFixed(1)}/10</p>`;
        }
        
        document.querySelectorAll('.tab').forEach(t => {
            t.onclick = () => {
                document.querySelectorAll('.tab').forEach(x => x.classList.remove('on'));
                document.querySelectorAll('.panel').forEach(x => x.classList.remove('on'));
                t.classList.add('on');
                document.getElementById(t.dataset.p).classList.add('on');
            };
        });
        
        load();
        if ('serviceWorker' in navigator) navigator.serviceWorker.register('data:application/javascript,self.addEventListener("install",e=>self.skipWaiting());');
    </script>
</body>
</html>
