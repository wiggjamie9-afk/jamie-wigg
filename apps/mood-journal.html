<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Mood Journal: Track your emotional wellbeing">
    <meta name="theme-color" content="#FF6B9D">
    <title>Mood Journal – Understand yourself</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        :root {
            --primary: #B39AC9;
            --secondary: #8B5BA6;
            --accent: #B39AC9;
            --bg-dark: #0F172A;
            --bg-light: #1E293B;
            --text-primary: #F1F5F9;
            --text-secondary: #CBD5E1;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { font-family: system-ui, sans-serif; background: var(--bg-dark); color: var(--text-primary); min-height: 100vh; }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .header {
            text-align: center;
            padding: 16px 0;
            border-bottom: 2px solid var(--primary);
        }

        .header h1 { font-size: 28px; margin-bottom: 4px; }

        .mood-selector {
            padding: 16px;
            background: var(--bg-light);
            border-radius: 8px;
            border: 2px solid var(--primary);
        }

        .mood-label {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .mood-buttons {
            display: flex;
            justify-content: space-around;
            gap: 8px;
            margin-bottom: 12px;
        }

        .mood-btn {
            width: 50px;
            height: 50px;
            border: 2px solid var(--secondary);
            background: transparent;
            border-radius: 50%;
            font-size: 24px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .mood-btn.active {
            border-color: var(--primary);
            background: rgba(255, 107, 157, 0.2);
            transform: scale(1.1);
        }

        .mood-btn:hover {
            border-color: var(--primary);
        }

        .entry-form {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        textarea {
            width: 100%;
            padding: 12px;
            background: #0F172A;
            color: var(--text-primary);
            border: 1px solid var(--secondary);
            border-radius: 6px;
            font-family: system-ui, sans-serif;
            font-size: 14px;
            resize: vertical;
            min-height: 80px;
        }

        textarea::placeholder { color: var(--text-secondary); }
        textarea:focus { outline: none; border-color: var(--primary); }

        button {
            padding: 12px 20px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:hover { opacity: 0.9; }

        .entries-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .entry-item {
            padding: 12px;
            background: var(--bg-light);
            border-left: 4px solid var(--secondary);
            border-radius: 4px;
        }

        .entry-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .entry-mood {
            font-size: 20px;
        }

        .entry-date {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .entry-text {
            font-size: 13px;
            line-height: 1.4;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .delete-btn {
            padding: 6px 12px;
            background: #EF4444;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            margin-top: 8px;
        }

        .delete-btn:hover { opacity: 0.9; }

        .empty-state {
            text-align: center;
            padding: 40px 16px;
            color: var(--text-secondary);
        }

        .mood-stats {
            padding: 12px;
            background: var(--bg-light);
            border-radius: 6px;
            text-align: center;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💭 Mood Journal</h1>
        </div>

        <div class="mood-selector">
            <div class="mood-label">How are you feeling today?</div>
            <div class="mood-buttons">
                <button class="mood-btn" onclick="selectMood('😢', '😢')">😢</button>
                <button class="mood-btn" onclick="selectMood('😕', '😕')">😕</button>
                <button class="mood-btn" onclick="selectMood('😐', '😐')">😐</button>
                <button class="mood-btn" onclick="selectMood('🙂', '🙂')">🙂</button>
                <button class="mood-btn" onclick="selectMood('😊', '😊')">😊</button>
            </div>

            <div class="entry-form">
                <textarea id="moodNote" placeholder="What's on your mind?"></textarea>
                <button onclick="addEntry()">Save Entry</button>
            </div>
        </div>

        <div class="mood-stats" id="statsDisplay">0 entries logged</div>

        <div id="entriesList" class="entries-list"></div>
        <div id="emptyState" class="empty-state">
            <p>No entries yet. Start journaling to understand your emotions! 🌟</p>
        </div>
    </div>

    <script>
        let selectedMood = null;

        const appState = {
            entries: JSON.parse(localStorage.getItem('moodEntries')) || [],

            save() {
                localStorage.setItem('moodEntries', JSON.stringify(this.entries));
            }
        };

        function selectMood(emoji, label) {
            selectedMood = emoji;
            document.querySelectorAll('.mood-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
        }

        function addEntry() {
            const note = document.getElementById('moodNote').value.trim();

            if (!selectedMood || !note) {
                showToast('Select a mood and write a note', 'error');
                return;
            }

            const entry = {
                id: Date.now(),
                mood: selectedMood,
                note: note,
                date: new Date().toLocaleString()
            };

            appState.entries.unshift(entry);
            appState.save();

            selectedMood = null;
            document.getElementById('moodNote').value = '';
            document.querySelectorAll('.mood-btn').forEach(btn => btn.classList.remove('active'));

            showToast('Mood saved! 💭', 'success');
            render();
        }

        function deleteEntry(id) {
            appState.entries = appState.entries.filter(e => e.id !== id);
            appState.save();
            showToast('Entry deleted', 'info');
            render();
        }

        function render() {
            const list = document.getElementById('entriesList');
            const empty = document.getElementById('emptyState');
            const stats = document.getElementById('statsDisplay');

            stats.textContent = `${appState.entries.length} entries logged`;

            if (appState.entries.length === 0) {
                list.style.display = 'none';
                empty.style.display = 'block';
                return;
            }

            list.style.display = 'flex';
            empty.style.display = 'none';
            list.innerHTML = appState.entries.map(entry => `
                <div class="entry-item">
                    <div class="entry-header">
                        <div class="entry-mood">${entry.mood}</div>
                        <div class="entry-date">${entry.date}</div>
                    </div>
                    <div class="entry-text">${entry.note}</div>
                    <button class="delete-btn" onclick="deleteEntry(${entry.id})">Delete</button>
                </div>
            `).join('');
        }

        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            toast.style.cssText = `
                position: fixed;
                bottom: 20px;
                left: 50%;
                transform: translateX(-50%);
                padding: 12px 20px;
                background: ${type === 'success' ? '#10B981' : type === 'error' ? '#EF4444' : '#6366F1'};
                color: white;
                border-radius: 6px;
                font-size: 14px;
                z-index: 1000;
            `;
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        render();
    </script>
</body>
</html>
