<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Trivia Quiz: Test your knowledge daily">
    <meta name="theme-color" content="#8B5CF6">
    <title>Trivia Quiz – Challenge yourself</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        :root {
            --primary: #8B5CF6;
            --secondary: #3B82F6;
            --accent: #10B981;
            --bg-dark: #0F172A;
            --bg-light: #1E293B;
            --text-primary: #F1F5F9;
            --text-secondary: #CBD5E1;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { font-family: system-ui, sans-serif; background: var(--bg-dark); color: var(--text-primary); min-height: 100vh; }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .header {
            text-align: center;
            padding: 16px 0;
            border-bottom: 2px solid var(--primary);
        }

        .header h1 { font-size: 28px; margin-bottom: 4px; }

        .quiz-stats {
            display: flex;
            justify-content: space-around;
            padding: 12px;
            background: var(--bg-light);
            border-radius: 6px;
            text-align: center;
        }

        .stat-item {
            flex: 1;
        }

        .stat-number {
            font-size: 18px;
            font-weight: bold;
            color: var(--primary);
        }

        .stat-label {
            font-size: 11px;
            color: var(--text-secondary);
        }

        .question-container {
            padding: 16px;
            background: var(--bg-light);
            border-radius: 8px;
            border: 2px solid var(--primary);
            display: none;
        }

        .question-container.active {
            display: block;
        }

        .question-number {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .question-text {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 16px;
            line-height: 1.4;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .option-btn {
            padding: 12px;
            background: transparent;
            color: var(--text-primary);
            border: 2px solid var(--secondary);
            border-radius: 6px;
            text-align: left;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }

        .option-btn:hover {
            border-color: var(--primary);
            background: rgba(139, 92, 246, 0.1);
        }

        .option-btn.selected {
            border-color: var(--primary);
            background: rgba(139, 92, 246, 0.3);
        }

        .option-btn.correct {
            border-color: var(--accent);
            background: rgba(16, 185, 129, 0.2);
        }

        .option-btn.wrong {
            border-color: #EF4444;
            background: rgba(239, 68, 68, 0.2);
        }

        .btn-group {
            display: flex;
            gap: 8px;
        }

        button {
            padding: 12px 20px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
            flex: 1;
        }

        button:hover { opacity: 0.9; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        .welcome {
            text-align: center;
            padding: 40px 16px;
        }

        .welcome h2 {
            font-size: 24px;
            margin-bottom: 8px;
            color: var(--primary);
        }

        .welcome p {
            color: var(--text-secondary);
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .results {
            text-align: center;
            padding: 24px 16px;
            background: var(--bg-light);
            border-radius: 8px;
        }

        .results h2 {
            font-size: 28px;
            color: var(--primary);
            margin-bottom: 8px;
        }

        .results p {
            color: var(--text-secondary);
            margin-bottom: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🧠 Trivia Quiz</h1>
        </div>

        <div class="quiz-stats">
            <div class="stat-item">
                <div class="stat-number" id="score">0</div>
                <div class="stat-label">Score</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="quizNumber">0/10</div>
                <div class="stat-label">Progress</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="accuracy">0%</div>
                <div class="stat-label">Accuracy</div>
            </div>
        </div>

        <div id="welcome" class="welcome">
            <h2>Ready to test your knowledge?</h2>
            <p>Answer 10 trivia questions and challenge yourself!</p>
            <button onclick="startQuiz()">Start Quiz</button>
        </div>

        <div id="quiz" class="question-container">
            <div class="question-number">Question <span id="currentQuestion">1</span> of 10</div>
            <div class="question-text" id="questionText"></div>
            <div class="options" id="optionsContainer"></div>
            <div class="btn-group" style="margin-top: 16px;">
                <button id="nextBtn" onclick="nextQuestion()" disabled>Next Question</button>
            </div>
        </div>

        <div id="results" class="results" style="display: none;">
            <h2 id="finalScore">Quiz Complete!</h2>
            <p id="resultMessage"></p>
            <button onclick="startQuiz()">Try Again</button>
        </div>
    </div>

    <script>
        const quizzes = [
            {
                question: "What is the capital of France?",
                options: ["London", "Paris", "Berlin", "Madrid"],
                correct: 1
            },
            {
                question: "Which planet is known as the Red Planet?",
                options: ["Venus", "Mars", "Jupiter", "Saturn"],
                correct: 1
            },
            {
                question: "What is the largest ocean?",
                options: ["Atlantic", "Indian", "Arctic", "Pacific"],
                correct: 3
            },
            {
                question: "Who wrote Romeo and Juliet?",
                options: ["Jane Austen", "William Shakespeare", "Mark Twain", "Charles Dickens"],
                correct: 1
            },
            {
                question: "What is 15 × 4?",
                options: ["50", "60", "70", "80"],
                correct: 1
            },
            {
                question: "Which country is home to the Eiffel Tower?",
                options: ["Germany", "Italy", "France", "Spain"],
                correct: 2
            },
            {
                question: "What is the chemical symbol for Gold?",
                options: ["Go", "Gd", "Au", "Ag"],
                correct: 2
            },
            {
                question: "How many continents are there?",
                options: ["5", "6", "7", "8"],
                correct: 2
            },
            {
                question: "What is the smallest prime number?",
                options: ["0", "1", "2", "3"],
                correct: 2
            },
            {
                question: "Which gas do plants absorb from the atmosphere?",
                options: ["Oxygen", "Carbon Dioxide", "Nitrogen", "Hydrogen"],
                correct: 1
            }
        ];

        let currentQuizIndex = 0;
        let score = 0;
        let answered = 0;
        let selectedAnswer = null;

        function startQuiz() {
            currentQuizIndex = 0;
            score = 0;
            answered = 0;
            selectedAnswer = null;

            document.getElementById('welcome').style.display = 'none';
            document.getElementById('results').style.display = 'none';
            document.getElementById('quiz').classList.add('active');

            loadQuestion();
        }

        function loadQuestion() {
            const quiz = quizzes[currentQuizIndex];
            document.getElementById('questionText').textContent = quiz.question;
            document.getElementById('currentQuestion').textContent = currentQuizIndex + 1;
            document.getElementById('quizNumber').textContent = `${currentQuizIndex + 1}/10`;

            const container = document.getElementById('optionsContainer');
            container.innerHTML = quiz.options.map((option, idx) => `
                <button class="option-btn" onclick="selectAnswer(${idx})">${option}</button>
            `).join('');

            selectedAnswer = null;
            document.getElementById('nextBtn').disabled = true;
        }

        function selectAnswer(index) {
            const quiz = quizzes[currentQuizIndex];
            selectedAnswer = index;

            const buttons = document.querySelectorAll('.option-btn');
            buttons.forEach((btn, idx) => {
                btn.classList.remove('selected', 'correct', 'wrong');
                if (idx === index) {
                    btn.classList.add('selected');
                    if (index === quiz.correct) {
                        btn.classList.add('correct');
                        score++;
                    } else {
                        btn.classList.add('wrong');
                    }
                }
                if (idx === quiz.correct && index !== quiz.correct) {
                    btn.classList.add('correct');
                }
                btn.disabled = true;
            });

            answered++;
            updateStats();
            document.getElementById('nextBtn').disabled = false;
        }

        function nextQuestion() {
            currentQuizIndex++;
            if (currentQuizIndex < 10) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        function updateStats() {
            document.getElementById('score').textContent = score;
            const accuracy = answered > 0 ? Math.round((score / answered) * 100) : 0;
            document.getElementById('accuracy').textContent = accuracy + '%';
        }

        function showResults() {
            document.getElementById('quiz').classList.remove('active');
            document.getElementById('results').style.display = 'block';

            const percentage = (score / 10) * 100;
            document.getElementById('finalScore').textContent = `${score}/10 (${percentage}%)`;

            let message = '';
            if (percentage === 100) message = '🌟 Perfect score! You\'re a trivia master!';
            else if (percentage >= 80) message = '🎉 Excellent! You know your stuff!';
            else if (percentage >= 60) message = '👍 Good job! Keep learning!';
            else message = '💪 Great effort! Try again to improve!';

            document.getElementById('resultMessage').textContent = message;
        }
    </script>
</body>
</html>
