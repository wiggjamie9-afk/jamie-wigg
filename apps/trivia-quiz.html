<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#08050d">
    <title>Trivia Quiz</title>
    <style>
        :root { --canvas:#08050d; --green:#00e887; --red:#ff1f5a; --cyan:#00d8ff; --purple:#7c3aed; --text:#fff; --text-muted:#aaa; }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:var(--canvas); color:var(--text); min-height:100vh; padding-bottom:80px; }
        .header { padding:20px; border-bottom:1px solid rgba(0,232,135,0.2); display:flex; justify-content:space-between; }
        h1 { font-size:24px; font-weight:700; }
        .badge { background:var(--green); color:var(--canvas); padding:4px 12px; border-radius:20px; font-size:11px; }
        .content { padding:20px; }
        .category-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin:15px 0; }
        .category-btn { background:rgba(0,232,135,0.1); border:1px solid rgba(0,232,135,0.2); color:var(--text); padding:15px; border-radius:8px; cursor:pointer; font-weight:600; text-align:center; }
        .category-btn:hover { background:rgba(0,232,135,0.2); }
        .question { background:rgba(0,232,135,0.05); border:1px solid rgba(0,232,135,0.2); border-radius:8px; padding:20px; margin:15px 0; }
        .q-number { font-size:12px; color:var(--text-muted); margin-bottom:10px; }
        .q-text { font-size:18px; font-weight:600; margin:15px 0; }
        .option { background:rgba(0,232,135,0.1); border:1px solid rgba(0,232,135,0.2); color:var(--text); padding:12px; margin:8px 0; border-radius:6px; cursor:pointer; }
        .option:hover { background:rgba(0,232,135,0.2); }
        .option.selected { border-color:var(--green); background:rgba(0,232,135,0.3); }
        .option.correct { background:rgba(0,232,135,0.5); border-color:var(--green); }
        .option.wrong { background:rgba(255,31,90,0.2); border-color:var(--red); }
        button { background:var(--green); color:var(--canvas); border:0; padding:10px 16px; border-radius:6px; cursor:pointer; font-weight:600; width:100%; margin-top:10px; }
        .score { font-size:24px; color:var(--green); font-weight:700; margin:20px 0; }
        .panel { display:none; }
        .panel.on { display:block; }
        .tabs { position:fixed; bottom:0; left:0; right:0; background:var(--canvas); border-top:1px solid rgba(0,232,135,0.2); display:flex; justify-content:space-around; height:70px; z-index:100; }
        .tab { flex:1; background:0; border:0; color:var(--text-muted); cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:12px; }
        .tab.on { color:var(--green); }
        .premium { background:rgba(124,58,237,0.1); border-left:3px solid var(--purple); padding:12px; margin-top:20px; border-radius:4px; font-size:13px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>❓ Trivia</h1>
        <div class="badge">FREE</div>
    </div>
    <div class="content">
        <div id="start" class="panel on">
            <div style="font-weight:600;margin:15px 0">Select a Category:</div>
            <div class="category-grid">
                <button class="category-btn" onclick="startQuiz('science')">🔬 Science</button>
                <button class="category-btn" onclick="startQuiz('history')">📖 History</button>
                <button class="category-btn" onclick="startQuiz('geography')">🌍 Geography</button>
                <button class="category-btn" onclick="startQuiz('sports')">⚽ Sports</button>
                <button class="category-btn" onclick="startQuiz('movies')">🎬 Movies</button>
            </div>
            <div class="premium">💎 Premium: 500+ questions, all categories</div>
        </div>
        
        <div id="quiz" class="panel">
            <div class="question">
                <div class="q-number" id="q-num"></div>
                <div class="q-text" id="q-text"></div>
                <div id="options"></div>
            </div>
            <button id="next-btn" onclick="nextQuestion()">Next →</button>
        </div>
        
        <div id="results" class="panel">
            <div style="text-align:center">
                <div style="font-size:18px;margin:20px 0">Your Score</div>
                <div class="score" id="final-score"></div>
                <button onclick="document.querySelectorAll('.tab')[0].click()">Play Again</button>
            </div>
        </div>
    </div>
    <div class="tabs">
        <button class="tab on" data-p="start">🎮 Quiz</button>
    </div>
    <script>
        const questions = {
            science: [
                {q:'What is the largest planet?', opts:['Jupiter','Saturn','Mars','Neptune'], ans:0},
                {q:'What is H2O?', opts:['Hydrogen','Water','Salt','Carbon'], ans:1},
                {q:'What do plants produce?', opts:['Oxygen','Carbon','Nitrogen','Helium'], ans:0},
                {q:'What is DNA?', opts:['A virus','Genetic material','A protein','Fat'], ans:1},
                {q:'How many bones in human body?', opts:['186','206','226','256'], ans:1}
            ],
            history: [
                {q:'Who was first US President?', opts:['Jefferson','Washington','Adams','Lincoln'], ans:1},
                {q:'What year was America founded?', opts:['1776','1770','1800','1750'], ans:0},
                {q:'Who wrote Declaration of Independence?', opts:['Franklin','Jefferson','Adams','Hamilton'], ans:1},
                {q:'What ancient wonder still stands?', opts:['Colosseum','Pyramid of Giza','Hanging Gardens','Lighthouse'], ans:1},
                {q:'When did WWII end?', opts:['1943','1944','1945','1946'], ans:2}
            ],
            geography: [
                {q:'What is the capital of France?', opts:['Lyon','Marseille','Paris','Nice'], ans:2},
                {q:'Which continent is largest?', opts:['Africa','Asia','Europe','America'], ans:1},
                {q:'What is the longest river?', opts:['Amazon','Nile','Yangtze','Mississippi'], ans:1},
                {q:'Which ocean is largest?', opts:['Atlantic','Indian','Arctic','Pacific'], ans:3},
                {q:'What is the capital of Japan?', opts:['Osaka','Tokyo','Kyoto','Hiroshima'], ans:1}
            ],
            sports: [
                {q:'How many players in basketball?', opts:['5','7','9','11'], ans:0},
                {q:'What is the Olympic symbol?', opts:['Flag','Rings','Torch','Medal'], ans:1},
                {q:'In which sport is a birdie?', opts:['Tennis','Golf','Badminton','Cricket'], ans:1},
                {q:'How many players in soccer?', opts:['9','10','11','12'], ans:2},
                {q:'What is a love in tennis?', opts:['A point','A love letter','Zero score','A match'], ans:2}
            ],
            movies: [
                {q:'Who directed Jaws?', opts:['Spielberg','Hitchcock','Kubrick','Coppola'], ans:0},
                {q:'What year was Titanic released?', opts:['1995','1996','1997','1998'], ans:2},
                {q:'What is highest grossing film?', opts:['Avatar 2','Avengers','Top Gun','Avatar'], ans:0},
                {q:'Who played Forrest Gump?', opts:['Hanks','DiCaprio','Pitt','Cruise'], ans:0},
                {q:'Which film won Best Picture 2020?', opts:['1917','Parasite','Joker','Once Upon'], ans:1}
            ]
        };
        
        let currentCat, currentQ, score, answered;
        
        function startQuiz(cat) {
            currentCat = cat;
            currentQ = 0;
            score = 0;
            answered = false;
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('on'));
            document.getElementById('quiz').classList.add('on');
            showQuestion();
        }
        
        function showQuestion() {
            let q = questions[currentCat][currentQ];
            document.getElementById('q-num').textContent = `Question ${currentQ + 1}/5`;
            document.getElementById('q-text').textContent = q.q;
            document.getElementById('options').innerHTML = q.opts.map((opt, i) =>
                `<div class="option" onclick="selectAnswer(${i}, ${q.ans})">${opt}</div>`
            ).join('');
            answered = false;
        }
        
        function selectAnswer(selected, correct) {
            if (answered) return;
            answered = true;
            let opts = document.querySelectorAll('.option');
            opts[selected].classList.add(selected === correct ? 'correct' : 'wrong');
            opts[correct].classList.add('correct');
            if (selected === correct) score++;
        }
        
        function nextQuestion() {
            currentQ++;
            if (currentQ >= 5) {
                document.querySelectorAll('.panel').forEach(p => p.classList.remove('on'));
                document.getElementById('results').classList.add('on');
                document.getElementById('final-score').textContent = `${score}/5`;
            } else {
                showQuestion();
            }
        }
        
        if ('serviceWorker' in navigator) navigator.serviceWorker.register('data:application/javascript,self.addEventListener("install",e=>self.skipWaiting());');
    </script>
</body>
</html>
