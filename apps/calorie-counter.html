<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#08050d">
    <title>Calorie Counter</title>
    <style>
        :root { --canvas:#08050d; --green:#00e887; --red:#ff1f5a; --cyan:#00d8ff; --purple:#7c3aed; --text:#fff; --text-muted:#aaa; }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:var(--canvas); color:var(--text); min-height:100vh; padding-bottom:80px; }
        .header { padding:20px; border-bottom:1px solid rgba(0,232,135,0.2); display:flex; justify-content:space-between; }
        h1 { font-size:24px; font-weight:700; }
        .badge { background:var(--green); color:var(--canvas); padding:4px 12px; border-radius:20px; font-size:11px; }
        .content { padding:20px; }
        input { background:rgba(0,232,135,0.05); border:1px solid rgba(0,232,135,0.2); border-radius:6px; color:var(--text); padding:10px; margin:8px 0; width:100%; }
        button { background:var(--green); color:var(--canvas); border:0; padding:10px 16px; border-radius:6px; cursor:pointer; font-weight:600; width:100%; }
        .food-list { list-style:none; margin:15px 0; }
        .food-item { background:rgba(0,232,135,0.05); border:1px solid rgba(0,232,135,0.1); border-radius:6px; padding:10px; margin:8px 0; display:flex; justify-content:space-between; align-items:center; cursor:pointer; }
        .food-item:hover { background:rgba(0,232,135,0.15); }
        .stats { background:rgba(0,232,135,0.05); border:1px solid rgba(0,232,135,0.2); border-radius:8px; padding:15px; margin:15px 0; }
        .stat-row { display:flex; justify-content:space-between; margin:8px 0; }
        .panel { display:none; }
        .panel.on { display:block; }
        .tabs { position:fixed; bottom:0; left:0; right:0; background:var(--canvas); border-top:1px solid rgba(0,232,135,0.2); display:flex; justify-content:space-around; height:70px; z-index:100; }
        .tab { flex:1; background:0; border:0; color:var(--text-muted); cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:12px; }
        .tab.on { color:var(--green); }
        .premium { background:rgba(124,58,237,0.1); border-left:3px solid var(--purple); padding:12px; margin-top:20px; border-radius:4px; font-size:13px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🍎 Calories</h1>
        <div class="badge">FREE</div>
    </div>
    <div class="content">
        <div id="log" class="panel on">
            <input type="text" id="food" placeholder="Search foods...">
            <div id="suggestions" style="margin:10px 0"></div>
            <input type="number" id="qty" placeholder="Quantity (grams)" min="1" value="100">
            <button onclick="addFood()">+ Add Food</button>
            <div class="stats">
                <div class="stat-row"><span>Today's Calories:</span><span id="total" style="font-weight:600;color:var(--green)">0</span></div>
                <div class="stat-row"><span>Meals Logged:</span><span id="count">0</span></div>
            </div>
            <div id="meals" class="food-list"></div>
            <div class="premium">💎 Premium: AI meal planning</div>
        </div>
        <div id="db" class="panel">
            <div id="db-list" class="food-list"></div>
        </div>
    </div>
    <div class="tabs">
        <button class="tab on" data-p="log">📝 Log</button>
        <button class="tab" data-p="db">📚 Database</button>
    </div>
    <script>
        const foods = {
            'chicken':165, 'rice':130, 'broccoli':34, 'banana':89, 'egg':155,
            'yogurt':59, 'bread':265, 'salmon':206, 'apple':52, 'almonds':579,
            'pasta':131, 'olive oil':884, 'milk':61, 'cheese':402, 'beef':250
        };
        let meals = [];
        
        function load() {
            let d = localStorage.getItem('calories');
            if (d) meals = JSON.parse(d);
            draw();
        }
        
        function save() {
            localStorage.setItem('calories', JSON.stringify(meals));
            draw();
        }
        
        function addFood() {
            let f = document.getElementById('food').value.toLowerCase();
            let q = parseInt(document.getElementById('qty').value) || 100;
            if (!f || !foods[f]) return;
            
            let cal = Math.round(foods[f] * q / 100);
            meals.push({f, q, cal, t:new Date().toLocaleTimeString()});
            document.getElementById('food').value = '';
            save();
        }
        
        function draw() {
            let total = meals.reduce((a,x) => a + x.cal, 0);
            document.getElementById('total').textContent = total;
            document.getElementById('count').textContent = meals.length;
            
            document.getElementById('meals').innerHTML = meals.length ?
                meals.map((m,i) => `<div class="food-item"><div>${m.f} (${m.q}g)</div><div style="color:var(--green);font-weight:600">${m.cal}cal</div></div>`).join('') :
                '<p style="color:var(--text-muted)">No meals logged</p>';
            
            document.getElementById('db-list').innerHTML = Object.entries(foods).map(([k,v]) =>
                `<div class="food-item" onclick="document.getElementById('food').value='${k}';"><div>${k}</div><div style="color:var(--cyan)">${v}cal/100g</div></div>`
            ).join('');
        }
        
        document.getElementById('food').oninput = function() {
            let q = this.value.toLowerCase();
            let matches = Object.keys(foods).filter(k => k.includes(q)).slice(0,5);
            document.getElementById('suggestions').innerHTML = matches.length ?
                matches.map(m => `<button onclick="document.getElementById('food').value='${m}';this.parentElement.innerHTML=''" style="margin:4px;padding:6px;width:auto;background:rgba(0,232,135,0.2)">${m}</button>`).join('') : '';
        };
        
        document.querySelectorAll('.tab').forEach(t => {
            t.onclick = () => {
                document.querySelectorAll('.tab').forEach(x => x.classList.remove('on'));
                document.querySelectorAll('.panel').forEach(x => x.classList.remove('on'));
                t.classList.add('on');
                document.getElementById(t.dataset.p).classList.add('on');
            };
        });
        
        load();
        if ('serviceWorker' in navigator) navigator.serviceWorker.register('data:application/javascript,self.addEventListener("install",e=>self.skipWaiting());');
    </script>
</body>
</html>
