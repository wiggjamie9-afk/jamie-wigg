<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#08050d">
    <title>Vendor Tracker</title>
    <style>
        :root { --canvas:#08050d; --green:#00e887; --red:#ff1f5a; --cyan:#00d8ff; --purple:#7c3aed; --text:#fff; --text-muted:#aaa; }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:var(--canvas); color:var(--text); min-height:100vh; padding-bottom:80px; }
        .header { padding:20px; border-bottom:1px solid rgba(0,232,135,0.2); display:flex; justify-content:space-between; }
        h1 { font-size:24px; font-weight:700; }
        .badge { background:var(--green); color:var(--canvas); padding:4px 12px; border-radius:20px; font-size:11px; }
        .content { padding:20px; }
        input { background:rgba(0,232,135,0.05); border:1px solid rgba(0,232,135,0.2); border-radius:6px; color:var(--text); padding:10px; margin:8px 0; width:100%; }
        button { background:var(--green); color:var(--canvas); border:0; padding:10px 16px; border-radius:6px; cursor:pointer; font-weight:600; width:100%; }
        .card { background:rgba(0,232,135,0.05); border:1px solid rgba(0,232,135,0.2); border-radius:8px; padding:15px; margin:12px 0; }
        .card-title { font-weight:600; margin-bottom:8px; }
        .row { display:flex; justify-content:space-between; padding:6px 0; font-size:13px; }
        .low { color:var(--red); }
        .ok { color:var(--green); }
        .panel { display:none; }
        .panel.on { display:block; }
        .tabs { position:fixed; bottom:0; left:0; right:0; background:var(--canvas); border-top:1px solid rgba(0,232,135,0.2); display:flex; justify-content:space-around; height:70px; z-index:100; }
        .tab { flex:1; background:0; border:0; color:var(--text-muted); cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:12px; }
        .tab.on { color:var(--green); }
        .premium { background:rgba(124,58,237,0.1); border-left:3px solid var(--purple); padding:12px; margin-top:20px; border-radius:4px; font-size:13px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>📦 Vendor</h1>
        <div class="badge">FREE</div>
    </div>
    <div class="content">
        <div id="inventory" class="panel on">
            <input type="text" id="prod" placeholder="Product name">
            <input type="text" id="vendor" placeholder="Vendor">
            <input type="number" id="stock" placeholder="Stock level" min="0" step="1">
            <button onclick="addProduct()">+ Add Product</button>
            
            <div id="products" style="margin-top:20px"></div>
            <div class="premium">💎 Premium: Advanced analytics & forecasting</div>
        </div>
        
        <div id="sales" class="panel">
            <input type="text" id="sale-prod" placeholder="Product">
            <input type="number" id="sale-qty" placeholder="Qty sold" min="1" step="1">
            <button onclick="logSale()">+ Log Sale</button>
            
            <div id="sales-list" style="margin-top:20px"></div>
        </div>
    </div>
    <div class="tabs">
        <button class="tab on" data-p="inventory">📊 Inventory</button>
        <button class="tab" data-p="sales">💰 Sales</button>
    </div>
    <script>
        let products = [];
        let sales = [];
        
        function load() {
            let d = localStorage.getItem('vendor');
            if (d) {
                let p = JSON.parse(d);
                products = p.products || [];
                sales = p.sales || [];
            }
            draw();
        }
        
        function save() {
            localStorage.setItem('vendor', JSON.stringify({products, sales}));
            draw();
        }
        
        function addProduct() {
            let p = document.getElementById('prod').value;
            let v = document.getElementById('vendor').value;
            let s = parseInt(document.getElementById('stock').value) || 0;
            if (!p || !v) return;
            products.push({p, v, s});
            document.getElementById('prod').value = '';
            document.getElementById('vendor').value = '';
            document.getElementById('stock').value = '';
            save();
        }
        
        function logSale() {
            let p = document.getElementById('sale-prod').value;
            let q = parseInt(document.getElementById('sale-qty').value) || 0;
            if (!p || !q) return;
            sales.push({p, q, d:new Date().toLocaleDateString()});
            let prod = products.find(x => x.p === p);
            if (prod) prod.s = Math.max(0, prod.s - q);
            document.getElementById('sale-prod').value = '';
            document.getElementById('sale-qty').value = '';
            save();
        }
        
        function draw() {
            document.getElementById('products').innerHTML = products.length ?
                products.map((p,i) => `<div class="card">
                    <div class="card-title">${p.p}</div>
                    <div class="row"><span>Vendor:</span><span>${p.v}</span></div>
                    <div class="row"><span>Stock:</span><span class="${p.s<5?'low':'ok'}">${p.s} units</span></div>
                </div>`).join('') :
                '<p style="color:var(--text-muted)">No products</p>';
            
            document.getElementById('sales-list').innerHTML = sales.length ?
                sales.slice(0,10).map(s => `<div class="card">
                    <div class="card-title">${s.p}</div>
                    <div class="row"><span>Qty:</span><span>${s.q}</span></div>
                    <div class="row"><span>Date:</span><span>${s.d}</span></div>
                </div>`).join('') :
                '<p style="color:var(--text-muted)">No sales logged</p>';
        }
        
        document.querySelectorAll('.tab').forEach(t => {
            t.onclick = () => {
                document.querySelectorAll('.tab').forEach(x => x.classList.remove('on'));
                document.querySelectorAll('.panel').forEach(x => x.classList.remove('on'));
                t.classList.add('on');
                document.getElementById(t.dataset.p).classList.add('on');
            };
        });
        
        load();
        if ('serviceWorker' in navigator) navigator.serviceWorker.register('data:application/javascript,self.addEventListener("install",e=>self.skipWaiting());');
    </script>
</body>
</html>
