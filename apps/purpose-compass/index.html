<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Purpose Compass — Find your deepest why</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #78350f 0%, #b45309 100%);
            color: #f1f5f9;
            min-height: 100vh;
            padding: 16px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            padding: 24px 0 16px;
            border-bottom: 1px solid rgba(217, 119, 6, 0.3);
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(90deg, #fcd34d, #fbbf24);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            font-size: 14px;
            color: #fcd34d;
        }

        #onboard { animation: fadeIn 0.4s ease-out; }

        .onboard-content { text-align: center; }

        .onboard-content h2 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 16px;
            color: #fcd34d;
        }

        .onboard-content p {
            font-size: 15px;
            line-height: 1.6;
            color: #fbbf24;
            margin-bottom: 24px;
        }

        .track-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 12px;
        }

        .track-btn {
            padding: 16px 12px;
            border: 2px solid rgba(217, 119, 6, 0.6);
            background: rgba(120, 53, 15, 0.5);
            color: #fbbf24;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .track-btn:hover {
            border-color: #fcd34d;
            background: rgba(180, 83, 9, 0.3);
            color: #fcd34d;
        }

        #styleCard {
            display: none;
            margin-top: 20px;
            padding: 20px;
            background: rgba(180, 83, 9, 0.2);
            border: 1px solid rgba(252, 211, 77, 0.3);
            border-radius: 12px;
            animation: slideDown 0.4s ease-out;
        }

        .style-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 16px;
        }

        .style-opt {
            padding: 12px;
            border: 2px solid rgba(217, 119, 6, 0.6);
            background: rgba(120, 53, 15, 0.5);
            color: #fbbf24;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .style-opt:hover {
            border-color: #fcd34d;
            background: rgba(180, 83, 9, 0.3);
            color: #fcd34d;
        }

        #lessonView { display: none; animation: fadeIn 0.4s ease-out; }

        .lesson-content {
            background: rgba(180, 83, 9, 0.15);
            border: 1px solid rgba(252, 211, 77, 0.2);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
        }

        .lesson-title {
            font-size: 22px;
            font-weight: 700;
            color: #fcd34d;
            margin-bottom: 16px;
            line-height: 1.3;
        }

        .lesson-body {
            font-size: 15px;
            line-height: 1.7;
            color: #fbbf24;
            margin-bottom: 20px;
        }

        .lesson-body p { margin-bottom: 12px; }

        .lesson-affirmation {
            padding: 16px;
            background: rgba(252, 211, 77, 0.1);
            border-left: 4px solid #fbbf24;
            border-radius: 4px;
            font-style: italic;
            color: #fbbf24;
            font-size: 14px;
            margin-bottom: 16px;
        }

        .lesson-strength {
            display: inline-block;
            padding: 8px 12px;
            background: rgba(252, 211, 77, 0.2);
            color: #fbbf24;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }

        .controls {
            display: flex;
            gap: 12px;
            margin-top: 24px;
            flex-wrap: wrap;
        }

        .btn {
            flex: 1;
            min-width: 100px;
            padding: 12px 16px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: linear-gradient(90deg, #fcd34d, #fbbf24);
            color: #78350f;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(252, 211, 77, 0.3);
        }

        .btn-secondary {
            background: rgba(217, 119, 6, 0.4);
            color: #fbbf24;
            border: 1px solid rgba(252, 211, 77, 0.3);
        }

        .btn-secondary:hover {
            border-color: #fcd34d;
            color: #fcd34d;
        }

        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            font-size: 13px;
            color: #daa520;
            flex-wrap: wrap;
            gap: 12px;
        }

        .streak {
            font-weight: 600;
            color: #fbbf24;
        }

        #celebrate {
            display: none;
            text-align: center;
            padding: 40px 20px;
            animation: scaleIn 0.5s ease-out;
        }

        .celebrate-emoji { font-size: 60px; margin-bottom: 16px; }

        .celebrate-text {
            font-size: 24px;
            font-weight: 700;
            color: #fbbf24;
            margin-bottom: 24px;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Purpose Compass</h1>
            <p>One lesson a day on meaning and life</p>
        </div>

        <div id="onboard">
            <div class="onboard-content">
                <h2>What calls to you?</h2>
                <p>Where do you seek meaning?</p>
                <div class="track-buttons">
                    <button class="track-btn" onclick="selectTrack('self')">🔍 Self</button>
                    <button class="track-btn" onclick="selectTrack('connection')">🤝 Connection</button>
                    <button class="track-btn" onclick="selectTrack('impact')">🌍 Impact</button>
                    <button class="track-btn" onclick="selectTrack('journey')">🗺️ Journey</button>
                </div>
            </div>
            <div id="styleCard">
                <p style="margin-bottom: 12px; font-size: 14px; color: #fbbf24;">What approach resonates?</p>
                <div class="style-options">
                    <button class="style-opt" onclick="selectStyle('reflective')">Reflective</button>
                    <button class="style-opt" onclick="selectStyle('action')">Action-based</button>
                    <button class="style-opt" onclick="selectStyle('wisdom')">Wisdom</button>
                    <button class="style-opt" onclick="selectStyle('story')">Story-driven</button>
                </div>
            </div>
        </div>

        <div id="lessonView">
            <div class="lesson-content">
                <div class="lesson-title" id="lessonTitle"></div>
                <div class="lesson-body" id="lessonBody"></div>
                <div class="lesson-affirmation" id="lessonAffirmation"></div>
                <div class="lesson-strength" id="lessonStrength"></div>
            </div>

            <div class="controls">
                <button class="btn btn-primary" onclick="speak()">🔊 Read aloud</button>
                <button class="btn btn-secondary" onclick="nextLesson()">Next →</button>
                <button class="btn btn-secondary" onclick="markDone()">✓ Done</button>
            </div>

            <div class="footer">
                <div id="progress"></div>
                <div><span class="streak" id="streak"></span></div>
            </div>
        </div>

        <div id="celebrate">
            <div class="celebrate-emoji">✨</div>
            <div class="celebrate-text">You're finding your way</div>
            <p style="color: #fbbf24; margin-bottom: 24px;">Purpose deepens with reflection. Come back tomorrow.</p>
            <button class="btn btn-primary" onclick="resetView()">Back to start</button>
        </div>
    </div>

    <script>
        const lessons = [
            {t:"You're not here by accident",b:["Every person, every moment, every struggle you've experienced has woven together the specific version of you that exists right now.","That's not mysticism. That's just how causality works. Your unique combination of experiences, values, and gifts exists nowhere else.","Today's tiny step: trace back three decisions you've made. How did they lead to where you are now?"],a:"Your life isn't random. You're the evidence.",s:"Life as design"},
            {t:"Your deepest wounds are your greatest wisdom",b:["The things you struggled with teach you things others never learn. The things that broke you show you how strong you are.","Your wounds aren't flaws. They're your credentials for understanding others with the same wounds.","Today's tiny step: what's a struggle you've overcome? What did it teach you that you're now qualified to teach others?"],a:"Your pain is your power.",s:"Wisdom from struggle"},
            {t:"Purpose isn't something you find—it's something you create",b:["The trap is waiting to discover your purpose. The truth: purpose emerges from what you actually do, what you care about, what you're drawn to.","Stop looking for the perfect purpose. Start paying attention to what you're naturally pulled toward.","Today's tiny step: what are you doing when you lose track of time? What would you do without being paid? That's closer to your purpose."],a:"Purpose is revealed through action, not contemplation.",s:"Created purpose"},
            {t:"Your life is a conversation with existence",b:["Existence offers you challenges. You respond. Existence responds to your response. Back and forth, your life unfolds.","The people who feel most alive are the ones having the deepest conversations with life—asking questions, trying things, learning.","Today's tiny step: what's one big question you have about your life or the world? Write it down. Let that question guide you."],a:"Your life is the answer to your own questions.",s:"Dialogue with life"},
            {t:"Meaning is made in connection",b:["The people who report the most meaning and fulfillment aren't the richest or most successful. They're the ones with the strongest relationships.","Meaning doesn't come from achievement. It comes from mattering to someone.","Today's tiny step: reach out to someone and let them know they matter to you. Feel how that creates meaning."],a:"You matter because you exist.",s:"Connection creates meaning"},
            {t:"Your values are your compass",b:["When you don't know what to do, your values show you. When you feel empty, it's often because your actions don't align with your values.","The highest-integrity people are the ones whose actions match their stated values.","Today's tiny step: name 3 values that matter most to you. Are your daily actions aligned with them? If not, realign."],a:"Values guide you home.",s:"Alignment"},
            {t:"Sacrifice and meaning are intertwined",b:["Nothing meaningful comes without sacrifice. The more you sacrifice for something, the more meaningful it becomes.","The parents who feel most fulfilled are often the ones who sacrificed the most. Not because sacrifice equals love, but because sacrifice creates meaning.","Today's tiny step: what would you sacrifice for? That's what matters. That's where meaning lives."],a:"What you're willing to sacrifice for is what you truly believe in.",s:"Sacred sacrifice"},
            {t:"Your story is still being written",b:["You're not the final version of yourself. You're the middle of the story. The best chapters might be ahead.","This realization liberates you. It means your past doesn't define you. It means your failures are just plot twists.","Today's tiny step: imagine yourself at 80, looking back on your life. What would you want to have done? That's the story you're still writing."],a:"You're the hero of an unfinished story.",s:"Story unfolding"},
            {t:"Boredom is an invitation",b:["When you're bored, it's not nothing. It's your soul saying 'I need something more meaningful.' Listen to it.","The people who build meaningful lives are the ones who refuse to accept meaninglessness.","Today's tiny step: what bores you right now? What would be the opposite? That opposite might be calling you."],a:"Boredom is a messenger.",s:"Listen to dissatisfaction"},
            {t:"Your unique perspective is needed",b:["Nobody sees the world exactly like you do. Nobody has your combination of experiences, values, and gifts.","That means there are ways you can help that nobody else can. Problems you can solve that others can't see.","Today's tiny step: what's a unique perspective you have that most people don't? Who might need to hear it?"],a:"Your perspective is your medicine.",s:"Unique contribution"},
            {t:"Legacy isn't about fame—it's about impact",b:["You don't need millions to know your name to leave a legacy. You leave a legacy every time you help someone, teach someone, inspire someone.","The people who touch your life and change it—they've left a legacy. You might never know all the ways you've changed others.","Today's tiny step: who has impacted your life? How did they do it? Now do that for someone else."],a:"You're a legacy in progress.",s:"Ripple effect"},
            {t:"Suffering has purpose even when you can't see it",b:["Not everything happens for a reason. But everything can be transformed into meaning.","The choice to make meaning out of suffering is how humans survive and transcend difficulty.","Today's tiny step: has suffering taught you something? Can you see how it might be useful to share with others?"],a:"Your suffering can become wisdom.",s:"Transmuted pain"},
            {t:"You're both an individual and part of something larger",b:["Your life matters individually. But it also matters as part of humanity, your community, your family, your world.","The paradox is: you matter most when you stop thinking only about yourself.","Today's tiny step: how are you part of something larger than yourself? In what group or cause do you belong?"],a:"You're both unique and universal.",s:"Part of the whole"},
            {t:"Time is your most precious resource—spend it on meaning",b:["You can earn money back. You can't earn time back. The most meaningful lives are the ones where time is spent on what matters.","Most people regret time wasted on things that didn't matter.","Today's tiny step: how are you spending your time? Is it aligned with what matters to you? If not, what needs to change?"],a:"Time is life in its most distilled form.",s:"Time as meaning"},
            {t:"Your questions matter more than your answers",b:["The people who live the most meaningful lives aren't the ones who have it all figured out. They're the ones asking the best questions.","A meaningful life is a life of inquiry.","Today's tiny step: what are the deepest questions you have about life, meaning, purpose? Write them down. Don't answer them. Just sit with them."],a:"A well-asked question opens doors.",s:"Living questions"},
            {t:"You're already leaving a mark",b:["Everyone you've encountered carries a piece of you forward. Your words, your actions, your presence affects them.","You're already mattering to people you might never know about.","Today's tiny step: reach out to someone and thank them for affecting you. Feel the weight of knowing you affect others too."],a:"You matter more than you know.",s:"Your influence"},
            {t:"Purpose evolves—and that's sacred",b:["Your purpose at 20 isn't your purpose at 40. As you grow, your understanding of meaning deepens.","The people who have rigid purposes often become unfulfilled as they grow. The ones who let purpose evolve stay alive.","Today's tiny step: what was your purpose 5 years ago? How has it changed? Where might it go next?"],a:"Evolution is how meaning deepens.",s:"Living purpose"},
            {t:"Loneliness points toward connection",b:["When you feel lonely, it's not a flaw. It's a signal that you need deeper connection—with others, with yourself, with purpose.","The antidote to loneliness isn't being around people. It's feeling understood and understood.","Today's tiny step: what conversation do you need to have? With whom? Don't wait. Reach out."],a:"Loneliness reveals what you truly need.",s:"Connection calling"},
            {t:"Your life is a gift you're giving",b:["You're not just living a life. You're giving it. To the people you love, to the world, to existence itself.","The moment you realize your life is a gift transforms how you live it.","Today's tiny step: for whom are you living? Who benefits from your existence? Hold that in your heart."],a:"Your life is a present to the world.",s:"Gift of existence"},
            {t:"Find your place in the story of humanity",b:["Billions of people have lived before you. Billions will come after. Your life is a verse in a larger poem.","Understanding your place in that story—not as small, but as essential—is where peace lives.","Today's tiny step: how do you want to be remembered? In your family? In your community? What do you want to be known for?"],a:"You're part of a story much larger than yourself—and that's your dignity.",s:"Sacred participation"}
        ];

        const tracks = { self: 0, connection: 5, impact: 10, journey: 15 };

        let state = JSON.parse(localStorage.getItem('purposeState')) || {
            track: null,
            style: null,
            done: [],
            lastDay: null,
            streak: 0,
            seen: {}
        };

        function selectTrack(t) {
            state.track = t;
            state.style = null;
            state.seen = {};
            document.getElementById('styleCard').style.display = 'block';
        }

        function selectStyle(s) {
            state.style = s;
            state.lastDay = new Date().toDateString();
            saveState();
            showLesson();
        }

        function saveState() {
            localStorage.setItem('purposeState', JSON.stringify(state));
        }

        function getTrackIndex(offset) {
            const trackStart = tracks[state.track];
            let idx = trackStart + offset;
            while (state.done.includes(idx)) idx++;
            return idx < trackStart + 5 ? idx : trackStart + (Math.floor(Math.random() * 5));
        }

        function showLesson() {
            if (!state.track || !state.style) return;
            const offset = state.seen[state.track] ? (state.seen[state.track] + 1) % 5 : 0;
            const idx = getTrackIndex(offset);
            state.seen[state.track] = offset;
            const l = lessons[idx];
            document.getElementById('lessonTitle').textContent = l.t;
            document.getElementById('lessonBody').innerHTML = l.b.map(p => `<p>${p}</p>`).join('');
            document.getElementById('lessonAffirmation').textContent = l.a;
            document.getElementById('lessonStrength').textContent = l.s;
            updateUI();
        }

        function updateUI() {
            const today = new Date().toDateString();
            if (state.lastDay !== today) state.streak = 0;
            if (state.done.length > 0) {
                const lastDone = state.done[state.done.length - 1];
                if (new Date().toDateString() === state.lastDay) {
                    document.getElementById('onboard').style.display = 'none';
                    document.getElementById('celebrate').style.display = 'block';
                    document.getElementById('lessonView').style.display = 'none';
                } else {
                    document.getElementById('onboard').style.display = 'none';
                    document.getElementById('lessonView').style.display = 'block';
                    document.getElementById('celebrate').style.display = 'none';
                }
            } else {
                document.getElementById('onboard').style.display = 'block';
                document.getElementById('lessonView').style.display = 'none';
                document.getElementById('celebrate').style.display = 'none';
            }
            document.getElementById('progress').textContent = `${state.done.length} lesson${state.done.length !== 1 ? 's' : ''} done`;
            document.getElementById('streak').textContent = `🌟 ${state.streak} day${state.streak !== 1 ? 's' : ''} here`;
        }

        function speak() {
            const title = document.getElementById('lessonTitle').textContent;
            const body = document.getElementById('lessonBody').innerText;
            const aff = document.getElementById('lessonAffirmation').textContent;
            speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(`${title}. ${body}. ${aff}`);
            u.rate = 0.89;
            speechSynthesis.speak(u);
        }

        function nextLesson() {
            showLesson();
        }

        function markDone() {
            const idx = lessons.findIndex(l => l.t === document.getElementById('lessonTitle').textContent);
            if (!state.done.includes(idx)) {
                state.done.push(idx);
                if (state.lastDay === new Date().toDateString()) state.streak++;
                state.lastDay = new Date().toDateString();
                saveState();
            }
            document.getElementById('onboard').style.display = 'none';
            document.getElementById('lessonView').style.display = 'none';
            document.getElementById('celebrate').style.display = 'block';
        }

        function resetView() {
            document.getElementById('celebrate').style.display = 'none';
            document.getElementById('onboard').style.display = 'block';
            state.track = null;
            state.style = null;
            saveState();
        }

        updateUI();
        if (state.track && state.style) showLesson();
    </script>
</body>
</html>
