<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NutriAI – Nutrition Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            max-height: 960px;
            background: rgba(240, 253, 244, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 32px;
            border: 1px solid rgba(34, 197, 94, 0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 60px rgba(34, 197, 94, 0.15);
        }

        .carousel {
            flex: 1;
            overflow-x: auto;
            scroll-behavior: smooth;
            display: flex;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
        }

        .carousel::-webkit-scrollbar {
            height: 4px;
        }

        .carousel::-webkit-scrollbar-track {
            background: transparent;
        }

        .carousel::-webkit-scrollbar-thumb {
            background: rgba(34, 197, 94, 0.3);
            border-radius: 2px;
        }

        .screen {
            flex: 0 0 100%;
            scroll-snap-align: start;
            padding: 32px 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .screen::-webkit-scrollbar {
            width: 4px;
        }

        .screen::-webkit-scrollbar-track {
            background: transparent;
        }

        .screen::-webkit-scrollbar-thumb {
            background: rgba(34, 197, 94, 0.3);
            border-radius: 2px;
        }

        /* Home Screen */
        .home-header {
            margin-bottom: 32px;
        }

        .home-header h1 {
            font-size: 32px;
            font-weight: 700;
            color: #166534;
            margin-bottom: 8px;
        }

        .home-header p {
            font-size: 14px;
            color: #4b5563;
            font-weight: 500;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 28px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(34, 197, 94, 0.2);
            border-radius: 20px;
            padding: 18px;
            text-align: center;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .stat-card:hover {
            background: rgba(255, 255, 255, 0.9);
            border-color: rgba(34, 197, 94, 0.4);
            transform: translateY(-4px);
        }

        .stat-value {
            font-size: 24px;
            font-weight: 700;
            color: #22c55e;
            margin-bottom: 4px;
        }

        .stat-label {
            font-size: 12px;
            color: #6b7280;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .recent-section h2 {
            font-size: 16px;
            font-weight: 600;
            color: #166534;
            margin-bottom: 12px;
        }

        .meal-item {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(34, 197, 94, 0.15);
            border-radius: 16px;
            padding: 12px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
        }

        .meal-item:hover {
            background: rgba(255, 255, 255, 0.7);
            border-color: rgba(34, 197, 94, 0.3);
        }

        .meal-info {
            flex: 1;
        }

        .meal-name {
            font-size: 14px;
            font-weight: 600;
            color: #1f2937;
        }

        .meal-cal {
            font-size: 12px;
            color: #6b7280;
            margin-top: 2px;
        }

        .meal-cals {
            font-size: 14px;
            font-weight: 700;
            color: #22c55e;
        }

        /* Log Screen */
        .form-group {
            margin-bottom: 18px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #166534;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid rgba(34, 197, 94, 0.2);
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(10px);
            border-radius: 14px;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            color: #1f2937;
            transition: all 0.3s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: rgba(34, 197, 94, 0.5);
            background: rgba(255, 255, 255, 0.9);
            box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.1);
        }

        .form-input::placeholder {
            color: #9ca3af;
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #22c55e 0%, #84cc16 100%);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 8px 24px rgba(34, 197, 94, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(34, 197, 94, 0.4);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        /* Analysis Screen */
        .chart-container {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(34, 197, 94, 0.15);
            border-radius: 20px;
            padding: 18px;
            margin-bottom: 20px;
        }

        .chart-title {
            font-size: 14px;
            font-weight: 600;
            color: #166534;
            margin-bottom: 14px;
        }

        .macro-bar {
            margin-bottom: 14px;
        }

        .macro-label {
            font-size: 12px;
            font-weight: 600;
            color: #4b5563;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
        }

        .macro-progress {
            width: 100%;
            height: 8px;
            background: rgba(34, 197, 94, 0.1);
            border-radius: 4px;
            overflow: hidden;
        }

        .macro-fill {
            height: 100%;
            background: linear-gradient(90deg, #22c55e 0%, #84cc16 100%);
            border-radius: 4px;
            transition: width 0.5s ease;
        }

        /* Recommendations Screen */
        .recommendation-card {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(34, 197, 94, 0.15);
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 12px;
            transition: all 0.3s ease;
        }

        .recommendation-card:hover {
            background: rgba(255, 255, 255, 0.8);
            border-color: rgba(34, 197, 94, 0.3);
            transform: translateX(4px);
        }

        .rec-title {
            font-size: 14px;
            font-weight: 600;
            color: #166534;
            margin-bottom: 6px;
        }

        .rec-text {
            font-size: 13px;
            color: #4b5563;
            line-height: 1.5;
        }

        /* Settings Screen */
        .settings-group {
            margin-bottom: 24px;
        }

        .settings-title {
            font-size: 12px;
            font-weight: 700;
            color: #166534;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
        }

        .setting-item {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(34, 197, 94, 0.15);
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .setting-label {
            font-size: 14px;
            font-weight: 500;
            color: #1f2937;
        }

        .toggle {
            width: 44px;
            height: 26px;
            background: rgba(34, 197, 94, 0.2);
            border-radius: 13px;
            position: relative;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
        }

        .toggle.active {
            background: #22c55e;
        }

        .toggle::after {
            content: '';
            position: absolute;
            width: 22px;
            height: 22px;
            background: white;
            border-radius: 50%;
            top: 2px;
            left: 2px;
            transition: all 0.3s ease;
        }

        .toggle.active::after {
            left: 20px;
        }

        /* Navigation Dots */
        .nav-dots {
            display: flex;
            justify-content: center;
            gap: 8px;
            padding: 16px;
            background: rgba(255, 255, 255, 0.3);
            border-top: 1px solid rgba(34, 197, 94, 0.1);
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(34, 197, 94, 0.3);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .dot.active {
            background: #22c55e;
            width: 24px;
            border-radius: 4px;
        }

        /* TTS Controls */
        .tts-button {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.2);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: all 0.3s ease;
        }

        .tts-button:hover {
            background: rgba(34, 197, 94, 0.2);
            border-color: rgba(34, 197, 94, 0.4);
        }

        .tts-button.playing {
            background: #22c55e;
            color: white;
            animation: pulse 1s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.4);
            }
            50% {
                box-shadow: 0 0 0 8px rgba(34, 197, 94, 0);
            }
        }

        .screen h2 {
            font-size: 24px;
            font-weight: 700;
            color: #166534;
            margin-bottom: 24px;
        }

        .screen h3 {
            font-size: 18px;
            font-weight: 600;
            color: #166534;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="carousel" id="carousel">
            <!-- Home Screen -->
            <div class="screen home-screen">
                <div class="home-header">
                    <h1>NutriAI</h1>
                    <p>Your AI-powered nutrition companion</p>
                </div>

                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-value" id="todayCalories">0</div>
                        <div class="stat-label">Today</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="weekAvg">0</div>
                        <div class="stat-label">Week Avg</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="proteinCount">0g</div>
                        <div class="stat-label">Protein</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="waterCount">0L</div>
                        <div class="stat-label">Water</div>
                    </div>
                </div>

                <div class="recent-section">
                    <h2>Recent Meals</h2>
                    <div id="recentMeals"></div>
                </div>
            </div>

            <!-- Log Meal Screen -->
            <div class="screen log-screen">
                <h2>Log Meal</h2>

                <div class="form-group">
                    <label class="form-label">Meal Type</label>
                    <select class="form-input" id="mealType">
                        <option>Breakfast</option>
                        <option>Lunch</option>
                        <option>Dinner</option>
                        <option>Snack</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">Food Description</label>
                    <input type="text" class="form-input" id="foodDesc" placeholder="e.g., Grilled chicken breast with rice">
                </div>

                <div class="form-group">
                    <label class="form-label">Serving Size (grams)</label>
                    <input type="number" class="form-input" id="servingSize" placeholder="150">
                </div>

                <div class="form-group">
                    <label class="form-label">Estimated Calories</label>
                    <input type="number" class="form-input" id="calories" placeholder="250">
                </div>

                <div class="form-group">
                    <label class="form-label">Protein (g)</label>
                    <input type="number" class="form-input" id="protein" placeholder="30">
                </div>

                <button class="btn-primary" onclick="logMeal()">Log Meal</button>
            </div>

            <!-- Analysis Screen -->
            <div class="screen analysis-screen">
                <h2>Analysis</h2>

                <div class="chart-container">
                    <div class="chart-title">Macronutrient Breakdown</div>

                    <div class="macro-bar">
                        <div class="macro-label">
                            <span>Protein</span>
                            <span id="proteinPct">0%</span>
                        </div>
                        <div class="macro-progress">
                            <div class="macro-fill" id="proteinBar" style="width: 0%"></div>
                        </div>
                    </div>

                    <div class="macro-bar">
                        <div class="macro-label">
                            <span>Carbs</span>
                            <span id="carbsPct">0%</span>
                        </div>
                        <div class="macro-progress">
                            <div class="macro-fill" id="carbsBar" style="width: 0%"></div>
                        </div>
                    </div>

                    <div class="macro-bar">
                        <div class="macro-label">
                            <span>Fats</span>
                            <span id="fatsPct">0%</span>
                        </div>
                        <div class="macro-progress">
                            <div class="macro-fill" id="fatsBar" style="width: 0%"></div>
                        </div>
                    </div>
                </div>

                <div class="chart-container">
                    <div class="chart-title">Insights</div>
                    <div id="insights"></div>
                </div>
            </div>

            <!-- Recommendations Screen -->
            <div class="screen recommendations-screen">
                <h2>Recommendations</h2>
                <div id="recommendations"></div>
            </div>

            <!-- Settings Screen -->
            <div class="screen settings-screen">
                <h2>Settings</h2>

                <div class="settings-group">
                    <div class="settings-title">Voice & Audio</div>
                    <div class="setting-item">
                        <span class="setting-label">ElevenLabs API Key</span>
                    </div>
                    <input type="password" class="form-input" id="elevenLabsKey" placeholder="Enter your ElevenLabs API key" style="margin-bottom: 12px;">
                    <div class="setting-item">
                        <span class="setting-label">AI Voice Guidance</span>
                        <button class="toggle active" onclick="toggleSetting(this)"></button>
                    </div>
                </div>

                <div class="settings-group">
                    <div class="settings-title">Daily Goals</div>
                    <div class="form-group">
                        <label class="form-label">Calorie Target</label>
                        <input type="number" class="form-input" id="calorieTarget" placeholder="2000" value="2000">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Protein Target (g)</label>
                        <input type="number" class="form-input" id="proteinTarget" placeholder="150" value="150">
                    </div>
                </div>

                <div class="settings-group">
                    <div class="settings-title">Data</div>
                    <button class="btn-primary" onclick="exportData()">Export Logs</button>
                </div>
            </div>
        </div>

        <div class="nav-dots" id="navDots"></div>
    </div>

    <script>
        const carousel = document.getElementById('carousel');
        const navDots = document.getElementById('navDots');
        const screens = document.querySelectorAll('.screen');
        let currentScreen = 0;
        let touchStartX = 0;
        let touchEndX = 0;

        // Initialize navigation dots
        screens.forEach((_, idx) => {
            const dot = document.createElement('div');
            dot.className = `dot ${idx === 0 ? 'active' : ''}`;
            dot.onclick = () => scrollToScreen(idx);
            navDots.appendChild(dot);
        });

        function updateActiveDot() {
            const scrollPos = carousel.scrollLeft;
            const screenWidth = carousel.offsetWidth;
            currentScreen = Math.round(scrollPos / screenWidth);

            document.querySelectorAll('.dot').forEach((dot, idx) => {
                dot.classList.toggle('active', idx === currentScreen);
            });
        }

        function scrollToScreen(index) {
            const screenWidth = carousel.offsetWidth;
            carousel.scrollTo({
                left: index * screenWidth,
                behavior: 'smooth'
            });
        }

        carousel.addEventListener('scroll', updateActiveDot);
        carousel.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
        });
        carousel.addEventListener('touchend', (e) => {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        });

        function handleSwipe() {
            const diff = touchStartX - touchEndX;
            if (Math.abs(diff) > 50) {
                if (diff > 0 && currentScreen < screens.length - 1) {
                    scrollToScreen(currentScreen + 1);
                } else if (diff < 0 && currentScreen > 0) {
                    scrollToScreen(currentScreen - 1);
                }
            }
        }

        // Data Management
        let mealsData = JSON.parse(localStorage.getItem('nutriaiMeals')) || [];

        function logMeal() {
            const meal = {
                type: document.getElementById('mealType').value,
                food: document.getElementById('foodDesc').value,
                servingSize: document.getElementById('servingSize').value,
                calories: parseInt(document.getElementById('calories').value) || 0,
                protein: parseInt(document.getElementById('protein').value) || 0,
                timestamp: new Date().toISOString()
            };

            if (!meal.food || !meal.calories) {
                alert('Please fill in food description and calories');
                return;
            }

            mealsData.push(meal);
            localStorage.setItem('nutriaiMeals', JSON.stringify(mealsData));

            document.getElementById('foodDesc').value = '';
            document.getElementById('servingSize').value = '';
            document.getElementById('calories').value = '';
            document.getElementById('protein').value = '';

            updateDashboard();
            speakGuidance(`Logged ${meal.food} with ${meal.calories} calories. Great job tracking your nutrition!`);
        }

        function updateDashboard() {
            const today = new Date().toDateString();
            const todayMeals = mealsData.filter(m => new Date(m.timestamp).toDateString() === today);

            const totalCals = todayMeals.reduce((sum, m) => sum + m.calories, 0);
            const totalProtein = todayMeals.reduce((sum, m) => sum + m.protein, 0);

            document.getElementById('todayCalories').textContent = totalCals;
            document.getElementById('proteinCount').textContent = totalProtein + 'g';

            const last7Days = mealsData.filter(m => {
                const mealDate = new Date(m.timestamp);
                const daysDiff = (new Date() - mealDate) / (1000 * 60 * 60 * 24);
                return daysDiff <= 7;
            });

            const avgCals = last7Days.length > 0 ? Math.round(last7Days.reduce((sum, m) => sum + m.calories, 0) / 7) : 0;
            document.getElementById('weekAvg').textContent = avgCals;

            // Recent meals
            const recentMealsHtml = todayMeals.slice(-3).reverse().map(m => `
                <div class="meal-item">
                    <div class="meal-info">
                        <div class="meal-name">${m.food}</div>
                        <div class="meal-cal">${m.type} • ${m.servingSize}g</div>
                    </div>
                    <div class="meal-cals">${m.calories}</div>
                </div>
            `).join('');
            document.getElementById('recentMeals').innerHTML = recentMealsHtml || '<div class="meal-item" style="opacity: 0.5;">No meals logged today</div>';

            // Analysis
            updateAnalysis(todayMeals);
            updateRecommendations(todayMeals);
        }

        function updateAnalysis(meals) {
            const totalCalories = meals.reduce((sum, m) => sum + m.calories, 0);
            const totalProtein = meals.reduce((sum, m) => sum + m.protein, 0);

            const proteinPct = Math.min(100, Math.round((totalProtein * 4 / totalCalories) * 100)) || 0;
            const carbsPct = Math.min(100, 50);
            const fatsPct = Math.min(100, 30);

            document.getElementById('proteinPct').textContent = proteinPct + '%';
            document.getElementById('carbsPct').textContent = carbsPct + '%';
            document.getElementById('fatsPct').textContent = fatsPct + '%';

            document.getElementById('proteinBar').style.width = proteinPct + '%';
            document.getElementById('carbsBar').style.width = carbsPct + '%';
            document.getElementById('fatsBar').style.width = fatsPct + '%';

            const insightsHtml = `
                <div style="font-size: 13px; color: #4b5563; line-height: 1.6;">
                    <p>You've consumed <strong>${totalCalories}</strong> calories today with <strong>${totalProtein}g</strong> protein.</p>
                    <p style="margin-top: 8px;">${totalProtein >= 100 ? '✓ Great protein intake!' : '⚠ Consider adding more protein sources.'}</p>
                </div>
            `;
            document.getElementById('insights').innerHTML = insightsHtml;
        }

        function updateRecommendations(meals) {
            const recommendations = [
                { title: '💧 Hydration', text: 'Drink at least 8 glasses of water daily. Track your hydration alongside meals.' },
                { title: '🥗 Balanced Meals', text: 'Aim for meals with protein, healthy fats, and complex carbs.' },
                { title: '⏰ Meal Timing', text: 'Space meals 3-4 hours apart for optimal digestion and energy.' },
                { title: '🍎 Whole Foods', text: 'Choose whole grains, lean proteins, and fresh vegetables when possible.' }
            ];

            const html = recommendations.map(r => `
                <div class="recommendation-card">
                    <div class="rec-title">${r.title}</div>
                    <div class="rec-text">${r.text}</div>
                </div>
            `).join('');
            document.getElementById('recommendations').innerHTML = html;
        }

        function toggleSetting(btn) {
            btn.classList.toggle('active');
        }

        async function speakGuidance(text) {
            const apiKey = document.getElementById('elevenLabsKey').value;
            if (!apiKey) {
                console.log('Speak:', text);
                return;
            }

            try {
                const response = await fetch('https://api.elevenlabs.io/v1/text-to-speech/21m00Tcm4TlvDq8ikWAM', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'xi-api-key': apiKey
                    },
                    body: JSON.stringify({
                        text: text,
                        model_id: 'eleven_monolingual_v1',
                        voice_settings: {
                            stability: 0.5,
                            similarity_boost: 0.75
                        }
                    })
                });

                if (response.ok) {
                    const audio = await response.blob();
                    const url = URL.createObjectURL(audio);
                    const audioElement = new Audio(url);
                    audioElement.play();
                }
            } catch (error) {
                console.error('TTS Error:', error);
            }
        }

        function exportData() {
            const csv = mealsData.map(m => `${m.timestamp},${m.type},${m.food},${m.calories},${m.protein}`).join('\n');
            const blob = new Blob(['timestamp,type,food,calories,protein\n' + csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'nutriai-logs.csv';
            a.click();
        }

        // Initialize
        updateDashboard();
    </script>
</body>
</html>
