<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Builder — Daily lessons for creators</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1c1810 0%, #3d2817 100%);
            color: #f1f5f9;
            min-height: 100vh;
            padding: 16px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            padding: 24px 0 16px;
            border-bottom: 1px solid rgba(217, 119, 6, 0.3);
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(90deg, #fca5a5, #f97316);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            font-size: 14px;
            color: #fed7aa;
        }

        #onboard {
            animation: fadeIn 0.4s ease-out;
        }

        .onboard-content {
            text-align: center;
        }

        .onboard-content h2 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 16px;
            color: #fed7aa;
        }

        .onboard-content p {
            font-size: 15px;
            line-height: 1.6;
            color: #fca5a5;
            margin-bottom: 24px;
        }

        .track-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 12px;
        }

        .track-btn {
            padding: 16px 12px;
            border: 2px solid rgba(217, 119, 6, 0.6);
            background: rgba(28, 24, 16, 0.5);
            color: #fca5a5;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .track-btn:hover {
            border-color: #fed7aa;
            background: rgba(61, 40, 23, 0.3);
            color: #fed7aa;
        }

        #styleCard {
            display: none;
            margin-top: 20px;
            padding: 20px;
            background: rgba(61, 40, 23, 0.2);
            border: 1px solid rgba(252, 165, 165, 0.3);
            border-radius: 12px;
            animation: slideDown 0.4s ease-out;
        }

        .style-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 16px;
        }

        .style-opt {
            padding: 12px;
            border: 2px solid rgba(217, 119, 6, 0.6);
            background: rgba(28, 24, 16, 0.5);
            color: #fca5a5;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .style-opt:hover {
            border-color: #fed7aa;
            background: rgba(61, 40, 23, 0.3);
            color: #fed7aa;
        }

        #lessonView {
            display: none;
            animation: fadeIn 0.4s ease-out;
        }

        .lesson-content {
            background: rgba(61, 40, 23, 0.15);
            border: 1px solid rgba(252, 165, 165, 0.2);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
        }

        .lesson-title {
            font-size: 22px;
            font-weight: 700;
            color: #fed7aa;
            margin-bottom: 16px;
            line-height: 1.3;
        }

        .lesson-body {
            font-size: 15px;
            line-height: 1.7;
            color: #fca5a5;
            margin-bottom: 20px;
        }

        .lesson-body p {
            margin-bottom: 12px;
        }

        .lesson-affirmation {
            padding: 16px;
            background: rgba(252, 165, 165, 0.1);
            border-left: 4px solid #fca5a5;
            border-radius: 4px;
            font-style: italic;
            color: #fca5a5;
            font-size: 14px;
            margin-bottom: 16px;
        }

        .lesson-strength {
            display: inline-block;
            padding: 8px 12px;
            background: rgba(252, 165, 165, 0.2);
            color: #fca5a5;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }

        .controls {
            display: flex;
            gap: 12px;
            margin-top: 24px;
            flex-wrap: wrap;
        }

        .btn {
            flex: 1;
            min-width: 100px;
            padding: 12px 16px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: linear-gradient(90deg, #fca5a5, #f97316);
            color: #1c1810;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(252, 165, 165, 0.3);
        }

        .btn-secondary {
            background: rgba(217, 119, 6, 0.4);
            color: #fca5a5;
            border: 1px solid rgba(252, 165, 165, 0.3);
        }

        .btn-secondary:hover {
            border-color: #fed7aa;
            color: #fed7aa;
        }

        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            font-size: 13px;
            color: #d4937b;
            flex-wrap: wrap;
            gap: 12px;
        }

        .streak {
            font-weight: 600;
            color: #fca5a5;
        }

        #celebrate {
            display: none;
            text-align: center;
            padding: 40px 20px;
            animation: scaleIn 0.5s ease-out;
        }

        .celebrate-emoji {
            font-size: 60px;
            margin-bottom: 16px;
        }

        .celebrate-text {
            font-size: 24px;
            font-weight: 700;
            color: #fca5a5;
            margin-bottom: 24px;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .next-btn {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Product Builder</h1>
            <p>One lesson a day for building products</p>
        </div>

        <div id="onboard">
            <div class="onboard-content">
                <h2>What's your product journey?</h2>
                <p>Where are you in building?</p>
                <div class="track-buttons">
                    <button class="track-btn" onclick="selectTrack('idea')">💡 Idea</button>
                    <button class="track-btn" onclick="selectTrack('build')">⚒️ Build</button>
                    <button class="track-btn" onclick="selectTrack('launch')">🚀 Launch</button>
                    <button class="track-btn" onclick="selectTrack('scale')">📈 Scale</button>
                </div>
            </div>
            <div id="styleCard">
                <p style="margin-bottom: 12px; font-size: 14px; color: #fca5a5;">What matters most?</p>
                <div class="style-options">
                    <button class="style-opt" onclick="selectStyle('validation')">Validation</button>
                    <button class="style-opt" onclick="selectStyle('execution')">Execution</button>
                    <button class="style-opt" onclick="selectStyle('business')">Business</button>
                    <button class="style-opt" onclick="selectStyle('mindset')">Mindset</button>
                </div>
            </div>
        </div>

        <div id="lessonView">
            <div class="lesson-content">
                <div class="lesson-title" id="lessonTitle"></div>
                <div class="lesson-body" id="lessonBody"></div>
                <div class="lesson-affirmation" id="lessonAffirmation"></div>
                <div class="lesson-strength" id="lessonStrength"></div>
            </div>

            <div class="controls">
                <button class="btn btn-primary" onclick="speak()">🔊 Read aloud</button>
                <button class="btn btn-secondary" onclick="nextLesson()">Next →</button>
                <button class="btn btn-secondary" onclick="markDone()">✓ Done</button>
            </div>

            <div class="footer">
                <div id="progress"></div>
                <div><span class="streak" id="streak"></span></div>
            </div>
        </div>

        <div id="celebrate">
            <div class="celebrate-emoji">🎉</div>
            <div class="celebrate-text">Building your empire</div>
            <p style="color: #fca5a5; margin-bottom: 24px;">One day closer to launch. Come back tomorrow.</p>
            <button class="btn btn-primary" onclick="resetView()">Back to start</button>
        </div>
    </div>

    <script>
        const lessons = [
            {t:"The product people want is inside the problem they have",b:["Don't start with the product. Start with the problem. Who has it? How much does it cost them? Are they desperate to solve it?","The best products exist because someone was frustrated and built the solution.","Today's tiny step: name one problem you experience weekly. Who else experiences it? Would they pay to solve it?"],a:"Problems are your market research.",s:"Problem obsession"},
            {t:"Your first version doesn't need to be perfect",b:["The trap is building in secret until it's perfect. By then, 6 months have passed and you haven't validated anything.","Build fast. Show people. Listen. Iterate. This feedback loop is your actual R&D.","Today's tiny step: what's the absolute minimum version of your product that solves the core problem? Build that first."],a:"Done is better than perfect.",s:"MVP thinking"},
            {t:"Validation is talking to 10 people who'd pay",b:["You don't need 1000 people interested. You need 10 people who'd actually pay for the solution and are willing to be early adopters.","Talking to 10 real people beats a thousand survey responses.","Today's tiny step: find 3 people who experience your target problem. Have a real conversation. Ask if they'd pay."],a:"Conversation beats assumption.",s:"Validation priority"},
            {t:"Your idea is worthless—execution is everything",b:["Everyone has ideas. 99% of people never build them. The 1% who build average products and ship beat the 99% with brilliant ideas who don't start.","The best founders often started with mediocre ideas and iterated them into gold through execution.","Today's tiny step: stop planning. Start building. Anything."],a:"Building beats theorizing.",s:"Execution over ideation"},
            {t:"Price your product like it matters",b:["Underpricing your product isn't helping people—it's insulting them. It says 'this isn't worth much.' It also means you can't afford to help them well.","The right price attracts the right customers (people who value what you're building) and repels the wrong ones (people who just want cheap).","Today's tiny step: what would a premium version of your product cost? That's closer to the right price than you think."],a:"Price signals value.",s:"Pricing psychology"},
            {t:"Burnout is a business failure, not a life problem",b:["If you're burning out while building, your business model is broken. You can't sustain it. You won't last long enough to succeed.","The businesses that last are built by people who protect their energy.","Today's tiny step: what's unsustainable in your current build? Fix it now, before launch."],a:"Sustainability is a feature, not a luxury.",s:"Sustainable building"},
            {t:"Your story is your marketing",b:["The best product launches aren't about features. They're about why you built it. What problem moved you so much that you built the solution?","People don't buy products. They buy stories. They buy the person behind the product.","Today's tiny step: write your origin story in 3 sentences. Why did you actually start this?"],a:"Authenticity is your unfair advantage.",s:"Story power"},
            {t:"Your early customers aren't your market",b:["Your first 100 customers are disproportionately obsessive about what you're building. They're not representative of the mass market.","But they're invaluable for feedback. Listen to them. Learn from them. But don't try to scale to the mass market using their preferences.","Today's tiny step: who are your ideal first 100 customers? Make sure you understand they're different from your long-term market."],a:"Early adopters are your research lab.",s:"Customer understanding"},
            {t:"Free users aren't your business—paying users are",b:["The temptation is to get everyone on the free tier and worry about monetization later. By then, conversion is hard.","Offer free, but design it to make paying obvious. Make paid the path to the real solution.","Today's tiny step: design your free tier to point people toward the paid tier. What's the natural upgrade?"],a:"Free is a marketing tool, not a business model.",s:"Monetization clarity"},
            {t:"Launch before you're ready",b:["No amount of internal perfecting prepares you for real-world feedback. Launch with 70% certainty, not 100%.","The moment you launch, you learn things you can never learn in private.","Today's tiny step: what's stopping you from launching right now? If it's perfectionism, ignore it. Launch anyway."],a:"Perfect timing is a myth. Launch anyway.",s:"Launch courage"},
            {t:"Your customers will tell you what they want",b:["You don't need to guess. You don't need to survey. Just watch what they do and ask directly.","The customers who love your product will tell you how to make it better. The ones who leave will tell you what you got wrong.","Today's tiny step: after each customer interaction, ask: what are they really trying to do? What's the real problem?"],a:"Listen more than you plan.",s:"Customer listening"},
            {t:"Distribution is harder than building",b:["You can build the perfect product and no one will know. Getting people to notice is the real challenge.","The best founders spend as much time on distribution as on the product.","Today's tiny step: where are your ideal customers right now? (Online communities, subreddits, Discord servers, Twitter lists, etc.) That's your launch distribution."],a:"A brilliant product nobody knows about is worthless.",s:"Distribution focus"},
            {t:"Paid feedback is better than free",b:["If someone pays for your product, they've already decided it's valuable. That decision changes how they engage.","Free users will complain about issues paying users will tolerate because they've invested.","Today's tiny step: what's the earliest you can ask for payment? Even a small amount changes everything."],a:"Payment signals commitment.",s:"Paid traction"},
            {t:"Your competition validates the market",b:["If there's no competition, the market probably doesn't exist or isn't desperate enough to pay.","Your competition proves people will pay for solutions to this problem.","Today's tiny step: study your 3 closest competitors. What are they doing right? What are they getting wrong?"],a:"Competition is proof the market is real.",s:"Competitive thinking"},
            {t:"Simplicity compounds faster than features",b:["The temptation is to add features to satisfy every possible use case. This slows you down and confuses customers.","The fastest path to dominating a market is solving one problem incredibly well, not solving many problems okay.","Today's tiny step: what's the core feature? What's everything else? Cut the everything else for the MVP."],a:"Focus beats feature creep.",s:"Simplicity power"},
            {t:"Your authenticity is your brand",b:["In a sea of polished, corporate product launches, authenticity stands out.","The founders who win are the ones who are honest: about their journey, their struggles, their vision.","Today's tiny step: get uncomfortable. Share something real about your journey that you normally wouldn't."],a:"Real beats perfect.",s:"Authentic branding"},
            {t:"Systems scale, not your time",b:["If your business requires you to personally do everything, it doesn't scale.","Build processes, hire help, create leverage. Your job is to build the systems that run the business.","Today's tiny step: what do you do every day that you could document so someone else could do it?"],a:"Leverage is how you scale.",s:"System thinking"},
            {t:"Your failures are your best data",b:["Every product that failed is data. What went wrong? Why didn't it work? What did you learn?","The founders who've failed multiple times are often smarter than first-time winners because they've learned so much.","Today's tiny step: what's your biggest past failure? What did it teach you? Apply that lesson here."],a:"Failure is education.",s:"Learning from loss"},
            {t:"Monetization starts on day 1, not day 100",b:["Don't build for free and worry about money later. Design from the beginning: who pays, what they pay, when they pay.","The habits you establish early stick. If you're used to giving away your work, shifting to paid is hard.","Today's tiny step: decide: who will pay for this? How much? Design your product with that in mind."],a:"Business model is part of product design.",s:"Revenue clarity"},
            {t:"Your product is your best marketing",b:["The best marketing is making something so good that people tell their friends.","Referrals, word-of-mouth, organic growth—these come from products so good they sell themselves.","Today's tiny step: build something so good that you'd genuinely recommend it to a friend. That's your real marketing."],a:"Great products market themselves.",s:"Product-led growth"}
        ];

        const tracks = { idea: 0, build: 5, launch: 10, scale: 15 };

        let state = JSON.parse(localStorage.getItem('prodState')) || {
            track: null,
            style: null,
            done: [],
            lastDay: null,
            streak: 0,
            seen: {}
        };

        function selectTrack(t) {
            state.track = t;
            state.style = null;
            state.seen = {};
            document.getElementById('styleCard').style.display = 'block';
        }

        function selectStyle(s) {
            state.style = s;
            state.lastDay = new Date().toDateString();
            saveState();
            showLesson();
        }

        function saveState() {
            localStorage.setItem('prodState', JSON.stringify(state));
        }

        function getTrackIndex(offset) {
            const trackStart = tracks[state.track];
            let idx = trackStart + offset;
            while (state.done.includes(idx)) idx++;
            return idx < trackStart + 5 ? idx : trackStart + (Math.floor(Math.random() * 5));
        }

        function showLesson() {
            if (!state.track || !state.style) return;
            const offset = state.seen[state.track] ? (state.seen[state.track] + 1) % 5 : 0;
            const idx = getTrackIndex(offset);
            state.seen[state.track] = offset;
            const l = lessons[idx];
            document.getElementById('lessonTitle').textContent = l.t;
            document.getElementById('lessonBody').innerHTML = l.b.map(p => `<p>${p}</p>`).join('');
            document.getElementById('lessonAffirmation').textContent = l.a;
            document.getElementById('lessonStrength').textContent = l.s;
            updateUI();
        }

        function updateUI() {
            const today = new Date().toDateString();
            if (state.lastDay !== today) state.streak = 0;
            if (state.done.length > 0) {
                const lastDone = state.done[state.done.length - 1];
                if (new Date().toDateString() === state.lastDay) {
                    document.getElementById('onboard').style.display = 'none';
                    document.getElementById('celebrate').style.display = 'block';
                    document.getElementById('lessonView').style.display = 'none';
                } else {
                    document.getElementById('onboard').style.display = 'none';
                    document.getElementById('lessonView').style.display = 'block';
                    document.getElementById('celebrate').style.display = 'none';
                }
            } else {
                document.getElementById('onboard').style.display = 'block';
                document.getElementById('lessonView').style.display = 'none';
                document.getElementById('celebrate').style.display = 'none';
            }
            document.getElementById('progress').textContent = `${state.done.length} lesson${state.done.length !== 1 ? 's' : ''} done`;
            document.getElementById('streak').textContent = `💰 ${state.streak} day${state.streak !== 1 ? 's' : ''} here`;
        }

        function speak() {
            const title = document.getElementById('lessonTitle').textContent;
            const body = document.getElementById('lessonBody').innerText;
            const aff = document.getElementById('lessonAffirmation').textContent;
            speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(`${title}. ${body}. ${aff}`);
            u.rate = 0.90;
            speechSynthesis.speak(u);
        }

        function nextLesson() {
            showLesson();
        }

        function markDone() {
            const idx = lessons.findIndex(l => l.t === document.getElementById('lessonTitle').textContent);
            if (!state.done.includes(idx)) {
                state.done.push(idx);
                if (state.lastDay === new Date().toDateString()) state.streak++;
                state.lastDay = new Date().toDateString();
                saveState();
            }
            document.getElementById('onboard').style.display = 'none';
            document.getElementById('lessonView').style.display = 'none';
            document.getElementById('celebrate').style.display = 'block';
        }

        function resetView() {
            document.getElementById('celebrate').style.display = 'none';
            document.getElementById('onboard').style.display = 'block';
            state.track = null;
            state.style = null;
            saveState();
        }

        updateUI();
        if (state.track && state.style) showLesson();
    </script>
</body>
</html>
