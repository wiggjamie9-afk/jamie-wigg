<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192" role="img" aria-label="Buddy System">
  <defs>
    <linearGradient id="warm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>

  <!-- App background -->
  <rect width="192" height="192" rx="44" fill="#0b1120"/>

  <!-- Gradient companion disc -->
  <circle cx="96" cy="96" r="62" fill="url(#warm)"/>
  <circle cx="96" cy="96" r="62" fill="url(#glow)"/>

  <!-- Heart sitting above the smile, the "buddy" motif -->
  <path d="M96 74
           c-6.5 -11 -25 -8.5 -25 5
           c0 9 11 17 25 27
           c14 -10 25 -18 25 -27
           c0 -13.5 -18.5 -16 -25 -5 Z"
        fill="#0b1120" opacity="0.92"/>

  <!-- Warm smile -->
  <path d="M70 116 q26 24 52 0"
        fill="none" stroke="#0b1120" stroke-width="9"
        stroke-linecap="round" opacity="0.92" filter="url(#soft)"/>
</svg>
