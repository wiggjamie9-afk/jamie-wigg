<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Reminders: Never forget important moments">
    <meta name="theme-color" content="#EC4899">
    <title>Reminders – Stay on track</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        :root {
            --primary: #EC4899;
            --secondary: #06B6D4;
            --accent: #10B981;
            --bg-dark: #0F172A;
            --bg-light: #1E293B;
            --text-primary: #F1F5F9;
            --text-secondary: #CBD5E1;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { font-family: system-ui, sans-serif; background: var(--bg-dark); color: var(--text-primary); min-height: 100vh; }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .header {
            text-align: center;
            padding: 16px 0;
            border-bottom: 2px solid var(--primary);
        }

        .header h1 { font-size: 28px; margin-bottom: 4px; }

        .reminder-form {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 16px;
            background: var(--bg-light);
            border-radius: 8px;
            border: 2px solid var(--primary);
        }

        input, select {
            padding: 10px;
            background: #0F172A;
            color: var(--text-primary);
            border: 1px solid var(--secondary);
            border-radius: 6px;
            font-size: 14px;
            font-family: system-ui, sans-serif;
        }

        input::placeholder { color: var(--text-secondary); }
        input:focus, select:focus { outline: none; border-color: var(--primary); }

        button {
            padding: 12px 20px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:hover { opacity: 0.9; }

        .reminders-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .reminder-item {
            padding: 12px;
            background: var(--bg-light);
            border-left: 4px solid var(--secondary);
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
        }

        .reminder-content {
            flex: 1;
        }

        .reminder-title {
            font-weight: bold;
            margin-bottom: 4px;
            font-size: 14px;
        }

        .reminder-time {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .delete-btn {
            padding: 6px 10px;
            background: #EF4444;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
        }

        .delete-btn:hover { opacity: 0.9; }

        .empty-state {
            text-align: center;
            padding: 40px 16px;
            color: var(--text-secondary);
        }

        .due-soon {
            background: rgba(239, 68, 68, 0.1);
            border-left-color: #EF4444;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⏰ Reminders</h1>
        </div>

        <div class="reminder-form">
            <input type="text" id="reminderTitle" placeholder="What do you want to be reminded about?">
            <input type="datetime-local" id="reminderTime">
            <button onclick="addReminder()">Set Reminder</button>
        </div>

        <div id="remindersList" class="reminders-list"></div>
        <div id="emptyState" class="empty-state">
            <p>No reminders set yet. Create one to stay organized! 📅</p>
        </div>
    </div>

    <script>
        const appState = {
            reminders: JSON.parse(localStorage.getItem('reminders')) || [],

            save() {
                localStorage.setItem('reminders', JSON.stringify(this.reminders));
            }
        };

        function addReminder() {
            const title = document.getElementById('reminderTitle').value.trim();
            const time = document.getElementById('reminderTime').value;

            if (!title || !time) {
                showToast('Please fill in all fields', 'error');
                return;
            }

            const reminder = {
                id: Date.now(),
                title: title,
                time: time,
                created: new Date().toISOString()
            };

            appState.reminders.push(reminder);
            appState.reminders.sort((a, b) => new Date(a.time) - new Date(b.time));
            appState.save();

            document.getElementById('reminderTitle').value = '';
            document.getElementById('reminderTime').value = '';

            showToast('Reminder set! 🔔', 'success');
            render();
        }

        function deleteReminder(id) {
            appState.reminders = appState.reminders.filter(r => r.id !== id);
            appState.save();
            showToast('Reminder deleted', 'info');
            render();
        }

        function formatTime(dateString) {
            const date = new Date(dateString);
            return date.toLocaleString();
        }

        function isReminder(dateString) {
            const reminderDate = new Date(dateString);
            const now = new Date();
            const hoursDiff = (reminderDate - now) / (1000 * 60 * 60);
            return hoursDiff >= 0 && hoursDiff <= 24;
        }

        function render() {
            const list = document.getElementById('remindersList');
            const empty = document.getElementById('emptyState');

            if (appState.reminders.length === 0) {
                list.style.display = 'none';
                empty.style.display = 'block';
                return;
            }

            list.style.display = 'flex';
            empty.style.display = 'none';
            list.innerHTML = appState.reminders.map(reminder => `
                <div class="reminder-item ${isReminder(reminder.time) ? 'due-soon' : ''}">
                    <div class="reminder-content">
                        <div class="reminder-title">${reminder.title}</div>
                        <div class="reminder-time">${formatTime(reminder.time)}</div>
                    </div>
                    <button class="delete-btn" onclick="deleteReminder(${reminder.id})">Delete</button>
                </div>
            `).join('');
        }

        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            toast.style.cssText = `
                position: fixed;
                bottom: 20px;
                left: 50%;
                transform: translateX(-50%);
                padding: 12px 20px;
                background: ${type === 'success' ? '#10B981' : type === 'error' ? '#EF4444' : '#6366F1'};
                color: white;
                border-radius: 6px;
                font-size: 14px;
                z-index: 1000;
            `;
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        render();
    </script>
</body>
</html>
