<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relationship Lessons</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #c97066;
            --secondary: #9b7a9e;
            --accent: #f5dcd5;
            --dark: #2a2a2a;
            --light: #fafaf8;
            --success: #7da9a1;
        }

        html, body {
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--light);
            color: var(--dark);
        }

        body {
            display: flex;
            flex-direction: column;
        }

        /* LAYOUT WRAPPERS */
        .screen {
            display: none;
            flex: 1;
            overflow-y: auto;
        }

        .screen.active {
            display: flex;
            flex-direction: column;
        }

        /* ONBOARDING SCREEN */
        .onboarding {
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            text-align: center;
        }

        .onboarding h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            color: var(--primary);
            line-height: 1.2;
        }

        .onboarding .subtitle {
            font-size: 1.1rem;
            color: var(--secondary);
            margin-bottom: 3rem;
            font-weight: 500;
        }

        .track-grid {
            display: grid;
            gap: 1rem;
            margin-bottom: 2rem;
            width: 100%;
            max-width: 500px;
        }

        .track-button {
            padding: 1.5rem;
            border: none;
            border-radius: 12px;
            background: white;
            color: var(--dark);
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            text-align: left;
            transition: all 0.3s ease;
            border-left: 5px solid transparent;
            box-shadow: 0 2px 8px rgba(201, 112, 102, 0.1);
        }

        .track-button:active {
            transform: scale(0.98);
        }

        .track-button[data-track="communication"] {
            border-left-color: var(--primary);
        }

        .track-button[data-track="conflict"] {
            border-left-color: var(--secondary);
        }

        .track-button[data-track="intimacy"] {
            border-left-color: var(--primary);
        }

        .track-button[data-track="boundaries"] {
            border-left-color: var(--secondary);
        }

        .track-button:hover {
            box-shadow: 0 4px 16px rgba(201, 112, 102, 0.2);
            transform: translateY(-2px);
        }

        .track-label {
            display: block;
            font-size: 0.85rem;
            opacity: 0.7;
            margin-top: 0.3rem;
        }

        /* LESSON SCREEN */
        .lesson-screen {
            flex-direction: column;
        }

        .lesson-header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            padding: 2rem 1.5rem;
            position: relative;
        }

        .lesson-header button {
            position: absolute;
            top: 1rem;
            left: 1rem;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            font-size: 1.5rem;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .lesson-header button:active {
            background: rgba(255, 255, 255, 0.3);
        }

        .lesson-number {
            font-size: 0.9rem;
            opacity: 0.9;
            margin-bottom: 0.5rem;
        }

        .lesson-title {
            font-size: 1.8rem;
            font-weight: 700;
            line-height: 1.3;
            margin-bottom: 0.5rem;
        }

        .lesson-strength {
            font-size: 0.95rem;
            opacity: 0.95;
            font-weight: 500;
        }

        .lesson-content {
            flex: 1;
            padding: 2rem 1.5rem;
            overflow-y: auto;
        }

        .lesson-paragraph {
            font-size: 1.05rem;
            line-height: 1.7;
            margin-bottom: 1.5rem;
            color: var(--dark);
        }

        .lesson-affirmation {
            background: var(--accent);
            border-left: 4px solid var(--primary);
            padding: 1.5rem;
            margin: 2rem 0;
            border-radius: 8px;
            font-style: italic;
            font-size: 1.05rem;
            color: var(--dark);
            line-height: 1.6;
        }

        /* PROGRESS PANEL */
        .progress-panel {
            background: white;
            border-top: 1px solid #e0e0e0;
            padding: 1.5rem;
            display: flex;
            gap: 1rem;
            align-items: stretch;
        }

        .progress-bar {
            flex: 1;
            display: flex;
            gap: 0.3rem;
            align-items: center;
        }

        .progress-dot {
            flex: 1;
            height: 6px;
            background: #e0e0e0;
            border-radius: 3px;
            transition: all 0.3s ease;
        }

        .progress-dot.completed {
            background: var(--primary);
        }

        .progress-dot.current {
            background: var(--secondary);
            box-shadow: 0 0 8px rgba(155, 122, 158, 0.4);
        }

        .progress-count {
            font-size: 0.85rem;
            color: var(--secondary);
            font-weight: 600;
            white-space: nowrap;
            min-width: 50px;
            text-align: right;
        }

        .lesson-buttons {
            display: flex;
            gap: 0.8rem;
            margin-top: 1rem;
        }

        .lesson-button {
            flex: 1;
            padding: 1rem;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-prev {
            background: #f0f0f0;
            color: var(--dark);
        }

        .btn-prev:active {
            background: #e0e0e0;
        }

        .btn-prev:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-next {
            background: var(--primary);
            color: white;
        }

        .btn-next:active {
            transform: scale(0.98);
        }

        .btn-next.complete {
            background: var(--success);
        }

        /* CELEBRATIONS */
        .celebration {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.4);
            z-index: 1000;
            animation: fadeIn 0.3s ease;
        }

        .celebration.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .celebration-content {
            background: white;
            border-radius: 20px;
            padding: 3rem 2rem;
            text-align: center;
            max-width: 90%;
            animation: pop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes pop {
            0% { transform: scale(0.3) translateY(50px); opacity: 0; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }

        .celebration-emoji {
            font-size: 3rem;
            margin-bottom: 1rem;
            animation: bounce 0.6s ease 0.2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .celebration-text {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 1rem;
        }

        .celebration-subtext {
            font-size: 1rem;
            color: var(--secondary);
            margin-bottom: 2rem;
            font-weight: 500;
        }

        .celebration-streak {
            background: var(--accent);
            padding: 1rem;
            border-radius: 12px;
            margin-bottom: 1.5rem;
            font-weight: 600;
            color: var(--primary);
        }

        .celebration-close {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.8rem 2rem;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
        }

        .celebration-close:active {
            transform: scale(0.98);
        }

        /* HOME SCREEN (SUMMARY) */
        .home-header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            padding: 2rem 1.5rem;
        }

        .home-title {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .home-subtitle {
            font-size: 1rem;
            opacity: 0.95;
        }

        .home-content {
            flex: 1;
            padding: 1.5rem;
            overflow-y: auto;
        }

        .track-section {
            margin-bottom: 2rem;
        }

        .track-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .track-icon {
            font-size: 1.4rem;
        }

        .lesson-item {
            background: white;
            padding: 1.2rem;
            border-radius: 10px;
            margin-bottom: 0.8rem;
            cursor: pointer;
            transition: all 0.3s ease;
            border-left: 4px solid #e0e0e0;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.05);
        }

        .lesson-item.completed {
            border-left-color: var(--success);
            background: rgba(125, 169, 161, 0.05);
        }

        .lesson-item:active {
            transform: scale(0.98);
        }

        .lesson-item-title {
            font-weight: 600;
            font-size: 1rem;
            color: var(--dark);
            margin-bottom: 0.3rem;
        }

        .lesson-item-number {
            font-size: 0.85rem;
            color: var(--secondary);
        }

        .lesson-item-check {
            display: inline-block;
            width: 20px;
            height: 20px;
            background: var(--success);
            color: white;
            border-radius: 50%;
            text-align: center;
            line-height: 20px;
            font-size: 0.9rem;
            float: right;
        }

        .stats-panel {
            background: var(--accent);
            border-radius: 12px;
            padding: 1.5rem;
            text-align: center;
            margin-bottom: 2rem;
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--primary);
        }

        .stat-label {
            font-size: 0.95rem;
            color: var(--secondary);
            margin-top: 0.5rem;
        }

        /* AUDIO CONTROLS */
        .audio-controls {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            margin-top: 1.5rem;
            padding: 1rem;
            background: var(--accent);
            border-radius: 8px;
        }

        .audio-button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.7rem 1.2rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .audio-button:active {
            transform: scale(0.95);
        }

        .audio-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .playback-rate {
            font-size: 0.85rem;
            color: var(--secondary);
            font-weight: 600;
        }

        /* MOBILE ADJUSTMENTS */
        @media (max-width: 480px) {
            .onboarding h1 {
                font-size: 2rem;
            }

            .lesson-title {
                font-size: 1.5rem;
            }

            .lesson-paragraph {
                font-size: 1rem;
            }

            .celebration-content {
                padding: 2rem 1.5rem;
            }

            .track-grid {
                max-width: 100%;
            }
        }

        /* UTILITIES */
        .text-center {
            text-align: center;
        }

        .hidden {
            display: none !important;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border-width: 0;
        }
    </style>
</head>
<body>
    <!-- HOME SCREEN (SUMMARY) -->
    <div class="screen home-screen active">
        <div class="home-header">
            <div class="home-title">Relationship Lessons</div>
            <div class="home-subtitle">4 tracks, 20 lessons to deepen your connection</div>
        </div>
        <div class="home-content">
            <div class="stats-panel">
                <div class="stat-value" id="completed-count">0</div>
                <div class="stat-label">lessons completed</div>
            </div>

            <div class="track-section">
                <div class="track-title">
                    <span class="track-icon">💬</span>
                    <span>Communication</span>
                </div>
                <div id="communication-lessons"></div>
            </div>

            <div class="track-section">
                <div class="track-title">
                    <span class="track-icon">⚔️</span>
                    <span>Conflict</span>
                </div>
                <div id="conflict-lessons"></div>
            </div>

            <div class="track-section">
                <div class="track-title">
                    <span class="track-icon">🌹</span>
                    <span>Intimacy</span>
                </div>
                <div id="intimacy-lessons"></div>
            </div>

            <div class="track-section">
                <div class="track-title">
                    <span class="track-icon">🛡️</span>
                    <span>Boundaries</span>
                </div>
                <div id="boundaries-lessons"></div>
            </div>
        </div>
    </div>

    <!-- ONBOARDING SCREEN -->
    <div class="screen onboarding-screen">
        <h1>Build Deeper Connection</h1>
        <p class="subtitle">Choose a topic to start</p>
        <div class="track-grid">
            <button class="track-button" data-track="communication">
                <div>💬 Communication</div>
                <span class="track-label">5 lessons on being heard and understood</span>
            </button>
            <button class="track-button" data-track="conflict">
                <div>⚔️ Conflict</div>
                <span class="track-label">5 lessons on navigating disagreement</span>
            </button>
            <button class="track-button" data-track="intimacy">
                <div>🌹 Intimacy</div>
                <span class="track-label">5 lessons on vulnerability and closeness</span>
            </button>
            <button class="track-button" data-track="boundaries">
                <div>🛡️ Boundaries</div>
                <span class="track-label">5 lessons on protecting your peace</span>
            </button>
        </div>
    </div>

    <!-- LESSON SCREEN -->
    <div class="screen lesson-screen">
        <div class="lesson-header">
            <button id="back-button">←</button>
            <div class="lesson-number" id="lesson-number"></div>
            <div class="lesson-title" id="lesson-title"></div>
            <div class="lesson-strength" id="lesson-strength"></div>
        </div>
        <div class="lesson-content">
            <div id="lesson-body"></div>
            <div class="audio-controls">
                <button class="audio-button" id="read-button">🔊 Read Aloud</button>
                <button class="audio-button" id="stop-button" disabled>⏹ Stop</button>
                <span class="playback-rate">0.92x</span>
            </div>
        </div>
        <div class="progress-panel">
            <div class="progress-bar">
                <div id="progress-dots"></div>
            </div>
            <div class="progress-count" id="progress-count"></div>
            <div class="lesson-buttons" style="margin-top: 0; margin-left: 1rem;">
                <button class="lesson-button btn-prev" id="prev-button">← Back</button>
            </div>
        </div>
        <div class="lesson-buttons" style="flex-direction: column; padding: 0 1.5rem 1.5rem;">
            <button class="lesson-button btn-next" id="next-button">Next Lesson →</button>
        </div>
    </div>

    <!-- CELEBRATION POPUP -->
    <div class="celebration" id="celebration">
        <div class="celebration-content">
            <div class="celebration-emoji">✨</div>
            <div class="celebration-text">Lesson Complete!</div>
            <div class="celebration-subtext">You're building strength</div>
            <div class="celebration-streak">
                <span id="streak-display">Streak: 1 day</span>
            </div>
            <button class="celebration-close" id="celebrate-close">Keep Growing</button>
        </div>
    </div>

    <script>
        const LESSONS = {
            communication: [
                {
                    title: "Most fights are about feeling unseen",
                    strength: "Attunement",
                    body: `When couples argue about dishes left in the sink or a forgotten birthday, the real fight isn't about the object—it's about feeling seen, valued, and understood. Your nervous system is tracking whether you matter, whether you're noticed, whether your inner world registers with your partner. Learning to distinguish the content of conflict (the dishes) from the emotional need (recognition, care, partnership) transforms every interaction.

When you hear "you always leave a mess," translate it: "I feel like my needs don't matter to you. I feel unseen." When you can name this underneath the surface complaint, you move from defensiveness to connection. The dishes become secondary to the deeper question: Do I know that you see me?

This skill—recognizing when conflict is really about attunement—allows you to become fluent in your partner's inner world. You learn to pause, slow down, and ask: What are they really asking for right now? What do they need to feel seen?`,
                    affirmation: "I choose to see and be seen. When conflict arises, I pause to ask: what does my partner really need from me right now?"
                },
                {
                    title: "Words matter less than tone and presence",
                    strength: "Nervous System Safety",
                    body: `Your nervous system is a sensitive instrument. Before your rational mind processes the words coming out of your partner's mouth, your body has already registered: Is this voice safe? Is this person angry? Do I need to brace? Research in neuroscience shows that your partner's tone of voice, breathing, and posture communicate far more than the content of their words. A rushed apology with a tense jaw lands differently than a slower, embodied "I'm sorry."

This is why the same words spoken gently versus harshly have completely different effects. Your nervous system doesn't primarily process language—it processes safety. When you speak to your partner, you're not just delivering information; you're either calming or activating their system. A soft voice, an open face, a willingness to be present—these communicate love more clearly than perfect words ever could.

Learning to attune to your own nervous system first—to notice when you're defensive, activated, or braced—allows you to shift your tone and presence before you speak. This single skill—managing your own state so you can show up safely—changes everything about how your partner receives you.`,
                    affirmation: "I notice my own nervous system first. I slow down and bring presence and softness to my voice, knowing this is how I communicate love."
                },
                {
                    title: "Listening is an act of love",
                    strength: "Presence",
                    body: `Most conversations are not truly listened to—they're waited through. While your partner speaks, you're planning your response, formulating your defense, or already thinking about the next task. True listening is rare and sacred. It means quieting your own need to be right, your own story, your own agenda, and creating an inner space where your partner's experience can fully land.

Listening is an act of generosity. It says: Your experience matters. You matter. I'm not preparing to debate you; I'm here to understand you. When your partner feels truly listened to, their nervous system shifts. They relax. They soften. They become more capable of listening to you in return. This is the cycle of connection.

The practice: mirror back what you hear. "What I'm hearing is..." or "It sounds like you felt..." When your partner nods and says "Yes, that's it," they've been witnessed. In that moment, loneliness drops away. Try listening for three full minutes without interrupting, without planning your response, with genuine curiosity about their inner world. Notice what shifts in your connection.`,
                    affirmation: "I bring my full presence to listening. I choose to understand over being understood, knowing this deepens our bond."
                },
                {
                    title: "Repair attempts are everything",
                    strength: "Resilience",
                    body: `Here's what research on couples shows: conflict is inevitable. Every couple fights. The difference between couples that thrive and couples that struggle is not the absence of rupture—it's the presence of repair. Repair attempts are the small gestures, words, or actions you make to reconnect after disconnection. A gentle touch on the shoulder during tension. A text that says "I miss you." A laugh that breaks the ice.

Repair attempts are the humble apology, the softening, the willingness to try again. They're saying "I don't want to stay in this cold place with you. Can we find our way back?" The couples who succeed are the ones who keep trying to reconnect, even imperfectly, even awkwardly. A repair attempt might fail—your partner might not be ready—but the act of trying maintains the thread of connection.

Your nervous system needs to know: even when we disconnect, we can reconnect. This is the promise of repair. It's the difference between "we had a fight" (temporary rupture) and "we fight and we can't fix it" (permanent damage). Build the habit of reaching back toward your partner even when you're hurt, even when you're afraid. This is the muscle that sustains long-term love.`,
                    affirmation: "I practice repair. When disconnection happens, I gently reach toward my partner, trusting our ability to find our way back."
                },
                {
                    title: "Honesty without shame",
                    strength: "Vulnerability",
                    body: `Shame thrives in secrecy. The beliefs you're too afraid to voice, the desires you think are wrong, the struggles you hide—these create distance. Vulnerability, on the other hand, builds intimacy. When you share something true about yourself—your fears, your needs, your darkness—and your partner responds with openness rather than judgment, connection deepens exponentially.

Honesty without shame means telling the truth about what's really going on inside you. It means saying "I'm scared," "I need help," "I was wrong." It means acknowledging the parts of yourself you think are unlovable and discovering that your partner can love you anyway. This is how you move from performance to presence, from armor to authenticity.

The paradox: the very things you're most afraid to share are often what your partner most needs to hear. When you share your real struggle, your partner stops feeling alone with their own. Your vulnerability gives them permission to be vulnerable too. This is the alchemy of intimacy—the courageous truth that transforms disconnection into belonging.`,
                    affirmation: "I choose honesty over protection. I share my real self, my true feelings, knowing that vulnerability is where real love lives."
                }
            ],
            conflict: [
                {
                    title: "Conflict doesn't mean you're wrong for each other",
                    strength: "Trust",
                    body: `One of the most damaging myths about relationships is that couples who fight must not be right for each other. This belief creates catastrophizing: one argument, and suddenly you're questioning everything. But research is clear: all couples experience conflict. Healthy couples don't avoid disagreement—they navigate it well.

Conflict is information. It's a signal that something matters, that there's a difference in need or perspective that wants to be understood. A couple that never fights might be avoiding, numbing, or slowly building resentment. A couple that fights and stays connected is practicing intimacy through difference. They're saying: We have different experiences, and we're still choosing each other.

This shift—moving from "we fight, so we're incompatible" to "we fight, and we can work through this"—is transformative. It means you can disagree about money, parenting, sex, or time without losing faith in the relationship. It means conflict becomes a place where you deepen trust rather than erode it. The couples who succeed aren't those who never fight; they're the ones who believe they can survive the fight together.`,
                    affirmation: "I trust that conflict is part of our connection, not a sign we're wrong for each other. We can disagree and still belong together."
                },
                {
                    title: "The story you tell about conflict matters",
                    strength: "Perspective",
                    body: `The narrative you carry about your conflict patterns profoundly shapes your experience. If you tell yourself "We fight too much, we're always angry," your nervous system stays activated. You scan for evidence of more fighting. You interpret neutral moments as brewing conflict. But if you reframe to "We navigate differences, and we're learning how," something shifts.

Your story shapes your behavior. If you believe "We're always fighting," you'll fight more defensively, with less hope. If you believe "We can work through this," you'll fight with more openness, more willingness to understand. The same couple, with the same frequency of disagreement, experiences relationship very differently based on the narrative they hold.

Notice the story you're telling about your conflicts. Is it a story of incompatibility or a story of learning? Is it a story of permanent damage or temporary rupture? Your partner hears this story in your tone, your body, your choice to engage or withdraw. When you shift the narrative from "we're always fighting" to "we're learning to navigate our differences," you invite your partner into a different possibility.`,
                    affirmation: "I tell a story of resilience about our conflicts. We navigate differences, we learn, and we grow stronger together."
                },
                {
                    title: "Hurt feelings need time before solutions",
                    strength: "Compassion",
                    body: `One of the most common relationship mistakes is rushing to solutions before emotional wounds have been tended. Your partner is hurting, and your instinct is to fix it, to explain, to move forward. But the nervous system doesn't work that way. When someone is activated and hurt, their brain isn't yet ready for logic or problem-solving. What they need first is recognition that their pain is real.

There's a difference between emotional processing and practical problem-solving. When your partner says "I felt dismissed in that conversation," they don't need a dissertation on why they weren't dismissed. They need you to slow down and say: "I hear that you felt dismissed. That matters. Tell me more about what that was like." Only after they feel truly heard—only after the emotional sting has been acknowledged and tended—can you move together into solutions.

        const LESSONS_FLAT = [];
        Object.entries(LESSONS).forEach(([track, lessons]) => {
            lessons.forEach((lesson, idx) => {
                LESSONS_FLAT.push({
                    ...lesson,
                    track,
                    index: idx,
                    id: `${track}-${idx}`
                });
            });
        });

        // STATE
        let state = {
            currentScreen: 'home', // home, lesson
            selectedTrack: null,
            currentLessonIndex: 0,
            completed: new Set(),
            lastCompletedDate: localStorage.getItem('lastCompletedDate') || null,
            streak: parseInt(localStorage.getItem('streak') || '0'),
        };

        // LOAD STATE
        function loadState() {
            const saved = localStorage.getItem('relState');
            if (saved) {
                const parsed = JSON.parse(saved);
                state.completed = new Set(parsed.completed);
                state.streak = parsed.streak || 0;
                state.lastCompletedDate = parsed.lastCompletedDate || null;
            }
        }

        // SAVE STATE
        function saveState() {
            localStorage.setItem('relState', JSON.stringify({
                completed: Array.from(state.completed),
                streak: state.streak,
                lastCompletedDate: state.lastCompletedDate
            }));
        }

        // RENDER HOME
        function renderHome() {
            const tracks = ['communication', 'conflict', 'intimacy', 'boundaries'];
            const icons = { communication: '💬', conflict: '⚔️', intimacy: '🌹', boundaries: '🛡️' };

            document.getElementById('completed-count').textContent = state.completed.size;

            tracks.forEach(track => {
                const container = document.getElementById(`${track}-lessons`);
                const trackLessons = LESSONS[track];
                container.innerHTML = trackLessons.map((lesson, idx) => {
                    const lessonId = `${track}-${idx}`;
                    const isCompleted = state.completed.has(lessonId);
                    return `
                        <div class="lesson-item ${isCompleted ? 'completed' : ''}" onclick="startLesson('${track}', ${idx})">
                            <div class="lesson-item-title">${lesson.title}</div>
                            <div class="lesson-item-number">Lesson ${idx + 1} of 5${isCompleted ? ' <span class="lesson-item-check">✓</span>' : ''}</div>
                        </div>
                    `;
                }).join('');
            });
        }

        // START LESSON
        function startLesson(track, index) {
            state.selectedTrack = track;
            state.currentLessonIndex = index;
            state.currentScreen = 'lesson';
            renderLesson();
            showScreen('lesson');
        }

        // RENDER LESSON
        function renderLesson() {
            const lesson = LESSONS[state.selectedTrack][state.currentLessonIndex];
            const lessonNum = state.currentLessonIndex + 1;
            const lessonId = `${state.selectedTrack}-${state.currentLessonIndex}`;
            const isCompleted = state.completed.has(lessonId);

            document.getElementById('lesson-number').textContent = `Lesson ${lessonNum} of 5`;
            document.getElementById('lesson-title').textContent = lesson.title;
            document.getElementById('lesson-strength').textContent = `Strength: ${lesson.strength}`;

            const body = `
                ${lesson.body.split('\n\n').map(p => `<div class="lesson-paragraph">${p.trim()}</div>`).join('')}
                <div class="lesson-affirmation">"${lesson.affirmation}"</div>
            `;
            document.getElementById('lesson-body').innerHTML = body;

            // PROGRESS DOTS
            const dotsHTML = Array(5).fill(0).map((_, i) => {
                let cls = '';
                if (state.currentLessonIndex === i) cls = 'current';
                else if (i < state.currentLessonIndex) cls = 'completed';
                return `<div class="progress-dot ${cls}"></div>`;
            }).join('');
            document.getElementById('progress-dots').innerHTML = dotsHTML;
            document.getElementById('progress-count').textContent = `${lessonNum}/5`;

            // BUTTONS
            const prevBtn = document.getElementById('prev-button');
            const nextBtn = document.getElementById('next-button');
            prevBtn.disabled = lessonNum === 1;
            nextBtn.textContent = isCompleted ? '✓ Next Lesson →' : 'Mark Complete →';
            nextBtn.classList.toggle('complete', isCompleted);

            // AUDIO
            document.getElementById('read-button').onclick = () => readAloud(lesson.body + ' ' + lesson.affirmation);
            document.getElementById('stop-button').onclick = stopAudio;
        }

        // AUDIO
        let audioContext = null;

        function readAloud(text) {
            if ('speechSynthesis' in window) {
                stopAudio();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.rate = 0.92;
                utterance.pitch = 1;
                utterance.volume = 1;
                speechSynthesis.speak(utterance);
                document.getElementById('read-button').disabled = true;
                document.getElementById('stop-button').disabled = false;
                utterance.onend = () => {
                    document.getElementById('read-button').disabled = false;
                    document.getElementById('stop-button').disabled = true;
                };
            }
        }

        function stopAudio() {
            speechSynthesis.cancel();
            document.getElementById('read-button').disabled = false;
            document.getElementById('stop-button').disabled = true;
        }

        // NAVIGATION
        document.addEventListener('DOMContentLoaded', () => {
            loadState();

            // TRACK BUTTONS
            document.querySelectorAll('.track-button').forEach(btn => {
                btn.addEventListener('click', () => {
                    const track = btn.dataset.track;
                    startLesson(track, 0);
                    showScreen('lesson');
                });
            });

            // LESSON CONTROLS
            document.getElementById('back-button').addEventListener('click', () => {
                showScreen('home');
            });

            document.getElementById('prev-button').addEventListener('click', () => {
                if (state.currentLessonIndex > 0) {
                    state.currentLessonIndex--;
                    renderLesson();
                }
            });

            document.getElementById('next-button').addEventListener('click', () => {
                const lessonId = `${state.selectedTrack}-${state.currentLessonIndex}`;
                if (!state.completed.has(lessonId)) {
                    state.completed.add(lessonId);
                    updateStreak();
                    saveState();
                    showCelebration();
                    renderLesson();
                    renderHome();
                } else if (state.currentLessonIndex < 4) {
                    state.currentLessonIndex++;
                    renderLesson();
                }
            });

            document.getElementById('celebrate-close').addEventListener('click', () => {
                document.getElementById('celebration').classList.remove('active');
                if (state.currentLessonIndex < 4) {
                    state.currentLessonIndex++;
                    renderLesson();
                } else {
                    showScreen('home');
                }
            });

            renderHome();
        });

        function updateStreak() {
            const today = new Date().toDateString();
            const lastDate = state.lastCompletedDate ? new Date(state.lastCompletedDate).toDateString() : null;

            if (lastDate === today) {
                // Already completed today
            } else if (lastDate) {
                const yesterday = new Date();
                yesterday.setDate(yesterday.getDate() - 1);
                if (yesterday.toDateString() === lastDate) {
                    state.streak++;
                } else {
                    state.streak = 1;
                }
            } else {
                state.streak = 1;
            }
            state.lastCompletedDate = today;
        }

        function showCelebration() {
            const cel = document.getElementById('celebration');
            cel.classList.add('active');
            const streakText = state.streak === 1 ? '1 day' : `${state.streak} days`;
            document.getElementById('streak-display').textContent = `Streak: ${streakText} 🔥`;
        }

        function showScreen(name) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.querySelector(`.${name}-screen`).classList.add('active');
            state.currentScreen = name;
        }
    </script>
</body>
