<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#08050d">
    <title>LanguageLens - Visual Learning</title>
    <style>
        :root { --canvas:#08050d; --green:#00e887; --red:#ff1f5a; --cyan:#00d8ff; --purple:#7c3aed; --text:#fff; --text-muted:#aaa; }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:var(--canvas); color:var(--text); min-height:100vh; padding-bottom:80px; }
        .header { padding:20px; border-bottom:1px solid rgba(0,232,135,0.2); display:flex; justify-content:space-between; }
        h1 { font-size:24px; font-weight:700; }
        .badge { background:var(--green); color:var(--canvas); padding:4px 12px; border-radius:20px; font-size:11px; }
        .content { padding:20px; }
        .category-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin:15px 0; }
        .category-btn { background:rgba(0,232,135,0.1); border:1px solid rgba(0,232,135,0.2); color:var(--text); padding:15px; border-radius:8px; cursor:pointer; font-weight:600; text-align:center; }
        .category-btn:hover { background:rgba(0,232,135,0.2); }
        .vocab-card { background:rgba(0,232,135,0.05); border:1px solid rgba(0,232,135,0.2); border-radius:8px; padding:15px; margin:12px 0; text-align:center; }
        .vocab-emoji { font-size:48px; margin:10px 0; }
        .vocab-word { font-weight:600; color:var(--cyan); margin:10px 0; }
        .vocab-translation { color:var(--text-muted); font-size:12px; }
        .quiz-option { background:rgba(0,232,135,0.1); border:1px solid rgba(0,232,135,0.2); color:var(--text); padding:12px; margin:8px 0; border-radius:6px; cursor:pointer; text-align:left; }
        .quiz-option:hover { background:rgba(0,232,135,0.2); }
        .quiz-option.correct { background:rgba(0,232,135,0.5); border-color:var(--green); }
        .panel { display:none; }
        .panel.on { display:block; }
        .tabs { position:fixed; bottom:0; left:0; right:0; background:var(--canvas); border-top:1px solid rgba(0,232,135,0.2); display:flex; justify-content:space-around; height:70px; z-index:100; }
        .tab { flex:1; background:0; border:0; color:var(--text-muted); cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:12px; }
        .tab.on { color:var(--green); }
        .premium { background:rgba(124,58,237,0.1); border-left:3px solid var(--purple); padding:12px; margin-top:20px; border-radius:4px; font-size:13px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>👁️ LanguageLens</h1>
        <div class="badge">FREE</div>
    </div>
    <div class="content">
        <div id="learn" class="panel on">
            <div style="margin-bottom:15px">
                <select id="cat-select" style="width:100%;background:rgba(0,232,135,0.05);border:1px solid rgba(0,232,135,0.2);border-radius:6px;color:var(--text);padding:10px">
                    <option value="food">🍎 Food</option>
                    <option value="animals">🐕 Animals</option>
                    <option value="colors">🎨 Colors</option>
                    <option value="numbers">🔢 Numbers</option>
                </select>
            </div>
            <div id="vocab-list"></div>
            <div class="premium">💎 Premium: AR translations & 50+ categories</div>
        </div>
        
        <div id="quiz" class="panel">
            <div style="font-weight:600;margin-bottom:15px">What is this?</div>
            <div id="quiz-word" style="font-size:36px;margin:20px 0"></div>
            <div id="quiz-options"></div>
            <button onclick="nextQuiz()" style="background:var(--green);color:var(--canvas);border:0;padding:10px;border-radius:6px;cursor:pointer;font-weight:600;width:100%;margin-top:15px">Next →</button>
        </div>
    </div>
    <div class="tabs">
        <button class="tab on" data-p="learn">📚 Learn</button>
        <button class="tab" data-p="quiz">❓ Quiz</button>
    </div>
    <script>
        const vocab = {
            food: [{w:'Apple',t:'Pomme',e:'🍎'},{w:'Bread',t:'Pain',e:'🍞'},{w:'Cheese',t:'Fromage',e:'🧀'},{w:'Milk',t:'Lait',e:'🥛'}],
            animals: [{w:'Dog',t:'Chien',e:'🐕'},{w:'Cat',t:'Chat',e:'🐱'},{w:'Bird',t:'Oiseau',e:'🐦'},{w:'Fish',t:'Poisson',e:'🐠'}],
            colors: [{w:'Red',t:'Rouge',e:'🔴'},{w:'Blue',t:'Bleu',e:'🔵'},{w:'Yellow',t:'Jaune',e:'🟡'},{w:'Green',t:'Vert',e:'🟢'}],
            numbers: [{w:'One',t:'Un',e:'1️⃣'},{w:'Two',t:'Deux',e:'2️⃣'},{w:'Three',t:'Trois',e:'3️⃣'},{w:'Four',t:'Quatre',e:'4️⃣'}]
        };
        
        let currentCat = 'food';
        let quizIdx = 0;
        
        function draw() {
            let items = vocab[currentCat];
            document.getElementById('vocab-list').innerHTML = items.map(v =>
                `<div class="vocab-card">
                    <div class="vocab-emoji">${v.e}</div>
                    <div class="vocab-word">${v.w}</div>
                    <div class="vocab-translation">${v.t}</div>
                </div>`
            ).join('');
        }
        
        function startQuiz() {
            let items = vocab[currentCat];
            let q = items[quizIdx % items.length];
            let wrong = items.filter((_, i) => i !== quizIdx % items.length).slice(0, 2);
            let opts = [...wrong, q].sort(() => Math.random() - 0.5);
            
            document.getElementById('quiz-word').textContent = q.e;
            document.getElementById('quiz-options').innerHTML = opts.map((o, i) =>
                `<div class="quiz-option" onclick="checkAnswer(this,'${q.w}')">${o.t}</div>`
            ).join('');
        }
        
        function checkAnswer(el, correct) {
            let ans = el.textContent;
            if (ans === correct) {
                el.classList.add('correct');
            }
        }
        
        function nextQuiz() {
            quizIdx++;
            startQuiz();
        }
        
        document.getElementById('cat-select').onchange = () => {
            currentCat = document.getElementById('cat-select').value;
            draw();
        };
        
        document.querySelectorAll('.tab').forEach(t => {
            t.onclick = () => {
                document.querySelectorAll('.tab').forEach(x => x.classList.remove('on'));
                document.querySelectorAll('.panel').forEach(x => x.classList.remove('on'));
                t.classList.add('on');
                document.getElementById(t.dataset.p).classList.add('on');
                if (t.dataset.p === 'quiz') startQuiz();
            };
        });
        
        draw();
        if ('serviceWorker' in navigator) navigator.serviceWorker.register('data:application/javascript,self.addEventListener("install",e=>self.skipWaiting());');
    </script>
</body>
</html>
