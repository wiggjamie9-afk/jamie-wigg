<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Founder's Brain — Daily lessons for entrepreneurs</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f1f5f9;
            min-height: 100vh;
            padding: 16px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            padding: 24px 0 16px;
            border-bottom: 1px solid rgba(51, 65, 85, 0.5);
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(90deg, #e0e7ff, #c7d2fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            font-size: 14px;
            color: #cbd5e1;
        }

        #onboard {
            animation: fadeIn 0.4s ease-out;
        }

        .onboard-content {
            text-align: center;
        }

        .onboard-content h2 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 16px;
            color: #e0e7ff;
        }

        .onboard-content p {
            font-size: 15px;
            line-height: 1.6;
            color: #cbd5e1;
            margin-bottom: 24px;
        }

        .track-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 12px;
        }

        .track-btn {
            padding: 16px 12px;
            border: 2px solid rgba(51, 65, 85, 0.8);
            background: rgba(15, 23, 42, 0.5);
            color: #cbd5e1;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .track-btn:hover {
            border-color: #a5f3fc;
            background: rgba(30, 58, 138, 0.3);
            color: #a5f3fc;
        }

        #styleCard {
            display: none;
            margin-top: 20px;
            padding: 20px;
            background: rgba(30, 58, 138, 0.2);
            border: 1px solid rgba(165, 243, 252, 0.3);
            border-radius: 12px;
            animation: slideDown 0.4s ease-out;
        }

        .style-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 16px;
        }

        .style-opt {
            padding: 12px;
            border: 2px solid rgba(51, 65, 85, 0.8);
            background: rgba(15, 23, 42, 0.5);
            color: #cbd5e1;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .style-opt:hover {
            border-color: #a5f3fc;
            background: rgba(30, 58, 138, 0.3);
            color: #a5f3fc;
        }

        #lessonView {
            display: none;
            animation: fadeIn 0.4s ease-out;
        }

        .lesson-content {
            background: rgba(30, 58, 138, 0.15);
            border: 1px solid rgba(165, 243, 252, 0.2);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
        }

        .lesson-title {
            font-size: 22px;
            font-weight: 700;
            color: #e0e7ff;
            margin-bottom: 16px;
            line-height: 1.3;
        }

        .lesson-body {
            font-size: 15px;
            line-height: 1.7;
            color: #cbd5e1;
            margin-bottom: 20px;
        }

        .lesson-body p {
            margin-bottom: 12px;
        }

        .lesson-affirmation {
            padding: 16px;
            background: rgba(165, 243, 252, 0.1);
            border-left: 4px solid #a5f3fc;
            border-radius: 4px;
            font-style: italic;
            color: #a5f3fc;
            font-size: 14px;
            margin-bottom: 16px;
        }

        .lesson-strength {
            display: inline-block;
            padding: 8px 12px;
            background: rgba(165, 243, 252, 0.2);
            color: #a5f3fc;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }

        .controls {
            display: flex;
            gap: 12px;
            margin-top: 24px;
            flex-wrap: wrap;
        }

        .btn {
            flex: 1;
            min-width: 100px;
            padding: 12px 16px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: linear-gradient(90deg, #a5f3fc, #67e8f9);
            color: #0f172a;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(165, 243, 252, 0.3);
        }

        .btn-secondary {
            background: rgba(51, 65, 85, 0.6);
            color: #cbd5e1;
            border: 1px solid rgba(165, 243, 252, 0.3);
        }

        .btn-secondary:hover {
            border-color: #a5f3fc;
            color: #a5f3fc;
        }

        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            font-size: 13px;
            color: #64748b;
            flex-wrap: wrap;
            gap: 12px;
        }

        .streak {
            font-weight: 600;
            color: #a5f3fc;
        }

        #celebrate {
            display: none;
            text-align: center;
            padding: 40px 20px;
            animation: scaleIn 0.5s ease-out;
        }

        .celebrate-emoji {
            font-size: 60px;
            margin-bottom: 16px;
        }

        .celebrate-text {
            font-size: 24px;
            font-weight: 700;
            color: #a5f3fc;
            margin-bottom: 24px;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .next-btn {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Founder's Brain</h1>
            <p>One lesson a day for building and leading</p>
        </div>

        <div id="onboard">
            <div class="onboard-content">
                <h2>Pick your biggest challenge</h2>
                <p>Which hits closest to home right now?</p>
                <div class="track-buttons">
                    <button class="track-btn" onclick="selectTrack('fear')">🔥 Fear</button>
                    <button class="track-btn" onclick="selectTrack('customers')">🎯 Customers</button>
                    <button class="track-btn" onclick="selectTrack('burnout')">⚡ Burnout</button>
                    <button class="track-btn" onclick="selectTrack('decisions')">🧭 Decisions</button>
                </div>
            </div>
            <div id="styleCard">
                <p style="margin-bottom: 12px; font-size: 14px; color: #cbd5e1;">How do you like to learn?</p>
                <div class="style-options">
                    <button class="style-opt" onclick="selectStyle('short')">Short & sharp</button>
                    <button class="style-opt" onclick="selectStyle('story')">Story-driven</button>
                    <button class="style-opt" onclick="selectStyle('tactical')">Tactical steps</button>
                    <button class="style-opt" onclick="selectStyle('honest')">Honest talk</button>
                </div>
            </div>
        </div>

        <div id="lessonView">
            <div class="lesson-content">
                <div class="lesson-title" id="lessonTitle"></div>
                <div class="lesson-body" id="lessonBody"></div>
                <div class="lesson-affirmation" id="lessonAffirmation"></div>
                <div class="lesson-strength" id="lessonStrength"></div>
            </div>

            <div class="controls">
                <button class="btn btn-primary" onclick="speak()">🔊 Read aloud</button>
                <button class="btn btn-secondary" onclick="nextLesson()">Next →</button>
                <button class="btn btn-secondary" onclick="markDone()">✓ Done</button>
            </div>

            <div class="footer">
                <div id="progress"></div>
                <div><span class="streak" id="streak"></span></div>
            </div>
        </div>

        <div id="celebrate">
            <div class="celebrate-emoji">🎉</div>
            <div class="celebrate-text">Great job today!</div>
            <p style="color: #cbd5e1; margin-bottom: 24px;">Come back tomorrow for the next lesson.</p>
            <button class="btn btn-primary" onclick="resetView()">Back to home</button>
        </div>
    </div>

    <script>
        const lessons = [
            {t:"The founder's first fear is real",b:["Fear isn't weakness. Fear is your nervous system saying 'I care about this.'","The best founders feel the fear and decide anyway. They don't wait for it to vanish.","Today's tiny step: name one fear you have about your business. Write it down. Just say it out loud."],a:"Courage is not the absence of fear—it's action in spite of it.",s:"Honest fear"},
            {t:"Your imposter syndrome is not a sign you're a fraud",b:["Most founders feel like they don't belong. Most feel like they're making it up as they go. That's not because they're failing—it's because they're growing.","The moment you stop feeling imposter syndrome is the moment you stop learning.","Today's tiny step: write down one thing you've learned this week that surprised you. That learning is proof you're not a fraud."],a:"Imposter syndrome means you're paying attention.",s:"Growth mindset"},
            {t:"You don't need permission to start",b:["Waiting for the perfect moment, perfect product, perfect confidence is waiting for a moment that never comes.","The permission you're looking for has always been yours. You're the founder.","Today's tiny step: take one small action toward your business right now. It doesn't need to be perfect."],a:"The best time to start was yesterday. The second best time is now.",s:"Action over planning"},
            {t:"Pressure can crack you or forge you—you choose",b:["Pressure is part of every founder's life. The difference between founders who make it and those who don't isn't the absence of pressure—it's how they respond to it.","High pressure + no plan = burnout. High pressure + a plan = momentum.","Today's tiny step: pick one thing that's been stressing you. Make a simple 3-step plan for it."],a:"Pressure reveals character; it doesn't create it.",s:"Pressure as compass"},
            {t:"Saying no is how you say yes to what matters",b:["Every yes to a distraction is a no to your real goal. Founders who succeed aren't those who do everything—they're the ones who do one thing incredibly well.","The word 'no' is a complete sentence. You don't owe anyone a detailed explanation.","Today's tiny step: write down 3 things you're doing that don't serve your goal. Plan to stop one."],a:"Focus is just disciplined saying no.",s:"Strategic focus"},
            {t:"Your customers are humans, not numbers",b:["The moment you stop seeing customers as transactions and start seeing them as people you're helping, everything changes.","The best product never matters if people don't feel you care about their problem.","Today's tiny step: have one real conversation with a customer (or potential customer). Ask them what keeps them up at night."],a:"Trust is built one honest conversation at a time.",s:"Human-first selling"},
            {t:"You don't need everyone—you need the right ones",b:["The founder trap is trying to sell to everyone. The winner's move is finding the people who already want what you're solving.","1,000 true fans who love you is better than 1 million people who are mildly interested.","Today's tiny step: describe your ideal customer in vivid detail. Where do they hang out? What do they care about?"],a:"The right customer feels less like selling and more like connecting.",s:"Niche focus"},
            {t:"Listen more than you pitch",b:["Most pitches fail because the founder talked about their product instead of understanding the customer's problem.","The best sales conversation is 80% listening and 20% speaking. Let the customer sell themselves on your solution.","Today's tiny step: ask a potential customer 5 questions about their problem before mentioning your product."],a:"The customer's problem is your best marketing.",s:"Deep listening"},
            {t:"Money is a tool, not the finish line",b:["Founders can chase revenue and miss purpose. Or chase purpose and discover revenue follows.","The second type sleeps better and builds things people actually love.","Today's tiny step: write down your business in one sentence without mentioning money. That's your real purpose."],a:"Money is how you keep the lights on. Purpose is why you turned them on.",s:"Purpose-first thinking"},
            {t:"Your team is better than you are",b:["The founder's trap is thinking you need to be the smartest person in the room. You don't. You need to be the person who hires people smarter than you.","Your job isn't to be the expert. It's to build a team of experts and get out of their way.","Today's tiny step: write down 3 skills you don't have but your business needs. That's your hiring list."],a:"Great teams make great founders look even better.",s:"Team as multiplier"},
            {t:"Burnout is a signal, not a failure",b:["Burnout doesn't mean you're weak. It means your system is broken. Maybe you're working 80 hours a week. Maybe you haven't taken a day off in 6 months. Maybe you're carrying every problem alone.","Ignoring burnout is like ignoring the engine light in your car. It gets worse until the car stops.","Today's tiny step: pick one thing you're doing unsustainably. Change it this week."],a:"Burnout is your body's way of saying this can't keep going.",s:"System reset"},
            {t:"You can't pour from an empty cup",b:["Founders who build empires that last are the ones who protect their sleep, their health, their relationships.","The paradox: taking care of yourself doesn't slow your business—it accelerates it because you're sharper, kinder, and more creative.","Today's tiny step: schedule one thing that fills your cup. It could be sleep, a walk, time with family. Put it on your calendar like it's a business meeting."],a:"Your wellbeing is infrastructure, not luxury.",s:"Self-care as strategy"},
            {t:"Decisions are 80% info, 20% gut",b:["The founder who waits for 100% certainty never decides. The founder who decides on a gut feeling without any info makes mistakes.","The sweet spot is gathering enough information to feel confident, then trusting your intuition to make the call.","Today's tiny step: pick a decision you've been avoiding. Gather 3 pieces of information about it, then decide."],a:"Indecision is a decision to stay stuck.",s:"Decisive action"},
            {t:"Your past is not your ceiling",b:["Whatever you've done before, whatever your background is, it doesn't determine what you can build.","The best founders come from everywhere—some had money, some had nothing. Some had support, some had obstacles. The ones who make it are the ones who decide their past is just context, not destiny.","Today's tiny step: write down one limitation you've been using as an excuse. Then write down why it's not actually limiting you."],a:"Your story is your strength, not your chain.",s:"Possibility mindset"},
            {t:"Failure is data, not defeat",b:["Every failed experiment teaches you something the next one won't. Every customer who said no teaches you something the next one will hear.","Founders who get lucky are actually just the ones who've failed more times and learned faster.","Today's tiny step: look at one recent failure in your business. Write down 3 things it taught you."],a:"Failure is the tuition for success.",s:"Learning from loss"},
            {t:"Your competition doesn't define you",b:["It's easy to build the same thing as someone else, just better. It's harder to build something only you can build.","Your competition might be faster, richer, or bigger. But they're not you. They don't have your story, your passion, or your weird insight that nobody else has.","Today's tiny step: write down 3 things only you bring to this space. That's your unfair advantage."],a:"Competition validates the market. Your uniqueness wins the customer.",s:"Authentic differentiation"},
            {t:"Speed beats perfect",b:["The startup that ships a good product today beats the one that ships a perfect product in 6 months.","You learn from real users faster than you learn from your own head. Ship, gather feedback, improve, repeat.","Today's tiny step: find one thing in your product you've been perfecting that you could launch today. Launch it."],a:"Done is better than perfect.",s:"Velocity wins"},
            {t:"Asking for help is a superpower",b:["Founders who try to solve everything alone run out of energy. Founders who ask for help move faster and stay healthier.","Asking is not weakness. Asking is strategic.","Today's tiny step: write down 3 people you could ask for advice or help on your biggest challenge. Then ask one of them."],a:"The strongest founders know when to ask.",s:"Strategic asking"},
            {t:"Your vision is more real than your doubt",b:["On hard days, the only thing that keeps you going is the vision. Not the money, not the metrics, not the praise. The vision.","If you can see it clearly enough, you can build it.","Today's tiny step: write down your vision in detail. Not your goal. Your vision. What does success look like in 5 years? Make it vivid."],a:"Vision is the fuel that keeps you going when everything else runs out.",s:"Vision-driven building"},
            {t:"You are enough—and you're still learning",b:["This last one ties everything together. You don't need to be perfect. You need to be willing to keep getting better.","You are enough to start. You are enough to lead. And you'll never be done learning, and that's the whole point.","Today's tiny step: look back at the lessons you've read this month. Pick one that's shifted how you think. Thank yourself for staying open to growth."],a:"The best founders know they're enough, and they also know they're never done growing.",s:"Humble confidence"}
        ];

        const tracks = { fear: 0, customers: 5, burnout: 10, decisions: 15 };

        let state = JSON.parse(localStorage.getItem('founderState')) || {
            track: null,
            style: null,
            done: [],
            lastDay: null,
            streak: 0,
            seen: {}
        };

        function selectTrack(t) {
            state.track = t;
            state.style = null;
            state.seen = {};
            document.getElementById('styleCard').style.display = 'block';
        }

        function selectStyle(s) {
            state.style = s;
            state.lastDay = new Date().toDateString();
            saveState();
            showLesson();
        }

        function saveState() {
            localStorage.setItem('founderState', JSON.stringify(state));
        }

        function getTrackIndex(offset) {
            const trackStart = tracks[state.track];
            let idx = trackStart + offset;
            while (state.done.includes(idx)) idx++;
            return idx < trackStart + 5 ? idx : trackStart + (Math.floor(Math.random() * 5));
        }

        function showLesson() {
            if (!state.track || !state.style) return;
            const offset = state.seen[state.track] ? (state.seen[state.track] + 1) % 5 : 0;
            const idx = getTrackIndex(offset);
            state.seen[state.track] = offset;
            const l = lessons[idx];
            document.getElementById('lessonTitle').textContent = l.t;
            document.getElementById('lessonBody').innerHTML = l.b.map(p => `<p>${p}</p>`).join('');
            document.getElementById('lessonAffirmation').textContent = l.a;
            document.getElementById('lessonStrength').textContent = l.s;
            updateUI();
        }

        function updateUI() {
            const today = new Date().toDateString();
            if (state.lastDay !== today) state.streak = 0;
            if (state.done.length > 0) {
                const lastDone = state.done[state.done.length - 1];
                if (new Date().toDateString() === state.lastDay) {
                    document.getElementById('onboard').style.display = 'none';
                    document.getElementById('celebrate').style.display = 'block';
                    document.getElementById('lessonView').style.display = 'none';
                } else {
                    document.getElementById('onboard').style.display = 'none';
                    document.getElementById('lessonView').style.display = 'block';
                    document.getElementById('celebrate').style.display = 'none';
                }
            } else {
                document.getElementById('onboard').style.display = 'block';
                document.getElementById('lessonView').style.display = 'none';
                document.getElementById('celebrate').style.display = 'none';
            }
            document.getElementById('progress').textContent = `${state.done.length} lesson${state.done.length !== 1 ? 's' : ''} done`;
            document.getElementById('streak').textContent = `🔥 ${state.streak} day${state.streak !== 1 ? 's' : ''} here`;
        }

        function speak() {
            const title = document.getElementById('lessonTitle').textContent;
            const body = document.getElementById('lessonBody').innerText;
            const aff = document.getElementById('lessonAffirmation').textContent;
            speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(`${title}. ${body}. ${aff}`);
            u.rate = 0.95;
            speechSynthesis.speak(u);
        }

        function nextLesson() {
            showLesson();
        }

        function markDone() {
            const idx = lessons.findIndex(l => l.t === document.getElementById('lessonTitle').textContent);
            if (!state.done.includes(idx)) {
                state.done.push(idx);
                if (state.lastDay === new Date().toDateString()) state.streak++;
                state.lastDay = new Date().toDateString();
                saveState();
            }
            document.getElementById('onboard').style.display = 'none';
            document.getElementById('lessonView').style.display = 'none';
            document.getElementById('celebrate').style.display = 'block';
        }

        function resetView() {
            document.getElementById('celebrate').style.display = 'none';
            document.getElementById('onboard').style.display = 'block';
            state.track = null;
            state.style = null;
            saveState();
        }

        updateUI();
        if (state.track && state.style) showLesson();
    </script>
</body>
</html>
