<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#08050d">
    <title>Savings Challenge</title>
    <style>
        :root { --canvas:#08050d; --green:#00e887; --red:#ff1f5a; --cyan:#00d8ff; --purple:#7c3aed; --text:#fff; --text-muted:#aaa; }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:var(--canvas); color:var(--text); min-height:100vh; padding-bottom:80px; }
        .header { padding:20px; border-bottom:1px solid rgba(0,232,135,0.2); display:flex; justify-content:space-between; }
        h1 { font-size:24px; font-weight:700; }
        .badge { background:var(--green); color:var(--canvas); padding:4px 12px; border-radius:20px; font-size:11px; }
        .content { padding:20px; }
        input { background:rgba(0,232,135,0.05); border:1px solid rgba(0,232,135,0.2); border-radius:6px; color:var(--text); padding:10px; margin:8px 0; width:100%; }
        button { background:var(--green); color:var(--canvas); border:0; padding:10px 16px; border-radius:6px; cursor:pointer; font-weight:600; width:100%; }
        .goal { background:rgba(0,232,135,0.05); border:1px solid rgba(0,232,135,0.2); border-radius:8px; padding:15px; margin:12px 0; }
        .progress { background:rgba(0,232,135,0.1); border-radius:8px; height:20px; overflow:hidden; margin:10px 0; }
        .progress-fill { background:var(--green); height:100%; transition:width 0.3s; display:flex; align-items:center; justify-content:center; color:var(--canvas); font-size:11px; }
        .milestone { padding:8px; background:rgba(0,232,135,0.05); border-left:2px solid var(--cyan); margin:8px 0; font-size:13px; }
        .panel { display:none; }
        .panel.on { display:block; }
        .tabs { position:fixed; bottom:0; left:0; right:0; background:var(--canvas); border-top:1px solid rgba(0,232,135,0.2); display:flex; justify-content:space-around; height:70px; z-index:100; }
        .tab { flex:1; background:0; border:0; color:var(--text-muted); cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:12px; }
        .tab.on { color:var(--green); }
        .premium { background:rgba(124,58,237,0.1); border-left:3px solid var(--purple); padding:12px; margin-top:20px; border-radius:4px; font-size:13px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🎯 Savings</h1>
        <div class="badge">FREE</div>
    </div>
    <div class="content">
        <div id="goals" class="panel on">
            <input type="text" id="goal-name" placeholder="Goal name (e.g., Vacation)">
            <input type="number" id="goal-amt" placeholder="Target amount ($)" step="10" min="0">
            <button onclick="addGoal()">+ Add Goal</button>
            
            <div id="goal-list" style="margin-top:20px"></div>
            <div class="premium">💎 Premium: Recurring challenges & group goals</div>
        </div>
        
        <div id="progress" class="panel">
            <div id="progress-view"></div>
        </div>
    </div>
    <div class="tabs">
        <button class="tab on" data-p="goals">⚙️ Goals</button>
        <button class="tab" data-p="progress">📈 Progress</button>
    </div>
    <script>
        let goals = [];
        const messages = ['You got this!', 'Keep going!', 'So close!', 'Amazing progress!', 'Almost there!'];
        
        function load() {
            let d = localStorage.getItem('savings');
            if (d) goals = JSON.parse(d);
            draw();
        }
        
        function save() {
            localStorage.setItem('savings', JSON.stringify(goals));
            draw();
        }
        
        function addGoal() {
            let n = document.getElementById('goal-name').value;
            let a = parseFloat(document.getElementById('goal-amt').value);
            if (!n || !a) return;
            goals.push({n, a, saved:0, milestones:[a*0.25,a*0.5,a*0.75,a]});
            document.getElementById('goal-name').value = '';
            document.getElementById('goal-amt').value = '';
            save();
        }
        
        function addSavings(idx, amt) {
            goals[idx].saved += amt;
            save();
        }
        
        function draw() {
            document.getElementById('goal-list').innerHTML = goals.length ?
                goals.map((g,i) => {
                    let pct = (g.saved / g.a * 100).toFixed(0);
                    let milestones = g.milestones.map(m => g.saved >= m ? '✓' : '○').join(' ');
                    return `<div class="goal">
                        <div style="font-weight:600;margin-bottom:5px">${g.n}</div>
                        <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:8px">
                            <span>$${g.saved.toFixed(2)} / $${g.a.toFixed(2)}</span>
                            <span>${pct}%</span>
                        </div>
                        <div class="progress">
                            <div class="progress-fill" style="width:${pct}%"></div>
                        </div>
                        <div class="milestone">${milestones}</div>
                        <div style="display:flex;gap:5px;margin-top:10px">
                            <input type="number" id="amt-${i}" placeholder="Add ($)" step="5" min="0" style="margin:0">
                            <button onclick="addSavings(${i},parseFloat(document.getElementById('amt-${i}').value)||0);document.getElementById('amt-${i}').value=''" style="width:50px;margin:0">+</button>
                        </div>
                    </div>`;
                }).join('') :
                '<p style="color:var(--text-muted)">No goals yet</p>';
            
            document.getElementById('progress-view').innerHTML = goals.length ?
                goals.map((g,i) => {
                    let done = g.saved >= g.a;
                    return `<div class="goal">
                        <div style="font-weight:600">${g.n}</div>
                        <div style="font-size:14px;color:var(--green);margin:5px 0">$${g.saved.toFixed(2)} of $${g.a.toFixed(2)}</div>
                        <div style="color:var(--text-muted);font-size:12px">${done ? '🎉 Goal reached!' : messages[Math.floor(Math.random()*messages.length)]}</div>
                    </div>`;
                }).join('') :
                '<p style="padding:20px;color:var(--text-muted)">No goals</p>';
        }
        
        document.querySelectorAll('.tab').forEach(t => {
            t.onclick = () => {
                document.querySelectorAll('.tab').forEach(x => x.classList.remove('on'));
                document.querySelectorAll('.panel').forEach(x => x.classList.remove('on'));
                t.classList.add('on');
                document.getElementById(t.dataset.p).classList.add('on');
            };
        });
        
        load();
        if ('serviceWorker' in navigator) navigator.serviceWorker.register('data:application/javascript,self.addEventListener("install",e=>self.skipWaiting());');
    </script>
</body>
</html>
