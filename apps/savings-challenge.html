<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Savings Challenge – Build Wealth</title>
    <style>
        :root { --primary: #48A9A6; --bg-dark: #0F172A; --bg-light: #1E293B; --text-primary: #F1F5F9; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { font-family: -apple-system, sans-serif; background: var(--bg-dark); color: var(--text-primary); }
        .container { max-width: 480px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }
        .header { background: linear-gradient(135deg, var(--primary) 0%, #2D7A77 100%); padding: 24px 20px; text-align: center; }
        .header h1 { font-size: 28px; margin-bottom: 4px; }
        .content { flex: 1; padding: 20px; overflow-y: auto; }
        .card { background: var(--bg-light); border-radius: 12px; padding: 16px; margin-bottom: 16px; border-left: 4px solid var(--primary); }
        .card h2 { font-size: 16px; margin-bottom: 12px; font-weight: 700; }
        input { width: 100%; padding: 10px 12px; background: var(--bg-dark); border: 2px solid #334155; border-radius: 8px; color: var(--text-primary); margin-bottom: 10px; font-size: 13px; }
        input:focus { outline: none; border-color: var(--primary); }
        button { width: 100%; padding: 12px; background: var(--primary); border: none; border-radius: 8px; color: #F1F5F9; font-weight: 600; cursor: pointer; }
        button:hover { background: #2D7A77; }
        .progress-bar { width: 100%; height: 8px; background: #334155; border-radius: 4px; overflow: hidden; margin: 12px 0; }
        .progress-fill { height: 100%; background: var(--primary); transition: width 0.3s; }
        .savings-item { background: var(--bg-dark); padding: 12px; border-radius: 6px; margin-bottom: 8px; }
        .label { display: block; font-size: 12px; color: #CBD5E1; margin-bottom: 4px; font-weight: 600; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎯 SAVINGS CHALLENGE</h1>
            <p style="font-size: 12px;">Build wealth gradually</p>
        </div>
        <div class="content">
            <div class="card">
                <h2>🎯 Start a Challenge</h2>
                <label>Challenge name</label>
                <input type="text" id="name" placeholder="E.g., Emergency Fund">
                <label>Goal amount</label>
                <input type="number" id="goal" placeholder="10000" min="0">
                <label>Daily amount</label>
                <input type="number" id="daily" placeholder="10" step="0.01" min="0">
                <button onclick="addChallenge()">Start Challenge</button>
            </div>

            <div class="card">
                <h2>📊 Active Challenges</h2>
                <div id="challenges">No challenges yet</div>
            </div>
        </div>
    </div>

    <script>
        function addChallenge() {
            const name = document.getElementById('name').value;
            const goal = parseFloat(document.getElementById('goal').value);
            const daily = parseFloat(document.getElementById('daily').value);

            if (!name || !goal || !daily) { alert('Fill all fields'); return; }

            let chal = JSON.parse(localStorage.getItem('challenges') || '[]');
            chal.push({ name, goal, daily, saved: 0, id: Date.now(), startDate: new Date().toISOString().split('T')[0] });
            localStorage.setItem('challenges', JSON.stringify(chal));

            document.getElementById('name').value = '';
            document.getElementById('goal').value = '';
            document.getElementById('daily').value = '';
            displayChallenges();
        }

        function addSavings(id) {
            let chal = JSON.parse(localStorage.getItem('challenges') || '[]');
            const c = chal.find(x => x.id === id);
            if (c) {
                c.saved += c.daily;
                if (c.saved > c.goal) c.saved = c.goal;
                localStorage.setItem('challenges', JSON.stringify(chal));
                displayChallenges();
            }
        }

        function deleteChallenge(id) {
            let chal = JSON.parse(localStorage.getItem('challenges') || '[]');
            chal = chal.filter(c => c.id !== id);
            localStorage.setItem('challenges', JSON.stringify(chal));
            displayChallenges();
        }

        function displayChallenges() {
            const chal = JSON.parse(localStorage.getItem('challenges') || '[]');
            const div = document.getElementById('challenges');

            if (chal.length === 0) {
                div.innerHTML = '<p style="color: #CBD5E1; font-size: 12px;">No challenges yet</p>';
                return;
            }

            div.innerHTML = chal.map(c => {
                const pct = Math.round((c.saved / c.goal) * 100);
                const daysLeft = c.goal > c.saved ? Math.ceil((c.goal - c.saved) / c.daily) : 0;
                return `<div class="savings-item">
                    <div style="font-weight: 600;">${c.name}</div>
                    <div style="font-size: 12px; color: #CBD5E1; margin: 4px 0;">₹${c.saved.toFixed(2)} / ₹${c.goal.toFixed(2)}</div>
                    <div class="progress-bar"><div class="progress-fill" style="width: ${pct}%;"></div></div>
                    <div style="font-size: 11px; color: #CBD5E1; margin-bottom: 8px;">${pct}% complete${daysLeft > 0 ? ` • ${daysLeft} days left` : ' ✓'}</div>
                    <div style="display: flex; gap: 8px;">
                        <button onclick="addSavings(${c.id})" style="flex: 1; padding: 8px; font-size: 12px; margin: 0;">+₹${c.daily.toFixed(2)}</button>
                        <button onclick="deleteChallenge(${c.id})" style="flex: 0.2; padding: 8px; margin: 0; background: #DC2626; color: white;">×</button>
                    </div>
                </div>`;
            }).join('');
        }

        displayChallenges();
    </script>
</body>
</html>
