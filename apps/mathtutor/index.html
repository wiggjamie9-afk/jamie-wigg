<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="MathTutor Pro — AI-powered math tutoring, step-by-step solutions.">
  <title>MathTutor Pro</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="theme-color" content="#08050d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MathTutor Pro">
  <link rel="apple-touch-icon" href="./icon.svg">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --canvas: #08050d;
      --fg: #ffffff;
      --magenta: #ff1f5a;
      --purple: #7c3aed;
      --cyan: #00d8ff;
      --green: #00e887;
      --gold: #f5c000;
      --pink: #ff6fc8;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--canvas);
      color: var(--fg);
      line-height: 1.5;
      overflow-x: hidden;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 100vh;
    }

    .container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: 480px;
      margin: 0 auto;
      background: linear-gradient(135deg, #0f0815 0%, #1a0f25 100%);
      position: relative;
      overflow: hidden;
    }

    .header {
      background: linear-gradient(90deg, rgba(124, 58, 237, 0.1) 0%, rgba(255, 31, 90, 0.1) 100%);
      border-bottom: 1px solid rgba(124, 58, 237, 0.2);
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .header h1 {
      font-size: 24px;
      font-weight: 600;
      background: linear-gradient(90deg, var(--purple), var(--pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .header-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(124, 58, 237, 0.2);
      border: 1px solid var(--purple);
      color: var(--purple);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      transition: 0.3s;
    }

    .header-btn:hover {
      background: rgba(124, 58, 237, 0.3);
      transform: scale(1.05);
    }

    .nav-tabs {
      display: flex;
      gap: 0;
      padding: 12px;
      border-bottom: 1px solid rgba(124, 58, 237, 0.1);
      overflow-x: auto;
      scroll-behavior: smooth;
    }

    .nav-tabs::-webkit-scrollbar { display: none; }

    .nav-tab {
      flex-shrink: 0;
      padding: 8px 16px;
      border: 1px solid rgba(124, 58, 237, 0.2);
      border-radius: 20px;
      background: transparent;
      color: rgba(255, 255, 255, 0.6);
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: 0.3s;
    }

    .nav-tab.active {
      background: var(--purple);
      color: var(--canvas);
      border-color: var(--purple);
    }

    .nav-tab:hover {
      border-color: var(--purple);
    }

    .content {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      scroll-behavior: smooth;
    }

    .content::-webkit-scrollbar {
      width: 6px;
    }

    .content::-webkit-scrollbar-track {
      background: rgba(124, 58, 237, 0.05);
    }

    .content::-webkit-scrollbar-thumb {
      background: rgba(124, 58, 237, 0.3);
      border-radius: 3px;
    }

    .screen { display: none; }
    .screen.active { display: block; }

    .onboard-screen {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100%;
      text-align: center;
      gap: 30px;
    }

    .math-icon {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, rgba(124, 58, 237, 0.8), rgba(255, 107, 200, 0.4));
      position: relative;
      animation: pulse-math 3s ease-in-out infinite;
      box-shadow: 0 0 40px rgba(124, 58, 237, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
    }

    @keyframes pulse-math {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }

    .onboard-screen h2 {
      font-size: 28px;
      background: linear-gradient(90deg, var(--purple), var(--pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-weight: 600;
    }

    .onboard-screen p {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.7);
      max-width: 280px;
    }

    .input-group {
      width: 100%;
      max-width: 300px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .input-group input {
      padding: 12px 16px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(124, 58, 237, 0.3);
      color: var(--fg);
      font-size: 14px;
      font-family: inherit;
      transition: 0.3s;
    }

    .input-group input:focus {
      outline: none;
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--purple);
    }

    .input-group input::placeholder {
      color: rgba(255, 255, 255, 0.4);
    }

    .level-selector {
      display: flex;
      gap: 12px;
    }

    .level-btn {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      background: rgba(124, 58, 237, 0.1);
      border: 1px solid rgba(124, 58, 237, 0.3);
      color: var(--fg);
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: 0.3s;
    }

    .level-btn.selected {
      background: var(--purple);
      border-color: var(--purple);
      color: var(--canvas);
    }

    .level-btn:hover {
      border-color: var(--purple);
    }

    .cta-btn {
      padding: 14px 28px;
      border-radius: 8px;
      background: linear-gradient(90deg, var(--purple), var(--pink));
      border: none;
      color: var(--canvas);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .cta-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(124, 58, 237, 0.4);
    }

    .cta-btn:active {
      transform: translateY(0);
    }

    /* Topic selection */
    .topic-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    .topic-card {
      background: linear-gradient(135deg, rgba(124, 58, 237, 0.1) 0%, rgba(255, 107, 200, 0.05) 100%);
      border: 1px solid rgba(124, 58, 237, 0.2);
      border-radius: 12px;
      padding: 16px;
      cursor: pointer;
      transition: 0.3s;
    }

    .topic-card:hover {
      background: linear-gradient(135deg, rgba(124, 58, 237, 0.15) 0%, rgba(255, 107, 200, 0.1) 100%);
      border-color: var(--purple);
      transform: translateY(-2px);
    }

    .topic-card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 8px;
    }

    .topic-card h3 {
      font-size: 16px;
      font-weight: 600;
      color: var(--purple);
    }

    .topic-badge {
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 4px;
      background: rgba(124, 58, 237, 0.2);
      color: var(--purple);
      font-weight: 600;
    }

    .topic-badge.premium {
      background: rgba(245, 192, 0, 0.2);
      color: var(--gold);
    }

    .topic-card-meta {
      display: flex;
      gap: 12px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.6);
    }

    /* Problem screen */
    .problem-card {
      background: linear-gradient(135deg, rgba(124, 58, 237, 0.15) 0%, rgba(255, 31, 90, 0.1) 100%);
      border: 1px solid rgba(124, 58, 237, 0.3);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 20px;
      text-align: center;
    }

    .problem-text {
      font-size: 24px;
      font-weight: 700;
      color: var(--purple);
      margin-bottom: 20px;
      font-family: 'Courier New', monospace;
    }

    .answer-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }

    .answer-btn {
      padding: 12px;
      border-radius: 8px;
      background: rgba(124, 58, 237, 0.2);
      border: 1px solid rgba(124, 58, 237, 0.4);
      color: var(--fg);
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: 0.3s;
    }

    .answer-btn:hover {
      border-color: var(--purple);
      background: rgba(124, 58, 237, 0.3);
    }

    .answer-btn.correct {
      background: rgba(0, 232, 135, 0.3);
      border-color: var(--green);
      color: var(--green);
    }

    .answer-btn.incorrect {
      background: rgba(255, 31, 90, 0.3);
      border-color: var(--magenta);
      color: var(--magenta);
    }

    .solution-card {
      background: rgba(0, 0, 0, 0.3);
      border-left: 4px solid var(--cyan);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
      display: none;
    }

    .solution-card.show {
      display: block;
      animation: slideIn 0.3s ease-out;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .solution-title {
      font-size: 13px;
      color: var(--cyan);
      font-weight: 600;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .solution-steps {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.8);
      line-height: 1.8;
    }

    .solution-steps div {
      margin-bottom: 8px;
    }

    .next-btn {
      padding: 12px;
      border-radius: 8px;
      background: linear-gradient(90deg, var(--purple), var(--pink));
      border: none;
      color: var(--canvas);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      display: none;
    }

    .next-btn.show {
      display: block;
    }

    .next-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(124, 58, 237, 0.4);
    }

    /* Stats */
    .stat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }

    .stat-card {
      background: linear-gradient(135deg, rgba(124, 58, 237, 0.15) 0%, rgba(255, 31, 90, 0.1) 100%);
      border: 1px solid rgba(124, 58, 237, 0.2);
      border-radius: 12px;
      padding: 16px;
      text-align: center;
    }

    .stat-value {
      font-size: 28px;
      font-weight: 700;
      color: var(--purple);
      margin-bottom: 4px;
    }

    .stat-label {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.6);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .premium-lock {
      background: linear-gradient(135deg, rgba(245, 192, 0, 0.15) 0%, rgba(255, 31, 90, 0.1) 100%);
      border: 1px solid rgba(245, 192, 0, 0.3);
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      margin: 20px 0;
    }

    .premium-lock h3 {
      color: var(--gold);
      font-size: 18px;
      margin-bottom: 12px;
    }

    .premium-lock p {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.7);
      margin-bottom: 16px;
    }

    .unlock-btn {
      padding: 12px 24px;
      border-radius: 8px;
      background: linear-gradient(90deg, var(--gold), var(--magenta));
      border: none;
      color: var(--canvas);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s;
    }

    .unlock-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(245, 192, 0, 0.3);
    }

    @media (max-width: 480px) {
      .container { max-width: 100%; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>MathTutor Pro</h1>
      <button class="header-btn" id="settingsBtn">⚙️</button>
    </div>

    <div class="nav-tabs">
      <button class="nav-tab active" data-tab="practice">Practice</button>
      <button class="nav-tab" data-tab="progress">Progress</button>
      <button class="nav-tab" data-tab="settings">Settings</button>
    </div>

    <div class="content">
      <!-- Onboarding -->
      <div class="screen onboard-screen active" id="onboard">
        <div class="math-icon">∑</div>
        <div>
          <h2>Welcome to MathTutor Pro</h2>
          <p>Master math with step-by-step solutions</p>
        </div>
        <div class="input-group">
          <input type="text" id="nameInput" placeholder="Your name">
          <div>
            <p style="font-size: 12px; color: rgba(255,255,255,0.6); margin-bottom: 8px;">Level</p>
            <div class="level-selector">
              <button class="level-btn selected" data-level="algebra">Algebra</button>
              <button class="level-btn" data-level="geometry">Geometry</button>
              <button class="level-btn" data-level="calculus">Calculus</button>
            </div>
          </div>
        </div>
        <button class="cta-btn" id="startBtn">Start Learning</button>
      </div>

      <!-- Topics -->
      <div class="screen" id="topics">
        <div class="topic-grid" id="topicList"></div>
      </div>

      <!-- Problem -->
      <div class="screen" id="problem"></div>

      <!-- Progress -->
      <div class="screen" id="progress">
        <h2 style="margin-bottom: 20px; color: var(--purple);">Your Progress</h2>
        <div class="stat-grid" id="statsGrid"></div>
        <h3 style="color: var(--pink); margin-bottom: 16px; margin-top: 24px;">Accuracy by Topic</h3>
        <div id="accuracyChart" style="height: 200px; background: rgba(124,58,237,0.05); border-radius: 8px; border: 1px solid rgba(124,58,237,0.1); padding: 16px; display: flex; align-items: flex-end; gap: 8px;"></div>
      </div>

      <!-- Settings -->
      <div class="screen" id="settings">
        <h2 style="margin-bottom: 20px; color: var(--purple);">Settings</h2>
        <div style="display: flex; flex-direction: column; gap: 12px;">
          <div style="background: rgba(124,58,237,0.1); border-radius: 8px; padding: 12px;">
            <p style="font-size: 12px; color: rgba(255,255,255,0.6); margin-bottom: 8px;">Student Name</p>
            <p style="font-size: 16px; color: var(--purple); font-weight: 600;" id="settingsName">—</p>
          </div>
          <div style="background: rgba(124,58,237,0.1); border-radius: 8px; padding: 12px;">
            <p style="font-size: 12px; color: rgba(255,255,255,0.6); margin-bottom: 8px;">Level</p>
            <p style="font-size: 16px; color: var(--pink); font-weight: 600; text-transform: capitalize;" id="settingsLevel">—</p>
          </div>
          <div style="background: rgba(124,58,237,0.1); border-radius: 8px; padding: 12px;">
            <p style="font-size: 12px; color: rgba(255,255,255,0.6); margin-bottom: 8px;">Problems Solved</p>
            <p style="font-size: 16px; color: var(--purple); font-weight: 600;" id="settingsCount">0</p>
          </div>
          <button class="cta-btn" id="resetBtn" style="margin-top: 12px;">Reset Data</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');

    const S = {
      name: localStorage.getItem('mt_name') || '',
      level: localStorage.getItem('mt_level') || 'algebra',
      solved: parseInt(localStorage.getItem('mt_solved')) || 0,
      correct: parseInt(localStorage.getItem('mt_correct')) || 0,
      currentTopic: null,
      currentProblem: 0,
      premium: localStorage.getItem('mt_premium') === 'true',
    };

    const TOPICS = {
      algebra: [
        { id: 1, name: 'Solving Linear Equations', free: true, problems: 5 },
        { id: 2, name: 'Quadratic Equations', problems: 5 },
        { id: 3, name: 'Systems of Equations', problems: 5 },
      ],
      geometry: [
        { id: 4, name: 'Triangle Properties', free: true, problems: 5 },
        { id: 5, name: 'Circle Theorems', problems: 5 },
        { id: 6, name: 'Coordinate Geometry', problems: 5 },
      ],
      calculus: [
        { id: 7, name: 'Limits & Continuity', free: true, problems: 5 },
        { id: 8, name: 'Derivatives', problems: 5 },
        { id: 9, name: 'Integrals', problems: 5 },
      ],
    };

    const PROBLEMS = {
      1: [
        { q: '2x + 5 = 13', a: ['x = 4', 'x = 9', 'x = 3', 'x = 6'], c: 0, sol: 'Step 1: Subtract 5 from both sides → 2x = 8\nStep 2: Divide both sides by 2 → x = 4' },
        { q: '3x - 7 = 2', a: ['x = 3', 'x = -2', 'x = 1', 'x = 5'], c: 0, sol: 'Step 1: Add 7 to both sides → 3x = 9\nStep 2: Divide both sides by 3 → x = 3' },
      ],
      2: [
        { q: 'x² - 5x + 6 = 0', a: ['x = 2, 3', 'x = 1, 6', 'x = -2, -3', 'x = 0, 5'], c: 0, sol: 'Factor: (x - 2)(x - 3) = 0\nSolutions: x = 2 or x = 3' },
      ],
      4: [
        { q: 'Sum of angles in a triangle = ?', a: ['180°', '360°', '90°', '270°'], c: 0, sol: 'A fundamental property of Euclidean geometry:\nAll triangles have angles that sum to exactly 180 degrees.' },
      ],
    };

    function save() {
      localStorage.setItem('mt_name', S.name);
      localStorage.setItem('mt_level', S.level);
      localStorage.setItem('mt_solved', S.solved);
      localStorage.setItem('mt_correct', S.correct);
      localStorage.setItem('mt_premium', S.premium);
    }

    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    function renderTopics() {
      const list = document.getElementById('topicList');
      const topics = TOPICS[S.level];
      list.innerHTML = topics.map(t => `
        <div class="topic-card" onclick="selectTopic(${t.id})">
          <div class="topic-card-header">
            <h3>${t.name}</h3>
            ${t.free || S.premium ? '' : '<div class="topic-badge premium">PRO</div>'}
          </div>
          <div class="topic-card-meta">
            <span>📝 ${t.problems} problems</span>
          </div>
        </div>
      `).join('');
    }

    function selectTopic(id) {
      if (!S.premium && !TOPICS[S.level].find(t => t.id === id).free) {
        showUnlockModal();
        return;
      }
      S.currentTopic = TOPICS[S.level].find(t => t.id === id);
      S.currentProblem = 0;
      renderProblem();
      showScreen('problem');
    }

    function renderProblem() {
      if (!PROBLEMS[S.currentTopic.id]) {
        document.getElementById('problem').innerHTML = '<p style="text-align: center; color: rgba(255,255,255,0.6); padding: 40px 0;">No problems available. Check back soon!</p>';
        return;
      }

      const problems = PROBLEMS[S.currentTopic.id];
      if (S.currentProblem >= problems.length) {
        showCompletionModal();
        return;
      }

      const p = problems[S.currentProblem];
      let html = `<h2 style="margin-bottom: 20px; text-align: center; color: var(--purple);">${S.currentTopic.name}</h2>`;
      html += `<div style="text-align: center; font-size: 12px; color: rgba(255,255,255,0.6); margin-bottom: 16px;">Problem ${S.currentProblem + 1} of ${problems.length}</div>`;

      if (!S.premium && S.currentProblem >= 3) {
        html += `<div class="premium-lock">
          <h3>🔒 Unlimited Practice</h3>
          <p>Get unlimited access to all topics and problems</p>
          <button class="unlock-btn" onclick="unlock()">Unlock Pro — $4.99</button>
        </div>`;
      } else {
        html += `<div class="problem-card">
          <div class="problem-text">${p.q}</div>
          <div class="answer-options">
            ${p.a.map((ans, i) => `<button class="answer-btn" onclick="checkAnswer(${i})">${ans}</button>`).join('')}
          </div>
        </div>`;
        html += `<div class="solution-card" id="solution">
          <div class="solution-title">Solution</div>
          <div class="solution-steps">${p.sol.split('\n').map(s => `<div>${s}</div>`).join('')}</div>
        </div>`;
        html += `<button class="next-btn" id="nextBtn" onclick="nextProblem()">Next Problem →</button>`;
      }

      document.getElementById('problem').innerHTML = html;
    }

    function checkAnswer(idx) {
      const problems = PROBLEMS[S.currentTopic.id];
      const p = problems[S.currentProblem];
      const buttons = document.querySelectorAll('.answer-btn');

      buttons.forEach((btn, i) => {
        if (i === p.c) {
          btn.classList.add('correct');
        } else if (i === idx && idx !== p.c) {
          btn.classList.add('incorrect');
        }
        btn.disabled = true;
      });

      if (idx === p.c) {
        S.correct++;
      }
      S.solved++;
      save();

      document.getElementById('solution').classList.add('show');
      document.getElementById('nextBtn').classList.add('show');
    }

    function nextProblem() {
      S.currentProblem++;
      renderProblem();
    }

    function showCompletionModal() {
      const accuracy = Math.round((S.correct / Math.max(1, S.solved)) * 100);
      const html = `
        <div style="text-align: center; padding: 20px 0;">
          <h3 style="color: var(--purple); font-size: 20px; margin-bottom: 16px;">🎉 Topic Complete!</h3>
          <div style="font-size: 28px; color: var(--green); margin-bottom: 12px;">${accuracy}% Accuracy</div>
          <p style="font-size: 13px; color: rgba(255,255,255,0.7); margin-bottom: 20px;">Great job mastering ${S.currentTopic.name}!</p>
          <button class="cta-btn" onclick="finishTopic()">Back to Topics</button>
        </div>
      `;
      alert(html.replace(/<[^>]*>/g, '').substring(0, 50) + '... Topic complete!');
      finishTopic();
    }

    function finishTopic() {
      renderTopics();
      showScreen('topics');
    }

    function unlock() {
      S.premium = true;
      save();
      renderProblem();
    }

    function showUnlockModal() {
      alert('Unlock Pro ($4.99) for unlimited problems and all topics');
      unlock();
    }

    function renderProgress() {
      const accuracy = S.solved > 0 ? Math.round((S.correct / S.solved) * 100) : 0;
      const stats = [
        { label: 'Problems Solved', value: S.solved },
        { label: 'Accuracy', value: accuracy + '%' },
        { label: 'Topics Mastered', value: '2' },
        { label: 'Streak', value: '5 days 🔥' },
      ];
      document.getElementById('statsGrid').innerHTML = stats.map(s => `
        <div class="stat-card"><div class="stat-value">${s.value}</div><div class="stat-label">${s.label}</div></div>
      `).join('');

      const chart = document.getElementById('accuracyChart');
      const topics = ['Linear', 'Quad', 'System', 'Triangle', 'Circle', 'Coord', 'Limits'];
      const scores = [95, 88, 76, 92, 84, 78, 85];
      chart.innerHTML = topics.map((t, i) => `
        <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 4px;">
          <div style="width: 100%; background: linear-gradient(180deg, var(--purple), var(--pink)); border-radius: 4px 4px 0 0; height: ${scores[i]}px; min-height: 8px;"></div>
          <span style="font-size: 9px; color: rgba(255,255,255,0.6);">${t}</span>
        </div>
      `).join('');
    }

    // Tab switching
    document.querySelectorAll('.nav-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        const target = tab.dataset.tab;
        if (target === 'practice') {
          renderTopics();
          showScreen('topics');
        } else if (target === 'progress') {
          renderProgress();
          showScreen('progress');
        } else if (target === 'settings') {
          document.getElementById('settingsName').textContent = S.name || '—';
          document.getElementById('settingsLevel').textContent = S.level;
          document.getElementById('settingsCount').textContent = S.solved;
          showScreen('settings');
        }
      });
    });

    // Onboarding
    document.querySelectorAll('.level-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.level-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        S.level = btn.dataset.level;
      });
    });

    document.getElementById('startBtn').addEventListener('click', () => {
      const name = document.getElementById('nameInput').value.trim();
      if (!name) {
        alert('Please enter your name');
        return;
      }
      S.name = name;
      save();
      renderTopics();
      showScreen('topics');
    });

    document.getElementById('settingsBtn').addEventListener('click', showUnlockModal);
    document.getElementById('resetBtn').addEventListener('click', () => {
      if (confirm('Reset all data?')) {
        Object.keys(localStorage).forEach(k => {
          if (k.startsWith('mt_')) localStorage.removeItem(k);
        });
        S.solved = 0;
        S.correct = 0;
        showScreen('onboard');
      }
    });

    // Initialize
    if (S.name) {
      renderTopics();
      showScreen('topics');
    }
  </script>
</body>
</html>
