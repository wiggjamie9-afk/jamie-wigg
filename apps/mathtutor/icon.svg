    <path d="M -20 -10 L -20 20 M -20 -10 L 0 -10 L 5 10 Q 8 15 15 15 L 20 15 L 20 -10"
          fill="none" stroke="url(#math)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
