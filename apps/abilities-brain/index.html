<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abilities Brain – Disability-Centered Lessons</title>
    <style>
        :root {
            --dark-blue: #1a3a4d;
            --gold: #d4a574;
            --light-bg: #f5f3f0;
            --text-dark: #1a1a1a;
            --border-light: #d9d7d2;
            --success: #2d5a3d;
            --font-size: 16px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            font-size: var(--font-size);
            scroll-behavior: smooth;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: var(--light-bg);
            color: var(--text-dark);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Accessibility Controls */
        .accessibility-bar {
            background: var(--dark-blue);
            color: white;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
            border-bottom: 3px solid var(--gold);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .accessibility-bar label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.95rem;
            cursor: pointer;
            user-select: none;
        }

        .accessibility-bar input[type="range"] {
            width: 120px;
            cursor: pointer;
            accent-color: var(--gold);
        }

        .accessibility-bar input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: var(--gold);
        }

        .font-size-display {
            font-weight: 600;
            color: var(--gold);
            min-width: 60px;
        }

        /* Reading Ruler */
        .reading-ruler {
            display: none;
            position: fixed;
            left: 0;
            right: 0;
            height: 32px;
            background: rgba(212, 165, 116, 0.15);
            border-top: 2px solid var(--gold);
            border-bottom: 2px solid var(--gold);
            pointer-events: none;
            z-index: 99;
            top: 50%;
            transform: translateY(-50%);
        }

        .reading-ruler.active {
            display: block;
        }

        /* Main Layout */
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Screen States */
        .screen {
            display: none;
        }

        .screen.active {
            display: block;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Onboarding Screen */
        .onboarding-screen {
            text-align: center;
            padding: 40px 20px;
        }

        .onboarding-screen h1 {
            font-size: 2.2em;
            color: var(--dark-blue);
            margin-bottom: 12px;
            font-weight: 700;
        }

        .onboarding-screen p {
            font-size: 1.1em;
            color: #555;
            margin-bottom: 32px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .track-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 32px;
        }

        .track-card {
            background: white;
            border: 3px solid var(--dark-blue);
            border-radius: 8px;
            padding: 24px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
        }

        .track-card:hover {
            border-color: var(--gold);
            box-shadow: 0 4px 12px rgba(26, 58, 77, 0.15);
            transform: translateY(-2px);
        }

        .track-card:focus-visible {
            outline: 3px solid var(--gold);
            outline-offset: 2px;
        }

        .track-card h2 {
            color: var(--dark-blue);
            font-size: 1.4em;
            margin-bottom: 8px;
        }

        .track-card .lesson-count {
            color: var(--gold);
            font-weight: 600;
            font-size: 0.95em;
        }

        /* Lesson View */
        .lesson-container {
            background: white;
            border: 2px solid var(--dark-blue);
            border-radius: 8px;
            padding: 32px;
            margin-bottom: 24px;
        }

        .lesson-header {
            border-bottom: 3px solid var(--gold);
            padding-bottom: 20px;
            margin-bottom: 24px;
        }

        .lesson-number {
            font-size: 0.9em;
            color: var(--gold);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .lesson-title {
            font-size: 1.8em;
            color: var(--dark-blue);
            margin: 12px 0;
            font-weight: 700;
        }

        .lesson-content p {
            margin-bottom: 16px;
            line-height: 1.7;
            color: var(--text-dark);
        }

        .strength-label {
            display: inline-block;
            background: var(--dark-blue);
            color: white;
            padding: 8px 16px;
            border-radius: 4px;
            font-weight: 600;
            font-size: 0.9em;
            margin-bottom: 24px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .affirmation {
            background: rgba(212, 165, 116, 0.1);
            border-left: 4px solid var(--gold);
            padding: 16px;
            margin: 24px 0;
            border-radius: 4px;
            font-style: italic;
            color: var(--dark-blue);
            font-weight: 500;
        }

        /* Navigation */
        .lesson-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 32px;
            padding-top: 24px;
            border-top: 2px solid var(--border-light);
            flex-wrap: wrap;
            gap: 16px;
        }

        .nav-button {
            background: var(--dark-blue);
            color: white;
            border: 2px solid var(--dark-blue);
            padding: 12px 24px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1em;
            transition: all 0.2s ease;
        }

        .nav-button:hover {
            background: transparent;
            color: var(--dark-blue);
        }

        .nav-button:focus-visible {
            outline: 3px solid var(--gold);
            outline-offset: 2px;
        }

        .nav-button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .lesson-progress {
            font-size: 0.95em;
            color: #666;
            text-align: center;
        }

        /* Progress Panel */
        .progress-panel {
            background: white;
            border: 2px solid var(--dark-blue);
            border-radius: 8px;
            padding: 24px;
            margin-bottom: 24px;
        }

        .progress-panel h2 {
            color: var(--dark-blue);
            margin-bottom: 16px;
            font-size: 1.4em;
        }

        .track-progress {
            margin-bottom: 20px;
        }

        .track-progress-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .track-progress-header h3 {
            color: var(--dark-blue);
            font-weight: 600;
        }

        .track-progress-header .count {
            color: var(--gold);
            font-weight: 600;
        }

        .progress-bar {
            background: var(--border-light);
            height: 12px;
            border-radius: 6px;
            overflow: hidden;
        }

        .progress-fill {
            background: linear-gradient(90deg, var(--dark-blue), var(--gold));
            height: 100%;
            transition: width 0.3s ease;
        }

        .streak-display {
            background: rgba(45, 90, 61, 0.1);
            border: 2px solid var(--success);
            border-radius: 8px;
            padding: 16px;
            margin-top: 16px;
            text-align: center;
        }

        .streak-display .emoji {
            font-size: 2em;
            margin-bottom: 8px;
        }

        .streak-display .number {
            color: var(--success);
            font-weight: 700;
            font-size: 1.6em;
        }

        .streak-display .label {
            color: #666;
            font-size: 0.9em;
            font-weight: 500;
        }

        /* Celebration Popup */
        .celebration-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 200;
            justify-content: center;
            align-items: center;
            padding: 20px;
            animation: fadeIn 0.3s ease;
        }

        .celebration-modal.active {
            display: flex;
        }

        .celebration-content {
            background: white;
            border: 3px solid var(--gold);
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            max-width: 400px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
            animation: celebrateScale 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes celebrateScale {
            from {
                opacity: 0;
                transform: scale(0.85);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .celebration-emoji {
            font-size: 3em;
            margin-bottom: 16px;
            animation: bounce 0.6s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-12px);
            }
        }

        .celebration-content h2 {
            color: var(--dark-blue);
            font-size: 1.8em;
            margin-bottom: 12px;
        }

        .celebration-content p {
            color: #666;
            margin-bottom: 24px;
            font-size: 1.05em;
        }

        .celebration-button {
            background: var(--dark-blue);
            color: white;
            border: none;
            padding: 12px 32px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1em;
        }

        .celebration-button:hover {
            background: var(--gold);
            color: var(--dark-blue);
        }

        /* Read-aloud Button */
        .read-aloud-button {
            background: var(--gold);
            color: var(--dark-blue);
            border: 2px solid var(--gold);
            padding: 10px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.95em;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .read-aloud-button:hover {
            background: transparent;
            color: var(--gold);
        }

        .read-aloud-button.playing {
            animation: pulse 1s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.7;
            }
        }

        .back-button {
            background: transparent;
            color: var(--dark-blue);
            border: 2px solid var(--dark-blue);
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.95em;
            transition: all 0.2s ease;
        }

        .back-button:hover {
            background: var(--dark-blue);
            color: white;
        }

        /* Responsive */
        @media (max-width: 640px) {
            .container {
                padding: 12px;
            }

            .lesson-container {
                padding: 20px;
            }

            .onboarding-screen h1 {
                font-size: 1.8em;
            }

            .onboarding-screen p {
                font-size: 1em;
            }

            .track-grid {
                grid-template-columns: 1fr;
            }

            .lesson-title {
                font-size: 1.4em;
            }

            .accessibility-bar {
                flex-direction: column;
                align-items: stretch;
            }

            .accessibility-bar label {
                justify-content: space-between;
            }

            .accessibility-bar input[type="range"] {
                width: 100%;
            }
        }

        /* Semantic HTML Styling */
        h1, h2, h3 {
            font-weight: 700;
            word-wrap: break-word;
        }

        a {
            color: var(--dark-blue);
            text-decoration: underline;
        }

        a:focus-visible {
            outline: 3px solid var(--gold);
            outline-offset: 2px;
        }

        button:focus-visible {
            outline: 3px solid var(--gold);
            outline-offset: 2px;
        }

        /* Skip to main */
        .skip-to-main {
            position: absolute;
            top: -40px;
            left: 0;
            background: var(--dark-blue);
            color: white;
            padding: 8px 16px;
            text-decoration: none;
            z-index: 100;
        }

        .skip-to-main:focus {
            top: 0;
        }
    </style>
</head>
<body>
    <a href="#main-content" class="skip-to-main">Skip to main content</a>

    <!-- Accessibility Controls -->
    <div class="accessibility-bar" role="region" aria-label="Accessibility controls">
        <label>
            Font Size:
            <input
                type="range"
                id="fontSizeSlider"
                min="14"
                max="24"
                value="16"
                step="1"
                aria-label="Adjust font size from 14px to 24px"
            >
            <span class="font-size-display" id="fontSizeDisplay">16px</span>
        </label>
        <label>
            <input
                type="checkbox"
                id="readingRulerToggle"
                aria-label="Toggle reading ruler visual guide"
            >
            Reading Ruler
        </label>
        <button class="read-aloud-button" id="readAloudButton" aria-label="Read current content aloud">
            🔊 Read Aloud
        </button>
    </div>

    <div class="reading-ruler" id="readingRuler"></div>

    <!-- Main Content -->
    <main id="main-content" class="container">
        <!-- Onboarding Screen -->
        <div id="onboardingScreen" class="screen active onboarding-screen">
            <h1>Abilities Brain</h1>
            <p>Disability-centered lessons for living with purpose, strength, and community.</p>
            <div class="track-grid">
                <button class="track-card" onclick="selectTrack('adaptation')">
                    <h2>Adaptation</h2>
                    <div class="lesson-count">5 lessons</div>
                </button>
                <button class="track-card" onclick="selectTrack('strength')">
                    <h2>Strength</h2>
                    <div class="lesson-count">5 lessons</div>
                </button>
                <button class="track-card" onclick="selectTrack('community')">
                    <h2>Community</h2>
                    <div class="lesson-count">5 lessons</div>
                </button>
                <button class="track-card" onclick="selectTrack('purpose')">
                    <h2>Purpose</h2>
                    <div class="lesson-count">5 lessons</div>
                </button>
            </div>

            <!-- Progress Overview -->
            <div class="progress-panel">
                <h2>Your Progress</h2>
                <div id="progressOverview"></div>
            </div>
        </div>

        <!-- Lesson View Screen -->
        <div id="lessonScreen" class="screen">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 12px;">
                <button class="back-button" onclick="backToOnboarding()">← Back</button>
                <button class="read-aloud-button" id="readAloudButtonLesson" aria-label="Read lesson aloud">
                    🔊 Read Aloud
                </button>
            </div>

            <div class="lesson-container">
                <div class="lesson-header">
                    <div class="lesson-number" id="lessonNumber"></div>
                    <h1 class="lesson-title" id="lessonTitle"></h1>
                </div>

                <div class="strength-label" id="strengthLabel"></div>

                <div class="lesson-content" id="lessonContent"></div>

                <div class="affirmation" id="lessonAffirmation"></div>

                <div class="lesson-nav">
                    <button class="nav-button" id="prevButton" onclick="previousLesson()">← Previous</button>
                    <div class="lesson-progress" id="lessonProgress"></div>
                    <button class="nav-button" id="nextButton" onclick="nextLesson()">Next →</button>
                </div>
            </div>
        </div>
    </main>

    <!-- Celebration Popup -->
    <div class="celebration-modal" id="celebrationModal">
        <div class="celebration-content">
            <div class="celebration-emoji" id="celebrationEmoji">🌟</div>
            <h2>Lesson Complete!</h2>
            <p id="celebrationMessage">You're building wisdom every day.</p>
            <button class="celebration-button" onclick="closeCelebration()">Continue</button>
        </div>
    </div>

    <script>
        // Lessons Data
        const lessons = {
            adaptation: [
                {
                    title: "Adaptation is not the same as acceptance",
                    content: `<p>When we talk about adapting to disability, we're often told we need to "accept" our new reality. But adaptation and acceptance are profoundly different—and that difference matters.</p>
<p>Adaptation is tactical. It's changing how you do things to work with your body and mind. You might use a shower chair, set phone reminders, break work into smaller chunks, or ask friends to text instead of call. These are strategies that honor your actual capacity, not concessions to the "real you" underneath.</p>
<p>Acceptance, especially the kind often pushed on us, can mean making peace with pain, reducing expectations, or internalizing shame about limitations. It can require us to "accept" inaccessible systems, ableist demands, or grief without proper space to process it.</p>
<p>You can adapt your approach to work within your energy levels without accepting the narrative that there's something wrong with you for having them. You can adjust your life and reject the idea that adjustment means giving up. And grief—grief about the life you imagined, about lost function, about systemic barriers—grief is valid. Don't confuse processing grief with accepting limitation as inherent failure.</p>
<p>Adaptation is flexibility in service of your life. It's saying: I know what I need, and I'm going to honor that. That's power, not surrender.</p>`,
                    affirmation: "I can adjust my strategies without adjusting my worth.",
                    strengthLabel: "Wisdom"
                },
                {
                    title: "Energy is currency—spend it wisely",
                    content: `<p>If you live with chronic illness, fatigue, pain, or neurological difference, you likely know spoon theory—the metaphor where each spoon represents a unit of energy. You wake up with a limited budget of spoons, and you have to choose: shower or groceries? Work or social time? Rest or household tasks?</p>
<p>This isn't laziness. This isn't a character flaw. This is the physics of living in a body that doesn't generate unlimited energy.</p>
<p>Energy expenditure is personal and unpredictable. Lifting a water bottle might cost you two spoons on a good day and eight on a flare. Emotional labor burns spoons. Navigating inaccessible spaces costs spoons. Even anticipating pain costs spoons.</p>
<p>Pacing isn't about doing less—it's about spending your real budget rather than going into deficit. When you push past capacity hoping you'll "recover later," you often enter a crash cycle where you lose far more spoons than you borrowed. Respecting your limits now prevents the debt that cascades into days or weeks of immobility.</p>
<p>Real energy management means: knowing roughly what you have (it varies), making intentional choices about how you spend it, and protecting enough reserves for the unexpected. Some days you'll have more spoons. Some days you'll need to do less. Both are okay. Your only job is to spend what you actually have, not what you think you should have.</p>`,
                    affirmation: "My energy is real, my limits are real, and honoring them is wise.",
                    strengthLabel: "Clarity"
                },
                {
                    title: "Your body is not your enemy",
                    content: `<p>We're often taught to "fight" illness and disability—to battle our bodies, overcome them, push through, resist limitation. But your body isn't invading your life. Your body IS your life. And it's trying to communicate.</p>
<p>Pain, fatigue, brain fog, and other symptoms aren't punishments or proof of weakness. They're signals. They're your nervous system saying "I need rest," your inflamed joints saying "this movement isn't sustainable right now," your anxiety saying "something feels unsafe in this environment."</p>
<p>When we reframe from fighting our bodies to listening to them, everything shifts. Instead of suppressing a symptom and pushing harder, you might ask: What is my body telling me right now? What does it need? Am I pushing at an optimal moment or a flare moment? Is this pain about activity level, emotion, environment, or nourishment?</p>
<p>Body literacy—learning your own patterns, triggers, and recovery needs—is a superpower. It takes time. You might need help from people who understand your condition. You might need to experiment. But the more you listen instead of fight, the more you can actually meet your needs instead of fighting yourself.</p>
<p>Your body isn't broken. It's not your enemy. It's been trying to keep you alive with the resources it has. Start treating it like the intelligent, communicative system it is.</p>`,
                    affirmation: "I listen to my body with compassion, not judgment.",
                    strengthLabel: "Listening"
                },
                {
                    title: "Rest is productive",
                    content: `<p>Capitalist culture has sold us a lie: that rest is a reward for productivity, that your worth comes from what you produce, that rest without earned exhaustion is laziness.</p>
<p>In disability culture, we know different. Rest isn't a luxury. Rest is medicine. Rest is maintenance. Rest is what allows your immune system to heal, your nervous system to regulate, your mind to process.</p>
<p>Rest doesn't need to be earned. You don't need to prove you're sick enough or tired enough to deserve it. Rest is your birthright as a human being. Your life has value whether you're producing anything or not.</p>
<p>There are different kinds of rest: sleep, but also stillness, solitude, time in nature, time with people you trust, gentle movement, creativity without purpose, doing absolutely nothing. Sometimes rest is sleeping for 14 hours. Sometimes it's sitting in your room without checking your phone. Sometimes it's saying no.</p>
<p>When you rest deeply and consistently, your body can actually heal. You have more spoons available. You're clearer about what you actually want and need. You become less vulnerable to crisis and burnout. This is the opposite of laziness—it's the most productive thing you can do with your time, because it's the foundation for everything else.</p>
<p>The productivity myth tells you to feel guilty for resting. Disability teaches you to feel powerful for respecting your body's real needs.</p>`,
                    affirmation: "Rest is medicine. I deserve it without explanation.",
                    strengthLabel: "Self-care"
                },
                {
                    title: "Flexibility requires changing the rules",
                    content: `<p>Most systems—work, school, social interaction—are built on inflexible rules. You show up at 9 AM. You sit in a chair for 8 hours. You maintain eye contact. You follow a linear conversation. You attend in person.</p>
<p>These aren't universal truths. They're design choices made by people who didn't have to accommodate any difference. And they're often impossible to maintain when you're disabled.</p>
<p>Real flexibility means changing the structure, not asking the disabled person to magically fit it. That might mean: working from home. Taking breaks every 20 minutes instead of every 2 hours. Communicating via email instead of meetings. Sitting or lying down instead of standing. Attending virtually. Taking longer to complete tasks. Working at night if that's when your energy peaks. Having autonomy over how work gets done.</p>
<p>When you create flexibility in systems, everyone benefits. Parents with young kids work better with flexibility. Neurodivergent people think better with breaks. Older people do better with rest. People with caregiving duties need autonomy. Flexibility isn't a special accommodation for disabled people—it's good design.</p>
<p>Customizing your life for your actual needs isn't "giving up" and fitting into others' structures. It's refusing to sacrifice yourself to an arbitrary system. It's saying: I will design a life that works for me, with me, not against me.</p>`,
                    affirmation: "I design my life around my needs, not around others' defaults.",
                    strengthLabel: "Autonomy"
                }
            ],
            strength: [
                {
                    title: "Strength looks like knowing your limits",
                    content: `<p>In mainstream culture, strength is portrayed as pushing through pain, ignoring limits, never saying no. Stronger, faster, harder, more.</p>
<p>Real strength—the kind that actually sustains you—looks different. It looks like clarity. It looks like a person who can say: "I can do X today, but not Y." A person who understands their capacity and doesn't apologize for it. A person who knows that some days they can work 8 hours and some days they can work 2, and both are truthful.</p>
<p>Knowing your limits requires honest self-assessment. It means tracking what actually happens when you push: Do you crash? How long does recovery take? Is the output worth the cost? And it means practicing self-advocacy—telling people what you need, not asking permission to have needs.</p>
<p>Setting boundaries based on real capacity is an act of strength. It means protecting your energy for what actually matters. It means saying no to protect yourself. It means choosing consistency over heroics—doing sustainable work instead of burning out spectacularly and being unable to function for weeks.</p>
<p>Clarity about capacity is clarity about power. You know what you can actually deliver. You can make promises you keep. You can do work that's sustainable. You're reliable to yourself first, which makes you actually reliable to others. That's strength.</p>`,
                    affirmation: "My limits are real, and respecting them is my greatest strength.",
                    strengthLabel: "Self-Awareness"
                },
                {
                    title: "You are not defined by your diagnosis",
                    content: `<p>When you first get diagnosed with a chronic illness or disability, there's often a moment where you feel like the diagnosis is everything. Like it's the main character in your story now, and you're supporting cast.</p>
<p>Doctors talk about you in terms of your disease. People relate to you based on what's "wrong" with you. You might start introducing yourself by your limitation: "I'm Sarah, I have fibromyalgia." As if that's the most important thing to know.</p>

        // State
        let currentTrack = null;
        let currentLessonIndex = 0;
        let completedLessons = JSON.parse(localStorage.getItem('completedLessons')) || {};
        let streak = JSON.parse(localStorage.getItem('streak')) || 0;
        let lastCompletionDate = localStorage.getItem('lastCompletionDate') || null;

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            renderProgressOverview();
            setupEventListeners();
        });

        function setupEventListeners() {
            document.getElementById('fontSizeSlider').addEventListener('input', (e) => {
                const size = e.target.value;
                document.documentElement.style.setProperty('--font-size', size + 'px');
                document.getElementById('fontSizeDisplay').textContent = size + 'px';
                localStorage.setItem('fontSize', size);
            });

            document.getElementById('readingRulerToggle').addEventListener('change', (e) => {
                document.getElementById('readingRuler').classList.toggle('active', e.target.checked);
                localStorage.setItem('readingRuler', e.target.checked);
            });

            // Restore saved preferences
            const savedSize = localStorage.getItem('fontSize') || '16';
            document.getElementById('fontSizeSlider').value = savedSize;
            document.documentElement.style.setProperty('--font-size', savedSize + 'px');
            document.getElementById('fontSizeDisplay').textContent = savedSize + 'px';

            const savedRuler = localStorage.getItem('readingRuler') === 'true';
            document.getElementById('readingRulerToggle').checked = savedRuler;
            if (savedRuler) {
                document.getElementById('readingRuler').classList.add('active');
            }
        }

        function selectTrack(track) {
            currentTrack = track;
            currentLessonIndex = 0;
            showLesson();
        }

        function showLesson() {
            const lesson = lessons[currentTrack][currentLessonIndex];
            const lessonId = `${currentTrack}-${currentLessonIndex}`;

            document.getElementById('onboardingScreen').classList.remove('active');
            document.getElementById('lessonScreen').classList.add('active');

            document.getElementById('lessonNumber').textContent = `Lesson ${currentLessonIndex + 1} of 5 · ${currentTrack.toUpperCase()}`;
            document.getElementById('lessonTitle').textContent = lesson.title;
            document.getElementById('lessonContent').innerHTML = lesson.content;
            document.getElementById('strengthLabel').textContent = lesson.strengthLabel;
            document.getElementById('lessonAffirmation').textContent = `"${lesson.affirmation}"`;
            document.getElementById('lessonProgress').textContent = `${currentLessonIndex + 1} of 5`;

            const prevBtn = document.getElementById('prevButton');
            const nextBtn = document.getElementById('nextButton');

            prevBtn.disabled = currentLessonIndex === 0;
            nextBtn.disabled = currentLessonIndex === 4;

            window.scrollTo(0, 0);
        }

        function nextLesson() {
            if (currentLessonIndex < 4) {
                markLessonComplete();
                currentLessonIndex++;
                showLesson();
            }
        }

        function previousLesson() {
            if (currentLessonIndex > 0) {
                currentLessonIndex--;
                showLesson();
            }
        }

        function markLessonComplete() {
            const lessonId = `${currentTrack}-${currentLessonIndex}`;
            completedLessons[lessonId] = true;
            localStorage.setItem('completedLessons', JSON.stringify(completedLessons));

            updateStreak();
            showCelebration();
        }

        function updateStreak() {
            const today = new Date().toDateString();
            if (lastCompletionDate !== today) {
                if (lastCompletionDate) {
                    const yesterday = new Date(Date.now() - 86400000).toDateString();
                    if (lastCompletionDate === yesterday) {
                        streak++;
                    } else {
                        streak = 1;
                    }
                } else {
                    streak = 1;
                }
                lastCompletionDate = today;
                localStorage.setItem('streak', streak);
                localStorage.setItem('lastCompletionDate', lastCompletionDate);
            }
        }

        function showCelebration() {
            document.getElementById('celebrationModal').classList.add('active');
        }

        function closeCelebration() {
            document.getElementById('celebrationModal').classList.remove('active');
        }

        function backToOnboarding() {
            currentTrack = null;
            currentLessonIndex = 0;
            document.getElementById('lessonScreen').classList.remove('active');
            document.getElementById('onboardingScreen').classList.add('active');
            renderProgressOverview();
            window.scrollTo(0, 0);
        }

        function renderProgressOverview() {
            const tracks = ['adaptation', 'strength', 'community', 'purpose'];
            let html = '';

            for (const track of tracks) {
                const completed = Object.keys(completedLessons)
                    .filter(k => k.startsWith(track + '-'))
                    .length;
                const total = 5;
                const percent = (completed / total) * 100;

                html += `
                    <div class="track-progress">
                        <div class="track-progress-header">
                            <h3>${track.charAt(0).toUpperCase() + track.slice(1)}</h3>
                            <span class="count">${completed}/${total}</span>
                        </div>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${percent}%"></div>
                        </div>
                    </div>
                `;
            }

            html += `
                <div class="streak-display">
                    <div class="emoji">🔥</div>
                    <div class="number">${streak}</div>
                    <div class="label">day streak</div>
                </div>
            `;

            document.getElementById('progressOverview').innerHTML = html;
        }

        // Read-aloud functionality
        function setupReadAloud(buttonId, contentId) {
            const button = document.getElementById(buttonId);
            if (!button) return;

            button.addEventListener('click', () => {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();

                    const content = document.getElementById(contentId);
                    const text = content ? content.innerText : '';

                    if (text && !button.classList.contains('playing')) {
                        const utterance = new SpeechSynthesisUtterance(text);
                        utterance.rate = 0.95;
                        utterance.pitch = 1;
                        utterance.volume = 1;

                        utterance.onstart = () => {
                            button.classList.add('playing');
                            button.textContent = '⏸ Reading...';
                        };

                        utterance.onend = () => {
                            button.classList.remove('playing');
                            button.textContent = '🔊 Read Aloud';
                        };

                        window.speechSynthesis.speak(utterance);
                    }
                } else {
                    alert('Text-to-speech is not supported in your browser.');
                }
            });
        }

        // Setup read-aloud for both buttons
        const observer = new MutationObserver(() => {
            if (document.getElementById('readAloudButtonLesson').parentElement) {
                setupReadAloud('readAloudButtonLesson', 'lessonContent');
                observer.disconnect();
            }
        });
        observer.observe(document.body, { childList: true, subtree: true });

        setupReadAloud('readAloudButton', 'onboardingScreen');
    </script>
</body>
</html>
