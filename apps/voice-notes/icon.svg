<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#241a33"/>
      <stop offset="100%" stop-color="#08050d"/>
    </radialGradient>
    <linearGradient id="mic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff1f5a"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="180" fill="rgba(255, 31, 90, 0.1)"/>

  <!-- Microphone -->
  <g transform="translate(256, 256)">
    <!-- Mic head -->
    <rect x="-30" y="-70" width="60" height="80" fill="none" stroke="url(#mic)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" rx="30"/>
    <!-- Mic stand -->
    <rect x="-8" y="20" width="16" height="50" fill="none" stroke="url(#mic)" stroke-width="8" stroke-linecap="round"/>
    <!-- Sound waves -->
    <circle cx="0" cy="0" r="60" fill="none" stroke="rgba(255, 31, 90, 0.4)" stroke-width="4"/>
    <circle cx="0" cy="0" r="85" fill="none" stroke="rgba(124, 58, 237, 0.3)" stroke-width="3"/>
  </g>

  <!-- Glow -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="rgba(255, 31, 90, 0.3)" stroke-width="3" opacity="0.6"/>
</svg>
