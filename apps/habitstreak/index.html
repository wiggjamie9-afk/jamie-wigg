<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#08050d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Habit Streak — Habit tracking with streaks and visualizations">
  <title>Habit Streak</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.svg">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{
      --canvas:#08050d;--magenta:#ff1f5a;--purple:#7c3aed;--cyan:#00d8ff;
      --green:#00e887;--gold:#f5c000;--pink:#ff6fc8;
      --bg:#0f0d18;--glass:rgba(255,255,255,.06);--muted:#a0a0b0;--text:#f5f0e8;
    }
    html,body{width:100%;height:100%;background:var(--canvas);color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,Inter,sans-serif;-webkit-font-smoothing:antialiased;
      overflow:hidden;user-select:none;-webkit-user-select:none}
    #app{height:100dvh;display:flex;flex-direction:column;position:relative;z-index:1}
    .header{padding:16px 20px 12px;padding-top:calc(16px + env(safe-area-inset-top, 0px));
      display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(255,255,255,.07)}
    .logo{font-weight:700;font-size:20px;background:linear-gradient(120deg,var(--green),var(--cyan));
      -webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .pro-badge{background:linear-gradient(120deg,var(--magenta),var(--pink));color:#fff;
      font-size:10px;font-weight:700;padding:4px 10px;border-radius:999px;cursor:pointer}
    .content{flex:1;overflow-y:auto;overflow-x:hidden;padding:16px 20px;padding-bottom:calc(72px + env(safe-area-inset-bottom, 16px))}
    .habit-card{background:var(--bg);border:1px solid rgba(255,255,255,.08);border-radius:14px;
      padding:16px;margin-bottom:12px;transition:.2s;cursor:pointer}
    .habit-card:active{transform:scale(.98);opacity:.8}
    .habit-header{display:flex;justify-content:space-between;align-items:start;margin-bottom:8px}
    .habit-title{font-weight:600;font-size:16px}
    .habit-streak{display:flex;align-items:center;gap:6px;font-size:18px;font-weight:700;color:var(--green)}
    .habit-subtitle{font-size:12px;color:var(--muted);margin-bottom:10px}
    .habit-calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin:8px 0}
    .day-box{aspect-ratio:1;border-radius:6px;background:rgba(255,255,255,.05);font-size:11px;
      display:flex;align-items:center;justify-content:center;font-weight:700}
    .day-box.done{background:var(--green);color:#000}
    .day-box.partial{background:rgba(0,232,135,.4);color:var(--green)}
    .habit-action{width:100%;padding:10px;margin-top:8px;background:linear-gradient(120deg,var(--green),var(--cyan));
      border:none;border-radius:10px;color:#000;font-weight:700;cursor:pointer;font-size:14px;transition:.15s}
    .habit-action:active{transform:scale(.96)}
    .habit-action.done{opacity:.6;cursor:not-allowed}
    .empty{text-align:center;color:var(--muted);padding:40px 20px}
    .tabs{position:fixed;bottom:0;left:0;right:0;background:rgba(8,5,13,.95);backdrop-filter:blur(10px);
      border-top:1px solid rgba(255,255,255,.07);display:flex;height:72px;
      padding-bottom:env(safe-area-inset-bottom, 0px)}
    .tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
      border:none;background:none;color:var(--muted);cursor:pointer;font-size:11px;font-weight:600;
      gap:4px;transition:.2s}
    .tab.active{color:var(--green)}
    .fab{position:absolute;bottom:calc(72px + env(safe-area-inset-bottom, 16px) + 16px);
      right:20px;width:56px;height:56px;border-radius:999px;border:none;
      background:linear-gradient(120deg,var(--green),var(--cyan));color:#fff;
      font-size:24px;cursor:pointer;transition:.2s;box-shadow:0 4px 16px rgba(0,232,135,.3)}
    .fab:active{transform:scale(.92)}
    .modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;
      z-index:100;animation:slideUp .3s ease}
    .modal.active{display:flex}
    .modal-content{background:var(--canvas);width:100%;border-radius:20px 20px 0 0;padding:24px;
      padding-top:12px;padding-bottom:calc(24px + env(safe-area-inset-bottom, 16px));max-height:90dvh;
      overflow-y:auto}
    .modal-header{font-size:18px;font-weight:700;margin-bottom:16px;display:flex;justify-content:space-between}
    .modal-close{background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer}
    .form-group{margin-bottom:16px}
    .form-label{display:block;font-size:13px;font-weight:600;color:var(--muted);
      text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
    .form-input{width:100%;padding:12px 14px;background:var(--bg);border:1px solid rgba(255,255,255,.08);
      border-radius:10px;color:var(--text);font-family:inherit;font-size:15px;outline:none}
    .form-input:focus{border-color:var(--green)}
    .btn-primary{width:100%;padding:14px;background:linear-gradient(120deg,var(--green),var(--cyan));
      color:#000;border:none;border-radius:12px;font-weight:700;font-size:15px;cursor:pointer;
      transition:.2s;margin-top:16px}
    .btn-primary:active{transform:scale(.98)}
    @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
  </style>
</head>
<body>
<div id="app">
  <div class="header">
    <div class="logo">🔥 Habit Streak</div>
    <div class="pro-badge" id="proBadge">FREE</div>
  </div>
  <div class="content" id="content">
    <div id="habitsContainer"></div>
    <div class="empty" id="emptyState" style="display:none">No habits yet. Tap + to start!</div>
  </div>
  <button class="fab" id="fabBtn">+</button>
  <div class="tabs">
    <button class="tab active" data-view="active">✨ Active</button>
    <button class="tab" data-view="completed">🏆 Archived</button>
  </div>
</div>

<div class="modal" id="modal">
  <div class="modal-content">
    <div class="modal-header">
      <span>New Habit</span>
      <button class="modal-close" id="modalClose">&times;</button>
    </div>
    <div class="form-group">
      <label class="form-label">Habit</label>
      <input class="form-input" id="formTitle" placeholder="e.g., Morning Meditation">
    </div>
    <div class="form-group">
      <label class="form-label">Category</label>
      <input class="form-input" id="formCategory" placeholder="e.g., Health, Productivity">
    </div>
    <button class="btn-primary" id="formSubmit">Create Habit</button>
  </div>
</div>

<script>
  if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');

  const MAX_FREE=5;
  let habits=[], proStatus=false, currentView='active';

  function load(){
    const saved=localStorage.getItem('habits');
    habits=saved?JSON.parse(saved):[];
    proStatus=localStorage.getItem('habits-pro')==='1';
    updateUI();
  }

  function save(){
    localStorage.setItem('habits', JSON.stringify(habits));
  }

  function getTodayKey(){
    const d=new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }

  function addHabit(){
    const title=document.getElementById('formTitle').value.trim();
    const category=document.getElementById('formCategory').value.trim();

    if(!title){
      alert('Habit name required');
      return;
    }

    const active=habits.filter(h=>!h.archived).length;
    if(!proStatus && active>=MAX_FREE){
      alert('Free tier limited to '+MAX_FREE+' active habits');
      return;
    }

    habits.push({
      id:Date.now(),
      title, category,
      streak:0, lastDate:null,
      log:{}, archived:false,
      createdAt:new Date().toISOString()
    });

    save();
    closeModal();
    updateUI();
  }

  function toggleHabit(id){
    const today=getTodayKey();
    const habit=habits.find(h=>h.id===id);
    if(habit){
      habit.log[today]=!habit.log[today];
      if(habit.log[today]){
        habit.lastDate=today;
        habit.streak=calcStreak(habit);
      }
      save();
      updateUI();
    }
  }

  function calcStreak(habit){
    const today=new Date();
    let streak=0;
    for(let i=0;i<365;i++){
      const d=new Date(today);
      d.setDate(d.getDate()-i);
      const key=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      if(habit.log[key]){
        streak++;
      } else if(i>0){
        break;
      }
    }
    return streak;
  }

  function deleteHabit(id){
    if(confirm('Delete this habit?')){
      habits=habits.filter(h=>h.id!==id);
      save();
      updateUI();
    }
  }

  function openModal(){
    document.getElementById('formTitle').value='';
    document.getElementById('formCategory').value='';
    document.getElementById('modal').classList.add('active');
  }

  function closeModal(){
    document.getElementById('modal').classList.remove('active');
  }

  function getLast30Days(){
    const days=[];
    for(let i=29;i>=0;i--){
      const d=new Date();
      d.setDate(d.getDate()-i);
      days.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`);
    }
    return days;
  }

  function getFilteredHabits(){
    if(currentView==='completed') return habits.filter(h=>h.archived);
    return habits.filter(h=>!h.archived);
  }

  function updateUI(){
    const container=document.getElementById('habitsContainer');
    const filtered=getFilteredHabits();
    const days30=getLast30Days();

    container.innerHTML=filtered.map(h=>{
      const isDone=h.log[getTodayKey()];
      return `
      <div class="habit-card">
        <div class="habit-header">
          <div class="habit-title">${h.title}</div>
          <div class="habit-streak">🔥 ${h.streak}</div>
        </div>
        <div class="habit-subtitle">${h.category||'Habit'}</div>
        <div class="habit-calendar">
          ${days30.map(d=>
            `<div class="day-box ${h.log[d]?'done':''}"></div>`
          ).join('')}
        </div>
        <button class="habit-action ${isDone?'done':''}" onclick="toggleHabit(${h.id})">
          ${isDone?'✓ Logged Today':'Log Today'}
        </button>
        <button class="habit-action" style="background:rgba(255,31,90,.3);color:var(--magenta);margin-top:6px" onclick="deleteHabit(${h.id})">Delete</button>
      </div>
      `;
    }).join('');

    document.getElementById('emptyState').style.display=filtered.length?'none':'block';
  }

  document.getElementById('fabBtn').addEventListener('click', openModal);
  document.getElementById('modalClose').addEventListener('click', closeModal);
  document.getElementById('formSubmit').addEventListener('click', addHabit);
  document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click', e=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    e.target.classList.add('active');
    currentView=e.target.dataset.view;
    updateUI();
  }));

  load();
</script>
</body>
</html>
