<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#9333EA">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Water Tracker – Stay Hydrated</title>
    <style>
        :root {
            --primary: #9333EA;
            --accent: #F97316;
            --secondary: #3B82F6;
            --success: #10B981;
            --bg: #0F172A;
            --light: #1E293B;
            --text: #F1F5F9;
            --text-secondary: #CBD5E1;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
        .container { max-width: 480px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: max(20px, env(safe-area-inset-left)); }
        .header { text-align: center; margin-bottom: 40px; }
        .header h1 { font-size: 32px; margin-bottom: 8px; background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .header p { color: var(--text-secondary); font-size: 14px; }
        .glass { width: 120px; height: 160px; border: 3px solid var(--primary); border-radius: 12px; display: flex; align-items: flex-end; justify-content: center; overflow: hidden; position: relative; background: rgba(147, 51, 234, 0.05); }
        .glass-fill { width: 100%; background: linear-gradient(180deg, var(--primary) 0%, var(--accent) 100%); transition: height 0.4s ease-out; }
        .glass-label { text-align: center; margin: 20px 0; font-size: 28px; font-weight: 700; background: linear-gradient(135deg, var(--primary), var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .button-group { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 28px; width: 100%; max-width: 300px; }
        button { padding: 14px; border: none; border-radius: 10px; background: var(--primary); color: white; font-weight: 600; cursor: pointer; font-size: 14px; transition: all 0.2s; min-height: 44px; }
        button:active { transform: scale(0.95); }
        button:hover { background: #7e22ce; }
        .reset-btn { grid-column: 1/3; background: linear-gradient(135deg, var(--accent) 0%, #ea580c 100%); }
        .reset-btn:hover { background: linear-gradient(135deg, #ea580c 0%, var(--accent) 100%); }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💧 Water Tracker</h1>
            <p>Stay hydrated every day</p>
        </div>

        <div class="glass">
            <div class="glass-fill" id="fill" style="height: 0%;"></div>
        </div>

        <div class="glass-label" id="label">0L / 2L</div>

        <div class="button-group">
            <button onclick="addWater(0.25)">+250ml</button>
            <button onclick="addWater(0.5)">+500ml</button>
            <button onclick="addWater(0.75)">+750ml</button>
            <button onclick="addWater(1)">+1L</button>
            <button class="reset-btn" onclick="resetWater()">Reset</button>
        </div>
    </div>

    <script>
        let waterIntake = 0;
        const goal = 2;

        function addWater(amount) {
            waterIntake = Math.min(waterIntake + amount, goal);
            updateDisplay();
        }

        function resetWater() {
            waterIntake = 0;
            updateDisplay();
        }

        function updateDisplay() {
            const pct = (waterIntake / goal) * 100;
            document.getElementById('fill').style.height = pct + '%';
            document.getElementById('label').textContent = waterIntake.toFixed(1) + 'L / ' + goal + 'L';
        }

        updateDisplay();
    </script>
</body>
</html>
