<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>45 Food Nutrition Buddies — Find Yours</title>
  <meta name="theme-color" content="#05060d">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    :root { --bg: #05060d; --ink: #f4f6fb; --muted: #9aa3b8; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--ink);
      display: flex; flex-direction: column;
      padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    }

    @keyframes drift { 0% { transform: translate3d(-4%,-2%,0) scale(1.05);} 100% { transform: translate3d(4%,3%,0) scale(1.15);} }
    body::before {
      content:''; position: fixed; inset: -10%;
      background:
        radial-gradient(38% 32% at 22% 18%, rgba(139,92,246,.30), transparent 70%),
        radial-gradient(34% 30% at 82% 26%, rgba(59,130,246,.26), transparent 70%),
        radial-gradient(42% 38% at 50% 96%, rgba(236,72,153,.22), transparent 70%);
      filter: blur(20px);
      animation: drift 18s ease-in-out infinite alternate;
      pointer-events:none; z-index:0;
    }

    .header { position: relative; z-index: 3; text-align: center; padding: 20px 20px 6px; }
    .header h1 {
      font-size: 28px; font-weight: 800; letter-spacing: -.4px;
      background: linear-gradient(135deg,#d6c7ff,#a8c9ff);
      -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
    }
    .header p { font-size: 14px; color: var(--muted); margin-top: 8px; }

    .chips { position: relative; z-index: 3; display:flex; gap:8px; overflow-x:auto; padding:12px 18px 4px; scrollbar-width:none; }
    .chips::-webkit-scrollbar { display:none; }
    .chip {
      flex:0 0 auto; padding:8px 15px; border-radius:100px;
      background: rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12);
      color:#cdd5e6; font-size:12.5px; font-weight:600; cursor:pointer; white-space:nowrap;
      -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
      transition: all .25s cubic-bezier(.34,1.56,.64,1);
    }
    .chip.active { background:#fff; color:#0b1020; border-color:#fff; }

    .carousel {
      position: relative; z-index: 1; flex:1;
      display:flex; align-items:center;
      overflow-x:scroll; overflow-y:hidden;
      scroll-snap-type: x mandatory; -webkit-overflow-scrolling:touch; scroll-behavior:smooth;
      scrollbar-width:none; scroll-padding:0 8vw; padding: 6px 8vw 2px;
    }
    .carousel::-webkit-scrollbar { display:none; }

    .card {
      flex:0 0 84vw; max-width: 400px;
      height: min(70vh, 600px);
      scroll-snap-align:center;
      margin-right: 4vw;
      position: relative; overflow:hidden;
      border-radius: 34px;
      border: 1px solid rgba(255,255,255,.14);
      box-shadow: 0 30px 70px -24px rgba(0,0,0,.75), inset 0 1px 0 rgba(255,255,255,.18);
      transform: scale(.9); opacity:.5;
      transition: transform .45s cubic-bezier(.34,1.56,.64,1), opacity .45s ease;
      cursor:pointer;
      background: #0a0c16;
      isolation: isolate;
    }
    .card:last-child { margin-right:0; }
    .card.is-center { transform: scale(1); opacity:1; }

    .art {
      position:absolute; inset:0; z-index:0;
      background:
        radial-gradient(120% 80% at 50% -10%, color-mix(in srgb, var(--glow) 70%, #1b2236) 0%, transparent 60%),
        linear-gradient(160deg, color-mix(in srgb, var(--glow) 42%, #0a0c16) 0%, #07080f 78%);
    }
    .art::after {
      content:''; position:absolute; inset:0;
      background: radial-gradient(60% 40% at 70% 18%, rgba(255,255,255,.20), transparent 60%);
    }

    .card-content {
      position:absolute; inset:0; z-index:1; padding:32px; display:flex; flex-direction:column; justify-content:flex-end;
    }

    .card-emoji {
      position:absolute; top:20px; left:20px; z-index:2; font-size:48px;
    }

    .card h2 {
      font-size:20px; font-weight:700; margin-bottom:6px; line-height:1.2;
    }

    .card .spec {
      font-size:12px; color:rgba(255,255,255,.65); margin-bottom:16px; line-height:1.5;
    }

    .card .action {
      padding:10px 16px; background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.2);
      border-radius:8px; color:#fff; font-size:12px; font-weight:600; text-align:center;
      cursor:pointer; transition:all .2s;
    }

    .card .action:hover { background:rgba(255,255,255,.18); }

    .counter {
      position:fixed; bottom:32px; left:50%; transform:translateX(-50%);
      background:rgba(255,255,255,.08); backdrop-filter:blur(12px); border:1px solid rgba(255,255,255,.12);
      padding:12px 20px; border-radius:100px; font-size:13px; color:#999; z-index:10;
    }

    @media (max-width:768px) {
      .header h1 { font-size:24px; }
      .card { flex:0 0 90vw; max-width:100%; }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🥗 45 Food Nutrition Buddies</h1>
    <p>Find your personalized nutrition guide</p>
  </div>

  <div class="chips">
    <div class="chip active" onclick="filterBuddies('all')">All Buddies</div>
    <div class="chip" onclick="filterBuddies('age')">By Age</div>
    <div class="chip" onclick="filterBuddies('disability')">Accessibility</div>
    <div class="chip" onclick="filterBuddies('medical')">Medical</div>
    <div class="chip" onclick="filterBuddies('diet')">Diet & Lifestyle</div>
  </div>

  <div class="carousel" id="carousel">
    <!-- Cards inserted here -->
  </div>

  <div class="counter">
    <span id="counter">1</span> / 45
  </div>

  <script>
    const BUDDIES = [
      {id:1,name:"Baby Nutrition Guide",emoji:"👶",spec:"0-3 years • Introduce solids safely",glow:"#8b5cf6",category:"age"},
      {id:2,name:"Preschool Food Explorer",emoji:"🧒",spec:"3-5 years • Picky eating is normal",glow:"#3b82f6",category:"age"},
      {id:3,name:"Early Primary Nutrition",emoji:"👧",spec:"5-8 years • School lunch packing",glow:"#ec4899",category:"age"},
      {id:4,name:"Late Primary Buddy",emoji:"🧑",spec:"8-11 years • Sports & energy",glow:"#10b981",category:"age"},
      {id:5,name:"Teen Nutrition Coach",emoji:"👨",spec:"12-17 years • Performance & autonomy",glow:"#f59e0b",category:"age"},
      {id:6,name:"Young Adult Nutrition",emoji:"🧑",spec:"18-30 years • Budget & busy schedules",glow:"#06b6d4",category:"age"},
      {id:7,name:"Adult Wellness Coach",emoji:"🧑",spec:"30-50 years • Metabolism changes",glow:"#6366f1",category:"age"},
      {id:8,name:"Mature Adult Nutritionist",emoji:"👴",spec:"50-70 years • Bone & heart health",glow:"#8b5cf6",category:"age"},
      {id:9,name:"Elderly Care Nutrition",emoji:"👵",spec:"70+ years • Appetite & swallowing",glow:"#14b8a6",category:"age"},
      {id:10,name:"Cerebral Palsy Specialist",emoji:"🤝",spec:"Movement challenges • Safe eating",glow:"#d946ef",category:"disability"},
      {id:11,name:"Autism Nutrition Coach",emoji:"🧠",spec:"Sensory preferences • Clear structure",glow:"#f97316",category:"disability"},
      {id:12,name:"ADHD Meal Structure",emoji:"⏰",spec:"Executive function • Sustained energy",glow:"#06b6d4",category:"disability"},
      {id:13,name:"Dysphagia Specialist",emoji:"🍽️",spec:"Swallowing difficulty • Texture safe",glow:"#14b8a6",category:"disability"},
      {id:14,name:"Blind/Low Vision Guide",emoji:"👁️",spec:"Kitchen safety • Eating independence",glow:"#d946ef",category:"disability"},
      {id:15,name:"Allergies Coach",emoji:"🚫",spec:"Allergy management • Cross-contamination",glow:"#f97316",category:"disability"},
      {id:16,name:"Eating Disorder Recovery",emoji:"💚",spec:"Gentle recovery • Food freedom",glow:"#3b82f6",category:"disability"},
      {id:17,name:"Crohn's & IBS Coach",emoji:"🫀",spec:"Digestive disease • Trigger management",glow:"#ec4899",category:"disability"},
      {id:18,name:"Gym & Strength Coach",emoji:"💪",spec:"Muscle building • Sports fueling",glow:"#10b981",category:"medical"},
      {id:19,name:"Gastric Sleeve Specialist",emoji:"⚖️",spec:"Post-op recovery • Nutrition phases",glow:"#f59e0b",category:"medical"},
      {id:20,name:"Gastric Bypass Coach",emoji:"⚖️",spec:"Post-op malabsorption • Supplements",glow:"#06b6d4",category:"medical"},
      {id:21,name:"Gastric Band Helper",emoji:"📊",spec:"Band adjustments • Portion management",glow:"#6366f1",category:"medical"},
      {id:22,name:"Athletic Performance",emoji:"⚡",spec:"Sport nutrition • Competition fueling",glow:"#8b5cf6",category:"medical"},
      {id:23,name:"Post-Illness Recovery",emoji:"💪",spec:"Cancer/surgery recovery • Rebuilding",glow:"#14b8a6",category:"medical"},
      {id:24,name:"Fussy Eater Champion",emoji:"🍽️",spec:"Kids 3-8 • Playful food exploration",glow:"#d946ef",category:"diet"},
      {id:25,name:"Picky Eater Coach",emoji:"🥕",spec:"Kids 5-12 • Systematic expansion",glow:"#f97316",category:"diet"},
      {id:26,name:"Kids Cooking Mentor",emoji:"👨‍🍳",spec:"Food confidence • Kitchen skills",glow:"#06b6d4",category:"diet"},
      {id:27,name:"Family Meal Planner",emoji:"👨‍👩‍👧‍👦",spec:"Multi-generational • Diverse preferences",glow:"#14b8a6",category:"diet"},
      {id:28,name:"Parent Feeder Coach",emoji:"👶",spec:"Disabled children • Feeding support",glow:"#d946ef",category:"diet"},
      {id:29,name:"Appetite Loss Helper",emoji:"🍴",spec:"Elderly • Rebuilding appetite",glow:"#f97316",category:"diet"},
      {id:30,name:"Elderly Swallowing Specialist",emoji:"🥘",spec:"Advanced dysphagia • Dignity",glow:"#3b82f6",category:"diet"},
      {id:31,name:"Diabetic Nutrition Coach",emoji:"🍬",spec:"Blood sugar management • Prevention",glow:"#ec4899",category:"medical"},
      {id:32,name:"Heart Health Specialist",emoji:"❤️",spec:"Cardiovascular • Mediterranean diet",glow:"#10b981",category:"medical"},
      {id:33,name:"Kidney Disease Coach",emoji:"🫘",spec:"Phosphorus/potassium • Renal diet",glow:"#f59e0b",category:"medical"},
      {id:34,name:"Cancer Nutrition",emoji:"🍎",spec:"Treatment support • Recovery nutrition",glow:"#06b6d4",category:"medical"},
      {id:35,name:"Pregnancy & Postpartum",emoji:"🤰",spec:"Weight gain • Breastfeeding • Recovery",glow:"#6366f1",category:"medical"},
      {id:36,name:"Budget Meal Planner",emoji:"💰",spec:"$5/day family • Whole foods",glow:"#8b5cf6",category:"diet"},
      {id:37,name:"Plant-Based Expert",emoji:"🥬",spec:"Vegan/vegetarian • Complete proteins",glow:"#14b8a6",category:"diet"},
      {id:38,name:"Keto Specialist",emoji:"🥑",spec:"Low-carb nutrition • Sustainability",glow:"#d946ef",category:"diet"},
      {id:39,name:"Mediterranean Coach",emoji:"🫒",spec:"Heart health • Joy in eating",glow:"#f97316",category:"diet"},
      {id:40,name:"Sustainable Eating Guide",emoji:"🌱",spec:"Local • Seasonal • Climate-conscious",glow:"#3b82f6",category:"diet"},
      {id:41,name:"Food Allergy Avoider",emoji:"🚫",spec:"Cross-contamination • Label mastery",glow:"#ec4899",category:"disability"},
      {id:42,name:"Intuitive Eating Coach",emoji:"🧘",spec:"Hunger/fullness • Food freedom",glow:"#10b981",category:"diet"},
      {id:43,name:"Stress Eating Helper",emoji:"😌",spec:"Emotional eating • Self-compassion",glow:"#f59e0b",category:"diet"},
      {id:44,name:"Athletic Recovery Coach",emoji:"🏃",spec:"Sports periodization • Meal timing",glow:"#06b6d4",category:"medical"},
      {id:45,name:"Nutrition & Mental Health",emoji:"🧠",spec:"Gut-brain • Mood nutrition",glow:"#6366f1",category:"diet"}
    ];

    let currentIndex = 0;

    function renderCards(filter = 'all') {
      const carousel = document.getElementById('carousel');
      carousel.innerHTML = '';

      let filtered = BUDDIES;
      if (filter !== 'all') {
        filtered = BUDDIES.filter(b => {
          if (filter === 'age') return b.category === 'age';
          if (filter === 'disability') return b.category === 'disability';
          if (filter === 'medical') return b.category === 'medical';
          if (filter === 'diet') return b.category === 'diet';
          return true;
        });
      }

      filtered.forEach((buddy, idx) => {
        const card = document.createElement('div');
        card.className = 'card' + (idx === 0 ? ' is-center' : '');
        card.style.setProperty('--glow', buddy.glow);
        card.onclick = () => window.location.href = `food-buddy-${buddy.id}.html`;

        card.innerHTML = `
          <div class="art"></div>
          <div class="card-content">
            <div class="card-emoji">${buddy.emoji}</div>
            <h2>${buddy.name}</h2>
            <div class="spec">${buddy.spec}</div>
            <div class="action">Open Buddy</div>
          </div>
        `;
        carousel.appendChild(card);
      });

      updateCounter();
      observeCards();
    }

    function updateCounter() {
      const carousel = document.getElementById('carousel');
      const cards = carousel.querySelectorAll('.card');
      const scrollPercentage = carousel.scrollLeft / (carousel.scrollWidth - carousel.clientWidth);
      currentIndex = Math.round(scrollPercentage * (cards.length - 1));
      document.getElementById('counter').textContent = currentIndex + 1;
    }

    function observeCards() {
      const carousel = document.getElementById('carousel');
      const cards = carousel.querySelectorAll('.card');

      const observer = new IntersectionObserver(entries => {
        entries.forEach(entry => {
          if (entry.isIntersecting && entry.intersectionRatio > 0.5) {
            entry.target.classList.add('is-center');
          } else {
            entry.target.classList.remove('is-center');
          }
        });
      }, { threshold: 0.5 });

      cards.forEach(card => observer.observe(card));
    }

    function filterBuddies(filter) {
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      event.target.classList.add('active');
      currentIndex = 0;
      renderCards(filter);
    }

    document.getElementById('carousel').addEventListener('scroll', updateCounter);
    renderCards();
  </script>
</body>
</html>
