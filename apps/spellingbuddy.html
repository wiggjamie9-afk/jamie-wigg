<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#08050d">
    <title>SpellingBuddy</title>
    <style>
        :root { --canvas:#08050d; --green:#00e887; --red:#ff1f5a; --cyan:#00d8ff; --purple:#7c3aed; --text:#fff; --text-muted:#aaa; }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:var(--canvas); color:var(--text); min-height:100vh; padding-bottom:80px; }
        .header { padding:20px; border-bottom:1px solid rgba(0,232,135,0.2); display:flex; justify-content:space-between; }
        h1 { font-size:24px; font-weight:700; }
        .badge { background:var(--green); color:var(--canvas); padding:4px 12px; border-radius:20px; font-size:11px; }
        .content { padding:20px; }
        .word-card { background:rgba(0,232,135,0.05); border:1px solid rgba(0,232,135,0.2); border-radius:8px; padding:20px; margin:15px 0; text-align:center; }
        .word-display { font-size:28px; font-weight:700; color:var(--cyan); margin:15px 0; }
        .pronunciation { font-size:12px; color:var(--text-muted); margin:10px 0; }
        input { background:rgba(0,232,135,0.05); border:1px solid rgba(0,232,135,0.2); border-radius:6px; color:var(--text); padding:10px; margin:8px 0; width:100%; text-align:center; font-size:16px; }
        button { background:var(--green); color:var(--canvas); border:0; padding:10px 16px; border-radius:6px; cursor:pointer; font-weight:600; width:100%; }
        .feedback { padding:12px; border-radius:6px; margin:10px 0; text-align:center; font-weight:600; }
        .correct { background:rgba(0,232,135,0.3); color:var(--green); }
        .incorrect { background:rgba(255,31,90,0.3); color:var(--red); }
        .word-list { margin:15px 0; }
        .word-item { background:rgba(0,232,135,0.05); border-left:3px solid var(--cyan); padding:12px; margin:8px 0; border-radius:4px; }
        .panel { display:none; }
        .panel.on { display:block; }
        .tabs { position:fixed; bottom:0; left:0; right:0; background:var(--canvas); border-top:1px solid rgba(0,232,135,0.2); display:flex; justify-content:space-around; height:70px; z-index:100; }
        .tab { flex:1; background:0; border:0; color:var(--text-muted); cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:12px; }
        .tab.on { color:var(--green); }
        .premium { background:rgba(124,58,237,0.1); border-left:3px solid var(--purple); padding:12px; margin-top:20px; border-radius:4px; font-size:13px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>✏️ SpellingBuddy</h1>
        <div class="badge">FREE</div>
    </div>
    <div class="content">
        <div id="practice" class="panel on">
            <div class="word-card">
                <div style="font-size:12px;color:var(--text-muted)">Spell this word:</div>
                <button onclick="playAudio()" style="background:var(--cyan);color:var(--canvas);margin:10px 0;padding:8px">🔊 Hear it</button>
                <div class="word-display" id="hint">???</div>
                <input type="text" id="answer" placeholder="Type the word..." onkeypress="if(event.key==='Enter')checkSpelling()">
                <button onclick="checkSpelling()">Check</button>
                <div id="feedback"></div>
            </div>
            <div style="display:flex;gap:10px">
                <button onclick="showAnswer()" style="background:var(--purple)">Hint</button>
                <button onclick="nextWord()" style="background:var(--cyan);color:var(--canvas)">Next →</button>
            </div>
            <div class="premium">💎 Premium: Custom word lists & pronunciation training</div>
        </div>
        
        <div id="progress" class="panel">
            <div class="word-list" id="word-progress"></div>
        </div>
    </div>
    <div class="tabs">
        <button class="tab on" data-p="practice">📝 Practice</button>
        <button class="tab" data-p="progress">📊 Progress</button>
    </div>
    <script>
        const words = [
            {w:'Beautiful',p:'beau-ti-ful',def:'Pleasing to the eye'},
            {w:'Necessary',p:'nec-es-sar-y',def:'Required or needed'},
            {w:'Rhythm',p:'rhy-thm',def:'Pattern of sounds'},
            {w:'Accommodate',p:'a-com-mo-date',def:'Provide lodging'},
            {w:'Conscience',p:'con-science',def:'Sense of right/wrong'}
        ];
        
        let idx = 0;
        let correct = 0;
        
        function draw() {
            let w = words[idx];
            document.getElementById('hint').textContent = w.w.split('').map((_, i) => '?').join('');
            document.getElementById('answer').value = '';
            document.getElementById('feedback').innerHTML = '';
        }
        
        function playAudio() {
            let utterance = new SpeechSynthesisUtterance(words[idx].w);
            speechSynthesis.speak(utterance);
        }
        
        function showAnswer() {
            let w = words[idx];
            document.getElementById('hint').textContent = w.w;
        }
        
        function checkSpelling() {
            let ans = document.getElementById('answer').value.trim().toLowerCase();
            let w = words[idx].w.toLowerCase();
            let fb = document.getElementById('feedback');
            
            if (ans === w) {
                fb.innerHTML = '<div class="feedback correct">✓ Correct! ' + words[idx].def + '</div>';
                correct++;
                setTimeout(nextWord, 1500);
            } else {
                fb.innerHTML = '<div class="feedback incorrect">✗ Incorrect. The word is: ' + words[idx].w + '</div>';
            }
        }
        
        function nextWord() {
            idx = (idx + 1) % words.length;
            draw();
        }
        
        document.querySelectorAll('.tab').forEach(t => {
            t.onclick = () => {
                document.querySelectorAll('.tab').forEach(x => x.classList.remove('on'));
                document.querySelectorAll('.panel').forEach(x => x.classList.remove('on'));
                t.classList.add('on');
                let p = t.dataset.p;
                document.getElementById(p).classList.add('on');
                if (p === 'progress') {
                    document.getElementById('word-progress').innerHTML = words.map((w, i) =>
                        `<div class="word-item"><div style="font-weight:600">${w.w}</div><div style="font-size:12px;color:var(--text-muted)">${w.p}</div></div>`
                    ).join('');
                }
            };
        });
        
        draw();
        if ('serviceWorker' in navigator) navigator.serviceWorker.register('data:application/javascript,self.addEventListener("install",e=>self.skipWaiting());');
    </script>
</body>
</html>
