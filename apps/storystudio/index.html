<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#08050d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="description" content="StoryStudio — Story templates, fill-in-the-blank generator, export">
  <title>StoryStudio</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.svg">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{--canvas:#08050d;--bg:#0f0d18;--muted:#a0a0b0;--text:#f5f0e8;--green:#00e887;--red:#ff1f5a;--cyan:#00d8ff;--purple:#7c3aed}
    html,body{width:100%;height:100%;background:var(--canvas);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
    #app{height:100dvh;display:flex;flex-direction:column;z-index:1}
    .header{padding:16px 20px 12px;padding-top:calc(16px + env(safe-area-inset-top,0px));border-bottom:1px solid rgba(255,255,255,.07);display:flex;justify-content:space-between;align-items:center}
    .logo{font-weight:700;font-size:18px;background:linear-gradient(120deg,#00e887,#00d8ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .badge{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;font-weight:700}
    .content{flex:1;overflow-y:auto;padding:16px 20px;padding-bottom:calc(72px + env(safe-area-inset-bottom,16px))}
    .card{background:var(--bg);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:16px;margin-bottom:12px}
    .card-title{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:8px}
    .card-value{font-size:24px;font-weight:700;color:var(--green);margin:8px 0}
    .input-group{display:flex;gap:8px;margin-bottom:12px}
    .input-group input{flex:1;padding:10px 12px;background:var(--bg);border:1px solid rgba(255,255,255,.08);border-radius:10px;color:var(--text);font-size:14px;outline:none}
    .input-group button{padding:10px 16px;background:linear-gradient(120deg,var(--green),var(--cyan));border:none;border-radius:10px;color:#000;font-weight:700;cursor:pointer;font-size:13px}
    .tabs{position:fixed;bottom:0;left:0;right:0;background:rgba(8,5,13,.95);border-top:1px solid rgba(255,255,255,.07);display:flex;height:72px;padding-bottom:env(safe-area-inset-bottom,0px)}
    .tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border:none;background:none;color:var(--muted);cursor:pointer;font-size:11px;font-weight:600;gap:4px}
    .tab.active{color:var(--green)}
    .list-item{background:var(--bg);border-left:4px solid var(--green);border-radius:10px;padding:12px;margin-bottom:8px;font-size:13px}
    .pro-hint{font-size:11px;color:var(--red);margin-top:8px;font-weight:600}
  </style>
</head>
<body>
<div id="app">
  <div class="header">
    <div class="logo">StoryStudio</div>
    <div class="badge">FREE</div>
  </div>
  <div class="content" id="content">
    <div class="card">
      <div class="card-title">Welcome</div>
      <div style="color:var(--muted);font-size:14px;line-height:1.5">
        Story templates, fill-in-the-blank generator, export
      </div>
      <div class="pro-hint">💎 Premium features unlock advanced tools</div>
    </div>
  </div>
  <div class="tabs">
    <button class="tab active" onclick="showView('main')">📱 Main</button>
    <button class="tab" onclick="showView('info')">ℹ️ Info</button>
  </div>
</div>

<script>
  if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
  
  function showView(v){
    document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',(['main','info'][i]===v)));
  }
  
  // Load from localStorage
  const data = JSON.parse(localStorage.getItem('storystudio') || '{}');
  console.log('App storystudio loaded');
</script>
</body>
</html>
