<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#08050d">
    <title>VoiceJournal</title>
    <style>
        :root { --canvas:#08050d; --green:#00e887; --red:#ff1f5a; --cyan:#00d8ff; --purple:#7c3aed; --text:#fff; --text-muted:#aaa; }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:var(--canvas); color:var(--text); min-height:100vh; padding-bottom:80px; }
        .header { padding:20px; border-bottom:1px solid rgba(0,232,135,0.2); display:flex; justify-content:space-between; }
        h1 { font-size:24px; font-weight:700; }
        .badge { background:var(--green); color:var(--canvas); padding:4px 12px; border-radius:20px; font-size:11px; }
        .content { padding:20px; }
        textarea { width:100%; min-height:120px; background:rgba(0,232,135,0.05); border:1px solid rgba(0,232,135,0.2); border-radius:6px; color:var(--text); padding:10px; font-family:inherit; }
        button { background:var(--green); color:var(--canvas); border:0; padding:10px 16px; border-radius:6px; cursor:pointer; font-weight:600; width:100%; }
        .emotion-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin:15px 0; }
        .emotion-btn { background:rgba(0,232,135,0.1); border:1px solid rgba(0,232,135,0.2); color:var(--text); padding:12px; border-radius:6px; cursor:pointer; text-align:center; }
        .emotion-btn.selected { background:var(--green); color:var(--canvas); }
        .entry-card { background:rgba(0,232,135,0.05); border-left:3px solid var(--cyan); border:1px solid rgba(0,232,135,0.2); border-radius:8px; padding:15px; margin:12px 0; }
        .entry-meta { font-size:12px; color:var(--text-muted); margin-bottom:8px; }
        .entry-text { line-height:1.6; }
        .chart-bar { display:flex; align-items:center; margin:8px 0; }
        .chart-label { width:80px; font-size:12px; }
        .chart-fill { background:rgba(0,232,135,0.3); height:20px; border-radius:4px; flex:1; margin:0 10px; }
        .panel { display:none; }
        .panel.on { display:block; }
        .tabs { position:fixed; bottom:0; left:0; right:0; background:var(--canvas); border-top:1px solid rgba(0,232,135,0.2); display:flex; justify-content:space-around; height:70px; z-index:100; }
        .tab { flex:1; background:0; border:0; color:var(--text-muted); cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:12px; }
        .tab.on { color:var(--green); }
        .premium { background:rgba(124,58,237,0.1); border-left:3px solid var(--purple); padding:12px; margin-top:20px; border-radius:4px; font-size:13px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🎤 VoiceJournal</h1>
        <div class="badge">FREE</div>
    </div>
    <div class="content">
        <div id="journal" class="panel on">
            <textarea id="entry" placeholder="How are you feeling today?"></textarea>
            
            <div style="margin:15px 0">
                <label style="font-size:12px;display:block;margin-bottom:10px">How are you feeling?</label>
                <div class="emotion-grid">
                    <button class="emotion-btn" data-emotion="happy" onclick="selectEmotion(this, 'happy')">😊 Happy</button>
                    <button class="emotion-btn" data-emotion="sad" onclick="selectEmotion(this, 'sad')">😢 Sad</button>
                    <button class="emotion-btn" data-emotion="calm" onclick="selectEmotion(this, 'calm')">😌 Calm</button>
                    <button class="emotion-btn" data-emotion="excited" onclick="selectEmotion(this, 'excited')">🤩 Excited</button>
                </div>
            </div>
            
            <button onclick="saveEntry()">💾 Save Entry</button>
            <div id="entries" style="margin-top:20px"></div>
            <div class="premium">💎 Premium: Voice transcription & AI insights</div>
        </div>
        
        <div id="mood-chart" class="panel">
            <div style="font-weight:600;margin-bottom:15px">Mood Distribution (Last 7 Days)</div>
            <div id="chart"></div>
        </div>
    </div>
    <div class="tabs">
        <button class="tab on" data-p="journal">✍️ Journal</button>
        <button class="tab" data-p="mood-chart">📊 Mood Chart</button>
    </div>
    <script>
        let entries = [];
        let selectedEmotion = null;
        
        function load() {
            let d = localStorage.getItem('voicejournal');
            if (d) entries = JSON.parse(d);
            drawEntries();
        }
        
        function save() {
            localStorage.setItem('voicejournal', JSON.stringify(entries));
            drawEntries();
        }
        
        function selectEmotion(btn, em) {
            document.querySelectorAll('.emotion-btn').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            selectedEmotion = em;
        }
        
        function saveEntry() {
            let txt = document.getElementById('entry').value;
            if (!txt || !selectedEmotion) return;
            
            entries.unshift({
                text: txt,
                emotion: selectedEmotion,
                date: new Date().toLocaleString()
            });
            if (entries.length > 30) entries.pop();
            
            document.getElementById('entry').value = '';
            document.querySelectorAll('.emotion-btn').forEach(b => b.classList.remove('selected'));
            selectedEmotion = null;
            save();
        }
        
        function drawEntries() {
            document.getElementById('entries').innerHTML = entries.length ?
                entries.map(e => `
                    <div class="entry-card">
                        <div class="entry-meta">${e.date} • ${e.emotion}</div>
                        <div class="entry-text">${e.text.substring(0, 150)}${e.text.length > 150 ? '...' : ''}</div>
                    </div>
                `).join('') :
                '<p style="color:var(--text-muted)">No entries yet</p>';
            
            let emotionCount = {};
            entries.forEach(e => emotionCount[e.emotion] = (emotionCount[e.emotion] || 0) + 1);
            
            document.getElementById('chart').innerHTML = Object.entries(emotionCount).map(([em, count]) => `
                <div class="chart-bar">
                    <div class="chart-label">${em}</div>
                    <div class="chart-fill" style="width:${count * 30}px"></div>
                    <span>${count}</span>
                </div>
            `).join('');
        }
        
        document.querySelectorAll('.tab').forEach(t => {
            t.onclick = () => {
                document.querySelectorAll('.tab').forEach(x => x.classList.remove('on'));
                document.querySelectorAll('.panel').forEach(x => x.classList.remove('on'));
                t.classList.add('on');
                document.getElementById(t.dataset.p).classList.add('on');
            };
        });
        
        load();
        if ('serviceWorker' in navigator) navigator.serviceWorker.register('data:application/javascript,self.addEventListener("install",e=>self.skipWaiting());');
    </script>
</body>
</html>
