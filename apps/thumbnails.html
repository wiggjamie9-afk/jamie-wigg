<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App Thumbnails — Download for Stripe</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Inter:wght@500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #09090f; color: #f1f5f9; font-family: 'Inter', sans-serif;
      padding: 32px 20px; min-height: 100vh; }
    h1 { font-family: 'Space Grotesk', sans-serif; font-size: 28px; font-weight: 700;
      background: linear-gradient(135deg,#a78bfa,#7c3aed); -webkit-background-clip:text;
      -webkit-text-fill-color:transparent; margin-bottom: 6px; }
    p { color: #64748b; font-size: 14px; margin-bottom: 32px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
    .item { display: flex; flex-direction: column; align-items: center; gap: 12px; }
    canvas { border-radius: 24px; box-shadow: 0 8px 32px rgba(0,0,0,0.4); width: 160px; height: 160px; }
    .name { font-family: 'Space Grotesk', sans-serif; font-size: 15px; font-weight: 700; }
    .dl-btn { padding: 8px 20px; border-radius: 20px; border: none;
      background: linear-gradient(135deg,#7c3aed,#6d28d9); color: #fff;
      font-size: 13px; font-weight: 600; cursor: pointer; transition: opacity 0.2s; }
    .dl-btn:hover { opacity: 0.85; }
    .note { margin-top: 40px; padding: 16px 20px; background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08); border-radius: 12px;
      font-size: 13px; color: #94a3b8; line-height: 1.6; }
    .note strong { color: #f1f5f9; }
  </style>
</head>
<body>
  <h1>App Thumbnails</h1>
  <p>512×512 PNG icons — tap Download, then upload each one to your Stripe product.</p>
  <div class="grid" id="grid"></div>
  <div class="note">
    <strong>How to upload to Stripe:</strong> In the Stripe app, when creating each product,
    tap the <strong>Image → Add</strong> field and pick the downloaded PNG from your Photos/Files.
    Stripe accepts PNG up to 2MB.
  </div>

  <script>
    const apps = [
      {
        name: 'FOCUS',
        tagline: 'Deep Work Timer',
        bg1: '#2d1b69', bg2: '#0f0a2e',
        accent: '#a78bfa',
        icon: '⏱',
        ring: true,
        ringColor: '#7c3aed',
      },
      {
        name: 'DRIFT',
        tagline: 'Sleep Coach',
        bg1: '#0f1e4a', bg2: '#04040f',
        accent: '#818cf8',
        icon: '🌙',
        ring: false,
        stars: true,
      },
      {
        name: 'PULSE',
        tagline: 'Habit Tracker',
        bg1: '#4a0f1e', bg2: '#0a0608',
        accent: '#fb7185',
        icon: '🔥',
        ring: false,
        dots: true,
      },
      {
        name: 'TRIM',
        tagline: 'Subscription Tracker',
        bg1: '#0a2e2a', bg2: '#060e0e',
        accent: '#5eead4',
        icon: '✂',
        ring: false,
        lines: true,
      },
      {
        name: 'SCAN',
        tagline: 'Receipt Tracker',
        bg1: '#0f1e4a', bg2: '#05050f',
        accent: '#60a5fa',
        icon: '📷',
        ring: false,
        corner: true,
      },
      {
        name: 'GLOW',
        tagline: 'Skincare Tracker',
        bg1: '#4a0f2e', bg2: '#0a0608',
        accent: '#f472b6',
        icon: '✦',
        ring: true,
        ringColor: '#db2777',
      },
      {
        name: 'MACRO',
        tagline: 'Calorie Counter',
        bg1: '#3d1a04', bg2: '#0a0500',
        accent: '#fb923c',
        icon: '🍽',
        ring: true,
        ringColor: '#ea580c',
      },
      {
        name: 'LAPSE',
        tagline: 'Daily Photo Journal',
        bg1: '#3d2a04', bg2: '#080600',
        accent: '#fbbf24',
        icon: '📸',
        ring: false,
        frame: true,
      },
      {
        name: 'HYPE',
        tagline: 'Daily Affirmations',
        bg1: '#3d3004', bg2: '#08070a',
        accent: '#fde68a',
        icon: '⚡',
        ring: false,
        rays: true,
      },
      {
        name: 'VAULT',
        tagline: 'Private Notes',
        bg1: '#042a1a', bg2: '#040a06',
        accent: '#34d399',
        icon: '🔒',
        ring: true,
        ringColor: '#059669',
      },
    ];

    const SIZE = 512;
    const grid = document.getElementById('grid');

    function drawApp(app) {
      const canvas = document.createElement('canvas');
      canvas.width = SIZE; canvas.height = SIZE;
      const ctx = canvas.getContext('2d');

      // Background gradient
      const grad = ctx.createLinearGradient(0, 0, SIZE, SIZE);
      grad.addColorStop(0, app.bg1);
      grad.addColorStop(1, app.bg2);
      ctx.fillStyle = grad;
      roundRect(ctx, 0, 0, SIZE, SIZE, 80);
      ctx.fill();

      // Subtle noise overlay
      for (let i = 0; i < 3000; i++) {
        const x = Math.random() * SIZE, y = Math.random() * SIZE;
        ctx.fillStyle = `rgba(255,255,255,${Math.random() * 0.015})`;
        ctx.fillRect(x, y, 1, 1);
      }

      // Glow orb
      const glow = ctx.createRadialGradient(SIZE/2, SIZE*0.38, 0, SIZE/2, SIZE*0.38, SIZE*0.5);
      glow.addColorStop(0, hexToRgba(app.accent, 0.18));
      glow.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = glow;
      ctx.fillRect(0, 0, SIZE, SIZE);

      // Decorative ring
      if (app.ring) {
        ctx.strokeStyle = hexToRgba(app.ringColor, 0.25);
        ctx.lineWidth = 28;
        ctx.beginPath();
        ctx.arc(SIZE/2, SIZE*0.38, 130, 0, Math.PI * 2);
        ctx.stroke();
        ctx.strokeStyle = hexToRgba(app.ringColor, 0.7);
        ctx.lineWidth = 10;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.arc(SIZE/2, SIZE*0.38, 130, -Math.PI/2, Math.PI * 0.6);
        ctx.stroke();
      }

      // Stars decoration
      if (app.stars) {
        const starPositions = [[80,80],[420,100],[100,180],[440,200],[60,300],[400,320]];
        starPositions.forEach(([x,y], i) => {
          ctx.fillStyle = hexToRgba(app.accent, 0.4 + i*0.05);
          ctx.beginPath();
          ctx.arc(x, y, 2+i%3, 0, Math.PI*2);
          ctx.fill();
        });
      }

      // Dots (PULSE)
      if (app.dots) {
        for (let i = 0; i < 5; i++) {
          ctx.fillStyle = hexToRgba(app.accent, i < 3 ? 0.8 : 0.2);
          ctx.beginPath();
          ctx.arc(SIZE/2 + (i-2)*36, SIZE*0.72, 8, 0, Math.PI*2);
          ctx.fill();
        }
      }

      // Lines (TRIM — subscription rows)
      if (app.lines) {
        [0.58, 0.65, 0.72].forEach(y => {
          ctx.strokeStyle = hexToRgba(app.accent, 0.15);
          ctx.lineWidth = 6;
          ctx.beginPath();
          ctx.moveTo(SIZE*0.18, SIZE*y); ctx.lineTo(SIZE*0.82, SIZE*y);
          ctx.stroke();
        });
      }

      // Corner brackets (SCAN)
      if (app.corner) {
        const bx = SIZE*0.3, by = SIZE*0.26, bw = SIZE*0.4, bh = SIZE*0.36, blen = 32;
        ctx.strokeStyle = hexToRgba(app.accent, 0.5);
        ctx.lineWidth = 7; ctx.lineCap = 'square';
        // TL
        ctx.beginPath(); ctx.moveTo(bx,by+blen); ctx.lineTo(bx,by); ctx.lineTo(bx+blen,by); ctx.stroke();
        // TR
        ctx.beginPath(); ctx.moveTo(bx+bw-blen,by); ctx.lineTo(bx+bw,by); ctx.lineTo(bx+bw,by+blen); ctx.stroke();
        // BL
        ctx.beginPath(); ctx.moveTo(bx,by+bh-blen); ctx.lineTo(bx,by+bh); ctx.lineTo(bx+blen,by+bh); ctx.stroke();
        // BR
        ctx.beginPath(); ctx.moveTo(bx+bw-blen,by+bh); ctx.lineTo(bx+bw,by+bh); ctx.lineTo(bx+bw,by+bh-blen); ctx.stroke();
      }

      // Frame (LAPSE)
      if (app.frame) {
        ctx.strokeStyle = hexToRgba(app.accent, 0.3);
        ctx.lineWidth = 12;
        ctx.beginPath();
        ctx.roundRect(SIZE*0.22, SIZE*0.18, SIZE*0.56, SIZE*0.44, 12);
        ctx.stroke();
      }

      // Rays (HYPE)
      if (app.rays) {
        for (let i = 0; i < 8; i++) {
          const angle = (i / 8) * Math.PI * 2;
          ctx.strokeStyle = hexToRgba(app.accent, 0.12);
          ctx.lineWidth = 4;
          ctx.beginPath();
          ctx.moveTo(SIZE/2 + Math.cos(angle)*80, SIZE*0.38 + Math.sin(angle)*80);
          ctx.lineTo(SIZE/2 + Math.cos(angle)*170, SIZE*0.38 + Math.sin(angle)*170);
          ctx.stroke();
        }
      }

      // Icon
      ctx.font = `${SIZE*0.22}px sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(app.icon, SIZE/2, SIZE*0.36);

      // App name
      ctx.font = `700 ${SIZE*0.115}px 'Space Grotesk', sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'alphabetic';
      ctx.fillStyle = '#ffffff';
      ctx.shadowColor = hexToRgba(app.accent, 0.4);
      ctx.shadowBlur = 20;
      ctx.fillText(app.name, SIZE/2, SIZE*0.72);
      ctx.shadowBlur = 0;

      // Tagline
      ctx.font = `500 ${SIZE*0.055}px 'Inter', sans-serif`;
      ctx.fillStyle = hexToRgba(app.accent, 0.85);
      ctx.fillText(app.tagline, SIZE/2, SIZE*0.82);

      // Bottom pill
      const pillW = 120, pillH = 28, pillX = SIZE/2 - pillW/2, pillY = SIZE*0.88;
      const pillGrad = ctx.createLinearGradient(pillX, 0, pillX+pillW, 0);
      pillGrad.addColorStop(0, hexToRgba(app.accent, 0.15));
      pillGrad.addColorStop(1, hexToRgba(app.accent, 0.08));
      ctx.fillStyle = pillGrad;
      ctx.strokeStyle = hexToRgba(app.accent, 0.3);
      ctx.lineWidth = 1;
      roundRect(ctx, pillX, pillY, pillW, pillH, 14);
      ctx.fill(); ctx.stroke();
      ctx.font = `600 ${SIZE*0.04}px 'Inter', sans-serif`;
      ctx.fillStyle = hexToRgba(app.accent, 0.9);
      ctx.fillText('rhythmixapp.com.au', SIZE/2, pillY + 18);

      return canvas;
    }

    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x+r, y);
      ctx.lineTo(x+w-r, y); ctx.arcTo(x+w,y, x+w,y+r, r);
      ctx.lineTo(x+w, y+h-r); ctx.arcTo(x+w,y+h, x+w-r,y+h, r);
      ctx.lineTo(x+r, y+h); ctx.arcTo(x,y+h, x,y+h-r, r);
      ctx.lineTo(x, y+r); ctx.arcTo(x,y, x+r,y, r);
      ctx.closePath();
    }

    function hexToRgba(hex, alpha) {
      const r = parseInt(hex.slice(1,3),16);
      const g = parseInt(hex.slice(3,5),16);
      const b = parseInt(hex.slice(5,7),16);
      return `rgba(${r},${g},${b},${alpha})`;
    }

    // Render all
    apps.forEach(app => {
      const canvas = drawApp(app);
      canvas.style.cssText = 'border-radius:24px;box-shadow:0 8px 32px rgba(0,0,0,0.5);width:160px;height:160px;';

      const btn = document.createElement('button');
      btn.className = 'dl-btn';
      btn.textContent = 'Download PNG';
      btn.onclick = () => {
        const a = document.createElement('a');
        a.download = `${app.name.toLowerCase()}-stripe-icon.png`;
        a.href = canvas.toDataURL('image/png');
        a.click();
      };

      const nameEl = document.createElement('div');
      nameEl.className = 'name';
      nameEl.textContent = app.name;

      const item = document.createElement('div');
      item.className = 'item';
      item.appendChild(canvas);
      item.appendChild(nameEl);
      item.appendChild(btn);
      grid.appendChild(item);
    });
  </script>
</body>
</html>
