<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#9333EA">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>RHYTHMIX Apps — 28+ Concept Apps</title>
    <style>
        :root {
            --primary: #9333EA;
            --accent: #F97316;
            --secondary: #3B82F6;
            --bg: #0F172A;
            --light: #1E293B;
            --text: #F1F5F9;
            --text-secondary: #CBD5E1;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; min-height: 100vh; }
        .header { text-align: center; margin-bottom: 32px; padding-top: 20px; }
        .header h1 { font-size: 32px; background: linear-gradient(135deg, var(--primary), var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 8px; }
        .header p { color: var(--text-secondary); font-size: 14px; }
        .search { margin-bottom: 24px; }
        input[type="text"] { width: 100%; padding: 12px 16px; background: var(--light); border: 2px solid #334155; border-radius: 8px; color: var(--text); font-size: 14px; }
        input[type="text"]:focus { outline: none; border-color: var(--primary); }
        .category { margin-bottom: 32px; }
        .category-title { font-size: 18px; font-weight: 700; color: var(--primary); margin-bottom: 16px; padding-bottom: 8px; border-bottom: 2px solid rgba(147, 51, 234, 0.3); }
        .apps-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
        .app-card { background: var(--light); border-radius: 12px; padding: 16px; text-align: center; cursor: pointer; transition: all 0.2s; border: 2px solid transparent; }
        .app-card:hover { border-color: var(--primary); transform: translateY(-2px); }
        .app-card:active { transform: scale(0.95); }
        .app-emoji { font-size: 32px; margin-bottom: 8px; }
        .app-name { font-size: 14px; font-weight: 600; margin-bottom: 4px; color: var(--text); }
        .app-desc { font-size: 11px; color: var(--text-secondary); }
        .stats { background: var(--light); border-radius: 12px; padding: 16px; margin-bottom: 32px; border-left: 4px solid var(--primary); }
        .stats-item { display: flex; justify-content: space-between; margin-bottom: 8px; }
        .stats-item:last-child { margin-bottom: 0; }
        .stats-label { color: var(--text-secondary); font-size: 13px; }
        .stats-value { font-weight: 700; color: var(--primary); font-size: 16px; }
        .status-banner { background: rgba(147, 51, 234, 0.1); border-left: 4px solid var(--accent); padding: 16px; border-radius: 8px; margin-bottom: 24px; }
        .status-banner p { font-size: 13px; color: var(--text-secondary); }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎨 RHYTHMIX Apps</h1>
            <p>28+ Concept Apps, All RHYTHMIX Branded</p>
        </div>

        <div class="status-banner">
            <p><strong>✅ Status:</strong> All apps updated with RHYTHMIX branding (#9333EA purple, #F97316 orange). Mobile-optimized for iPhone 17.</p>
        </div>

        <div class="stats">
            <div class="stats-item">
                <span class="stats-label">Total Apps</span>
                <span class="stats-value">77</span>
            </div>
            <div class="stats-item">
                <span class="stats-label">Polished</span>
                <span class="stats-value">28+</span>
            </div>
            <div class="stats-item">
                <span class="stats-label">Ready</span>
                <span class="stats-value">100%</span>
            </div>
        </div>

        <div class="search">
            <input type="text" id="searchInput" placeholder="Search apps..." onkeyup="searchApps()">
        </div>

        <div id="appsContainer"></div>
    </div>

    <script>
        const apps = {
            'Health & Wellness': [
                { name: 'Blood Pressure Buddy', emoji: '❤️‍🩹', file: 'blood-pressure-buddy.html', desc: 'Health tracking' },
                { name: 'Calorie Counter', emoji: '🍎', file: 'calorie-counter.html', desc: 'Nutrition tracking' },
                { name: 'Meditation Guide', emoji: '🧘', file: 'meditation-guide.html', desc: 'Mindfulness' },
                { name: 'Workout Timer', emoji: '💪', file: 'workout-timer.html', desc: 'Fitness' },
                { name: 'Water Tracker', emoji: '💧', file: 'water-tracker.html', desc: 'Hydration' },
                { name: 'Weight Tracker', emoji: '⚖️', file: 'weight-tracker.html', desc: 'Progress' },
                { name: 'Period Tracker', emoji: '📅', file: 'period-tracker.html', desc: 'Cycle tracking' }
            ],
            'Finance & Money': [
                { name: 'Budget Tracker', emoji: '💰', file: 'budget-tracker.html', desc: 'Personal finance' },
                { name: 'Expense Tracker', emoji: '💳', file: 'expense-tracker.html', desc: 'Spending' },
                { name: 'Loan Calculator', emoji: '🏠', file: 'loan-calculator.html', desc: 'Planning' },
                { name: 'Savings Challenge', emoji: '🎯', file: 'savings-challenge.html', desc: 'Goals' },
                { name: 'Vendor Tracker', emoji: '📊', file: 'vendor-tracker.html', desc: 'Business' }
            ],
            'Productivity & Learning': [
                { name: 'Daily Planner', emoji: '📋', file: 'daily-planner.html', desc: 'Tasks' },
                { name: 'Study Planner', emoji: '📚', file: 'study-planner.html', desc: 'Education' },
                { name: 'Habit Streak', emoji: '🔥', file: 'habit-streak.html', desc: 'Habits' },
                { name: 'Pomodoro Timer', emoji: '🍅', file: 'pomodoro-timer.html', desc: 'Focus' },
                { name: 'Task List', emoji: '✅', file: 'tasklist.html', desc: 'To-do' },
                { name: 'Notes', emoji: '📝', file: 'notes.html', desc: 'Notes' }
            ],
            'Creative & Community': [
                { name: 'Dreams', emoji: '✨', file: 'dreams.html', desc: 'Inspiration' },
                { name: 'Hum', emoji: '🎵', file: 'hum.html', desc: 'Music' },
                { name: 'Resonate', emoji: '🤝', file: 'resonate.html', desc: 'Community' },
                { name: 'Quick Recipes', emoji: '🍳', file: 'quick-recipes.html', desc: 'Cooking' },
                { name: 'Voice Notes', emoji: '🎙️', file: 'voice-notes.html', desc: 'Audio' }
            ],
            'Learning & Reference': [
                { name: 'Math Tutor Pro', emoji: '🧮', file: 'mathtutor-pro.html', desc: 'Math' },
                { name: 'English Pocket', emoji: '🇬🇧', file: 'english-pocket.html', desc: 'Language' },
                { name: 'Book Reader Pro', emoji: '📖', file: 'bookreader-pro.html', desc: 'Reading' },
                { name: 'Trivia Quiz', emoji: '🧠', file: 'trivia-quiz.html', desc: 'Quiz' }
            ],
            'Health Tracking': [
                { name: 'Mood Journal', emoji: '😊', file: 'mood-journal.html', desc: 'Mental health' },
                { name: 'Medicine Companion', emoji: '💊', file: 'medicine-companion.html', desc: 'Medications' },
                { name: 'Goal Tracker', emoji: '🎪', file: 'goal-tracker.html', desc: 'Goals' },
                { name: 'Heartbeat', emoji: '💓', file: 'heartbeat.html', desc: 'Heart rate' }
            ]
        };

        function renderApps(filter = '') {
            const container = document.getElementById('appsContainer');
            container.innerHTML = '';

            for (const [category, categoryApps] of Object.entries(apps)) {
                const filtered = categoryApps.filter(app => 
                    app.name.toLowerCase().includes(filter.toLowerCase()) ||
                    app.desc.toLowerCase().includes(filter.toLowerCase())
                );

                if (filtered.length === 0) continue;

                const categoryDiv = document.createElement('div');
                categoryDiv.className = 'category';
                categoryDiv.innerHTML = `<div class="category-title">${category}</div><div class="apps-grid"></div>`;

                const grid = categoryDiv.querySelector('.apps-grid');
                filtered.forEach(app => {
                    const card = document.createElement('div');
                    card.className = 'app-card';
                    card.onclick = () => window.location.href = app.file;
                    card.innerHTML = `
                        <div class="app-emoji">${app.emoji}</div>
                        <div class="app-name">${app.name}</div>
                        <div class="app-desc">${app.desc}</div>
                    `;
                    grid.appendChild(card);
                });

                container.appendChild(categoryDiv);
            }
        }

        function searchApps() {
            const search = document.getElementById('searchInput').value;
            renderApps(search);
        }

        renderApps();
    </script>
</body>
</html>
