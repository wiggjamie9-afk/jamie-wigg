<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#08050d">
    <title>CodeMentor - Code Review</title>
    <style>
        :root { --canvas:#08050d; --green:#00e887; --red:#ff1f5a; --cyan:#00d8ff; --purple:#7c3aed; --text:#fff; --text-muted:#aaa; }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:var(--canvas); color:var(--text); min-height:100vh; padding-bottom:80px; }
        .header { padding:20px; border-bottom:1px solid rgba(0,232,135,0.2); display:flex; justify-content:space-between; }
        h1 { font-size:24px; font-weight:700; }
        .badge { background:var(--green); color:var(--canvas); padding:4px 12px; border-radius:20px; font-size:11px; }
        .content { padding:20px; }
        textarea { width:100%; min-height:150px; background:rgba(0,232,135,0.05); border:1px solid rgba(0,232,135,0.2); border-radius:6px; color:var(--text); padding:10px; font-family:monospace; font-size:12px; }
        button { background:var(--green); color:var(--canvas); border:0; padding:10px 16px; border-radius:6px; cursor:pointer; font-weight:600; width:100%; margin-top:10px; }
        .feedback { background:rgba(0,232,135,0.05); border:1px solid rgba(0,232,135,0.2); border-radius:8px; padding:12px; margin:12px 0; }
        .feedback-title { font-weight:600; color:var(--cyan); margin-bottom:8px; }
        .suggestion { background:rgba(0,232,135,0.1); padding:8px; border-radius:4px; margin:6px 0; font-size:13px; }
        .history-item { background:rgba(0,232,135,0.05); border-left:3px solid var(--green); padding:12px; margin:8px 0; cursor:pointer; }
        .panel { display:none; }
        .panel.on { display:block; }
        .tabs { position:fixed; bottom:0; left:0; right:0; background:var(--canvas); border-top:1px solid rgba(0,232,135,0.2); display:flex; justify-content:space-around; height:70px; z-index:100; }
        .tab { flex:1; background:0; border:0; color:var(--text-muted); cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:12px; }
        .tab.on { color:var(--green); }
        .premium { background:rgba(124,58,237,0.1); border-left:3px solid var(--purple); padding:12px; margin-top:20px; border-radius:4px; font-size:13px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>👨‍💻 CodeMentor</h1>
        <div class="badge">FREE</div>
    </div>
    <div class="content">
        <div id="review" class="panel on">
            <textarea id="code" placeholder="Paste code here..."></textarea>
            <button onclick="review()">📝 Get Feedback</button>
            
            <div id="feedback-area"></div>
            <div class="premium">💎 Premium: AI code review & detection</div>
        </div>
        
        <div id="history" class="panel">
            <div id="hist-list"></div>
        </div>
    </div>
    <div class="tabs">
        <button class="tab on" data-p="review">✏️ Review</button>
        <button class="tab" data-p="history">📚 History</button>
    </div>
    <script>
        let history = [];
        const suggestions = [
            {t:'Variable Naming', s:'Consider using descriptive names for variables instead of single letters'},
            {t:'DRY Principle', s:'This code repeats logic - extract to a function'},
            {t:'Error Handling', s:'Add try-catch blocks for robustness'},
            {t:'Documentation', s:'Add comments explaining complex logic'},
            {t:'Performance', s:'Consider caching expensive computations'}
        ];
        
        function load() {
            let d = localStorage.getItem('codementor');
            if (d) history = JSON.parse(d);
            drawHistory();
        }
        
        function save() {
            localStorage.setItem('codementor', JSON.stringify(history));
        }
        
        function review() {
            let code = document.getElementById('code').value;
            if (!code) return;
            
            let sugg = suggestions.slice(0, Math.floor(Math.random() * 3) + 2);
            let feedback = {code: code.substring(0, 30) + '...', suggestions: sugg};
            history.unshift(feedback);
            if (history.length > 10) history.pop();
            save();
            
            let html = `<div class="feedback">
                <div class="feedback-title">Suggestions for your code:</div>
                ${sugg.map(s => `<div class="suggestion"><span style="color:var(--cyan)">${s.t}:</span> ${s.s}</div>`).join('')}
            </div>`;
            document.getElementById('feedback-area').innerHTML = html;
        }
        
        function drawHistory() {
            document.getElementById('hist-list').innerHTML = history.length ?
                history.map((h,i) => `<div class="history-item" onclick="document.getElementById('code').value='${h.code}'">${h.code}</div>`).join('') :
                '<p style="padding:20px;color:var(--text-muted)">No history yet</p>';
        }
        
        document.querySelectorAll('.tab').forEach(t => {
            t.onclick = () => {
                document.querySelectorAll('.tab').forEach(x => x.classList.remove('on'));
                document.querySelectorAll('.panel').forEach(x => x.classList.remove('on'));
                t.classList.add('on');
                document.getElementById(t.dataset.p).classList.add('on');
            };
        });
        
        load();
        if ('serviceWorker' in navigator) navigator.serviceWorker.register('data:application/javascript,self.addEventListener("install",e=>self.skipWaiting());');
    </script>
</body>
</html>
