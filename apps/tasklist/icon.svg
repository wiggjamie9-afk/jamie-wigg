<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#241a33"/>
      <stop offset="100%" stop-color="#08050d"/>
    </radialGradient>
    <linearGradient id="check" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d8ff"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="180" fill="rgba(0, 216, 255, 0.1)"/>

  <!-- Checklist -->
  <g transform="translate(256, 256)">
    <!-- List items (lines) -->
    <line x1="-80" y1="-50" x2="80" y2="-50" stroke="rgba(0, 216, 255, 0.3)" stroke-width="6" stroke-linecap="round"/>
    <line x1="-80" y1="-10" x2="80" y2="-10" stroke="rgba(0, 216, 255, 0.3)" stroke-width="6" stroke-linecap="round"/>
    <line x1="-80" y1="30" x2="80" y2="30" stroke="rgba(0, 216, 255, 0.3)" stroke-width="6" stroke-linecap="round"/>
    <line x1="-80" y1="70" x2="80" y2="70" stroke="rgba(0, 216, 255, 0.3)" stroke-width="6" stroke-linecap="round"/>

    <!-- Checkmarks on completed items -->
    <!-- First check -->
    <path d="M -60 -50 L -40 -30 L -10 -55" fill="none" stroke="url(#check)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Second check -->
    <path d="M -60 -10 L -40 10 L -10 -15" fill="none" stroke="url(#check)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Glow -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="rgba(0, 216, 255, 0.3)" stroke-width="3" opacity="0.6"/>
</svg>
