<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#241a33"/>
      <stop offset="100%" stop-color="#08050d"/>
    </radialGradient>
    <linearGradient id="book" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6fc8"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="180" fill="rgba(255, 111, 200, 0.1)"/>

  <!-- Open Book -->
  <g transform="translate(256, 256)">
    <!-- Left page -->
    <path d="M -80 -60 L -20 -60 L -20 100 L -80 110 Z" fill="none" stroke="url(#book)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Right page -->
    <path d="M 20 -60 L 80 -60 L 80 110 L 20 100 Z" fill="none" stroke="url(#book)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Spine -->
    <line x1="-20" y1="-60" x2="-20" y2="100" stroke="url(#book)" stroke-width="6" stroke-linecap="round"/>
    <line x1="20" y1="-60" x2="20" y2="100" stroke="url(#book)" stroke-width="6" stroke-linecap="round"/>
    <!-- Text lines on left page -->
    <line x1="-70" y1="-30" x2="-30" y2="-30" stroke="rgba(255, 111, 200, 0.5)" stroke-width="4" stroke-linecap="round"/>
    <line x1="-70" y1="0" x2="-30" y2="0" stroke="rgba(255, 111, 200, 0.5)" stroke-width="4" stroke-linecap="round"/>
    <line x1="-70" y1="30" x2="-30" y2="30" stroke="rgba(255, 111, 200, 0.5)" stroke-width="4" stroke-linecap="round"/>
    <!-- Text lines on right page -->
    <line x1="30" y1="-30" x2="70" y2="-30" stroke="rgba(124, 58, 237, 0.5)" stroke-width="4" stroke-linecap="round"/>
    <line x1="30" y1="0" x2="70" y2="0" stroke="rgba(124, 58, 237, 0.5)" stroke-width="4" stroke-linecap="round"/>
    <line x1="30" y1="30" x2="70" y2="30" stroke="rgba(124, 58, 237, 0.5)" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Glow -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="rgba(255, 111, 200, 0.3)" stroke-width="3" opacity="0.6"/>
</svg>
