<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Buddy System">
  <defs>
    <linearGradient id="warm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.2"/>
    </filter>
  </defs>

  <!-- App background -->
  <rect width="512" height="512" rx="116" fill="#0b1120"/>

  <!-- Gradient companion disc -->
  <circle cx="256" cy="256" r="166" fill="url(#warm)"/>
  <circle cx="256" cy="256" r="166" fill="url(#glow)"/>

  <!-- Heart sitting above the smile, the "buddy" motif -->
  <path d="M256 197
           c-17 -29 -67 -23 -67 13
           c0 24 30 45 67 72
           c37 -27 67 -48 67 -72
           c0 -36 -50 -42 -67 -13 Z"
        fill="#0b1120" opacity="0.92"/>

  <!-- Warm smile -->
  <path d="M187 310 q69 64 138 0"
        fill="none" stroke="#0b1120" stroke-width="24"
        stroke-linecap="round" opacity="0.92" filter="url(#soft)"/>
</svg>
