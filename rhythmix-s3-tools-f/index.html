<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #08050d; font-family: "Space Grotesk", system-ui, sans-serif; color: #ffffff; }
      .scene { position: absolute; inset: 0; width: 1080px; height: 1920px; }
      .scene-inner { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 100px 80px; box-sizing: border-box; background: #08050d; }
      .bg-radial { position: absolute; inset: 0; background: radial-gradient(700px 800px at 20% 30%, rgba(0,216,255,0.18), transparent 60%), radial-gradient(600px 700px at 80% 70%, rgba(124,58,237,0.25), transparent 65%); pointer-events: none; }
      .grid-overlay { position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,0.045) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.045) 1px, transparent 1px); background-size: 60px 60px; pointer-events: none; }
      .gradient-text { background: linear-gradient(135deg, #ff7aa6, #e0c0ff 50%, #8af6ff); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent; }

      #s1 .wordmark { font-weight: 800; font-size: 160px; line-height: 0.88; letter-spacing: -5px; margin-bottom: 44px; text-align: center; }
      #s1 .eyebrow { font-family: "JetBrains Mono", monospace; font-size: 30px; letter-spacing: 6px; color: #00d8ff; text-transform: uppercase; text-align: center; }

      #s2-inner { gap: 20px; }
      .tool-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; width: 100%; }
      .tool-card { padding: 36px 32px; background: rgba(255,255,255,0.04); border: 1.5px solid rgba(255,255,255,0.1); border-radius: 20px; display: flex; flex-direction: column; gap: 12px; }
      .tool-card-icon { font-size: 60px; line-height: 1; }
      .tool-card-name { font-weight: 700; font-size: 40px; letter-spacing: -1px; line-height: 1; }
      .tool-card-tag { font-family: "JetBrains Mono", monospace; font-size: 20px; letter-spacing: 3px; text-transform: uppercase; }
      #s2 .bottom-bar { width: 100%; text-align: center; font-family: "JetBrains Mono", monospace; font-size: 26px; letter-spacing: 4px; color: #e0c0ff; text-transform: uppercase; }

      #s3-inner { gap: 40px; }
      #s3 .big-label { font-family: "JetBrains Mono", monospace; font-size: 28px; letter-spacing: 5px; color: #b9b3c6; text-transform: uppercase; text-align: center; }
      #s3 .big-num { font-weight: 800; font-size: 130px; letter-spacing: -5px; line-height: 0.9; text-align: center; }
      #s3 .big-sub { font-size: 40px; color: #e6e6ee; text-align: center; line-height: 1.3; }
      #s3 .cta { font-weight: 700; font-size: 40px; padding: 28px 80px; background: linear-gradient(135deg, #ff1f5a, #7c3aed); border-radius: 999px; color: #ffffff; box-shadow: 0 0 60px rgba(255,31,90,0.45); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="s3-tools-f" data-start="0" data-duration="32" data-width="1080" data-height="1920">
      <audio id="vo" class="clip" data-start="0" data-duration="auto" data-track-index="10" src="narration.wav" data-volume="1"></audio>

      <div id="s1" class="scene clip" data-start="0" data-duration="3.5" data-track-index="1">
        <div class="scene-inner" id="s1-inner">
          <div class="bg-radial"></div><div class="grid-overlay"></div>
          <div class="wordmark gradient-text">RHYTHMIX</div>
          <div class="eyebrow">14 Pro AI Tools</div>
        </div>
      </div>

      <div id="s2" class="scene clip" data-start="3" data-duration="20" data-track-index="2">
        <div class="scene-inner" id="s2-inner">
          <div class="bg-radial"></div><div class="grid-overlay"></div>
          <div id="tg" class="tool-grid">
            <div id="t1" class="tool-card"><div class="tool-card-icon">🎛</div><div class="tool-card-name gradient-text">Stem Split</div><div class="tool-card-tag" style="color:#00d8ff">6 Stems</div></div>
            <div id="t2" class="tool-card"><div class="tool-card-icon">✨</div><div class="tool-card-name gradient-text">AI Master</div><div class="tool-card-tag" style="color:#00e887">Radio-Ready</div></div>
            <div id="t3" class="tool-card"><div class="tool-card-icon">✏️</div><div class="tool-card-name gradient-text">Section Edit</div><div class="tool-card-tag" style="color:#ff1f5a">Inpainting</div></div>
            <div id="t4" class="tool-card"><div class="tool-card-icon">🎹</div><div class="tool-card-name gradient-text">MIDI/DAW</div><div class="tool-card-tag" style="color:#00d8ff">6 DAWs</div></div>
            <div id="t5" class="tool-card"><div class="tool-card-icon">🥽</div><div class="tool-card-name gradient-text">VR Concert</div><div class="tool-card-tag" style="color:#c084fc">127 Countries</div></div>
            <div id="t6" class="tool-card"><div class="tool-card-icon">🎧</div><div class="tool-card-name gradient-text">AI DJ Mode</div><div class="tool-card-tag" style="color:#ff1f5a">Auto-Mix</div></div>
          </div>
          <div id="bbar" class="bottom-bar">One Platform · One Price</div>
        </div>
      </div>

      <div id="s3" class="scene clip" data-start="23" data-duration="9" data-track-index="3">
        <div class="scene-inner" id="s3-inner">
          <div class="bg-radial"></div><div class="grid-overlay"></div>
          <div class="big-label">Total Tools Inside</div>
          <div class="big-num gradient-text">14</div>
          <div class="big-sub">Professional-grade tools<br/>under $50/month</div>
          <div class="cta">Join the Waitlist</div>
        </div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      tl.from("#s1 .wordmark", { y: 56, opacity: 0, scale: 0.93, duration: 0.8, ease: "expo.out" }, 0.2);
      tl.from("#s1 .eyebrow", { y: -20, opacity: 0, duration: 0.45, ease: "power2.out" }, 0.85);

      tl.to("#s1-inner", { opacity: 0, duration: 0.5, ease: "power1.inOut" }, 3.0);
      tl.from("#s2-inner", { opacity: 0, duration: 0.5, ease: "power1.inOut" }, 3.0);

      tl.from("#t1", { y: 40, opacity: 0, duration: 0.4, ease: "power3.out" }, 3.3);
      tl.from("#t2", { y: 40, opacity: 0, duration: 0.4, ease: "power3.out" }, 3.55);
      tl.from("#t3", { y: 40, opacity: 0, duration: 0.4, ease: "power3.out" }, 3.8);
      tl.from("#t4", { y: 40, opacity: 0, duration: 0.4, ease: "power3.out" }, 4.05);
      tl.from("#t5", { y: 40, opacity: 0, duration: 0.4, ease: "power3.out" }, 4.3);
      tl.from("#t6", { y: 40, opacity: 0, duration: 0.4, ease: "power3.out" }, 4.55);
      tl.from("#bbar", { y: 20, opacity: 0, duration: 0.4, ease: "power2.out" }, 5.2);

      tl.to("#s2-inner", { opacity: 0, duration: 0.5, ease: "power1.inOut" }, 23.0);
      tl.from("#s3-inner", { opacity: 0, duration: 0.5, ease: "power1.inOut" }, 23.0);

      tl.from("#s3 .big-label", { opacity: 0, duration: 0.4, ease: "power2.out" }, 23.4);
      tl.from("#s3 .big-num", { y: 50, opacity: 0, scale: 0.88, duration: 0.7, ease: "expo.out" }, 23.7);
      tl.from("#s3 .big-sub", { opacity: 0, duration: 0.4, ease: "power1.out" }, 24.3);
      tl.from("#s3 .cta", { y: 24, opacity: 0, duration: 0.5, ease: "power2.out" }, 25.0);

      tl.to("#s3-inner", { opacity: 0, duration: 0.6, ease: "power2.inOut" }, 31.0);

      window.__timelines["s3-tools-f"] = tl;
    </script>
  </body>
</html>
