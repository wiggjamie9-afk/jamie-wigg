<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #08050d;
        font-family: "Space Grotesk", system-ui, sans-serif;
        color: #ffffff;
      }
      .scene { position: absolute; inset: 0; width: 1080px; height: 1920px; }
      .scene-inner {
        position: absolute; inset: 0;
        display: flex; flex-direction: column;
        justify-content: center; align-items: center;
        padding: 120px 70px;
        box-sizing: border-box;
        background: #08050d;
      }
      .scene-bg-radial {
        position: absolute; inset: 0;
        background:
          radial-gradient(700px 800px at 25% 25%, rgba(124, 58, 237, 0.28), transparent 60%),
          radial-gradient(700px 800px at 75% 75%, rgba(255, 31, 90, 0.22), transparent 65%);
        pointer-events: none;
      }
      .grid-overlay {
        position: absolute; inset: 0;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.045) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.045) 1px, transparent 1px);
        background-size: 60px 60px;
        pointer-events: none;
      }
      .label-mono {
        font-family: "JetBrains Mono", monospace;
        font-size: 22px; letter-spacing: 4px;
        color: #e6e6ee; text-transform: uppercase;
      }
      .gradient-text {
        background: linear-gradient(135deg, #ff7aa6, #e0c0ff 50%, #8af6ff);
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent;
        color: transparent;
      }

      /* Scene 1 — TITLE */
      #scene1 .badge {
        display: inline-flex; align-items: center; gap: 12px;
        padding: 14px 26px;
        border: 1px solid rgba(255, 31, 90, 0.55);
        background: rgba(255, 31, 90, 0.18);
        border-radius: 999px;
        font-family: "JetBrains Mono", monospace;
        font-size: 20px; letter-spacing: 3px;
        color: #ffd9e8; text-transform: uppercase;
        margin-bottom: 80px;
      }
      #scene1 .badge-dot {
        width: 12px; height: 12px; border-radius: 50%;
        background: #ff1f5a; box-shadow: 0 0 22px #ff1f5a;
      }
      #scene1 .wordmark {
        font-weight: 800; font-size: 170px;
        line-height: 0.9; letter-spacing: -5px;
        margin-bottom: 50px; text-align: center;
      }
      #scene1 .tagline {
        font-family: "JetBrains Mono", monospace;
        font-size: 32px; letter-spacing: 6px;
        color: #ffffff; text-transform: uppercase;
        text-align: center; line-height: 1.4;
      }

      /* Scene 2 — PILLARS */
      #scene2 .eyebrow { margin-bottom: 50px; }
      #scene2 .pillars {
        display: flex; flex-direction: column;
        gap: 36px; width: 100%;
      }
      #scene2 .pillar {
        background: linear-gradient(90deg, rgba(40, 30, 60, 0.95), rgba(28, 22, 42, 0.6));
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 22px;
        padding: 40px 44px;
        display: flex; align-items: center; gap: 32px;
      }
      #scene2 .pillar-num {
        font-family: "JetBrains Mono", monospace;
        font-weight: 800; font-size: 56px;
        line-height: 1; min-width: 96px;
      }
      #scene2 .pillar-num.cyan { color: #8af6ff; }
      #scene2 .pillar-num.green { color: #6effc0; }
      #scene2 .pillar-num.gold { color: #ffe070; }
      #scene2 .pillar-num.pink { color: #ffaedb; }
      #scene2 .pillar-text {
        display: flex; flex-direction: column; gap: 6px;
      }
      #scene2 .pillar-name {
        font-weight: 700; font-size: 52px;
        letter-spacing: -1px;
      }
      #scene2 .pillar-desc {
        font-family: "JetBrains Mono", monospace;
        font-size: 22px; letter-spacing: 2px;
        color: #cfcfd8; text-transform: uppercase;
      }

      /* Scene 3 — CONCEPTS */
      #scene3 .h2 {
        font-size: 100px; font-weight: 800; letter-spacing: -3px;
        text-align: center; margin-bottom: 80px; line-height: 1;
      }
      #scene3 .stack {
        display: flex; flex-direction: column;
        gap: 36px; align-items: center;
      }
      #scene3 .word {
        font-weight: 800; font-size: 130px;
        letter-spacing: -4px; line-height: 0.95;
      }

      /* Scene 4 — CTA */
      #scene4 .badge {
        display: inline-flex; align-items: center; gap: 12px;
        padding: 14px 26px;
        border: 1px solid rgba(110, 255, 192, 0.55);
        background: rgba(110, 255, 192, 0.14);
        border-radius: 999px;
        font-family: "JetBrains Mono", monospace;
        font-size: 22px; letter-spacing: 3px;
        color: #b6ffe0; text-transform: uppercase;
        margin-bottom: 60px;
      }
      #scene4 .h2 {
        font-size: 130px; font-weight: 800; letter-spacing: -4px;
        margin-bottom: 28px; text-align: center; line-height: 1;
      }
      #scene4 .deck {
        font-family: "JetBrains Mono", monospace;
        font-size: 26px; letter-spacing: 4px;
        color: #e6e6ee; text-transform: uppercase;
        margin-bottom: 80px; text-align: center; line-height: 1.5;
      }
      #scene4 .wordmark {
        font-weight: 800; font-size: 130px;
        letter-spacing: -4px; line-height: 0.9;
        margin-bottom: 36px;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="32"
      data-width="1080"
      data-height="1920"
    >
      <!-- Scene 1: TITLE  (0–7.5s) -->
      <div id="scene1" class="scene clip" data-start="0" data-duration="7.5" data-track-index="1">
        <div class="scene-inner" id="scene1-inner">
          <div class="scene-bg-radial"></div>
          <div class="grid-overlay"></div>
          <div class="badge"><span class="badge-dot"></span>Coming soon</div>
          <div class="wordmark gradient-text">RHYTHMIX</div>
          <div class="tagline">An AI music<br/>platform</div>
        </div>
      </div>

      <!-- Scene 2: PILLARS  (7–15.5s) -->
      <div id="scene2" class="scene clip" data-start="7" data-duration="8.5" data-track-index="2">
        <div class="scene-inner" id="scene2-inner">
          <div class="scene-bg-radial"></div>
          <div class="grid-overlay"></div>
          <div class="eyebrow label-mono">What we're building</div>
          <div class="pillars">
            <div class="pillar"><div class="pillar-num pink">01</div><div class="pillar-text"><div class="pillar-name">Generate</div><div class="pillar-desc">Idea to track</div></div></div>
            <div class="pillar"><div class="pillar-num green">02</div><div class="pillar-text"><div class="pillar-name">Master</div><div class="pillar-desc">Finish your sound</div></div></div>
            <div class="pillar"><div class="pillar-num cyan">03</div><div class="pillar-text"><div class="pillar-name">Distribute</div><div class="pillar-desc">Get it out there</div></div></div>
            <div class="pillar"><div class="pillar-num gold">04</div><div class="pillar-text"><div class="pillar-name">Earn</div><div class="pillar-desc">Build a career</div></div></div>
          </div>
        </div>
      </div>

      <!-- Scene 3: CONCEPTS  (15–24.5s) -->
      <div id="scene3" class="scene clip" data-start="15" data-duration="9.5" data-track-index="3">
        <div class="scene-inner" id="scene3-inner">
          <div class="scene-bg-radial"></div>
          <div class="grid-overlay"></div>
          <div class="h2">One platform.<br/>Every step.</div>
          <div class="stack">
            <div class="word gradient-text">Create.</div>
            <div class="word gradient-text">Release.</div>
            <div class="word gradient-text">Grow.</div>
          </div>
        </div>
      </div>

      <!-- Scene 4: CTA  (24–32s, final) -->
      <div id="scene4" class="scene clip" data-start="24" data-duration="8" data-track-index="4">
        <div class="scene-inner" id="scene4-inner">
          <div class="scene-bg-radial"></div>
          <div class="grid-overlay"></div>
          <div class="badge"><span class="badge-dot" style="background:#6effc0;box-shadow:0 0 22px #6effc0;"></span>Early access</div>
          <div class="h2"><span class="gradient-text">Be first.</span></div>
          <div class="deck">Join the waitlist<br/>for launch</div>
          <div class="wordmark gradient-text">RHYTHMIX</div>
        </div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Scene 1
      tl.from("#scene1 .badge", { y: -28, opacity: 0, duration: 0.45, ease: "power3.out" }, 0.2);
      tl.from("#scene1 .wordmark", { y: 80, opacity: 0, scale: 0.94, duration: 0.85, ease: "expo.out" }, 0.35);
      tl.from("#scene1 .tagline", { y: 26, opacity: 0, duration: 0.55, ease: "power2.out" }, 0.95);
      tl.to("#scene1-inner", { opacity: 0, duration: 0.5, ease: "power1.inOut" }, 7.0);

      // Scene 2
      tl.from("#scene2-inner", { opacity: 0, duration: 0.5, ease: "power1.inOut" }, 7.0);
      tl.from("#scene2 .eyebrow", { y: -18, opacity: 0, duration: 0.4, ease: "power2.out" }, 7.3);
      tl.from("#scene2 .pillar", { x: -50, opacity: 0, duration: 0.55, ease: "expo.out", stagger: 0.14 }, 7.55);
      tl.from("#scene2 .pillar-num", { scale: 0.7, opacity: 0, duration: 0.45, ease: "back.out(1.6)", stagger: 0.14 }, 7.7);
      tl.to("#scene2-inner", { opacity: 0, duration: 0.5, ease: "power1.inOut" }, 15.0);

      // Scene 3
      tl.from("#scene3-inner", { opacity: 0, duration: 0.5, ease: "power1.inOut" }, 15.0);
      tl.from("#scene3 .h2", { y: 36, opacity: 0, duration: 0.65, ease: "power3.out" }, 15.3);
      tl.from("#scene3 .word", {
        y: 50, opacity: 0, scale: 0.92,
        duration: 0.6, ease: "expo.out",
        stagger: 0.4,
      }, 15.95);
      tl.to("#scene3-inner", { opacity: 0, duration: 0.5, ease: "power1.inOut" }, 24.0);

      // Scene 4
      tl.from("#scene4-inner", { opacity: 0, duration: 0.5, ease: "power1.inOut" }, 24.0);
      tl.from("#scene4 .badge", { y: -22, opacity: 0, duration: 0.5, ease: "power3.out" }, 24.3);
      tl.from("#scene4 .h2", { y: 40, opacity: 0, duration: 0.7, ease: "expo.out" }, 24.7);
      tl.from("#scene4 .deck", { opacity: 0, duration: 0.5, ease: "power1.out" }, 25.4);
      tl.from("#scene4 .wordmark", { scale: 0.85, opacity: 0, duration: 0.7, ease: "back.out(1.5)" }, 25.85);
      tl.to("#scene4-inner", { opacity: 0, duration: 0.6, ease: "power2.inOut" }, 31.4);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
