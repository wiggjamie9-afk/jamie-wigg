<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>RHYTHMIX — What if? Poster</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #08050d;
        font-family: "Space Grotesk", system-ui, -apple-system, sans-serif;
        color: #ffffff;
        -webkit-font-smoothing: antialiased;
      }

      .poster {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #08050d;
      }

      /* Magenta-led radial wash — louder than itslive (snap-cut, social feed) */
      .bg-radial {
        position: absolute; inset: 0;
        background:
          radial-gradient(820px 700px at 88% 8%, rgba(255, 31, 90, 0.42), transparent 60%),
          radial-gradient(900px 800px at 10% 95%, rgba(124, 58, 237, 0.45), transparent 65%),
          radial-gradient(560px 480px at 50% 50%, rgba(0, 216, 255, 0.15), transparent 70%);
        pointer-events: none;
      }

      /* Tight engineering grid */
      .grid {
        position: absolute; inset: 0;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
        background-size: 60px 60px;
        pointer-events: none;
      }

      /* Heavy vignette — push the eye to the centre headline at thumb size */
      .vignette {
        position: absolute; inset: 0;
        background: radial-gradient(ellipse at center, transparent 42%, rgba(8, 5, 13, 0.78) 100%);
        pointer-events: none;
      }

      /* Diagonal snap-cut slash — feed-stopping graphic device */
      .slash {
        position: absolute;
        left: -200px; right: -200px;
        top: 44%;
        height: 14px;
        background: linear-gradient(90deg, transparent, #ff1f5a 20%, #f5c000 50%, #00e887 80%, transparent);
        transform: rotate(-4deg);
        box-shadow: 0 0 60px rgba(255, 31, 90, 0.55);
        pointer-events: none;
      }
      .slash.thin {
        top: 47.5%;
        height: 2px;
        opacity: 0.7;
        box-shadow: none;
      }

      /* Frame */
      .frame {
        position: absolute; inset: 48px;
        border: 1px solid rgba(255, 255, 255, 0.10);
        border-radius: 28px;
        pointer-events: none;
      }

      .content {
        position: absolute; inset: 0;
        display: flex; flex-direction: column;
        justify-content: space-between;
        padding: 120px 96px 110px;
      }

      /* ===== TOP ===== */
      .top {
        display: flex; flex-direction: column; gap: 32px;
        align-items: flex-start;
      }
      .wordmark {
        font-family: "Space Grotesk", system-ui, sans-serif;
        font-weight: 800;
        font-size: 44px;
        letter-spacing: 14px;
        color: #ffffff;
        text-transform: uppercase;
      }
      .wordmark .dot {
        display: inline-block;
        width: 14px; height: 14px;
        background: #ff1f5a;
        border-radius: 50%;
        margin-left: 6px;
        transform: translateY(-6px);
        box-shadow: 0 0 24px #ff1f5a;
      }
      .tag {
        display: inline-flex; align-items: center; gap: 18px;
        padding: 16px 30px;
        border: 1px solid rgba(255, 31, 90, 0.6);
        background: rgba(255, 31, 90, 0.14);
        border-radius: 999px;
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 22px; letter-spacing: 7px;
        color: #ffb6c8; text-transform: uppercase;
      }
      .tag .pip {
        width: 14px; height: 14px; border-radius: 50%;
        background: #ff1f5a;
        box-shadow: 0 0 22px #ff1f5a;
      }

      /* ===== HEADLINE — the snap cut ===== */
      .headline {
        position: relative;
      }
      .pre {
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 30px;
        letter-spacing: 8px;
        color: rgba(230, 230, 238, 0.55);
        text-transform: uppercase;
        margin-bottom: 28px;
      }
      .pre .arrow { color: #ff1f5a; }

      .h-line {
        font-weight: 800;
        font-size: 196px;
        line-height: 0.86;
        letter-spacing: -8px;
      }
      .h-line.what {
        font-size: 156px;
        line-height: 0.88;
        letter-spacing: -6px;
        color: #ffffff;
      }
      .h-line.years {
        font-size: 280px;
        line-height: 0.84;
        letter-spacing: -14px;
        margin-top: 18px;
        background: linear-gradient(135deg, #ff1f5a 0%, #f5c000 55%, #00e887 100%);
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent;
        text-shadow: 0 0 60px rgba(255, 31, 90, 0.25);
        position: relative;
      }
      .h-line.years::after {
        content: "";
        position: absolute;
        right: -20px;
        bottom: 28px;
        width: 24px; height: 200px;
        background: #ff1f5a;
        box-shadow: 0 0 40px rgba(255, 31, 90, 0.7);
      }

      /* Cross-out lockup on "years" with a hand-cut vibe */
      .strike {
        position: absolute;
        left: 8px;
        right: 8px;
        top: 78%;
        height: 16px;
        background: #ffffff;
        transform: rotate(-1.2deg);
        box-shadow: 0 0 32px rgba(255, 255, 255, 0.4);
      }

      /* Echo line — pivot to the new reality */
      .echo {
        margin-top: 44px;
        font-family: "Space Grotesk", system-ui, sans-serif;
        font-weight: 700;
        font-size: 64px;
        line-height: 1;
        letter-spacing: -2px;
        color: #ffffff;
      }
      .echo .minutes {
        background: linear-gradient(135deg, #00d8ff, #00e887);
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent;
        font-weight: 800;
      }

      /* ===== BOTTOM ===== */
      .bottom {
        display: flex; flex-direction: column; gap: 36px;
        align-items: flex-start;
      }

      .spec {
        display: flex; flex-direction: column; gap: 16px;
      }
      .spec .lead {
        font-size: 42px;
        font-weight: 600;
        letter-spacing: -1px;
        color: #ffffff;
        line-height: 1.15;
      }
      .spec .lead .price {
        background: linear-gradient(135deg, #f5c000, #ff6fc8);
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent;
        font-weight: 800;
      }
      .spec .lead .lifetime {
        color: #00e887;
        font-weight: 800;
      }

      .url-block {
        width: 100%;
        display: flex; align-items: center; justify-content: space-between;
        gap: 24px;
        padding: 30px 40px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        background: linear-gradient(135deg, rgba(255, 31, 90, 0.18), rgba(124, 58, 237, 0.22));
        border-radius: 22px;
      }
      .url {
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 38px; letter-spacing: 2px;
        color: #ffffff;
        font-weight: 600;
      }
      .url .scheme { color: rgba(230, 230, 238, 0.55); }
      .url .host {
        background: linear-gradient(135deg, #00d8ff, #ff6fc8);
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .arrow-cta {
        width: 56px; height: 56px;
        border-radius: 50%;
        background: linear-gradient(135deg, #ff1f5a, #f5c000);
        display: flex; align-items: center; justify-content: center;
        color: #08050d;
        font-weight: 800;
        font-size: 28px;
        box-shadow: 0 0 36px rgba(255, 31, 90, 0.5);
        flex-shrink: 0;
      }

      /* Crop marks */
      .crop {
        position: absolute;
        width: 32px; height: 32px;
        border: 2px solid rgba(255, 255, 255, 0.30);
      }
      .crop.tl { top: 28px; left: 28px; border-right: none; border-bottom: none; }
      .crop.tr { top: 28px; right: 28px; border-left: none; border-bottom: none; }
      .crop.bl { bottom: 28px; left: 28px; border-right: none; border-top: none; }
      .crop.br { bottom: 28px; right: 28px; border-left: none; border-top: none; }

      /* Side label */
      .side-label {
        position: absolute;
        left: 78px;
        top: 50%;
        transform: translateY(-50%) rotate(-90deg);
        transform-origin: left center;
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 18px;
        letter-spacing: 10px;
        color: rgba(230, 230, 238, 0.45);
        text-transform: uppercase;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div class="poster">
      <div class="bg-radial"></div>
      <div class="grid"></div>
      <div class="slash thin"></div>
      <div class="slash"></div>
      <div class="vignette"></div>
      <div class="frame"></div>

      <div class="crop tl"></div>
      <div class="crop tr"></div>
      <div class="crop bl"></div>
      <div class="crop br"></div>

      <div class="side-label">Snap · Cut · Ship · 60s</div>

      <div class="content">

        <div class="top">
          <div class="wordmark">RHYTHMIX<span class="dot"></span></div>
          <div class="tag"><span class="pip"></span>What if?</div>
        </div>

        <div class="headline">
          <div class="pre"><span class="arrow">→</span> &nbsp;What if making music</div>
          <div class="h-line what">didn&rsquo;t take</div>
          <div class="h-line years">
            YEARS<span style="color:#ffffff;-webkit-text-fill-color:#ffffff;">?</span>
            <span class="strike"></span>
          </div>
          <div class="echo">Idea to track in <span class="minutes">minutes.</span></div>
        </div>

        <div class="bottom">
          <div class="spec">
            <div class="lead">
              An AI music platform. <span class="price">AU$149.</span> <span class="lifetime">Lifetime.</span>
            </div>
          </div>

          <div class="url-block">
            <div class="url"><span class="scheme">→ </span><span class="host">rhythmixapp.com.au</span></div>
            <div class="arrow-cta">↗</div>
          </div>
        </div>

      </div>
    </div>
  </body>
</html>
