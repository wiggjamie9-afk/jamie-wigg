<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LanguageLens Tutorial</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 1920px;
            height: 1080px;
            background: linear-gradient(135deg, #3b82f615 0%, #3b82f605 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
        }

        .container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px;
            position: relative;
        }

        .background-shapes {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            overflow: hidden;
            z-index: 0;
        }

        .shape {
            position: absolute;
            border-radius: 50%;
            opacity: 0.1;
        }

        .shape-1 {
            width: 400px;
            height: 400px;
            background: #3b82f6;
            top: -100px;
            right: -100px;
        }

        .shape-2 {
            width: 300px;
            height: 300px;
            background: #60a5fa;
            bottom: 100px;
            left: -50px;
        }

        .content {
            position: relative;
            z-index: 1;
            text-align: center;
            max-width: 900px;
        }

        .icon {
            font-size: 120px;
            margin-bottom: 30px;
            opacity: 0;
            animation: slideInDown 0.8s ease-out forwards;
        }

        .title {
            font-size: 72px;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 20px;
            opacity: 0;
            animation: slideInDown 0.8s ease-out 0.2s forwards;
            letter-spacing: -1px;
        }

        .tagline {
            font-size: 36px;
            color: #3b82f6;
            font-weight: 600;
            margin-bottom: 40px;
            opacity: 0;
            animation: slideInDown 0.8s ease-out 0.4s forwards;
        }

        .description {
            font-size: 24px;
            color: #4a4a4a;
            line-height: 1.6;
            margin-bottom: 50px;
            opacity: 0;
            animation: slideInUp 0.8s ease-out 0.6s forwards;
        }

        .features {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-bottom: 40px;
            opacity: 0;
            animation: slideInUp 0.8s ease-out 0.8s forwards;
        }

        .feature {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .feature-icon {
            width: 60px;
            height: 60px;
            background: #3b82f620;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
        }

        .feature-text {
            font-size: 18px;
            color: #333;
            font-weight: 500;
        }

        .cta-button {
            background: linear-gradient(135deg, #3b82f6, #60a5fa);
            color: white;
            border: none;
            padding: 18px 50px;
            font-size: 20px;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 30px #3b82f630;
            opacity: 0;
            animation: slideInUp 0.8s ease-out 1s forwards;
            transition: all 0.3s ease;
        }

        .cta-button:hover {
            transform: translateY(-4px);
            box-shadow: 0 15px 40px #3b82f640;
        }

        .watermark {
            position: absolute;
            bottom: 20px;
            right: 30px;
            font-size: 14px;
            color: #999;
            opacity: 0.5;
        }

        @keyframes slideInDown {
            from {
                opacity: 0;
                transform: translateY(-40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="background-shapes">
            <div class="shape shape-1"></div>
            <div class="shape shape-2"></div>
        </div>

        <div class="content">
            <div class="icon">🌐</div>
            <h1 class="title">LanguageLens</h1>
            <p class="tagline">Master Languages with AI Pronunciation Coach</p>
            <p class="description">Real-time pronunciation guidance and language mastery tools</p>

            <div class="features">
                
                    <div class="feature" style="animation-delay: 0.9s">
                        <div class="feature-icon">✓</div>
                        <div class="feature-text">Pronunciation feedback</div>
                    </div>
                
                    <div class="feature" style="animation-delay: 1s">
                        <div class="feature-icon">✓</div>
                        <div class="feature-text">Interactive lessons</div>
                    </div>
                
                    <div class="feature" style="animation-delay: 1.1s">
                        <div class="feature-icon">✓</div>
                        <div class="feature-text">Fluency tracking</div>
                    </div>
                
            </div>

            <button class="cta-button">Start Learning Languages</button>
        </div>

        <div class="watermark">AI Tutorial • 2026</div>
    </div>

    <script>
        // Optional: Add GSAP animations for more dynamic effects
        window.addEventListener('load', () => {
            // Subtle floating animation on the entire content
            gsap.to('.content', {
                y: 20,
                duration: 3,
                repeat: -1,
                yoyo: true,
                ease: 'sine.inOut',
                delay: 1
            });
        });
    </script>
</body>
</html>
