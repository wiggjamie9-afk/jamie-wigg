<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>RHYTHMIX — Your spark is already there</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #0a070f;
        font-family: "Space Grotesk", system-ui, -apple-system, sans-serif;
        color: #ffffff;
        -webkit-font-smoothing: antialiased;
      }

      .poster {
        position: relative;
        width: 1080px;
        height: 1920px;
        background: #0a070f;
        overflow: hidden;
      }

      /* Soulful atmosphere — warmer, slower pools than the teaser */
      .bg-pools {
        position: absolute; inset: 0;
        background:
          radial-gradient(1100px 1300px at 50% 30%, rgba(255, 175, 210, 0.34), transparent 62%),
          radial-gradient(900px 1100px at 18% 78%, rgba(224, 192, 255, 0.26), transparent 66%),
          radial-gradient(950px 950px at 88% 88%, rgba(255, 200, 140, 0.18), transparent 68%),
          radial-gradient(700px 900px at 60% 12%, rgba(138, 246, 255, 0.10), transparent 72%);
        filter: blur(0.5px);
        pointer-events: none;
      }

      /* Spark — a single soft point of light, the soul motif */
      .spark {
        position: absolute;
        left: 50%; top: 38%;
        transform: translate(-50%, -50%);
        width: 18px; height: 18px;
        border-radius: 50%;
        background: #ffe8f0;
        box-shadow:
          0 0 30px rgba(255, 232, 240, 0.95),
          0 0 80px rgba(255, 175, 210, 0.65),
          0 0 180px rgba(255, 122, 166, 0.45),
          0 0 320px rgba(224, 192, 255, 0.35);
        pointer-events: none;
      }
      .spark::before {
        content: "";
        position: absolute;
        left: 50%; top: 50%;
        transform: translate(-50%, -50%);
        width: 520px; height: 520px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 232, 240, 0.12) 0%, transparent 60%);
        pointer-events: none;
      }

      /* Concentric breath rings around the spark */
      .ring {
        position: absolute;
        left: 50%; top: 38%;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        border: 1px solid rgba(255, 232, 240, 0.10);
        pointer-events: none;
      }
      .ring.r1 { width: 360px;  height: 360px;  border-color: rgba(255, 232, 240, 0.14); }
      .ring.r2 { width: 620px;  height: 620px;  border-color: rgba(224, 192, 255, 0.10); }
      .ring.r3 { width: 920px;  height: 920px;  border-color: rgba(255, 175, 210, 0.07); }
      .ring.r4 { width: 1240px; height: 1240px; border-color: rgba(255, 255, 255, 0.04); }

      /* Faint film grain */
      .bg-grain {
        position: absolute; inset: 0;
        background-image: radial-gradient(rgba(255, 255, 255, 0.045) 1px, transparent 1px);
        background-size: 3px 3px;
        opacity: 0.5;
        mix-blend-mode: overlay;
        pointer-events: none;
      }

      /* Soft vignette — pulls the eye to centre */
      .bg-vignette {
        position: absolute; inset: 0;
        background: radial-gradient(ellipse 75% 65% at 50% 45%, transparent 50%, rgba(10, 7, 15, 0.88) 100%);
        pointer-events: none;
      }

      .frame {
        position: absolute;
        inset: 80px;
        border: 1px solid rgba(255, 255, 255, 0.05);
        border-radius: 4px;
        pointer-events: none;
      }

      .content {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 200px 110px 160px;
      }

      /* Top — quiet wordmark and a soft eyebrow */
      .top {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 40px;
      }

      .eyebrow {
        display: inline-flex; align-items: center; gap: 16px;
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 22px;
        letter-spacing: 8px;
        color: rgba(255, 220, 230, 0.70);
        text-transform: uppercase;
      }
      .eyebrow .dot {
        width: 6px; height: 6px; border-radius: 50%;
        background: #ffafd2;
        box-shadow: 0 0 14px #ffafd2;
      }
      .eyebrow .line {
        width: 60px; height: 1px;
        background: linear-gradient(90deg, transparent, rgba(255, 175, 210, 0.55), transparent);
      }

      .wordmark-top {
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 26px;
        letter-spacing: 18px;
        color: rgba(255, 255, 255, 0.50);
        text-transform: uppercase;
        padding-left: 18px;
      }

      /* Headline — the poetic centre, softer and more whispered */
      .center {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 72px;
        margin-top: 60px;
      }

      .headline {
        font-weight: 200;
        font-size: 124px;
        line-height: 1.06;
        letter-spacing: -3.5px;
        color: rgba(255, 255, 255, 0.92);
      }
      .headline .soft {
        font-weight: 200;
        color: rgba(255, 255, 255, 0.55);
        font-style: italic;
      }
      .headline em {
        font-style: normal;
        font-weight: 400;
        background: linear-gradient(135deg, #ffafd2 0%, #ffd9b8 40%, #e0c0ff 75%, #c8e8ff 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        color: transparent;
      }
      .headline .period {
        color: #ffafd2;
        font-weight: 300;
      }

      .hair {
        width: 180px;
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(255, 175, 210, 0.55), transparent);
      }

      /* Big wordmark — lighter weight than launch posters for the soul register */
      .wordmark {
        font-weight: 500;
        font-size: 160px;
        line-height: 0.9;
        letter-spacing: -6px;
        background: linear-gradient(135deg, #ffafd2 0%, #ffd9b8 38%, #e0c0ff 72%, #c8e8ff 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        color: transparent;
        padding-left: 16px;
      }

      /* Bottom block */
      .bottom {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 36px;
      }

      .subhead {
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 26px;
        letter-spacing: 5px;
        color: rgba(255, 255, 255, 0.78);
        text-transform: uppercase;
        text-align: center;
        line-height: 1.7;
      }
      .subhead .sep {
        color: rgba(255, 175, 210, 0.55);
        margin: 0 14px;
      }
      .subhead .price {
        color: #ffd9b8;
      }
      .subhead .lifetime {
        color: rgba(255, 255, 255, 0.92);
      }

      .url {
        margin-top: 6px;
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 30px;
        letter-spacing: 4px;
        color: #ffffff;
        text-transform: lowercase;
        padding: 18px 40px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.04);
      }
      .url .accent {
        background: linear-gradient(135deg, #ffafd2, #e0c0ff 60%, #c8e8ff);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        color: transparent;
      }
    </style>
  </head>
  <body>
    <div class="poster">
      <div class="bg-pools"></div>
      <div class="ring r4"></div>
      <div class="ring r3"></div>
      <div class="ring r2"></div>
      <div class="ring r1"></div>
      <div class="spark"></div>
      <div class="bg-grain"></div>
      <div class="bg-vignette"></div>
      <div class="frame"></div>

      <div class="content">
        <div class="top">
          <div class="eyebrow">
            <span class="line"></span>
            <span class="dot"></span>
            A song that finds you
            <span class="dot"></span>
            <span class="line"></span>
          </div>
          <div class="wordmark-top">RHYTHMIX</div>
        </div>

        <div class="center">
          <div class="headline">
            <span class="soft">your spark is</span><br/>
            already <em>there</em><span class="period">.</span>
          </div>
          <div class="hair"></div>
          <div class="wordmark">RHYTHMIX</div>
        </div>

        <div class="bottom">
          <div class="subhead">
            An AI music platform
            <br/>
            <span class="price">AU$149</span><span class="sep">·</span><span class="lifetime">Lifetime</span>
          </div>
          <div class="url"><span class="accent">rhythmixapp</span>.com.au</div>
        </div>
      </div>
    </div>
  </body>
</html>
