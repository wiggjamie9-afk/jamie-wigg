# Netlify config for the RHYTHMIX marketing site.
#
# This repo serves a pure static site (plain HTML/CSS, no build step),
# so `command` is empty and `publish` is the repo root.
#
# Production hosting today is GitHub Pages via the CNAME file —
# this config exists so we can also deploy branch previews to Netlify
# (e.g. *.netlify.app URLs for tap-testing on phone) without touching prod.

[build]
  publish = "."
  command = ""

# Server-side 301 from the old "22 AI features" pivot page to the current
# RHYTHMIX Studio page. The page itself still contains a meta-refresh +
# JS redirect as a defence-in-depth fallback (and so this also works under
# GitHub Pages, which doesn't honour [[redirects]]), but the 301 here gives
# Netlify deploys a proper search-engine-friendly redirect.
[[redirects]]
  from = "/rhythmix.html"
  to = "/studio.html"
  status = 301
  force = true

# Defence-in-depth: even though robots.txt disallows these orphan pages,
# also send an X-Robots-Tag header so crawlers that ignore robots.txt
# (and any AI scrapers) still see "don't index".
[[headers]]
  for = "/thumbnail.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/launch-section.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Standard hardening on the rest of the site. Conservative values that
# match what GitHub Pages already serves so behaviour stays consistent.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
