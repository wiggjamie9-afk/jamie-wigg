<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>RHYTHMIX — Poster</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #08050d;
        font-family: "Space Grotesk", system-ui, sans-serif;
        color: #ffffff;
      }
      .poster {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }
      .bg-radial {
        position: absolute; inset: 0;
        background:
          radial-gradient(720px 720px at 18% 22%, rgba(124, 58, 237, 0.42), transparent 60%),
          radial-gradient(760px 760px at 82% 80%, rgba(255, 31, 90, 0.30), transparent 65%),
          radial-gradient(900px 600px at 50% 50%, rgba(8, 5, 13, 0.55), transparent 70%);
        pointer-events: none;
      }
      .grid-overlay {
        position: absolute; inset: 0;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.045) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.045) 1px, transparent 1px);
        background-size: 60px 60px;
        pointer-events: none;
        mask-image: radial-gradient(ellipse 90% 90% at 50% 50%, #000 55%, transparent 100%);
        -webkit-mask-image: radial-gradient(ellipse 90% 90% at 50% 50%, #000 55%, transparent 100%);
      }
      .frame {
        position: absolute;
        inset: 36px;
        border: 1px solid rgba(255, 255, 255, 0.10);
        border-radius: 36px;
        pointer-events: none;
      }

      .content {
        position: relative;
        z-index: 2;
        width: 100%; height: 100%;
        padding: 110px 96px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      /* ---------- TOP — competitor list ---------- */
      .top { display: flex; flex-direction: column; }

      .eyebrow {
        display: inline-flex; align-items: center; gap: 14px;
        align-self: flex-start;
        padding: 12px 24px;
        border: 1px solid rgba(255, 31, 90, 0.55);
        background: rgba(255, 31, 90, 0.16);
        border-radius: 999px;
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 24px; letter-spacing: 6px;
        color: #ffd9e8; text-transform: uppercase;
        margin-bottom: 56px;
      }
      .eyebrow .dot {
        width: 12px; height: 12px; border-radius: 50%;
        background: #ff1f5a; box-shadow: 0 0 22px #ff1f5a;
      }

      .comp-list {
        display: flex; flex-direction: column;
        gap: 30px;
      }
      .comp {
        font-weight: 800;
        font-size: 124px;
        letter-spacing: -4px;
        line-height: 1;
        color: #6b6b78;
        display: flex;
        align-items: baseline;
        gap: 28px;
      }
      .comp .name {
        position: relative;
        display: inline-block;
        color: #b8b8c4;
      }
      .comp .name::after {
        content: "";
        position: absolute;
        left: -10px; right: -10px;
        top: 52%;
        height: 8px;
        margin-top: -4px;
        background: linear-gradient(90deg, #ff1f5a, #ff6fc8);
        border-radius: 4px;
        box-shadow: 0 0 18px rgba(255, 31, 90, 0.55);
      }
      .comp .dotsep {
        color: #4a4a55;
        font-weight: 700;
        font-size: 96px;
        transform: translateY(-12px);
      }
      .comp .verb {
        color: #6b6b78;
        font-weight: 700;
      }

      .then-what {
        margin-top: 56px;
        font-weight: 800;
        font-size: 108px;
        letter-spacing: -3px;
        line-height: 1;
      }
      .then-what em {
        font-style: normal;
        background: linear-gradient(135deg, #ff7aa6, #e0c0ff 50%, #8af6ff);
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      /* ---------- DIVIDER ---------- */
      .divider {
        position: relative;
        height: 2px;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.18), transparent);
        margin: 24px 0;
      }

      /* ---------- BOTTOM — RHYTHMIX ---------- */
      .bottom {
        display: flex;
        flex-direction: column;
      }

      .wordmark {
        font-weight: 800;
        font-size: 280px;
        line-height: 0.86;
        letter-spacing: -12px;
        background: linear-gradient(135deg, #ff7aa6, #e0c0ff 50%, #8af6ff);
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 28px;
      }
      .tagline {
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 36px;
        letter-spacing: 6px;
        text-transform: uppercase;
        color: #ffffff;
        line-height: 1.3;
        margin-bottom: 64px;
      }
      .tagline .accent {
        background: linear-gradient(135deg, #6effc0, #8af6ff);
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .cta-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        padding-top: 32px;
        border-top: 1px solid rgba(255, 255, 255, 0.12);
      }
      .price {
        display: flex;
        align-items: baseline;
        gap: 18px;
      }
      .price .au {
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 32px;
        letter-spacing: 5px;
        color: #cfcfd8;
        text-transform: uppercase;
      }
      .price .amount {
        font-weight: 800;
        font-size: 120px;
        letter-spacing: -4px;
        line-height: 1;
        background: linear-gradient(135deg, #6effc0, #8af6ff);
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .price .lifetime {
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 28px;
        letter-spacing: 5px;
        color: #b6ffe0;
        text-transform: uppercase;
        padding: 8px 18px;
        border: 1px solid rgba(110, 255, 192, 0.55);
        background: rgba(110, 255, 192, 0.12);
        border-radius: 999px;
      }
      .url {
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 30px;
        letter-spacing: 4px;
        color: #ffffff;
        text-transform: lowercase;
        text-align: right;
      }
      .url .arrow {
        color: #6effc0;
        margin-right: 10px;
      }
    </style>
  </head>
  <body>
    <div class="poster">
      <div class="bg-radial"></div>
      <div class="grid-overlay"></div>
      <div class="frame"></div>

      <div class="content">
        <!-- TOP HALF — COMPETITOR FRAMING -->
        <div class="top">
          <div class="eyebrow"><span class="dot"></span>The Gap</div>

          <div class="comp-list">
            <div class="comp">
              <span class="name">Suno</span>
              <span class="dotsep">·</span>
              <span class="verb">song.</span>
            </div>
            <div class="comp">
              <span class="name">Udio</span>
              <span class="dotsep">·</span>
              <span class="verb">song.</span>
            </div>
            <div class="comp">
              <span class="name">LANDR</span>
              <span class="dotsep">·</span>
              <span class="verb">master.</span>
            </div>
          </div>

          <div class="then-what">Then <em>what?</em></div>
        </div>

        <div class="divider"></div>

        <!-- BOTTOM HALF — RHYTHMIX -->
        <div class="bottom">
          <div class="wordmark">RHYTHMIX</div>
          <div class="tagline">Built for the <span class="accent">whole journey.</span></div>

          <div class="cta-row">
            <div class="price">
              <span class="au">AU$</span>
              <span class="amount">149</span>
              <span class="lifetime">Lifetime</span>
            </div>
            <div class="url"><span class="arrow">→</span>rhythmixapp.com.au</div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
