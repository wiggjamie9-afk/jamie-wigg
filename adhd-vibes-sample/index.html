<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ADHD Vibes - Room Chaos</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 1080px;
      height: 1920px;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      font-family: "Arial", sans-serif;
      color: #00d8ff;
      overflow: hidden;
      position: relative;
    }

    .scene {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 40px;
      position: relative;
    }

    .text-block {
      font-size: 56px;
      font-weight: bold;
      text-align: center;
      margin: 20px;
      opacity: 0;
      color: #ff1f5a;
      text-shadow: 0 0 20px rgba(255, 31, 90, 0.5);
      line-height: 1.3;
    }

    .text-block.cyan {
      color: #00d8ff;
      text-shadow: 0 0 20px rgba(0, 216, 255, 0.5);
    }

    .text-block.gold {
      color: #ffd700;
      text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
    }

    .emoji {
      font-size: 80px;
      opacity: 0;
      position: absolute;
    }

    .brain-icon {
      width: 120px;
      height: 120px;
      background: #ff1f5a;
      border-radius: 50%;
      position: absolute;
      opacity: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 60px;
    }

    .tabs {
      position: absolute;
      width: 80px;
      height: 60px;
      background: #00d8ff;
      opacity: 0;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: bold;
      color: #1a1a2e;
    }

    .chaos {
      position: absolute;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .glitch {
      position: absolute;
      width: 100%;
      height: 40px;
      background: #ff1f5a;
      opacity: 0;
      left: 0;
    }
  </style>
</head>
<body>
  <div class="scene">
    <div class="text-block" id="text1">Me: Finally organized my room.</div>
    <div class="text-block cyan" id="text2">Also me 5 minutes later:</div>
    <div class="text-block" id="text3">Where did all my stuff go?</div>

    <div class="emoji" id="emoji1">🤔</div>
    <div class="emoji" id="emoji2">😵</div>
    <div class="emoji" id="emoji3">🧠</div>

    <div class="brain-icon" id="brain">🤯</div>

    <div class="tabs" id="tabs1">47</div>
    <div class="tabs" id="tabs2">48</div>
    <div class="tabs" id="tabs3">49</div>

    <div class="text-block gold" id="text4">My brain: Here's 47 browser tabs instead.</div>

    <div class="glitch" id="glitch1"></div>
    <div class="glitch" id="glitch2"></div>

    <div class="text-block cyan" id="text5">Priorities: Am I a joke to you?</div>

    <div class="text-block" id="text6">This is ADHD brain.</div>
    <div class="text-block" id="text7">No filter. Just chaos.</div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script>
    const tl = gsap.timeline();

    // 0-5s: First thought appears
    tl.to("#text1", { opacity: 1, duration: 0.5, y: 0 }, 0.5);
    tl.to("#emoji1", { opacity: 1, duration: 0.4, scale: 1 }, 1);

    // 5-10s: Second thought
    tl.to("#text2", { opacity: 1, duration: 0.4 }, 5);
    tl.to("#text3", { opacity: 1, duration: 0.5, color: "#ff1f5a" }, 6);
    tl.to("#emoji2", { opacity: 1, duration: 0.4, scale: 1.2 }, 6.5);

    // 10-15s: Brain appears with chaos
    tl.to("#brain", { opacity: 1, duration: 0.6, scale: 1 }, 10);
    tl.to("#text4", { opacity: 1, duration: 0.5 }, 11);

    // 15-20s: Tabs exploding
    tl.to("#tabs1", { opacity: 1, x: 200, y: -150, duration: 0.6 }, 14);
    tl.to("#tabs2", { opacity: 1, x: -200, y: 100, duration: 0.6 }, 14.3);
    tl.to("#tabs3", { opacity: 1, x: 100, y: 200, duration: 0.6 }, 14.6);

    // 20-30s: Priorities question
    tl.to("#glitch1", { opacity: 0.5, duration: 0.2, repeat: 3, yoyo: true }, 20);
    tl.to("#text5", { opacity: 1, duration: 0.5, scale: 1.1 }, 21);

    // 30-40s: Final message - shake effect
    tl.to("body", {
      boxShadow: "inset 0 0 40px rgba(255, 31, 90, 0.3)",
      duration: 0.3,
      repeat: 4,
      yoyo: true
    }, 30);

    tl.to("#text6", { opacity: 1, duration: 0.5 }, 32);
    tl.to("#text7", { opacity: 1, duration: 0.5, color: "#ffd700", fontSize: "64px" }, 35);

    // 40-60s: Fade everything out on beat
    tl.to(".text-block", { opacity: 0, duration: 0.8 }, 50);
    tl.to(".emoji", { opacity: 0, duration: 0.8 }, 50);
    tl.to("body", { opacity: 0.3, duration: 1 }, 55);
  </script>
</body>
</html>
