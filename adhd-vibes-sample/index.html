<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ADHD Vibes - Room Chaos</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 1080px;
      height: 1920px;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      font-family: "Arial", sans-serif;
      color: #00d8ff;
      overflow: hidden;
      position: relative;
    }

    .scene {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 40px;
      position: relative;
    }

    .character {
      position: absolute;
      width: 200px;
      height: 300px;
      opacity: 0;
    }

    .head {
      position: absolute;
      width: 150px;
      height: 150px;
      background: #ffc8dd;
      border-radius: 50%;
      border: 3px solid #ff1f5a;
      top: 20px;
      left: 25px;
      box-shadow: 0 0 20px rgba(255, 31, 90, 0.3);
    }

    .eyes {
      position: absolute;
      top: 50px;
      left: 35px;
      width: 25px;
      height: 35px;
      background: white;
      border-radius: 50%;
      border: 2px solid #000;
    }

    .eyes.right {
      left: 90px;
    }

    .pupil {
      position: absolute;
      width: 10px;
      height: 10px;
      background: #00d8ff;
      border-radius: 50%;
      top: 12px;
      left: 7px;
    }

    .mouth {
      position: absolute;
      top: 100px;
      left: 60px;
      width: 30px;
      height: 20px;
      border: 2px solid #000;
      border-top: none;
      border-radius: 0 0 30px 30px;
    }

    .body {
      position: absolute;
      width: 140px;
      height: 120px;
      background: #ff1f5a;
      border-radius: 10px;
      border: 2px solid #ff1f5a;
      top: 170px;
      left: 30px;
      box-shadow: 0 0 15px rgba(255, 31, 90, 0.2);
    }

    .text-block {
      font-size: 56px;
      font-weight: bold;
      text-align: center;
      margin: 20px;
      opacity: 0;
      color: #ff1f5a;
      text-shadow: 0 0 20px rgba(255, 31, 90, 0.5);
      line-height: 1.3;
      z-index: 10;
    }

    .text-block.cyan {
      color: #00d8ff;
      text-shadow: 0 0 20px rgba(0, 216, 255, 0.5);
    }

    .text-block.gold {
      color: #ffd700;
      text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
    }

    .chaos-lines {
      position: absolute;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .chaos-line {
      position: absolute;
      opacity: 0;
    }

    .glitch {
      position: absolute;
      width: 100%;
      height: 40px;
      background: #ff1f5a;
      opacity: 0;
      left: 0;
    }
  </style>
</head>
<body>
  <div class="scene">
    <!-- Kal/Echo Character -->
    <div class="character" id="kal">
      <div class="head">
        <div class="eyes">
          <div class="pupil"></div>
        </div>
        <div class="eyes right">
          <div class="pupil"></div>
        </div>
        <div class="mouth"></div>
      </div>
      <div class="body"></div>
    </div>

    <!-- Text blocks -->
    <div class="text-block" id="text1">Me: Finally organized my room.</div>
    <div class="text-block cyan" id="text2">Also me 5 minutes later:</div>
    <div class="text-block" id="text3">Where did all my stuff go?</div>
    <div class="text-block gold" id="text4">My brain: Here's 47 browser tabs instead.</div>
    <div class="text-block cyan" id="text5">Priorities: Am I a joke to you?</div>
    <div class="text-block" id="text6">This is ADHD brain.</div>
    <div class="text-block" id="text7">No filter. Just chaos.</div>

    <!-- Chaos lines -->
    <div class="chaos-lines" id="chaos"></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script>
    const tl = gsap.timeline();

    // 0s: Kal appears (calm state)
    tl.to("#kal", { opacity: 1, duration: 0.5, scale: 1 }, 0);

    // 0-5s: First text
    tl.to("#text1", { opacity: 1, duration: 0.5 }, 0.5);

    // 5-10s: Second text, Kal confused
    tl.to("#text2", { opacity: 1, duration: 0.4 }, 5);
    tl.to("#text3", { opacity: 1, duration: 0.5 }, 6);
    tl.to("#kal", { rotate: 5, duration: 0.4 }, 6, "<");

    // 10-15s: Brain chaos text, Kal transitions to chaos
    tl.to("#text4", { opacity: 1, duration: 0.5 }, 11);
    tl.to("#kal", {
      x: 20,
      y: -30,
      rotate: -10,
      duration: 0.8
    }, 10);

    // 15-20s: Chaos intensifies
    // Create chaos lines
    for (let i = 0; i < 8; i++) {
      const angle = (i * 45) * Math.PI / 180;
      const line = document.createElement('div');
      line.className = 'chaos-line';
      line.style.height = '3px';
      line.style.width = '100px';
      line.style.background = '#ffd700';
      line.style.left = '540px';
      line.style.top = '960px';
      line.style.transform = `rotate(${i * 45}deg)`;
      document.getElementById('chaos').appendChild(line);

      tl.to(line, { opacity: 1, duration: 0.3 }, 14 + i * 0.1);
    }

    // 20-30s: Priorities text
    tl.to("#text5", { opacity: 1, duration: 0.5 }, 21);
    tl.to("#kal", {
      scale: 1.2,
      x: 0,
      y: 0,
      duration: 0.6
    }, 20);

    // 30-40s: Final message
    tl.to("#text6", { opacity: 1, duration: 0.5 }, 32);
    tl.to("#text7", { opacity: 1, duration: 0.5, fontSize: "64px" }, 35);

    // Kal chaotic animations throughout
    tl.to("#kal", {
      rotation: "+=360",
      duration: 2,
      repeat: 2
    }, 25);

    // 50s: Fade out
    tl.to(".text-block", { opacity: 0, duration: 0.8 }, 50);
    tl.to("#kal", { opacity: 0, duration: 0.8 }, 50);
  </script>
</body>
</html>
