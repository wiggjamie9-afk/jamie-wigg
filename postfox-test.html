<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Postfox Automation - Quick Test</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      max-width: 700px;
      width: 100%;
      padding: 40px;
    }

    h1 {
      color: #333;
      margin-bottom: 10px;
      font-size: 28px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 30px;
      font-size: 14px;
    }

    .section {
      margin-bottom: 30px;
      padding: 20px;
      background: #f8f9fa;
      border-radius: 8px;
      border-left: 4px solid #667eea;
    }

    .section h2 {
      color: #333;
      font-size: 16px;
      margin-bottom: 15px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 15px;
    }

    label {
      color: #555;
      font-size: 13px;
      font-weight: 500;
    }

    input, textarea, select {
      padding: 10px 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 13px;
      font-family: inherit;
      transition: border-color 0.2s;
    }

    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    button {
      padding: 10px 16px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: background 0.2s;
      margin-right: 8px;
      margin-bottom: 8px;
    }

    button:hover {
      background: #5568d3;
    }

    button.secondary {
      background: #6c757d;
    }

    button.secondary:hover {
      background: #5a6268;
    }

    .output {
      background: #1e1e1e;
      color: #00ff00;
      padding: 15px;
      border-radius: 6px;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      max-height: 300px;
      overflow-y: auto;
      margin-top: 15px;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .success {
      color: #4caf50;
      padding: 10px;
      background: #f1f8f4;
      border-radius: 6px;
      margin-top: 10px;
      border-left: 3px solid #4caf50;
    }

    .error {
      color: #f44336;
      padding: 10px;
      background: #fdf1f0;
      border-radius: 6px;
      margin-top: 10px;
      border-left: 3px solid #f44336;
    }

    .schedule-item {
      background: white;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 10px;
      border-left: 3px solid #667eea;
      font-size: 13px;
    }

    .schedule-item strong {
      color: #333;
    }

    .schedule-item .small {
      color: #999;
      font-size: 12px;
      margin-top: 5px;
    }

    .badge {
      display: inline-block;
      padding: 3px 8px;
      background: #667eea;
      color: white;
      border-radius: 3px;
      font-size: 11px;
      margin-right: 5px;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    @media (max-width: 600px) {
      .row {
        grid-template-columns: 1fr;
      }
      .container {
        padding: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🚀 Postfox Automation Tester</h1>
    <p class="subtitle">Schedule posts, optimize captions, and test everything locally</p>

    <!-- Schedule a Post -->
    <div class="section">
      <h2>📅 Schedule a Post</h2>
      <div class="input-group">
        <label>Post Content</label>
        <textarea id="postContent" placeholder="Write your post here...">Testing Postfox automation! 🎉 #AI #Automation</textarea>
      </div>
      <div class="row">
        <div class="input-group">
          <label>Platforms</label>
          <select id="platforms" multiple size="3">
            <option value="twitter" selected>Twitter</option>
            <option value="linkedin">LinkedIn</option>
            <option value="instagram">Instagram</option>
            <option value="tiktok">TikTok</option>
          </select>
        </div>
        <div class="input-group">
          <label>Schedule Time</label>
          <input type="datetime-local" id="scheduleTime" />
        </div>
      </div>
      <div class="input-group">
        <label>Hashtags (comma separated)</label>
        <input type="text" id="hashtags" placeholder="ai, automation, socialmedia" />
      </div>
      <button onclick="schedulePost()">Schedule Post</button>
      <button class="secondary" onclick="clearOutput()">Clear</button>
      <div id="scheduleOutput"></div>
    </div>

    <!-- Optimize Caption -->
    <div class="section">
      <h2>✍️ Optimize Caption</h2>
      <div class="input-group">
        <label>Caption Text</label>
        <textarea id="captionText" placeholder="Paste your long caption here...">This is a really long caption that might be too long for Twitter. I'm going to test how the optimization works for different social media platforms.</textarea>
      </div>
      <div class="input-group">
        <label>Platform</label>
        <select id="optimizePlatform">
          <option value="twitter">Twitter (280 chars)</option>
          <option value="linkedin">LinkedIn (3000 chars)</option>
          <option value="instagram">Instagram (2200 chars)</option>
          <option value="tiktok">TikTok (2200 chars)</option>
        </select>
      </div>
      <button onclick="optimizeCaption()">Optimize Caption</button>
      <div id="optimizeOutput"></div>
    </div>

    <!-- Suggest Hashtags -->
    <div class="section">
      <h2>#️⃣ Suggest Hashtags</h2>
      <div class="input-group">
        <label>Content Text</label>
        <textarea id="hashtagContent" placeholder="Your content here...">Just launched a new feature for Claude Code that helps manage long-term projects with better workflow automation.</textarea>
      </div>
      <div class="row">
        <div class="input-group">
          <label>Platform</label>
          <select id="hashtagPlatform">
            <option value="twitter">Twitter</option>
            <option value="linkedin">LinkedIn</option>
            <option value="instagram">Instagram</option>
            <option value="tiktok">TikTok</option>
          </select>
        </div>
        <div class="input-group">
          <label>Number of Hashtags</label>
          <input type="number" id="hashtagCount" value="5" min="1" max="30" />
        </div>
      </div>
      <button onclick="suggestHashtags()">Generate Hashtags</button>
      <div id="hashtagOutput"></div>
    </div>

    <!-- View Schedule -->
    <div class="section">
      <h2>📋 Your Schedule</h2>
      <button onclick="viewSchedule()">View All Posts</button>
      <button class="secondary" onclick="clearSchedule()">Clear Schedule</button>
      <div id="scheduleView"></div>
    </div>
  </div>

  <script>
    // PostfoxAutomationHelper - All-in-one helper
    class PostfoxAutomationHelper {
      constructor() {
        this.schedule = this._loadSchedule();
      }

      _loadSchedule() {
        const saved = localStorage.getItem('postfox_schedule');
        return saved ? JSON.parse(saved) : [];
      }

      _saveSchedule() {
        localStorage.setItem('postfox_schedule', JSON.stringify(this.schedule));
      }

      schedulePost({ content, platforms, scheduledTime, hashtags = [] }) {
        if (!content || !platforms || !scheduledTime) {
          return { success: false, error: 'Missing required fields' };
        }

        const post = {
          id: `post_${Date.now()}`,
          content,
          platforms: Array.isArray(platforms) ? platforms : [platforms],
          scheduledTime: new Date(scheduledTime),
          hashtags,
          status: 'scheduled',
          createdAt: new Date(),
        };

        this.schedule.push(post);
        this._saveSchedule();

        return {
          success: true,
          postId: post.id,
          message: `✅ Post scheduled for ${post.scheduledTime.toLocaleString()}`,
        };
      }

      getScheduledPosts() {
        return {
          success: true,
          posts: this.schedule,
          count: this.schedule.length,
        };
      }

      clearSchedule() {
        this.schedule = [];
        this._saveSchedule();
        return { success: true, message: '✅ Schedule cleared' };
      }

      optimizeCaption(caption, platform = 'twitter') {
        const limits = {
          twitter: 280,
          linkedin: 3000,
          instagram: 2200,
          tiktok: 2200,
        };

        const limit = limits[platform] || 3000;
        const optimized = caption.substring(0, limit);

        return {
          caption: optimized,
          platform,
          characterCount: caption.length,
          limit,
          warning: caption.length > limit ? `Over limit by ${caption.length - limit} chars` : null,
        };
      }

      suggestHashtags(content, platform = 'twitter', count = 5) {
        const words = content.toLowerCase().split(/\s+/);
        const stopwords = ['the', 'a', 'an', 'and', 'or', 'is', 'are', 'am', 'was', 'were', 'be', 'been', 'i', 'you', 'he', 'she', 'it', 'we', 'they', 'that', 'this', 'with', 'for', 'to', 'of', 'in', 'on', 'at', 'by'];
        const keywords = words.filter(w => w.length > 3 && !stopwords.includes(w));

        const limits = { twitter: 2, linkedin: 5, instagram: 30, tiktok: 15 };
        const limit = Math.min(limits[platform] || 10, count);
        const hashtags = [...new Set(keywords)].slice(0, limit).map(k => `#${k}`);

        return {
          platform,
          hashtags,
          suggestion: hashtags.join(' '),
        };
      }
    }

    // Initialize helper
    const helper = new PostfoxAutomationHelper();

    // Set default datetime to 1 hour from now
    function setDefaultDateTime() {
      const now = new Date();
      now.setHours(now.getHours() + 1);
      document.getElementById('scheduleTime').value = now.toISOString().slice(0, 16);
    }

    // Schedule Post
    function schedulePost() {
      const content = document.getElementById('postContent').value;
      const platformSelect = document.getElementById('platforms');
      const platforms = Array.from(platformSelect.selectedOptions).map(o => o.value);
      const scheduledTime = document.getElementById('scheduleTime').value;
      const hashtags = document.getElementById('hashtags').value.split(',').map(h => h.trim()).filter(h => h);

      if (!content || platforms.length === 0 || !scheduledTime) {
        showError('scheduleOutput', 'Please fill in all fields');
        return;
      }

      const result = helper.schedulePost({
        content,
        platforms,
        scheduledTime: new Date(scheduledTime),
        hashtags,
      });

      if (result.success) {
        showSuccess('scheduleOutput', result.message + '\n\nPost ID: ' + result.postId);
        document.getElementById('postContent').value = '';
        document.getElementById('hashtags').value = '';
        setDefaultDateTime();
      } else {
        showError('scheduleOutput', result.error);
      }
    }

    // Optimize Caption
    function optimizeCaption() {
      const text = document.getElementById('captionText').value;
      const platform = document.getElementById('optimizePlatform').value;

      if (!text) {
        showError('optimizeOutput', 'Please enter caption text');
        return;
      }

      const result = helper.optimizeCaption(text, platform);

      let output = `Platform: ${result.platform}\nCharacter Limit: ${result.limit}\nOriginal Length: ${result.characterCount}\n\n`;
      output += `Optimized Caption:\n"${result.caption}"\n\n`;
      output += `Optimized Length: ${result.caption.length}/${result.limit}`;

      if (result.warning) {
        showError('optimizeOutput', output + '\n\n⚠️ ' + result.warning);
      } else {
        showSuccess('optimizeOutput', output);
      }
    }

    // Suggest Hashtags
    function suggestHashtags() {
      const content = document.getElementById('hashtagContent').value;
      const platform = document.getElementById('hashtagPlatform').value;
      const count = parseInt(document.getElementById('hashtagCount').value);

      if (!content) {
        showError('hashtagOutput', 'Please enter content');
        return;
      }

      const result = helper.suggestHashtags(content, platform, count);

      const output = `Platform: ${result.platform}\n\nSuggested Hashtags:\n${result.suggestion}\n\n(${result.hashtags.length} hashtags)`;
      showSuccess('hashtagOutput', output);
    }

    // View Schedule
    function viewSchedule() {
      const result = helper.getScheduledPosts();

      if (result.count === 0) {
        document.getElementById('scheduleView').innerHTML = '<div class="error">No posts scheduled yet</div>';
        return;
      }

      let html = `<div class="success">✅ ${result.count} post${result.count !== 1 ? 's' : ''} scheduled</div>`;

      result.posts.forEach(post => {
        html += `
          <div class="schedule-item">
            <strong>📝 ${post.content.substring(0, 50)}...</strong>
            <div class="small">
              <div><strong>When:</strong> ${post.scheduledTime.toLocaleString()}</div>
              <div><strong>Platforms:</strong> ${post.platforms.map(p => `<span class="badge">${p}</span>`).join('')}</div>
              ${post.hashtags.length > 0 ? `<div><strong>Hashtags:</strong> ${post.hashtags.join(', ')}</div>` : ''}
              <div><strong>Status:</strong> ${post.status}</div>
            </div>
          </div>
        `;
      });

      document.getElementById('scheduleView').innerHTML = html;
    }

    // Clear Schedule
    function clearSchedule() {
      if (confirm('Are you sure? This will delete all scheduled posts.')) {
        const result = helper.clearSchedule();
        showSuccess('scheduleView', result.message);
        setTimeout(() => {
          document.getElementById('scheduleView').innerHTML = '';
        }, 1500);
      }
    }

    // Clear Output
    function clearOutput() {
      document.getElementById('scheduleOutput').innerHTML = '';
    }

    // Helper: Show Success
    function showSuccess(elementId, message) {
      document.getElementById(elementId).innerHTML = `<div class="success">${message}</div>`;
    }

    // Helper: Show Error
    function showError(elementId, message) {
      document.getElementById(elementId).innerHTML = `<div class="error">${message}</div>`;
    }

    // Initialize on page load
    window.addEventListener('DOMContentLoaded', setDefaultDateTime);
  </script>
</body>
</html>
