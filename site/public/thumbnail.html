<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1280, initial-scale=1.0">
  <title>RHYTHMIX Studio — Thumbnail</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body { width:100%; height:100%; overflow:hidden; background:#000; }
    body {
      color:#fff;
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .thumb {
      width: 1280px;
      height: 720px;
      max-width: 100vw;
      max-height: 100vh;
      background: radial-gradient(ellipse 80% 60% at 50% 50%, rgba(124,58,237,.4), transparent 70%), #000;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      padding:60px;
      position:relative;
      overflow:hidden;
      transform-origin: center;
    }

    /* Glow accents */
    .glow1 {
      position:absolute;
      top:-30%; left:50%;
      transform:translateX(-50%);
      width:120%; height:80%;
      background: radial-gradient(ellipse, rgba(255,31,90,.3) 0%, transparent 60%);
    }
    .glow2 {
      position:absolute;
      bottom:-30%; right:-10%;
      width:60%; height:80%;
      background: radial-gradient(ellipse, rgba(0,216,255,.25) 0%, transparent 60%);
    }
    .grid {
      position:absolute; inset:0;
      background-image:
        linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px);
      background-size: 48px 48px;
      mask: radial-gradient(ellipse 60% 60% at 50% 50%, black 30%, transparent 100%);
      -webkit-mask: radial-gradient(ellipse 60% 60% at 50% 50%, black 30%, transparent 100%);
    }

    /* Content layers above the glow */
    .badge {
      position:relative; z-index:2;
      display:inline-flex; align-items:center; gap:10px;
      background: linear-gradient(135deg, #f5c000, #ff8800); color:#000;
      font-size:20px; font-weight:900; letter-spacing:3px; text-transform:uppercase;
      padding:12px 28px; border-radius:100px;
      margin-bottom:36px;
      box-shadow: 0 0 30px rgba(245,192,0,.25);
    }

    h1 {
      position:relative; z-index:2;
      font-size: 144px;
      font-weight:900; line-height:.95;
      letter-spacing:-5px;
      margin-bottom:8px;
      text-align:center;
    }
    h1 .grad {
      background: linear-gradient(135deg, #ff1f5a, #7c3aed, #00d8ff);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      position:relative; z-index:2;
      font-size: 28px;
      font-weight:800;
      color:#a0a0b0;
      letter-spacing: 6px;
      text-transform: uppercase;
      margin-bottom: 40px;
    }

    .tagline {
      position:relative; z-index:2;
      font-size: 36px;
      font-weight:700;
      color:#fff;
      text-align:center;
    }
    .tagline em {
      font-style: normal;
      background: linear-gradient(135deg, #ff1f5a, #7c3aed, #00d8ff);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .footer {
      position:absolute; bottom:36px; left:50%;
      transform:translateX(-50%);
      z-index:2;
      font-size:14px; font-weight:800; color:#555;
      letter-spacing:4px; text-transform:uppercase;
    }

    /* Square variant for Gumroad's cropping */
    body.square .thumb {
      width: 1080px;
      height: 1080px;
    }
    body.square h1 { font-size: 168px; }
    body.square .tagline { font-size: 42px; }

    /* Vertical (9:16) for Reels/Shorts thumbnails */
    body.vertical .thumb {
      width: 720px;
      height: 1280px;
    }
    body.vertical h1 { font-size: 110px; letter-spacing:-3px; }

    /* Variant switcher */
    .switcher {
      position:fixed;
      top:16px; left:16px;
      z-index:100;
      display:flex; gap:8px;
      font-size:12px;
    }
    .switcher button {
      background: rgba(255,255,255,.1);
      color:#fff;
      border:1px solid rgba(255,255,255,.2);
      padding:8px 14px;
      border-radius:100px;
      cursor:pointer;
      font-weight:700;
      letter-spacing:1px;
      text-transform:uppercase;
      font-family:inherit;
    }
    .switcher button:hover { background: rgba(255,255,255,.2); }
    .switcher button.active { background:#7c3aed; border-color:#7c3aed; }

    @media (max-width: 800px) {
      .switcher { font-size: 10px; }
      .switcher button { padding: 6px 10px; }
    }
  </style>
</head>
<body>
  <div class="switcher">
    <button class="active" onclick="setVariant('')">16:9</button>
    <button onclick="setVariant('square')">Square</button>
    <button onclick="setVariant('vertical')">9:16</button>
  </div>

  <div class="thumb">
    <div class="glow1"></div>
    <div class="glow2"></div>
    <div class="grid"></div>

    <div class="badge">$149 · Lifetime Access</div>
    <h1>RHYTHMIX <span class="grad">Studio</span></h1>
    <div class="subtitle">AI Music Video Generator</div>
    <div class="tagline">Your music. <em>As a movie.</em></div>

    <div class="footer">rhythmixapp.com.au</div>
  </div>

  <script>
    function setVariant(v) {
      document.body.className = v;
      document.querySelectorAll('.switcher button').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
    }
  </script>
</body>
</html>
