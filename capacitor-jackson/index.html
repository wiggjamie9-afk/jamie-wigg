<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0F172A">
  <title>Jackson's Ecosystem</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0F172A, #1E293B);
      color: #F1F5F9;
      min-height: 100vh;
      padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom) 16px;
      padding-top: max(16px, env(safe-area-inset-top));
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 100dvh;
    }

    .container {
      max-width: 400px;
      margin: 0 auto;
      width: 100%;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
    }

    h1 {
      font-size: 2.5em;
      font-weight: 700;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #FF6B9D, #6366F1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .tagline {
      font-size: 1em;
      color: #CBD5E1;
    }

    .card {
      background: rgba(30, 41, 59, 0.8);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(51, 65, 85, 0.5);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      color: #E2E8F0;
      font-size: 0.95em;
    }

    textarea, select {
      width: 100%;
      padding: 12px;
      background: #0F172A;
      border: 1.5px solid #334155;
      border-radius: 10px;
      color: #F1F5F9;
      font-size: 1em;
      font-family: inherit;
      resize: none;
      margin-bottom: 16px;
      transition: all 0.3s;
    }

    textarea:focus, select:focus {
      outline: none;
      border-color: #6366F1;
      box-shadow: 0 0 12px rgba(99, 102, 241, 0.3);
    }

    textarea {
      min-height: 100px;
      font-family: -apple-system, BlinkMacSystemFont, monospace;
    }

    .button-group {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
    }

    button {
      flex: 1;
      padding: 14px;
      background: linear-gradient(135deg, #FF6B9D, #6366F1);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1em;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      -webkit-user-select: none;
      user-select: none;
    }

    button:active {
      transform: scale(0.98);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .button-secondary {
      background: #334155;
    }

    .status {
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 16px;
      font-size: 0.95em;
      text-align: center;
      display: none;
    }

    .status.show {
      display: block;
    }

    .status.loading {
      background: rgba(99, 102, 241, 0.1);
      border: 1px solid #6366F1;
      color: #93C5FD;
    }

    .status.success {
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid #10B981;
      color: #86EFAC;
    }

    .status.error {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid #EF4444;
      color: #FCA5A5;
    }

    .output-section {
      margin-top: 20px;
    }

    .output-item {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
    }

    .output-item h3 {
      font-size: 0.95em;
      color: #10B981;
      margin-bottom: 8px;
      font-weight: 600;
    }

    audio {
      width: 100%;
      margin-top: 8px;
      border-radius: 8px;
    }

    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top: 2px solid white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .info-text {
      font-size: 0.85em;
      color: #94A3B8;
      margin-top: 8px;
      line-height: 1.4;
    }

    @supports (padding: max(0px)) {
      body {
        padding-left: max(16px, env(safe-area-inset-left));
        padding-right: max(16px, env(safe-area-inset-right));
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🎬 Jackson</h1>
      <p class="tagline">Text-to-Voice-to-Music</p>
    </header>

    <div class="card">
      <label for="script">Your Script:</label>
      <textarea id="script" placeholder="Paste your script or describe what you want..."></textarea>

      <label for="voice">Voice:</label>
      <select id="voice">
        <option value="ElevenLabs">ElevenLabs (High Quality)</option>
        <option value="Kokoro">Kokoro (Fast)</option>
      </select>

      <label for="enhance">Music Style:</label>
      <select id="enhance">
        <option value="true">Upbeat + Music</option>
        <option value="false">Narration Only</option>
      </select>

      <div class="button-group">
        <button id="generateBtn" onclick="generate()">🚀 Generate</button>
        <button class="button-secondary" onclick="clearAll()">Clear</button>
      </div>

      <div class="status" id="status"></div>
    </div>

    <div class="output-section" id="outputs"></div>

    <div class="card">
      <p class="info-text">
        ✨ Jackson converts your text into professional narration and background music instantly.
        <br><br>
        Uses Replicate MusicGen, ElevenLabs TTS, and Claude AI — all powered by your Replicate token.
      </p>
    </div>
  </div>

  <script>
    const API_BASE = 'https://jackson-ecosystem.replit.dev'; // Will deploy here

    function showStatus(message, type = 'loading') {
      const status = document.getElementById('status');
      status.textContent = message;
      status.className = `status show ${type}`;
      if (type === 'loading') {
        status.innerHTML = `<span class="spinner"></span> ${message}`;
      }
    }

    function clearAll() {
      document.getElementById('script').value = '';
      document.getElementById('status').classList.remove('show');
      document.getElementById('outputs').innerHTML = '';
    }

    async function generate() {
      const script = document.getElementById('script').value.trim();
      if (!script) {
        showStatus('Please enter a script', 'error');
        return;
      }

      const voice = document.getElementById('voice').value;
      const enhance = document.getElementById('enhance').value === 'true';
      const btn = document.getElementById('generateBtn');

      btn.disabled = true;
      showStatus('🎤 Generating narration...');

      try {
        const response = await fetch(`${API_BASE}/api/jackson`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            text: script,
            voice,
            mode: enhance ? 'text-to-voice-music' : 'text-to-voice',
            enhance,
          }),
        });

        if (!response.ok) throw new Error(await response.text());

        const result = await response.json();
        showStatus('✅ Ready!', 'success');
        displayOutputs(result);
      } catch (err) {
        showStatus(`Error: ${err.message}`, 'error');
      } finally {
        btn.disabled = false;
      }
    }

    function displayOutputs(result) {
      const outputs = document.getElementById('outputs');
      outputs.innerHTML = '';

      if (result.voice) {
        const voiceDiv = document.createElement('div');
        voiceDiv.className = 'card output-item';
        voiceDiv.innerHTML = `
          <h3>🎤 Narration</h3>
          <audio controls>
            <source src="${result.voice}" type="audio/wav">
          </audio>
        `;
        outputs.appendChild(voiceDiv);
      }

      if (result.music) {
        const musicDiv = document.createElement('div');
        musicDiv.className = 'card output-item';
        musicDiv.innerHTML = `
          <h3>🎵 Background Music</h3>
          <audio controls>
            <source src="${result.music}" type="audio/wav">
          </audio>
        `;
        outputs.appendChild(musicDiv);
      }
    }

    // Auto-focus on load
    window.addEventListener('load', () => {
      document.getElementById('script').focus();
    });
  </script>
</body>
</html>
