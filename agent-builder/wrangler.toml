# Cloudflare Pages config for the Agent Builder web app.
#
# This file describes the Pages project only. Pages deploys are produced by
# `.github/workflows/deploy-agent-builder.yml` via `cloudflare/wrangler-action@v3`
# with the command:
#   pages deploy agent-builder/out --project-name=agent-builder-app
# so this file mainly documents the project for humans + future tooling.
#
# Satisfies: T24 (Next.js static export → Cloudflare Pages at
# agent-builder.starlightmix.com)

name = "agent-builder-app"
pages_build_output_dir = "out"
compatibility_date = "2025-05-01"

# Branch → environment mapping for Pages.
#
# Cloudflare Pages automatically creates a preview deployment for every
# non-production branch at:
#   https://<branch>.agent-builder-app.pages.dev
#
# `main` is the production branch — that deploy is gated behind the
# `production` GitHub Environment in the workflow, and lands at the custom
# domain `agent-builder.starlightmix.com` once the DNS record is wired.
[env.production]
name = "agent-builder-app"

[env.preview]
name = "agent-builder-app"

# Custom domain — set in the Cloudflare dashboard under
# Pages → agent-builder-app → Custom domains:
#   agent-builder.starlightmix.com  (production)
