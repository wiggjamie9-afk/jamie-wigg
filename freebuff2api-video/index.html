<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Freebuff2API Intro</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0e27;
      color: white;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .container {
      width: 100vw;
      height: 100vh;
      background: linear-gradient(135deg, #0a0e27 0%, #1a1a3e 100%);
      position: relative;
      overflow: hidden;
    }

    /* Scene backgrounds */
    .scene {
      position: absolute;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
    }

    .scene.active {
      opacity: 1;
    }

    /* Hook Scene - 0-5s */
    .scene-hook {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      flex-direction: column;
      gap: 40px;
    }

    .hero-icon {
      font-size: 120px;
      animation: float 3s ease-in-out infinite;
    }

    .hero-text {
      font-size: 56px;
      font-weight: 700;
      text-align: center;
      line-height: 1.2;
      letter-spacing: -2px;
    }

    .hero-subtext {
      font-size: 24px;
      opacity: 0.9;
      text-align: center;
    }

    /* Problem Scene - 5-20s */
    .scene-problem {
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      flex-direction: column;
      gap: 40px;
    }

    .problem-icon {
      font-size: 100px;
    }

    .problem-title {
      font-size: 48px;
      font-weight: 700;
      text-align: center;
    }

    .problem-list {
      font-size: 28px;
      text-align: center;
      line-height: 1.6;
    }

    /* Solution Scene - 20-45s */
    .scene-solution {
      background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
      flex-direction: column;
      gap: 30px;
      color: #0a0e27;
    }

    .solution-icon {
      font-size: 80px;
    }

    .solution-title {
      font-size: 48px;
      font-weight: 700;
      text-align: center;
    }

    .feature-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      font-size: 18px;
      text-align: center;
      max-width: 800px;
    }

    .feature {
      background: rgba(255, 255, 255, 0.2);
      padding: 20px;
      border-radius: 12px;
      backdrop-filter: blur(10px);
    }

    /* CTA Scene - 45-60s */
    .scene-cta {
      background: linear-gradient(135deg, #0a0e27 0%, #1a1a3e 100%);
      flex-direction: column;
      gap: 40px;
    }

    .cta-text {
      font-size: 52px;
      font-weight: 700;
      text-align: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .cta-subtext {
      font-size: 28px;
      text-align: center;
      opacity: 0.8;
    }

    .cta-button {
      padding: 16px 40px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 20px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.3s;
    }

    .cta-button:hover {
      transform: scale(1.05);
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(-30px);
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes slideInLeft {
      from {
        opacity: 0;
        transform: translateX(-40px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes slideInRight {
      from {
        opacity: 0;
        transform: translateX(40px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .fade-in {
      animation: fadeIn 0.8s ease-out forwards;
    }

    .slide-left {
      animation: slideInLeft 0.8s ease-out forwards;
    }

    .slide-right {
      animation: slideInRight 0.8s ease-out forwards;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .hero-text {
        font-size: 36px;
      }

      .problem-title {
        font-size: 32px;
      }

      .solution-title {
        font-size: 32px;
      }

      .cta-text {
        font-size: 36px;
      }

      .feature-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Hook Scene (0-5s) -->
    <div class="scene scene-hook active">
      <div class="hero-icon fade-in">🚀</div>
      <div>
        <div class="hero-text fade-in">Freebuff2API</div>
        <div class="hero-subtext fade-in" style="animation-delay: 0.2s;">
          Gateway to Free AI Models
        </div>
      </div>
    </div>

    <!-- Problem Scene (5-20s) -->
    <div class="scene scene-problem">
      <div class="problem-icon">💸</div>
      <div>
        <div class="problem-title">Expensive AI?</div>
        <div class="problem-list">
          Vendor lock-in • Budget drain • Complex setup
        </div>
      </div>
    </div>

    <!-- Solution Scene (20-45s) -->
    <div class="scene scene-solution">
      <div class="solution-icon">⚡</div>
      <div class="solution-title">The Solution</div>
      <div class="feature-grid">
        <div class="feature">
          <div>🔌</div>
          <div>OpenAI Compatible</div>
        </div>
        <div class="feature">
          <div>🌍</div>
          <div>Deploy Anywhere</div>
        </div>
        <div class="feature">
          <div>🔄</div>
          <div>Auto Token Rotation</div>
        </div>
        <div class="feature">
          <div>⚙️</div>
          <div>One Config File</div>
        </div>
      </div>
    </div>

    <!-- CTA Scene (45-60s) -->
    <div class="scene scene-cta">
      <div>
        <div class="cta-text">Start Building</div>
        <div class="cta-subtext">Intelligence Without Limits</div>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script>
    const scenes = document.querySelectorAll('.scene');
    const timeline = gsap.timeline({ repeat: -1 });

    // Timeline for 60-second video
    timeline
      // Hook Scene (0-5s)
      .to(
        '.scene-hook',
        { opacity: 1, duration: 0.5, pointerEvents: 'auto' },
        0
      )
      .to('.scene-hook .hero-icon', { y: 0, duration: 2 }, 0.5)
      .to('.scene-hook .hero-text', { y: 0, duration: 0.8 }, 0.5)
      .to(
        '.scene-hook',
        { opacity: 0, duration: 0.5, pointerEvents: 'none' },
        5
      )

      // Problem Scene (5-20s)
      .to(
        '.scene-problem',
        { opacity: 1, duration: 0.5, pointerEvents: 'auto' },
        5
      )
      .to(
        '.scene-problem .problem-icon',
        { rotate: 360, duration: 2 },
        5.5
      )
      .to(
        '.scene-problem',
        { opacity: 0, duration: 0.5, pointerEvents: 'none' },
        19.5
      )

      // Solution Scene (20-45s)
      .to(
        '.scene-solution',
        { opacity: 1, duration: 0.5, pointerEvents: 'auto' },
        19.5
      )
      .to(
        '.scene-solution .feature',
        { y: 0, opacity: 1, stagger: 0.3, duration: 0.8 },
        20.5
      )
      .to(
        '.scene-solution',
        { opacity: 0, duration: 0.5, pointerEvents: 'none' },
        44.5
      )

      // CTA Scene (45-60s)
      .to(
        '.scene-cta',
        { opacity: 1, duration: 0.5, pointerEvents: 'auto' },
        44.5
      )
      .to('.scene-cta .cta-text', { y: 0, duration: 1 }, 45)
      .to('.scene-cta .cta-subtext', { y: 0, duration: 1 }, 45.5)
      .to('.scene-cta', { opacity: 1, duration: 1 }, 57);
  </script>
</body>
</html>
