<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>RHYTHMIX — Anthem Poster</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    background: #08050d;
    color: #ffffff;
    font-family: "Space Grotesk", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .poster {
    position: relative;
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    background:
      radial-gradient(ellipse 900px 700px at 22% 18%, rgba(255, 31, 90, 0.38), transparent 60%),
      radial-gradient(ellipse 800px 700px at 82% 82%, rgba(138, 246, 255, 0.22), transparent 60%),
      radial-gradient(ellipse 700px 600px at 70% 30%, rgba(224, 192, 255, 0.18), transparent 65%),
      #08050d;
  }

  /* Grid texture */
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
    background-size: 80px 80px;
    mask-image: radial-gradient(ellipse 800px 1400px at 50% 50%, #000 40%, transparent 90%);
    -webkit-mask-image: radial-gradient(ellipse 800px 1400px at 50% 50%, #000 40%, transparent 90%);
  }

  /* Diagonal scanlines for grit */
  .scan {
    position: absolute; inset: 0;
    background: repeating-linear-gradient(
      135deg,
      rgba(255, 255, 255, 0.02) 0px,
      rgba(255, 255, 255, 0.02) 1px,
      transparent 1px,
      transparent 6px
    );
    pointer-events: none;
  }

  /* Noise speckle */
  .noise {
    position: absolute; inset: 0;
    opacity: 0.35;
    mix-blend-mode: overlay;
    background-image: radial-gradient(rgba(255,255,255,0.08) 1px, transparent 1px);
    background-size: 3px 3px;
    pointer-events: none;
  }

  /* Top eyebrow */
  .eyebrow {
    position: absolute;
    top: 90px; left: 80px; right: 80px;
    display: flex; justify-content: space-between; align-items: center;
    font-family: "JetBrains Mono", monospace;
    font-size: 26px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #cfcfd8;
  }
  .eyebrow .left { color: #ffd9e8; }
  .eyebrow .dot {
    display: inline-block;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: #ff1f5a;
    box-shadow: 0 0 22px #ff1f5a;
    vertical-align: middle;
    margin-right: 14px;
    transform: translateY(-2px);
  }
  .eyebrow .right { color: #8af6ff; }

  /* WORDMARK */
  .wordmark {
    position: absolute;
    top: 200px; left: 0; right: 0;
    text-align: center;
    font-family: "Space Grotesk", system-ui, sans-serif;
    font-weight: 700;
    font-size: 132px;
    letter-spacing: 0.06em;
    line-height: 1;
    background: linear-gradient(135deg, #ff7aa6, #e0c0ff 50%, #8af6ff);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
    text-shadow: 0 0 80px rgba(224, 192, 255, 0.25);
  }
  .wordmark::after {
    content: "";
    display: block;
    width: 220px; height: 4px;
    margin: 28px auto 0;
    background: linear-gradient(90deg, transparent, #ff1f5a, #f5c000, #8af6ff, transparent);
    box-shadow: 0 0 18px rgba(255, 31, 90, 0.6);
  }

  /* HEADLINE: layered hook */
  .hook {
    position: absolute;
    top: 480px;
    left: 60px;
    right: 60px;
    text-align: left;
    font-family: "Space Grotesk", system-ui, sans-serif;
    font-weight: 700;
    line-height: 0.92;
    letter-spacing: -0.025em;
  }
  .hook .line {
    display: block;
    position: relative;
  }
  .hook .strike {
    font-size: 168px;
    color: #ffffff;
    position: relative;
  }
  .hook .strike .x {
    color: #ff1f5a;
    font-weight: 700;
    margin-right: 18px;
    text-shadow: 0 0 28px rgba(255, 31, 90, 0.55);
  }
  .hook .strike .word {
    position: relative;
    display: inline-block;
    color: #f0f0f5;
  }
  .hook .strike .word::after {
    content: "";
    position: absolute;
    left: -6px; right: -6px;
    top: 52%;
    height: 10px;
    background: linear-gradient(90deg, #ff1f5a, #ff7aa6);
    transform: skewY(-2deg);
    box-shadow: 0 0 18px rgba(255, 31, 90, 0.55);
  }

  .hook .l1 { margin-bottom: 18px; }
  .hook .l2 { margin-bottom: 18px; }
  .hook .l3 { margin-bottom: 0; }

  /* The pivot line */
  .pivot {
    position: absolute;
    top: 1180px;
    left: 60px; right: 60px;
    font-family: "Space Grotesk", system-ui, sans-serif;
    font-weight: 700;
    font-size: 124px;
    line-height: 0.95;
    letter-spacing: -0.02em;
    background: linear-gradient(135deg, #6effc0, #8af6ff);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
    text-shadow: 0 0 80px rgba(110, 255, 192, 0.15);
  }
  .pivot .small {
    display: block;
    font-family: "JetBrains Mono", monospace;
    font-size: 28px;
    letter-spacing: 0.28em;
    color: #b6ffe0;
    -webkit-text-fill-color: #b6ffe0;
    margin-bottom: 22px;
    font-weight: 500;
  }

  /* Subhead band */
  .subhead {
    position: absolute;
    bottom: 280px;
    left: 60px; right: 60px;
    padding: 38px 44px;
    background: linear-gradient(135deg, rgba(40, 30, 60, 0.85), rgba(28, 22, 42, 0.6));
    border: 1px solid rgba(255, 31, 90, 0.35);
    border-radius: 22px;
    backdrop-filter: blur(8px);
  }
  .subhead .label {
    font-family: "JetBrains Mono", monospace;
    font-size: 22px;
    letter-spacing: 0.3em;
    color: #ffd9e8;
    text-transform: uppercase;
    margin-bottom: 14px;
  }
  .subhead .price {
    font-family: "Space Grotesk", system-ui, sans-serif;
    font-weight: 700;
    font-size: 76px;
    line-height: 1;
    letter-spacing: -0.01em;
    color: #ffffff;
    display: flex;
    align-items: baseline;
    gap: 22px;
    flex-wrap: wrap;
  }
  .subhead .price .amount {
    background: linear-gradient(135deg, #ff1f5a, #ff7aa6 50%, #f5c000);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
  }
  .subhead .price .sep {
    width: 8px; height: 8px;
    background: #f5c000;
    box-shadow: 0 0 16px #f5c000;
    border-radius: 50%;
    transform: translateY(-12px);
  }
  .subhead .price .lifetime {
    font-size: 60px;
    color: #ffffff;
  }

  /* CTA strip */
  .cta {
    position: absolute;
    bottom: 110px;
    left: 60px; right: 60px;
    display: flex; align-items: center; justify-content: space-between;
    font-family: "JetBrains Mono", monospace;
    text-transform: uppercase;
  }
  .cta .url {
    font-size: 34px;
    letter-spacing: 0.2em;
    color: #ffffff;
    font-weight: 700;
  }
  .cta .url .dot { color: #ff1f5a; }
  .cta .badge {
    font-size: 22px;
    letter-spacing: 0.3em;
    color: #08050d;
    background: #6effc0;
    box-shadow: 0 0 22px rgba(110, 255, 192, 0.6);
    padding: 14px 22px;
    border-radius: 999px;
    font-weight: 700;
  }

  /* Bottom edge glow bar */
  .edge {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 6px;
    background: linear-gradient(90deg, #ff1f5a, #f5c000 30%, #6effc0 60%, #8af6ff);
    box-shadow: 0 0 30px rgba(255, 31, 90, 0.5);
  }

  /* Floating chip accents */
  .chip {
    position: absolute;
    font-family: "JetBrains Mono", monospace;
    font-size: 20px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    padding: 10px 18px;
    border-radius: 999px;
    background: rgba(255, 31, 90, 0.18);
    color: #ffd9e8;
    border: 1px solid rgba(255, 31, 90, 0.45);
  }
  .chip.c1 { top: 1080px; right: 70px; transform: rotate(6deg); }
  .chip.c2 {
    top: 1110px; left: 60px; transform: rotate(-4deg);
    background: rgba(110, 255, 192, 0.14);
    color: #b6ffe0;
    border-color: rgba(110, 255, 192, 0.45);
  }
</style>
</head>
<body>
  <div class="poster">
    <div class="grid"></div>
    <div class="scan"></div>

    <div class="eyebrow">
      <span class="left"><span class="dot"></span>ANTHEM // 60s</span>
      <span class="right">AI MUSIC PLATFORM</span>
    </div>

    <div class="wordmark">RHYTHMIX</div>

    <div class="hook">
      <span class="line l1 strike"><span class="x">×</span><span class="word">No producer.</span></span>
      <span class="line l2 strike"><span class="x">×</span><span class="word">No studio.</span></span>
      <span class="line l3 strike"><span class="x">×</span><span class="word">No instrument.</span></span>
    </div>

    <div class="chip c1">Generate · Master</div>
    <div class="chip c2">Distribute · Earn</div>

    <div class="pivot">
      <span class="small">IF YOU HAVE IDEAS —</span>
      That&apos;s enough.
    </div>

    <div class="subhead">
      <div class="label">AN AI MUSIC PLATFORM</div>
      <div class="price">
        <span class="amount">AU$149</span>
        <span class="sep"></span>
        <span class="lifetime">Lifetime.</span>
      </div>
    </div>

    <div class="cta">
      <div class="url">RHYTHMIX<span class="dot">.</span>APP<span class="dot">.</span>AU</div>
      <div class="badge">No Subscription</div>
    </div>

    <div class="noise"></div>
    <div class="edge"></div>
  </div>
</body>
</html>
