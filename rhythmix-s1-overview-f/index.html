<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #08050d; font-family: "Space Grotesk", system-ui, sans-serif; color: #ffffff; }
      .scene { position: absolute; inset: 0; width: 1080px; height: 1920px; }
      .scene-inner { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 120px 80px; box-sizing: border-box; background: #08050d; }
      .bg-radial { position: absolute; inset: 0; background: radial-gradient(700px 800px at 25% 25%, rgba(124,58,237,0.28), transparent 60%), radial-gradient(700px 800px at 75% 75%, rgba(255,31,90,0.22), transparent 65%); pointer-events: none; }
      .grid-overlay { position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,0.045) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.045) 1px, transparent 1px); background-size: 60px 60px; pointer-events: none; }
      .gradient-text { background: linear-gradient(135deg, #ff7aa6, #e0c0ff 50%, #8af6ff); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent; }

      #s1 .wordmark { font-weight: 800; font-size: 160px; line-height: 0.88; letter-spacing: -5px; margin-bottom: 44px; text-align: center; }
      #s1 .eyebrow { font-family: "JetBrains Mono", monospace; font-size: 30px; letter-spacing: 6px; color: #e0c0ff; text-transform: uppercase; text-align: center; }

      #s2-inner { gap: 32px; }
      .stat-card { width: 100%; padding: 36px 48px; background: rgba(255,255,255,0.04); border: 1.5px solid rgba(255,255,255,0.12); border-radius: 24px; display: flex; align-items: center; gap: 32px; }
      .stat-icon { font-size: 72px; line-height: 1; flex-shrink: 0; }
      .stat-text { display: flex; flex-direction: column; gap: 6px; }
      .stat-num { font-weight: 800; font-size: 64px; letter-spacing: -2px; line-height: 1; }
      .stat-label { font-family: "JetBrains Mono", monospace; font-size: 22px; letter-spacing: 3px; color: #b9b3c6; text-transform: uppercase; }
      #s2 .tagline { font-family: "JetBrains Mono", monospace; font-size: 26px; letter-spacing: 5px; color: #e0c0ff; text-transform: uppercase; text-align: center; margin-top: 8px; }

      #s3-inner { gap: 36px; }
      #s3 .proof-name { font-family: "JetBrains Mono", monospace; font-size: 26px; letter-spacing: 4px; color: #b9b3c6; text-transform: uppercase; text-align: center; }
      #s3 .proof-num { font-weight: 800; font-size: 128px; letter-spacing: -4px; line-height: 0.9; text-align: center; }
      #s3 .proof-sub { font-size: 36px; color: #e6e6ee; text-align: center; line-height: 1.35; }
      #s3 .cta { font-weight: 700; font-size: 40px; padding: 28px 80px; background: linear-gradient(135deg, #ff1f5a, #7c3aed); border-radius: 999px; color: #ffffff; box-shadow: 0 0 60px rgba(255,31,90,0.45); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="s1-overview-f" data-start="0" data-duration="32" data-width="1080" data-height="1920">
      <audio id="vo" class="clip" data-start="0" data-duration="auto" data-track-index="10" src="narration.wav" data-volume="1"></audio>

      <div id="s1" class="scene clip" data-start="0" data-duration="3.5" data-track-index="1">
        <div class="scene-inner" id="s1-inner">
          <div class="bg-radial"></div><div class="grid-overlay"></div>
          <div class="wordmark gradient-text">RHYTHMIX</div>
          <div class="eyebrow">The AI Music Platform</div>
        </div>
      </div>

      <div id="s2" class="scene clip" data-start="3" data-duration="20" data-track-index="2">
        <div class="scene-inner" id="s2-inner">
          <div class="bg-radial"></div><div class="grid-overlay"></div>
          <div id="c1" class="stat-card"><div class="stat-icon">🎛</div><div class="stat-text"><div class="stat-num gradient-text">14</div><div class="stat-label">AI Tools</div></div></div>
          <div id="c2" class="stat-card"><div class="stat-icon">📱</div><div class="stat-text"><div class="stat-num gradient-text">40+</div><div class="stat-label">Platforms</div></div></div>
          <div id="c3" class="stat-card"><div class="stat-icon">👥</div><div class="stat-text"><div class="stat-num gradient-text">4,800</div><div class="stat-label">Creators</div></div></div>
          <div id="c4" class="stat-card"><div class="stat-icon">🌍</div><div class="stat-text"><div class="stat-num gradient-text">127</div><div class="stat-label">Countries</div></div></div>
          <div id="tagline" class="tagline">Create · Distribute · Monetize</div>
        </div>
      </div>

      <div id="s3" class="scene clip" data-start="23" data-duration="9" data-track-index="3">
        <div class="scene-inner" id="s3-inner">
          <div class="bg-radial"></div><div class="grid-overlay"></div>
          <div class="proof-name">Alex Chen · First Month</div>
          <div class="proof-num gradient-text">31,000</div>
          <div class="proof-sub">Spotify streams<br/>Zero music experience</div>
          <div class="cta">Join the Waitlist</div>
        </div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      tl.from("#s1 .wordmark", { y: 56, opacity: 0, scale: 0.93, duration: 0.8, ease: "expo.out" }, 0.2);
      tl.from("#s1 .eyebrow", { y: -20, opacity: 0, duration: 0.45, ease: "power2.out" }, 0.85);

      tl.to("#s1-inner", { opacity: 0, duration: 0.5, ease: "power1.inOut" }, 3.0);
      tl.from("#s2-inner", { opacity: 0, duration: 0.5, ease: "power1.inOut" }, 3.0);

      tl.from("#c1", { x: -60, opacity: 0, duration: 0.5, ease: "expo.out" }, 3.3);
      tl.from("#c2", { x: -60, opacity: 0, duration: 0.5, ease: "expo.out" }, 3.7);
      tl.from("#c3", { x: -60, opacity: 0, duration: 0.5, ease: "expo.out" }, 4.1);
      tl.from("#c4", { x: -60, opacity: 0, duration: 0.5, ease: "expo.out" }, 4.5);
      tl.from("#tagline", { y: 20, opacity: 0, duration: 0.4, ease: "power2.out" }, 5.2);

      tl.to("#s2-inner", { opacity: 0, duration: 0.5, ease: "power1.inOut" }, 23.0);
      tl.from("#s3-inner", { opacity: 0, duration: 0.5, ease: "power1.inOut" }, 23.0);

      tl.from("#s3 .proof-name", { opacity: 0, duration: 0.4, ease: "power2.out" }, 23.4);
      tl.from("#s3 .proof-num", { y: 40, opacity: 0, scale: 0.88, duration: 0.7, ease: "expo.out" }, 23.7);
      tl.from("#s3 .proof-sub", { opacity: 0, duration: 0.4, ease: "power1.out" }, 24.3);
      tl.from("#s3 .cta", { y: 24, opacity: 0, duration: 0.5, ease: "power2.out" }, 25.0);

      tl.to("#s3-inner", { opacity: 0, duration: 0.6, ease: "power2.inOut" }, 31.0);

      window.__timelines["s1-overview-f"] = tl;
    </script>
  </body>
</html>
