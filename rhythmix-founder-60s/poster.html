<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>RHYTHMIX — Founder Poster</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    background: #08050d;
    color: #ffffff;
    font-family: "Space Grotesk", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .poster {
    position: relative;
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    background:
      radial-gradient(ellipse 900px 760px at 28% 22%, rgba(124, 58, 237, 0.42), transparent 62%),
      radial-gradient(ellipse 820px 720px at 78% 78%, rgba(255, 31, 90, 0.28), transparent 62%),
      radial-gradient(ellipse 680px 580px at 50% 50%, rgba(138, 246, 255, 0.10), transparent 70%),
      #08050d;
  }

  /* Background grid */
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255, 255, 255, 0.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, 0.045) 1px, transparent 1px);
    background-size: 80px 80px;
    mask-image: radial-gradient(ellipse 720px 1400px at 50% 50%, #000 35%, transparent 92%);
    -webkit-mask-image: radial-gradient(ellipse 720px 1400px at 50% 50%, #000 35%, transparent 92%);
  }

  /* Diagonal scanlines */
  .scan {
    position: absolute; inset: 0;
    background: repeating-linear-gradient(
      135deg,
      rgba(255, 255, 255, 0.02) 0px,
      rgba(255, 255, 255, 0.02) 1px,
      transparent 1px,
      transparent 6px
    );
    pointer-events: none;
  }

  /* Noise speckle */
  .noise {
    position: absolute; inset: 0;
    opacity: 0.35;
    mix-blend-mode: overlay;
    background-image: radial-gradient(rgba(255,255,255,0.08) 1px, transparent 1px);
    background-size: 3px 3px;
    pointer-events: none;
  }

  /* Top eyebrow */
  .eyebrow {
    position: absolute;
    top: 90px; left: 80px; right: 80px;
    display: flex; justify-content: space-between; align-items: center;
    font-family: "JetBrains Mono", monospace;
    font-size: 26px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #cfcfd8;
  }
  .eyebrow .left { color: #ffd9e8; display: inline-flex; align-items: center; }
  .eyebrow .dot {
    display: inline-block;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: #ff1f5a;
    box-shadow: 0 0 22px #ff1f5a;
    margin-right: 14px;
  }
  .eyebrow .right { color: #e0c0ff; }

  /* Portrait halo — circular badge framing the founder mark */
  .portrait {
    position: absolute;
    top: 230px;
    left: 50%;
    transform: translateX(-50%);
    width: 360px;
    height: 360px;
    border-radius: 50%;
    background:
      radial-gradient(circle at 35% 30%, rgba(255, 122, 166, 0.55), rgba(124, 58, 237, 0.35) 55%, rgba(8, 5, 13, 0.0) 75%),
      conic-gradient(from 220deg, #ff1f5a, #e0c0ff 35%, #8af6ff 60%, #6effc0 80%, #ff1f5a);
    box-shadow:
      0 0 0 2px rgba(255, 255, 255, 0.10),
      0 0 80px rgba(255, 31, 90, 0.45),
      0 0 140px rgba(124, 58, 237, 0.35);
  }
  .portrait::before {
    content: "";
    position: absolute;
    inset: 14px;
    border-radius: 50%;
    background:
      radial-gradient(ellipse at 50% 40%, rgba(8, 5, 13, 0.0), rgba(8, 5, 13, 0.85) 70%),
      linear-gradient(160deg, #1a0f26 0%, #0a0612 100%);
  }
  /* Initial monogram */
  .portrait .mono {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Space Grotesk", system-ui, sans-serif;
    font-weight: 800;
    font-size: 180px;
    letter-spacing: -6px;
    line-height: 1;
    background: linear-gradient(135deg, #ff7aa6, #e0c0ff 50%, #8af6ff);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
    text-shadow: 0 0 60px rgba(224, 192, 255, 0.4);
    z-index: 2;
  }
  /* "Founder" arc label across the bottom of the halo */
  .portrait .arc {
    position: absolute;
    bottom: -56px;
    left: 50%;
    transform: translateX(-50%);
    padding: 10px 22px;
    border-radius: 999px;
    background: rgba(8, 5, 13, 0.88);
    border: 1px solid rgba(255, 31, 90, 0.55);
    font-family: "JetBrains Mono", monospace;
    font-size: 20px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: #ffd9e8;
    white-space: nowrap;
    z-index: 3;
  }

  /* HEADLINE: "Hi. I'm Jamie." */
  .hook {
    position: absolute;
    top: 720px;
    left: 60px;
    right: 60px;
    text-align: center;
    font-family: "Space Grotesk", system-ui, sans-serif;
    font-weight: 800;
    line-height: 0.96;
    letter-spacing: -0.035em;
  }
  .hook .hi {
    display: block;
    font-size: 200px;
    color: #ffffff;
    margin-bottom: 4px;
    text-shadow: 0 0 60px rgba(255, 255, 255, 0.18);
  }
  .hook .im {
    display: block;
    font-size: 200px;
    color: #ffffff;
  }
  .hook .name {
    display: inline-block;
    font-size: 200px;
    background: linear-gradient(135deg, #ff7aa6, #e0c0ff 50%, #8af6ff);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
    text-shadow: 0 0 80px rgba(224, 192, 255, 0.35);
  }

  /* Signature underline */
  .sig {
    position: absolute;
    top: 1170px;
    left: 50%;
    transform: translateX(-50%);
    width: 460px;
    height: 4px;
    background: linear-gradient(90deg, transparent, #ff1f5a 25%, #e0c0ff 55%, #8af6ff 80%, transparent);
    box-shadow: 0 0 18px rgba(224, 192, 255, 0.5);
  }

  /* Quote — the founder beat */
  .quote {
    position: absolute;
    top: 1230px;
    left: 80px; right: 80px;
    text-align: center;
    font-family: "Space Grotesk", system-ui, sans-serif;
    font-weight: 500;
    font-size: 44px;
    line-height: 1.25;
    letter-spacing: -0.005em;
    color: #e6e6ee;
  }
  .quote em {
    font-style: normal;
    background: linear-gradient(135deg, #6effc0, #8af6ff);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
    font-weight: 700;
  }

  /* Floating chips (intimate, hand-written feel) */
  .chip {
    position: absolute;
    font-family: "JetBrains Mono", monospace;
    font-size: 20px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    padding: 10px 18px;
    border-radius: 999px;
    background: rgba(255, 31, 90, 0.18);
    color: #ffd9e8;
    border: 1px solid rgba(255, 31, 90, 0.45);
  }
  .chip.c1 { top: 670px; left: 80px; transform: rotate(-5deg); }
  .chip.c2 {
    top: 690px; right: 80px; transform: rotate(6deg);
    background: rgba(110, 255, 192, 0.14);
    color: #b6ffe0;
    border-color: rgba(110, 255, 192, 0.45);
  }

  /* Subhead band */
  .subhead {
    position: absolute;
    bottom: 320px;
    left: 60px; right: 60px;
    padding: 38px 44px;
    background: linear-gradient(135deg, rgba(40, 30, 60, 0.88), rgba(28, 22, 42, 0.62));
    border: 1px solid rgba(255, 31, 90, 0.35);
    border-radius: 22px;
    backdrop-filter: blur(8px);
  }
  .subhead .label {
    font-family: "JetBrains Mono", monospace;
    font-size: 22px;
    letter-spacing: 0.3em;
    color: #ffd9e8;
    text-transform: uppercase;
    margin-bottom: 14px;
  }
  .subhead .price {
    font-family: "Space Grotesk", system-ui, sans-serif;
    font-weight: 800;
    font-size: 76px;
    line-height: 1;
    letter-spacing: -0.01em;
    color: #ffffff;
    display: flex;
    align-items: baseline;
    gap: 22px;
    flex-wrap: wrap;
  }
  .subhead .price .amount {
    background: linear-gradient(135deg, #ff1f5a, #ff7aa6 50%, #f5c000);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
  }
  .subhead .price .sep {
    width: 8px; height: 8px;
    background: #f5c000;
    box-shadow: 0 0 16px #f5c000;
    border-radius: 50%;
    transform: translateY(-12px);
    display: inline-block;
  }
  .subhead .price .lifetime { font-size: 60px; color: #ffffff; }

  /* RHYTHMIX wordmark — small, anchored at the bottom */
  .wordmark {
    position: absolute;
    bottom: 200px;
    left: 0; right: 0;
    text-align: center;
    font-family: "Space Grotesk", system-ui, sans-serif;
    font-weight: 800;
    font-size: 92px;
    letter-spacing: 0.04em;
    line-height: 1;
    background: linear-gradient(135deg, #ff7aa6, #e0c0ff 50%, #8af6ff);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
    text-shadow: 0 0 60px rgba(224, 192, 255, 0.22);
  }

  /* CTA strip */
  .cta {
    position: absolute;
    bottom: 110px;
    left: 60px; right: 60px;
    display: flex; align-items: center; justify-content: space-between;
    font-family: "JetBrains Mono", monospace;
    text-transform: uppercase;
  }
  .cta .url {
    font-size: 32px;
    letter-spacing: 0.18em;
    color: #ffffff;
    font-weight: 700;
  }
  .cta .url .dot { color: #ff1f5a; }
  .cta .badge {
    font-size: 22px;
    letter-spacing: 0.3em;
    color: #08050d;
    background: #6effc0;
    box-shadow: 0 0 22px rgba(110, 255, 192, 0.6);
    padding: 14px 22px;
    border-radius: 999px;
    font-weight: 700;
  }

  /* Bottom edge spectrum bar */
  .edge {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 6px;
    background: linear-gradient(90deg, #ff1f5a, #f5c000 30%, #6effc0 60%, #8af6ff);
    box-shadow: 0 0 30px rgba(255, 31, 90, 0.5);
  }
</style>
</head>
<body>
  <div class="poster">
    <div class="grid"></div>
    <div class="scan"></div>

    <div class="eyebrow">
      <span class="left"><span class="dot"></span>FOUNDER // 60s</span>
      <span class="right">A LETTER, NOT A PITCH</span>
    </div>

    <div class="portrait">
      <div class="mono">JW</div>
      <div class="arc">Founder &middot; Builder &middot; One iPhone</div>
    </div>

    <div class="chip c1">One developer</div>
    <div class="chip c2">One iPhone</div>

    <div class="hook">
      <span class="hi">Hi.</span>
      <span class="im">I&apos;m <span class="name">Jamie.</span></span>
    </div>

    <div class="sig"></div>

    <div class="quote">
      Producers cost too much. Studios were too far.<br/>
      So I built something <em>for the rest of us.</em>
    </div>

    <div class="subhead">
      <div class="label">AN AI MUSIC PLATFORM</div>
      <div class="price">
        <span class="amount">AU$149</span>
        <span class="sep"></span>
        <span class="lifetime">Lifetime.</span>
      </div>
    </div>

    <div class="wordmark">RHYTHMIX</div>

    <div class="cta">
      <div class="url">RHYTHMIXAPP<span class="dot">.</span>COM<span class="dot">.</span>AU</div>
      <div class="badge">Waitlist Open</div>
    </div>

    <div class="noise"></div>
    <div class="edge"></div>
  </div>
</body>
</html>
