<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>RHYTHMIX — Get It Poster</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    background: #050306;
    color: #ffffff;
    font-family: "Space Grotesk", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .poster {
    position: relative;
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    background:
      radial-gradient(ellipse 1100px 800px at 50% 12%, rgba(255, 68, 68, 0.42), transparent 60%),
      radial-gradient(ellipse 900px 700px at 80% 88%, rgba(245, 192, 0, 0.30), transparent 60%),
      radial-gradient(ellipse 700px 600px at 18% 60%, rgba(80, 20, 160, 0.34), transparent 65%),
      #050306;
  }

  /* Grid texture */
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
    background-size: 72px 72px;
    mask-image: radial-gradient(ellipse 800px 1400px at 50% 50%, #000 35%, transparent 88%);
    -webkit-mask-image: radial-gradient(ellipse 800px 1400px at 50% 50%, #000 35%, transparent 88%);
  }

  /* Diagonal scanlines */
  .scan {
    position: absolute; inset: 0;
    background: repeating-linear-gradient(
      135deg,
      rgba(255, 255, 255, 0.025) 0px,
      rgba(255, 255, 255, 0.025) 1px,
      transparent 1px,
      transparent 6px
    );
    pointer-events: none;
  }

  /* Caution stripe — top */
  .caution {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 28px;
    background: repeating-linear-gradient(
      -45deg,
      #f5c000 0px, #f5c000 26px,
      #050306 26px, #050306 52px
    );
    box-shadow: 0 0 24px rgba(245, 192, 0, 0.45);
  }

  /* Noise speckle */
  .noise {
    position: absolute; inset: 0;
    opacity: 0.32;
    mix-blend-mode: overlay;
    background-image: radial-gradient(rgba(255,255,255,0.08) 1px, transparent 1px);
    background-size: 3px 3px;
    pointer-events: none;
  }

  /* Top eyebrow */
  .eyebrow {
    position: absolute;
    top: 80px; left: 60px; right: 60px;
    display: flex; justify-content: space-between; align-items: center;
    font-family: "JetBrains Mono", monospace;
    font-size: 26px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #ffe9a8;
  }
  .eyebrow .dot {
    display: inline-block;
    width: 16px; height: 16px;
    border-radius: 50%;
    background: #ff4444;
    box-shadow: 0 0 24px #ff4444, 0 0 4px #ff4444;
    vertical-align: middle;
    margin-right: 14px;
    transform: translateY(-2px);
    animation: none;
  }
  .eyebrow .right { color: #f5c000; }

  /* WORDMARK */
  .wordmark {
    position: absolute;
    top: 178px; left: 0; right: 0;
    text-align: center;
    font-family: "Space Grotesk", system-ui, sans-serif;
    font-weight: 700;
    font-size: 122px;
    letter-spacing: 0.06em;
    line-height: 1;
    background: linear-gradient(135deg, #fff2c8 0%, #f5c000 45%, #ff7a4a 80%, #ff4444 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
    text-shadow: 0 0 80px rgba(245, 192, 0, 0.32);
  }
  .wordmark::after {
    content: "";
    display: block;
    width: 260px; height: 5px;
    margin: 26px auto 0;
    background: linear-gradient(90deg, transparent, #ff4444, #f5c000, #ff4444, transparent);
    box-shadow: 0 0 22px rgba(255, 68, 68, 0.7);
  }

  /* MEGA HEADLINE — the imperative CTA */
  .hook {
    position: absolute;
    top: 410px;
    left: 50px;
    right: 50px;
    text-align: left;
    font-family: "Barlow Condensed", "Space Grotesk", sans-serif;
    font-weight: 900;
    line-height: 0.86;
    letter-spacing: -0.015em;
    text-transform: uppercase;
  }
  .hook .l1 {
    display: block;
    font-size: 178px;
    color: #ffffff;
    text-shadow: 0 6px 0 rgba(255, 68, 68, 0.22), 0 0 40px rgba(255, 68, 68, 0.3);
  }
  .hook .l1 .strike {
    position: relative;
    display: inline-block;
    color: #cfcfd8;
  }
  .hook .l1 .strike::after {
    content: "";
    position: absolute;
    left: -8px; right: -8px;
    top: 50%;
    height: 12px;
    background: linear-gradient(90deg, #ff4444, #ff1f5a);
    transform: skewY(-2deg);
    box-shadow: 0 0 22px rgba(255, 68, 68, 0.7);
  }
  .hook .l2 {
    display: block;
    font-size: 232px;
    color: #ffffff;
    margin-top: 8px;
    background: linear-gradient(180deg, #ffffff 0%, #ffe9a8 70%, #f5c000 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
    text-shadow: 0 0 60px rgba(245, 192, 0, 0.45);
  }
  .hook .l3 {
    display: block;
    font-size: 178px;
    color: #ff4444;
    margin-top: 4px;
    text-shadow: 0 0 50px rgba(255, 68, 68, 0.7);
  }
  .hook .l3 .now {
    display: inline-block;
    background: #ff4444;
    color: #050306;
    padding: 8px 28px 18px 28px;
    margin-left: 14px;
    transform: skew(-6deg);
    box-shadow: 0 0 40px rgba(255, 68, 68, 0.65);
    text-shadow: none;
  }

  /* Urgency tag */
  .urgency {
    position: absolute;
    top: 1180px;
    left: 50%;
    transform: translateX(-50%) rotate(-2deg);
    background: #ff4444;
    color: #ffffff;
    font-family: "JetBrains Mono", monospace;
    font-weight: 700;
    font-size: 28px;
    letter-spacing: 0.24em;
    padding: 18px 34px;
    border-radius: 6px;
    text-transform: uppercase;
    box-shadow: 0 0 48px rgba(255, 68, 68, 0.6), 0 8px 0 rgba(0,0,0,0.4);
    border: 2px solid #ffe9a8;
  }
  .urgency .arrow { color: #f5c000; margin: 0 10px; }

  /* PRICE BAND — the dollar punch */
  .price-band {
    position: absolute;
    bottom: 380px;
    left: 50px; right: 50px;
    padding: 44px 50px 40px;
    background: linear-gradient(135deg, #f5c000 0%, #ff7a4a 60%, #ff4444 100%);
    border-radius: 24px;
    box-shadow: 0 0 60px rgba(245, 192, 0, 0.4), inset 0 2px 0 rgba(255,255,255,0.3);
    transform: rotate(-1.2deg);
  }
  .price-band::before {
    content: "";
    position: absolute;
    inset: -3px;
    border-radius: 24px;
    border: 2px solid rgba(255, 255, 255, 0.35);
    pointer-events: none;
  }
  .price-band .label {
    font-family: "JetBrains Mono", monospace;
    font-size: 22px;
    letter-spacing: 0.32em;
    color: #050306;
    text-transform: uppercase;
    margin-bottom: 8px;
    font-weight: 700;
    opacity: 0.85;
  }
  .price-band .price {
    font-family: "Space Grotesk", system-ui, sans-serif;
    font-weight: 700;
    font-size: 138px;
    line-height: 1;
    letter-spacing: -0.02em;
    color: #050306;
    display: flex;
    align-items: baseline;
    gap: 18px;
    flex-wrap: wrap;
  }
  .price-band .price .cur {
    font-size: 64px;
    transform: translateY(-26px);
    font-weight: 700;
  }
  .price-band .price .lifetime {
    font-size: 50px;
    color: #050306;
    font-weight: 700;
    letter-spacing: 0;
    opacity: 0.92;
    margin-left: 4px;
  }
  .price-band .stamp {
    position: absolute;
    top: -38px; right: -22px;
    background: #050306;
    color: #f5c000;
    font-family: "JetBrains Mono", monospace;
    font-size: 22px;
    letter-spacing: 0.22em;
    padding: 14px 22px;
    border-radius: 999px;
    border: 2px solid #f5c000;
    transform: rotate(8deg);
    box-shadow: 0 0 24px rgba(245, 192, 0, 0.5);
    font-weight: 700;
  }

  /* CTA URL bar */
  .cta {
    position: absolute;
    bottom: 170px;
    left: 50px; right: 50px;
    background: #050306;
    border: 2px solid #f5c000;
    border-radius: 18px;
    padding: 30px 38px;
    display: flex; align-items: center; justify-content: space-between;
    box-shadow: 0 0 40px rgba(245, 192, 0, 0.32);
  }
  .cta .url {
    font-family: "JetBrains Mono", monospace;
    font-size: 44px;
    letter-spacing: 0.12em;
    font-weight: 700;
    color: #ffffff;
    text-transform: lowercase;
  }
  .cta .url .dot { color: #ff4444; }
  .cta .url .au { color: #f5c000; }
  .cta .go {
    font-family: "Barlow Condensed", sans-serif;
    font-weight: 900;
    font-size: 56px;
    letter-spacing: 0.06em;
    color: #050306;
    background: #f5c000;
    padding: 10px 26px 6px;
    border-radius: 10px;
    box-shadow: 0 0 24px rgba(245, 192, 0, 0.7);
    text-transform: uppercase;
  }

  /* Footer microcopy */
  .foot {
    position: absolute;
    bottom: 70px;
    left: 60px; right: 60px;
    display: flex; justify-content: space-between; align-items: center;
    font-family: "JetBrains Mono", monospace;
    font-size: 22px;
    letter-spacing: 0.24em;
    color: #ffe9a8;
    text-transform: uppercase;
  }
  .foot .right { color: #ff4444; }

  /* Bottom caution stripe */
  .caution-bottom {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 22px;
    background: repeating-linear-gradient(
      45deg,
      #ff4444 0px, #ff4444 24px,
      #050306 24px, #050306 48px
    );
    box-shadow: 0 0 24px rgba(255, 68, 68, 0.5);
  }
</style>
</head>
<body>
  <div class="poster">
    <div class="caution"></div>
    <div class="grid"></div>
    <div class="scan"></div>

    <div class="eyebrow">
      <span class="left"><span class="dot"></span>GET IT // 60s</span>
      <span class="right">LAUNCHING NOW</span>
    </div>

    <div class="wordmark">RHYTHMIX</div>

    <div class="hook">
      <span class="l1"><span class="strike">Stop scrolling.</span></span>
      <span class="l2">This is</span>
      <span class="l3">the one<span class="now">NOW</span></span>
    </div>

    <div class="urgency">
      <span class="arrow">&#9656;</span>PRICE GOES UP AFTER LAUNCH<span class="arrow">&#9666;</span>
    </div>

    <div class="price-band">
      <div class="stamp">LIFETIME</div>
      <div class="label">ONE TIME · YOURS FOREVER</div>
      <div class="price">
        <span class="cur">AU$</span>
        <span>149</span>
        <span class="lifetime">· once.</span>
      </div>
    </div>

    <div class="cta">
      <div class="url">rhythmixapp<span class="dot">.</span>com<span class="dot">.</span><span class="au">au</span></div>
      <div class="go">GO</div>
    </div>

    <div class="foot">
      <span class="left">UNLIMITED · 120 PLATFORMS · 100% ROYALTIES</span>
      <span class="right">&#9679; LIVE</span>
    </div>

    <div class="noise"></div>
    <div class="caution-bottom"></div>
  </div>
</body>
</html>
