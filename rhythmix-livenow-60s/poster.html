<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>RHYTHMIX live now — Poster</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #08050d;
        font-family: "Space Grotesk", system-ui, -apple-system, sans-serif;
        color: #ffffff;
        -webkit-font-smoothing: antialiased;
      }

      .poster {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #08050d;
      }

      /* Background — gold/green dominance to separate from itslive's pink/cyan dream */
      .bg-radial {
        position: absolute; inset: 0;
        background:
          radial-gradient(800px 700px at 80% 12%, rgba(245, 192, 0, 0.30), transparent 60%),
          radial-gradient(900px 800px at 12% 88%, rgba(0, 232, 135, 0.32), transparent 62%),
          radial-gradient(700px 600px at 50% 50%, rgba(124, 58, 237, 0.22), transparent 70%);
        pointer-events: none;
      }

      .grid {
        position: absolute; inset: 0;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
        background-size: 60px 60px;
        pointer-events: none;
      }

      .vignette {
        position: absolute; inset: 0;
        background: radial-gradient(ellipse at center, transparent 48%, rgba(8, 5, 13, 0.72) 100%);
        pointer-events: none;
      }

      /* TWO scanlines flanking the headline — "broadcast live" feel, doubled vs itslive */
      .scan-top {
        position: absolute; left: 0; right: 0; top: 32%;
        height: 2px;
        background: linear-gradient(90deg, transparent, rgba(245, 192, 0, 0.7), transparent);
        box-shadow: 0 0 32px rgba(245, 192, 0, 0.65);
        pointer-events: none;
      }
      .scan-bot {
        position: absolute; left: 0; right: 0; top: 58%;
        height: 2px;
        background: linear-gradient(90deg, transparent, rgba(0, 232, 135, 0.7), transparent);
        box-shadow: 0 0 32px rgba(0, 232, 135, 0.65);
        pointer-events: none;
      }

      .frame {
        position: absolute; inset: 48px;
        border: 1px solid rgba(255, 255, 255, 0.10);
        border-radius: 28px;
        pointer-events: none;
      }

      .content {
        position: absolute; inset: 0;
        display: flex; flex-direction: column;
        justify-content: space-between;
        padding: 120px 96px 110px;
      }

      /* ===== TOP: LIVE indicator + TODAY date-stamp (vs itslive's announcement badge) ===== */
      .top {
        display: flex; flex-direction: column; gap: 32px;
        align-items: flex-start;
      }

      /* Hardened broadcast-style ON AIR indicator — square, not pill */
      .live-strip {
        display: inline-flex; align-items: stretch; gap: 0;
        border: 1px solid rgba(0, 232, 135, 0.65);
        border-radius: 8px;
        overflow: hidden;
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-weight: 700;
        font-size: 30px;
        text-transform: uppercase;
        letter-spacing: 6px;
      }
      .live-strip .dot-cell {
        background: #00e887;
        display: flex; align-items: center; justify-content: center;
        padding: 14px 22px;
        color: #08050d;
      }
      .live-strip .dot-cell .glow {
        width: 18px; height: 18px; border-radius: 50%;
        background: #08050d;
        box-shadow: 0 0 18px #08050d inset;
      }
      .live-strip .label-cell {
        padding: 14px 28px;
        background: rgba(0, 232, 135, 0.12);
        color: #b6ffe0;
        display: flex; align-items: center;
      }
      .live-strip .time-cell {
        padding: 14px 24px;
        background: rgba(255, 255, 255, 0.04);
        border-left: 1px solid rgba(0, 232, 135, 0.35);
        color: #ffffff;
        display: flex; align-items: center;
      }

      /* TODAY date block — present-tense anchor, NOT a generic meta row */
      .today-row {
        display: flex; align-items: center; gap: 22px;
      }
      .today-stamp {
        display: flex; align-items: baseline; gap: 16px;
        padding: 14px 26px;
        border: 1px solid rgba(245, 192, 0, 0.55);
        background: rgba(245, 192, 0, 0.10);
        border-radius: 10px;
      }
      .today-stamp .lbl {
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 22px;
        letter-spacing: 8px;
        color: #ffe070;
        text-transform: uppercase;
        font-weight: 700;
      }
      .today-stamp .date {
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 22px;
        letter-spacing: 4px;
        color: rgba(255, 255, 255, 0.78);
      }
      .availability {
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 20px; letter-spacing: 5px;
        color: rgba(230, 230, 238, 0.65);
        text-transform: uppercase;
      }

      /* ===== MIDDLE: Headline — "RIGHT NOW." + "YOURS TODAY." ===== */
      .headline {
        display: flex; flex-direction: column;
        gap: 14px;
        position: relative;
      }

      .eyebrow {
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 28px; letter-spacing: 10px;
        color: rgba(255, 255, 255, 0.55);
        text-transform: uppercase;
        margin-bottom: 16px;
      }

      .h1 {
        font-weight: 800;
        font-size: 220px;
        line-height: 0.88;
        letter-spacing: -10px;
        color: #ffffff;
        position: relative;
      }
      .h1 .now {
        background: linear-gradient(135deg, #00e887, #f5c000 65%, #ffe070);
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent;
        text-shadow: 0 0 80px rgba(0, 232, 135, 0.18);
      }

      .h2-wrap {
        margin-top: 36px;
        display: flex; flex-direction: column; gap: 8px;
      }
      .h2 {
        font-weight: 800;
        font-size: 156px;
        line-height: 0.9;
        letter-spacing: -6px;
      }
      .h2 .yours {
        background: linear-gradient(135deg, #ffe070, #f5c000);
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .h2 .today {
        background: linear-gradient(135deg, #00e887, #8af6ff 70%, #e0c0ff);
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      /* Wordmark under the headline — present-tense ownership claim */
      .wordmark-row {
        margin-top: 40px;
        display: flex; align-items: center; gap: 22px;
      }
      .wordmark {
        font-weight: 800;
        font-size: 70px;
        letter-spacing: -2px;
        background: linear-gradient(135deg, #ffffff, #b6ffe0);
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .wordmark-tick {
        width: 56px; height: 56px;
        border-radius: 50%;
        background: linear-gradient(135deg, #00e887, #f5c000);
        display: flex; align-items: center; justify-content: center;
        color: #08050d;
        font-weight: 800;
        font-size: 32px;
        box-shadow: 0 0 36px rgba(0, 232, 135, 0.55);
      }

      /* Energy bar */
      .energy {
        margin-top: 28px;
        display: flex; align-items: center; gap: 14px;
      }
      .energy .bar { height: 6px; border-radius: 3px; }
      .energy .b1 { width: 260px; background: linear-gradient(90deg, #00e887, #f5c000); box-shadow: 0 0 24px rgba(0, 232, 135, 0.55); }
      .energy .b2 { width: 110px; background: linear-gradient(90deg, #f5c000, #ffe070); }
      .energy .b3 { width: 50px; background: #ff6fc8; }
      .energy .b4 { width: 16px; background: #00d8ff; }

      /* ===== BOTTOM: receipt-style spec card (vs itslive's URL pill) ===== */
      .bottom {
        display: flex; flex-direction: column; gap: 32px;
        align-items: flex-start;
        width: 100%;
      }

      .receipt {
        width: 100%;
        background: linear-gradient(135deg, rgba(40, 30, 60, 0.85), rgba(28, 22, 42, 0.5));
        border: 1px solid rgba(245, 192, 0, 0.35);
        border-radius: 22px;
        padding: 38px 44px;
        display: flex; flex-direction: column; gap: 22px;
        backdrop-filter: blur(6px);
        position: relative;
      }
      .receipt::before {
        content: "";
        position: absolute;
        top: 0; left: 32px; right: 32px;
        height: 3px;
        background: linear-gradient(90deg, transparent, #f5c000, #00e887, transparent);
        border-radius: 0 0 3px 3px;
      }

      .receipt-head {
        display: flex; justify-content: space-between; align-items: center;
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 20px; letter-spacing: 6px;
        color: rgba(230, 230, 238, 0.60);
        text-transform: uppercase;
        padding-bottom: 18px;
        border-bottom: 1px dashed rgba(255, 255, 255, 0.15);
      }
      .receipt-head .right { color: #00e887; }

      .lead {
        font-family: "Space Grotesk", system-ui, sans-serif;
        font-size: 48px;
        font-weight: 600;
        letter-spacing: -1.5px;
        color: #ffffff;
        line-height: 1.05;
      }
      .lead .price {
        background: linear-gradient(135deg, #ffe070, #f5c000);
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent;
        font-weight: 800;
      }
      .lead .lifetime {
        background: linear-gradient(135deg, #00e887, #8af6ff);
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent;
        font-weight: 800;
      }

      .terms {
        display: flex; align-items: center; gap: 18px;
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 22px; letter-spacing: 4px;
        color: rgba(230, 230, 238, 0.78);
        text-transform: uppercase;
      }
      .terms .pip {
        width: 8px; height: 8px;
        background: #00e887;
        border-radius: 50%;
        box-shadow: 0 0 16px #00e887;
      }
      .terms .sep {
        width: 6px; height: 6px;
        background: rgba(255, 255, 255, 0.25);
        border-radius: 50%;
      }

      .url-block {
        width: 100%;
        display: flex; align-items: center; justify-content: space-between;
        gap: 24px;
        padding: 28px 40px;
        border: 1px solid rgba(0, 232, 135, 0.45);
        background: linear-gradient(135deg, rgba(0, 232, 135, 0.08), rgba(28, 22, 42, 0.4));
        border-radius: 22px;
        backdrop-filter: blur(6px);
      }
      .url {
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 40px; letter-spacing: 2px;
        color: #ffffff;
        font-weight: 700;
      }
      .url .scheme { color: rgba(0, 232, 135, 0.75); }
      .url .host {
        background: linear-gradient(135deg, #00e887, #ffe070);
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .buy-now {
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 22px;
        font-weight: 800;
        letter-spacing: 4px;
        text-transform: uppercase;
        padding: 18px 26px;
        border-radius: 14px;
        background: linear-gradient(135deg, #00e887, #f5c000);
        color: #08050d;
        box-shadow: 0 0 36px rgba(0, 232, 135, 0.45);
        white-space: nowrap;
      }

      /* Corner crops */
      .crop {
        position: absolute;
        width: 32px; height: 32px;
        border: 2px solid rgba(255, 255, 255, 0.30);
      }
      .crop.tl { top: 28px; left: 28px; border-right: none; border-bottom: none; }
      .crop.tr { top: 28px; right: 28px; border-left: none; border-bottom: none; }
      .crop.bl { bottom: 28px; left: 28px; border-right: none; border-top: none; }
      .crop.br { bottom: 28px; right: 28px; border-left: none; border-top: none; }

      /* Side label — "available today" present-tense vs itslive's "now streaming 2026" */
      .side-label {
        position: absolute;
        right: 78px;
        top: 50%;
        transform: translateY(-50%) rotate(90deg);
        transform-origin: right center;
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 18px;
        letter-spacing: 10px;
        color: rgba(245, 192, 0, 0.55);
        text-transform: uppercase;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div class="poster">
      <div class="bg-radial"></div>
      <div class="grid"></div>
      <div class="scan-top"></div>
      <div class="scan-bot"></div>
      <div class="vignette"></div>
      <div class="frame"></div>

      <div class="crop tl"></div>
      <div class="crop tr"></div>
      <div class="crop bl"></div>
      <div class="crop br"></div>

      <div class="side-label">Available Today · Pay Once</div>

      <div class="content">

        <div class="top">
          <div class="live-strip">
            <div class="dot-cell"><span class="glow"></span></div>
            <div class="label-cell">On Air</div>
            <div class="time-cell">00:00:01</div>
          </div>
          <div class="today-row">
            <div class="today-stamp">
              <span class="lbl">Today</span>
              <span class="date">20 / 05 / 2026</span>
            </div>
            <div class="availability">Available · AU</div>
          </div>
        </div>

        <div class="headline">
          <div class="eyebrow">It's here · Press play</div>
          <div class="h1">Right <span class="now">now.</span></div>

          <div class="h2-wrap">
            <div class="h2"><span class="yours">Yours</span></div>
            <div class="h2"><span class="today">today.</span></div>
          </div>

          <div class="wordmark-row">
            <div class="wordmark">RHYTHMIX</div>
            <div class="wordmark-tick">✓</div>
          </div>

          <div class="energy">
            <span class="bar b1"></span>
            <span class="bar b2"></span>
            <span class="bar b3"></span>
            <span class="bar b4"></span>
          </div>
        </div>

        <div class="bottom">
          <div class="receipt">
            <div class="receipt-head">
              <span>Order · Lifetime</span>
              <span class="right">● Confirmed</span>
            </div>
            <div class="lead">
              An AI music platform. <span class="price">AU$149.</span> <span class="lifetime">Lifetime.</span>
            </div>
            <div class="terms">
              <span class="pip"></span>
              <span>Pay once</span>
              <span class="sep"></span>
              <span>Yours forever</span>
              <span class="sep"></span>
              <span>No subscription</span>
            </div>
          </div>

          <div class="url-block">
            <div class="url"><span class="scheme">▶ </span><span class="host">rhythmixapp.com.au</span></div>
            <div class="buy-now">Buy now</div>
          </div>
        </div>

      </div>
    </div>
  </body>
</html>
