    special_models: []
    # opencode-go routes by id prefix to a matching api_base
    prefix_routing:
      "openai/": "https://opencode.ai/go/v1"
      "dashscope/": "https://dashscope.opencode.ai/go/v1"
      "anthropic/": "https://anthropic.opencode.ai/go/v1"
