# Provider configuration for the LiteLLM model-cleanup toolkit.
#
# Each provider entry is consumed by ConfigDrivenModelCleaner (cleanup_base.py).
# Structural details live here so the provider-specific scripts stay thin.
#
# Fields:
#   order          integer priority used when sorting / listing providers
#   api_url        endpoint returning the provider's model catalogue
#   api_key_env    env var holding the API key (null => no key required)
#   detection:
#     strategy     "prefix"  -> match litellm_params.model by prefix
#                  "api_base"-> match litellm_params.api_base
#     value        the prefix or api_base to match on
#   litellm_prefix string prepended to a model id to form litellm_params.model
#   api_base       optional api_base written into litellm_params (api_base providers)
#   name_prefix    prefix used when generating a model_name
#   models_key     dotted path to the list of models in the API response
#   id_field       field on each model object holding its id
#   pricing:
#     input_field  dotted path to the input price on each model object
#     output_field dotted path to the output price
#     scale        multiplier converting the API price to cost-per-token
#   all_free       true => every model is free (cost = 1e-09)
#   free_variants  true => also register a ":free" twin (OpenRouter)
#   special_models list of model ids to keep even if absent from the API

providers:
  openrouter:
    order: 1
    api_url: "https://openrouter.ai/api/v1/models"
    api_key_env: null
    detection:
      strategy: prefix
      value: "openrouter/"
    litellm_prefix: "openrouter/"
    name_prefix: "or-"
    models_key: "data"
    id_field: "id"
    pricing:
      input_field: "pricing.prompt"
      output_field: "pricing.completion"
      scale: 1
    all_free: false
    free_variants: true
    special_models: []

  requesty:
    order: 2
    api_url: "https://router.requesty.ai/v1/models"
    api_key_env: "REQUESTY_API_KEY"
    detection:
      strategy: api_base
      value: "https://router.requesty.ai/v1"
    litellm_prefix: "openai/"
    api_base: "https://router.requesty.ai/v1"
    name_prefix: ""
    models_key: "data"
    id_field: "id"
    pricing:
      input_field: "input_price"
      output_field: "output_price"
      scale: 1
    all_free: false
    free_variants: false
    special_models: []

  vercel:
    order: 3
    api_url: "https://ai-gateway.vercel.sh/v1/models"
    api_key_env: null
    detection:
      strategy: prefix
      value: "vercel_ai_gateway/"
    litellm_prefix: "vercel_ai_gateway/"
    name_prefix: "vercel-"
    models_key: "data"
    id_field: "id"
    pricing:
      input_field: "pricing.input"
      output_field: "pricing.output"
      scale: 1
    all_free: false
    free_variants: false
    special_models: []

  poe:
    order: 4
