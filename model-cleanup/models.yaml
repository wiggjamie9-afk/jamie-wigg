# Canonical model registry for multi-provider additions.
#
# Each key is a canonical model name. `providers` maps a provider name (as it
# appears in providers.yaml) to that provider's id for the same underlying
# model. `cleanup_models.py --add-mapped-model <key>` adds the model to every
# configured provider in one pass; `populate_models.py <key>` auto-fills this
# file by fuzzy-matching the key against each provider's live catalogue.
models:
  glm-5:
    display_name: "zai-glm-5"
    description: "GLM-5 model by Z.ai"
    providers:
      openrouter: z-ai/glm-5
      kilo: z-ai/glm-5
      fireworks: accounts/fireworks/models/glm-5
