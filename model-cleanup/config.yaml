# LiteLLM proxy config managed by the cleanup toolkit.
#
# Only the `model_list` section is touched by these scripts. Each entry has a
# `model_name` (the alias clients call) and `litellm_params` (the upstream
# routing + pricing). Free models use the 1e-09 sentinel so LiteLLM treats them
# as zero-cost without tripping its "missing price" warnings.
model_list:
  - model_name: or-qwen3-14b
    litellm_params:
      model: openrouter/qwen/qwen3-14b
      input_cost_per_token: 7.0e-08
      output_cost_per_token: 7.0e-08

  - model_name: or-claude-3-5-sonnet
    litellm_params:
      model: openrouter/anthropic/claude-3.5-sonnet
      input_cost_per_token: 3.0e-06
      output_cost_per_token: 1.5e-05

  - model_name: nv-llama-3.1-8b-instruct
    litellm_params:
      model: nvidia_nim/meta/llama-3.1-8b-instruct
      input_cost_per_token: 1.0e-09
      output_cost_per_token: 1.0e-09

  - model_name: vercel-qwen-3-14b
    litellm_params:
      model: vercel_ai_gateway/alibaba/qwen-3-14b
      input_cost_per_token: 6.0e-08
      output_cost_per_token: 6.0e-08
