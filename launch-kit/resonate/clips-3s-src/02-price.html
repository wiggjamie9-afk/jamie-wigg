<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RESONATE · price tease (3s)</title>
<meta name="viewport" content="width=1080, initial-scale=1">
<script>
  (function () {
    var p = new URLSearchParams(location.search);
    var raw = p.get('frame');
    var f = raw === null ? 0 : Math.max(0, Math.min(89, parseInt(raw, 10) || 0));
    function clamp01(x){ return Math.max(0, Math.min(1, x)); }
    var seg1 = clamp01(f / 30);
    var seg2 = clamp01((f - 30) / 30);
    var seg3 = clamp01((f - 60) / 29);
    var r = document.documentElement;
    r.style.setProperty('--seg1', seg1.toFixed(5));
    r.style.setProperty('--seg2', seg2.toFixed(5));
    r.style.setProperty('--seg3', seg3.toFixed(5));
  })();
</script>
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
  :root {
    --bg:#0A0F1F; --bg-2:#111729; --bg-3:#171F33;
    --gold:#D4AF37; --gold-bright:#F4D06F; --cream:#F4E4BC; --cream-2:#EDE9DB;
    --text:#EDE9DB; --text-2:#9CA8B8; --text-3:#5E6577;
    --border:rgba(212,175,55,0.15); --border-strong:rgba(212,175,55,0.4);
    --bloom: linear-gradient(135deg, #D4AF37 0%, #F4D06F 50%, #F4E4BC 100%);
    --seg1:0; --seg2:0; --seg3:0;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg)}
  body{font-family:'Inter',-apple-system,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased}
  .frame{position:relative;width:1080px;height:1920px;overflow:hidden;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center}
  .halo{position:absolute;inset:0;pointer-events:none}
  .halo.top{background:radial-gradient(1400px 700px at 50% -120px, rgba(212,175,55,0.14), transparent 70%)}
  .halo.bot{background:radial-gradient(1000px 600px at 50% 110%, rgba(244,228,188,0.08), transparent 70%)}

  .eyebrow{
    font-family:'JetBrains Mono',monospace;font-size:22px;letter-spacing:0.28em;text-transform:uppercase;color:var(--gold);
    margin-bottom:40px;
    opacity: calc(0.35 + var(--seg1) * 0.65);
  }
  .wordmark{
    font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:500;font-size:200px;letter-spacing:-0.02em;line-height:1;
    background:var(--bloom);-webkit-background-clip:text;background-clip:text;color:transparent;
    opacity: calc(var(--seg1) * (1 - var(--seg3) * 0.3));
    transform: translateY(calc((1 - var(--seg1)) * 32px));
    margin-bottom:60px;
  }
  .chip{
    display:inline-flex;gap:24px;align-items:center;padding:22px 38px;border-radius:2px;
    background:var(--bg-2);border:1px solid var(--border-strong);
    font-family:'JetBrains Mono',monospace;font-size:28px;letter-spacing:0.22em;text-transform:uppercase;color:var(--cream-2);
    opacity: var(--seg2);
    transform: translateY(calc((1 - var(--seg2)) * 28px));
  }
  .chip .n{
    font-family:'Cormorant Garamond',serif;font-style:italic;font-size:64px;letter-spacing:0;text-transform:none;
    background:var(--bloom);-webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .begin{
    margin-top:80px;font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:500;font-size:128px;line-height:1;
    background:var(--bloom);-webkit-background-clip:text;background-clip:text;color:transparent;
    opacity: var(--seg3);
    transform: translateY(calc((1 - var(--seg3)) * 28px));
  }
  .url{
    position:absolute;left:0;right:0;bottom:100px;text-align:center;
    font-family:'JetBrains Mono',monospace;font-size:22px;letter-spacing:0.22em;text-transform:uppercase;color:var(--text-3);
    opacity: calc(0.35 + var(--seg3) * 0.65);
  }
</style>
</head>
<body>
  <div class="frame">
    <div class="halo top"></div>
    <div class="halo bot"></div>

    <div class="eyebrow">A FREQUENCY app</div>
    <div class="wordmark">RESONATE</div>
    <div class="chip">LIFETIME <span class="n">AU$30</span> · ONE PAYMENT</div>
    <div class="begin">Begin.</div>

    <div class="url">RHYTHMIXAPP.COM.AU / RESONATE</div>
  </div>
</body>
</html>
