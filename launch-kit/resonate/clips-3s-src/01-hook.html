<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RESONATE · hook (3s)</title>
<meta name="viewport" content="width=1080, initial-scale=1">
<script>
  // Frame-driven progress. ?frame=NN  (NN = 0..89)
  // Three 30-frame bands → --seg1, --seg2, --seg3 (each 0..1).
  (function () {
    var p = new URLSearchParams(location.search);
    var raw = p.get('frame');
    var f = raw === null ? 0 : Math.max(0, Math.min(89, parseInt(raw, 10) || 0));
    var t = f / 89;
    function clamp01(x){ return Math.max(0, Math.min(1, x)); }
    var seg1 = clamp01(f / 30);
    var seg2 = clamp01((f - 30) / 30);
    var seg3 = clamp01((f - 60) / 29);
    var r = document.documentElement;
    r.style.setProperty('--t', t.toFixed(5));
    r.style.setProperty('--seg1', seg1.toFixed(5));
    r.style.setProperty('--seg2', seg2.toFixed(5));
    r.style.setProperty('--seg3', seg3.toFixed(5));
  })();
</script>
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
  :root {
    --bg:#0A0F1F; --bg-2:#111729; --bg-3:#171F33;
    --gold:#D4AF37; --gold-bright:#F4D06F; --cream:#F4E4BC; --cream-2:#EDE9DB;
    --text:#EDE9DB; --text-2:#9CA8B8; --text-3:#5E6577;
    --bloom: linear-gradient(135deg, #D4AF37 0%, #F4D06F 50%, #F4E4BC 100%);
    --t:0; --seg1:0; --seg2:0; --seg3:0;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg)}
  body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased}
  .frame{position:relative;width:1080px;height:1920px;overflow:hidden;background:var(--bg)}
  .halo-top{position:absolute;inset:0;pointer-events:none;background:radial-gradient(1400px 700px at 50% -120px, rgba(212,175,55,0.14), transparent 70%)}
  .halo-bottom{position:absolute;inset:0;pointer-events:none;background:radial-gradient(1000px 600px at 50% 110%, rgba(244,228,188,0.08), transparent 70%)}

  .stage{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 80px}
  .visual{position:relative;width:760px;height:760px;margin-bottom:60px;display:flex;align-items:center;justify-content:center}

  /* The heart pulse — seg1 grows it, seg2 carries it, fades by seg3 start */
  .dot{
    position:absolute;width:40px;height:40px;border-radius:50%;
    background:radial-gradient(circle, #F4E4BC 0%, #F4D06F 55%, rgba(212,175,55,0) 100%);
    transform: scale(calc(0.4 + var(--seg1) * 1.4));
    opacity: calc(var(--seg1) * (1 - var(--seg2) * 0.5));
    box-shadow:
      0 0 calc(50px + var(--seg1) * 90px) rgba(244,208,111, calc(0.6 + var(--seg1) * 0.4)),
      0 0 calc(140px + var(--seg1) * 160px) rgba(212,175,55, calc(0.25 + var(--seg1) * 0.35));
    will-change:transform,opacity;
  }
  /* Ripple ring outward — seg1 */
  .ripple{
    position:absolute;width:120px;height:120px;border-radius:50%;
    border:2px solid rgba(244,228,188, calc(0.6 * var(--seg1) * (1 - var(--seg2))));
    transform: scale(calc(0.5 + var(--seg1) * 3.4));
    opacity: calc(0.9 * var(--seg1) * (1 - var(--seg2)));
  }
  /* The spatial bloom — seg2 brings the orbital ellipses in, seg3 locks + glows */
  .bloom-wrap{
    position:absolute;width:680px;height:680px;
    opacity: var(--seg2);
    transform: scale(calc(0.4 + var(--seg2) * 0.6 + var(--seg3) * 0.04));
    filter:
      drop-shadow(0 0 calc(20px + var(--seg3) * 60px) rgba(212,175,55, calc(0.4 + var(--seg3) * 0.5)))
      drop-shadow(0 0 calc(60px + var(--seg3) * 100px) rgba(244,228,188, calc(0.15 + var(--seg3) * 0.35)));
    will-change:opacity,transform;
  }
  .bloom-wrap svg{width:100%;height:100%;display:block}

  /* Captions — three stacked lines, one per segment */
  .caption{
    font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-size:96px;line-height:1.05;letter-spacing:-0.015em;
    color:var(--cream-2);text-align:center;position:relative;height:120px;width:100%;
    display:flex;align-items:center;justify-content:center;
  }
  .caption .line{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;will-change:opacity,transform}
  .line-1{opacity: calc(var(--seg1) * (1 - var(--seg2))); transform: translateY(calc((1 - var(--seg1)) * 24px))}
  .line-2{opacity: calc(var(--seg2) * (1 - var(--seg3))); transform: translateY(calc((1 - var(--seg2)) * 24px))}
  .line-3{opacity: calc(var(--seg3)); transform: translateY(calc((1 - var(--seg3)) * 24px))}
  .em{font-style:italic}
  .weave-text{background:var(--bloom);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}

  /* footer */
  .footer{
    position:absolute;left:0;right:0;bottom:100px;display:flex;flex-direction:column;align-items:center;gap:22px;
    opacity: calc(0.35 + var(--seg3) * 0.65);
  }
  .wordmark{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:500;letter-spacing:0.04em;font-size:64px;background:var(--bloom);-webkit-background-clip:text;background-clip:text;color:transparent}
  .url{font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:0.22em;font-size:22px;color:var(--text-3)}

  .eyebrow{
    position:absolute;top:120px;left:0;right:0;text-align:center;
    font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:0.22em;font-size:20px;color:var(--text-3);
    opacity: calc(0.45 + var(--seg3) * 0.45);
  }
</style>
</head>
<body>
  <div class="frame">
    <div class="halo-top"></div>
    <div class="halo-bottom"></div>

    <div class="eyebrow">FREQUENCY · PRESENTS</div>

    <div class="stage">
      <div class="visual">
        <div class="ripple"></div>
        <div class="dot"></div>

        <div class="bloom-wrap" aria-hidden="true">
          <svg viewBox="0 0 200 200">
            <defs>
              <linearGradient id="og" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#D4AF37"/>
                <stop offset="100%" stop-color="#F4E4BC"/>
              </linearGradient>
              <radialGradient id="oc" cx="0.5" cy="0.5" r="0.5">
                <stop offset="0%" stop-color="#F4D06F" stop-opacity="0.3"/>
                <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
              </radialGradient>
            </defs>
            <circle cx="100" cy="100" r="70" fill="url(#oc)"/>
            <ellipse cx="100" cy="100" rx="80" ry="28" fill="none" stroke="url(#og)" stroke-width="1.6" opacity="0.85"/>
            <ellipse cx="100" cy="100" rx="80" ry="28" fill="none" stroke="url(#og)" stroke-width="1.3" opacity="0.6" transform="rotate(60 100 100)"/>
            <ellipse cx="100" cy="100" rx="80" ry="28" fill="none" stroke="url(#og)" stroke-width="1.1" opacity="0.45" transform="rotate(120 100 100)"/>
            <circle cx="100" cy="100" r="6" fill="#F4D06F"/>
          </svg>
        </div>
      </div>

      <div class="caption">
        <div class="line line-1"><span class="em">Your</span> heart.</div>
        <div class="line line-2"><span class="em">A</span> score.</div>
        <div class="line line-3"><span class="em weave-text">Resonate.</span></div>
      </div>
    </div>

    <div class="footer">
      <div class="wordmark">RESONATE</div>
      <div class="url">RHYTHMIXAPP.COM.AU / RESONATE</div>
    </div>
  </div>
</body>
</html>
