<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1080, initial-scale=1" />
<title>RESONATE · AirPods + heart waveform spatial bloom</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
  :root{
    --bg:#0A0F1F; --bg-2:#111729; --bg-3:#171F33;
    --gold:#D4AF37; --gold-bright:#F4D06F; --cream:#F4E4BC; --cream-2:#EDE9DB;
    --text:#EDE9DB; --text-2:#9CA8B8; --text-3:#5E6577;
    --border:rgba(212,175,55,0.15); --border-strong:rgba(212,175,55,0.4);
    --bloom:linear-gradient(135deg,#D4AF37 0%,#F4D06F 50%,#F4E4BC 100%);
    --font-display:'Cormorant Garamond',Georgia,serif;
    --font-ui:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    --font-mono:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{margin:0;background:#000;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:var(--font-ui);color:var(--text);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  .frame{
    position:relative;width:1080px;height:1080px;overflow:hidden;
    background:
      radial-gradient(1400px 700px at 50% -120px, rgba(212,175,55,0.10), transparent 70%),
      radial-gradient(1000px 600px at 50% 110%, rgba(244,228,188,0.06), transparent 70%),
      var(--bg);
    padding:88px;display:flex;flex-direction:column;
  }
  .top{display:flex;align-items:center;justify-content:space-between}
  .mark{display:flex;align-items:center;gap:14px}
  .mark svg{width:28px;height:28px}
  .mark .word{font-family:var(--font-display);font-style:italic;font-weight:500;font-size:22px;letter-spacing:0.06em;background:var(--bloom);-webkit-background-clip:text;background-clip:text;color:transparent}
  .eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:0.28em;text-transform:uppercase;color:var(--text-3)}

  .stage{flex-grow:1;position:relative;display:flex;align-items:center;justify-content:center;margin-top:24px}

  /* The bloom — three concentric ellipses with the gold gradient */
  .bloom-wrap{
    position:absolute;width:820px;height:820px;display:flex;align-items:center;justify-content:center;
  }
  .bloom-wrap svg{width:100%;height:100%}

  /* AirPods — minimalist line drawing in cream */
  .pods{
    position:relative;width:520px;height:300px;display:flex;align-items:center;justify-content:space-between;
    z-index:2;
  }
  .pod{
    position:relative;width:120px;height:200px;
  }
  .pod svg{width:100%;height:100%;display:block;filter:drop-shadow(0 0 24px rgba(244,228,188,0.18))}

  /* heart waveform behind the pods */
  .heart{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:820px;height:160px;z-index:1;opacity:0.55;
  }
  .heart svg{width:100%;height:100%}

  .caption{
    margin-top:32px;text-align:center;
  }
  .caption .head{
    font-family:var(--font-display);font-weight:500;font-size:84px;line-height:1.05;letter-spacing:-0.015em;color:var(--cream-2);
  }
  .caption .head em{
    font-style:italic;font-weight:500;
    background:var(--bloom);-webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .caption .sub{
    margin-top:18px;font-family:var(--font-display);font-style:italic;font-size:30px;color:var(--text-2);
  }
  .bottom{
    margin-top:auto;display:flex;align-items:center;justify-content:space-between;padding-top:24px;
    font-family:var(--font-mono);font-size:11px;letter-spacing:0.24em;text-transform:uppercase;color:var(--text-3);
  }
</style>
</head>
<body>
  <div class="frame">
    <div class="top">
      <div class="mark">
        <svg viewBox="0 0 40 40" aria-hidden="true">
          <defs>
            <linearGradient id="bm" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#D4AF37"/><stop offset="100%" stop-color="#F4E4BC"/>
            </linearGradient>
            <radialGradient id="bc" cx="0.5" cy="0.5" r="0.5">
              <stop offset="0%" stop-color="#F4D06F" stop-opacity="0.6"/>
              <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
            </radialGradient>
          </defs>
          <circle cx="20" cy="20" r="6" fill="url(#bc)"/>
          <circle cx="20" cy="20" r="3.5" fill="#F4D06F"/>
          <ellipse cx="20" cy="20" rx="14" ry="5" fill="none" stroke="url(#bm)" stroke-width="1.2" opacity="0.85"/>
          <ellipse cx="20" cy="20" rx="14" ry="5" fill="none" stroke="url(#bm)" stroke-width="1" opacity="0.55" transform="rotate(60 20 20)"/>
        </svg>
        <span class="word">RESONATE</span>
      </div>
      <span class="eyebrow">The hardware you already own</span>
    </div>

    <div class="stage">
      <!-- spatial bloom -->
      <div class="bloom-wrap" aria-hidden="true">
        <svg viewBox="0 0 820 820">
          <defs>
            <linearGradient id="bloomG" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.7"/>
              <stop offset="50%" stop-color="#F4D06F" stop-opacity="0.9"/>
              <stop offset="100%" stop-color="#F4E4BC" stop-opacity="0.7"/>
            </linearGradient>
            <radialGradient id="bloomFill" cx="0.5" cy="0.5" r="0.5">
              <stop offset="0%" stop-color="#F4D06F" stop-opacity="0.18"/>
              <stop offset="60%" stop-color="#D4AF37" stop-opacity="0.04"/>
              <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
            </radialGradient>
          </defs>
          <circle cx="410" cy="410" r="380" fill="url(#bloomFill)"/>
          <ellipse cx="410" cy="410" rx="360" ry="120" fill="none" stroke="url(#bloomG)" stroke-width="1.5" opacity="0.55"/>
          <ellipse cx="410" cy="410" rx="360" ry="120" fill="none" stroke="url(#bloomG)" stroke-width="1.2" opacity="0.45" transform="rotate(60 410 410)"/>
          <ellipse cx="410" cy="410" rx="360" ry="120" fill="none" stroke="url(#bloomG)" stroke-width="1.0" opacity="0.35" transform="rotate(120 410 410)"/>
          <ellipse cx="410" cy="410" rx="280" ry="90" fill="none" stroke="url(#bloomG)" stroke-width="0.9" opacity="0.30" transform="rotate(30 410 410)"/>
          <ellipse cx="410" cy="410" rx="280" ry="90" fill="none" stroke="url(#bloomG)" stroke-width="0.9" opacity="0.30" transform="rotate(90 410 410)"/>
          <ellipse cx="410" cy="410" rx="280" ry="90" fill="none" stroke="url(#bloomG)" stroke-width="0.9" opacity="0.30" transform="rotate(150 410 410)"/>
        </svg>
      </div>

      <!-- heart waveform horizontal -->
      <div class="heart" aria-hidden="true">
        <svg viewBox="0 0 820 160" preserveAspectRatio="none">
          <defs>
            <linearGradient id="hwG" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="#D4AF37" stop-opacity="0"/>
              <stop offset="20%" stop-color="#D4AF37" stop-opacity="0.6"/>
              <stop offset="50%" stop-color="#F4E4BC" stop-opacity="1"/>
              <stop offset="80%" stop-color="#D4AF37" stop-opacity="0.6"/>
              <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
            </linearGradient>
          </defs>
          <path d="M 0 80 L 130 80 L 180 80 L 210 50 L 240 110 L 270 22 L 300 138 L 330 50 L 360 80 L 410 80 L 460 80 L 490 60 L 520 100 L 550 80 L 690 80 L 820 80"
                fill="none" stroke="url(#hwG)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>

      <!-- AirPods — left and right -->
      <div class="pods" aria-hidden="true">
        <div class="pod">
          <svg viewBox="0 0 120 200">
            <defs>
              <linearGradient id="podG" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#EDE9DB"/>
                <stop offset="100%" stop-color="#9CA8B8"/>
              </linearGradient>
            </defs>
            <!-- ear bud -->
            <ellipse cx="60" cy="60" rx="38" ry="36" fill="url(#podG)"/>
            <ellipse cx="60" cy="60" rx="22" ry="20" fill="#0A0F1F"/>
            <!-- stem -->
            <rect x="44" y="80" width="32" height="110" rx="14" fill="url(#podG)"/>
            <!-- highlight -->
            <ellipse cx="50" cy="48" rx="10" ry="6" fill="#F4E4BC" opacity="0.4"/>
            <!-- sensor dot — the optical heart-rate sensor -->
            <circle cx="60" cy="170" r="3" fill="#F4D06F" opacity="0.9"/>
          </svg>
        </div>
        <div class="pod">
          <svg viewBox="0 0 120 200">
            <ellipse cx="60" cy="60" rx="38" ry="36" fill="url(#podG)"/>
            <ellipse cx="60" cy="60" rx="22" ry="20" fill="#0A0F1F"/>
            <rect x="44" y="80" width="32" height="110" rx="14" fill="url(#podG)"/>
            <ellipse cx="50" cy="48" rx="10" ry="6" fill="#F4E4BC" opacity="0.4"/>
            <circle cx="60" cy="170" r="3" fill="#F4D06F" opacity="0.9"/>
          </svg>
        </div>
      </div>
    </div>

    <div class="caption">
      <div class="head">AirPods in. <em>Music in space.</em></div>
      <div class="sub">The heart rate sensor and head-tracker were already there.</div>
    </div>

    <div class="bottom">
      <span>AIRPODS PRO 3 · APPLE WATCH · IPHONE</span>
      <span>RHYTHMIXAPP.COM.AU / RESONATE</span>
    </div>
  </div>
</body>
</html>
