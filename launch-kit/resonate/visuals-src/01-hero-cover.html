<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1280, initial-scale=1" />
<title>RESONATE · Hero cover</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
  :root {
    --bg:#0A0F1F; --bg-2:#111729; --bg-3:#171F33;
    --gold:#D4AF37; --gold-bright:#F4D06F; --gold-dim:rgba(212,175,55,0.55);
    --cream:#F4E4BC; --cream-2:#EDE9DB;
    --text:#EDE9DB; --text-2:#9CA8B8; --text-3:#5E6577;
    --border:rgba(212,175,55,0.15); --border-strong:rgba(212,175,55,0.4);
    --bloom:linear-gradient(135deg,#D4AF37 0%,#F4D06F 50%,#F4E4BC 100%);
    --font-display:'Cormorant Garamond',Georgia,serif;
    --font-ui:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    --font-mono:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{margin:0;background:#000;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:var(--font-ui);color:var(--text);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  .frame{
    position:relative;width:1280px;height:720px;overflow:hidden;
    background:
      radial-gradient(1400px 700px at 50% -120px, rgba(212,175,55,0.10), transparent 70%),
      radial-gradient(1000px 600px at 50% 110%, rgba(244,228,188,0.06), transparent 70%),
      var(--bg);
  }
  .grid{
    position:absolute;inset:0;display:grid;grid-template-columns: 1.05fr 0.95fr;align-items:center;
    padding:72px 96px;gap:48px;
  }
  .left{display:flex;flex-direction:column;gap:30px;max-width:640px;z-index:2}
  .eyebrow{
    font-family:var(--font-mono);font-size:11px;letter-spacing:0.28em;text-transform:uppercase;
    color:var(--gold);display:inline-flex;align-items:center;gap:14px;
  }
  .eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--gold-bright);box-shadow:0 0 12px var(--gold-bright)}
  .title{
    font-family:var(--font-display);font-weight:500;font-size:148px;line-height:0.95;letter-spacing:-0.015em;
    color:var(--cream-2);
  }
  .title .italic{
    font-style:italic;font-weight:500;
    background:var(--bloom);-webkit-background-clip:text;background-clip:text;color:transparent;
    display:block;margin-top:4px;
  }
  .tag{
    color:var(--text-2);font-size:21px;line-height:1.55;font-weight:300;max-width:34ch;
  }
  .tag em{font-style:italic;color:var(--cream)}
  .row{display:flex;align-items:center;gap:20px;margin-top:8px}
  .pay-chip{
    display:inline-flex;align-items:center;gap:12px;
    padding:11px 20px;border-radius:2px;
    background:var(--bg-2);border:1px solid var(--border-strong);
    font-family:var(--font-mono);font-size:11px;letter-spacing:0.22em;text-transform:uppercase;color:var(--cream-2);
  }
  .pay-chip .num{color:var(--gold-bright);font-weight:700;letter-spacing:0;text-transform:none;font-size:14px}
  .pay-chip .sep{color:var(--text-3)}
  .right{position:relative;display:flex;align-items:center;justify-content:center;height:100%}
  .orb-stage{
    width:520px;height:520px;position:relative;display:flex;align-items:center;justify-content:center;
  }
  .ring{
    position:absolute;border-radius:50%;
  }
  .ring.r1{inset:0;border:1px solid rgba(212,175,55,0.30)}
  .ring.r2{inset:-36px;border:1px solid rgba(212,175,55,0.15)}
  .ring.r3{inset:-92px;border:1px solid rgba(244,228,188,0.06)}
  /* the orbit ellipses — head-tracked spatial cue */
  .orbit{
    position:absolute;inset:-12px;border-radius:50%;
  }
  .orbit svg{width:100%;height:100%;display:block}
  .core{
    width:300px;height:300px;border-radius:50%;
    background:
      radial-gradient(circle at 50% 45%, rgba(244,208,111,0.30), rgba(212,175,55,0.08) 50%, transparent 72%);
    box-shadow:0 0 90px rgba(212,175,55,0.25), inset 0 0 80px rgba(244,228,188,0.06);
    position:relative;display:flex;align-items:center;justify-content:center;
  }
  .core svg{width:100%;height:100%}
  .footer{
    position:absolute;left:96px;right:96px;bottom:48px;
    display:flex;justify-content:space-between;align-items:center;
    font-family:var(--font-mono);font-size:10px;letter-spacing:0.24em;text-transform:uppercase;color:var(--text-3);
  }
  .footer .mark{display:flex;align-items:center;gap:10px}
  .footer .mark svg{width:22px;height:22px}
  .footer .mark .word{font-family:var(--font-display);font-style:italic;font-weight:500;font-size:14px;letter-spacing:0.06em;background:var(--bloom);-webkit-background-clip:text;background-clip:text;color:transparent}
</style>
</head>
<body>
  <div class="frame">
    <div class="grid">
      <div class="left">
        <span class="eyebrow"><span class="dot"></span>FREQUENCY presents</span>
        <h1 class="title">Music that<span class="italic">breathes with you.</span></h1>
        <p class="tag">A closed-loop biometric score, head-tracked in 3D space. AirPods in. Watch on. <em>Everything stays on this phone.</em></p>
        <div class="row">
          <div class="pay-chip"><span>Lifetime</span><span class="num">AU$30</span><span class="sep">·</span><span>One payment</span></div>
        </div>
      </div>
      <div class="right">
        <div class="orb-stage">
          <span class="ring r1"></span><span class="ring r2"></span><span class="ring r3"></span>
          <div class="orbit">
            <svg viewBox="0 0 520 520" aria-hidden="true">
              <defs>
                <linearGradient id="og" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0%" stop-color="#D4AF37"/>
                  <stop offset="100%" stop-color="#F4E4BC"/>
                </linearGradient>
              </defs>
              <ellipse cx="260" cy="260" rx="220" ry="80" fill="none" stroke="url(#og)" stroke-width="1.2" opacity="0.85"/>
              <ellipse cx="260" cy="260" rx="220" ry="80" fill="none" stroke="url(#og)" stroke-width="1" opacity="0.55" transform="rotate(60 260 260)"/>
              <ellipse cx="260" cy="260" rx="220" ry="80" fill="none" stroke="url(#og)" stroke-width="1" opacity="0.45" transform="rotate(120 260 260)"/>
            </svg>
          </div>
          <div class="core">
            <svg viewBox="0 0 300 300" aria-hidden="true">
              <defs>
                <radialGradient id="hg" cx="0.5" cy="0.5" r="0.5">
                  <stop offset="0%" stop-color="#F4D06F" stop-opacity="0.9"/>
                  <stop offset="55%" stop-color="#D4AF37" stop-opacity="0.5"/>
                  <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
                </radialGradient>
                <linearGradient id="hgs" x1="0" y1="0" x2="1" y2="0">
                  <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.1"/>
                  <stop offset="50%" stop-color="#F4E4BC" stop-opacity="1"/>
                  <stop offset="100%" stop-color="#D4AF37" stop-opacity="0.1"/>
                </linearGradient>
              </defs>
              <circle cx="150" cy="150" r="80" fill="url(#hg)"/>
              <!-- the heart trace -->
              <path d="M 50 150 L 85 150 L 95 130 L 110 175 L 125 110 L 140 150 L 165 150 L 180 140 L 195 150 L 250 150"
                    fill="none" stroke="url(#hgs)" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </div>
        </div>
      </div>
    </div>
    <div class="footer">
      <div class="mark">
        <svg viewBox="0 0 40 40" aria-hidden="true">
          <defs>
            <linearGradient id="fm" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#D4AF37"/><stop offset="100%" stop-color="#F4E4BC"/>
            </linearGradient>
            <radialGradient id="fc" cx="0.5" cy="0.5" r="0.5">
              <stop offset="0%" stop-color="#F4D06F" stop-opacity="0.6"/>
              <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
            </radialGradient>
          </defs>
          <circle cx="20" cy="20" r="6" fill="url(#fc)"/>
          <circle cx="20" cy="20" r="3.5" fill="#F4D06F"/>
          <ellipse cx="20" cy="20" rx="14" ry="5" fill="none" stroke="url(#fm)" stroke-width="1.2" opacity="0.85"/>
          <ellipse cx="20" cy="20" rx="14" ry="5" fill="none" stroke="url(#fm)" stroke-width="1" opacity="0.55" transform="rotate(60 20 20)"/>
        </svg>
        <span class="word">RESONATE</span>
      </div>
      <span>RHYTHMIXAPP.COM.AU / RESONATE</span>
      <span>ON-DEVICE · SPATIAL · CLOSED-LOOP</span>
    </div>
  </div>
</body>
</html>
