<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>RESONATE · Variant C · Emotional Hook</title>
<style>
*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
html,body { width:1080px; height:1920px; overflow:hidden; background:#0A0F1F; font-family:'Inter',-apple-system,system-ui,sans-serif; -webkit-font-smoothing:antialiased; }

.stage {
  position:relative; width:1080px; height:1920px;
  background:
    radial-gradient(ellipse 1100px 900px at 50% 45%, rgba(245,192,0,0.18) 0%, rgba(245,192,0,0.04) 40%, transparent 70%),
    radial-gradient(ellipse 600px 600px at 80% 90%, rgba(245,240,232,0.05), transparent 70%),
    radial-gradient(ellipse 600px 600px at 20% 10%, rgba(245,192,0,0.06), transparent 70%),
    linear-gradient(180deg, #0A0F1F 0%, #111729 40%, #0A0F1F 100%);
  overflow:hidden;
}

/* Breathing orb — slow inhale/exhale 11s loop = 5.5 in / 5.5 out */
.breath-stage {
  position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
  width:1080px; height:1080px;
  display:flex; align-items:center; justify-content:center;
}
.breath-rings {
  position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
  width:900px; height:900px;
  display:flex; align-items:center; justify-content:center;
}
.ring {
  position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
  border-radius:50%;
  border:1px solid rgba(245,192,0,0.18);
  animation: breathe 11s ease-in-out infinite;
}
.ring-1 { width:260px; height:260px; animation-delay:0s; border-color:rgba(245,192,0,0.45); }
.ring-2 { width:420px; height:420px; animation-delay:0.4s; border-color:rgba(245,192,0,0.30); }
.ring-3 { width:600px; height:600px; animation-delay:0.8s; border-color:rgba(245,192,0,0.20); }
.ring-4 { width:800px; height:800px; animation-delay:1.2s; border-color:rgba(245,192,0,0.12); }
.ring-5 { width:1020px; height:1020px; animation-delay:1.6s; border-color:rgba(245,192,0,0.07); }

@keyframes breathe {
  0%   { transform:translate(-50%,-50%) scale(0.78); opacity:0.45; }
  45%  { transform:translate(-50%,-50%) scale(1.08); opacity:1; }
  55%  { transform:translate(-50%,-50%) scale(1.08); opacity:1; }
  100% { transform:translate(-50%,-50%) scale(0.78); opacity:0.45; }
}

.core {
  position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
  width:200px; height:200px; border-radius:50%;
  background:
    radial-gradient(circle at 50% 50%, #fff8e0 0%, #f5c000 35%, #b88c00 70%, transparent 100%);
  box-shadow:
    0 0 80px rgba(245,192,0,0.6),
    0 0 160px rgba(245,192,0,0.4),
    0 0 240px rgba(245,192,0,0.2);
  animation: corebreathe 11s ease-in-out infinite;
}
@keyframes corebreathe {
  0%   { transform:translate(-50%,-50%) scale(0.7); opacity:0.85; }
  45%  { transform:translate(-50%,-50%) scale(1.15); opacity:1; }
  55%  { transform:translate(-50%,-50%) scale(1.15); opacity:1; }
  100% { transform:translate(-50%,-50%) scale(0.7); opacity:0.85; }
}

/* Soft cream fog at bottom */
.fog {
  position:absolute; bottom:0; left:0; right:0; height:700px;
  background:linear-gradient(180deg, transparent 0%, rgba(10,15,31,0.6) 40%, rgba(10,15,31,0.95) 100%);
  pointer-events:none;
}

/* Top — breath cue */
.breath-cue {
  position:absolute; top:90px; left:0; right:0;
  text-align:center;
  font-family:'JetBrains Mono',ui-monospace,monospace;
  font-size:18px; letter-spacing:0.45em; text-transform:uppercase;
  color:#f5c000;
}
.breath-cue .subtle {
  display:block;
  font-family:'Cormorant Garamond','Georgia',serif;
  font-style:italic;
  font-size:22px;
  letter-spacing:0.05em;
  color:#9CA8B8;
  text-transform:none;
  margin-top:14px;
  font-weight:400;
}

/* Headline */
.headline {
  position:absolute; bottom:530px; left:60px; right:60px;
  text-align:center;
}
.headline h1 {
  font-family:'Cormorant Garamond','Georgia',serif;
  font-weight:300;
  font-size:120px;
  line-height:0.96;
  letter-spacing:-0.02em;
  color:#f5f0e8;
  text-shadow: 0 4px 30px rgba(0,0,0,0.6);
}
.headline h1 .glow {
  font-style:italic;
  color:#f5c000;
  display:block;
  text-shadow:
    0 0 30px rgba(245,192,0,0.5),
    0 4px 30px rgba(0,0,0,0.6);
}
.headline .negation {
  display:block;
  margin-top:36px;
  font-family:'Cormorant Garamond','Georgia',serif;
  font-style:italic;
  font-weight:400;
  font-size:48px;
  color:#9CA8B8;
  letter-spacing:0.02em;
}
.headline .negation strike {
  text-decoration-color:rgba(184,140,0,0.8);
  text-decoration-thickness:2px;
}

/* Bottom block */
.bottom-block {
  position:absolute; bottom:90px; left:60px; right:60px;
  display:flex; flex-direction:column; align-items:center; gap:32px;
}
.wordmark {
  font-family:'Cormorant Garamond','Georgia',serif;
  font-size:38px; letter-spacing:0.32em;
  color:#f5f0e8;
}
.wordmark em { font-style:italic; color:#f5c000; font-weight:500; }

.cta-row {
  display:flex; align-items:baseline; gap:24px;
  padding:22px 44px;
  border:1px solid rgba(245,192,0,0.6);
  background:rgba(10,15,31,0.55);
  backdrop-filter:blur(8px);
  border-radius:2px;
}
.price {
  font-family:'Cormorant Garamond','Georgia',serif;
  font-style:italic;
  font-size:58px;
  color:#f5c000;
  line-height:1;
}
.price small { font-size:0.4em; vertical-align:top; opacity:0.85; margin-right:4px; }
.lifetime-tag {
  font-family:'JetBrains Mono',monospace;
  font-size:16px; letter-spacing:0.28em;
  color:#f5f0e8; text-transform:uppercase;
}

.url {
  font-family:'JetBrains Mono',monospace;
  font-size:17px; letter-spacing:0.24em;
  color:#9CA8B8; text-transform:uppercase;
}
.url b { color:#f5c000; font-weight:500; }

/* Hairline frame */
.frame {
  position:absolute; inset:30px;
  border:1px solid rgba(245,192,0,0.12);
  pointer-events:none;
}
</style>
</head>
<body>
<div class="stage">
  <div class="frame"></div>

  <div class="breath-cue">
    BREATHE IN <span style="opacity:0.4;">·</span> BREATHE OUT
    <span class="subtle">5.5 seconds in. 5.5 seconds out.</span>
  </div>

  <div class="breath-stage">
    <div class="breath-rings">
      <div class="ring ring-5"></div>
      <div class="ring ring-4"></div>
      <div class="ring ring-3"></div>
      <div class="ring ring-2"></div>
      <div class="ring ring-1"></div>
      <div class="core"></div>
    </div>
  </div>

  <div class="fog"></div>

  <div class="headline">
    <h1>
      Music that
      <span class="glow">breathes</span>
      with you.
    </h1>
    <span class="negation">Not <strike>at</strike> you.</span>
  </div>

  <div class="bottom-block">
    <div class="wordmark">RHYTHMIX <em>RESONATE</em></div>
    <div class="cta-row">
      <div class="price"><small>AU$</small>30</div>
      <div class="lifetime-tag">Lifetime</div>
    </div>
    <div class="url">rhythmixapp.com.au/<b>resonate</b></div>
  </div>
</div>
</body>
</html>
