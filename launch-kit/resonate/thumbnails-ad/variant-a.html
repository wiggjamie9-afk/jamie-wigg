<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>RESONATE · Variant A · Tech Credibility</title>
<style>
*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
html,body { width:1080px; height:1920px; overflow:hidden; background:#0A0F1F; font-family:'Inter',-apple-system,system-ui,sans-serif; -webkit-font-smoothing:antialiased; }

.stage {
  position:relative; width:1080px; height:1920px;
  background:
    radial-gradient(ellipse 900px 600px at 50% 30%, rgba(245,192,0,0.12), transparent 60%),
    radial-gradient(ellipse 700px 700px at 50% 80%, rgba(245,192,0,0.06), transparent 70%),
    linear-gradient(180deg, #0A0F1F 0%, #111729 50%, #0A0F1F 100%);
  overflow:hidden;
}

/* Top label */
.top-bar {
  position:absolute; top:60px; left:60px; right:60px;
  display:flex; justify-content:space-between; align-items:center;
  font-family:'JetBrains Mono',ui-monospace,monospace;
  font-size:18px; letter-spacing:0.28em; text-transform:uppercase;
  color:#f5c000;
}
.top-bar .right { color:#9CA8B8; font-size:16px; }

/* Device pairing — center */
.devices {
  position:absolute; top:280px; left:50%; transform:translateX(-50%);
  display:flex; align-items:center; gap:90px;
  filter:drop-shadow(0 30px 60px rgba(0,0,0,0.6));
}

/* AirPods Pro — abstract render via CSS */
.airpod {
  position:relative; width:200px; height:280px;
}
.airpod .stem {
  position:absolute; bottom:0; left:50%; transform:translateX(-50%);
  width:60px; height:200px; border-radius:30px;
  background:linear-gradient(180deg, #f8f6ef 0%, #e8e3d4 50%, #c9c2b0 100%);
  box-shadow: inset -8px 0 16px rgba(0,0,0,0.15), inset 8px 0 12px rgba(255,255,255,0.4);
}
.airpod .stem::after {
  content:''; position:absolute; bottom:30px; left:50%; transform:translateX(-50%);
  width:30px; height:12px; border-radius:6px; background:#1a1a1a; opacity:0.4;
}
.airpod .bud {
  position:absolute; top:0; left:50%; transform:translateX(-50%);
  width:160px; height:140px;
  background:radial-gradient(ellipse at 30% 30%, #ffffff 0%, #f5f0e8 30%, #c9c2b0 80%);
  border-radius:50% 50% 45% 45% / 60% 60% 40% 40%;
  box-shadow: inset -12px -8px 24px rgba(0,0,0,0.18), inset 10px 8px 20px rgba(255,255,255,0.5), 0 8px 20px rgba(0,0,0,0.3);
}
.airpod .sensor {
  position:absolute; top:60px; left:50%; transform:translateX(-50%);
  width:50px; height:50px; border-radius:50%;
  background:radial-gradient(circle, #f5c000 0%, #b87f00 50%, #1a1a1a 80%);
  box-shadow: 0 0 40px rgba(245,192,0,0.7), inset 0 0 8px rgba(0,0,0,0.6);
  animation: hrpulse 0.82s ease-in-out infinite;
}
.airpod-r { transform:scaleX(-1); }
@keyframes hrpulse {
  0%,100% { transform:translateX(-50%) scale(0.85); opacity:0.85; }
  50% { transform:translateX(-50%) scale(1.1); opacity:1; }
}

/* Apple Watch — abstract */
.watch { position:relative; width:240px; height:300px; }
.watch .case {
  position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
  width:200px; height:240px; border-radius:48px;
  background:linear-gradient(135deg, #2a2a2e 0%, #1a1a1e 100%);
  box-shadow: 0 20px 50px rgba(0,0,0,0.5), inset 0 2px 4px rgba(255,255,255,0.1);
}
.watch .screen {
  position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
  width:170px; height:210px; border-radius:38px;
  background:#000; overflow:hidden;
  box-shadow: inset 0 0 30px rgba(0,0,0,0.9);
}
.watch .screen-content {
  position:absolute; inset:0;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  color:#f5c000;
}
.watch .bpm-num {
  font-size:64px; font-weight:600; letter-spacing:-0.02em;
  text-shadow:0 0 20px rgba(245,192,0,0.8);
  font-family:'Cormorant Garamond','Georgia',serif; font-style:italic;
}
.watch .bpm-label {
  font-size:13px; letter-spacing:0.3em; color:#9CA8B8; margin-top:4px;
  font-family:'JetBrains Mono',monospace;
}
.watch .heart-pulse {
  width:120px; height:30px; margin-top:12px;
}
.watch .crown {
  position:absolute; top:50%; right:-4px; transform:translateY(-50%);
  width:18px; height:60px; border-radius:4px;
  background:linear-gradient(90deg, #4a4a4e, #2a2a2e);
}

/* Connection ripple between devices */
.connect-line {
  position:absolute; top:430px; left:50%; transform:translateX(-50%);
  width:600px; height:600px; pointer-events:none;
}
.connect-line .ring {
  position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
  border:1px solid rgba(245,192,0,0.5); border-radius:50%;
  animation: ripple 2.5s ease-out infinite;
}
.connect-line .ring-1 { animation-delay:0s; }
.connect-line .ring-2 { animation-delay:0.8s; }
.connect-line .ring-3 { animation-delay:1.6s; }
@keyframes ripple {
  0% { width:200px; height:200px; opacity:0.9; }
  100% { width:680px; height:680px; opacity:0; }
}

/* Headline */
.headline {
  position:absolute; bottom:480px; left:60px; right:60px;
  text-align:center;
}
.headline h1 {
  font-family:'Cormorant Garamond','Georgia',serif;
  font-weight:400;
  font-size:108px;
  line-height:0.96;
  letter-spacing:-0.015em;
  color:#f5f0e8;
}
.headline h1 .accent {
  font-style:italic;
  color:#f5c000;
  display:block;
}

/* Sub + CTA block */
.bottom-block {
  position:absolute; bottom:120px; left:60px; right:60px;
  display:flex; flex-direction:column; align-items:center; gap:36px;
}
.wordmark {
  font-family:'Cormorant Garamond','Georgia',serif;
  font-size:38px; letter-spacing:0.32em;
  color:#f5f0e8;
}
.wordmark em { font-style:italic; color:#f5c000; font-weight:500; }

.price-row {
  display:flex; align-items:center; gap:32px;
  padding:24px 48px;
  border:1.5px solid #f5c000;
  background:rgba(245,192,0,0.05);
  border-radius:2px;
}
.price {
  font-family:'Cormorant Garamond','Georgia',serif;
  font-size:64px; font-style:italic; color:#f5c000;
  line-height:1;
}
.price small { font-size:0.45em; vertical-align:top; opacity:0.85; }
.lifetime {
  font-family:'JetBrains Mono',monospace;
  font-size:18px; letter-spacing:0.28em;
  color:#f5f0e8; text-transform:uppercase;
}

.url {
  font-family:'JetBrains Mono',monospace;
  font-size:18px; letter-spacing:0.22em;
  color:#9CA8B8; text-transform:uppercase;
}
.url b { color:#f5c000; font-weight:500; }

/* Corner ticks */
.tick {
  position:absolute; width:32px; height:32px;
  border:1.5px solid #f5c000; opacity:0.6;
}
.tick-tl { top:30px; left:30px; border-right:none; border-bottom:none; }
.tick-tr { top:30px; right:30px; border-left:none; border-bottom:none; }
.tick-bl { bottom:30px; left:30px; border-right:none; border-top:none; }
.tick-br { bottom:30px; right:30px; border-left:none; border-top:none; }
</style>
</head>
<body>
<div class="stage">
  <div class="tick tick-tl"></div>
  <div class="tick tick-tr"></div>
  <div class="tick tick-bl"></div>
  <div class="tick tick-br"></div>

  <div class="top-bar">
    <span>· NEW · 2026</span>
    <span class="right">AirPods Pro 3 · Watch</span>
  </div>

  <div class="connect-line">
    <div class="ring ring-1"></div>
    <div class="ring ring-2"></div>
    <div class="ring ring-3"></div>
  </div>

  <div class="devices">
    <div class="airpod airpod-l">
      <div class="bud">
        <div class="sensor"></div>
      </div>
      <div class="stem"></div>
    </div>
    <div class="watch">
      <div class="case"></div>
      <div class="screen">
        <div class="screen-content">
          <div class="bpm-num">62</div>
          <div class="bpm-label">BPM</div>
          <svg class="heart-pulse" viewBox="0 0 120 30" preserveAspectRatio="none">
            <polyline points="0,15 28,15 33,5 38,25 43,15 60,15 65,8 70,22 75,15 120,15"
                      fill="none" stroke="#f5c000" stroke-width="2"
                      style="filter: drop-shadow(0 0 3px #f5c000);"/>
          </svg>
        </div>
      </div>
      <div class="crown"></div>
    </div>
  </div>

  <div class="headline">
    <h1>
      Your AirPods
      <span class="accent">can now hear</span>
      your heartbeat.
    </h1>
  </div>

  <div class="bottom-block">
    <div class="wordmark">RHYTHMIX <em>RESONATE</em></div>
    <div class="price-row">
      <div class="price"><small>AU$</small>30</div>
      <div class="lifetime">Lifetime · One Time</div>
    </div>
    <div class="url">rhythmixapp.com.au/<b>resonate</b></div>
  </div>
</div>
</body>
</html>
