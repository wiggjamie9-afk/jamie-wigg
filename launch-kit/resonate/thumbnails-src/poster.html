<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080, initial-scale=1">
<title>RESONATE — vertical poster</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
  :root {
    --bg:#0A0F1F; --bg-2:#111729; --bg-3:#171F33;
    --gold:#D4AF37; --gold-bright:#F4D06F; --cream:#F4E4BC; --cream-2:#EDE9DB;
    --text:#EDE9DB; --text-2:#9CA8B8; --text-3:#5E6577;
    --border:rgba(212,175,55,0.15); --border-strong:rgba(212,175,55,0.4);
    --bloom:linear-gradient(135deg,#D4AF37 0%,#F4D06F 50%,#F4E4BC 100%);
    --font-display:'Cormorant Garamond',Georgia,serif;
    --font-ui:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    --font-mono:'JetBrains Mono',monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;min-height:100vh;background:#000}
  body{display:flex;align-items:center;justify-content:center;font-family:var(--font-ui);color:var(--text);-webkit-font-smoothing:antialiased}
  .frame{
    width:1080px;height:1920px;position:relative;overflow:hidden;
    background:
      radial-gradient(1400px 700px at 50% -120px, rgba(212,175,55,0.14), transparent 70%),
      radial-gradient(1000px 700px at 50% 110%, rgba(244,228,188,0.08), transparent 70%),
      var(--bg);
    padding:120px 80px;
    display:flex;flex-direction:column;align-items:center;text-align:center;
  }
  .eyebrow{
    font-family:var(--font-mono);font-size:22px;letter-spacing:0.28em;text-transform:uppercase;color:var(--gold);
    display:inline-flex;align-items:center;gap:14px;
  }
  .eyebrow .dot{width:8px;height:8px;border-radius:50%;background:var(--gold-bright);box-shadow:0 0 16px var(--gold-bright)}
  .stage{
    margin-top:80px;width:760px;height:760px;position:relative;display:flex;align-items:center;justify-content:center;
  }
  .stage .ring{position:absolute;border-radius:50%;}
  .stage .r1{inset:0;border:1px solid rgba(212,175,55,0.30)}
  .stage .r2{inset:-50px;border:1px solid rgba(212,175,55,0.18)}
  .stage .r3{inset:-130px;border:1px solid rgba(244,228,188,0.08)}
  .stage .orbit{position:absolute;inset:-20px}
  .stage .orbit svg{width:100%;height:100%}
  .stage .core{
    width:440px;height:440px;border-radius:50%;
    background:radial-gradient(circle at 50% 45%, rgba(244,208,111,0.32), rgba(212,175,55,0.06) 55%, transparent 75%);
    box-shadow:0 0 120px rgba(212,175,55,0.30), inset 0 0 100px rgba(244,228,188,0.08);
    display:flex;align-items:center;justify-content:center;
  }
  .heart-svg{width:90%;height:90%}
  .title{
    margin-top:64px;
    font-family:var(--font-display);font-weight:500;font-size:200px;line-height:0.95;letter-spacing:-0.025em;color:var(--cream-2);
  }
  .title .italic{
    font-style:italic;font-weight:500;
    background:var(--bloom);-webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .tagline{
    margin-top:36px;
    font-family:var(--font-display);font-style:italic;font-weight:400;font-size:60px;line-height:1.2;color:var(--cream);max-width:18ch;
  }
  .pay-chip{
    margin-top:64px;display:inline-flex;gap:18px;align-items:center;padding:18px 32px;border-radius:2px;
    background:var(--bg-2);border:1px solid var(--border-strong);
    font-family:var(--font-mono);font-size:22px;letter-spacing:0.18em;text-transform:uppercase;color:var(--cream-2);
  }
  .pay-chip .num{font-family:var(--font-display);font-style:italic;font-size:42px;letter-spacing:0;text-transform:none;background:var(--bloom);-webkit-background-clip:text;background-clip:text;color:transparent}
  .urlfoot{
    position:absolute;left:0;right:0;bottom:60px;text-align:center;
    font-family:var(--font-mono);font-size:22px;letter-spacing:0.28em;text-transform:uppercase;color:var(--text-3);
  }
</style>
</head>
<body>
<div class="frame">
  <div class="eyebrow"><span class="dot"></span>FREQUENCY presents</div>

  <div class="stage">
    <span class="ring r1"></span><span class="ring r2"></span><span class="ring r3"></span>
    <div class="orbit" aria-hidden="true">
      <svg viewBox="0 0 800 800">
        <defs>
          <linearGradient id="og" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#D4AF37"/>
            <stop offset="100%" stop-color="#F4E4BC"/>
          </linearGradient>
        </defs>
        <ellipse cx="400" cy="400" rx="340" ry="120" fill="none" stroke="url(#og)" stroke-width="1.4" opacity="0.85"/>
        <ellipse cx="400" cy="400" rx="340" ry="120" fill="none" stroke="url(#og)" stroke-width="1.1" opacity="0.6" transform="rotate(60 400 400)"/>
        <ellipse cx="400" cy="400" rx="340" ry="120" fill="none" stroke="url(#og)" stroke-width="1.1" opacity="0.45" transform="rotate(120 400 400)"/>
      </svg>
    </div>
    <div class="core">
      <svg class="heart-svg" viewBox="0 0 400 400" aria-hidden="true">
        <defs>
          <radialGradient id="hg" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0%" stop-color="#F4D06F" stop-opacity="0.9"/>
            <stop offset="55%" stop-color="#D4AF37" stop-opacity="0.4"/>
            <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
          </radialGradient>
          <linearGradient id="hg2" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.1"/>
            <stop offset="50%" stop-color="#F4E4BC" stop-opacity="1"/>
            <stop offset="100%" stop-color="#D4AF37" stop-opacity="0.1"/>
          </linearGradient>
        </defs>
        <circle cx="200" cy="200" r="110" fill="url(#hg)"/>
        <path d="M 50 200 L 110 200 L 125 174 L 145 230 L 165 140 L 185 200 L 220 200 L 240 188 L 260 200 L 350 200"
              fill="none" stroke="url(#hg2)" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
    </div>
  </div>

  <h1 class="title"><span class="italic">RESONATE.</span></h1>
  <div class="tagline">Music that breathes with you.</div>

  <div class="pay-chip">LIFETIME <span class="num">AU$30</span> · ONE PAYMENT</div>

  <div class="urlfoot">RHYTHMIXAPP.COM.AU / RESONATE</div>
</div>
</body>
</html>
