<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FREQUENCY DREAMS · hook tease (3s)</title>
<meta name="viewport" content="width=1080, initial-scale=1">
<script>
  // Frame-driven progress. ?frame=NN  (NN = 0..89)
  // Sets --t (0..1 across whole clip), plus --seg1, --seg2, --seg3 (0..1 inside each 30-frame band).
  (function () {
    var p = new URLSearchParams(location.search);
    var raw = p.get('frame');
    var f = raw === null ? 0 : Math.max(0, Math.min(89, parseInt(raw, 10) || 0));
    var t = f / 89;
    function clamp01(x){ return Math.max(0, Math.min(1, x)); }
    var seg1 = clamp01(f / 30);
    var seg2 = clamp01((f - 30) / 30);
    var seg3 = clamp01((f - 60) / 29);
    var r = document.documentElement;
    r.style.setProperty('--t', t.toFixed(5));
    r.style.setProperty('--seg1', seg1.toFixed(5));
    r.style.setProperty('--seg2', seg2.toFixed(5));
    r.style.setProperty('--seg3', seg3.toFixed(5));
    r.style.setProperty('--frame', String(f));
  })();
</script>
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
  :root {
    --noir:#050816; --noir-2:#0A0F1F; --noir-3:#111729;
    --indigo:#1B2042; --indigo-2:#262C5E; --indigo-soft:#4A4F8A;
    --gold:#D4AF37; --gold-bright:#F4D06F; --gold-dim:rgba(212,175,55,0.55);
    --pewter:#8A8FA6; --pewter-soft:#B3B7C9; --pewter-dim:#5B607A;
    --text:#E8E6D9; --text-2:#9CA0B8; --text-3:#5B607A;
    --veil: linear-gradient(135deg, #D4AF37 0%, #B3B7C9 50%, #D4AF37 100%);
    --t:0; --seg1:0; --seg2:0; --seg3:0;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; padding:0; background:var(--noir); }
  body {
    font-family:'Inter', -apple-system, sans-serif; color:var(--text);
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  .frame {
    position:relative;width:1080px;height:1920px;overflow:hidden;background:var(--noir);
  }
  .halo-top, .halo-bottom { position:absolute; inset:0; pointer-events:none; }
  .halo-top {
    background: radial-gradient(1400px 700px at 50% -120px, rgba(212,175,55,0.10), transparent 70%);
  }
  .halo-bottom {
    background: radial-gradient(1400px 800px at 50% 110%, rgba(38,44,94,0.50), transparent 70%);
  }
  .stage {
    position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:0 80px;
  }
  .visual {
    position:relative;width:720px;height:720px;
    margin-bottom:60px;display:flex;align-items:center;justify-content:center;
  }
  /* tiny gold dot — seg1 grow → seg2 fade as moon resolves */
  .dot {
    position:absolute;width:36px;height:36px;border-radius:50%;
    background:radial-gradient(circle, #F4D06F 0%, #D4AF37 55%, rgba(212,175,55,0) 100%);
    transform: scale(calc(0.3 + var(--seg1) * 1.5));
    opacity: calc(var(--seg1) * (1 - var(--seg2)));
    box-shadow:
      0 0 calc(40px + var(--seg1) * 90px) rgba(212,175,55, calc(0.6 + var(--seg1) * 0.4)),
      0 0 calc(120px + var(--seg1) * 180px) rgba(212,175,55, calc(0.20 + var(--seg1) * 0.30));
    will-change:transform, opacity;
  }
  /* moon — emerges in seg2, glows in seg3 */
  .moon-wrap {
    position:absolute;width:580px;height:580px;
    opacity: calc(var(--seg2));
    transform: scale(calc(0.30 + var(--seg2) * 0.70 + var(--seg3) * 0.05));
    will-change:opacity, transform;
    filter:
      drop-shadow(0 0 calc(20px + var(--seg3) * 50px) rgba(212,175,55, calc(0.35 + var(--seg3) * 0.45)))
      drop-shadow(0 0 calc(60px + var(--seg3) * 80px) rgba(74,79,138, calc(0.20 + var(--seg3) * 0.30)));
  }
  .moon-wrap svg { width:100%; height:100%; display:block; }

  .caption {
    font-family:'Cormorant Garamond', Georgia, serif; font-weight:500;
    font-size:88px; line-height:1.05; letter-spacing:-0.01em;
    color:var(--text); text-align:center;
    position:relative; height:120px; width:100%;
    display:flex; align-items:center; justify-content:center;
  }
  .caption .line {
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    will-change:opacity, transform;
  }
  .line-1 { opacity:calc(var(--seg1) * (1 - var(--seg2))); transform:translateY(calc((1 - var(--seg1)) * 24px)); }
  .line-2 { opacity:calc(var(--seg2) * (1 - var(--seg3))); transform:translateY(calc((1 - var(--seg2)) * 24px)); }
  .line-3 { opacity:calc(var(--seg3)); transform:translateY(calc((1 - var(--seg3)) * 24px)); }
  .em { font-style:italic; }
  .veil-text {
    background: var(--veil); -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent; color:transparent;
  }
  .footer {
    position:absolute;left:0;right:0;bottom:100px;
    display:flex;flex-direction:column;align-items:center;gap:22px;
    opacity:calc(0.35 + var(--seg3) * 0.65);
  }
  .family-foot {
    font-family:'Cormorant Garamond', serif; font-weight:500; font-size:22px;
    letter-spacing:0.32em; text-transform:uppercase; color:var(--pewter);
  }
  .wordmark {
    font-family:'Cormorant Garamond', serif; font-weight:600; font-size:64px;
    letter-spacing:0.04em; color:var(--text);
  }
  .url {
    font-family:'JetBrains Mono', monospace; text-transform:uppercase;
    letter-spacing:0.22em; font-size:22px; color:var(--text-3);
  }
  .eyebrow {
    position:absolute; top:120px; left:0; right:0; text-align:center;
    font-family:'JetBrains Mono', monospace; text-transform:uppercase;
    letter-spacing:0.28em; font-size:20px; color:var(--gold-dim);
    opacity:calc(0.45 + var(--seg3) * 0.45);
  }
</style>
</head>
<body>
  <div class="frame">
    <div class="halo-top"></div>
    <div class="halo-bottom"></div>

    <div class="eyebrow">FREQUENCY · NIGHT</div>

    <div class="stage">
      <div class="visual">
        <div class="dot"></div>
        <div class="moon-wrap" aria-hidden="true">
          <svg viewBox="0 0 200 200">
            <defs>
              <linearGradient id="hg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#D4AF37"/><stop offset="100%" stop-color="#F4D06F"/></linearGradient>
              <linearGradient id="hp" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#B3B7C9"/><stop offset="100%" stop-color="#5B607A"/></linearGradient>
              <radialGradient id="hc" cx="0.5" cy="0.5" r="0.5">
                <stop offset="0%" stop-color="#F4D06F" stop-opacity="0.30"/>
                <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
              </radialGradient>
            </defs>
            <circle cx="100" cy="100" r="60" fill="url(#hc)"/>
            <circle cx="100" cy="100" r="72" fill="none" stroke="url(#hg)" stroke-width="1.8" opacity="0.92"/>
            <path d="M 100 28 A 72 72 0 0 1 100 172" stroke="url(#hg)" stroke-width="2.4" fill="none" stroke-linecap="round" opacity="0.95"/>
            <path d="M 100 28 A 72 72 0 0 0 100 172" stroke="url(#hp)" stroke-width="1.2" fill="none" stroke-linecap="round" opacity="0.55"/>
            <circle cx="80" cy="78" r="1.6" fill="#F4D06F" opacity="0.9"/>
            <circle cx="118" cy="92" r="1.2" fill="#B3B7C9" opacity="0.8"/>
            <circle cx="92" cy="120" r="1.4" fill="#F4D06F" opacity="0.75"/>
            <circle cx="125" cy="130" r="1.0" fill="#B3B7C9" opacity="0.7"/>
            <circle cx="100" cy="100" r="4" fill="#F4D06F" opacity="0.95"/>
          </svg>
        </div>
      </div>

      <div class="caption">
        <div class="line line-1"><span class="em">A breath.</span></div>
        <div class="line line-2">One <span class="em">intention.</span></div>
        <div class="line line-3"><span class="em veil-text">Drift.</span></div>
      </div>
    </div>

    <div class="footer">
      <div class="family-foot">FREQUENCY</div>
      <div class="wordmark">DREAMS</div>
      <div class="url">RHYTHMIXAPP.COM.AU / DREAMS</div>
    </div>
  </div>
</body>
</html>
