<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FREQUENCY DREAMS · price tease (3s)</title>
<meta name="viewport" content="width=1080, initial-scale=1">
<script>
  (function () {
    var p = new URLSearchParams(location.search);
    var raw = p.get('frame');
    var f = raw === null ? 0 : Math.max(0, Math.min(89, parseInt(raw, 10) || 0));
    var t = f / 89;
    function clamp01(x){ return Math.max(0, Math.min(1, x)); }
    var seg1 = clamp01(f / 30);
    var seg2 = clamp01((f - 30) / 30);
    var seg3 = clamp01((f - 60) / 29);
    var r = document.documentElement;
    r.style.setProperty('--t', t.toFixed(5));
    r.style.setProperty('--seg1', seg1.toFixed(5));
    r.style.setProperty('--seg2', seg2.toFixed(5));
    r.style.setProperty('--seg3', seg3.toFixed(5));
    r.style.setProperty('--frame', String(f));
  })();
</script>
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
  :root {
    --noir:#050816; --noir-2:#0A0F1F; --noir-3:#111729;
    --indigo:#1B2042; --indigo-2:#262C5E; --indigo-soft:#4A4F8A;
    --gold:#D4AF37; --gold-bright:#F4D06F; --gold-dim:rgba(212,175,55,0.55);
    --pewter:#8A8FA6; --pewter-soft:#B3B7C9; --pewter-dim:#5B607A;
    --text:#E8E6D9; --text-2:#9CA0B8; --text-3:#5B607A;
    --veil: linear-gradient(135deg, #D4AF37 0%, #B3B7C9 50%, #D4AF37 100%);
    --t:0; --seg1:0; --seg2:0; --seg3:0;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; padding:0; background:var(--noir); }
  body { font-family:'Inter', -apple-system, sans-serif; color:var(--text); -webkit-font-smoothing:antialiased; }
  .frame {
    position:relative;width:1080px;height:1920px;overflow:hidden;
    background:
      radial-gradient(1400px 700px at 50% -120px, rgba(212,175,55,0.10), transparent 70%),
      radial-gradient(1400px 800px at 50% 110%, rgba(38,44,94,0.50), transparent 70%),
      var(--noir);
  }
  .stage {
    position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:0 80px;text-align:center;
  }
  /* SEG1: family + wordmark fade up */
  .family {
    font-family:'Cormorant Garamond', serif; font-weight:500; font-size:42px;
    letter-spacing:0.32em; text-transform:uppercase; color:var(--pewter);
    margin-bottom:32px;
    opacity: var(--seg1);
    transform: translateY(calc((1 - var(--seg1)) * 16px));
  }
  .wordmark {
    font-family:'Cormorant Garamond', serif; font-weight:600; font-size:260px;
    letter-spacing:0.04em; color:var(--text); line-height:0.95;
    margin-bottom:48px;
    opacity: calc(var(--seg1) * 0.6 + var(--seg2) * 0.4);
    transform: translateY(calc((1 - var(--seg1)) * 16px));
  }
  /* SEG2: price chip emerges */
  .price-chip {
    display:inline-flex;gap:18px;align-items:center;
    padding:24px 44px;border-radius:2px;
    background:rgba(10,15,31,0.6);border:1px solid color-mix(in srgb, var(--gold) 45%, var(--noir-3));
    font-family:'JetBrains Mono', monospace; font-size:32px;
    letter-spacing:0.20em; color:var(--text); text-transform:uppercase;
    margin-bottom:64px;
    opacity: var(--seg2);
    transform: translateY(calc((1 - var(--seg2)) * 24px));
  }
  .price-chip .n {
    font-family:'Cormorant Garamond', serif; font-style:italic; font-size:54px;
    color:var(--gold-bright); letter-spacing:0; text-transform:none;
  }
  .price-chip .sep { color:var(--text-3); }
  /* SEG3: final italic line */
  .tagline {
    font-family:'Cormorant Garamond', serif; font-style:italic; font-weight:500;
    font-size:68px; line-height:1.15;
    background:var(--veil);-webkit-background-clip:text;background-clip:text;color:transparent;
    opacity: var(--seg3);
    transform: translateY(calc((1 - var(--seg3)) * 18px));
  }
  .url {
    position:absolute;left:0;right:0;bottom:90px;text-align:center;
    font-family:'JetBrains Mono', monospace; text-transform:uppercase;
    letter-spacing:0.26em; font-size:22px; color:var(--text-3);
    opacity: calc(0.4 + var(--seg3) * 0.6);
  }
</style>
</head>
<body>
  <div class="frame">
    <div class="stage">
      <div class="family">FREQUENCY</div>
      <div class="wordmark">DREAMS</div>
      <div class="price-chip">LIFETIME <span class="n">AU$30</span><span class="sep">·</span>ONE PAYMENT</div>
      <div class="tagline">Begin tonight.</div>
    </div>
    <div class="url">RHYTHMIXAPP.COM.AU / DREAMS</div>
  </div>
</body>
</html>
