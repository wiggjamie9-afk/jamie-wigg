<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1080, initial-scale=1" />
<title>FREQUENCY DREAMS · What is DREAMS?</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
  :root{
    --noir:#050816; --noir-2:#0A0F1F; --noir-3:#111729;
    --indigo:#1B2042; --indigo-2:#262C5E; --indigo-soft:#4A4F8A;
    --gold:#D4AF37; --gold-bright:#F4D06F; --gold-dim:rgba(212,175,55,0.55);
    --pewter:#8A8FA6; --pewter-soft:#B3B7C9; --pewter-dim:#5B607A;
    --text:#E8E6D9; --text-2:#9CA0B8; --text-3:#5B607A;
    --veil:linear-gradient(135deg,#D4AF37 0%,#B3B7C9 50%,#D4AF37 100%);
    --font-display:'Cormorant Garamond',Georgia,serif;
    --font-ui:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    --font-mono:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{margin:0;background:#000;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:var(--font-ui);color:var(--text);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  .frame{
    position:relative;width:1080px;height:1080px;overflow:hidden;
    background:
      radial-gradient(1400px 700px at 50% -120px, rgba(212,175,55,0.10), transparent 70%),
      radial-gradient(1100px 600px at 50% 110%, rgba(38,44,94,0.40), transparent 70%),
      var(--noir);
    padding:104px 96px;
    display:flex;flex-direction:column;
  }
  .top{display:flex;align-items:center;justify-content:space-between}
  .eyebrow{
    font-family:var(--font-mono);font-size:13px;letter-spacing:0.30em;text-transform:uppercase;
    color:var(--text-3);
  }
  .mark{display:flex;align-items:center;gap:14px}
  .mark svg{width:30px;height:30px}
  .mark .word{font-family:var(--font-display);font-weight:600;font-size:18px;letter-spacing:0.10em;color:var(--text)}
  .mark .word em{font-style:italic;color:var(--gold);font-weight:500}
  .title{
    font-family:var(--font-display);font-weight:600;font-size:132px;line-height:0.98;letter-spacing:-0.02em;
    color:var(--text);margin-top:88px;
  }
  .title .italic{
    font-style:italic;font-weight:500;
    background:var(--veil);-webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .qmark{color:var(--text-3);font-weight:500;font-style:normal;background:none;-webkit-text-fill-color:initial}
  .lines{margin-top:104px;display:flex;flex-direction:column;gap:40px;max-width:780px}
  .line{
    display:flex;align-items:baseline;gap:32px;
    font-family:var(--font-display);font-weight:400;font-size:54px;line-height:1.18;color:var(--text);
  }
  .line .n{
    font-family:var(--font-mono);font-size:14px;letter-spacing:0.22em;color:var(--gold-dim);
    width:36px;flex-shrink:0;padding-top:18px;
  }
  .bottom{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:28px}
  .pay-chip{
    display:inline-flex;align-items:center;gap:12px;
    padding:11px 20px;border-radius:2px;
    background:rgba(10,15,31,0.6);border:1px solid color-mix(in srgb, var(--gold) 36%, var(--noir-3));
    font-family:var(--font-mono);font-size:11px;letter-spacing:0.22em;text-transform:uppercase;color:var(--text);
  }
  .pay-chip .num{color:var(--gold-bright);font-weight:700;letter-spacing:0;text-transform:none;font-size:14px}
  .pay-chip .sep{color:var(--text-3)}
  .url{font-family:var(--font-mono);font-size:11px;letter-spacing:0.26em;text-transform:uppercase;color:var(--text-3)}
</style>
</head>
<body>
  <div class="frame">
    <div class="top">
      <div class="mark">
        <svg viewBox="0 0 40 40" aria-hidden="true">
          <defs>
            <linearGradient id="dm" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#D4AF37"/><stop offset="100%" stop-color="#B3B7C9"/>
            </linearGradient>
          </defs>
          <circle cx="20" cy="20" r="13" fill="none" stroke="url(#dm)" stroke-width="1.2" opacity="0.85"/>
          <path d="M9 20 A11 11 0 0 1 31 20" stroke="#D4AF37" stroke-width="1.6" fill="none" stroke-linecap="round" opacity="0.9"/>
          <circle cx="20" cy="20" r="2" fill="#F4D06F" opacity="0.95"/>
        </svg>
        <span class="word">FREQUENCY <em>DREAMS</em></span>
      </div>
      <span class="eyebrow">A nightly ritual</span>
    </div>

    <h1 class="title">What is <span class="italic">DREAMS</span><span class="qmark">?</span></h1>

    <div class="lines">
      <div class="line"><span class="n">01</span><span>A bedtime soundscape, composed for you.</span></div>
      <div class="line"><span class="n">02</span><span>A breath voice, paced to fall.</span></div>
      <div class="line"><span class="n">03</span><span>A landscape to drift through.</span></div>
      <div class="line"><span class="n">04</span><span>A page for the morning.</span></div>
    </div>

    <div class="bottom">
      <div class="pay-chip"><span>Lifetime</span><span class="num">AU$30</span><span class="sep">·</span><span>One payment</span></div>
      <span class="url">RHYTHMIXAPP.COM.AU / DREAMS</span>
    </div>
  </div>
</body>
</html>
