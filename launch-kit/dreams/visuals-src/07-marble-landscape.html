<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1080, initial-scale=1" />
<title>FREQUENCY DREAMS · A landscape to drift through</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
  :root{
    --noir:#050816; --noir-2:#0A0F1F; --noir-3:#111729;
    --indigo:#1B2042; --indigo-2:#262C5E; --indigo-soft:#4A4F8A;
    --gold:#D4AF37; --gold-bright:#F4D06F; --gold-dim:rgba(212,175,55,0.55);
    --pewter:#8A8FA6; --pewter-soft:#B3B7C9; --pewter-dim:#5B607A;
    --text:#E8E6D9; --text-2:#9CA0B8; --text-3:#5B607A;
    --veil:linear-gradient(135deg,#D4AF37 0%,#B3B7C9 50%,#D4AF37 100%);
    --font-display:'Cormorant Garamond',Georgia,serif;
    --font-ui:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    --font-mono:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{margin:0;background:#000;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:var(--font-ui);color:var(--text);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  .frame{
    position:relative;width:1080px;height:1080px;overflow:hidden;
    background:
      /* horizon glow — gold lying low */
      radial-gradient(1600px 380px at 50% 78%, rgba(212,175,55,0.16), transparent 70%),
      /* low indigo bloom under the horizon */
      radial-gradient(1400px 800px at 50% 110%, rgba(38,44,94,0.55), transparent 75%),
      /* high diffuse halo */
      radial-gradient(900px 600px at 30% 8%, rgba(74,79,138,0.20), transparent 65%),
      var(--noir);
  }
  /* the SVG dreamscape fills the canvas */
  .scene{
    position:absolute;inset:0;
  }
  .scene svg{width:100%;height:100%;display:block}
  .top{
    position:absolute;top:64px;left:64px;right:64px;display:flex;align-items:center;justify-content:space-between;
    z-index:5;
  }
  .mark{display:flex;align-items:center;gap:12px}
  .mark svg{width:24px;height:24px}
  .mark .word{font-family:var(--font-display);font-weight:600;font-size:14px;letter-spacing:0.10em;color:var(--text)}
  .mark .word em{font-style:italic;color:var(--gold);font-weight:500}
  .eyebrow{font-family:var(--font-mono);font-size:10px;letter-spacing:0.30em;text-transform:uppercase;color:var(--text-3)}

  .caption{
    position:absolute;left:80px;right:80px;bottom:130px;z-index:5;
    display:flex;flex-direction:column;gap:16px;align-items:flex-start;
  }
  .caption .when{
    font-family:var(--font-mono);font-size:11px;letter-spacing:0.30em;text-transform:uppercase;color:var(--gold);
  }
  .caption .title{
    font-family:var(--font-display);font-weight:500;font-size:78px;line-height:1.0;letter-spacing:-0.015em;color:var(--text);max-width:14ch;
  }
  .caption .title em{
    font-style:italic;font-weight:500;
    background:var(--veil);-webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .caption .sub{
    font-family:var(--font-display);font-style:italic;font-weight:400;font-size:24px;line-height:1.4;color:var(--text-2);max-width:36ch;
  }
  .bottom{
    position:absolute;left:64px;right:64px;bottom:50px;display:flex;justify-content:space-between;align-items:center;
    font-family:var(--font-mono);font-size:11px;letter-spacing:0.26em;text-transform:uppercase;color:var(--text-3);z-index:5;
  }
</style>
</head>
<body>
  <div class="frame">
    <div class="scene">
      <svg viewBox="0 0 1080 1080" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <defs>
          <radialGradient id="haloG" cx="0.5" cy="0.78" r="0.5">
            <stop offset="0%" stop-color="#F4D06F" stop-opacity="0.30"/>
            <stop offset="40%" stop-color="#D4AF37" stop-opacity="0.08"/>
            <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
          </radialGradient>
          <radialGradient id="haloI" cx="0.5" cy="1.0" r="0.7">
            <stop offset="0%" stop-color="#4A4F8A" stop-opacity="0.35"/>
            <stop offset="60%" stop-color="#1B2042" stop-opacity="0.10"/>
            <stop offset="100%" stop-color="#1B2042" stop-opacity="0"/>
          </radialGradient>
          <linearGradient id="ridge" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#262C5E" stop-opacity="0.0"/>
            <stop offset="100%" stop-color="#1B2042" stop-opacity="0.55"/>
          </linearGradient>
          <linearGradient id="ridge2" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#111729" stop-opacity="0.0"/>
            <stop offset="100%" stop-color="#0A0F1F" stop-opacity="0.85"/>
          </linearGradient>
        </defs>

        <!-- Atmospheric halos -->
        <rect x="0" y="0" width="1080" height="1080" fill="url(#haloI)"/>
        <circle cx="540" cy="780" r="540" fill="url(#haloG)"/>

        <!-- Distant ridge (faint, far) -->
        <path d="M -40,720 Q 180,640 360,690 T 720,660 T 1120,680 L 1120,1100 L -40,1100 Z" fill="url(#ridge)" opacity="0.7"/>
        <!-- Middle ridge -->
        <path d="M -40,820 Q 220,740 440,790 T 800,770 T 1120,800 L 1120,1100 L -40,1100 Z" fill="url(#ridge)" opacity="0.85"/>
        <!-- Near ridge -->
        <path d="M -40,920 Q 280,860 540,910 T 880,890 T 1120,920 L 1120,1100 L -40,1100 Z" fill="url(#ridge2)"/>

        <!-- Splat field: scattered glowing points across the sky -->
        <!-- High sparse stars -->
        <circle cx="120" cy="160" r="1.6" fill="#F4D06F" opacity="0.85"/>
        <circle cx="220" cy="80" r="1.2" fill="#B3B7C9" opacity="0.7"/>
        <circle cx="320" cy="220" r="1.0" fill="#F4D06F" opacity="0.6"/>
        <circle cx="480" cy="120" r="1.4" fill="#F4D06F" opacity="0.8"/>
        <circle cx="620" cy="180" r="1.0" fill="#B3B7C9" opacity="0.7"/>
        <circle cx="780" cy="90" r="1.6" fill="#F4D06F" opacity="0.85"/>
        <circle cx="900" cy="240" r="1.2" fill="#B3B7C9" opacity="0.65"/>
        <circle cx="980" cy="140" r="1.0" fill="#F4D06F" opacity="0.7"/>
        <circle cx="1020" cy="320" r="0.9" fill="#B3B7C9" opacity="0.55"/>
        <circle cx="60" cy="320" r="1.2" fill="#F4D06F" opacity="0.7"/>
        <circle cx="180" cy="380" r="1.0" fill="#B3B7C9" opacity="0.6"/>
        <circle cx="380" cy="350" r="1.4" fill="#F4D06F" opacity="0.85"/>
        <circle cx="560" cy="280" r="0.9" fill="#B3B7C9" opacity="0.55"/>
        <circle cx="700" cy="380" r="1.2" fill="#F4D06F" opacity="0.7"/>
        <circle cx="840" cy="420" r="1.0" fill="#B3B7C9" opacity="0.6"/>

        <!-- Mid altitude — denser, larger -->
        <circle cx="240" cy="500" r="2.2" fill="#F4D06F" opacity="0.85"/>
        <circle cx="360" cy="470" r="1.6" fill="#F4D06F" opacity="0.7"/>
        <circle cx="480" cy="440" r="1.4" fill="#B3B7C9" opacity="0.6"/>
        <circle cx="600" cy="500" r="2.0" fill="#F4D06F" opacity="0.9"/>
        <circle cx="720" cy="520" r="1.6" fill="#B3B7C9" opacity="0.7"/>
        <circle cx="860" cy="480" r="2.2" fill="#F4D06F" opacity="0.85"/>
        <circle cx="140" cy="550" r="1.4" fill="#B3B7C9" opacity="0.5"/>
        <circle cx="940" cy="540" r="1.4" fill="#F4D06F" opacity="0.65"/>

        <!-- Near horizon — large, warm, with glow -->
        <circle cx="180" cy="640" r="2.6" fill="#F4D06F" opacity="0.9" filter="url(#noop)"/>
        <circle cx="180" cy="640" r="10" fill="#F4D06F" opacity="0.10"/>
        <circle cx="320" cy="610" r="2.0" fill="#F4D06F" opacity="0.85"/>
        <circle cx="320" cy="610" r="8" fill="#D4AF37" opacity="0.08"/>
        <circle cx="500" cy="640" r="3.0" fill="#F4D06F" opacity="0.95"/>
        <circle cx="500" cy="640" r="14" fill="#F4D06F" opacity="0.12"/>
        <circle cx="660" cy="620" r="2.2" fill="#F4D06F" opacity="0.85"/>
        <circle cx="660" cy="620" r="10" fill="#D4AF37" opacity="0.10"/>
        <circle cx="820" cy="650" r="2.6" fill="#F4D06F" opacity="0.9"/>
        <circle cx="820" cy="650" r="12" fill="#F4D06F" opacity="0.10"/>
        <circle cx="960" cy="630" r="1.8" fill="#B3B7C9" opacity="0.75"/>

        <!-- Foreground hush — pewter mist points -->
        <circle cx="80" cy="780" r="1.4" fill="#B3B7C9" opacity="0.45"/>
        <circle cx="220" cy="820" r="1.0" fill="#B3B7C9" opacity="0.35"/>
        <circle cx="400" cy="800" r="1.2" fill="#B3B7C9" opacity="0.4"/>
        <circle cx="580" cy="830" r="1.6" fill="#B3B7C9" opacity="0.45"/>
        <circle cx="760" cy="810" r="1.2" fill="#B3B7C9" opacity="0.4"/>
        <circle cx="900" cy="840" r="1.4" fill="#B3B7C9" opacity="0.45"/>
        <circle cx="1020" cy="820" r="1.0" fill="#B3B7C9" opacity="0.3"/>

        <!-- A single warm focal lamp on the near ridge -->
        <circle cx="540" cy="900" r="3.6" fill="#F4D06F" opacity="0.95"/>
        <circle cx="540" cy="900" r="18" fill="#F4D06F" opacity="0.12"/>
        <circle cx="540" cy="900" r="56" fill="#D4AF37" opacity="0.05"/>
      </svg>
    </div>

    <div class="top">
      <div class="mark">
        <svg viewBox="0 0 40 40" aria-hidden="true">
          <defs>
            <linearGradient id="dm" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#D4AF37"/><stop offset="100%" stop-color="#B3B7C9"/>
            </linearGradient>
          </defs>
          <circle cx="20" cy="20" r="13" fill="none" stroke="url(#dm)" stroke-width="1.2" opacity="0.85"/>
          <path d="M9 20 A11 11 0 0 1 31 20" stroke="#D4AF37" stroke-width="1.6" fill="none" stroke-linecap="round" opacity="0.9"/>
          <circle cx="20" cy="20" r="2" fill="#F4D06F" opacity="0.95"/>
        </svg>
        <span class="word">FREQUENCY <em>DREAMS</em></span>
      </div>
      <span class="eyebrow">Tonight's landscape</span>
    </div>

    <div class="caption">
      <span class="when">10:54 PM · DRIFT</span>
      <span class="title">A landscape <em>to drift</em> through.</span>
      <span class="sub">Marble renders a Gaussian-splat 3D world from your intention. Spark displays it on your phone. The camera never cuts.</span>
    </div>

    <div class="bottom">
      <span>ON-DEVICE · NO CLOUD</span>
      <span>RHYTHMIXAPP.COM.AU / DREAMS</span>
    </div>
  </div>
</body>
</html>
