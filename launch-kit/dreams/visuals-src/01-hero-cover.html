<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1280, initial-scale=1" />
<title>FREQUENCY DREAMS · Hero cover</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
  :root {
    --noir:#050816; --noir-2:#0A0F1F; --noir-3:#111729;
    --indigo:#1B2042; --indigo-2:#262C5E; --indigo-soft:#4A4F8A;
    --gold:#D4AF37; --gold-bright:#F4D06F; --gold-dim:rgba(212,175,55,0.55);
    --pewter:#8A8FA6; --pewter-soft:#B3B7C9; --pewter-dim:#5B607A;
    --text:#E8E6D9; --text-2:#9CA0B8; --text-3:#5B607A;
    --veil:linear-gradient(135deg,#D4AF37 0%,#B3B7C9 50%,#D4AF37 100%);
    --font-display:'Cormorant Garamond',Georgia,serif;
    --font-ui:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    --font-mono:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{margin:0;background:#000;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:var(--font-ui);color:var(--text);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  .frame{
    position:relative;width:1280px;height:720px;overflow:hidden;
    background:
      radial-gradient(1400px 700px at 50% -120px, rgba(212,175,55,0.10), transparent 70%),
      radial-gradient(1100px 600px at 50% 110%, rgba(38,44,94,0.40), transparent 70%),
      var(--noir);
  }
  /* extra: a third deep-indigo right-side bloom (the dream half) */
  .frame::before{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(700px 700px at 80% 50%, rgba(74,79,138,0.18), transparent 60%);
  }
  .grid{
    position:absolute;inset:0;display:grid;grid-template-columns: 1.05fr 0.95fr;align-items:center;
    padding:72px 96px;gap:48px;z-index:1;
  }
  .left{display:flex;flex-direction:column;gap:30px;max-width:620px;z-index:2}
  .eyebrow{
    font-family:var(--font-mono);font-size:11px;letter-spacing:0.32em;text-transform:uppercase;
    color:var(--gold-dim);display:inline-flex;align-items:center;gap:14px;
  }
  .eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--gold);box-shadow:0 0 14px var(--gold)}
  .family{
    font-family:var(--font-display);font-weight:500;font-size:18px;letter-spacing:0.32em;
    text-transform:uppercase;color:var(--pewter);
  }
  .title{
    font-family:var(--font-display);font-weight:600;font-size:128px;line-height:0.94;letter-spacing:-0.02em;
    color:var(--text);
  }
  .title .italic{
    font-style:italic;font-weight:500;
    background:var(--veil);-webkit-background-clip:text;background-clip:text;color:transparent;
    display:block;margin-top:8px;
  }
  .tag{
    color:var(--text-2);font-size:21px;line-height:1.55;font-weight:300;max-width:34ch;font-family:var(--font-display);font-style:italic;
  }
  .row{display:flex;align-items:center;gap:20px;margin-top:8px}
  .pay-chip{
    display:inline-flex;align-items:center;gap:12px;
    padding:11px 20px;border-radius:2px;
    background:rgba(10,15,31,0.6);border:1px solid color-mix(in srgb, var(--gold) 36%, var(--noir-3));
    font-family:var(--font-mono);font-size:11px;letter-spacing:0.22em;text-transform:uppercase;color:var(--text);
  }
  .pay-chip .num{color:var(--gold-bright);font-weight:700;letter-spacing:0;text-transform:none;font-size:14px}
  .pay-chip .sep{color:var(--text-3)}
  .right{position:relative;display:flex;align-items:center;justify-content:center;height:100%}
  .moon{
    width:480px;height:480px;border-radius:50%;
    position:relative;display:flex;align-items:center;justify-content:center;
    background:
      radial-gradient(circle at 38% 38%, rgba(244,208,111,0.10), transparent 50%),
      radial-gradient(circle at 50% 50%, rgba(74,79,138,0.22), rgba(27,32,66,0.05) 55%, transparent 70%);
    box-shadow:0 0 100px rgba(74,79,138,0.40), inset 0 0 100px rgba(212,175,55,0.04);
  }
  .moon svg{width:100%;height:100%;display:block;position:relative;z-index:2}
  .ring{
    position:absolute;border-radius:50%;border:1px solid var(--indigo);
  }
  .ring.r1{inset:-14px;border-color:rgba(212,175,55,0.16)}
  .ring.r2{inset:-46px;border-color:rgba(138,143,166,0.08)}
  .ring.r3{inset:-92px;border-color:rgba(138,143,166,0.04)}
  /* glow points scattered around the moon — Marble landscape suggestion */
  .star{position:absolute;width:3px;height:3px;border-radius:50%;background:#F4D06F;box-shadow:0 0 8px rgba(244,208,111,0.7)}
  .star.s1{top:12%;left:8%;opacity:0.7}
  .star.s2{top:22%;right:14%;opacity:0.5}
  .star.s3{bottom:18%;left:18%;opacity:0.6;width:2px;height:2px}
  .star.s4{bottom:26%;right:8%;opacity:0.45}
  .star.s5{top:48%;left:2%;opacity:0.4;width:2px;height:2px}
  .star.s6{top:58%;right:0%;opacity:0.5;width:2px;height:2px}
  .footer{
    position:absolute;left:96px;right:96px;bottom:48px;
    display:flex;justify-content:space-between;align-items:center;
    font-family:var(--font-mono);font-size:10px;letter-spacing:0.28em;text-transform:uppercase;color:var(--text-3);
    z-index:2;
  }
  .footer .mark{display:flex;align-items:center;gap:12px}
  .footer .mark svg{width:20px;height:20px}
  .footer .mark .w{font-family:var(--font-display);font-weight:600;font-size:14px;letter-spacing:0.12em;color:var(--text);text-transform:none}
  .footer .mark .w em{font-style:italic;color:var(--gold);font-weight:500}
</style>
</head>
<body>
  <div class="frame">
    <span class="star s1"></span><span class="star s2"></span><span class="star s3"></span>
    <span class="star s4"></span><span class="star s5"></span><span class="star s6"></span>
    <div class="grid">
      <div class="left">
        <span class="eyebrow"><span class="dot"></span>RHYTHMIX FREQUENCY · NIGHT</span>
        <span class="family">FREQUENCY</span>
        <h1 class="title">DREAMS.<span class="italic">Compose your night.</span></h1>
        <p class="tag">A nightly ritual app. Soundscape, breath, and a dream landscape — kept on your phone.</p>
        <div class="row">
          <div class="pay-chip"><span>Lifetime</span><span class="num">AU$30</span><span class="sep">·</span><span>One payment</span></div>
        </div>
      </div>
      <div class="right">
        <div class="moon">
          <span class="ring r1"></span><span class="ring r2"></span><span class="ring r3"></span>
          <svg viewBox="0 0 200 200" aria-hidden="true">
            <defs>
              <linearGradient id="covG" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#D4AF37"/><stop offset="100%" stop-color="#F4D06F"/>
              </linearGradient>
              <linearGradient id="covP" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#B3B7C9"/><stop offset="100%" stop-color="#5B607A"/>
              </linearGradient>
              <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
                <stop offset="0%" stop-color="#F4D06F" stop-opacity="0.30"/>
                <stop offset="60%" stop-color="#D4AF37" stop-opacity="0.05"/>
                <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
              </radialGradient>
            </defs>
            <circle cx="100" cy="100" r="60" fill="url(#core)"/>
            <!-- the closed orb -->
            <circle cx="100" cy="100" r="72" fill="none" stroke="url(#covG)" stroke-width="1.6" opacity="0.90"/>
            <!-- crescent: the night-half -->
            <path d="M 100 28 A 72 72 0 0 1 100 172" stroke="url(#covG)" stroke-width="2.1" fill="none" stroke-linecap="round" opacity="0.95"/>
            <!-- soft pewter arc, opposite side -->
            <path d="M 100 28 A 72 72 0 0 0 100 172" stroke="url(#covP)" stroke-width="1.1" fill="none" stroke-linecap="round" opacity="0.55"/>
            <!-- splat points scattered inside (Marble suggestion) -->
            <circle cx="80" cy="78" r="1.2" fill="#F4D06F" opacity="0.9"/>
            <circle cx="118" cy="92" r="0.9" fill="#B3B7C9" opacity="0.8"/>
            <circle cx="92" cy="120" r="1.1" fill="#F4D06F" opacity="0.75"/>
            <circle cx="125" cy="130" r="0.8" fill="#B3B7C9" opacity="0.7"/>
            <circle cx="74" cy="112" r="0.7" fill="#F4D06F" opacity="0.6"/>
            <circle cx="108" cy="68" r="0.7" fill="#B3B7C9" opacity="0.55"/>
            <!-- centre kernel -->
            <circle cx="100" cy="100" r="3" fill="#F4D06F" opacity="0.95"/>
          </svg>
        </div>
      </div>
    </div>
    <div class="footer">
      <div class="mark">
        <svg viewBox="0 0 40 40" aria-hidden="true">
          <defs>
            <linearGradient id="fm" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#D4AF37"/><stop offset="100%" stop-color="#B3B7C9"/>
            </linearGradient>
          </defs>
          <circle cx="20" cy="20" r="13" fill="none" stroke="url(#fm)" stroke-width="1.2" opacity="0.85"/>
          <path d="M9 20 A11 11 0 0 1 31 20" stroke="#D4AF37" stroke-width="1.6" fill="none" stroke-linecap="round" opacity="0.9"/>
          <circle cx="20" cy="20" r="2" fill="#F4D06F" opacity="0.95"/>
        </svg>
        <span class="w">FREQUENCY <em>DREAMS</em></span>
      </div>
      <span>RHYTHMIXAPP.COM.AU / DREAMS</span>
      <span>ON-DEVICE · NIGHTLY</span>
    </div>
  </div>
</body>
</html>
