<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, initial-scale=1">
<title>FREQUENCY DREAMS — The Ritual (30s)</title>
<script>
  // Frame-driven timeline. ?frame=N where N = 0..899 (30fps × 30s = 900 frames).
  // Sets --s1..--s5 (each scene a 0..1 envelope) with 0.8s crossfades.
  (function () {
    var p = new URLSearchParams(location.search);
    var raw = p.get('frame');
    var f = raw === null ? 0 : Math.max(0, Math.min(899, parseInt(raw, 10) || 0));
    var t = f / 899;
    function ramp(x, a, b) { return Math.max(0, Math.min(1, (x - a) / (b - a))); }
    function seg(idx) {
      var start = idx * 180;
      var end = (idx + 1) * 180;
      var fadeIn = 24;
      var fadeOut = 24;
      return ramp(f, start - fadeIn, start + fadeIn) * (1 - ramp(f, end - fadeOut, end + fadeOut));
    }
    var r = document.documentElement;
    r.style.setProperty('--t', t.toFixed(5));
    r.style.setProperty('--s1', seg(0).toFixed(4));
    r.style.setProperty('--s2', seg(1).toFixed(4));
    r.style.setProperty('--s3', seg(2).toFixed(4));
    r.style.setProperty('--s4', seg(3).toFixed(4));
    r.style.setProperty('--s5', seg(4).toFixed(4));
    r.style.setProperty('--frame', String(f));
  })();
</script>
<link rel="stylesheet" href="../../fonts/fonts.css">
<style>
  :root {
    --noir:#050816; --noir-2:#0A0F1F; --noir-3:#111729;
    --indigo:#1B2042; --indigo-2:#262C5E; --indigo-soft:#4A4F8A;
    --gold:#D4AF37; --gold-bright:#F4D06F; --gold-dim:rgba(212,175,55,0.55);
    --pewter:#8A8FA6; --pewter-soft:#B3B7C9; --pewter-dim:#5B607A;
    --text:#E8E6D9; --text-2:#9CA0B8; --text-3:#5B607A;
    --veil:linear-gradient(135deg,#D4AF37 0%,#B3B7C9 50%,#D4AF37 100%);
    --t:0; --s1:0; --s2:0; --s3:0; --s4:0; --s5:0;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; min-height:100vh; background:#000; }
  body { display:flex; align-items:center; justify-content:center; font-family:'Inter', system-ui, sans-serif; color:var(--text); }
  .frame {
    width:1080px; height:1920px; position:relative; overflow:hidden;
    background:
      radial-gradient(1400px 700px at 50% -120px, rgba(212,175,55,0.10), transparent 70%),
      radial-gradient(1400px 800px at 50% 110%, rgba(38,44,94,0.50), transparent 70%),
      var(--noir);
  }
  .scene {
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding: 200px 80px; text-align:center;
  }
  .s1 { opacity: var(--s1); }
  .s2 { opacity: var(--s2); }
  .s3 { opacity: var(--s3); }
  .s4 { opacity: var(--s4); }
  .s5 { opacity: var(--s5); }
  .layer-num {
    font-family:'Cormorant Garamond', serif; font-weight:500; font-style:italic;
    font-size:240px; line-height:0.85; color:var(--gold); letter-spacing:-0.04em;
    margin-bottom:60px;
  }
  .layer-name {
    font-family:'Cormorant Garamond', serif; font-weight:500; font-style:italic;
    font-size:96px; line-height:1.0; color:var(--text); margin-bottom:48px;
  }
  .layer-desc {
    font-family:'Inter', sans-serif; font-weight:300; font-size:40px; line-height:1.5;
    color:var(--text-2); max-width:18ch;
  }
  .layer-desc em {
    font-style:normal; font-weight:400;
    background:var(--veil); -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .eyebrow {
    font-family:'JetBrains Mono', monospace; font-size:26px; letter-spacing:0.30em;
    text-transform:uppercase; color:var(--gold-dim); margin-bottom: 64px;
  }
  .glyph {
    width:240px; height:240px; margin-bottom: 40px; display:flex; align-items:center; justify-content:center;
  }
  .glyph svg { width:100%; height:100%; }
  .endcard {
    display:flex; flex-direction:column; align-items:center; gap:32px;
  }
  .endcard .family-label {
    font-family:'Cormorant Garamond', serif; font-weight:500; font-size:32px;
    letter-spacing:0.32em; text-transform:uppercase; color:var(--pewter);
  }
  .endcard .wordmark {
    font-family:'Cormorant Garamond', serif; font-weight:600; font-size:160px;
    letter-spacing:0.04em; color:var(--text);
  }
  .endcard .sub {
    font-family:'Cormorant Garamond', serif; font-style:italic; font-weight:500;
    font-size:48px; line-height:1.0;
    background:var(--veil); -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .endcard .price-chip {
    margin-top:16px; padding:16px 32px; border-radius:2px;
    background:rgba(10,15,31,0.6); border:1px solid color-mix(in srgb, var(--gold) 40%, var(--noir-3));
    font-family:'JetBrains Mono', monospace; font-size:22px; letter-spacing:0.22em; text-transform:uppercase; color:var(--text);
    display:inline-flex; gap:14px; align-items:center;
  }
  .endcard .price-chip .n { font-family:'Cormorant Garamond', serif; font-style:italic; font-size:32px; color:var(--gold-bright); letter-spacing:0; text-transform:none; }
  .urlfoot {
    position:absolute; left:0; right:0; bottom:90px; text-align:center;
    font-family:'JetBrains Mono', monospace; font-size:22px; letter-spacing:0.26em;
    text-transform:uppercase; color:var(--text-3);
  }
</style>
</head>
<body>
<div class="frame">

  <!-- SCENE 1 (0–6s) — Layer 01: Sound -->
  <div class="scene s1">
    <div class="eyebrow">LAYER 01</div>
    <div class="glyph">
      <svg viewBox="0 0 240 240" aria-hidden="true">
        <defs>
          <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.2"/>
            <stop offset="50%" stop-color="#F4D06F"/>
            <stop offset="100%" stop-color="#D4AF37" stop-opacity="0.2"/>
          </linearGradient>
        </defs>
        <path d="M10,120 Q40,40 70,120 T130,120 T190,120 T240,120" stroke="url(#g1)" stroke-width="2.4" fill="none"/>
        <path d="M10,120 Q40,200 70,120 T130,120 T190,120 T240,120" stroke="#B3B7C9" stroke-width="1.4" fill="none" opacity="0.5"/>
      </svg>
    </div>
    <div class="layer-num">01</div>
    <div class="layer-name">Sound.</div>
    <div class="layer-desc">A <em>soundscape</em>, composed for tonight.</div>
  </div>

  <!-- SCENE 2 (6–12s) — Layer 02: Breath -->
  <div class="scene s2">
    <div class="eyebrow">LAYER 02</div>
    <div class="glyph">
      <svg viewBox="0 0 240 240" aria-hidden="true">
        <defs>
          <radialGradient id="g2" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0%" stop-color="#F4D06F" stop-opacity="0.35"/>
            <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
          </radialGradient>
        </defs>
        <circle cx="120" cy="120" r="100" fill="none" stroke="rgba(212,175,55,0.20)" stroke-width="1"/>
        <circle cx="120" cy="120" r="70" fill="url(#g2)" stroke="rgba(212,175,55,0.55)" stroke-width="1.6"/>
        <circle cx="120" cy="120" r="36" fill="none" stroke="#F4D06F" stroke-width="1.8" opacity="0.85"/>
      </svg>
    </div>
    <div class="layer-num">02</div>
    <div class="layer-name">Breath.</div>
    <div class="layer-desc">A voice, paced for <em>the fall</em>.</div>
  </div>

  <!-- SCENE 3 (12–18s) — Layer 03: Landscape -->
  <div class="scene s3">
    <div class="eyebrow">LAYER 03</div>
    <div class="glyph">
      <svg viewBox="0 0 240 240" aria-hidden="true">
        <defs>
          <linearGradient id="g3" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#262C5E" stop-opacity="0"/>
            <stop offset="100%" stop-color="#1B2042" stop-opacity="0.8"/>
          </linearGradient>
        </defs>
        <path d="M0,140 Q60,100 120,130 T240,120 L240,240 L0,240 Z" fill="url(#g3)"/>
        <path d="M0,180 Q80,150 160,170 T240,180 L240,240 L0,240 Z" fill="#0A0F1F"/>
        <circle cx="40" cy="60" r="1.4" fill="#F4D06F" opacity="0.85"/>
        <circle cx="80" cy="40" r="1.0" fill="#B3B7C9" opacity="0.7"/>
        <circle cx="120" cy="70" r="1.2" fill="#F4D06F" opacity="0.75"/>
        <circle cx="170" cy="50" r="1.4" fill="#F4D06F" opacity="0.85"/>
        <circle cx="210" cy="80" r="1.0" fill="#B3B7C9" opacity="0.65"/>
        <circle cx="120" cy="190" r="3" fill="#F4D06F" opacity="0.95"/>
        <circle cx="120" cy="190" r="14" fill="#F4D06F" opacity="0.12"/>
      </svg>
    </div>
    <div class="layer-num">03</div>
    <div class="layer-name">Landscape.</div>
    <div class="layer-desc">A place <em>to drift</em> through.</div>
  </div>

  <!-- SCENE 4 (18–24s) — Layer 04: Recall -->
  <div class="scene s4">
    <div class="eyebrow">LAYER 04</div>
    <div class="glyph">
      <svg viewBox="0 0 240 240" aria-hidden="true">
        <rect x="40" y="40" width="160" height="160" rx="2" fill="rgba(212,175,55,0.06)" stroke="rgba(212,175,55,0.45)" stroke-width="1.4"/>
        <line x1="60" y1="84" x2="180" y2="84" stroke="#D4AF37" stroke-width="1.2" opacity="0.7"/>
        <line x1="60" y1="116" x2="160" y2="116" stroke="#B3B7C9" stroke-width="1" opacity="0.55"/>
        <line x1="60" y1="148" x2="172" y2="148" stroke="#B3B7C9" stroke-width="1" opacity="0.55"/>
        <line x1="60" y1="180" x2="140" y2="180" stroke="#B3B7C9" stroke-width="1" opacity="0.45"/>
        <circle cx="200" cy="40" r="6" fill="#F4D06F" opacity="0.85"/>
      </svg>
    </div>
    <div class="layer-num">04</div>
    <div class="layer-name">Recall.</div>
    <div class="layer-desc">A page for <em>the morning</em>.</div>
  </div>

  <!-- SCENE 5 (24–30s) End card -->
  <div class="scene s5">
    <div class="endcard">
      <div class="family-label">FREQUENCY</div>
      <div class="wordmark">DREAMS</div>
      <div class="sub">A ritual, in four layers.</div>
      <div class="price-chip">LIFETIME <span class="n">AU$30</span> · ONE PAYMENT</div>
    </div>
  </div>

  <div class="urlfoot">RHYTHMIXAPP.COM.AU / DREAMS</div>
</div>
</body>
</html>
