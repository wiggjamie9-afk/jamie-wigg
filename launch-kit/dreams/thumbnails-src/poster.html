<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080, initial-scale=1">
<title>FREQUENCY DREAMS — Poster</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
  :root{
    --noir:#050816; --noir-2:#0A0F1F; --noir-3:#111729;
    --indigo:#1B2042; --indigo-2:#262C5E; --indigo-soft:#4A4F8A;
    --gold:#D4AF37; --gold-bright:#F4D06F; --gold-dim:rgba(212,175,55,0.55);
    --pewter:#8A8FA6; --pewter-soft:#B3B7C9; --pewter-dim:#5B607A;
    --text:#E8E6D9; --text-2:#9CA0B8; --text-3:#5B607A;
    --veil:linear-gradient(135deg,#D4AF37 0%,#B3B7C9 50%,#D4AF37 100%);
    --font-display:'Cormorant Garamond',Georgia,serif;
    --font-ui:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    --font-mono:'JetBrains Mono',monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;min-height:100vh;background:#000}
  body{display:flex;align-items:center;justify-content:center;font-family:var(--font-ui);color:var(--text)}
  .frame{
    width:1080px;height:1920px;position:relative;overflow:hidden;
    background:
      radial-gradient(1400px 700px at 50% -120px, rgba(212,175,55,0.10), transparent 70%),
      radial-gradient(1400px 900px at 50% 110%, rgba(38,44,94,0.55), transparent 70%),
      var(--noir);
  }
  .moon-wrap{
    position:absolute;top:170px;left:50%;transform:translateX(-50%);
    width:620px;height:620px;display:flex;align-items:center;justify-content:center;
  }
  .moon{
    width:520px;height:520px;border-radius:50%;
    position:relative;display:flex;align-items:center;justify-content:center;
    background:
      radial-gradient(circle at 38% 38%, rgba(244,208,111,0.10), transparent 50%),
      radial-gradient(circle at 50% 50%, rgba(74,79,138,0.30), rgba(27,32,66,0.05) 55%, transparent 70%);
    box-shadow:0 0 120px rgba(74,79,138,0.45), inset 0 0 100px rgba(212,175,55,0.04);
  }
  .moon svg{width:100%;height:100%;display:block}
  .ring{position:absolute;border-radius:50%;border:1px solid var(--indigo)}
  .ring.r1{inset:-18px;border-color:rgba(212,175,55,0.18)}
  .ring.r2{inset:-58px;border-color:rgba(138,143,166,0.08)}
  .ring.r3{inset:-110px;border-color:rgba(138,143,166,0.04)}
  .star{position:absolute;width:3px;height:3px;border-radius:50%;background:#F4D06F;box-shadow:0 0 8px rgba(244,208,111,0.7)}
  .star.s1{top:8%;left:12%;opacity:0.7}
  .star.s2{top:14%;right:8%;opacity:0.6}
  .star.s3{top:34%;left:6%;opacity:0.5;width:2px;height:2px}
  .star.s4{top:42%;right:4%;opacity:0.55}
  .star.s5{bottom:46%;left:8%;opacity:0.45;width:2px;height:2px}
  .star.s6{bottom:40%;right:10%;opacity:0.5}
  .star.s7{bottom:14%;left:18%;opacity:0.5;width:2px;height:2px}
  .star.s8{bottom:10%;right:14%;opacity:0.4}

  .body{
    position:absolute;left:80px;right:80px;top:880px;
    display:flex;flex-direction:column;align-items:center;text-align:center;gap:36px;
  }
  .eyebrow{font-family:var(--font-mono);font-size:18px;letter-spacing:0.32em;text-transform:uppercase;color:var(--gold-dim)}
  .family{
    font-family:var(--font-display);font-weight:500;font-size:24px;letter-spacing:0.32em;
    text-transform:uppercase;color:var(--pewter);
  }
  .title{
    font-family:var(--font-display);font-weight:600;font-size:200px;line-height:0.92;letter-spacing:-0.02em;color:var(--text);
  }
  .sub{
    font-family:var(--font-display);font-style:italic;font-weight:500;font-size:68px;line-height:1.05;letter-spacing:-0.01em;
    background:var(--veil);-webkit-background-clip:text;background-clip:text;color:transparent;
    max-width:18ch;
  }
  .tag{
    font-family:var(--font-display);font-style:italic;font-weight:400;font-size:32px;line-height:1.4;color:var(--text-2);max-width:24ch;
  }
  .chip{
    margin-top:20px;display:inline-flex;align-items:center;gap:18px;
    padding:16px 32px;border-radius:2px;
    background:rgba(10,15,31,0.6);border:1px solid color-mix(in srgb, var(--gold) 40%, var(--noir-3));
    font-family:var(--font-mono);font-size:22px;letter-spacing:0.22em;text-transform:uppercase;color:var(--text);
  }
  .chip .n{font-family:var(--font-display);font-weight:500;font-style:italic;font-size:34px;color:var(--gold-bright);letter-spacing:0;text-transform:none}
  .chip .sep{color:var(--text-3)}
  .url{
    position:absolute;left:0;right:0;bottom:80px;text-align:center;
    font-family:var(--font-mono);font-size:22px;letter-spacing:0.28em;text-transform:uppercase;color:var(--text-3);
  }
</style>
</head>
<body>
<div class="frame">
  <span class="star s1"></span><span class="star s2"></span><span class="star s3"></span><span class="star s4"></span>
  <span class="star s5"></span><span class="star s6"></span><span class="star s7"></span><span class="star s8"></span>
  <div class="moon-wrap">
    <div class="moon">
      <span class="ring r1"></span><span class="ring r2"></span><span class="ring r3"></span>
      <svg viewBox="0 0 200 200" aria-hidden="true">
        <defs>
          <linearGradient id="covG" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#D4AF37"/><stop offset="100%" stop-color="#F4D06F"/>
          </linearGradient>
          <linearGradient id="covP" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#B3B7C9"/><stop offset="100%" stop-color="#5B607A"/>
          </linearGradient>
          <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0%" stop-color="#F4D06F" stop-opacity="0.30"/>
            <stop offset="60%" stop-color="#D4AF37" stop-opacity="0.05"/>
            <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
          </radialGradient>
        </defs>
        <circle cx="100" cy="100" r="60" fill="url(#core)"/>
        <circle cx="100" cy="100" r="72" fill="none" stroke="url(#covG)" stroke-width="1.6" opacity="0.92"/>
        <path d="M 100 28 A 72 72 0 0 1 100 172" stroke="url(#covG)" stroke-width="2.4" fill="none" stroke-linecap="round" opacity="0.95"/>
        <path d="M 100 28 A 72 72 0 0 0 100 172" stroke="url(#covP)" stroke-width="1.2" fill="none" stroke-linecap="round" opacity="0.55"/>
        <circle cx="80" cy="78" r="1.4" fill="#F4D06F" opacity="0.9"/>
        <circle cx="118" cy="92" r="1.0" fill="#B3B7C9" opacity="0.8"/>
        <circle cx="92" cy="120" r="1.2" fill="#F4D06F" opacity="0.75"/>
        <circle cx="125" cy="130" r="0.9" fill="#B3B7C9" opacity="0.7"/>
        <circle cx="74" cy="112" r="0.8" fill="#F4D06F" opacity="0.6"/>
        <circle cx="108" cy="68" r="0.8" fill="#B3B7C9" opacity="0.55"/>
        <circle cx="100" cy="100" r="3.2" fill="#F4D06F" opacity="0.95"/>
      </svg>
    </div>
  </div>

  <div class="body">
    <span class="eyebrow">A nightly ritual</span>
    <span class="family">FREQUENCY</span>
    <h1 class="title">DREAMS.</h1>
    <div class="sub">Compose your night.</div>
    <p class="tag">Soundscape. Breath. A landscape to drift through. Kept on your phone.</p>
    <div class="chip">LIFETIME <span class="n">AU$30</span><span class="sep">·</span>ONE PAYMENT</div>
  </div>
  <div class="url">RHYTHMIXAPP.COM.AU / DREAMS</div>
</div>
</body>
</html>
