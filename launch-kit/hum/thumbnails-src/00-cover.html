<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>HUM — Cover</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100vh; background:#000; }
  body { display:flex; align-items:center; justify-content:center; font-family:'Inter', system-ui, sans-serif; color:#ede8f5; }
  .frame {
    width: 1280px; height: 720px; position: relative; overflow: hidden;
    background:
      radial-gradient(1400px 700px at 20% 50%, rgba(155,107,255,0.28), transparent 70%),
      radial-gradient(900px 600px at 110% 110%, rgba(216,216,226,0.10), transparent 70%),
      #0a0a0e;
    display:flex; align-items:center;
  }
  .orb-wrap { width: 520px; flex-shrink: 0; display:flex; align-items:center; justify-content:center; padding-left: 60px; }
  .orb { width: 420px; height: 420px; border-radius: 50%; background: radial-gradient(circle, rgba(155,107,255,0.9) 0%, rgba(155,107,255,0.45) 30%, transparent 70%); box-shadow: 0 0 180px rgba(155,107,255,0.55), 0 0 280px rgba(155,107,255,0.3); position: relative; }
  .orb::after { content:""; position:absolute; inset: 0; border-radius:50%; background: radial-gradient(circle at 35% 30%, rgba(255,255,255,0.18) 0%, transparent 40%); }

  .copy { flex:1; padding: 60px 80px 60px 20px; }
  .eyebrow { font-family:'JetBrains Mono', monospace; font-size:22px; letter-spacing:0.28em; text-transform:uppercase; color:#c4a3ff; margin-bottom: 28px; }
  .title { font-family:'Cormorant Garamond', serif; font-weight:500; font-size: 260px; line-height: 0.9; letter-spacing:-0.03em; }
  .italic { font-style:italic; background: linear-gradient(135deg, #9b6bff 0%, #d8d8e2 50%, #9b6bff 100%); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .tagline { font-family:'Cormorant Garamond', serif; font-style: italic; font-size: 44px; line-height: 1.2; color:#c4bccf; margin-top: 28px; max-width: 600px; }
  .chip { margin-top: 40px; display:inline-flex; gap:18px; align-items:center; padding: 16px 28px; border-radius: 999px; background:#13131a; border:1px solid rgba(155,107,255,0.5); font-family:'JetBrains Mono', monospace; font-size:22px; letter-spacing:0.15em; text-transform:uppercase; color:#f0f0f8; }
  .chip .n { font-family:'Cormorant Garamond', serif; font-size: 36px; color:#c4a3ff; letter-spacing: 0; text-transform:none; }
  .urlfoot { position:absolute; left:0; right:0; bottom: 28px; text-align:center; font-family:'JetBrains Mono', monospace; font-size:18px; letter-spacing:0.28em; text-transform:uppercase; color:#6a6878; }
</style>
</head>
<body>
<div class="frame">
  <div class="orb-wrap"><div class="orb"></div></div>
  <div class="copy">
    <div class="eyebrow">A 90-second daily practice</div>
    <h1 class="title"><span class="italic">HUM</span>.</h1>
    <div class="tagline">Five thousand years of yogi practice, in your phone browser.</div>
    <div class="chip">LIFETIME <span class="n">AU$30</span> · ONE PAYMENT</div>
  </div>
  <div class="urlfoot">RHYTHMIXAPP.COM.AU / HUM</div>
</div>
</body>
</html>
