<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, initial-scale=1">
<title>HUM — The Price</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100vh; background:#000; }
  body { display:flex; align-items:center; justify-content:center; font-family:'Inter', system-ui, sans-serif; color:#ede8f5; }
  .frame {
    width: 1080px; height: 1080px; position: relative; overflow: hidden;
    background:
      radial-gradient(1400px 800px at 50% -120px, rgba(155,107,255,0.22), transparent 70%),
      radial-gradient(900px 700px at 50% 110%, rgba(216,216,226,0.10), transparent 70%),
      #0a0a0e;
    display:flex; flex-direction: column; padding: 100px 80px;
  }
  .badge { font-family:'JetBrains Mono', monospace; font-size:20px; letter-spacing:0.32em; text-transform:uppercase; color:#c4a3ff; margin-bottom: 40px; text-align: center; }
  .price { display: flex; flex-direction: column; align-items: center; gap: 12px; margin-bottom: 40px; }
  .price .big { font-family:'Cormorant Garamond', serif; font-weight:500; font-size: 280px; line-height: 1; background: linear-gradient(135deg, #9b6bff 0%, #d8d8e2 50%, #9b6bff 100%); -webkit-background-clip:text; background-clip:text; color:transparent; letter-spacing:-0.02em; }
  .price .currency { font-family:'JetBrains Mono', monospace; font-size:24px; letter-spacing:0.28em; color:#c4a3ff; text-transform: uppercase; }
  .compare { display:flex; flex-direction:column; gap: 16px; max-width: 800px; margin: 0 auto; width: 100%; }
  .compare .row { display:flex; justify-content:space-between; align-items: baseline; padding: 20px 0; border-bottom: 1px solid #1d1d27; }
  .compare .row.us { border-bottom: 1px solid rgba(155,107,255,0.6); border-top: 1px solid rgba(155,107,255,0.6); padding: 26px 0; margin-top: 8px; }
  .compare .name { font-family:'JetBrains Mono', monospace; font-size: 20px; letter-spacing:0.18em; text-transform:uppercase; color:#a8a4b5; }
  .compare .row.us .name { color:#ede8f5; font-weight: 700; }
  .compare .cost { font-family:'Cormorant Garamond', serif; font-size: 38px; color:#ede8f5; }
  .compare .row.us .cost { color:#c4a3ff; font-style: italic; font-size: 48px; }
  .closer { margin-top: auto; padding-top: 30px; text-align: center; font-family:'Cormorant Garamond', serif; font-style: italic; font-size: 30px; color:#a8a4b5; max-width: 800px; margin-left: auto; margin-right: auto; }
  .urlfoot { margin-top: 18px; text-align:center; font-family:'JetBrains Mono', monospace; font-size:18px; letter-spacing:0.28em; text-transform:uppercase; color:#6a6878; }
</style>
</head>
<body>
<div class="frame">
  <div class="badge">How much it cost</div>
  <div class="price">
    <div class="big">AU$30</div>
    <div class="currency">Once · forever · no renewal</div>
  </div>
  <div class="compare">
    <div class="row"><span class="name">Calm · annual</span><span class="cost">AU$110 / year</span></div>
    <div class="row"><span class="name">Headspace · annual</span><span class="cost">AU$95 / year</span></div>
    <div class="row"><span class="name">Insight Timer · plus</span><span class="cost">AU$90 / year</span></div>
    <div class="row us"><span class="name">HUM · lifetime</span><span class="cost">AU$30 · once</span></div>
  </div>
  <div class="closer">The price for buyers today never goes up. Future updates included.</div>
  <div class="urlfoot">RHYTHMIXAPP.COM.AU / HUM</div>
</div>
</body>
</html>
