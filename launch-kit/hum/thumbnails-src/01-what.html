<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, initial-scale=1">
<title>HUM — What it is</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100vh; background:#000; }
  body { display:flex; align-items:center; justify-content:center; font-family:'Inter', system-ui, sans-serif; color:#ede8f5; }
  .frame {
    width: 1080px; height: 1080px; position: relative; overflow: hidden;
    background:
      radial-gradient(1400px 800px at 50% -120px, rgba(155,107,255,0.22), transparent 70%),
      radial-gradient(900px 700px at 50% 110%, rgba(216,216,226,0.10), transparent 70%),
      #0a0a0e;
    display:flex; flex-direction:column; align-items:center; padding: 100px 80px;
  }
  .badge { font-family:'JetBrains Mono', monospace; font-size:20px; letter-spacing:0.32em; text-transform:uppercase; color:#c4a3ff; margin-bottom: 60px; }
  .orb { width: 340px; height: 340px; border-radius: 50%; background: radial-gradient(circle, rgba(155,107,255,0.9) 0%, rgba(155,107,255,0.45) 30%, transparent 70%); box-shadow: 0 0 160px rgba(155,107,255,0.5), 0 0 240px rgba(155,107,255,0.25); position: relative; margin-bottom: 60px; }
  .orb::after { content:""; position:absolute; inset:0; border-radius:50%; background: radial-gradient(circle at 35% 30%, rgba(255,255,255,0.18) 0%, transparent 40%); }
  .title { font-family:'Cormorant Garamond', serif; font-weight:500; font-size: 92px; line-height: 1.08; letter-spacing:-0.01em; text-align: center; }
  .italic { font-style:italic; background: linear-gradient(135deg, #9b6bff 0%, #d8d8e2 50%, #9b6bff 100%); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .sub { font-family:'Cormorant Garamond', serif; font-style: italic; font-size: 44px; color:#a8a4b5; margin-top: 28px; text-align:center; max-width: 800px; }
  .pillars { margin-top: auto; display:flex; gap: 40px; justify-content:center; padding-bottom: 30px; }
  .pillars .p { font-family:'JetBrains Mono', monospace; font-size: 20px; letter-spacing: 0.22em; text-transform: uppercase; color:#8a8a98; padding: 12px 0; border-top: 1px solid rgba(155,107,255,0.4); border-bottom: 1px solid rgba(155,107,255,0.4); flex:1; text-align:center; }
  .urlfoot { font-family:'JetBrains Mono', monospace; font-size:18px; letter-spacing:0.28em; text-transform:uppercase; color:#6a6878; margin-top: 16px; }
</style>
</head>
<body>
<div class="frame">
  <div class="badge">What HUM is</div>
  <div class="orb"></div>
  <h1 class="title">A <span class="italic">90-second</span> daily<br>humming practice.</h1>
  <div class="sub">In your phone browser. No download. No login.</div>
  <div class="pillars">
    <div class="p">NO APP STORE</div>
    <div class="p">NO LOGIN</div>
    <div class="p">NO SUBSCRIPTION</div>
  </div>
  <div class="urlfoot">RHYTHMIXAPP.COM.AU / HUM</div>
</div>
</body>
</html>
