<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, initial-scale=1">
<title>HUM — How it works</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100vh; background:#000; }
  body { display:flex; align-items:center; justify-content:center; font-family:'Inter', system-ui, sans-serif; color:#ede8f5; }
  .frame {
    width: 1080px; height: 1080px; position: relative; overflow: hidden;
    background:
      radial-gradient(1400px 800px at 50% -120px, rgba(155,107,255,0.18), transparent 70%),
      radial-gradient(900px 700px at 50% 110%, rgba(216,216,226,0.10), transparent 70%),
      #0a0a0e;
    display:flex; flex-direction:column; padding: 100px 80px;
  }
  .badge { font-family:'JetBrains Mono', monospace; font-size:20px; letter-spacing:0.32em; text-transform:uppercase; color:#c4a3ff; margin-bottom: 40px; text-align: center; }
  .title { font-family:'Cormorant Garamond', serif; font-weight:500; font-size: 84px; line-height: 1.08; text-align: center; margin-bottom: 60px; }
  .italic { font-style:italic; background: linear-gradient(135deg, #9b6bff 0%, #d8d8e2 50%, #9b6bff 100%); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .steps { display:flex; flex-direction: column; gap: 32px; max-width: 760px; margin: 0 auto; width: 100%; }
  .step { display: flex; align-items: center; gap: 36px; padding: 28px 0; border-top: 1px solid #1d1d27; }
  .step:last-child { border-bottom: 1px solid #1d1d27; }
  .step .n { font-family:'Cormorant Garamond', serif; font-style: italic; font-size: 88px; line-height: 1; background: linear-gradient(135deg, #9b6bff 0%, #d8d8e2 50%, #9b6bff 100%); -webkit-background-clip:text; background-clip:text; color:transparent; min-width: 96px; }
  .step .lbl { font-family:'Cormorant Garamond', serif; font-size: 50px; line-height: 1.1; color:#ede8f5; }
  .step .meta { font-family:'JetBrains Mono', monospace; font-size: 18px; letter-spacing: 0.18em; text-transform: uppercase; color:#8a8a98; margin-top: 6px; }
  .urlfoot { margin-top: auto; text-align:center; font-family:'JetBrains Mono', monospace; font-size:18px; letter-spacing:0.28em; text-transform:uppercase; color:#6a6878; }
</style>
</head>
<body>
<div class="frame">
  <div class="badge">How HUM works</div>
  <h1 class="title">Breathe in. <span class="italic">Hum out.</span></h1>
  <div class="steps">
    <div class="step"><span class="n">1</span><div><div class="lbl">Open the link.</div><div class="meta">RHYTHMIXAPP.COM.AU / HUM</div></div></div>
    <div class="step"><span class="n">2</span><div><div class="lbl">Breathe in through the nose.</div><div class="meta">THE ORB RISES</div></div></div>
    <div class="step"><span class="n">3</span><div><div class="lbl">Hum out on the exhale.</div><div class="meta">THE ORB FALLS</div></div></div>
    <div class="step"><span class="n">4</span><div><div class="lbl">Repeat for ninety seconds.</div><div class="meta">ONCE A DAY</div></div></div>
  </div>
  <div class="urlfoot">RHYTHMIXAPP.COM.AU / HUM</div>
</div>
</body>
</html>
