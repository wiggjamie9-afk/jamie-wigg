<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>HUM · hook tease</title>
<meta name="viewport" content="width=1080, initial-scale=1">
<script>
  // Frame-driven progress. ?frame=NN  (NN = 0..89)
  // Sets --t (0..1 across whole clip), plus --seg1, --seg2, --seg3 (0..1 inside each 30-frame band).
  // Must run BEFORE any paint — placed first in <head>.
  (function () {
    var p = new URLSearchParams(location.search);
    var raw = p.get('frame');
    var f = raw === null ? 0 : Math.max(0, Math.min(89, parseInt(raw, 10) || 0));
    var t = f / 89;
    function clamp01(x){ return Math.max(0, Math.min(1, x)); }
    // 3 segments: 0–30 (incl), 30–60, 60–89
    var seg1 = clamp01(f / 30);             // 0..1 across frames 0..30
    var seg2 = clamp01((f - 30) / 30);      // 0..1 across frames 30..60
    var seg3 = clamp01((f - 60) / 29);      // 0..1 across frames 60..89
    var r = document.documentElement;
    r.style.setProperty('--t', t.toFixed(5));
    r.style.setProperty('--seg1', seg1.toFixed(5));
    r.style.setProperty('--seg2', seg2.toFixed(5));
    r.style.setProperty('--seg3', seg3.toFixed(5));
    r.style.setProperty('--frame', String(f));
  })();
</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
  :root {
    --noir:        #0a0a0e;
    --noir-2:      #13131a;
    --noir-3:      #1d1d27;
    --violet:      #9b6bff;
    --violet-deep: #6b3fc4;
    --violet-soft: #c4a3ff;
    --silver:      #d8d8e2;
    --silver-bright:#f0f0f8;
    --silver-dim:  #8a8a98;
    --text:        #ede8f5;
    --text-2:      #a8a4b5;
    --text-3:      #6a6878;
    --weave: linear-gradient(135deg, #9b6bff 0%, #d8d8e2 50%, #9b6bff 100%);

    /* defaults if script didn't set them */
    --t: 0;
    --seg1: 0;
    --seg2: 0;
    --seg3: 0;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--noir); }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  .frame {
    position: relative;
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    background: var(--noir);
  }

  /* radial halos */
  .halo-top, .halo-bottom {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .halo-top {
    background: radial-gradient(1200px 600px at 50% -100px, rgba(155,107,255,0.12), transparent 70%);
  }
  .halo-bottom {
    background: radial-gradient(900px 500px at 50% 110%, rgba(216,216,226,0.08), transparent 70%);
  }

  /* central stage */
  .stage {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0 80px;
  }

  /* visual cluster — fixed slot above the caption */
  .visual {
    position: relative;
    width: 700px;
    height: 700px;
    margin-bottom: 60px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* The dot — visible in seg1, fades out as seg2 progresses */
  .dot {
    position: absolute;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: radial-gradient(circle, #c4a3ff 0%, #9b6bff 55%, rgba(155,107,255,0) 100%);
    /* grow + pulse using seg1 */
    transform: scale(calc(0.4 + var(--seg1) * 1.4));
    opacity: calc(var(--seg1) * (1 - var(--seg2)));
    box-shadow:
      0 0 calc(40px + var(--seg1) * 80px) rgba(155,107,255, calc(0.6 + var(--seg1) * 0.4)),
      0 0 calc(120px + var(--seg1) * 160px) rgba(155,107,255, calc(0.25 + var(--seg1) * 0.35));
    will-change: transform, opacity;
  }

  /* Soft outward ring — the "first hum" pulse */
  .ripple {
    position: absolute;
    width: 100px;
    height: 100px;
    border-radius: 50%;
    border: 2px solid rgba(196,163,255, calc(0.6 * var(--seg1) * (1 - var(--seg2))));
    transform: scale(calc(0.5 + var(--seg1) * 3.2));
    opacity: calc(0.9 * var(--seg1) * (1 - var(--seg2)));
  }

  /* Helix svg — emerges in seg2, locks + glows in seg3 */
  .helix-wrap {
    position: absolute;
    width: 560px;
    height: 560px;
    /* fade in across seg2, stay visible in seg3 */
    opacity: calc(var(--seg2));
    /* scale up from the dot (small) to full helix */
    transform: scale(calc(0.35 + var(--seg2) * 0.65 + var(--seg3) * 0.04));
    will-change: opacity, transform;
    filter:
      drop-shadow(0 0 calc(20px + var(--seg3) * 50px) rgba(155,107,255, calc(0.4 + var(--seg3) * 0.5)))
      drop-shadow(0 0 calc(60px + var(--seg3) * 80px) rgba(155,107,255, calc(0.15 + var(--seg3) * 0.35)));
  }
  .helix-wrap svg { width: 100%; height: 100%; display: block; }

  /* Caption — three stacked lines, each visible during its segment */
  .caption {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-weight: 500;
    font-size: 88px;
    line-height: 1.05;
    letter-spacing: -0.01em;
    color: var(--silver-bright);
    text-align: center;
    position: relative;
    height: 110px;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .caption .line {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    will-change: opacity, transform;
  }

  /* Line 1: "90 seconds." — visible during seg1, fades as seg2 starts */
  .line-1 {
    opacity: calc(var(--seg1) * (1 - var(--seg2)));
    transform: translateY(calc((1 - var(--seg1)) * 24px));
  }
  /* Line 2: "One breath cycle." — visible during seg2, fades as seg3 starts */
  .line-2 {
    opacity: calc(var(--seg2) * (1 - var(--seg3)));
    transform: translateY(calc((1 - var(--seg2)) * 24px));
  }
  /* Line 3: "Coherence." — visible during seg3 */
  .line-3 {
    opacity: calc(var(--seg3));
    transform: translateY(calc((1 - var(--seg3)) * 24px));
  }

  .caption .em {
    font-style: italic;
  }

  /* weave gradient on the final emphasis word */
  .weave-text {
    background: var(--weave);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
  }

  /* footer */
  .footer {
    position: absolute;
    left: 0; right: 0;
    bottom: 90px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 22px;
    /* footer fades in across seg3 */
    opacity: calc(0.35 + var(--seg3) * 0.65);
  }
  .wordmark {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-weight: 600;
    letter-spacing: 0.04em;
    font-size: 56px;
    color: var(--silver-bright);
  }
  .url {
    font-family: 'JetBrains Mono', monospace;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    font-size: 22px;
    color: var(--text-3);
  }

  /* tiny eyebrow */
  .eyebrow {
    position: absolute;
    top: 110px;
    left: 0; right: 0;
    text-align: center;
    font-family: 'JetBrains Mono', monospace;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    font-size: 20px;
    color: var(--text-3);
    /* always present but slightly dim, brighter in seg3 */
    opacity: calc(0.45 + var(--seg3) * 0.45);
  }
</style>
</head>
<body>
  <div class="frame">
    <div class="halo-top"></div>
    <div class="halo-bottom"></div>

    <div class="eyebrow">RHYTHMIX · PRESENTS</div>

    <div class="stage">
      <div class="visual">
        <div class="ripple"></div>
        <div class="dot"></div>

        <div class="helix-wrap" aria-hidden="true">
          <svg viewBox="0 0 200 200">
            <defs>
              <linearGradient id="covV" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#9b6bff"/>
                <stop offset="100%" stop-color="#6b3fc4"/>
              </linearGradient>
              <linearGradient id="covS" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#d8d8e2"/>
                <stop offset="100%" stop-color="#8a8a98"/>
              </linearGradient>
            </defs>
            <!-- outer ring -->
            <circle cx="100" cy="100" r="78" fill="none" stroke="url(#covV)" stroke-width="1.6" opacity="0.7"/>
            <!-- silver horizontal ellipse -->
            <ellipse cx="100" cy="100" rx="78" ry="30" fill="none" stroke="url(#covS)" stroke-width="1.5" opacity="0.85"/>
            <!-- violet vertical ellipse -->
            <ellipse cx="100" cy="100" rx="78" ry="30" fill="none" stroke="url(#covV)" stroke-width="1.3" opacity="0.85" transform="rotate(90 100 100)"/>
            <!-- 45deg crossing ribbons to suggest helix braid -->
            <ellipse cx="100" cy="100" rx="78" ry="22" fill="none" stroke="url(#covS)" stroke-width="0.9" opacity="0.55" transform="rotate(45 100 100)"/>
            <ellipse cx="100" cy="100" rx="78" ry="22" fill="none" stroke="url(#covV)" stroke-width="0.9" opacity="0.55" transform="rotate(135 100 100)"/>
            <!-- center kernel -->
            <circle cx="100" cy="100" r="6" fill="#c4a3ff" opacity="0.95"/>
          </svg>
        </div>
      </div>

      <div class="caption">
        <div class="line line-1">90 <span class="em">seconds.</span></div>
        <div class="line line-2">One breath <span class="em">cycle.</span></div>
        <div class="line line-3"><span class="em weave-text">Coherence.</span></div>
      </div>
    </div>

    <div class="footer">
      <div class="wordmark">HUM</div>
      <div class="url">RHYTHMIXAPP.COM.AU/HUM</div>
    </div>
  </div>
</body>
</html>
