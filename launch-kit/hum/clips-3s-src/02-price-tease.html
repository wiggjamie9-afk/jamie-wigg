<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>HUM · price tease</title>
<meta name="viewport" content="width=1080, initial-scale=1">
<script>
  // Frame-driven progress. ?frame=NN  (NN = 0..89)
  // 3 segments of unequal width:
  //   seg1 = 0..25  (HUM. fades up)
  //   seg2 = 25..55 (price chip slides in + opacity)
  //   seg3 = 55..89 ("Begin." letter-by-letter reveal)
  (function () {
    var p = new URLSearchParams(location.search);
    var raw = p.get('frame');
    var f = raw === null ? 0 : Math.max(0, Math.min(89, parseInt(raw, 10) || 0));
    var t = f / 89;
    function clamp01(x){ return Math.max(0, Math.min(1, x)); }
    var seg1 = clamp01(f / 25);
    var seg2 = clamp01((f - 25) / 30);
    var seg3 = clamp01((f - 55) / 34);
    var r = document.documentElement;
    r.style.setProperty('--t', t.toFixed(5));
    r.style.setProperty('--seg1', seg1.toFixed(5));
    r.style.setProperty('--seg2', seg2.toFixed(5));
    r.style.setProperty('--seg3', seg3.toFixed(5));
    r.style.setProperty('--frame', String(f));
  })();
</script>
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
  :root {
    --noir:        #0a0a0e;
    --noir-2:      #13131a;
    --noir-3:      #1d1d27;
    --violet:      #9b6bff;
    --violet-deep: #6b3fc4;
    --violet-soft: #c4a3ff;
    --silver:      #d8d8e2;
    --silver-bright:#f0f0f8;
    --silver-dim:  #8a8a98;
    --text:        #ede8f5;
    --text-2:      #a8a4b5;
    --text-3:      #6a6878;
    --weave: linear-gradient(135deg, #9b6bff 0%, #d8d8e2 50%, #9b6bff 100%);

    --t: 0;
    --seg1: 0;
    --seg2: 0;
    --seg3: 0;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--noir); }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  .frame {
    position: relative;
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    background: var(--noir);
  }

  .halo-top, .halo-bottom {
    position: absolute; inset: 0; pointer-events: none;
  }
  .halo-top {
    background: radial-gradient(1200px 600px at 50% -100px, rgba(155,107,255,0.12), transparent 70%);
  }
  .halo-bottom {
    background: radial-gradient(900px 500px at 50% 110%, rgba(216,216,226,0.08), transparent 70%);
  }

  /* corner helix mark — appears subtly across the whole clip, fully present in seg3 */
  .corner-mark {
    position: absolute;
    top: 90px;
    left: 90px;
    width: 92px;
    height: 92px;
    opacity: calc(0.25 + var(--seg2) * 0.35 + var(--seg3) * 0.4);
  }
  .corner-mark svg { width: 100%; height: 100%; display: block; }

  /* central stack */
  .stage {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 60px;
    padding: 0 80px;
  }

  /* HUM. italic Cormorant — fades up in seg1, stays */
  .hero {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-style: italic;
    font-weight: 500;
    font-size: 320px;
    line-height: 1;
    letter-spacing: -0.02em;
    color: var(--silver-bright);
    background: var(--weave);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
    opacity: calc(var(--seg1));
    transform: translateY(calc((1 - var(--seg1)) * 40px));
    margin: 0;
    will-change: opacity, transform;
  }

  /* price chip — slides in from y+40, opacity 0->1 during seg2 */
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 22px;
    padding: 24px 42px;
    border-radius: 999px;
    background: var(--noir-2);
    border: 1px solid rgba(155,107,255, 0.32);
    box-shadow:
      0 0 0 1px rgba(155,107,255, 0.18),
      0 18px 60px rgba(155,107,255, calc(0.18 + var(--seg2) * 0.18));
    font-family: 'JetBrains Mono', monospace;
    font-size: 30px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--silver-bright);
    opacity: calc(var(--seg2));
    transform: translateY(calc((1 - var(--seg2)) * 40px));
    will-change: opacity, transform;
  }
  .chip .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--violet-soft);
    box-shadow: 0 0 12px var(--violet);
  }
  .chip .num {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-weight: 500;
    font-style: normal;
    font-size: 52px;
    letter-spacing: 0;
    text-transform: none;
    color: var(--silver-bright);
    background: var(--weave);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
    line-height: 1;
  }
  .chip .num .currency {
    font-size: 30px;
    vertical-align: top;
    margin-right: 2px;
  }

  /* "Begin." CTA — letter-by-letter reveal via width on overflow:hidden inline-block.
     We have 6 chars ("Begin."). Each char appears within a slice of seg3.
     Width animation: container width goes from 0 to 100% as seg3 0->1. */
  .cta-row {
    margin-top: 20px;
    opacity: calc(var(--seg3) > 0 ? 1 : 0);
    /* keep it present but invisible until seg3>0 */
    opacity: calc(min(1, var(--seg3) * 999));
  }
  .cta {
    position: relative;
    display: inline-block;
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-weight: 500;
    font-size: 140px;
    line-height: 1;
    letter-spacing: -0.01em;
    color: var(--silver-bright);
  }
  .cta .ghost {
    /* invisible spacer to reserve full width — ensures layout is stable across frames */
    visibility: hidden;
    font-style: italic;
  }
  .cta .reveal {
    position: absolute;
    inset: 0;
    overflow: hidden;
    width: calc(var(--seg3) * 100%);
    font-style: italic;
    color: var(--silver-bright);
    white-space: nowrap;
    will-change: width;
  }
  .cta .reveal .em {
    background: var(--weave);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
  }

  /* a soft caret/glow on the reveal edge so it reads as a write-on, not a crop */
  .cta .reveal::after {
    content: '';
    position: absolute;
    right: 0; top: 12%;
    width: 4px;
    height: 76%;
    background: var(--violet-soft);
    box-shadow: 0 0 18px var(--violet);
    opacity: calc((1 - var(--seg3)) * 0.9);
  }

  /* footer */
  .footer {
    position: absolute;
    left: 0; right: 0;
    bottom: 90px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 22px;
    opacity: calc(0.5 + var(--seg2) * 0.25 + var(--seg3) * 0.25);
  }
  .wordmark {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-weight: 600;
    letter-spacing: 0.04em;
    font-size: 52px;
    color: var(--silver-bright);
  }
  .url {
    font-family: 'JetBrains Mono', monospace;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    font-size: 22px;
    color: var(--text-3);
  }
</style>
</head>
<body>
  <div class="frame">
    <div class="halo-top"></div>
    <div class="halo-bottom"></div>

    <div class="corner-mark" aria-hidden="true">
      <svg viewBox="0 0 40 40">
        <defs>
          <linearGradient id="bm" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#9b6bff"/>
            <stop offset="100%" stop-color="#d8d8e2"/>
          </linearGradient>
        </defs>
        <path d="M6 20 Q13 8 20 20 T34 20" stroke="url(#bm)" stroke-width="2.2" fill="none" stroke-linecap="round"/>
        <path d="M6 20 Q13 32 20 20 T34 20" stroke="#d8d8e2" stroke-width="1.4" fill="none" stroke-linecap="round" opacity="0.6"/>
      </svg>
    </div>

    <div class="stage">
      <h1 class="hero">HUM.</h1>

      <div class="chip">
        <span>Lifetime</span>
        <span class="dot"></span>
        <span class="num"><span class="currency">AU$</span>30</span>
        <span class="dot"></span>
        <span>One payment</span>
      </div>

      <div class="cta-row">
        <span class="cta">
          <span class="ghost">Begin.</span>
          <span class="reveal"><span class="em">Begin.</span></span>
        </span>
      </div>
    </div>

    <div class="footer">
      <div class="wordmark">HUM</div>
      <div class="url">RHYTHMIXAPP.COM.AU/HUM</div>
    </div>
  </div>
</body>
</html>
