<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1080, initial-scale=1" />
<title>HUM · 130 Hz · the chest hum</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
  :root{
    --noir:#0a0a0e; --noir-2:#13131a; --noir-3:#1d1d27;
    --violet:#9b6bff; --violet-deep:#6b3fc4; --violet-soft:#c4a3ff;
    --silver:#d8d8e2; --silver-bright:#f0f0f8; --silver-dim:#8a8a98;
    --text:#ede8f5; --text-2:#a8a4b5; --text-3:#6a6878;
    --weave:linear-gradient(135deg,#9b6bff 0%,#d8d8e2 50%,#9b6bff 100%);
    --font-display:'Cormorant Garamond',Georgia,serif;
    --font-ui:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    --font-mono:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{margin:0;background:#000;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:var(--font-ui);color:var(--text);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  .frame{
    position:relative;width:1080px;height:1080px;overflow:hidden;
    background:
      radial-gradient(1200px 600px at 50% -100px, rgba(155,107,255,0.12), transparent 70%),
      radial-gradient(900px 500px at 50% 110%, rgba(216,216,226,0.08), transparent 70%),
      var(--noir);
    padding:88px 88px 80px;
    display:flex;flex-direction:column;
  }
  .top{display:flex;align-items:center;justify-content:space-between}
  .mark{display:flex;align-items:center;gap:14px}
  .mark svg{width:28px;height:28px}
  .mark .word{font-family:var(--font-display);font-weight:600;font-size:22px;letter-spacing:0.04em;color:var(--silver-bright)}
  .eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:0.28em;text-transform:uppercase;color:var(--text-3)}

  .hero{
    margin-top:36px;display:flex;align-items:baseline;justify-content:center;gap:14px;
  }
  .num{
    font-family:var(--font-display);font-weight:500;font-size:288px;line-height:0.9;letter-spacing:-0.03em;
    background:var(--weave);-webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .unit{
    font-family:var(--font-display);font-weight:400;font-style:italic;font-size:96px;line-height:0.9;color:var(--silver-bright);
  }
  .sub{
    text-align:center;margin-top:8px;
    font-family:var(--font-mono);font-size:13px;letter-spacing:0.32em;text-transform:uppercase;color:var(--violet-soft);
  }

  .waves{
    margin-top:56px;display:flex;flex-direction:column;gap:34px;
  }
  .wave{
    display:grid;grid-template-columns: 160px 1fr 140px;align-items:center;gap:24px;
    padding:18px 4px;border-bottom:1px solid var(--noir-3);
  }
  .wave:last-child{border-bottom:0}
  .wave .label{
    font-family:var(--font-mono);font-size:12px;letter-spacing:0.28em;text-transform:uppercase;color:var(--silver-bright);
  }
  .wave .label .lo{display:block;color:var(--text-3);margin-top:6px}
  .wave svg{width:100%;height:80px;display:block}
  .wave .hz{
    text-align:right;
    font-family:var(--font-display);font-weight:500;font-size:34px;color:var(--text);font-style:italic;
  }
  .wave .hz .small{font-family:var(--font-mono);font-style:normal;font-size:11px;letter-spacing:0.24em;color:var(--text-3);display:block;margin-top:2px}

  .bottom{
    margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:24px;
    font-family:var(--font-mono);font-size:11px;letter-spacing:0.28em;text-transform:uppercase;color:var(--text-3);
    padding-top:28px;border-top:1px solid var(--noir-3);
  }
  .bottom .center{
    color:var(--silver-bright);letter-spacing:0.32em;
  }
</style>
</head>
<body>
  <div class="frame">
    <div class="top">
      <div class="mark">
        <svg viewBox="0 0 40 40" aria-hidden="true">
          <defs>
            <linearGradient id="bm" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#9b6bff"/><stop offset="100%" stop-color="#d8d8e2"/>
            </linearGradient>
          </defs>
          <path d="M6 20 Q13 8 20 20 T34 20" stroke="url(#bm)" stroke-width="2.4" fill="none" stroke-linecap="round"/>
          <path d="M6 20 Q13 32 20 20 T34 20" stroke="#d8d8e2" stroke-width="1.6" fill="none" stroke-linecap="round" opacity="0.6"/>
        </svg>
        <span class="word">HUM</span>
      </div>
      <span class="eyebrow">The reference tone</span>
    </div>

    <div class="hero"><span class="num">130</span><span class="unit">Hz</span></div>
    <div class="sub">the chest hum &nbsp;·&nbsp; an anchor for your voice</div>

    <div class="waves">
      <div class="wave">
        <div class="label">Chest hum<span class="lo">low · grounded</span></div>
        <svg viewBox="0 0 800 80" preserveAspectRatio="none" aria-hidden="true">
          <defs>
            <linearGradient id="w1" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="#9b6bff" stop-opacity="0.0"/>
              <stop offset="12%" stop-color="#9b6bff" stop-opacity="1"/>
              <stop offset="88%" stop-color="#9b6bff" stop-opacity="1"/>
              <stop offset="100%" stop-color="#9b6bff" stop-opacity="0.0"/>
            </linearGradient>
          </defs>
          <!-- 130 Hz: ~5 cycles across, big amplitude -->
          <path d="M 0 40
                   Q 40 4 80 40 T 160 40 T 240 40 T 320 40 T 400 40 T 480 40 T 560 40 T 640 40 T 720 40 T 800 40"
                stroke="url(#w1)" stroke-width="3" fill="none" stroke-linecap="round"/>
        </svg>
        <div class="hz">130 Hz<span class="small">violet</span></div>
      </div>

      <div class="wave">
        <div class="label">Open Om<span class="lo">midline · open</span></div>
        <svg viewBox="0 0 800 80" preserveAspectRatio="none" aria-hidden="true">
          <defs>
            <linearGradient id="w2" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="#d8d8e2" stop-opacity="0.0"/>
              <stop offset="12%" stop-color="#d8d8e2" stop-opacity="1"/>
              <stop offset="88%" stop-color="#f0f0f8" stop-opacity="1"/>
              <stop offset="100%" stop-color="#d8d8e2" stop-opacity="0.0"/>
            </linearGradient>
          </defs>
          <!-- 174 Hz: ~7 cycles, slightly tighter -->
          <path d="M 0 40
                   Q 28 8 57 40 T 114 40 T 171 40 T 228 40 T 285 40 T 342 40 T 400 40
                   T 457 40 T 514 40 T 571 40 T 628 40 T 685 40 T 742 40 T 800 40"
                stroke="url(#w2)" stroke-width="2.2" fill="none" stroke-linecap="round"/>
        </svg>
        <div class="hz">174 Hz<span class="small">silver</span></div>
      </div>

      <div class="wave">
        <div class="label">Bhramari<span class="lo">bee · nasal</span></div>
        <svg viewBox="0 0 800 80" preserveAspectRatio="none" aria-hidden="true">
          <defs>
            <linearGradient id="w3" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="#9b6bff" stop-opacity="0.0"/>
              <stop offset="12%" stop-color="#c4a3ff" stop-opacity="1"/>
              <stop offset="88%" stop-color="#9b6bff" stop-opacity="1"/>
              <stop offset="100%" stop-color="#9b6bff" stop-opacity="0.0"/>
            </linearGradient>
          </defs>
          <!-- 220 Hz: ~9 cycles, tighter still, slightly smaller amplitude -->
          <path d="M 0 40
                   Q 22 14 44 40 T 88 40 T 132 40 T 176 40 T 220 40 T 264 40 T 308 40 T 352 40
                   T 396 40 T 440 40 T 484 40 T 528 40 T 572 40 T 616 40 T 660 40 T 704 40 T 748 40 T 800 40"
                stroke="url(#w3)" stroke-width="1.8" fill="none" stroke-linecap="round"/>
        </svg>
        <div class="hz">220 Hz<span class="small">violet</span></div>
      </div>
    </div>

    <div class="bottom">
      <span>THREE TONES</span>
      <span class="center">ONE PRACTICE</span>
      <span>90 SECONDS A DAY</span>
    </div>
  </div>
</body>
</html>
