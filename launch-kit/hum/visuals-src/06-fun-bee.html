<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1080, initial-scale=1" />
<title>HUM · Bhramari (bee breath)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
  :root{
    --noir:#0a0a0e; --noir-2:#13131a; --noir-3:#1d1d27;
    --violet:#9b6bff; --violet-deep:#6b3fc4; --violet-soft:#c4a3ff;
    --silver:#d8d8e2; --silver-bright:#f0f0f8; --silver-dim:#8a8a98;
    --text:#ede8f5; --text-2:#a8a4b5; --text-3:#6a6878;
    --weave:linear-gradient(135deg,#9b6bff 0%,#d8d8e2 50%,#9b6bff 100%);
    --font-display:'Cormorant Garamond',Georgia,serif;
    --font-ui:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    --font-mono:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{margin:0;background:#000;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:var(--font-ui);color:var(--text);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  .frame{
    position:relative;width:1080px;height:1080px;overflow:hidden;
    background:
      radial-gradient(1200px 600px at 50% -100px, rgba(155,107,255,0.12), transparent 70%),
      radial-gradient(900px 500px at 50% 110%, rgba(216,216,226,0.08), transparent 70%),
      var(--noir);
    padding:88px 88px 80px;
    display:flex;flex-direction:column;align-items:center;text-align:center;
  }
  .top{
    width:100%;display:flex;align-items:center;justify-content:space-between;
  }
  .mark{display:flex;align-items:center;gap:14px}
  .mark svg{width:28px;height:28px}
  .mark .word{font-family:var(--font-display);font-weight:600;font-size:22px;letter-spacing:0.04em;color:var(--silver-bright)}
  .eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:0.28em;text-transform:uppercase;color:var(--text-3)}
  .word-main{
    font-family:var(--font-display);font-weight:500;font-style:italic;font-size:148px;line-height:1;letter-spacing:-0.02em;
    background:var(--weave);-webkit-background-clip:text;background-clip:text;color:transparent;margin-top:44px;
  }
  .word-sub{
    font-family:var(--font-mono);font-size:13px;letter-spacing:0.32em;text-transform:uppercase;color:var(--text-2);
    margin-top:18px;
  }
  .bee{
    margin-top:36px;width:560px;height:420px;position:relative;
    display:flex;align-items:center;justify-content:center;
  }
  .bee svg{width:100%;height:100%}
  .poem{
    margin-top:40px;
    font-family:var(--font-display);font-weight:400;font-size:40px;line-height:1.3;color:var(--text);
    max-width:24ch;font-style:italic;
  }
  .poem .accent{
    background:var(--weave);-webkit-background-clip:text;background-clip:text;color:transparent;font-style:italic;
  }
  .bottom{
    margin-top:auto;width:100%;display:flex;justify-content:space-between;align-items:center;
    font-family:var(--font-mono);font-size:11px;letter-spacing:0.24em;text-transform:uppercase;color:var(--text-3);
  }
</style>
</head>
<body>
  <div class="frame">
    <div class="top">
      <div class="mark">
        <svg viewBox="0 0 40 40" aria-hidden="true">
          <defs>
            <linearGradient id="bm" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#9b6bff"/><stop offset="100%" stop-color="#d8d8e2"/>
            </linearGradient>
          </defs>
          <path d="M6 20 Q13 8 20 20 T34 20" stroke="url(#bm)" stroke-width="2.4" fill="none" stroke-linecap="round"/>
          <path d="M6 20 Q13 32 20 20 T34 20" stroke="#d8d8e2" stroke-width="1.6" fill="none" stroke-linecap="round" opacity="0.6"/>
        </svg>
        <span class="word">HUM</span>
      </div>
      <span class="eyebrow">The lineage</span>
    </div>

    <h1 class="word-main">Bhramari</h1>
    <div class="word-sub">( bee&nbsp;breath )</div>

    <div class="bee">
      <svg viewBox="0 0 560 420" aria-hidden="true">
        <defs>
          <linearGradient id="beeV" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#6b3fc4" stop-opacity="0.0"/>
            <stop offset="20%" stop-color="#9b6bff" stop-opacity="1"/>
            <stop offset="80%" stop-color="#9b6bff" stop-opacity="1"/>
            <stop offset="100%" stop-color="#6b3fc4" stop-opacity="0.0"/>
          </linearGradient>
          <linearGradient id="beeS" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#d8d8e2" stop-opacity="0.0"/>
            <stop offset="20%" stop-color="#d8d8e2" stop-opacity="0.9"/>
            <stop offset="80%" stop-color="#f0f0f8" stop-opacity="0.9"/>
            <stop offset="100%" stop-color="#d8d8e2" stop-opacity="0.0"/>
          </linearGradient>
          <linearGradient id="wing" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#c4a3ff" stop-opacity="0.55"/>
            <stop offset="100%" stop-color="#6b3fc4" stop-opacity="0.05"/>
          </linearGradient>
          <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0%" stop-color="#9b6bff" stop-opacity="0.18"/>
            <stop offset="60%" stop-color="#9b6bff" stop-opacity="0.04"/>
            <stop offset="100%" stop-color="#9b6bff" stop-opacity="0"/>
          </radialGradient>
        </defs>

        <!-- vibration halo behind the bee -->
        <circle cx="280" cy="220" r="200" fill="url(#halo)"/>
        <ellipse cx="280" cy="220" rx="240" ry="80" fill="none" stroke="rgba(216,216,226,0.08)" stroke-width="1"/>
        <ellipse cx="280" cy="220" rx="200" ry="68" fill="none" stroke="rgba(216,216,226,0.12)" stroke-width="1"/>
        <ellipse cx="280" cy="220" rx="160" ry="56" fill="none" stroke="rgba(155,107,255,0.18)" stroke-width="1"/>

        <!-- wings (violet, translucent) -->
        <ellipse cx="220" cy="160" rx="80" ry="42" fill="url(#wing)" stroke="rgba(196,163,255,0.4)" stroke-width="1" transform="rotate(-22 220 160)"/>
        <ellipse cx="340" cy="160" rx="80" ry="42" fill="url(#wing)" stroke="rgba(196,163,255,0.4)" stroke-width="1" transform="rotate(22 340 160)"/>

        <!-- two intertwined waveforms forming the body -->
        <!-- the body baseline is around y=240; waveforms weave through it -->
        <path d="M 120 240 Q 160 200, 200 240 T 280 240 T 360 240 T 440 240"
              stroke="url(#beeV)" stroke-width="14" fill="none" stroke-linecap="round" opacity="0.95"/>
        <path d="M 120 240 Q 160 280, 200 240 T 280 240 T 360 240 T 440 240"
              stroke="url(#beeS)" stroke-width="10" fill="none" stroke-linecap="round" opacity="0.85"/>

        <!-- subtle inner gloss waveform -->
        <path d="M 140 240 Q 175 215, 210 240 T 290 240 T 370 240 T 430 240"
              stroke="rgba(240,240,248,0.5)" stroke-width="1.6" fill="none" stroke-linecap="round"/>

        <!-- head/antenna gesture: small circle + two tiny curves -->
        <circle cx="118" cy="240" r="22" fill="none" stroke="url(#beeV)" stroke-width="2.5"/>
        <circle cx="118" cy="240" r="22" fill="rgba(155,107,255,0.08)"/>
        <path d="M 102 224 Q 96 208, 92 196" stroke="rgba(216,216,226,0.7)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
        <path d="M 106 220 Q 104 204, 108 192" stroke="rgba(216,216,226,0.7)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
        <circle cx="92" cy="196" r="2" fill="#d8d8e2"/>
        <circle cx="108" cy="192" r="2" fill="#d8d8e2"/>

        <!-- tail taper -->
        <path d="M 440 240 Q 460 232, 478 240 Q 462 248, 440 240 Z" fill="rgba(155,107,255,0.55)"/>

        <!-- vibration dots radiating -->
        <circle cx="40" cy="220" r="2" fill="#9b6bff" opacity="0.6"/>
        <circle cx="58" cy="200" r="1.5" fill="#9b6bff" opacity="0.45"/>
        <circle cx="58" cy="280" r="1.5" fill="#d8d8e2" opacity="0.5"/>
        <circle cx="520" cy="220" r="2" fill="#9b6bff" opacity="0.6"/>
        <circle cx="500" cy="280" r="1.5" fill="#9b6bff" opacity="0.45"/>
        <circle cx="500" cy="200" r="1.5" fill="#d8d8e2" opacity="0.5"/>
      </svg>
    </div>

    <p class="poem">A 2,500-year-old hum, <span class="accent">still in your chest.</span></p>

    <div class="bottom">
      <span>LINEAGE NOTE · /HUM/LINEAGE</span>
      <span>RHYTHMIXAPP.COM.AU / HUM</span>
    </div>
  </div>
</body>
</html>
