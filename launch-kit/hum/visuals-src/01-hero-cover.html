<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1280, initial-scale=1" />
<title>HUM · Hero cover</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" />
<style>
  :root {
    --noir:#0a0a0e; --noir-2:#13131a; --noir-3:#1d1d27;
    --violet:#9b6bff; --violet-deep:#6b3fc4; --violet-soft:#c4a3ff;
    --silver:#d8d8e2; --silver-bright:#f0f0f8; --silver-dim:#8a8a98;
    --text:#ede8f5; --text-2:#a8a4b5; --text-3:#6a6878;
    --weave:linear-gradient(135deg,#9b6bff 0%,#d8d8e2 50%,#9b6bff 100%);
    --font-display:'Cormorant Garamond',Georgia,serif;
    --font-ui:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    --font-mono:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{margin:0;background:#000;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:var(--font-ui);color:var(--text);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  .frame{
    position:relative;width:1280px;height:720px;overflow:hidden;
    background:
      radial-gradient(1200px 600px at 50% -100px, rgba(155,107,255,0.12), transparent 70%),
      radial-gradient(900px 500px at 50% 110%, rgba(216,216,226,0.08), transparent 70%),
      var(--noir);
  }
  /* very subtle grain via two layered noise-less gradients */
  .frame::after{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:
      radial-gradient(1px 1px at 20% 30%, rgba(216,216,226,0.04), transparent 50%),
      radial-gradient(1px 1px at 80% 70%, rgba(155,107,255,0.05), transparent 50%);
  }
  .grid{
    position:absolute;inset:0;display:grid;grid-template-columns: 1.05fr 0.95fr;align-items:center;
    padding:72px 96px;gap:48px;
  }
  .left{display:flex;flex-direction:column;gap:30px;max-width:640px;z-index:2}
  .eyebrow{
    font-family:var(--font-mono);font-size:11px;letter-spacing:0.28em;text-transform:uppercase;
    color:var(--violet-soft);display:inline-flex;align-items:center;gap:14px;
  }
  .eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--violet);box-shadow:0 0 12px var(--violet)}
  .title{
    font-family:var(--font-display);font-weight:600;font-size:148px;line-height:0.95;letter-spacing:-0.015em;
    color:var(--silver-bright);
  }
  .title .italic{
    font-style:italic;font-weight:500;
    background:var(--weave);-webkit-background-clip:text;background-clip:text;color:transparent;
    display:block;margin-top:6px;
  }
  .tag{
    color:var(--text-2);font-size:21px;line-height:1.55;font-weight:300;max-width:32ch;
  }
  .row{display:flex;align-items:center;gap:20px;margin-top:8px}
  .pay-chip{
    display:inline-flex;align-items:center;gap:12px;
    padding:11px 20px;border-radius:999px;
    background:var(--noir-2);border:1px solid color-mix(in srgb, var(--violet) 30%, var(--noir-3));
    font-family:var(--font-mono);font-size:11px;letter-spacing:0.22em;text-transform:uppercase;color:var(--silver-bright);
  }
  .pay-chip .num{color:var(--violet-soft);font-weight:700;letter-spacing:0;text-transform:none;font-size:14px}
  .pay-chip .sep{color:var(--text-3)}
  .right{position:relative;display:flex;align-items:center;justify-content:center;height:100%}
  .orb{
    width:520px;height:520px;border-radius:50%;
    position:relative;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 45%, rgba(155,107,255,0.18), rgba(155,107,255,0.04) 55%, transparent 70%);
    box-shadow:0 0 80px rgba(155,107,255,0.25), inset 0 0 80px rgba(155,107,255,0.05);
  }
  .orb svg{width:100%;height:100%;display:block;position:relative}
  .ring{
    position:absolute;border-radius:50%;border:1px solid var(--noir-3);
  }
  .ring.r1{inset:-12px;border-color:rgba(155,107,255,0.12)}
  .ring.r2{inset:-44px;border-color:rgba(216,216,226,0.06)}
  .ring.r3{inset:-90px;border-color:rgba(216,216,226,0.03)}
  .footer{
    position:absolute;left:96px;right:96px;bottom:48px;
    display:flex;justify-content:space-between;align-items:center;
    font-family:var(--font-mono);font-size:10px;letter-spacing:0.24em;text-transform:uppercase;color:var(--text-3);
  }
  .footer .mark{display:flex;align-items:center;gap:10px}
  .footer .mark svg{width:18px;height:18px}
</style>
</head>
<body>
  <div class="frame">
    <div class="grid">
      <div class="left">
        <span class="eyebrow"><span class="dot"></span>RHYTHMIX presents</span>
        <h1 class="title">HUM.<span class="italic">A practice.</span></h1>
        <p class="tag">A pocket lab for humming — voice-guided, on-device, daily.</p>
        <div class="row">
          <div class="pay-chip"><span>Lifetime</span><span class="num">AU$30</span><span class="sep">·</span><span>One payment</span></div>
        </div>
      </div>
      <div class="right">
        <div class="orb">
          <span class="ring r1"></span><span class="ring r2"></span><span class="ring r3"></span>
          <svg viewBox="0 0 200 200" aria-hidden="true">
            <defs>
              <linearGradient id="covV" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#9b6bff"/><stop offset="100%" stop-color="#6b3fc4"/>
              </linearGradient>
              <linearGradient id="covS" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#d8d8e2"/><stop offset="100%" stop-color="#8a8a98"/>
              </linearGradient>
              <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
                <stop offset="0%" stop-color="#c4a3ff" stop-opacity="0.35"/>
                <stop offset="60%" stop-color="#9b6bff" stop-opacity="0.05"/>
                <stop offset="100%" stop-color="#9b6bff" stop-opacity="0"/>
              </radialGradient>
            </defs>
            <circle cx="100" cy="100" r="60" fill="url(#core)"/>
            <circle cx="100" cy="100" r="78" fill="none" stroke="url(#covV)" stroke-width="1.6" opacity="0.85"/>
            <ellipse cx="100" cy="100" rx="78" ry="30" fill="none" stroke="url(#covS)" stroke-width="1.5" opacity="0.9"/>
            <ellipse cx="100" cy="100" rx="78" ry="30" fill="none" stroke="url(#covV)" stroke-width="1.3" opacity="0.85" transform="rotate(60 100 100)"/>
            <ellipse cx="100" cy="100" rx="78" ry="30" fill="none" stroke="url(#covS)" stroke-width="1.2" opacity="0.7" transform="rotate(120 100 100)"/>
            <circle cx="100" cy="100" r="3" fill="#f0f0f8" opacity="0.9"/>
          </svg>
        </div>
      </div>
    </div>
    <div class="footer">
      <div class="mark">
        <svg viewBox="0 0 40 40" aria-hidden="true">
          <defs>
            <linearGradient id="fm" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#9b6bff"/><stop offset="100%" stop-color="#d8d8e2"/>
            </linearGradient>
          </defs>
          <path d="M6 20 Q13 8 20 20 T34 20" stroke="url(#fm)" stroke-width="2.2" fill="none" stroke-linecap="round"/>
          <path d="M6 20 Q13 32 20 20 T34 20" stroke="#d8d8e2" stroke-width="1.4" fill="none" stroke-linecap="round" opacity="0.6"/>
        </svg>
        <span>HUM</span>
      </div>
      <span>RHYTHMIXAPP.COM.AU / HUM</span>
      <span>ON-DEVICE · DAILY</span>
    </div>
  </div>
</body>
</html>
