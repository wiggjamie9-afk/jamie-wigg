<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1080, initial-scale=1" />
<title>HUM · What it's good for</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" />
<style>
  :root{
    --noir:#0a0a0e; --noir-2:#13131a; --noir-3:#1d1d27;
    --violet:#9b6bff; --violet-deep:#6b3fc4; --violet-soft:#c4a3ff;
    --silver:#d8d8e2; --silver-bright:#f0f0f8; --silver-dim:#8a8a98;
    --text:#ede8f5; --text-2:#a8a4b5; --text-3:#6a6878;
    --weave:linear-gradient(135deg,#9b6bff 0%,#d8d8e2 50%,#9b6bff 100%);
    --font-display:'Cormorant Garamond',Georgia,serif;
    --font-ui:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    --font-mono:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{margin:0;background:#000;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:var(--font-ui);color:var(--text);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  .frame{
    position:relative;width:1080px;height:1080px;overflow:hidden;
    background:
      radial-gradient(1200px 600px at 50% -100px, rgba(155,107,255,0.12), transparent 70%),
      radial-gradient(900px 500px at 50% 110%, rgba(216,216,226,0.08), transparent 70%),
      var(--noir);
    padding:96px 96px 80px;
    display:flex;flex-direction:column;
  }
  .top{display:flex;align-items:center;justify-content:space-between}
  .mark{display:flex;align-items:center;gap:14px}
  .mark svg{width:28px;height:28px}
  .mark .word{font-family:var(--font-display);font-weight:600;font-size:22px;letter-spacing:0.04em;color:var(--silver-bright)}
  .eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:0.28em;text-transform:uppercase;color:var(--text-3)}
  .title{
    font-family:var(--font-display);font-weight:600;font-size:104px;line-height:1;letter-spacing:-0.015em;
    color:var(--silver-bright);margin-top:48px;
  }
  .title .italic{
    font-style:italic;font-weight:500;
    background:var(--weave);-webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .claims{margin-top:84px;display:flex;flex-direction:column;gap:28px}
  .claim{
    display:flex;align-items:baseline;gap:28px;
    font-family:var(--font-display);font-weight:400;font-size:50px;line-height:1.18;color:var(--text);
    padding-bottom:24px;border-bottom:1px solid var(--noir-3);
  }
  .claim:last-of-type{border-bottom:0}
  .claim .glyph{
    width:14px;height:14px;flex-shrink:0;border-radius:50%;
    background:radial-gradient(circle at 35% 35%, var(--violet-soft), var(--violet-deep) 80%);
    box-shadow:0 0 14px rgba(155,107,255,0.45);
    position:relative;top:14px;
  }
  .claim .num{
    color:var(--violet-soft);font-style:italic;font-weight:500;
    background:var(--weave);-webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .disclaimer{
    margin-top:auto;padding-top:32px;border-top:1px solid var(--noir-3);
    display:flex;justify-content:space-between;align-items:center;gap:24px;
    font-family:var(--font-mono);font-size:11px;letter-spacing:0.24em;text-transform:uppercase;color:var(--text-3);
  }
</style>
</head>
<body>
  <div class="frame">
    <div class="top">
      <div class="mark">
        <svg viewBox="0 0 40 40" aria-hidden="true">
          <defs>
            <linearGradient id="bm" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#9b6bff"/><stop offset="100%" stop-color="#d8d8e2"/>
            </linearGradient>
          </defs>
          <path d="M6 20 Q13 8 20 20 T34 20" stroke="url(#bm)" stroke-width="2.4" fill="none" stroke-linecap="round"/>
          <path d="M6 20 Q13 32 20 20 T34 20" stroke="#d8d8e2" stroke-width="1.6" fill="none" stroke-linecap="round" opacity="0.6"/>
        </svg>
        <span class="word">HUM</span>
      </div>
      <span class="eyebrow">A daily quiet ritual</span>
    </div>

    <h1 class="title">What it's <span class="italic">good for.</span></h1>

    <div class="claims">
      <div class="claim"><span class="glyph"></span><span>Calms the nervous system.</span></div>
      <div class="claim"><span class="glyph"></span><span>Vagal-tone training.</span></div>
      <div class="claim"><span class="glyph"></span><span>Supports nasal breathing.</span></div>
      <div class="claim"><span class="glyph"></span><span>Boosts sinus nitric oxide <span class="num">(~15&times;)</span>.</span></div>
      <div class="claim"><span class="glyph"></span><span>Quiet daily ritual.</span></div>
    </div>

    <div class="disclaimer">
      <span>WELLNESS PRACTICE · NOT A MEDICAL DEVICE</span>
      <span>RHYTHMIXAPP.COM.AU / HUM</span>
    </div>
  </div>
</body>
</html>
