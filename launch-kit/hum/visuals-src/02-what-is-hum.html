<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1080, initial-scale=1" />
<title>HUM · What is HUM?</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
  :root{
    --noir:#0a0a0e; --noir-2:#13131a; --noir-3:#1d1d27;
    --violet:#9b6bff; --violet-deep:#6b3fc4; --violet-soft:#c4a3ff;
    --silver:#d8d8e2; --silver-bright:#f0f0f8; --silver-dim:#8a8a98;
    --text:#ede8f5; --text-2:#a8a4b5; --text-3:#6a6878;
    --weave:linear-gradient(135deg,#9b6bff 0%,#d8d8e2 50%,#9b6bff 100%);
    --font-display:'Cormorant Garamond',Georgia,serif;
    --font-ui:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    --font-mono:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{margin:0;background:#000;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:var(--font-ui);color:var(--text);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  .frame{
    position:relative;width:1080px;height:1080px;overflow:hidden;
    background:
      radial-gradient(1200px 600px at 50% -100px, rgba(155,107,255,0.12), transparent 70%),
      radial-gradient(900px 500px at 50% 110%, rgba(216,216,226,0.08), transparent 70%),
      var(--noir);
    padding:96px;
    display:flex;flex-direction:column;
  }
  .top{display:flex;align-items:center;justify-content:space-between}
  .eyebrow{
    font-family:var(--font-mono);font-size:13px;letter-spacing:0.3em;text-transform:uppercase;
    color:var(--text-3);
  }
  .mark{display:flex;align-items:center;gap:14px}
  .mark svg{width:30px;height:30px}
  .mark .word{font-family:var(--font-display);font-weight:600;font-size:22px;letter-spacing:0.04em;color:var(--silver-bright)}
  .title{
    font-family:var(--font-display);font-weight:600;font-size:148px;line-height:0.98;letter-spacing:-0.015em;
    color:var(--silver-bright);margin-top:64px;
  }
  .title .italic{
    font-style:italic;font-weight:500;
    background:var(--weave);-webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .qmark{color:var(--text-3);font-weight:500;font-style:normal;background:none;-webkit-text-fill-color:initial}
  .lines{margin-top:96px;display:flex;flex-direction:column;gap:36px;max-width:760px}
  .line{
    display:flex;align-items:baseline;gap:32px;
    font-family:var(--font-display);font-weight:400;font-size:54px;line-height:1.15;color:var(--text);
  }
  .line .n{
    font-family:var(--font-mono);font-size:14px;letter-spacing:0.2em;color:var(--violet-soft);
    width:36px;flex-shrink:0;padding-top:14px;
  }
  .bottom{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:28px}
  .pay-chip{
    display:inline-flex;align-items:center;gap:12px;
    padding:11px 20px;border-radius:999px;
    background:var(--noir-2);border:1px solid color-mix(in srgb, var(--violet) 30%, var(--noir-3));
    font-family:var(--font-mono);font-size:11px;letter-spacing:0.22em;text-transform:uppercase;color:var(--silver-bright);
  }
  .pay-chip .num{color:var(--violet-soft);font-weight:700;letter-spacing:0;text-transform:none;font-size:14px}
  .pay-chip .sep{color:var(--text-3)}
  .url{font-family:var(--font-mono);font-size:11px;letter-spacing:0.24em;text-transform:uppercase;color:var(--text-3)}
</style>
</head>
<body>
  <div class="frame">
    <div class="top">
      <div class="mark">
        <svg viewBox="0 0 40 40" aria-hidden="true">
          <defs>
            <linearGradient id="bm" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#9b6bff"/><stop offset="100%" stop-color="#d8d8e2"/>
            </linearGradient>
          </defs>
          <path d="M6 20 Q13 8 20 20 T34 20" stroke="url(#bm)" stroke-width="2.4" fill="none" stroke-linecap="round"/>
          <path d="M6 20 Q13 32 20 20 T34 20" stroke="#d8d8e2" stroke-width="1.6" fill="none" stroke-linecap="round" opacity="0.6"/>
        </svg>
        <span class="word">HUM</span>
      </div>
      <span class="eyebrow">A pocket practice</span>
    </div>

    <h1 class="title">What is <span class="italic">HUM</span><span class="qmark">?</span></h1>

    <div class="lines">
      <div class="line"><span class="n">01</span><span>A daily humming practice.</span></div>
      <div class="line"><span class="n">02</span><span>Voice-guided. Breath-paced.</span></div>
      <div class="line"><span class="n">03</span><span>Kept on your phone.</span></div>
    </div>

    <div class="bottom">
      <div class="pay-chip"><span>Lifetime</span><span class="num">AU$30</span><span class="sep">·</span><span>One payment</span></div>
      <span class="url">RHYTHMIXAPP.COM.AU / HUM</span>
    </div>
  </div>
</body>
</html>
