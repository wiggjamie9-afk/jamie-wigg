<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1080, initial-scale=1" />
<title>RHYTHMIX LIVE · Video poster</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
  :root{
    --canvas:#08050d; --card:#1a1325;
    --magenta:#ff1f5a; --purple:#7c3aed; --cyan:#00d8ff; --green:#00e887;
    --gold:#f5c000; --pink:#ff6fc8;
    --white:#ffffff; --muted:#a0a0b0; --mono-dim:#6a6878;
    --spectrum: linear-gradient(90deg, #ff1f5a 0%, #7c3aed 35%, #00d8ff 70%, #00e887 100%);
    --font-display:'Space Grotesk', system-ui, sans-serif;
    --font-mono:'JetBrains Mono', monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{margin:0;background:#000;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:var(--font-display);color:var(--white)}
  .frame{
    position:relative;width:1080px;height:1920px;overflow:hidden;
    background:
      radial-gradient(1400px 700px at 50% -120px, rgba(124,58,237,0.28), transparent 70%),
      radial-gradient(1100px 600px at 50% 110%, rgba(255,31,90,0.18), transparent 70%),
      var(--canvas);
  }
  .top{
    position:absolute;left:0;right:0;top:120px;display:flex;justify-content:center;
  }
  .eyebrow{font-family:var(--font-mono);font-size:22px;letter-spacing:0.32em;text-transform:uppercase;color:var(--cyan);display:flex;align-items:center;gap:16px}
  .eyebrow .dot{width:12px;height:12px;border-radius:50%;background:var(--green);box-shadow:0 0 16px var(--green)}

  .stage{
    position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 80px;
  }
  .wordmark{
    font-family:var(--font-display);font-weight:700;font-size:280px;line-height:0.88;letter-spacing:-0.035em;text-align:center;
  }
  .wordmark .live{
    background:var(--spectrum);-webkit-background-clip:text;background-clip:text;color:transparent;display:block;
  }
  .wordmark .dot{color:var(--magenta)}

  .sub{
    margin-top:40px;font-family:var(--font-display);font-weight:500;font-size:54px;line-height:1.18;letter-spacing:-0.015em;
    text-align:center;color:var(--white);
  }
  .sub em{font-style:normal;color:var(--magenta);font-weight:700}

  .wave-strip{
    margin-top:80px;width:880px;height:160px;
  }
  .wave-strip svg{width:100%;height:100%}

  .badges{
    margin-top:60px;display:flex;flex-direction:column;align-items:center;gap:18px;
  }
  .chip{
    display:inline-flex;align-items:center;gap:14px;padding:18px 28px;border-radius:999px;
    border:1px solid rgba(255,31,90,0.5);background:rgba(255,31,90,0.06);
    font-family:var(--font-mono);font-size:18px;letter-spacing:0.22em;text-transform:uppercase;color:var(--white);font-weight:700;
  }
  .chip .price{font-family:var(--font-display);font-weight:700;letter-spacing:0.02em;color:var(--magenta);font-size:22px}

  .play{
    position:absolute;left:50%;bottom:340px;transform:translateX(-50%);
    width:160px;height:160px;border-radius:50%;
    background:rgba(255,31,90,0.14);
    border:2px solid var(--magenta);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 60px rgba(255,31,90,0.4);
  }
  .play svg{width:60px;height:60px}

  .footer{
    position:absolute;left:0;right:0;bottom:120px;display:flex;flex-direction:column;align-items:center;gap:18px;
    font-family:var(--font-mono);font-size:22px;letter-spacing:0.28em;text-transform:uppercase;color:var(--white);
  }
  .footer .small{color:var(--mono-dim);font-size:16px;letter-spacing:0.22em}
</style>
</head>
<body>
  <div class="frame">
    <div class="top">
      <div class="eyebrow"><span class="dot"></span>RHYTHMIX presents</div>
    </div>

    <div class="stage">
      <div class="wordmark">
        <span class="live">LIVE</span><span class="dot">.</span>
      </div>
      <div class="sub">Made the song.<br><em>Now make the moment.</em></div>

      <div class="wave-strip">
        <svg viewBox="0 0 880 160" preserveAspectRatio="none" aria-hidden="true">
          <defs>
            <linearGradient id="pw" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="#ff1f5a"/>
              <stop offset="35%" stop-color="#7c3aed"/>
              <stop offset="70%" stop-color="#00d8ff"/>
              <stop offset="100%" stop-color="#00e887"/>
            </linearGradient>
            <filter id="pwglow" x="-10%" y="-10%" width="120%" height="120%">
              <feGaussianBlur stdDeviation="4" result="b"/>
              <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
          </defs>
          <line x1="0" y1="80" x2="880" y2="80" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
          <path
            d="M0,80 L40,40 L80,120 L120,28 L160,132 L200,60 L240,100 L280,20 L320,140 L360,68 L400,112 L440,40 L480,120 L520,52 L560,108 L600,28 L640,132 L680,68 L720,112 L760,52 L800,108 L840,80 L880,80"
            stroke="url(#pw)" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#pwglow)"
          />
          <g stroke="#fff" stroke-width="1.5" opacity="0.85">
            <line x1="120" y1="10" x2="120" y2="150"/>
            <line x1="280" y1="10" x2="280" y2="150"/>
            <line x1="440" y1="10" x2="440" y2="150"/>
            <line x1="600" y1="10" x2="600" y2="150"/>
            <line x1="760" y1="10" x2="760" y2="150"/>
          </g>
          <g fill="#ff1f5a" filter="url(#pwglow)">
            <circle cx="120" cy="80" r="6"/>
            <circle cx="280" cy="80" r="6"/>
            <circle cx="440" cy="80" r="6"/>
            <circle cx="600" cy="80" r="6"/>
            <circle cx="760" cy="80" r="6"/>
          </g>
        </svg>
      </div>

      <div class="badges">
        <div class="chip"><span>PRO</span><span class="price">$19/mo</span><span>·</span><span>3 FORMATS</span></div>
      </div>
    </div>

    <div class="play" aria-hidden="true">
      <svg viewBox="0 0 60 60"><path d="M22,14 L48,30 L22,46 Z" fill="#ff1f5a"/></svg>
    </div>

    <div class="footer">
      <span>RHYTHMIX LIVE</span>
      <span class="small">RHYTHMIXAPP.COM.AU / LIVE</span>
    </div>
  </div>
</body>
</html>
