<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RHYTHMIX LIVE · price tease (3s)</title>
<meta name="viewport" content="width=1080, initial-scale=1">
<script>
  (function () {
    var p = new URLSearchParams(location.search);
    var raw = p.get('frame');
    var f = raw === null ? 0 : Math.max(0, Math.min(89, parseInt(raw, 10) || 0));
    var t = f / 89;
    function clamp01(x){ return Math.max(0, Math.min(1, x)); }
    var seg1 = clamp01(f / 30);
    var seg2 = clamp01((f - 30) / 30);
    var seg3 = clamp01((f - 60) / 29);
    var r = document.documentElement;
    r.style.setProperty('--t', t.toFixed(5));
    r.style.setProperty('--seg1', seg1.toFixed(5));
    r.style.setProperty('--seg2', seg2.toFixed(5));
    r.style.setProperty('--seg3', seg3.toFixed(5));
  })();
</script>
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
  :root{
    --canvas:#08050d; --card:#1a1325;
    --magenta:#ff1f5a; --purple:#7c3aed; --cyan:#00d8ff; --green:#00e887;
    --gold:#f5c000;
    --white:#ffffff; --muted:#a0a0b0; --mono-dim:#6a6878;
    --spectrum: linear-gradient(90deg, #ff1f5a 0%, #7c3aed 35%, #00d8ff 70%, #00e887 100%);
    --t:0; --seg1:0; --seg2:0; --seg3:0;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{margin:0;padding:0;background:var(--canvas);font-family:'Space Grotesk',system-ui,sans-serif;color:var(--white)}
  .frame{
    position:relative;width:1080px;height:1920px;overflow:hidden;background:var(--canvas);
  }
  .halo-top{position:absolute;inset:0;pointer-events:none;background:radial-gradient(1400px 700px at 50% -120px, rgba(124,58,237,0.22), transparent 70%)}
  .halo-bottom{position:absolute;inset:0;pointer-events:none;background:radial-gradient(1100px 600px at 50% 110%, rgba(255,31,90,0.16), transparent 70%)}

  .stage{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 80px}

  /* Wordmark stack: appears in seg1, holds */
  .wordmark{
    font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:200px;line-height:0.92;letter-spacing:-0.03em;text-align:center;
    opacity:calc(var(--seg1));
    transform:translateY(calc((1 - var(--seg1)) * 30px));
    margin-bottom:60px;
  }
  .wordmark .live{
    background:var(--spectrum);-webkit-background-clip:text;background-clip:text;color:transparent;display:block;
  }
  .wordmark .small{font-size:48px;font-weight:500;color:var(--cyan);letter-spacing:0.04em;font-family:'JetBrains Mono',monospace;display:block;margin-bottom:24px;text-transform:uppercase}

  /* Price block — appears in seg2 */
  .price-block{
    display:flex;flex-direction:column;align-items:center;gap:24px;
    opacity:calc(var(--seg2));
    transform:scale(calc(0.85 + var(--seg2) * 0.15));
  }
  .price{
    font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:280px;line-height:0.9;letter-spacing:-0.03em;
    color:var(--magenta);
    text-shadow:0 0 60px rgba(255,31,90,0.6);
  }
  .price .mo{font-size:64px;color:var(--muted);font-weight:500;letter-spacing:0}
  .price-label{font-family:'JetBrains Mono',monospace;font-size:32px;letter-spacing:0.28em;text-transform:uppercase;color:var(--white)}

  /* "Now what?" answer line — appears in seg3 */
  .answer{
    margin-top:80px;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:88px;line-height:1.05;letter-spacing:-0.02em;text-align:center;
    color:var(--white);
    opacity:calc(var(--seg3));
    transform:translateY(calc((1 - var(--seg3)) * 30px));
  }
  .answer em{font-style:normal;color:var(--green)}

  .footer{
    position:absolute;left:0;right:0;bottom:140px;
    display:flex;flex-direction:column;align-items:center;gap:18px;
    opacity:calc(0.4 + var(--seg3) * 0.6);
  }
  .url{font-family:'JetBrains Mono',monospace;font-size:26px;letter-spacing:0.24em;text-transform:uppercase;color:var(--mono-dim)}
</style>
</head>
<body>
  <div class="frame">
    <div class="halo-top"></div>
    <div class="halo-bottom"></div>

    <div class="stage">
      <div class="wordmark">
        <span class="small">RHYTHMIX</span>
        <span class="live">LIVE.</span>
      </div>

      <div class="price-block">
        <div class="price-label">PRO TIER</div>
        <div class="price">$19<span class="mo">/mo</span></div>
      </div>

      <div class="answer">"Now what?"<br><em>Answered.</em></div>
    </div>

    <div class="footer">
      <div class="url">RHYTHMIXAPP.COM.AU / LIVE</div>
    </div>
  </div>
</body>
</html>
