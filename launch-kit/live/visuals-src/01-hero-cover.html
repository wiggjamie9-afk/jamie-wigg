<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1280, initial-scale=1" />
<title>RHYTHMIX LIVE · Hero cover</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
  :root {
    --canvas:#08050d; --card:#1a1325;
    --magenta:#ff1f5a; --purple:#7c3aed; --cyan:#00d8ff; --green:#00e887;
    --gold:#f5c000; --pink:#ff6fc8;
    --white:#ffffff; --muted:#a0a0b0; --mono-dim:#6a6878;
    --spectrum: linear-gradient(90deg, #ff1f5a 0%, #7c3aed 35%, #00d8ff 70%, #00e887 100%);
    --font-display:'Space Grotesk', system-ui, sans-serif;
    --font-mono:'JetBrains Mono', monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{margin:0;background:#000;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:var(--font-display);color:var(--white);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  .frame{
    position:relative;width:1280px;height:720px;overflow:hidden;
    background:
      radial-gradient(1400px 700px at 50% -120px, rgba(124,58,237,0.22), transparent 70%),
      radial-gradient(1100px 600px at 50% 110%, rgba(255,31,90,0.14), transparent 70%),
      var(--canvas);
  }
  /* Subtle scan line texture */
  .frame::after{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(0deg, rgba(255,255,255,0.012) 0 2px, transparent 2px 4px);
  }
  .grid{
    position:absolute;inset:0;display:grid;grid-template-columns: 1.1fr 0.9fr;align-items:center;
    padding:64px 88px;gap:48px;
  }
  .left{display:flex;flex-direction:column;gap:28px;max-width:680px;z-index:2}
  .eyebrow{
    font-family:var(--font-mono);font-size:13px;letter-spacing:0.28em;text-transform:uppercase;
    color:var(--cyan);display:inline-flex;align-items:center;gap:14px;
  }
  .eyebrow .dot{
    width:9px;height:9px;border-radius:50%;background:var(--green);
    box-shadow:0 0 12px var(--green), 0 0 24px rgba(0,232,135,0.5);
  }
  .title{
    font-family:var(--font-display);font-weight:700;font-size:148px;line-height:0.92;letter-spacing:-0.025em;
    color:var(--white);
  }
  .title .live{
    background:var(--spectrum);-webkit-background-clip:text;background-clip:text;color:transparent;
    display:inline-block;
  }
  .title .dot{color:var(--magenta);}
  .tag{
    color:var(--muted);font-size:22px;line-height:1.45;font-weight:400;max-width:36ch;
  }
  .tag em{color:var(--white);font-style:normal;font-weight:600}
  .row{display:flex;align-items:center;gap:14px;margin-top:8px;flex-wrap:wrap}
  .chip{
    display:inline-flex;align-items:center;gap:10px;
    padding:10px 18px;border-radius:8px;
    background:var(--card);border:1px solid rgba(124,58,237,0.4);
    font-family:var(--font-mono);font-size:11px;letter-spacing:0.18em;text-transform:uppercase;color:var(--white);
  }
  .chip .num{color:var(--magenta);font-weight:700;letter-spacing:0;text-transform:none;font-size:14px}
  .chip.green{border-color:rgba(0,232,135,0.4)} .chip.green .num{color:var(--green)}
  .chip.gold{border-color:rgba(245,192,0,0.4)} .chip.gold .num{color:var(--gold)}
  .right{position:relative;display:flex;align-items:center;justify-content:center;height:100%}

  /* Waveform with cut markers — signature visual */
  .wave-stage{
    position:relative;width:540px;height:540px;
    display:flex;align-items:center;justify-content:center;
  }
  .wave-stage::before{
    content:"";position:absolute;inset:-20px;border-radius:50%;
    background:radial-gradient(circle, rgba(124,58,237,0.18), transparent 60%);
    filter:blur(20px);
  }
  .wave-stage svg{width:100%;height:100%;display:block;position:relative;z-index:1}

  /* Three phone outlines around the wave to suggest 3 outputs */
  .phones{position:absolute;inset:0;pointer-events:none}
  .phone-mini{
    position:absolute;border:2px solid rgba(255,255,255,0.18);border-radius:14px;
    background:rgba(26,19,37,0.6);backdrop-filter:blur(2px);
  }
  .phone-mini::before{
    content:"";position:absolute;left:50%;top:6px;transform:translateX(-50%);
    width:30%;height:3px;background:#000;border-radius:2px;
  }
  .phone-9x16{width:60px;height:106px;top:30px;right:20px;border-color:rgba(255,31,90,0.55);box-shadow:0 0 24px rgba(255,31,90,0.3)}
  .phone-1x1{width:88px;height:88px;bottom:30px;right:60px;border-color:rgba(0,216,255,0.55);box-shadow:0 0 24px rgba(0,216,255,0.3);border-radius:8px}
  .phone-1x1::before{display:none}
  .phone-16x9{width:130px;height:74px;bottom:60px;left:20px;border-color:rgba(0,232,135,0.55);box-shadow:0 0 24px rgba(0,232,135,0.3);border-radius:6px}
  .phone-16x9::before{display:none}

  .footer{
    position:absolute;left:88px;right:88px;bottom:40px;
    display:flex;justify-content:space-between;align-items:center;
    font-family:var(--font-mono);font-size:11px;letter-spacing:0.22em;text-transform:uppercase;color:var(--mono-dim);
  }
  .footer .mark{display:flex;align-items:center;gap:12px}
  .footer .mark svg{width:38px;height:24px}
  .footer .mark .word{color:var(--white);font-family:var(--font-display);font-weight:700;letter-spacing:0.02em;font-size:13px}
</style>
</head>
<body>
  <div class="frame">
    <div class="grid">
      <div class="left">
        <span class="eyebrow"><span class="dot"></span>RHYTHMIX presents · NEW</span>
        <h1 class="title">LIVE<span class="dot">.</span></h1>
        <p class="tag">Made the song. <em>Now make the moment.</em> Beat-synced AI music videos for indie artists. Three formats. One pass.</p>
        <div class="row">
          <div class="chip"><span>Pro</span><span class="num">$19/mo</span></div>
          <div class="chip green"><span>Studio</span><span class="num">$49/mo</span></div>
          <div class="chip gold"><span>Free tier · 1 video/mo</span></div>
        </div>
      </div>
      <div class="right">
        <div class="wave-stage">
          <svg viewBox="0 0 540 540" aria-hidden="true">
            <defs>
              <linearGradient id="spec" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0%" stop-color="#ff1f5a"/>
                <stop offset="35%" stop-color="#7c3aed"/>
                <stop offset="70%" stop-color="#00d8ff"/>
                <stop offset="100%" stop-color="#00e887"/>
              </linearGradient>
              <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="3" result="b"/>
                <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
              </filter>
            </defs>
            <!-- Horizontal centre axis -->
            <line x1="40" y1="270" x2="500" y2="270" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
            <!-- Waveform path (irregular, music-shaped) -->
            <path
              d="M 40,270
                 L 70,250 L 90,290 L 110,210 L 130,330 L 150,240 L 170,300
                 L 190,180 L 210,340 L 230,260 L 250,290 L 270,170
                 L 290,360 L 310,250 L 330,280 L 350,200 L 370,320 L 390,260 L 410,290
                 L 430,230 L 450,300 L 470,250 L 490,280 L 500,270"
              stroke="url(#spec)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"
              filter="url(#glow)"
            />
            <!-- Cut markers (vertical lines indicating beat-synced cut points) -->
            <g stroke="#ffffff" stroke-width="1.2" opacity="0.85">
              <line x1="130" y1="220" x2="130" y2="320"/>
              <line x1="210" y1="220" x2="210" y2="320"/>
              <line x1="290" y1="220" x2="290" y2="320"/>
              <line x1="370" y1="220" x2="370" y2="320"/>
              <line x1="450" y1="220" x2="450" y2="320"/>
            </g>
            <!-- Cut-marker labels -->
            <g font-family="JetBrains Mono, monospace" font-size="10" fill="#00d8ff" letter-spacing="1">
              <text x="130" y="210" text-anchor="middle">CUT</text>
              <text x="210" y="210" text-anchor="middle">CUT</text>
              <text x="290" y="210" text-anchor="middle">CUT</text>
              <text x="370" y="210" text-anchor="middle">CUT</text>
              <text x="450" y="210" text-anchor="middle">CUT</text>
            </g>
            <!-- Beat dots on the wave baseline -->
            <g fill="#ff1f5a">
              <circle cx="130" cy="270" r="4"/>
              <circle cx="210" cy="270" r="4"/>
              <circle cx="290" cy="270" r="4"/>
              <circle cx="370" cy="270" r="4"/>
              <circle cx="450" cy="270" r="4"/>
            </g>
          </svg>
          <div class="phones">
            <div class="phone-mini phone-9x16"></div>
            <div class="phone-mini phone-1x1"></div>
            <div class="phone-mini phone-16x9"></div>
          </div>
        </div>
      </div>
    </div>
    <div class="footer">
      <div class="mark">
        <svg viewBox="0 0 60 40" aria-hidden="true">
          <defs>
            <linearGradient id="fm" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="#ff1f5a"/>
              <stop offset="35%" stop-color="#7c3aed"/>
              <stop offset="70%" stop-color="#00d8ff"/>
              <stop offset="100%" stop-color="#00e887"/>
            </linearGradient>
          </defs>
          <rect x="4"  y="14" width="6" height="12" rx="1" fill="url(#fm)"/>
          <rect x="14" y="6"  width="6" height="28" rx="1" fill="url(#fm)"/>
          <rect x="24" y="10" width="6" height="20" rx="1" fill="url(#fm)"/>
          <rect x="34" y="2"  width="6" height="36" rx="1" fill="url(#fm)"/>
          <rect x="44" y="12" width="6" height="16" rx="1" fill="url(#fm)"/>
        </svg>
        <span class="word">RHYTHMIX LIVE</span>
      </div>
      <span>BEAT-SYNCED · 3 FORMATS · 1 PASS</span>
      <span>KLING 2.6 · SUNO · FOURTHWALL</span>
    </div>
  </div>
</body>
</html>
