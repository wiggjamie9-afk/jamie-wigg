<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1080, initial-scale=1" />
<title>RHYTHMIX LIVE · What is LIVE?</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
  :root{
    --canvas:#08050d; --card:#1a1325;
    --magenta:#ff1f5a; --purple:#7c3aed; --cyan:#00d8ff; --green:#00e887;
    --gold:#f5c000; --pink:#ff6fc8;
    --white:#ffffff; --muted:#a0a0b0; --mono-dim:#6a6878;
    --spectrum: linear-gradient(90deg, #ff1f5a 0%, #7c3aed 35%, #00d8ff 70%, #00e887 100%);
    --font-display:'Space Grotesk', system-ui, sans-serif;
    --font-mono:'JetBrains Mono', monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{margin:0;background:#000;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:var(--font-display);color:var(--white)}
  .frame{
    position:relative;width:1080px;height:1080px;overflow:hidden;
    background:
      radial-gradient(1400px 700px at 50% -120px, rgba(124,58,237,0.22), transparent 70%),
      radial-gradient(1100px 600px at 50% 110%, rgba(255,31,90,0.14), transparent 70%),
      var(--canvas);
    padding:96px;
    display:flex;flex-direction:column;
  }
  .top{display:flex;align-items:center;justify-content:space-between}
  .eyebrow{
    font-family:var(--font-mono);font-size:14px;letter-spacing:0.28em;text-transform:uppercase;
    color:var(--cyan);
  }
  .mark{display:flex;align-items:center;gap:14px}
  .mark svg{width:48px;height:32px}
  .mark .word{font-family:var(--font-display);font-weight:700;font-size:22px;letter-spacing:0.02em;color:var(--white)}
  .title{
    font-family:var(--font-display);font-weight:700;font-size:152px;line-height:0.95;letter-spacing:-0.025em;
    color:var(--white);margin-top:56px;
  }
  .title .live{
    background:var(--spectrum);-webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .qmark{color:var(--mono-dim);font-weight:500}

  .lines{margin-top:80px;display:flex;flex-direction:column;gap:30px;max-width:880px}
  .line{
    display:flex;align-items:baseline;gap:28px;
    font-family:var(--font-display);font-weight:500;font-size:48px;line-height:1.2;color:var(--white);
  }
  .line .n{
    font-family:var(--font-mono);font-size:18px;letter-spacing:0.16em;
    color:var(--cyan);width:44px;flex-shrink:0;padding-top:10px;font-weight:500;
  }
  .line em{color:var(--magenta);font-style:normal;font-weight:700}
  .line .gold{color:var(--gold);font-weight:700}
  .line .green{color:var(--green);font-weight:700}

  .bottom{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:24px}
  .chip{
    display:inline-flex;align-items:center;gap:10px;
    padding:12px 20px;border-radius:8px;
    background:var(--card);border:1px solid rgba(124,58,237,0.45);
    font-family:var(--font-mono);font-size:12px;letter-spacing:0.18em;text-transform:uppercase;color:var(--white);
  }
  .chip .num{color:var(--magenta);font-weight:700;letter-spacing:0;text-transform:none;font-size:15px}
  .url{font-family:var(--font-mono);font-size:13px;letter-spacing:0.22em;text-transform:uppercase;color:var(--mono-dim)}
</style>
</head>
<body>
  <div class="frame">
    <div class="top">
      <div class="mark">
        <svg viewBox="0 0 60 40" aria-hidden="true">
          <defs>
            <linearGradient id="bm" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="#ff1f5a"/>
              <stop offset="35%" stop-color="#7c3aed"/>
              <stop offset="70%" stop-color="#00d8ff"/>
              <stop offset="100%" stop-color="#00e887"/>
            </linearGradient>
          </defs>
          <rect x="4" y="14" width="6" height="12" rx="1" fill="url(#bm)"/>
          <rect x="14" y="6"  width="6" height="28" rx="1" fill="url(#bm)"/>
          <rect x="24" y="10" width="6" height="20" rx="1" fill="url(#bm)"/>
          <rect x="34" y="2"  width="6" height="36" rx="1" fill="url(#bm)"/>
          <rect x="44" y="12" width="6" height="16" rx="1" fill="url(#bm)"/>
        </svg>
        <span class="word">RHYTHMIX LIVE</span>
      </div>
      <span class="eyebrow">A new release</span>
    </div>

    <h1 class="title">What is <span class="live">LIVE</span><span class="qmark">?</span></h1>

    <div class="lines">
      <div class="line"><span class="n">01</span><span>Beat-synced music videos for indie artists.</span></div>
      <div class="line"><span class="n">02</span><span>Three formats — <em>9:16</em>, <span class="green">1:1</span>, <span class="gold">16:9</span> — one pass.</span></div>
      <div class="line"><span class="n">03</span><span>Every cut locked to the waveform.</span></div>
      <div class="line"><span class="n">04</span><span>Made the song. Now make the moment.</span></div>
    </div>

    <div class="bottom">
      <div class="chip"><span>Pro</span><span class="num">$19/mo</span></div>
      <span class="url">RHYTHMIXAPP.COM.AU / LIVE</span>
    </div>
  </div>
</body>
</html>
