<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>Codex — Cover</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100vh; background:#000; }
  body { display:flex; align-items:center; justify-content:center; font-family:'Inter', system-ui, sans-serif; color:#ede8f5; }
  .frame {
    width: 1280px; height: 720px; position: relative; overflow: hidden;
    background:
      radial-gradient(1400px 700px at 20% 50%, rgba(64,196,255,0.28), transparent 70%),
      radial-gradient(900px 600px at 110% 110%, rgba(216,232,245,0.10), transparent 70%),
      #06090d;
    display:flex; align-items:center;
  }
  .mark-wrap { width: 460px; flex-shrink: 0; display:flex; align-items:center; justify-content:center; padding-left: 60px; }
  .mark { width: 380px; height: 380px; position: relative; }
  .mark .glow { position:absolute; inset:0; border-radius:50%; background: radial-gradient(circle, rgba(64,196,255,0.7) 0%, rgba(64,196,255,0.3) 30%, transparent 70%); box-shadow: 0 0 180px rgba(64,196,255,0.45), 0 0 280px rgba(64,196,255,0.2); }
  .mark svg { position:relative; width:100%; height:100%; }

  .copy { flex:1; padding: 50px 80px 50px 20px; }
  .eyebrow { font-family:'JetBrains Mono', monospace; font-size:20px; letter-spacing:0.28em; text-transform:uppercase; color:#7cd5ff; margin-bottom: 20px; }
  .title { font-family:'Cormorant Garamond', serif; font-weight:500; font-size: 130px; line-height: 0.95; letter-spacing:-0.02em; }
  .italic { font-style:italic; background: linear-gradient(135deg, #40c4ff 0%, #d8e8f5 50%, #40c4ff 100%); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .tagline { font-family:'Cormorant Garamond', serif; font-style: italic; font-size: 32px; line-height: 1.25; color:#9fb3c4; margin-top: 22px; max-width: 580px; }
  .chip { margin-top: 28px; display:inline-flex; gap:18px; align-items:center; padding: 14px 26px; border-radius: 999px; background:#0c1822; border:1px solid rgba(64,196,255,0.5); font-family:'JetBrains Mono', monospace; font-size:20px; letter-spacing:0.15em; text-transform:uppercase; color:#f0f0f8; }
  .chip .n { font-family:'Cormorant Garamond', serif; font-size: 32px; color:#7cd5ff; letter-spacing: 0; text-transform:none; }
  .urlfoot { position:absolute; left:0; right:0; bottom: 28px; text-align:center; font-family:'JetBrains Mono', monospace; font-size:18px; letter-spacing:0.28em; text-transform:uppercase; color:#5a6b7b; }
</style>
</head>
<body>
<div class="frame">
  <div class="mark-wrap">
    <div class="mark">
      <div class="glow"></div>
      <svg viewBox="0 0 200 200">
        <defs>
          <linearGradient id="tV" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#40c4ff"/><stop offset="100%" stop-color="#1a7aaf"/></linearGradient>
          <linearGradient id="tS" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#d8e8f5"/><stop offset="100%" stop-color="#7a8b9b"/></linearGradient>
        </defs>
        <circle cx="100" cy="100" r="78" fill="none" stroke="url(#tV)" stroke-width="1.6" opacity="0.75"/>
        <circle cx="100" cy="65" r="22" fill="none" stroke="url(#tS)" stroke-width="1.5"/>
        <circle cx="70" cy="118" r="22" fill="none" stroke="url(#tS)" stroke-width="1.5"/>
        <circle cx="130" cy="118" r="22" fill="none" stroke="url(#tS)" stroke-width="1.5"/>
      </svg>
    </div>
  </div>
  <div class="copy">
    <div class="eyebrow">Live coherence biofeedback</div>
    <h1 class="title"><span class="italic">Codex</span><br>of Reality.</h1>
    <div class="tagline">Your phone camera reads your pulse. Your nervous system tells the truth.</div>
    <div class="chip">LIFETIME <span class="n">AU$30</span> · ONE PAYMENT</div>
  </div>
  <div class="urlfoot">RHYTHMIXAPP.COM.AU / CODEX</div>
</div>
</body>
</html>
