<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, initial-scale=1">
<title>Codex — What it is</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100vh; background:#000; }
  body { display:flex; align-items:center; justify-content:center; font-family:'Inter', system-ui, sans-serif; color:#ede8f5; }
  .frame {
    width: 1080px; height: 1080px; position: relative; overflow: hidden;
    background:
      radial-gradient(1400px 800px at 50% -120px, rgba(64,196,255,0.22), transparent 70%),
      radial-gradient(900px 700px at 50% 110%, rgba(216,232,245,0.10), transparent 70%),
      #06090d;
    display:flex; flex-direction:column; align-items:center; padding: 100px 80px;
  }
  .badge { font-family:'JetBrains Mono', monospace; font-size:20px; letter-spacing:0.32em; text-transform:uppercase; color:#7cd5ff; margin-bottom: 48px; }
  .heart { width: 320px; height: 320px; position: relative; margin-bottom: 30px; }
  .heart .glow { position:absolute; inset:0; border-radius:50%; background: radial-gradient(circle, rgba(64,196,255,0.7) 0%, rgba(64,196,255,0.25) 30%, transparent 70%); box-shadow: 0 0 160px rgba(64,196,255,0.4), 0 0 240px rgba(64,196,255,0.2); }
  .heart svg { position:relative; width:100%; height:100%; }
  .pulse { width: 100%; max-width: 820px; height: 100px; margin-top: 10px; margin-bottom: 30px; }
  .pulse svg { width:100%; height:100%; }
  .title { font-family:'Cormorant Garamond', serif; font-weight:500; font-size: 78px; line-height: 1.08; letter-spacing:-0.01em; text-align: center; }
  .italic { font-style:italic; background: linear-gradient(135deg, #40c4ff 0%, #d8e8f5 50%, #40c4ff 100%); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .sub { font-family:'Cormorant Garamond', serif; font-style: italic; font-size: 40px; color:#9fb3c4; margin-top: 24px; text-align:center; max-width: 860px; }
  .pillars { margin-top: auto; display:flex; gap: 30px; justify-content:center; padding-bottom: 24px; width: 100%; }
  .pillars .p { font-family:'JetBrains Mono', monospace; font-size: 18px; letter-spacing: 0.22em; text-transform: uppercase; color:#9fb3c4; padding: 12px 0; border-top: 1px solid rgba(64,196,255,0.4); border-bottom: 1px solid rgba(64,196,255,0.4); flex:1; text-align:center; }
  .urlfoot { font-family:'JetBrains Mono', monospace; font-size:18px; letter-spacing:0.28em; text-transform:uppercase; color:#5a6b7b; margin-top: 12px; }
</style>
</head>
<body>
<div class="frame">
  <div class="badge">What the Codex is</div>
  <div class="heart">
    <div class="glow"></div>
    <svg viewBox="0 0 200 200">
      <defs>
        <linearGradient id="r" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#40c4ff"/><stop offset="100%" stop-color="#1a7aaf"/></linearGradient>
      </defs>
      <circle cx="100" cy="100" r="78" fill="none" stroke="url(#r)" stroke-width="0.8" opacity="0.5"/>
      <circle cx="100" cy="100" r="62" fill="none" stroke="#d8e8f5" stroke-width="0.6" opacity="0.4"/>
      <circle cx="100" cy="100" r="46" fill="none" stroke="#40c4ff" stroke-width="0.6" opacity="0.35"/>
      <circle cx="100" cy="100" r="6" fill="#7cd5ff"/>
    </svg>
  </div>
  <div class="pulse">
    <svg viewBox="0 0 800 100" preserveAspectRatio="none">
      <defs>
        <linearGradient id="pV" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#40c4ff" stop-opacity="0.2"/><stop offset="50%" stop-color="#40c4ff" stop-opacity="1"/><stop offset="100%" stop-color="#40c4ff" stop-opacity="0.2"/></linearGradient>
      </defs>
      <path d="M0 50 L 120 50 L 140 50 L 150 20 L 160 80 L 170 50 L 280 50 L 300 50 L 310 25 L 320 75 L 330 50 L 440 50 L 460 50 L 470 22 L 480 78 L 490 50 L 600 50 L 620 50 L 630 28 L 640 72 L 650 50 L 800 50" stroke="url(#pV)" stroke-width="3" fill="none" stroke-linecap="round"/>
    </svg>
  </div>
  <h1 class="title">Live <span class="italic">HRV coherence</span><br>from your phone camera.</h1>
  <div class="sub">No sensor. No subscription. Add a Polar H10 if you want clinical precision.</div>
  <div class="pillars">
    <div class="p">PHONE CAMERA</div>
    <div class="p">REAL-TIME</div>
    <div class="p">ON-DEVICE</div>
  </div>
  <div class="urlfoot">RHYTHMIXAPP.COM.AU / CODEX</div>
</div>
</body>
</html>
