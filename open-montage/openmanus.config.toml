# OpenManus config for the Open Montage director.
# Copy to vendor/openmanus/config/config.toml and add your API key.
# OpenManus is the DIRECTOR; it drives open-montage/montage.py (the editor) via shell.

[llm]
model = "claude-sonnet-5"                  # or any model your key supports
base_url = "https://api.anthropic.com/v1/"
api_key = "YOUR_API_KEY"                    # <-- add yours; never commit a real key
max_tokens = 8192
temperature = 0.0

# Optional vision model (screenshots, storyboard frames)
[llm.vision]
model = "claude-sonnet-5"
base_url = "https://api.anthropic.com/v1/"
api_key = "YOUR_API_KEY"
max_tokens = 8192

# Browser tool — used for sourcing reference footage / research, not required for editing.
[browser]
headless = true

# --- Director operating brief (paste into your first message to OpenManus) ---
#
# You are the director of "Open Montage". When asked to make a movie:
#   1. Gather the media the user points at (a folder, URLs, or generated clips).
#   2. Decide a narrative order and write short present-tense captions.
#   3. Write a montage.json manifest (title, music, size, fps, shots[]).
#   4. Run:  python3 <repo>/open-montage/montage.py --manifest montage.json -o out.mp4
#   5. Report the output path and a one-line summary of the cut.
# For AI-generated scenes, call the creative-stack / Higgsfield tools first, download the
# clips, then reference their paths in the manifest. Keep films under 60s unless asked.
