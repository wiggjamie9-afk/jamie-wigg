# KEYLESS OpenManus config for the Open Montage director — no API key, no bill.
# Uses Ollama running local models on YOUR machine. Copy to
# vendor/openmanus/config/config.toml after installing Ollama.
#
# Setup (one time, on your own computer — free):
#   1. Install Ollama:      https://ollama.com/download
#   2. Pull a model:        ollama pull llama3.2        (text)
#                           ollama pull llama3.2-vision (optional, for images)
#   3. Ollama serves at http://localhost:11434 automatically.
#   4. cp open-montage/openmanus.ollama.config.toml vendor/openmanus/config/config.toml
#   5. cd vendor/openmanus && pip install -r requirements.txt && python main.py
#
# The "api_key" below is a placeholder Ollama ignores — it is NOT a secret.

[llm]                                    # OLLAMA — local, keyless
api_type = "ollama"
model = "llama3.2"                       # any model you've `ollama pull`ed
base_url = "http://localhost:11434/v1"
api_key = "ollama"                       # placeholder, ignored by Ollama
max_tokens = 4096
temperature = 0.0

[llm.vision]                             # OLLAMA vision (optional; for storyboards/frames)
api_type = "ollama"
model = "llama3.2-vision"
base_url = "http://localhost:11434/v1"
api_key = "ollama"
max_tokens = 4096
temperature = 0.0

[browser]
headless = true

# --- Director operating brief (paste as your first message to OpenManus) ---
# You are the director of "Open Montage". When asked to make a movie:
#   1. Gather the media the user points at (a folder or generated clips).
#   2. Decide a narrative order; write short present-tense captions.
#   3. Write a montage.json manifest (title, music, size, fps, shots[]).
#   4. Run: python3 <repo>/open-montage/montage.py --manifest montage.json -o out.mp4
#   5. Report the output path and a one-line summary of the cut.
# Keep films under 60s unless asked. The editor needs no keys or GPU.
