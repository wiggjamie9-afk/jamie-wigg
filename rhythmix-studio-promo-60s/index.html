<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>STARLIGHTMIX Studio Promo — 60s</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100%;
      height: 100%;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .composition {
      width: 1920px;
      height: 1080px;
      position: relative;
      overflow: hidden;
      background: linear-gradient(135deg, #0a0e27 0%, #1a1a3e 50%, #0f0f2e 100%);
    }

    .background {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
    }

    .gradient-overlay {
      position: absolute;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 50% 50%, rgba(34, 211, 238, 0.15) 0%, transparent 70%);
      top: 0;
      left: 0;
    }

    .content {
      position: absolute;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 80px;
    }

    .logo {
      font-size: 48px;
      font-weight: 900;
      background: linear-gradient(135deg, #22d3ee, #a78bfa, #ec4899);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 60px;
      opacity: 0;
    }

    .headline {
      font-size: 80px;
      font-weight: 900;
      color: #fff;
      line-height: 1.1;
      margin-bottom: 30px;
      max-width: 1600px;
      opacity: 0;
      text-shadow: 0 20px 40px rgba(34, 211, 238, 0.2);
    }

    .subheadline {
      font-size: 42px;
      font-weight: 600;
      color: #e2e8f0;
      margin-bottom: 60px;
      max-width: 1400px;
      opacity: 0;
      line-height: 1.3;
    }

    .cta-button {
      padding: 20px 60px;
      font-size: 24px;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(135deg, #22d3ee, #a78bfa);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      opacity: 0;
      box-shadow: 0 10px 30px rgba(34, 211, 238, 0.3);
      transition: all 0.3s ease;
    }

    .cta-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 40px rgba(34, 211, 238, 0.4);
    }

    .music-note {
      position: absolute;
      font-size: 64px;
      opacity: 0;
    }

    .note-1 {
      top: 10%;
      left: 15%;
    }

    .note-2 {
      top: 70%;
      right: 15%;
    }

    .note-3 {
      top: 40%;
      right: 10%;
    }

    .video-preview {
      position: absolute;
      width: 400px;
      height: 240px;
      background: linear-gradient(135deg, #22d3ee, #a78bfa);
      border-radius: 16px;
      bottom: 80px;
      right: 100px;
      opacity: 0;
      box-shadow: 0 20px 60px rgba(34, 211, 238, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 120px;
    }
  </style>
</head>
<body>
  <div class="composition">
    <div class="background"></div>
    <div class="gradient-overlay"></div>

    <div class="music-note note-1">♪</div>
    <div class="music-note note-2">♫</div>
    <div class="music-note note-3">♪</div>

    <div class="content">
      <div class="logo">STARLIGHTMIX</div>
      <h1 class="headline">Create a music video in 2 minutes</h1>
      <h2 class="subheadline">No filming. No editing. No budget.</h2>
      <button class="cta-button">Start Free</button>
    </div>

    <div class="video-preview">▶</div>
  </div>

  <audio id="narration" src="narration.wav"></audio>

  <script>
    const tl = gsap.timeline({
      onStart: () => {
        const audio = document.getElementById('narration');
        audio.play().catch(e => console.log('Audio play deferred:', e));
      }
    });

    // Logo fade in
    tl.to('.logo', {
      opacity: 1,
      duration: 1,
      ease: 'power2.out'
    }, 0);

    // Headline animation
    tl.to('.headline', {
      opacity: 1,
      duration: 1.2,
      ease: 'power2.out'
    }, 0.2);

    // Subheadline with stagger
    tl.to('.subheadline', {
      opacity: 1,
      duration: 1,
      ease: 'power2.out'
    }, 0.5);

    // Music notes floating in
    tl.to('.music-note', {
      opacity: 0.6,
      duration: 1.5,
      ease: 'back.out',
      stagger: 0.2
    }, 0.3);

    // Music notes float and rotate
    tl.to('.music-note', {
      y: gsap.utils.unitize(-50, 'px'),
      rotation: 360,
      duration: 3,
      ease: 'sine.inOut',
      repeat: -1,
      repeatDelay: 1
    }, 0.3);

    // CTA button
    tl.to('.cta-button', {
      opacity: 1,
      duration: 1,
      ease: 'back.out'
    }, 1);

    // Video preview
    tl.to('.video-preview', {
      opacity: 1,
      duration: 1,
      y: -30,
      ease: 'back.out'
    }, 1.5);

    // Pulse CTA button
    tl.to('.cta-button', {
      boxShadow: '0 15px 50px rgba(34, 211, 238, 0.5)',
      duration: 0.8,
      ease: 'sine.inOut',
      repeat: -1,
      yoyo: true
    }, 1.5);

    // Final fade out (at 55s)
    tl.to(['.logo', '.headline', '.subheadline', '.cta-button', '.video-preview', '.music-note'], {
      opacity: 0,
      duration: 2,
      ease: 'power2.inOut'
    }, 55);
  </script>
</body>
</html>
