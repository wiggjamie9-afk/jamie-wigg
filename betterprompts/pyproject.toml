[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "betterprompts"
version = "0.1.0"
description = "Improve prompts with AI using free LLM APIs (Gemini + Groq fallback)"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Jamie Wigg", email = "jamie.jack.28@hotmail.com"}
]

dependencies = [
    "gradio>=4.0.0",
    "google-generativeai>=0.3.0",
    "groq>=0.4.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0"]

[project.scripts]
betterprompts = "betterprompts.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["betterprompts*"]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::FutureWarning",
    "ignore::UserWarning:gradio",
]
