<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>RHYTHMIX — Era Poster</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    background: #08050d;
    color: #ffffff;
    font-family: "Space Grotesk", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .poster {
    position: relative;
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    background:
      radial-gradient(ellipse 900px 800px at 20% 12%, rgba(255, 31, 90, 0.32), transparent 60%),
      radial-gradient(ellipse 950px 800px at 85% 55%, rgba(124, 58, 237, 0.30), transparent 62%),
      radial-gradient(ellipse 800px 700px at 50% 95%, rgba(110, 255, 192, 0.22), transparent 60%),
      radial-gradient(ellipse 700px 600px at 78% 18%, rgba(138, 246, 255, 0.16), transparent 65%),
      #08050d;
  }

  /* Grid texture */
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255, 255, 255, 0.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, 0.045) 1px, transparent 1px);
    background-size: 80px 80px;
    mask-image: radial-gradient(ellipse 900px 1500px at 50% 50%, #000 35%, transparent 92%);
    -webkit-mask-image: radial-gradient(ellipse 900px 1500px at 50% 50%, #000 35%, transparent 92%);
  }

  /* Diagonal scanlines for grit */
  .scan {
    position: absolute; inset: 0;
    background: repeating-linear-gradient(
      135deg,
      rgba(255, 255, 255, 0.02) 0px,
      rgba(255, 255, 255, 0.02) 1px,
      transparent 1px,
      transparent 6px
    );
    pointer-events: none;
  }

  /* Noise speckle */
  .noise {
    position: absolute; inset: 0;
    opacity: 0.35;
    mix-blend-mode: overlay;
    background-image: radial-gradient(rgba(255,255,255,0.08) 1px, transparent 1px);
    background-size: 3px 3px;
    pointer-events: none;
  }

  /* ============ TOP EYEBROW ============ */
  .eyebrow {
    position: absolute;
    top: 90px; left: 80px; right: 80px;
    display: flex; justify-content: space-between; align-items: center;
    font-family: "JetBrains Mono", "Courier New", monospace;
    font-size: 26px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #cfcfd8;
  }
  .eyebrow .left { color: #ffd9e8; }
  .eyebrow .left .dot {
    display: inline-block;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: #ff1f5a;
    box-shadow: 0 0 22px #ff1f5a;
    vertical-align: middle;
    margin-right: 14px;
    transform: translateY(-2px);
  }
  .eyebrow .right { color: #8af6ff; }

  /* ============ WORDMARK ============ */
  .wordmark {
    position: absolute;
    top: 200px; left: 0; right: 0;
    text-align: center;
    font-family: "Space Grotesk", system-ui, sans-serif;
    font-weight: 700;
    font-size: 132px;
    letter-spacing: 0.06em;
    line-height: 1;
    background: linear-gradient(135deg, #ff7aa6, #e0c0ff 50%, #8af6ff);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
    text-shadow: 0 0 80px rgba(224, 192, 255, 0.25);
  }
  .wordmark::after {
    content: "";
    display: block;
    width: 260px; height: 4px;
    margin: 26px auto 0;
    background: linear-gradient(90deg, transparent, #ff1f5a, #f5c000, #8af6ff, transparent);
    box-shadow: 0 0 18px rgba(255, 31, 90, 0.6);
  }

  /* ============ ERA TIMELINE STRIP ============ */
  .timeline {
    position: absolute;
    top: 460px;
    left: 60px; right: 60px;
    display: flex; align-items: center; justify-content: space-between;
    font-family: "JetBrains Mono", "Courier New", monospace;
    font-size: 22px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
  }
  .timeline .tick {
    display: flex; flex-direction: column; align-items: center;
    gap: 12px;
    color: #6a6a78;
    text-decoration: line-through;
    text-decoration-color: rgba(255, 31, 90, 0.7);
    text-decoration-thickness: 3px;
  }
  .timeline .tick.now {
    color: #b6ffe0;
    text-decoration: none;
    font-weight: 700;
  }
  .timeline .tick .pip {
    width: 12px; height: 12px; border-radius: 50%;
    background: #3a3a48;
    box-shadow: none;
  }
  .timeline .tick.now .pip {
    background: #6effc0;
    box-shadow: 0 0 22px #6effc0;
  }
  .timeline .rail {
    flex: 1;
    height: 2px;
    margin: 0 14px;
    align-self: center;
    background: linear-gradient(90deg, rgba(255, 122, 166, 0.6), rgba(224, 192, 255, 0.7), rgba(138, 246, 255, 0.6), rgba(110, 255, 192, 0.8));
    transform: translateY(-12px);
  }

  /* ============ HEADLINE (HOOK) ============ */
  .hook {
    position: absolute;
    top: 580px;
    left: 60px; right: 60px;
    text-align: left;
    font-family: "Space Grotesk", system-ui, sans-serif;
    font-weight: 700;
    line-height: 0.92;
    letter-spacing: -0.025em;
  }
  .hook .l1 {
    display: block;
    font-size: 124px;
    color: #f0f0f5;
    margin-bottom: 14px;
  }
  .hook .l2 {
    display: block;
    font-size: 124px;
    color: #f0f0f5;
    margin-bottom: 18px;
  }
  .hook .turn {
    display: block;
    font-size: 200px;
    line-height: 0.9;
    letter-spacing: -0.035em;
    background: linear-gradient(135deg, #ff1f5a, #ff7aa6 45%, #f5c000);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
    text-shadow: 0 0 80px rgba(255, 31, 90, 0.25);
  }
  .hook .point {
    display: block;
    font-size: 200px;
    line-height: 0.9;
    letter-spacing: -0.035em;
    background: linear-gradient(135deg, #f5c000, #ff7aa6 55%, #8af6ff);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
  }
  .hook .point::after {
    content: ".";
    color: #6effc0;
    -webkit-text-fill-color: #6effc0;
  }

  /* ============ PIVOT — YOUR TURN ============ */
  .pivot {
    position: absolute;
    top: 1230px;
    left: 60px; right: 60px;
    font-family: "Space Grotesk", system-ui, sans-serif;
  }
  .pivot .kicker {
    display: block;
    font-family: "JetBrains Mono", "Courier New", monospace;
    font-size: 26px;
    letter-spacing: 0.3em;
    color: #b6ffe0;
    text-transform: uppercase;
    margin-bottom: 18px;
    font-weight: 500;
  }
  .pivot .yourturn {
    display: block;
    font-weight: 700;
    font-size: 132px;
    line-height: 0.94;
    letter-spacing: -0.02em;
    background: linear-gradient(135deg, #6effc0, #8af6ff);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
    text-shadow: 0 0 80px rgba(110, 255, 192, 0.15);
  }

  /* Floating chip accents */
  .chip {
    position: absolute;
    font-family: "JetBrains Mono", "Courier New", monospace;
    font-size: 20px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    padding: 10px 18px;
    border-radius: 999px;
    background: rgba(255, 31, 90, 0.18);
    color: #ffd9e8;
    border: 1px solid rgba(255, 31, 90, 0.45);
  }
  .chip.c1 { top: 1150px; right: 70px; transform: rotate(5deg); }
  .chip.c2 {
    top: 1180px; left: 60px; transform: rotate(-3deg);
    background: rgba(110, 255, 192, 0.14);
    color: #b6ffe0;
    border-color: rgba(110, 255, 192, 0.45);
  }

  /* ============ SUBHEAD / PRICE BAND ============ */
  .subhead {
    position: absolute;
    bottom: 280px;
    left: 60px; right: 60px;
    padding: 38px 44px;
    background: linear-gradient(135deg, rgba(40, 30, 60, 0.85), rgba(28, 22, 42, 0.6));
    border: 1px solid rgba(255, 31, 90, 0.35);
    border-radius: 22px;
    backdrop-filter: blur(8px);
  }
  .subhead .label {
    font-family: "JetBrains Mono", "Courier New", monospace;
    font-size: 22px;
    letter-spacing: 0.3em;
    color: #ffd9e8;
    text-transform: uppercase;
    margin-bottom: 14px;
  }
  .subhead .price {
    font-family: "Space Grotesk", system-ui, sans-serif;
    font-weight: 700;
    font-size: 76px;
    line-height: 1;
    letter-spacing: -0.01em;
    color: #ffffff;
    display: flex;
    align-items: baseline;
    gap: 22px;
    flex-wrap: wrap;
  }
  .subhead .price .amount {
    background: linear-gradient(135deg, #ff1f5a, #ff7aa6 50%, #f5c000);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
  }
  .subhead .price .sep {
    width: 8px; height: 8px;
    background: #f5c000;
    box-shadow: 0 0 16px #f5c000;
    border-radius: 50%;
    transform: translateY(-12px);
  }
  .subhead .price .lifetime {
    font-size: 60px;
    color: #ffffff;
  }

  /* ============ CTA STRIP ============ */
  .cta {
    position: absolute;
    bottom: 110px;
    left: 60px; right: 60px;
    display: flex; align-items: center; justify-content: space-between;
    font-family: "JetBrains Mono", "Courier New", monospace;
    text-transform: uppercase;
  }
  .cta .url {
    font-size: 34px;
    letter-spacing: 0.2em;
    color: #ffffff;
    font-weight: 700;
  }
  .cta .url .dot { color: #ff1f5a; }
  .cta .badge {
    font-size: 22px;
    letter-spacing: 0.3em;
    color: #08050d;
    background: #6effc0;
    box-shadow: 0 0 22px rgba(110, 255, 192, 0.6);
    padding: 14px 22px;
    border-radius: 999px;
    font-weight: 700;
  }

  /* Bottom edge glow bar */
  .edge {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 6px;
    background: linear-gradient(90deg, #ff1f5a, #f5c000 30%, #6effc0 60%, #8af6ff);
    box-shadow: 0 0 30px rgba(255, 31, 90, 0.5);
  }
</style>
</head>
<body>
  <div class="poster">
    <div class="grid"></div>
    <div class="scan"></div>

    <div class="eyebrow">
      <span class="left"><span class="dot"></span>ERA // 60s</span>
      <span class="right">A NEW ERA OF MUSIC</span>
    </div>

    <div class="wordmark">RHYTHMIX</div>

    <div class="timeline">
      <span class="tick"><span class="pip"></span>STUDIO</span>
      <span class="rail"></span>
      <span class="tick"><span class="pip"></span>HOME PC</span>
      <span class="rail"></span>
      <span class="tick"><span class="pip"></span>BEDROOM</span>
      <span class="rail"></span>
      <span class="tick now"><span class="pip"></span>NOW</span>
    </div>

    <div class="hook">
      <span class="l1">Every era of music</span>
      <span class="l2">has a</span>
      <span class="turn">turning</span>
      <span class="point">point</span>
    </div>

    <div class="chip c1">The tools caught up</div>
    <div class="chip c2">Now it&apos;s your turn</div>

    <div class="pivot">
      <span class="kicker">// ERA III &middot; LIVE</span>
      <span class="yourturn">Your era<br/>starts now.</span>
    </div>

    <div class="subhead">
      <div class="label">ONE PLATFORM &middot; ONE PRICE</div>
      <div class="price">
        <span class="amount">AU$149</span>
        <span class="sep"></span>
        <span class="lifetime">Lifetime.</span>
      </div>
    </div>

    <div class="cta">
      <div class="url">RHYTHMIXAPP<span class="dot">.</span>COM<span class="dot">.</span>AU</div>
      <div class="badge">Era III</div>
    </div>

    <div class="noise"></div>
    <div class="edge"></div>
  </div>
</body>
</html>
