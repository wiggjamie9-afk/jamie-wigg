<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px; height: 1080px;
        overflow: hidden;
        background: #08050d;
        font-family: "Space Grotesk", system-ui, sans-serif;
        color: #ffffff;
      }
      .scene { position: absolute; inset: 0; width: 1920px; height: 1080px; }
      .scene-inner {
        position: absolute; inset: 0;
        display: flex; flex-direction: column;
        justify-content: center; align-items: center;
        padding: 80px 160px;
        background: #08050d;
      }
      .scene-bg-radial {
        position: absolute; inset: 0;
        background:
          radial-gradient(900px 700px at 22% 28%, rgba(124, 58, 237, 0.32), transparent 60%),
          radial-gradient(900px 700px at 78% 72%, rgba(255, 31, 90, 0.26), transparent 65%);
        pointer-events: none;
      }
      .grid-overlay {
        position: absolute; inset: 0;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.045) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.045) 1px, transparent 1px);
        background-size: 80px 80px;
        pointer-events: none;
      }
      .gradient-text {
        background: linear-gradient(135deg, #ff7aa6, #e0c0ff 50%, #8af6ff);
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      /* Scene 1 — Hook */
      #scene1 .hook {
        font-weight: 700; font-size: 130px;
        letter-spacing: -3px; line-height: 1.05;
        text-align: center;
        max-width: 1400px;
      }
      #scene1 .hook em { font-style: normal; }
      /* Scene 2 — Pillars (rapid flash) */
      #scene2 .pillars-row {
        display: flex; gap: 60px;
        justify-content: center;
      }
      #scene2 .pword {
        font-weight: 800; font-size: 160px;
        letter-spacing: -5px; line-height: 1;
      }
      /* Scene 3 — CTA */
      #scene3 .badge {
        display: inline-flex; align-items: center; gap: 14px;
        padding: 14px 28px;
        border: 1px solid rgba(110, 255, 192, 0.55);
        background: rgba(110, 255, 192, 0.14);
        border-radius: 999px;
        font-family: "JetBrains Mono", monospace;
        font-size: 22px; letter-spacing: 5px;
        color: #b6ffe0; text-transform: uppercase;
        margin-bottom: 36px;
      }
      #scene3 .badge .dot {
        width: 12px; height: 12px; border-radius: 50%;
        background: #6effc0; box-shadow: 0 0 22px #6effc0;
      }
      #scene3 .wordmark {
        font-weight: 800; font-size: 240px;
        letter-spacing: -8px; line-height: 0.9;
        margin-bottom: 28px;
      }
      #scene3 .tagline {
        font-family: "JetBrains Mono", monospace;
        font-size: 26px; letter-spacing: 7px;
        color: #ffffff; text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="15" data-width="1920" data-height="1080">
      <audio id="narration" class="clip" data-start="0.5" data-duration="9" data-track-index="0" data-volume="1" src="narration.wav"></audio>

      <!-- Scene 1: HOOK 0–6s -->
      <div id="scene1" class="scene clip" data-start="0" data-duration="6" data-track-index="1">
        <div class="scene-inner" id="scene1-inner">
          <div class="scene-bg-radial"></div>
          <div class="grid-overlay"></div>
          <div class="hook">What if making <em class="gradient-text">music</em> didn't take <em class="gradient-text">years?</em></div>
        </div>
      </div>

      <!-- Scene 2: PILLARS 5.5–10s -->
      <div id="scene2" class="scene clip" data-start="5.5" data-duration="4.5" data-track-index="2">
        <div class="scene-inner" id="scene2-inner">
          <div class="scene-bg-radial"></div>
          <div class="grid-overlay"></div>
          <div class="pillars-row">
            <div class="pword" style="color:#ffaedb">Generate.</div>
            <div class="pword" style="color:#6effc0">Master.</div>
          </div>
          <div class="pillars-row" style="margin-top:30px">
            <div class="pword" style="color:#8af6ff">Release.</div>
            <div class="pword" style="color:#ffe070">Earn.</div>
          </div>
        </div>
      </div>

      <!-- Scene 3: CTA 9.5–15s -->
      <div id="scene3" class="scene clip" data-start="9.5" data-duration="5.5" data-track-index="3">
        <div class="scene-inner" id="scene3-inner">
          <div class="scene-bg-radial"></div>
          <div class="grid-overlay"></div>
          <div class="badge"><span class="dot"></span>Waitlist open</div>
          <div class="wordmark gradient-text">RHYTHMIX</div>
          <div class="tagline">Be first in line</div>
        </div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Scene 1
      tl.from("#scene1 .hook", { y: 60, opacity: 0, duration: 0.7, ease: "expo.out" }, 0.3);
      tl.to("#scene1-inner", { opacity: 0, duration: 0.4, ease: "power1.inOut" }, 5.5);

      // Scene 2 — fast pillars
      tl.from("#scene2-inner", { opacity: 0, duration: 0.4, ease: "power1.inOut" }, 5.5);
      tl.from("#scene2 .pword", { y: 50, scale: 0.8, opacity: 0, duration: 0.45, ease: "back.out(1.6)", stagger: 0.18 }, 5.8);
      tl.to("#scene2-inner", { opacity: 0, duration: 0.4, ease: "power1.inOut" }, 9.5);

      // Scene 3 CTA
      tl.from("#scene3-inner", { opacity: 0, duration: 0.4, ease: "power1.inOut" }, 9.5);
      tl.from("#scene3 .badge", { y: -22, opacity: 0, duration: 0.5, ease: "power3.out" }, 9.8);
      tl.from("#scene3 .wordmark", { y: 70, opacity: 0, scale: 0.92, duration: 0.85, ease: "expo.out" }, 10.05);
      tl.from("#scene3 .tagline", { y: 22, opacity: 0, duration: 0.5, ease: "power2.out" }, 10.6);
      tl.to("#scene3 .wordmark", { scale: 1.04, duration: 1.6, ease: "sine.inOut", yoyo: true, repeat: 1 }, 11.4);
      tl.to("#scene3-inner", { opacity: 0, duration: 0.6, ease: "power2.inOut" }, 14.4);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
