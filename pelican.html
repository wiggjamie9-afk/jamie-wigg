<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RHYTHMIX — The Pelican</title>
<meta name="description" content="An easter egg. The RHYTHMIX pelican pedals a track into a cinematic music video.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --canvas:#08050d; --magenta:#ff1f5a; --purple:#7c3aed; --cyan:#00d8ff;
    --green:#00e887; --gold:#f5c000; --pink:#ff6fc8; --white:#fff; --muted:#a0a0b0;
    --neon:var(--cyan);              /* swappable accent (click to cycle) */
    --speed:1.1s;                    /* wheel/pedal cadence (click to bump) */
    --display:"Space Grotesk",system-ui,-apple-system,sans-serif;
    --mono:"JetBrains Mono",ui-monospace,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--canvas); color:var(--white); font-family:var(--display);
    min-height:100vh; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:28px; overflow:hidden; position:relative;
    padding:32px 20px; text-align:center;
    -webkit-tap-highlight-color:transparent;
  }
  /* localized radial glow — no full-frame gradients (banding) */
  body::before{
    content:""; position:absolute; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(ellipse 70% 55% at 50% 32%, color-mix(in srgb,var(--purple) 28%, transparent), transparent 70%),
      radial-gradient(circle 40% at 50% 70%, color-mix(in srgb,var(--neon) 14%, transparent), transparent 65%);
    animation:breathe 6s ease-in-out infinite;
  }
  @keyframes breathe{0%,100%{opacity:.75}50%{opacity:1}}

  .wordmark{
    position:relative; z-index:2; font-size:13px; font-weight:700; letter-spacing:.5em;
    text-transform:uppercase; font-family:var(--mono);
    background:linear-gradient(135deg,var(--magenta),var(--purple),var(--cyan));
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
  }

  .stage{position:relative; z-index:2; width:min(620px,92vw)}
  svg{width:100%; height:auto; display:block; overflow:visible}

  /* ---- motion ---- */
  .rider{animation:bob var(--speed) ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  .wheel{transform-box:fill-box; transform-origin:center; animation:spin var(--speed) linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .crank{transform-box:fill-box; transform-origin:290px 300px; animation:spin var(--speed) linear infinite}
  .road{stroke-dasharray:18 22; animation:road calc(var(--speed)*.9) linear infinite}
  @keyframes road{to{stroke-dashoffset:-80}}

  /* music notes streaming from the pouch */
  .note{opacity:0; transform-box:fill-box; transform-origin:center}
  .note.n1{animation:fly calc(var(--speed)*3) linear infinite}
  .note.n2{animation:fly calc(var(--speed)*3) linear infinite calc(var(--speed)*1)}
  .note.n3{animation:fly calc(var(--speed)*3) linear infinite calc(var(--speed)*2)}
  @keyframes fly{
    0%{opacity:0; transform:translate(0,0) scale(.6) rotate(0)}
    12%{opacity:1}
    70%{opacity:1}
    100%{opacity:0; transform:translate(150px,-120px) scale(1.1) rotate(28deg)}
  }
  .glow{filter:drop-shadow(0 0 6px var(--neon)) drop-shadow(0 0 14px color-mix(in srgb,var(--neon) 60%, transparent))}
  .blink{animation:blink calc(var(--speed)*4) steps(1) infinite}
  @keyframes blink{0%,92%,100%{opacity:1}94%,98%{opacity:.05}}

  /* equalizer baseline */
  .eq{display:flex; gap:5px; align-items:flex-end; height:34px; z-index:2; position:relative}
  .eq i{width:5px; border-radius:3px; background:linear-gradient(var(--neon),var(--magenta));
    animation:eq calc(var(--speed)*1.2) ease-in-out infinite}
  .eq i:nth-child(odd){animation-delay:.15s}
  .eq i:nth-child(3n){animation-delay:.3s}
  .eq i:nth-child(4n){animation-delay:.45s}
  @keyframes eq{0%,100%{height:8px}50%{height:34px}}

  .tagline{position:relative; z-index:2; font-family:var(--mono); color:var(--muted);
    font-size:clamp(12px,3.4vw,15px); letter-spacing:.12em; line-height:1.7; max-width:34ch}
  .tagline b{color:var(--white); font-weight:700}
  .hint{position:relative; z-index:2; font-family:var(--mono); font-size:11px;
    color:color-mix(in srgb,var(--muted) 70%, transparent); letter-spacing:.2em; text-transform:uppercase}
  a.home{position:fixed; left:18px; top:16px; z-index:3; font-family:var(--mono); font-size:11px;
    letter-spacing:.2em; text-transform:uppercase; color:var(--muted); text-decoration:none;
    border:1px solid color-mix(in srgb,var(--muted) 30%, transparent); padding:7px 12px; border-radius:100px}
  a.home:hover{color:var(--white); border-color:var(--neon)}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
  <a class="home" href="/">← rhythmix</a>
  <div class="wordmark">RHYTHMIX · field notes</div>

  <div class="stage" id="stage" title="click me">
    <svg viewBox="0 0 600 400" role="img" aria-label="A pelican riding a bicycle, a glowing music note in its beak pouch, streaming notes behind it">
      <!-- road -->
      <line class="road glow" x1="40" y1="372" x2="560" y2="372" stroke="var(--neon)" stroke-width="3" stroke-linecap="round"/>

      <!-- bicycle -->
      <g fill="none" stroke="var(--neon)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" class="glow">
        <!-- wheels -->
        <g class="wheel">
          <circle cx="170" cy="300" r="70"/>
          <g stroke-width="3" opacity=".8">
            <line x1="170" y1="232" x2="170" y2="368"/><line x1="102" y1="300" x2="238" y2="300"/>
            <line x1="122" y1="252" x2="218" y2="348"/><line x1="218" y1="252" x2="122" y2="348"/>
          </g>
          <circle cx="170" cy="300" r="8" fill="var(--neon)" stroke="none"/>
        </g>
        <g class="wheel">
          <circle cx="430" cy="300" r="70"/>
          <g stroke-width="3" opacity=".8">
            <line x1="430" y1="232" x2="430" y2="368"/><line x1="362" y1="300" x2="498" y2="300"/>
            <line x1="382" y1="252" x2="478" y2="348"/><line x1="478" y1="252" x2="382" y2="348"/>
          </g>
          <circle cx="430" cy="300" r="8" fill="var(--neon)" stroke="none"/>
        </g>
        <!-- frame -->
        <path d="M170 300 L290 300 L250 210 L430 300 M290 300 L360 210 L250 210 M430 300 L360 210"/>
        <!-- seat post + seat -->
        <line x1="250" y1="210" x2="240" y2="186"/>
        <path d="M214 184 q26 -14 52 0" stroke-width="9"/>
        <!-- handlebar -->
        <line x1="360" y1="210" x2="392" y2="172"/>
        <path d="M392 172 q18 -6 30 6" stroke-width="7"/>
        <!-- pedals/crank -->
        <g class="crank">
          <line x1="290" y1="300" x2="290" y2="338"/>
          <line x1="290" y1="300" x2="290" y2="262"/>
          <rect x="276" y="334" width="28" height="9" rx="3" fill="var(--neon)" stroke="none"/>
          <rect x="276" y="258" width="28" height="9" rx="3" fill="var(--neon)" stroke="none"/>
        </g>
      </g>

      <!-- streaming notes from the pouch -->
      <g fill="var(--gold)" class="glow" style="--neon:var(--gold)">
        <g class="note n1" transform="translate(470 150)"><circle cx="0" cy="10" r="6"/><rect x="5" y="-16" width="4" height="26"/><path d="M5 -16 q14 2 14 12 q-7 -7 -14 -4z"/></g>
        <g class="note n2" transform="translate(470 150)"><circle cx="0" cy="10" r="6"/><rect x="5" y="-16" width="4" height="26"/><path d="M5 -16 q14 2 14 12 q-7 -7 -14 -4z"/></g>
        <g class="note n3" transform="translate(470 150)"><circle cx="0" cy="10" r="6"/><rect x="5" y="-16" width="4" height="26"/><path d="M5 -16 q14 2 14 12 q-7 -7 -14 -4z"/></g>
      </g>

      <!-- THE PELICAN -->
      <g class="rider">
        <!-- tail -->
        <path d="M212 150 q-46 -6 -64 18 q34 -2 60 6z" fill="var(--purple)" class="glow" style="--neon:var(--purple)"/>
        <!-- body -->
        <path d="M210 168 q-42 -78 28 -104 q66 -22 96 26 q20 30 -2 64 q-24 34 -70 30 q-38 -2 -52 -16z"
              fill="var(--white)"/>
        <!-- wing (flaps subtly via parent bob) -->
        <path d="M236 96 q54 -14 84 20 q-20 8 -44 4 q14 16 6 34 q-30 -22 -46 -58z"
              fill="color-mix(in srgb,var(--purple) 35%, var(--white))"/>
        <!-- neck + head -->
        <path d="M300 92 q34 -22 58 -6 q20 14 14 40 l-18 -2 q4 -18 -12 -26 q-20 -8 -42 6z" fill="var(--white)"/>
        <circle cx="356" cy="84" r="26" fill="var(--white)"/>
        <!-- eye -->
        <circle cx="366" cy="78" r="5.5" fill="var(--canvas)" class="blink"/>
        <circle cx="368" cy="76" r="1.8" fill="var(--white)" class="blink"/>
        <!-- upper beak -->
        <path d="M378 80 L452 70 q10 1 8 9 L380 96z" fill="var(--gold)"/>
        <!-- lower beak + throat pouch cradling a glowing note -->
        <path d="M380 94 q44 26 78 16 q14 -4 12 -18 l-12 -22 q-2 18 -22 22 q-30 6 -56 -10z"
              fill="var(--magenta)" class="glow" style="--neon:var(--magenta)"/>
        <!-- the glowing track-note inside the pouch -->
        <g class="glow" style="--neon:var(--cyan)" fill="var(--cyan)">
          <circle cx="420" cy="104" r="6"/><rect x="425" y="80" width="4" height="26"/>
          <path d="M425 80 q14 2 14 12 q-7 -7 -14 -4z"/>
        </g>
        <!-- legs reaching to pedals -->
        <g stroke="var(--gold)" stroke-width="9" stroke-linecap="round" fill="none">
          <path d="M250 168 q22 60 40 92"/>
          <path d="M268 168 q30 56 22 96"/>
        </g>
      </g>
    </svg>
  </div>

  <div class="eq" id="eq" aria-hidden="true"></div>

  <p class="tagline">The pelican scoops up <b>your track</b> and pedals it into a <b>cinematic music video.</b></p>
  <p class="hint" id="hint">click the pelican</p>

<script>
  // Build the equalizer bars
  var eq = document.getElementById('eq');
  for (var i = 0; i < 23; i++){
    var b = document.createElement('i');
    b.style.animationDuration = (0.7 + (i % 5) * 0.18).toFixed(2) + 's';
    eq.appendChild(b);
  }

  // Click the pelican: cycle the neon accent through the brand palette and bump cadence.
  var palette = ['#00d8ff','#ff1f5a','#00e887','#7c3aed','#f5c000','#ff6fc8'];
  var speeds  = ['1.1s','0.8s','0.55s','1.4s'];
  var pi = 0, si = 0;
  var root = document.documentElement;
  var stage = document.getElementById('stage');
  var hint = document.getElementById('hint');
  function tap(){
    pi = (pi + 1) % palette.length;
    si = (si + 1) % speeds.length;
    root.style.setProperty('--neon', palette[pi]);
    root.style.setProperty('--speed', speeds[si]);
    hint.textContent = 'faster · ' + palette[pi];
  }
  stage.addEventListener('click', tap);
  stage.style.cursor = 'pointer';
</script>
</body>
</html>
