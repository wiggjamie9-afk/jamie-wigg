# Minimal SearXNG settings. Replace the secret_key before first launch:
#   sed -i "s|REPLACE_WITH_OPENSSL_RAND_HEX_32|$(openssl rand -hex 32)|" searxng/settings.yml
use_default_settings: true

general:
  instance_name: "RHYTHMIX Search"

server:
  secret_key: "REPLACE_WITH_OPENSSL_RAND_HEX_32"
  bind_address: "0.0.0.0:8080"
  limiter: false
  image_proxy: true

search:
  safe_search: 0
  formats:
    - html
    - json

ui:
  static_use_hash: true
