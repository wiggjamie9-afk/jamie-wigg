<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Programmer @ 3AM</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 1080px;
      height: 1920px;
      background: linear-gradient(135deg, #08050d 0%, #1a0f2e 100%);
      font-family: "Monaco", "Courier New", monospace;
      color: #00e887;
      overflow: hidden;
      position: relative;
    }

    .scene {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 40px;
      position: relative;
    }

    .monitor {
      width: 85%;
      max-width: 900px;
      aspect-ratio: 16 / 9;
      background: #0a0408;
      border: 3px solid #ff1f5a;
      border-radius: 12px;
      padding: 20px;
      font-size: 18px;
      line-height: 1.6;
      overflow: hidden;
      box-shadow: 0 0 40px rgba(255, 31, 90, 0.4);
      position: relative;
      z-index: 10;
    }

    .monitor::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        0deg,
        rgba(0, 232, 135, 0.03) 0%,
        transparent 50%,
        rgba(0, 216, 255, 0.03) 100%
      );
      pointer-events: none;
      animation: flicker 0.15s infinite;
      border-radius: 12px;
    }

    @keyframes flicker {
      0%, 19%, 20%, 24%, 55%, 60%, 100% {
        opacity: 0.98;
      }
      20%, 24%, 55% {
        opacity: 0.92;
      }
    }

    .code-line {
      opacity: 0;
      margin: 8px 0;
      font-size: 16px;
    }

    .code-line.error {
      color: #ff1f5a;
    }

    .code-line.warning {
      color: #ffaa00;
    }

    .coffee-cup {
      position: absolute;
      bottom: 60px;
      right: 40px;
      width: 60px;
      height: 60px;
      background: #8b4513;
      border-radius: 5px 5px 8px 8px;
      border: 2px solid #654321;
      z-index: 20;
    }

    .coffee-cup::before {
      content: "";
      position: absolute;
      top: -15px;
      right: -8px;
      width: 25px;
      height: 30px;
      border: 2px solid #654321;
      border-radius: 0 15px 15px 0;
      background: transparent;
    }

    .spill {
      position: absolute;
      bottom: 50px;
      right: 80px;
      width: 100px;
      height: 60px;
      background: radial-gradient(ellipse at 30% 30%, #8b4513 0%, transparent 70%);
      filter: blur(8px);
      opacity: 0;
      border-radius: 50%;
    }

    .fire {
      position: absolute;
      bottom: 280px;
      right: 100px;
      width: 80px;
      height: 100px;
      opacity: 0;
      z-index: 25;
    }

    .flame {
      position: absolute;
      bottom: 0;
      width: 30px;
      height: 60px;
      background: linear-gradient(to top, #ff1f5a, #ffaa00, #ffd700);
      clip-path: polygon(50% 0%, 100% 38%, 82% 100%, 50% 85%, 18% 100%, 0% 38%);
      filter: blur(4px);
      animation: burn 0.8s ease-in-out infinite;
    }

    .flame:nth-child(1) {
      left: 0;
      animation-delay: 0s;
    }

    .flame:nth-child(2) {
      left: 25px;
      animation-delay: 0.2s;
    }

    .flame:nth-child(3) {
      left: 50px;
      animation-delay: 0.4s;
    }

    @keyframes burn {
      0%, 100% {
        height: 60px;
        opacity: 0.7;
      }
      50% {
        height: 100px;
        opacity: 1;
      }
    }

    .glitch {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      opacity: 0;
      pointer-events: none;
    }

    .glitch-line {
      position: absolute;
      width: 100%;
      height: 20px;
      background: rgba(255, 31, 90, 0.5);
      left: -100%;
    }

    .text-overlay {
      position: absolute;
      font-size: 48px;
      font-weight: bold;
      color: #00e887;
      opacity: 0;
      z-index: 30;
      text-shadow: 0 0 20px #00e887;
    }

    .uh-oh {
      top: 150px;
      left: 50%;
      transform: translateX(-50%);
    }

    .fine {
      bottom: 400px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 64px;
      color: #ff1f5a;
    }

    .emoji {
      position: absolute;
      font-size: 80px;
      opacity: 0;
      z-index: 35;
    }

    .emoji-panic {
      top: 200px;
      right: 80px;
    }

    .emoji-fire {
      bottom: 200px;
      left: 60px;
    }
  </style>
</head>
<body>
  <div class="scene">
    <audio autoplay>
      <source src="narration.wav" type="audio/wav" />
    </audio>

    <div class="monitor">
      <div class="code-line">$ npm start</div>
      <div class="code-line">✓ Server running on localhost:3000</div>
      <div class="code-line">&nbsp;</div>
      <div class="code-line" id="error1" class="error">TypeError: undefined is not a function</div>
      <div class="code-line" id="error2" class="error">at debugger.js:42:15</div>
      <div class="code-line" id="error3" class="error">at processRequest (request.js:73:12)</div>
      <div class="code-line" id="error4" class="warning">console.log('why am i like this')</div>
    </div>

    <div class="text-overlay uh-oh">UH OH</div>
    <div class="text-overlay fine">THIS IS FINE</div>

    <div class="emoji emoji-panic">😱</div>
    <div class="emoji emoji-fire">🔥</div>

    <div class="coffee-cup"></div>
    <div class="spill"></div>

    <div class="fire">
      <div class="flame"></div>
      <div class="flame"></div>
      <div class="flame"></div>
    </div>

    <div class="glitch">
      <div class="glitch-line"></div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script>
    const tl = gsap.timeline();

    // 0s-8s: Code errors appearing
    tl.to("#error1", { opacity: 1, duration: 0.5 }, 1);
    tl.to("#error2", { opacity: 1, duration: 0.5 }, 1.5);
    tl.to("#error3", { opacity: 1, duration: 0.5 }, 2);
    tl.to("#error4", { opacity: 1, duration: 0.5 }, 2.5);

    // 8s: UH OH appears
    tl.to(".uh-oh", { opacity: 1, duration: 0.3, scale: 1.1 }, 8);

    // 10s: Panic emoji
    tl.to(".emoji-panic", { opacity: 1, duration: 0.4 }, 10);

    // 12s: Fire appears
    tl.to(".fire", { opacity: 1, duration: 0.6 }, 12);
    tl.to(".emoji-fire", { opacity: 1, duration: 0.4 }, 12);

    // 14s: Glitch effect
    tl.to(
      ".glitch-line",
      { left: "100%", duration: 0.3, repeat: 3, yoyo: true },
      14
    );

    // 16s: THIS IS FINE appears
    tl.to(".fine", { opacity: 1, duration: 0.4, scale: 1.2 }, 16);

    // 18s-24s: Monitor shakes
    tl.to(
      ".monitor",
      {
        x: 10,
        duration: 0.1,
        repeat: 12,
        yoyo: true,
      },
      18
    );

    // 20s: Coffee spill
    tl.to(".spill", { opacity: 1, duration: 0.5 }, 20);
    tl.to(".coffee-cup", { x: 40, duration: 0.6 }, 20);

    // 28s-40s: Full chaos
    tl.to(".monitor", { boxShadow: "0 0 60px rgba(255, 31, 90, 0.8)", duration: 0.3, repeat: 5, yoyo: true }, 28);

    // 48s: Fade everything
    tl.to("body", { opacity: 0.5, duration: 1 }, 48);

    // 55s: Final frame
    tl.to(".fine", { fontSize: "80px", duration: 0.5 }, 55);
  </script>
</body>
</html>
