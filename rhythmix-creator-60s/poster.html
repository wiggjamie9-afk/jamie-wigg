<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>RHYTHMIX — Creator Poster</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    background: #08050d;
    color: #ffffff;
    font-family: "Space Grotesk", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .poster {
    position: relative;
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    background:
      radial-gradient(ellipse 900px 800px at 18% 22%, rgba(110, 255, 192, 0.30), transparent 60%),
      radial-gradient(ellipse 900px 700px at 84% 78%, rgba(255, 31, 90, 0.32), transparent 60%),
      radial-gradient(ellipse 700px 600px at 70% 30%, rgba(138, 246, 255, 0.18), transparent 65%),
      #08050d;
  }

  /* Grid texture */
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
    background-size: 80px 80px;
    mask-image: radial-gradient(ellipse 800px 1400px at 50% 50%, #000 40%, transparent 90%);
    -webkit-mask-image: radial-gradient(ellipse 800px 1400px at 50% 50%, #000 40%, transparent 90%);
  }

  /* Scanlines */
  .scan {
    position: absolute; inset: 0;
    background: repeating-linear-gradient(
      135deg,
      rgba(255, 255, 255, 0.02) 0px,
      rgba(255, 255, 255, 0.02) 1px,
      transparent 1px,
      transparent 6px
    );
    pointer-events: none;
  }

  /* Noise speckle */
  .noise {
    position: absolute; inset: 0;
    opacity: 0.35;
    mix-blend-mode: overlay;
    background-image: radial-gradient(rgba(255,255,255,0.08) 1px, transparent 1px);
    background-size: 3px 3px;
    pointer-events: none;
  }

  /* Top eyebrow */
  .eyebrow {
    position: absolute;
    top: 90px; left: 80px; right: 80px;
    display: flex; justify-content: space-between; align-items: center;
    font-family: "JetBrains Mono", monospace;
    font-size: 26px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #cfcfd8;
  }
  .eyebrow .left { color: #b6ffe0; }
  .eyebrow .dot {
    display: inline-block;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: #6effc0;
    box-shadow: 0 0 22px #6effc0;
    vertical-align: middle;
    margin-right: 14px;
    transform: translateY(-2px);
  }
  .eyebrow .right { color: #ffd9e8; }

  /* WORDMARK */
  .wordmark {
    position: absolute;
    top: 188px; left: 0; right: 0;
    text-align: center;
    font-family: "Space Grotesk", system-ui, sans-serif;
    font-weight: 800;
    font-size: 138px;
    letter-spacing: 0.05em;
    line-height: 1;
    background: linear-gradient(135deg, #6effc0, #8af6ff 45%, #ff7aa6);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
    text-shadow: 0 0 80px rgba(110, 255, 192, 0.22);
  }
  .wordmark::after {
    content: "";
    display: block;
    width: 240px; height: 4px;
    margin: 28px auto 0;
    background: linear-gradient(90deg, transparent, #6effc0, #8af6ff, #ff1f5a, transparent);
    box-shadow: 0 0 18px rgba(110, 255, 192, 0.55);
  }

  /* HEY block */
  .hey-block {
    position: absolute;
    top: 460px;
    left: 60px; right: 60px;
    text-align: left;
  }
  .hey-block .hey-mono {
    display: inline-block;
    font-family: "JetBrains Mono", monospace;
    font-size: 30px;
    letter-spacing: 0.32em;
    color: #b6ffe0;
    text-transform: uppercase;
    margin-bottom: 22px;
    padding: 8px 0;
  }
  .hey-block .creator {
    font-family: "Space Grotesk", system-ui, sans-serif;
    font-weight: 800;
    font-size: 220px;
    line-height: 0.88;
    letter-spacing: -0.045em;
    background: linear-gradient(135deg, #6effc0, #8af6ff);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
    margin-bottom: 28px;
  }
  .you-pill {
    display: inline-flex; align-items: center; gap: 16px;
    padding: 16px 34px;
    border: 1px solid rgba(110, 255, 192, 0.6);
    background: rgba(110, 255, 192, 0.14);
    border-radius: 999px;
    font-family: "JetBrains Mono", monospace;
    font-size: 30px;
    letter-spacing: 0.32em;
    color: #b6ffe0;
    text-transform: uppercase;
    font-weight: 700;
  }
  .you-pill .ydot {
    width: 14px; height: 14px; border-radius: 50%;
    background: #6effc0; box-shadow: 0 0 22px #6effc0;
  }

  /* Hook stanza */
  .hook {
    position: absolute;
    top: 1010px;
    left: 60px; right: 60px;
    font-family: "Space Grotesk", system-ui, sans-serif;
    font-weight: 700;
    line-height: 0.95;
    letter-spacing: -0.025em;
  }
  .hook .line {
    display: block;
    font-size: 96px;
    margin-bottom: 18px;
    color: #ffffff;
  }
  .hook .line .tag {
    font-family: "JetBrains Mono", monospace;
    font-size: 26px;
    letter-spacing: 0.28em;
    color: #cfcfd8;
    text-transform: uppercase;
    font-weight: 500;
    display: block;
    margin-bottom: 8px;
  }
  .hook .accent-hot {
    background: linear-gradient(135deg, #ff1f5a, #ff7aa6 50%, #f5c000);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
  }
  .hook .accent-gold {
    background: linear-gradient(135deg, #ffe070, #ff7aa6);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
  }

  /* Floating chips */
  .chip {
    position: absolute;
    font-family: "JetBrains Mono", monospace;
    font-size: 20px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    padding: 10px 18px;
    border-radius: 999px;
    background: rgba(110, 255, 192, 0.16);
    color: #b6ffe0;
    border: 1px solid rgba(110, 255, 192, 0.45);
    font-weight: 700;
  }
  .chip.c1 { top: 940px; right: 70px; transform: rotate(5deg); }
  .chip.c2 {
    top: 968px; left: 60px; transform: rotate(-3deg);
    background: rgba(255, 31, 90, 0.18);
    color: #ffd9e8;
    border-color: rgba(255, 31, 90, 0.45);
  }

  /* Subhead band — price */
  .subhead {
    position: absolute;
    bottom: 280px;
    left: 60px; right: 60px;
    padding: 38px 44px;
    background: linear-gradient(135deg, rgba(40, 30, 60, 0.85), rgba(28, 22, 42, 0.6));
    border: 1px solid rgba(110, 255, 192, 0.4);
    border-radius: 22px;
    backdrop-filter: blur(8px);
  }
  .subhead .label {
    font-family: "JetBrains Mono", monospace;
    font-size: 22px;
    letter-spacing: 0.3em;
    color: #b6ffe0;
    text-transform: uppercase;
    margin-bottom: 14px;
  }
  .subhead .price {
    font-family: "Space Grotesk", system-ui, sans-serif;
    font-weight: 800;
    font-size: 80px;
    line-height: 1;
    letter-spacing: -0.012em;
    color: #ffffff;
    display: flex;
    align-items: baseline;
    gap: 22px;
    flex-wrap: wrap;
  }
  .subhead .price .amount {
    background: linear-gradient(135deg, #ff1f5a, #ff7aa6 50%, #f5c000);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
  }
  .subhead .price .sep {
    width: 8px; height: 8px;
    background: #f5c000;
    box-shadow: 0 0 16px #f5c000;
    border-radius: 50%;
    transform: translateY(-14px);
  }
  .subhead .price .lifetime {
    font-size: 62px;
    color: #ffffff;
  }

  /* CTA strip */
  .cta {
    position: absolute;
    bottom: 110px;
    left: 60px; right: 60px;
    display: flex; align-items: center; justify-content: space-between;
    font-family: "JetBrains Mono", monospace;
    text-transform: uppercase;
  }
  .cta .url {
    font-size: 36px;
    letter-spacing: 0.18em;
    color: #ffffff;
    font-weight: 700;
  }
  .cta .url .dot { color: #6effc0; }
  .cta .badge {
    font-size: 22px;
    letter-spacing: 0.3em;
    color: #08050d;
    background: #6effc0;
    box-shadow: 0 0 22px rgba(110, 255, 192, 0.6);
    padding: 14px 22px;
    border-radius: 999px;
    font-weight: 700;
  }

  /* Bottom edge glow bar */
  .edge {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 6px;
    background: linear-gradient(90deg, #6effc0, #8af6ff 30%, #ff7aa6 60%, #ff1f5a);
    box-shadow: 0 0 30px rgba(110, 255, 192, 0.5);
  }
</style>
</head>
<body>
  <div class="poster">
    <div class="grid"></div>
    <div class="scan"></div>

    <div class="eyebrow">
      <span class="left"><span class="dot"></span>CREATOR // 60s</span>
      <span class="right">FOR THE WORKING CREATOR</span>
    </div>

    <div class="wordmark">RHYTHMIX</div>

    <div class="hey-block">
      <span class="hey-mono">Hey</span>
      <div class="creator">creator.</div>
      <div class="you-pill"><span class="ydot"></span>You</div>
    </div>

    <div class="chip c1">A track a week</div>
    <div class="chip c2">No subscription drag</div>

    <div class="hook">
      <span class="line">
        <span class="tag">The one</span>
        shipping a <span class="accent-hot">track a week.</span>
      </span>
      <span class="line">
        <span class="tag">Tired of</span>
        <span class="accent-gold">$5K</span> music videos.
      </span>
    </div>

    <div class="subhead">
      <div class="label">Built for working creators</div>
      <div class="price">
        <span class="amount">AU$149</span>
        <span class="sep"></span>
        <span class="lifetime">Lifetime.</span>
      </div>
    </div>

    <div class="cta">
      <div class="url">RHYTHMIXAPP<span class="dot">.</span>COM<span class="dot">.</span>AU</div>
      <div class="badge">One Price</div>
    </div>

    <div class="noise"></div>
    <div class="edge"></div>
  </div>
</body>
</html>
