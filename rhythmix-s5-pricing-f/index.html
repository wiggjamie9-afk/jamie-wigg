<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #08050d; font-family: "Space Grotesk", system-ui, sans-serif; color: #ffffff; }
      .scene { position: absolute; inset: 0; width: 1080px; height: 1920px; }
      .scene-inner { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 100px 80px; box-sizing: border-box; background: #08050d; }
      .bg-radial { position: absolute; inset: 0; background: radial-gradient(700px 800px at 25% 25%, rgba(245,192,0,0.15), transparent 60%), radial-gradient(600px 700px at 75% 75%, rgba(124,58,237,0.25), transparent 65%); pointer-events: none; }
      .grid-overlay { position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,0.045) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.045) 1px, transparent 1px); background-size: 60px 60px; pointer-events: none; }
      .gradient-text { background: linear-gradient(135deg, #ff7aa6, #e0c0ff 50%, #8af6ff); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent; }

      #s1 .wordmark { font-weight: 800; font-size: 160px; line-height: 0.88; letter-spacing: -5px; margin-bottom: 36px; text-align: center; }
      #s1 .headline { font-weight: 800; font-size: 80px; line-height: 0.95; letter-spacing: -2px; text-align: center; color: #f5c000; }
      #s1 .eyebrow { font-family: "JetBrains Mono", monospace; font-size: 28px; letter-spacing: 5px; color: #b9b3c6; text-transform: uppercase; text-align: center; margin-top: 24px; }

      #s2-inner { gap: 20px; }
      .plan-row { width: 100%; padding: 28px 40px; background: rgba(255,255,255,0.04); border: 1.5px solid rgba(255,255,255,0.1); border-radius: 18px; display: flex; align-items: center; justify-content: space-between; }
      .plan-row.popular { border-color: rgba(124,58,237,0.5); background: rgba(124,58,237,0.08); }
      .plan-name { font-weight: 700; font-size: 44px; letter-spacing: -1px; }
      .plan-badge { font-family: "JetBrains Mono", monospace; font-size: 18px; letter-spacing: 3px; padding: 6px 16px; border-radius: 999px; text-transform: uppercase; }
      .plan-price { font-weight: 800; font-size: 52px; letter-spacing: -1px; }
      .plan-price span { font-family: "JetBrains Mono", monospace; font-size: 26px; font-weight: 400; color: #b9b3c6; letter-spacing: 1px; }

      #s3-inner { gap: 32px; }
      #s3 .deal-badge { font-family: "JetBrains Mono", monospace; font-size: 24px; letter-spacing: 5px; color: #f5c000; text-transform: uppercase; text-align: center; }
      #s3 .deal-price { font-weight: 800; font-size: 160px; letter-spacing: -6px; line-height: 0.85; text-align: center; color: #f5c000; }
      #s3 .deal-sub { font-size: 38px; color: #e6e6ee; text-align: center; line-height: 1.3; }
      #s3 .deal-was { font-family: "JetBrains Mono", monospace; font-size: 26px; letter-spacing: 2px; color: rgba(255,255,255,0.4); text-decoration: line-through; text-align: center; }
      #s3 .deal-spots { font-family: "JetBrains Mono", monospace; font-size: 28px; letter-spacing: 3px; color: #ff1f5a; text-transform: uppercase; text-align: center; }
      #s3 .cta { font-weight: 700; font-size: 40px; padding: 28px 80px; background: linear-gradient(135deg, #f5c000, #ff1f5a); border-radius: 999px; color: #ffffff; box-shadow: 0 0 60px rgba(245,192,0,0.4); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="s5-pricing-f" data-start="0" data-duration="32" data-width="1080" data-height="1920">
      <audio id="vo" class="clip" data-start="0" data-duration="auto" data-track-index="10" src="narration.wav" data-volume="1"></audio>

      <div id="s1" class="scene clip" data-start="0" data-duration="3.5" data-track-index="1">
        <div class="scene-inner" id="s1-inner">
          <div class="bg-radial"></div><div class="grid-overlay"></div>
          <div class="wordmark gradient-text">RHYTHMIX</div>
          <div class="headline">Pricing</div>
          <div class="eyebrow">Including a Lifetime Deal</div>
        </div>
      </div>

      <div id="s2" class="scene clip" data-start="3" data-duration="20" data-track-index="2">
        <div class="scene-inner" id="s2-inner">
          <div class="bg-radial"></div><div class="grid-overlay"></div>
          <div id="p1" class="plan-row"><div class="plan-name">Free</div><div class="plan-price">$0<span>/mo</span></div></div>
          <div id="p2" class="plan-row"><div class="plan-name">Starter</div><div class="plan-price">$9<span>/mo</span></div></div>
          <div id="p3" class="plan-row popular"><div><div class="plan-name gradient-text">Pro</div><div class="plan-badge" style="background:rgba(124,58,237,0.2);color:#c084fc;border:1.5px solid rgba(124,58,237,0.4)">Most Popular</div></div><div class="plan-price gradient-text">$19<span style="-webkit-text-fill-color:#b9b3c6">/mo</span></div></div>
          <div id="p4" class="plan-row"><div class="plan-name">Studio</div><div class="plan-price">$49<span>/mo</span></div></div>
        </div>
      </div>

      <div id="s3" class="scene clip" data-start="23" data-duration="9" data-track-index="3">
        <div class="scene-inner" id="s3-inner">
          <div class="bg-radial"></div><div class="grid-overlay"></div>
          <div class="deal-badge">⚡ Lifetime Deal</div>
          <div class="deal-price">$149</div>
          <div class="deal-sub">All 14 tools · Forever<br/>No monthly fees. Ever.</div>
          <div class="deal-was">was $588/year</div>
          <div class="deal-spots">47 Spots Left</div>
          <div class="cta">Join the Waitlist</div>
        </div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      tl.from("#s1 .wordmark", { y: 40, opacity: 0, duration: 0.7, ease: "expo.out" }, 0.2);
      tl.from("#s1 .headline", { y: 50, opacity: 0, scale: 0.92, duration: 0.8, ease: "expo.out" }, 0.5);
      tl.from("#s1 .eyebrow", { opacity: 0, duration: 0.4, ease: "power2.out" }, 1.1);

      tl.to("#s1-inner", { opacity: 0, duration: 0.5, ease: "power1.inOut" }, 3.0);
      tl.from("#s2-inner", { opacity: 0, duration: 0.5, ease: "power1.inOut" }, 3.0);

      tl.from("#p1", { x: -60, opacity: 0, duration: 0.45, ease: "expo.out" }, 3.3);
      tl.from("#p2", { x: -60, opacity: 0, duration: 0.45, ease: "expo.out" }, 3.7);
      tl.from("#p3", { x: -60, opacity: 0, scale: 1.04, duration: 0.5, ease: "expo.out" }, 4.1);
      tl.from("#p4", { x: -60, opacity: 0, duration: 0.45, ease: "expo.out" }, 4.5);

      tl.to("#s2-inner", { opacity: 0, duration: 0.5, ease: "power1.inOut" }, 23.0);
      tl.from("#s3-inner", { opacity: 0, duration: 0.5, ease: "power1.inOut" }, 23.0);

      tl.from("#s3 .deal-badge", { opacity: 0, duration: 0.4, ease: "power2.out" }, 23.4);
      tl.from("#s3 .deal-price", { y: 50, opacity: 0, scale: 0.88, duration: 0.8, ease: "expo.out" }, 23.7);
      tl.from("#s3 .deal-sub", { opacity: 0, duration: 0.4, ease: "power1.out" }, 24.4);
      tl.from("#s3 .deal-was", { opacity: 0, duration: 0.3, ease: "power1.out" }, 24.8);
      tl.from("#s3 .deal-spots", { y: 16, opacity: 0, duration: 0.4, ease: "power2.out" }, 25.2);
      tl.from("#s3 .cta", { y: 24, opacity: 0, duration: 0.5, ease: "power2.out" }, 25.8);

      tl.to("#s3-inner", { opacity: 0, duration: 0.6, ease: "power2.inOut" }, 31.0);

      window.__timelines["s5-pricing-f"] = tl;
    </script>
  </body>
</html>
