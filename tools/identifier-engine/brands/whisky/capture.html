<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Drambook — Scan a bottle</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root { color-scheme: dark; }
  body { font-family: ui-serif, Georgia, serif; background: #0d0a08; min-height: 100dvh; }
</style>
</head>
<body class="text-amber-50 flex flex-col">

<header class="px-6 py-5 flex items-center justify-between max-w-5xl mx-auto w-full">
  <a href="./landing.html" class="text-xl tracking-wide">Drambook<span class="text-amber-400">.</span></a>
  <span id="scans-remaining" class="text-xs text-amber-100/60">First scan free</span>
</header>

<main class="flex-1 flex flex-col items-center justify-center px-6 pb-10">
  <div id="step-capture" class="w-full max-w-md">
    <h1 class="text-3xl text-center mb-8">Snap the bottle</h1>
    <label class="block border-2 border-dashed border-amber-400/40 rounded-2xl p-10 text-center cursor-pointer hover:border-amber-400 transition">
      <input id="file" type="file" accept="image/*" capture="environment" class="hidden">
      <div class="text-5xl mb-3">📷</div>
      <div class="text-amber-100/80">Tap to open camera or pick a photo</div>
      <div class="mt-2 text-xs text-amber-100/50">Front label works best. Back label and neck help with rare bottles.</div>
    </label>
  </div>

  <div id="step-loading" class="hidden w-full max-w-md text-center">
    <img id="preview" class="w-full rounded-2xl mb-6 border border-amber-100/10" alt="">
    <div class="inline-flex items-center gap-3">
      <div class="w-3 h-3 rounded-full bg-amber-400 animate-pulse"></div>
      <span class="text-amber-100/80">Reading the label…</span>
    </div>
  </div>

  <div id="step-result" class="hidden w-full max-w-md">
    <img id="result-preview" class="w-full rounded-2xl mb-6 border border-amber-100/10" alt="">
    <div id="result-body" class="space-y-5"></div>
    <button onclick="reset()" class="mt-8 w-full py-3 border border-amber-100/20 hover:border-amber-400 transition">Scan another</button>
  </div>

  <div id="step-error" class="hidden w-full max-w-md text-center">
    <div class="text-4xl mb-4">😬</div>
    <div id="error-message" class="text-amber-100/80"></div>
    <button onclick="reset()" class="mt-8 px-6 py-2 border border-amber-100/20 hover:border-amber-400 transition">Try again</button>
  </div>
</main>

<script>
const WORKER_URL = window.WORKER_URL || "https://identifier-engine.YOUR-SUBDOMAIN.workers.dev/scan";
const IDENTIFIER_KEY = window.IDENTIFIER_KEY || "dev-key";

const $ = (id) => document.getElementById(id);
const show = (which) => ["capture","loading","result","error"].forEach(s => $(`step-${s}`).classList.toggle("hidden", s !== which));
function reset() { $("file").value = ""; show("capture"); }

$("file").addEventListener("change", async (e) => {
  const file = e.target.files?.[0];
  if (!file) return;

  const dataUrl = await readAsDataUrl(file);
  $("preview").src = dataUrl;
  $("result-preview").src = dataUrl;
  show("loading");

  try {
    const base64 = dataUrl.split(",")[1];
    const res = await fetch(WORKER_URL, {
      method: "POST",
      headers: { "content-type": "application/json", "x-identifier-key": IDENTIFIER_KEY },
      body: JSON.stringify({ brand: "whisky", image: base64 }),
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    renderResult(await res.json());
  } catch (err) {
    $("error-message").textContent = err.message || "Something went wrong.";
    show("error");
  }
});

function renderResult(r) {
  const row = (label, value) => value == null || value === "" ? "" :
    `<div class="flex justify-between border-b border-amber-100/10 py-2">
       <span class="text-amber-100/50">${label}</span>
       <span class="text-right">${value}</span>
     </div>`;

  if (r.needs_more_photos) {
    $("result-body").innerHTML = `
      <div class="text-center text-amber-100/80">Not enough to be sure. Try:</div>
      <ul class="text-amber-100/70 list-disc pl-6">
        ${(r.follow_up || []).map(f => `<li>${f}</li>`).join("")}
      </ul>`;
  } else {
    $("result-body").innerHTML = `
      <h2 class="text-3xl text-amber-400">${r.distillery || "Unknown"}</h2>
      <div class="text-xl">${r.expression || ""}</div>
      ${row("Region", r.region)}
      ${row("Age", r.age_statement ? r.age_statement + " yrs" : null)}
      ${row("ABV", r.abv)}
      ${row("Cask", r.cask_type)}
      ${row("Bottled", r.year_bottled)}
      ${row("Edition", r.edition_or_batch)}
      ${row("Rarity", r.rarity)}
      ${r.price_range_usd ? row("Est. value", `$${r.price_range_usd[0]}–$${r.price_range_usd[1]} USD`) : ""}
      ${r.tasting_notes ? `<div class="pt-4 italic text-amber-100/70">${r.tasting_notes}</div>` : ""}
      ${r.authenticity_warning ? `<div class="mt-4 p-3 border border-red-400/40 text-red-200 text-sm">⚠ Often counterfeited. Verify provenance before bidding.</div>` : ""}
    `;
  }
  show("result");
}

function readAsDataUrl(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}
</script>
</body>
</html>
