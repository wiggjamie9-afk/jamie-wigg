<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BoxSorted — Identify a piece</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>body { font-family: ui-sans-serif, system-ui, sans-serif; background: #faf7f2; min-height: 100dvh; }</style>
</head>
<body class="text-stone-900 flex flex-col">

<header class="px-6 py-5 flex items-center justify-between max-w-5xl mx-auto w-full">
  <a href="./landing.html" class="text-xl font-bold tracking-tight">BoxSorted</a>
  <span id="scans-remaining" class="text-xs text-stone-500">First scan free</span>
</header>

<main class="flex-1 flex flex-col items-center justify-center px-6 pb-10">
  <div id="step-capture" class="w-full max-w-md">
    <h1 class="text-3xl font-bold text-center mb-8">Snap the piece</h1>
    <label class="block bg-white border-2 border-dashed border-emerald-400 rounded-2xl p-10 text-center cursor-pointer hover:border-emerald-600 transition shadow-sm">
      <input id="file" type="file" accept="image/*" capture="environment" class="hidden">
      <div class="text-5xl mb-3">📷</div>
      <div class="text-stone-800 font-semibold">Tap to open camera or pick a photo</div>
      <div class="mt-2 text-xs text-stone-500">Lay it flat on a plain surface. One piece at a time works best.</div>
    </label>
  </div>

  <div id="step-loading" class="hidden w-full max-w-md text-center">
    <img id="preview" class="w-full rounded-2xl mb-6 shadow-sm" alt="">
    <div class="inline-flex items-center gap-3">
      <div class="w-3 h-3 rounded-full bg-emerald-600 animate-pulse"></div>
      <span class="text-stone-700">Looking it up…</span>
    </div>
  </div>

  <div id="step-result" class="hidden w-full max-w-md">
    <img id="result-preview" class="w-full rounded-2xl mb-6 shadow-sm" alt="">
    <div id="result-body" class="space-y-4"></div>
    <button onclick="reset()" class="mt-8 w-full py-3 border-2 border-stone-300 hover:border-emerald-600 rounded-full font-semibold transition">Identify another</button>
  </div>

  <div id="step-error" class="hidden w-full max-w-md text-center">
    <div class="text-4xl mb-4">🤔</div>
    <div id="error-message" class="text-stone-700"></div>
    <button onclick="reset()" class="mt-8 px-6 py-2 border-2 border-stone-300 hover:border-emerald-600 rounded-full transition">Try again</button>
  </div>
</main>

<script>
const WORKER_URL = window.WORKER_URL || "https://identifier-engine.YOUR-SUBDOMAIN.workers.dev/scan";
const IDENTIFIER_KEY = window.IDENTIFIER_KEY || "dev-key";

const $ = (id) => document.getElementById(id);
const show = (which) => ["capture","loading","result","error"].forEach(s => $(`step-${s}`).classList.toggle("hidden", s !== which));
function reset() { $("file").value = ""; show("capture"); }

$("file").addEventListener("change", async (e) => {
  const file = e.target.files?.[0];
  if (!file) return;

  const dataUrl = await readAsDataUrl(file);
  $("preview").src = dataUrl;
  $("result-preview").src = dataUrl;
  show("loading");

  try {
    const base64 = dataUrl.split(",")[1];
    const res = await fetch(WORKER_URL, {
      method: "POST",
      headers: { "content-type": "application/json", "x-identifier-key": IDENTIFIER_KEY },
      body: JSON.stringify({ brand: "boardgame", image: base64 }),
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    renderResult(await res.json());
  } catch (err) {
    $("error-message").textContent = err.message || "Something went wrong.";
    show("error");
  }
});

function renderResult(r) {
  if (!r.candidates || r.candidates.length === 0) {
    $("result-body").innerHTML = `
      <div class="bg-white p-5 rounded-2xl shadow-sm">
        <div class="font-semibold mb-2">No match yet.</div>
        <div class="text-stone-600 text-sm">${r.distinctive_features || "Couldn't pin this to a known game."}</div>
        ${r.follow_up?.length ? `<ul class="mt-3 text-sm text-stone-700 list-disc pl-5">${r.follow_up.map(f => `<li>${f}</li>`).join("")}</ul>` : ""}
      </div>`;
    show("result");
    return;
  }

  const cards = r.candidates.map((c, i) => `
    <div class="bg-white p-5 rounded-2xl shadow-sm ${i === 0 ? "border-2 border-emerald-600" : ""}">
      <div class="flex items-baseline justify-between">
        <div class="text-xl font-bold">${c.game}${c.edition ? ` <span class="text-stone-500 text-sm font-normal">— ${c.edition}</span>` : ""}</div>
        <div class="text-xs text-stone-500">${Math.round(c.confidence * 100)}%</div>
      </div>
      <div class="text-sm text-stone-600 mt-2">${c.reason || ""}</div>
      ${c.game_info ? `<div class="text-xs text-stone-400 mt-3">${c.game_info.publisher} · ${c.game_info.year} · designed by ${c.game_info.designer}</div>` : ""}
    </div>`).join("");

  $("result-body").innerHTML = `
    <div class="text-stone-500 text-sm uppercase tracking-wide">${r.component_type || "piece"}${r.component_count > 1 ? ` · ${r.component_count} shown` : ""}</div>
    ${cards}`;
  show("result");
}

function readAsDataUrl(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}
</script>
</body>
</html>
