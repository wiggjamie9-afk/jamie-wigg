# Run with:  docker compose up -d
# Then visit: http://localhost:3000 (first user becomes admin)
#
# Open WebUI: a self-hosted ChatGPT-style interface for any LLM API
# (OpenAI, Anthropic, Ollama, local). Bundled RAG, voice, multi-user.
# https://github.com/open-webui/open-webui

services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    ports:
      - "3000:8080"
    volumes:
      - open-webui-data:/app/backend/data
    environment:
      # Wire in API keys from a .env file beside this compose (gitignored).
      # Any one of these is enough — set what you have.
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_API_BASE_URL=${OPENAI_API_BASE_URL:-https://api.openai.com/v1}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # Optional: connect to a separately-running Ollama container for local models
      # - OLLAMA_BASE_URL=http://ollama:11434
      # Admin / signup behaviour
      - ENABLE_SIGNUP=false           # set to true on first run to create your account
      - DEFAULT_USER_ROLE=admin       # first user gets admin
      - WEBUI_AUTH=true               # require login
      # Optional branding so it doesn't say "Open WebUI"
      - WEBUI_NAME=RHYTHMIX AI

  # Uncomment to also run Ollama locally (for offline open-weight models).
  # Needs a few GB of disk per model. Recommended only on hosts with a GPU.
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: ollama
  #   restart: unless-stopped
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama-data:/root/.ollama

volumes:
  open-webui-data:
  # ollama-data:
