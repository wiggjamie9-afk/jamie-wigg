<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jackson's Ecosystem</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1a1f4a 50%, #0f1b3f 100%);
      width: 1920px;
      height: 1080px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      overflow: hidden;
    }

    .stage {
      width: 100%;
      height: 100%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Animated background */
    .bg-grid {
      position: absolute;
      width: 100%;
      height: 100%;
      opacity: 0.1;
      background-image:
        linear-gradient(90deg, rgba(255,255,255,0.1) 1px, transparent 1px),
        linear-gradient(rgba(255,255,255,0.1) 1px, transparent 1px);
      background-size: 50px 50px;
    }

    .accent-blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.3;
    }

    .blob-1 {
      width: 400px;
      height: 400px;
      background: #6366f1;
      top: -100px;
      left: -100px;
      animation: float 6s ease-in-out infinite;
    }

    .blob-2 {
      width: 400px;
      height: 400px;
      background: #ec4899;
      bottom: -100px;
      right: -100px;
      animation: float 8s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-20px); }
    }

    .content {
      position: relative;
      z-index: 10;
      text-align: center;
      max-width: 1400px;
    }

    .logo-section {
      margin-bottom: 60px;
      animation: slide-down 1s ease-out 0.2s both;
    }

    .icon {
      font-size: 80px;
      margin-bottom: 20px;
      filter: drop-shadow(0 0 20px rgba(99, 102, 241, 0.5));
    }

    h1 {
      font-size: 72px;
      font-weight: 800;
      letter-spacing: -2px;
      margin-bottom: 20px;
      background: linear-gradient(135deg, #fff 0%, #e0e7ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: slide-up 1s ease-out 0.4s both;
    }

    .tagline {
      font-size: 24px;
      color: #a5b4fc;
      margin-bottom: 60px;
      font-weight: 300;
      letter-spacing: 0.5px;
      animation: slide-up 1s ease-out 0.6s both;
    }

    .features {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 40px;
      margin-bottom: 60px;
      animation: slide-up 1s ease-out 0.8s both;
    }

    .feature {
      padding: 30px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      min-height: 200px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
    }

    .feature:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.2);
      transform: translateY(-8px);
    }

    .feature-icon {
      font-size: 48px;
      margin-bottom: 16px;
    }

    .feature-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .feature-desc {
      font-size: 14px;
      color: #c7d2fe;
      line-height: 1.5;
    }

    .cta {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 16px 40px;
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
      border-radius: 8px;
      font-size: 18px;
      font-weight: 600;
      text-decoration: none;
      color: white;
      border: none;
      cursor: pointer;
      box-shadow: 0 8px 32px rgba(99, 102, 241, 0.4);
      animation: slide-up 1s ease-out 1s both;
    }

    .cta:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 48px rgba(99, 102, 241, 0.6);
    }

    @keyframes slide-up {
      from {
        opacity: 0;
        transform: translateY(40px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes slide-down {
      from {
        opacity: 0;
        transform: translateY(-40px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .feature-pulse {
      animation: pulse 3s ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 rgba(99, 102, 241, 0.3); }
      50% { box-shadow: 0 0 20px rgba(99, 102, 241, 0.3); }
    }
  </style>
</head>
<body>
  <div class="stage" data-composition-id="jackson-ecosystem-60s" data-width="1920" data-height="1080" data-start="0">
    <div class="bg-grid"></div>
    <div class="accent-blob blob-1"></div>
    <div class="accent-blob blob-2"></div>

    <div class="content">
      <div class="logo-section">
        <div class="icon">🎬</div>
      </div>

      <h1>Jackson's Ecosystem</h1>
      <p class="tagline">Transform your creative workflow in one command</p>

      <div class="features">
        <div class="feature feature-pulse" style="animation-delay: 0s">
          <div class="feature-icon">📹</div>
          <div class="feature-title">Video to Text</div>
          <div class="feature-desc">Extract transcripts from video instantly</div>
        </div>

        <div class="feature feature-pulse" style="animation-delay: 0.1s">
          <div class="feature-icon">✨</div>
          <div class="feature-title">Text Enhancement</div>
          <div class="feature-desc">Claude AI refines your content</div>
        </div>

        <div class="feature feature-pulse" style="animation-delay: 0.2s">
          <div class="feature-icon">🎤</div>
          <div class="feature-title">Professional Narration</div>
          <div class="feature-desc">Kokoro & ElevenLabs TTS</div>
        </div>

        <div class="feature feature-pulse" style="animation-delay: 0.3s">
          <div class="feature-icon">🎵</div>
          <div class="feature-title">Background Music</div>
          <div class="feature-desc">Pixabay & MusicGen</div>
        </div>
      </div>

      <button class="cta">
        <span>🚀</span>
        <span>Get Started Free</span>
      </button>
    </div>
  </div>

  <script>
    // HyperFrames deterministic timeline registration
    const COMPOSITION_ID = 'jackson-ecosystem-60s';
    const DURATION_S = 60;

    // Register composition timeline for HyperFrames
    window.__timelines = window.__timelines || {};

    class TimelineController {
      constructor() {
        this._paused = false;
      }

      duration() {
        return DURATION_S;
      }

      seek(time) {
        updateAnimationState(time);
      }

      play() {
        this._paused = false;
      }

      pause() {
        this._paused = true;
      }

      isPaused() {
        return this._paused;
      }
    }

    window.__timelines[COMPOSITION_ID] = new TimelineController();

    // Expose HyperFrames interface
    window.__hf = {
      duration: DURATION_S,
      seek: function(time) {
        updateAnimationState(time);
      }
    };

    function updateAnimationState(time) {
      const stage = document.querySelector('[data-composition-id]');
      if (!stage) return;

      // Update opacity and transform based on timeline position
      const features = document.querySelectorAll('.feature');
      features.forEach((feature, idx) => {
        const startTime = 0.8 + (idx * 0.05); // Stagger start
        const progress = Math.max(0, Math.min(1, (time - startTime) / 0.6));
        feature.style.opacity = progress;
        feature.style.transform = `translateY(${40 * (1 - progress)}px)`;
      });

      // Float animation for blobs
      const blob1 = document.querySelector('.blob-1');
      const blob2 = document.querySelector('.blob-2');
      if (blob1) {
        const floatAmount = Math.sin((time / 6) * Math.PI * 2) * 20;
        blob1.style.transform = `translateY(${floatAmount}px)`;
      }
      if (blob2) {
        const floatAmount = Math.sin((time / 8) * Math.PI * 2) * 20;
        blob2.style.transform = `translateY(${floatAmount}px)`;
      }
    }

    // Initialize
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', () => {
        updateAnimationState(0);
      });
    } else {
      updateAnimationState(0);
    }
  </script>
</body>
</html>
