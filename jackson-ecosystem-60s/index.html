<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jackson's Ecosystem</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1a1f4a 50%, #0f1b3f 100%);
      width: 1920px;
      height: 1080px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      overflow: hidden;
    }

    .stage {
      width: 100%;
      height: 100%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Animated background */
    .bg-grid {
      position: absolute;
      width: 100%;
      height: 100%;
      opacity: 0.1;
      background-image:
        linear-gradient(90deg, rgba(255,255,255,0.1) 1px, transparent 1px),
        linear-gradient(rgba(255,255,255,0.1) 1px, transparent 1px);
      background-size: 50px 50px;
    }

    .accent-blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.3;
    }

    .blob-1 {
      width: 400px;
      height: 400px;
      background: #6366f1;
      top: -100px;
      left: -100px;
    }

    .blob-2 {
      width: 400px;
      height: 400px;
      background: #ec4899;
      bottom: -100px;
      right: -100px;
    }

    .content {
      position: relative;
      z-index: 10;
      text-align: center;
      max-width: 1400px;
    }

    .logo-section {
      margin-bottom: 60px;
    }

    .icon {
      font-size: 80px;
      margin-bottom: 20px;
      filter: drop-shadow(0 0 20px rgba(99, 102, 241, 0.5));
    }

    h1 {
      font-size: 72px;
      font-weight: 800;
      letter-spacing: -2px;
      margin-bottom: 20px;
      background: linear-gradient(135deg, #fff 0%, #e0e7ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .tagline {
      font-size: 24px;
      color: #a5b4fc;
      margin-bottom: 60px;
      font-weight: 300;
      letter-spacing: 0.5px;
    }

    .features {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 40px;
      margin-bottom: 60px;
    }

    .feature {
      padding: 30px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      min-height: 200px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .feature-icon {
      font-size: 48px;
      margin-bottom: 16px;
    }

    .feature-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .feature-desc {
      font-size: 14px;
      color: #c7d2fe;
      line-height: 1.5;
    }

    .cta {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 16px 40px;
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
      border-radius: 8px;
      font-size: 18px;
      font-weight: 600;
      text-decoration: none;
      color: white;
      border: none;
      cursor: pointer;
      box-shadow: 0 8px 32px rgba(99, 102, 241, 0.4);
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .cta:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 48px rgba(99, 102, 241, 0.6);
    }

    /* Animations */
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-20px); }
    }

    @keyframes glow {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }

    @keyframes slide-up {
      from {
        opacity: 0;
        transform: translateY(40px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes slide-down {
      from {
        opacity: 0;
        transform: translateY(-40px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .blob-1 {
      animation: float 6s ease-in-out infinite;
    }

    .blob-2 {
      animation: float 8s ease-in-out infinite;
    }

    .logo-section {
      animation: slide-down 1s ease-out 0.2s both;
    }

    h1 {
      animation: slide-up 1s ease-out 0.4s both;
    }

    .tagline {
      animation: slide-up 1s ease-out 0.6s both;
    }

    .features {
      animation: slide-up 1s ease-out 0.8s both;
    }

    .cta {
      animation: slide-up 1s ease-out 1s both;
    }

    .feature {
      transition: all 0.3s ease;
    }

    .feature:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.2);
      transform: translateY(-8px);
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="bg-grid"></div>
    <div class="accent-blob blob-1"></div>
    <div class="accent-blob blob-2"></div>

    <div class="content">
      <div class="logo-section">
        <div class="icon">🎬</div>
      </div>

      <h1>Jackson's Ecosystem</h1>
      <p class="tagline">Transform your creative workflow in one command</p>

      <div class="features">
        <div class="feature">
          <div class="feature-icon">📹</div>
          <div class="feature-title">Video to Text</div>
          <div class="feature-desc">Extract transcripts from video instantly</div>
        </div>

        <div class="feature">
          <div class="feature-icon">✨</div>
          <div class="feature-title">Text Enhancement</div>
          <div class="feature-desc">Claude AI refines your content</div>
        </div>

        <div class="feature">
          <div class="feature-icon">🎤</div>
          <div class="feature-title">Professional Narration</div>
          <div class="feature-desc">Kokoro & ElevenLabs TTS</div>
        </div>

        <div class="feature">
          <div class="feature-icon">🎵</div>
          <div class="feature-title">Background Music</div>
          <div class="feature-desc">Pixabay & MusicGen</div>
        </div>
      </div>

      <button class="cta">
        <span>🚀</span>
        <span>Get Started Free</span>
      </button>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script>
    // GSAP animations for dynamic effects
    gsap.timeline()
      .to('.feature', {
        duration: 0.6,
        opacity: 1,
        y: 0,
        stagger: 0.1,
        ease: 'back.out'
      }, 0.8)
      .to('.cta', {
        duration: 0.6,
        opacity: 1,
        y: 0,
        ease: 'back.out'
      }, 1);

    // Pulse animation on features
    document.querySelectorAll('.feature').forEach((el, i) => {
      gsap.to(el, {
        duration: 0.5,
        boxShadow: '0 0 20px rgba(99, 102, 241, 0.3)',
        repeat: -1,
        yoyo: true,
        delay: i * 0.1,
        repeatDelay: 3
      });
    });
  </script>
</body>
</html>
